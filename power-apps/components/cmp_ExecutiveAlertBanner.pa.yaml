ComponentDefinitions:
  cmp_ExecutiveAlertBanner:
    DefinitionType: CanvasComponent
    CustomProperties:
      VisibleState:
        PropertyKind: Input
        DataType: Boolean
        Default: =true
      Severity:
        PropertyKind: Input
        DataType: Text
        Default: ="WARNING"
      Title:
        PropertyKind: Input
        DataType: Text
        Default: ="Dashboard warning"
      Message:
        PropertyKind: Input
        DataType: Text
        Default: ="Some dashboard data may be incomplete."
      ActionText:
        PropertyKind: Input
        DataType: Text
        Default: ="Retry"
      ShowAction:
        PropertyKind: Input
        DataType: Boolean
        Default: =true
      ShowDismiss:
        PropertyKind: Input
        DataType: Boolean
        Default: =true
      TextColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#0F172A")
      WarningColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#D97706")
      DangerColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#DC2626")
      InfoColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#1677FF")
      OnAction:
        PropertyKind: Event
        ReturnType: None
        Default: =
      OnDismiss:
        PropertyKind: Event
        ReturnType: None
        Default: =
    Properties:
      Width: =900
      Height: =64
    Children:
      - conEAB_Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =Switch(Upper(cmp_ExecutiveAlertBanner.Severity),"ERROR",cmp_ExecutiveAlertBanner.DangerColor,"WARNING",cmp_ExecutiveAlertBanner.WarningColor,cmp_ExecutiveAlertBanner.InfoColor)
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =Switch(Upper(cmp_ExecutiveAlertBanner.Severity),"ERROR",ColorValue("#FEF2F2"),"WARNING",ColorValue("#FFF7ED"),ColorValue("#EFF6FF"))
            Height: =Parent.Height
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Visible: =cmp_ExecutiveAlertBanner.VisibleState
            Width: =Parent.Width
          Children:
            - icoEAB_Severity:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =Switch(Upper(cmp_ExecutiveAlertBanner.Severity),"ERROR",cmp_ExecutiveAlertBanner.DangerColor,"WARNING",cmp_ExecutiveAlertBanner.WarningColor,cmp_ExecutiveAlertBanner.InfoColor)
                  Height: =22
                  Icon: =If(Upper(cmp_ExecutiveAlertBanner.Severity)="ERROR",Icon.CancelBadge,If(Upper(cmp_ExecutiveAlertBanner.Severity)="WARNING",Icon.Warning,Icon.Information))
                  Width: =22
                  X: =16
                  Y: =21
            - lblEAB_Title:
                Control: ModernText@1.0.0
                Properties:
                  Color: =cmp_ExecutiveAlertBanner.TextColor
                  FontWeight: =FontWeight.Semibold
                  Height: =20
                  Size: =11
                  Text: =cmp_ExecutiveAlertBanner.Title
                  Width: =Parent.Width - 280
                  X: =52
                  Y: =10
            - lblEAB_Message:
                Control: ModernText@1.0.0
                Properties:
                  Color: =cmp_ExecutiveAlertBanner.TextColor
                  Height: =20
                  Size: =9
                  Text: =cmp_ExecutiveAlertBanner.Message
                  Width: =Parent.Width - 280
                  X: =52
                  Y: =34
            - btnEAB_Action:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =0
                  Color: =Color.White
                  Fill: =Switch(Upper(cmp_ExecutiveAlertBanner.Severity),"ERROR",cmp_ExecutiveAlertBanner.DangerColor,"WARNING",cmp_ExecutiveAlertBanner.WarningColor,cmp_ExecutiveAlertBanner.InfoColor)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  HoverFill: =Self.Fill
                  OnSelect: =cmp_ExecutiveAlertBanner.OnAction()
                  PressedFill: =Self.Fill
                  RadiusBottomLeft: =9
                  RadiusBottomRight: =9
                  RadiusTopLeft: =9
                  RadiusTopRight: =9
                  Size: =9
                  Text: =cmp_ExecutiveAlertBanner.ActionText
                  Visible: =cmp_ExecutiveAlertBanner.ShowAction
                  Width: =96
                  X: =Parent.Width - 154
                  Y: =16
            - icoEAB_Dismiss:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =cmp_ExecutiveAlertBanner.TextColor
                  Height: =20
                  Icon: =Icon.Cancel
                  OnSelect: =cmp_ExecutiveAlertBanner.OnDismiss()
                  Visible: =cmp_ExecutiveAlertBanner.ShowDismiss
                  Width: =20
                  X: =Parent.Width - 38
                  Y: =22
