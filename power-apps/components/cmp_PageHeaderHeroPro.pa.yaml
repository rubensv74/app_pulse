ComponentDefinitions:
  cmp_PageHeaderHeroPro:
    DefinitionType: CanvasComponent
    CustomProperties:
      BrandVisible:
        PropertyKind: Input
        DisplayName: BrandVisible
        Description: Displays the approved PULSE mark as a separate Power Apps media image, never baked into a generated hero.
        DataType: Boolean
        Default: =false
      BrandMedia:
        PropertyKind: Input
        DisplayName: BrandMedia
        Description: Approved PULSE image supplied by host, subject to the branding gate.
        DataType: Image
        Default: =Blank()
      HeroEnabled:
        PropertyKind: Input
        DisplayName: HeroEnabled
        Description: Activates 112px branded panoramic mode without changing context and event contracts.
        DataType: Boolean
        Default: =false
      HeroMedia:
        PropertyKind: Input
        DisplayName: HeroMedia
        Description: Image supplied by the host; import it into the Power Apps media library first.
        DataType: Image
        Default: =Blank()
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Page title shown by the header
        DataType: Text
        Default: ="Punch Control Tower"
      Subtitle:
        PropertyKind: Input
        DisplayName: Subtitle
        Description: Page subtitle shown below the title
        DataType: Text
        Default: ="Open punch concentration, discipline distribution and operational drill-through"

      Context1Label:
        PropertyKind: Input
        DisplayName: Context1Label
        Description: Label for the first context slot
        DataType: Text
        Default: ="Project"
      Context1Value:
        PropertyKind: Input
        DisplayName: Context1Value
        Description: Value shown in the first context slot
        DataType: Text
        Default: ="70200 · Project"
      Context1Visible:
        PropertyKind: Input
        DisplayName: Context1Visible
        Description: Show the first context slot
        DataType: Boolean
        Default: =true
      Context1Interactive:
        PropertyKind: Input
        DisplayName: Context1Interactive
        Description: Allow the first context slot to be selected
        DataType: Boolean
        Default: =true
      OnContext1Select:
        PropertyKind: Event
        DisplayName: OnContext1Select
        Description: Raised when the first context slot is selected
        ReturnType: None
        Default: =false

      Context2Label:
        PropertyKind: Input
        DisplayName: Context2Label
        Description: Label for the second context slot
        DataType: Text
        Default: ="Template"
      Context2Value:
        PropertyKind: Input
        DisplayName: Context2Value
        Description: Value shown in the second context slot
        DataType: Text
        Default: ="Master Punch List"
      Context2Visible:
        PropertyKind: Input
        DisplayName: Context2Visible
        Description: Show the second context slot
        DataType: Boolean
        Default: =true
      Context2Interactive:
        PropertyKind: Input
        DisplayName: Context2Interactive
        Description: Allow the second context slot to be selected
        DataType: Boolean
        Default: =true
      OnContext2Select:
        PropertyKind: Event
        DisplayName: OnContext2Select
        Description: Raised when the second context slot is selected
        ReturnType: None
        Default: =false

      Context3Label:
        PropertyKind: Input
        DisplayName: Context3Label
        Description: Label for the third context slot
        DataType: Text
        Default: ="Last refresh"
      Context3Value:
        PropertyKind: Input
        DisplayName: Context3Value
        Description: Value shown in the third context slot
        DataType: Text
        Default: ="07/08/2026 16:00"
      Context3Visible:
        PropertyKind: Input
        DisplayName: Context3Visible
        Description: Show the third context slot
        DataType: Boolean
        Default: =true
      Context3Interactive:
        PropertyKind: Input
        DisplayName: Context3Interactive
        Description: Allow the third context slot to be selected
        DataType: Boolean
        Default: =false
      OnContext3Select:
        PropertyKind: Event
        DisplayName: OnContext3Select
        Description: Raised when the third context slot is selected
        ReturnType: None
        Default: =false

      UtilityText:
        PropertyKind: Input
        DisplayName: UtilityText
        Description: Text shown on the utility action
        DataType: Text
        Default: ="Refresh"
      ShowUtility:
        PropertyKind: Input
        DisplayName: ShowUtility
        Description: Show the utility action
        DataType: Boolean
        Default: =true
      UtilityEnabled:
        PropertyKind: Input
        DisplayName: UtilityEnabled
        Description: Enable the utility action
        DataType: Boolean
        Default: =true
      ShowHelp:
        PropertyKind: Input
        DisplayName: ShowHelp
        Description: Show the help action
        DataType: Boolean
        Default: =true
      OnUtility:
        PropertyKind: Event
        DisplayName: OnUtility
        Description: Raised when the utility action is selected
        ReturnType: None
        Default: =false
      OnHelp:
        PropertyKind: Event
        DisplayName: OnHelp
        Description: Raised when the help action is selected
        ReturnType: None
        Default: =false

      SurfaceColor:
        PropertyKind: Input
        DisplayName: SurfaceColor
        Description: Main header surface color
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      SurfaceAltColor:
        PropertyKind: Input
        DisplayName: SurfaceAltColor
        Description: Alternate surface color used by context slots
        DataType: Color
        Default: =ColorValue("#F8FAFC")
      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        Description: Border and divider color
        DataType: Color
        Default: =ColorValue("#E2E8F0")
      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Primary header text color
        DataType: Color
        Default: =ColorValue("#0F172A")
      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Secondary header text color
        DataType: Color
        Default: =ColorValue("#64748B")
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Selection and interaction accent color
        DataType: Color
        Default: =ColorValue("#1677FF")
      AccentSoftColor:
        PropertyKind: Input
        DisplayName: AccentSoftColor
        Description: Soft accent fill used by utility interactions
        DataType: Color
        Default: =ColorValue("#EFF6FF")
      AccentHoverOverlayColor:
        PropertyKind: Input
        DisplayName: AccentHoverOverlayColor
        Description: Hover overlay color for context hit surfaces
        DataType: Color
        Default: =RGBA(22,119,255,0.06)
      AccentPressedOverlayColor:
        PropertyKind: Input
        DisplayName: AccentPressedOverlayColor
        Description: Pressed overlay color for context hit surfaces
        DataType: Color
        Default: =RGBA(22,119,255,0.10)

    Properties:
      Width: =1200
      Height: =If(cmp_PageHeaderHeroPro.HeroEnabled,112,80)

    Children:
      - conPH_Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =If(cmp_PageHeaderHeroPro.HeroEnabled,ColorValue("#07111F"),cmp_PageHeaderHeroPro.SurfaceColor)
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - imgPHH_HeroMedia:
                Control: Image@2.2.3
                Properties:
                  BorderStyle: =BorderStyle.None
                  Height: =Parent.Height
                  Image: =cmp_PageHeaderHeroPro.HeroMedia
                  ImagePosition: =ImagePosition.Fill
                  Visible: =cmp_PageHeaderHeroPro.HeroEnabled && !IsBlank(cmp_PageHeaderHeroPro.HeroMedia)
                  Width: =Parent.Width
                  X: =0
                  Y: =0
            - recPHH_DarkOverlay:
                Control: Rectangle@2.3.0
                Properties:
                  BorderStyle: =BorderStyle.None
                  Fill: =RGBA(3,13,29,0.38)
                  Height: =Parent.Height
                  Visible: =cmp_PageHeaderHeroPro.HeroEnabled
                  Width: =Parent.Width
                  X: =0
                  Y: =0
            - imgPHH_Brand:
                Control: Image@2.2.3
                Properties:
                  BorderStyle: =BorderStyle.None
                  Height: =64
                  Image: =cmp_PageHeaderHeroPro.BrandMedia
                  ImagePosition: =ImagePosition.Fit
                  Visible: =cmp_PageHeaderHeroPro.HeroEnabled && cmp_PageHeaderHeroPro.BrandVisible && !IsBlank(cmp_PageHeaderHeroPro.BrandMedia)
                  Width: =94
                  X: =16
                  Y: =(Parent.Height-Self.Height)/2
            - conPH_Identity:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =52
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Max(130,conPH_Context1.X-Self.X-16)
                  X: =If(cmp_PageHeaderHeroPro.HeroEnabled && cmp_PageHeaderHeroPro.BrandVisible,122,16)
                  Y: =(Parent.Height-Self.Height)/2
                Children:
                  - lblPH_Title:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =If(cmp_PageHeaderHeroPro.HeroEnabled,Color.White,cmp_PageHeaderHeroPro.TextColor)
                        FontWeight: =FontWeight.Semibold
                        Height: =30
                        Size: =If(cmp_PageHeaderHeroPro.HeroEnabled,24,20)
                        Text: =cmp_PageHeaderHeroPro.Title
                        Width: =Parent.Width
                        Wrap: =false
                        X: =0
                        Y: =0
                  - lblPH_Subtitle:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =If(cmp_PageHeaderHeroPro.HeroEnabled,ColorValue("#D5E8F8"),cmp_PageHeaderHeroPro.MutedTextColor)
                        Height: =20
                        Size: =If(cmp_PageHeaderHeroPro.HeroEnabled,11,10)
                        Text: =cmp_PageHeaderHeroPro.Subtitle
                        Width: =Parent.Width
                        Wrap: =false
                        X: =0
                        Y: =31

            - conPH_Context1:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =cmp_PageHeaderHeroPro.BorderColor
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =cmp_PageHeaderHeroPro.SurfaceAltColor
                  Height: =52
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =cmp_PageHeaderHeroPro.Context1Visible
                  Width: =180
                  X: =conPH_Context2.X-Self.Width-8
                  Y: =(Parent.Height-Self.Height)/2
                Children:
                  - lblPH_Context1Label:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_PageHeaderHeroPro.MutedTextColor
                        Height: =18
                        Size: =8
                        Text: =cmp_PageHeaderHeroPro.Context1Label
                        Width: =Parent.Width-32
                        Wrap: =false
                        X: =12
                        Y: =5
                  - lblPH_Context1Value:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_PageHeaderHeroPro.TextColor
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        Size: =9
                        Text: =cmp_PageHeaderHeroPro.Context1Value
                        Width: =Parent.Width-36
                        Wrap: =false
                        X: =12
                        Y: =24
                  - lblPH_Context1Chevron:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =cmp_PageHeaderHeroPro.AccentColor
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        Size: =14
                        Text: ="›"
                        Visible: =cmp_PageHeaderHeroPro.Context1Interactive
                        Width: =18
                        Wrap: =false
                        X: =Parent.Width-26
                        Y: =23
                  - btnPH_Context1Hit:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =0
                        Color: =Color.Transparent
                        DisabledFill: =Color.Transparent
                        DisplayMode: =If(cmp_PageHeaderHeroPro.Context1Interactive,DisplayMode.Edit,DisplayMode.Disabled)
                        Fill: =Color.Transparent
                        Height: =Parent.Height
                        HoverFill: =cmp_PageHeaderHeroPro.AccentHoverOverlayColor
                        OnSelect: =cmp_PageHeaderHeroPro.OnContext1Select()
                        PressedFill: =cmp_PageHeaderHeroPro.AccentPressedOverlayColor
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: =""
                        Width: =Parent.Width
                        X: =0
                        Y: =0

            - conPH_Context2:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =cmp_PageHeaderHeroPro.BorderColor
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =cmp_PageHeaderHeroPro.SurfaceAltColor
                  Height: =52
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =cmp_PageHeaderHeroPro.Context2Visible
                  Width: =180
                  X: =conPH_Context3.X-Self.Width-8
                  Y: =(Parent.Height-Self.Height)/2
                Children:
                  - lblPH_Context2Label:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_PageHeaderHeroPro.MutedTextColor
                        Height: =18
                        Size: =8
                        Text: =cmp_PageHeaderHeroPro.Context2Label
                        Width: =Parent.Width-32
                        Wrap: =false
                        X: =12
                        Y: =5
                  - lblPH_Context2Value:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_PageHeaderHeroPro.TextColor
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        Size: =9
                        Text: =cmp_PageHeaderHeroPro.Context2Value
                        Width: =Parent.Width-36
                        Wrap: =false
                        X: =12
                        Y: =24
                  - lblPH_Context2Chevron:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =cmp_PageHeaderHeroPro.AccentColor
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        Size: =14
                        Text: ="›"
                        Visible: =cmp_PageHeaderHeroPro.Context2Interactive
                        Width: =18
                        Wrap: =false
                        X: =Parent.Width-26
                        Y: =23
                  - btnPH_Context2Hit:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =0
                        Color: =Color.Transparent
                        DisabledFill: =Color.Transparent
                        DisplayMode: =If(cmp_PageHeaderHeroPro.Context2Interactive,DisplayMode.Edit,DisplayMode.Disabled)
                        Fill: =Color.Transparent
                        Height: =Parent.Height
                        HoverFill: =cmp_PageHeaderHeroPro.AccentHoverOverlayColor
                        OnSelect: =cmp_PageHeaderHeroPro.OnContext2Select()
                        PressedFill: =cmp_PageHeaderHeroPro.AccentPressedOverlayColor
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: =""
                        Width: =Parent.Width
                        X: =0
                        Y: =0

            - conPH_Context3:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =cmp_PageHeaderHeroPro.BorderColor
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =cmp_PageHeaderHeroPro.SurfaceAltColor
                  Height: =52
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =cmp_PageHeaderHeroPro.Context3Visible
                  Width: =180
                  X: =conPH_Actions.X-Self.Width-12
                  Y: =(Parent.Height-Self.Height)/2
                Children:
                  - lblPH_Context3Label:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_PageHeaderHeroPro.MutedTextColor
                        Height: =18
                        Size: =8
                        Text: =cmp_PageHeaderHeroPro.Context3Label
                        Width: =Parent.Width-32
                        Wrap: =false
                        X: =12
                        Y: =5
                  - lblPH_Context3Value:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_PageHeaderHeroPro.TextColor
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        Size: =9
                        Text: =cmp_PageHeaderHeroPro.Context3Value
                        Width: =Parent.Width-36
                        Wrap: =false
                        X: =12
                        Y: =24
                  - lblPH_Context3Chevron:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =cmp_PageHeaderHeroPro.AccentColor
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        Size: =14
                        Text: ="›"
                        Visible: =cmp_PageHeaderHeroPro.Context3Interactive
                        Width: =18
                        Wrap: =false
                        X: =Parent.Width-26
                        Y: =23
                  - btnPH_Context3Hit:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =0
                        Color: =Color.Transparent
                        DisabledFill: =Color.Transparent
                        DisplayMode: =If(cmp_PageHeaderHeroPro.Context3Interactive,DisplayMode.Edit,DisplayMode.Disabled)
                        Fill: =Color.Transparent
                        Height: =Parent.Height
                        HoverFill: =cmp_PageHeaderHeroPro.AccentHoverOverlayColor
                        OnSelect: =cmp_PageHeaderHeroPro.OnContext3Select()
                        PressedFill: =cmp_PageHeaderHeroPro.AccentPressedOverlayColor
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: =""
                        Width: =Parent.Width
                        X: =0
                        Y: =0

            - conPH_Actions:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =36
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =cmp_PageHeaderHeroPro.ShowUtility || cmp_PageHeaderHeroPro.ShowHelp
                  Width: =148
                  X: =Parent.Width-Self.Width-16
                  Y: =(Parent.Height-Self.Height)/2
                Children:
                  - btnPH_Utility:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =cmp_PageHeaderHeroPro.BorderColor
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Color: =cmp_PageHeaderHeroPro.AccentColor
                        DisabledColor: =cmp_PageHeaderHeroPro.MutedTextColor
                        DisabledFill: =cmp_PageHeaderHeroPro.SurfaceAltColor
                        DisplayMode: =If(cmp_PageHeaderHeroPro.UtilityEnabled,DisplayMode.Edit,DisplayMode.Disabled)
                        Fill: =cmp_PageHeaderHeroPro.SurfaceColor
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        HoverFill: =cmp_PageHeaderHeroPro.AccentSoftColor
                        OnSelect: =cmp_PageHeaderHeroPro.OnUtility()
                        PressedFill: =cmp_PageHeaderHeroPro.AccentSoftColor
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =9
                        Text: =cmp_PageHeaderHeroPro.UtilityText
                        Visible: =cmp_PageHeaderHeroPro.ShowUtility
                        Width: =104
                        X: =0
                        Y: =0
                  - btnPH_Help:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =cmp_PageHeaderHeroPro.BorderColor
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Color: =cmp_PageHeaderHeroPro.TextColor
                        Fill: =cmp_PageHeaderHeroPro.SurfaceColor
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        HoverFill: =cmp_PageHeaderHeroPro.AccentSoftColor
                        OnSelect: =cmp_PageHeaderHeroPro.OnHelp()
                        PressedFill: =cmp_PageHeaderHeroPro.AccentSoftColor
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =11
                        Text: ="?"
                        Visible: =cmp_PageHeaderHeroPro.ShowHelp
                        Width: =36
                        X: =If(cmp_PageHeaderHeroPro.ShowUtility,112,0)
                        Y: =0

            - recPH_Divider:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Fill: =cmp_PageHeaderHeroPro.BorderColor
                  Height: =1
                  Width: =Parent.Width
                  X: =0
                  Y: =Parent.Height-1
