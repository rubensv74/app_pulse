ComponentDefinitions:
  cmp_PieChartPro:
    DefinitionType: CanvasComponent
    CustomProperties:
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Selection and interaction accent color
        DataType: Color
        Default: =ColorValue("#1677FF")
      BackgroundColor:
        PropertyKind: Input
        DisplayName: BackgroundColor
        Description: Main component background
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        Description: Component and legend border color
        DataType: Color
        Default: =ColorValue("#E2E8F0")
      ChartBaseColorHex:
        PropertyKind: Input
        DisplayName: ChartBaseColorHex
        Description: CSS color behind the pie slices
        DataType: Text
        Default: ="#F8FAFC"
      ClickedSegment:
        PropertyKind: Output
        DataType: Record
      ClickedSegmentKey:
        PropertyKind: Output
        DataType: Text
      DangerColor:
        PropertyKind: Input
        DisplayName: DangerColor
        Description: Error-state color
        DataType: Color
        Default: =ColorValue("#DC2626")
      DimUnselectedOpacity:
        PropertyKind: Input
        DisplayName: DimUnselectedOpacity
        Description: Opacity applied to non-selected slices when a selection exists
        DataType: Number
        Default: =0.34
      EmptyText:
        PropertyKind: Input
        DisplayName: EmptyText
        Description: Empty-state message
        DataType: Text
        Default: ="No distribution data available."
      EnableSelection:
        PropertyKind: Input
        DisplayName: EnableSelection
        Description: Allow selection from the component legend
        DataType: Boolean
        Default: =true
      ErrorText:
        PropertyKind: Input
        DisplayName: ErrorText
        Description: Error-state message
        DataType: Text
        Default: ="Distribution unavailable."
      ExplodeSelected:
        PropertyKind: Input
        DisplayName: ExplodeSelected
        Description: Slightly separate the selected slice from the pie
        DataType: Boolean
        Default: =true
      FooterLabel:
        PropertyKind: Input
        DisplayName: FooterLabel
        Description: Label displayed under the total when no segment is selected
        DataType: Text
        Default: ="TOTAL"
      HasSelection:
        PropertyKind: Output
        DataType: Boolean
      IsEmpty:
        PropertyKind: Output
        DataType: Boolean
      IsError:
        PropertyKind: Output
        DataType: Boolean
      IsLoading:
        PropertyKind: Output
        DataType: Boolean
      Items:
        PropertyKind: Input
        DisplayName: Items
        Description: Table with SegmentKey, SegmentLabel, SegmentValue, SegmentColor and SegmentOrder
        DataType: Table
        Default: |-
          =Table(
              {
                  SegmentKey: "ELECTRICAL",
                  SegmentLabel: "Electrical",
                  SegmentValue: 5,
                  SegmentColor: "#F97316",
                  SegmentOrder: 1
              },
              {
                  SegmentKey: "PIPING",
                  SegmentLabel: "Piping",
                  SegmentValue: 4,
                  SegmentColor: "#14B8A6",
                  SegmentOrder: 2
              },
              {
                  SegmentKey: "MECHANICAL",
                  SegmentLabel: "Mechanical",
                  SegmentValue: 3,
                  SegmentColor: "#2563EB",
                  SegmentOrder: 3
              }
          )
      LoadingText:
        PropertyKind: Input
        DisplayName: LoadingText
        Description: Loading-state message
        DataType: Text
        Default: ="Loading distribution..."
      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Secondary text color
        DataType: Color
        Default: =ColorValue("#64748B")
      OnClearSelection:
        PropertyKind: Event
        ReturnType: None
        Default: =
      OnSegmentSelect:
        PropertyKind: Event
        ReturnType: None
        Default: =
      PercentageFormat:
        PropertyKind: Input
        DisplayName: PercentageFormat
        Description: Power Fx format used for percentages
        DataType: Text
        Default: ="[$-en-US]0.0%"
      SegmentCount:
        PropertyKind: Output
        DataType: Number
      SelectedKey:
        PropertyKind: Input
        DisplayName: SelectedKey
        Description: Externally controlled selected SegmentKey
        DataType: Text
        Default: =""
      SelectedOffset:
        PropertyKind: Input
        DisplayName: SelectedOffset
        Description: Selected slice displacement in SVG view-box units
        DataType: Number
        Default: =3.5
      SelectedPercentage:
        PropertyKind: Output
        DataType: Number
      SelectedSegment:
        PropertyKind: Output
        DataType: Record
      SelectedSegmentColor:
        PropertyKind: Output
        DataType: Text
      SelectedSegmentKey:
        PropertyKind: Output
        DataType: Text
      SelectedSegmentLabel:
        PropertyKind: Output
        DataType: Text
      SelectedSegmentValue:
        PropertyKind: Output
        DataType: Number
      ShowBorder:
        PropertyKind: Input
        DisplayName: ShowBorder
        Description: Show the component border
        DataType: Boolean
        Default: =true
      ShowFooter:
        PropertyKind: Input
        DisplayName: ShowFooter
        Description: Show the total or selected value under the pie
        DataType: Boolean
        Default: =true
      ShowHeader:
        PropertyKind: Input
        DisplayName: ShowHeader
        Description: Show the component title and subtitle
        DataType: Boolean
        Default: =true
      ShowLegend:
        PropertyKind: Input
        DisplayName: ShowLegend
        Description: Show the optional interactive legend
        DataType: Boolean
        Default: =true
      ShowPercentages:
        PropertyKind: Input
        DisplayName: ShowPercentages
        Description: Show percentages in the legend
        DataType: Boolean
        Default: =true
      ShowValues:
        PropertyKind: Input
        DisplayName: ShowValues
        Description: Show values in the legend
        DataType: Boolean
        Default: =true
      ShowZeroSegments:
        PropertyKind: Input
        DisplayName: ShowZeroSegments
        Description: Include zero-value segments in the legend
        DataType: Boolean
        Default: =false
      SliceSeparatorColorHex:
        PropertyKind: Input
        DisplayName: SliceSeparatorColorHex
        Description: CSS color used between pie slices
        DataType: Text
        Default: ="#FFFFFF"
      SliceSeparatorWidth:
        PropertyKind: Input
        DisplayName: SliceSeparatorWidth
        Description: Separator stroke width in SVG view-box units
        DataType: Number
        Default: =2.2
      StartAngleDegrees:
        PropertyKind: Input
        DisplayName: StartAngleDegrees
        Description: Pie start angle in degrees; -90 starts at twelve o'clock
        DataType: Number
        Default: =-90
      State:
        PropertyKind: Input
        DisplayName: State
        Description: ready, loading, empty or error
        DataType: Text
        Default: ="ready"
      Subtitle:
        PropertyKind: Input
        DisplayName: Subtitle
        Description: Component subtitle
        DataType: Text
        Default: ="Breakdown by category"
      SurfaceAltColor:
        PropertyKind: Input
        DisplayName: SurfaceAltColor
        Description: Alternate surface used by rows and states
        DataType: Color
        Default: =ColorValue("#F8FAFC")
      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Primary text color
        DataType: Color
        Default: =ColorValue("#0F172A")
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Component title
        DataType: Text
        Default: ="Distribution"
      TotalValue:
        PropertyKind: Output
        DataType: Number
      ValueFormat:
        PropertyKind: Input
        DisplayName: ValueFormat
        Description: Power Fx format used for values
        DataType: Text
        Default: ="[$-en-US]#,##0"
      ValueSuffix:
        PropertyKind: Input
        DisplayName: ValueSuffix
        Description: Optional suffix appended to values
        DataType: Text
        Default: =""
    Properties:
      ClickedSegment: =galPCP_Legend_1.Selected
      ClickedSegmentKey: =Coalesce(galPCP_Legend_1.Selected.SegmentKey, "")
      HasSelection: =!IsBlank(cmp_PieChartPro.SelectedSegmentKey)
      Height: =240
      IsEmpty: |-
        =Lower(cmp_PieChartPro.State) = "empty" ||
        CountRows(cmp_PieChartPro.Items) = 0 ||
        cmp_PieChartPro.TotalValue <= 0
      IsError: =Lower(cmp_PieChartPro.State) = "error"
      IsLoading: =Lower(cmp_PieChartPro.State) = "loading"
      SegmentCount: |-
        =CountRows(
            Filter(
                cmp_PieChartPro.Items,
                Coalesce(SegmentValue, 0) > 0
            )
        )
      SelectedPercentage: |-
        =If(
            cmp_PieChartPro.TotalValue <= 0,
            0,
            cmp_PieChartPro.SelectedSegmentValue / cmp_PieChartPro.TotalValue
        )
      SelectedSegment: |-
        =LookUp(
            cmp_PieChartPro.Items,
            Coalesce(SegmentKey, "") = Trim(Coalesce(cmp_PieChartPro.SelectedKey, ""))
        )
      SelectedSegmentColor: |-
        =Coalesce(
            LookUp(
                cmp_PieChartPro.Items,
                Coalesce(SegmentKey, "") = Trim(Coalesce(cmp_PieChartPro.SelectedKey, "")),
                SegmentColor
            ),
            ""
        )
      SelectedSegmentKey: |-
        =Coalesce(
            LookUp(
                cmp_PieChartPro.Items,
                Coalesce(SegmentKey, "") = Trim(Coalesce(cmp_PieChartPro.SelectedKey, "")),
                SegmentKey
            ),
            ""
        )
      SelectedSegmentLabel: |-
        =Coalesce(
            LookUp(
                cmp_PieChartPro.Items,
                Coalesce(SegmentKey, "") = Trim(Coalesce(cmp_PieChartPro.SelectedKey, "")),
                SegmentLabel
            ),
            ""
        )
      SelectedSegmentValue: |-
        =Coalesce(
            LookUp(
                cmp_PieChartPro.Items,
                Coalesce(SegmentKey, "") = Trim(Coalesce(cmp_PieChartPro.SelectedKey, "")),
                SegmentValue
            ),
            0
        )
      TotalValue: |-
        =Sum(
            cmp_PieChartPro.Items,
            Coalesce(SegmentValue, 0)
        )
      Width: =560
    Children:
      - conPCP_Root_1:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =cmp_PieChartPro.BorderColor
            BorderThickness: =If(cmp_PieChartPro.ShowBorder, 1, 0)
            DropShadow: =DropShadow.None
            Fill: =cmp_PieChartPro.BackgroundColor
            Height: =Parent.Height
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            RadiusTopLeft: =14
            RadiusTopRight: =14
            Width: =Parent.Width
          Children:
            - lblPCP_Title_1:
                Control: Label@2.5.1
                Properties:
                  Color: =cmp_PieChartPro.TextColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =cmp_PieChartPro.Title
                  Visible: =cmp_PieChartPro.ShowHeader
                  Width: =Parent.Width - 190
                  X: =16
                  Y: =10
            - lblPCP_Subtitle_1:
                Control: Label@2.5.1
                Properties:
                  Color: =cmp_PieChartPro.MutedTextColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =16
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =8
                  Text: =cmp_PieChartPro.Subtitle
                  Visible: =cmp_PieChartPro.ShowHeader
                  Width: =Parent.Width - 190
                  X: =16
                  Y: =31
            - lblPCP_SelectedContext_1:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =cmp_PieChartPro.MutedTextColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =18
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =8
                  Text: |-
                    =If(
                        cmp_PieChartPro.HasSelection,
                        cmp_PieChartPro.SelectedSegmentLabel &
                        "  ·  " &
                        Text(
                            cmp_PieChartPro.SelectedPercentage,
                            cmp_PieChartPro.PercentageFormat
                        ),
                        Text(
                            cmp_PieChartPro.SegmentCount,
                            "[$-en-US]#,##0"
                        ) & " segments"
                    )
                  Tooltip: |-
                    =If(
                        cmp_PieChartPro.HasSelection,
                        cmp_PieChartPro.SelectedSegmentLabel &
                        " · " &
                        Text(
                            cmp_PieChartPro.SelectedSegmentValue,
                            cmp_PieChartPro.ValueFormat
                        ) &
                        cmp_PieChartPro.ValueSuffix &
                        " · " &
                        Text(
                            cmp_PieChartPro.SelectedPercentage,
                            cmp_PieChartPro.PercentageFormat
                        ),
                        cmp_PieChartPro.FooterLabel
                    )
                  Visible: =cmp_PieChartPro.ShowHeader
                  Width: =145
                  X: =Parent.Width - 177
                  Y: =16
            - icoPCP_ClearSelection_1:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =cmp_PieChartPro.MutedTextColor
                  Height: =15
                  HoverColor: =cmp_PieChartPro.AccentColor
                  Icon: =Icon.Cancel
                  OnSelect: =cmp_PieChartPro.OnClearSelection()
                  PressedColor: =cmp_PieChartPro.AccentColor
                  Visible: =cmp_PieChartPro.ShowHeader && cmp_PieChartPro.HasSelection
                  Width: =15
                  X: =Parent.Width - 24
                  Y: =17
            - imgPCP_Pie_1:
                Control: Image@2.2.3
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderStyle: =BorderStyle.None
                  Fill: =Color.Transparent
                  Height: |-
                    =Parent.Height -
                    If(cmp_PieChartPro.ShowHeader, 48, 6) -
                    If(cmp_PieChartPro.ShowFooter, 38, 8)
                  Image: |-
                    =With(
                        {
                            _positiveItems:
                                SortByColumns(
                                    Filter(
                                        cmp_PieChartPro.Items,
                                        Coalesce(SegmentValue, 0) > 0
                                    ),
                                    "SegmentOrder",
                                    SortOrder.Ascending
                                ),

                            _total:
                                Max(
                                    0.000001,
                                    Sum(
                                        Filter(
                                            cmp_PieChartPro.Items,
                                            Coalesce(SegmentValue, 0) > 0
                                        ),
                                        Coalesce(SegmentValue, 0)
                                    )
                                ),

                            _pieRadius: 33,
                            _pieStrokeWidth: 66,
                            _circumference: 2 * Pi() * 33,
                            _separatorColor:
                                Coalesce(
                                    cmp_PieChartPro.SliceSeparatorColorHex,
                                    "#FFFFFF"
                                )
                        },

                        "data:image/svg+xml;utf8," &
                        EncodeUrl(
                            "<svg viewBox='0 0 160 160' " &
                            "xmlns='http://www.w3.org/2000/svg' " &
                            "preserveAspectRatio='xMidYMid meet'>" &

                            "<circle " &
                            "cx='80' cy='80' r='66' " &
                            "fill='" &
                                _separatorColor &
                            "'/>" &

                            Concat(
                                _positiveItems As PCPSlice,

                                With(
                                    {
                                        _sliceValue:
                                            Coalesce(
                                                PCPSlice.SegmentValue,
                                                0
                                            ),

                                        _sliceColor:
                                            Coalesce(
                                                PCPSlice.SegmentColor,
                                                "#64748B"
                                            ),

                                        _startValue:
                                            Sum(
                                                Filter(
                                                    _positiveItems,
                                                    SegmentOrder <
                                                        PCPSlice.SegmentOrder
                                                ),
                                                Coalesce(
                                                    SegmentValue,
                                                    0
                                                )
                                            ),

                                        _isSelected:
                                            Upper(
                                                Trim(
                                                    Coalesce(
                                                        cmp_PieChartPro.SelectedSegmentKey,
                                                        ""
                                                    )
                                                )
                                            ) =
                                            Upper(
                                                Trim(
                                                    Coalesce(
                                                        PCPSlice.SegmentKey,
                                                        ""
                                                    )
                                                )
                                            )
                                    },

                                    With(
                                        {
                                            _segmentLength:
                                                _circumference *
                                                _sliceValue /
                                                _total,

                                            _startLength:
                                                _circumference *
                                                _startValue /
                                                _total,

                                            _midAngle:
                                                cmp_PieChartPro.StartAngleDegrees +
                                                360 *
                                                (
                                                    _startValue +
                                                    _sliceValue / 2
                                                ) /
                                                _total,

                                            _gapLength:
                                                Min(
                                                    (
                                                        _circumference *
                                                        _sliceValue /
                                                        _total
                                                    ) * 0.35,

                                                    Max(
                                                        0.5,
                                                        cmp_PieChartPro.SliceSeparatorWidth
                                                    )
                                                ),

                                            _opacity:
                                                If(
                                                    cmp_PieChartPro.HasSelection &&
                                                    !_isSelected,

                                                    Max(
                                                        0.08,
                                                        Min(
                                                            1,
                                                            cmp_PieChartPro.DimUnselectedOpacity
                                                        )
                                                    ),

                                                    1
                                                )
                                        },

                                        With(
                                            {
                                                _offsetX:
                                                    If(
                                                        _isSelected &&
                                                        cmp_PieChartPro.ExplodeSelected &&
                                                        CountRows(
                                                            _positiveItems
                                                        ) > 1,

                                                        cmp_PieChartPro.SelectedOffset *
                                                        Cos(
                                                            _midAngle *
                                                            Pi() /
                                                            180
                                                        ),

                                                        0
                                                    ),

                                                _offsetY:
                                                    If(
                                                        _isSelected &&
                                                        cmp_PieChartPro.ExplodeSelected &&
                                                        CountRows(
                                                            _positiveItems
                                                        ) > 1,

                                                        cmp_PieChartPro.SelectedOffset *
                                                        Sin(
                                                            _midAngle *
                                                            Pi() /
                                                            180
                                                        ),

                                                        0
                                                    )
                                            },

                                            "<circle " &
                                            "cx='80' cy='80' " &
                                            "r='" &
                                                Text(
                                                    _pieRadius,
                                                    "[$-en-US]0.000000"
                                                ) &
                                            "' " &
                                            "fill='none' " &
                                            "stroke='" &
                                                _sliceColor &
                                            "' " &
                                            "stroke-width='" &
                                                Text(
                                                    _pieStrokeWidth,
                                                    "[$-en-US]0.000000"
                                                ) &
                                            "' " &
                                            "stroke-linecap='butt' " &
                                            "stroke-dasharray='" &
                                                Text(
                                                    Max(
                                                        0.1,
                                                        _segmentLength -
                                                        _gapLength
                                                    ),
                                                    "[$-en-US]0.000000"
                                                ) &
                                                " " &
                                                Text(
                                                    _circumference,
                                                    "[$-en-US]0.000000"
                                                ) &
                                            "' " &
                                            "stroke-dashoffset='" &
                                                Text(
                                                    -(
                                                        _startLength +
                                                        _gapLength / 2
                                                    ),
                                                    "[$-en-US]0.000000"
                                                ) &
                                            "' " &
                                            "transform='translate(" &
                                                Text(
                                                    _offsetX,
                                                    "[$-en-US]0.000000"
                                                ) &
                                                " " &
                                                Text(
                                                    _offsetY,
                                                    "[$-en-US]0.000000"
                                                ) &
                                            ") rotate(" &
                                                Text(
                                                    cmp_PieChartPro.StartAngleDegrees,
                                                    "[$-en-US]0.000000"
                                                ) &
                                                " 80 80)' " &
                                            "opacity='" &
                                                Text(
                                                    _opacity,
                                                    "[$-en-US]0.00"
                                                ) &
                                            "'/>"
                                        )
                                    )
                                )
                            ) &

                            "<circle " &
                            "cx='80' cy='80' r='66' " &
                            "fill='none' " &
                            "stroke='" &
                                _separatorColor &
                            "' " &
                            "stroke-width='" &
                                Text(
                                    Max(
                                        1,
                                        cmp_PieChartPro.SliceSeparatorWidth
                                    ),
                                    "[$-en-US]0.00"
                                ) &
                            "'/>" &

                            "</svg>"
                        )
                    )
                  Tooltip: |-
                    =If(
                        cmp_PieChartPro.HasSelection,
                        cmp_PieChartPro.SelectedSegmentLabel &
                        " · " &
                        Text(
                            cmp_PieChartPro.SelectedSegmentValue,
                            cmp_PieChartPro.ValueFormat
                        ) &
                        cmp_PieChartPro.ValueSuffix &
                        " · " &
                        Text(
                            cmp_PieChartPro.SelectedPercentage,
                            cmp_PieChartPro.PercentageFormat
                        ),
                        Text(
                            cmp_PieChartPro.TotalValue,
                            cmp_PieChartPro.ValueFormat
                        ) &
                        cmp_PieChartPro.ValueSuffix &
                        " · " &
                        cmp_PieChartPro.FooterLabel
                    )
                  Visible: =!cmp_PieChartPro.IsLoading && !cmp_PieChartPro.IsEmpty && !cmp_PieChartPro.IsError
                  Width: |-
                    =If(
                        cmp_PieChartPro.ShowLegend &&
                        Parent.Width >= 420,
                        Min(220, RoundDown(Parent.Width * 0.42, 0)),
                        Parent.Width - 24
                    )
                  X: =12
                  Y: =If(cmp_PieChartPro.ShowHeader, 48, 6)
            - lblPCP_FooterValue_1:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =cmp_PieChartPro.TextColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =20
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: |-
                    =Text(
                        If(
                            cmp_PieChartPro.HasSelection,
                            cmp_PieChartPro.SelectedSegmentValue,
                            cmp_PieChartPro.TotalValue
                        ),
                        cmp_PieChartPro.ValueFormat
                    ) & cmp_PieChartPro.ValueSuffix
                  Visible: |-
                    =cmp_PieChartPro.ShowFooter &&
                    !cmp_PieChartPro.IsLoading &&
                    !cmp_PieChartPro.IsEmpty &&
                    !cmp_PieChartPro.IsError
                  Width: =imgPCP_Pie_1.Width
                  X: =imgPCP_Pie_1.X
                  Y: =Parent.Height - 36
            - lblPCP_FooterLabel_1:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =cmp_PieChartPro.MutedTextColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =14
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =7
                  Text: |-
                    =Upper(
                        If(
                            cmp_PieChartPro.HasSelection,
                            cmp_PieChartPro.SelectedSegmentLabel,
                            cmp_PieChartPro.FooterLabel
                        )
                    )
                  Visible: |-
                    =cmp_PieChartPro.ShowFooter &&
                    !cmp_PieChartPro.IsLoading &&
                    !cmp_PieChartPro.IsEmpty &&
                    !cmp_PieChartPro.IsError
                  Width: =imgPCP_Pie_1.Width
                  X: =imgPCP_Pie_1.X
                  Y: =Parent.Height - 17
            - galPCP_Legend_1:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Height: =Parent.Height - If(cmp_PieChartPro.ShowHeader, 58, 12)
                  Items: |-
                    =SortByColumns(
                        AddColumns(
                            Filter(
                                cmp_PieChartPro.Items,
                                cmp_PieChartPro.ShowZeroSegments ||
                                Coalesce(SegmentValue, 0) > 0
                            ),
                            PCPPercentage,
                                If(
                                    cmp_PieChartPro.TotalValue <= 0,
                                    0,
                                    Coalesce(SegmentValue, 0) /
                                    cmp_PieChartPro.TotalValue
                                )
                        ),
                        "SegmentOrder",
                        SortOrder.Ascending
                    )
                  OnSelect: =cmp_PieChartPro.OnSegmentSelect()
                  TemplatePadding: =2
                  TemplateSize: =38
                  Visible: |-
                    =cmp_PieChartPro.ShowLegend &&
                    Parent.Width >= 420 &&
                    !cmp_PieChartPro.IsLoading &&
                    !cmp_PieChartPro.IsEmpty &&
                    !cmp_PieChartPro.IsError
                  Width: =Parent.Width - imgPCP_Pie_1.Width - 34
                  X: =imgPCP_Pie_1.X + imgPCP_Pie_1.Width + 10
                  Y: =If(cmp_PieChartPro.ShowHeader, 52, 6)
                Children:
                  - btnPCP_LegendRow_1:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =cmp_PieChartPro.AccentColor
                        BorderThickness: |-
                          =If(
                              cmp_PieChartPro.SelectedSegmentKey =
                              Coalesce(ThisItem.SegmentKey, ""),
                              1,
                              0
                          )
                        Color: =Color.Transparent
                        DisabledBorderColor: =Color.Transparent
                        DisabledFill: =Color.Transparent
                        DisplayMode: |-
                          =If(
                              cmp_PieChartPro.EnableSelection,
                              DisplayMode.Edit,
                              DisplayMode.Disabled
                          )
                        Fill: |-
                          =If(
                              cmp_PieChartPro.SelectedSegmentKey =
                              Coalesce(ThisItem.SegmentKey, ""),
                              ColorFade(cmp_PieChartPro.AccentColor, 0.92),
                              Color.Transparent
                          )
                        FocusedBorderColor: =cmp_PieChartPro.AccentColor
