                                            Coalesce(Value(ThisItem.Segment4Value), 0)
                                    },
                                    If(
                                        _sum <= 0,
                                        Parent.Height,
                                        Parent.Height -
                                        (
                                            Parent.Height *
                                            (
                                                Coalesce(Value(ThisItem.Segment1Value), 0) +
                                                Coalesce(Value(ThisItem.Segment2Value), 0)
                                            ) /
