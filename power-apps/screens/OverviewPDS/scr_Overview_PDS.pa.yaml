# OPDS-C01 — PREMIUM SHELL AND VISUAL STATE SURFACES
#
# Engineering state: CANDIDATE / VISUAL_PREPARED
# Operation: replace the complete Source Code of a new blank screen named scr_Overview_PDS.
# Runtime validation: pending one grouped Power Apps Studio validation.
#
# Internal blocks consolidated in this complete snapshot:
# - S01: independent shell and component hosts;
# - C02: premium Page Header host;
# - S03: local visual-state selector and six mutually exclusive surfaces.
#
# Material dependencies:
# - cmp_SidebarNav already installed in the app;
# - cmp_PageHeaderPro already installed in the app;
# - colSidebarNavItems and the PULSE theme/project variables initialized by App.OnStart.
#
# Deliberate compatibility boundary:
# The two component hosts remain empty in Source Code. Insert cmp_SidebarNav and
# cmp_PageHeaderPro manually in Studio using OPDS-C01_STUDIO_PACKAGE.md. Existing PULSE
# evidence shows that screen-Source-created component instances can fail to hydrate
# their public properties, while manual Studio instances are safe.
#
# Does not call Overview flows, SQL or Power Automate. Does not navigate to or modify
# scr_Overview. Synthetic states are visual candidates only.

