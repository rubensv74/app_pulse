                  - conPR_Body:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =If(App.Width < 1100, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutGap: =10
                        LayoutMinHeight: =400
                        LayoutMinWidth: =300
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - conPR_QueueCard:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =varTheme_Border
                              BorderThickness: =1
                              DropShadow: =DropShadow.Semilight
                              Fill: =varTheme_Surface
                              FillPortions: =0
                              Height: =If(App.Width < 1100, 360, Parent.Height)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =320
                              LayoutMinWidth: =300
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Width: =If(App.Width < 1100, Parent.Width, 330)
                            Children:
                              - btnPR_RebuildQueue:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Height: =1
                                    OnSelect: |-
                                      =
                                      ClearCollect(
                                          colPunchReviewQueueView,
                                          SortByColumns(
                                              Filter(
                                                  colPunchReviewQueue,
                                                  (
                                                      IsBlank(varPunchReviewSearch) ||
                                                      Lower(varPunchReviewSearch) in
                                                          Lower(
                                                              Coalesce(PunchCode, "") & " " &
                                                              Coalesce(Description, "") & " " &
                                                              Coalesce(SubsystemCode, "") & " " &
                                                              Coalesce(Discipline, "")
                                                          )
                                                  ) &&
                                                  Switch(
                                                      Coalesce(varPunchReviewQuickFilter, "ALL"),
                                                      "REMAINING", !IsReviewedInSession,
                                                      "REVIEWED", IsReviewedInSession,
                                                      true
                                                  )
                                              ),
                                              "ReviewOrder",
                                              SortOrder.Ascending
                                          )
                                      )
                                    Text: =""
                                    Visible: =false
                                    Width: =1
                              - btnPR_SelectCurrent:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Height: =1
                                    OnSelect: |-
                                      =// Protect unsaved Custom Field edits before changing the selected Punch.
                                      With(
                                          {
                                              targetIndex:
                                                  Min(
                                                      Max(
                                                          1,
                                                          Coalesce(
                                                              varPunchReviewRequestedIndex,
                                                              varPunchReviewCurrentIndex,
                                                              1
                                                          )
                                                      ),
                                                      Max(1, CountRows(colPunchReviewQueue))
                                                  )
                                          },

                                          If(
                                              varPunchReviewDirty,

                                              If(
                                                  targetIndex <> varPunchReviewCurrentIndex,

                                                  Set(varPunchReviewPendingAction, "CHANGE_CURRENT");
                                                  Set(varPunchReviewPendingIndex, targetIndex);
                                                  Set(varPunchReviewShowDirtyDialog, true),

                                                  Set(
                                                      varPunchReviewRequestedIndex,
                                                      varPunchReviewCurrentIndex
                                                  )
                                              ),

                                              CountRows(colPunchReviewQueue) = 0,

                                              Set(varPunchReviewCurrent, Blank());
                                              Set(varPunchReviewCurrentId, Blank());
                                              Set(varPunchReviewCommentsPage, 1);
                                              Clear(colPunchReviewComments);
                                              Set(varPunchReviewCommentsError, "");
                                              Clear(colPunchReviewFieldsUI);
                                              Clear(colPunchReviewFieldsBase);
                                              Clear(colPunchReviewFieldsDirty);

                                              Reset(cmpPR_CustomFieldValues);

                                              Set(varPunchReviewFieldsError, "");
                                              Set(varPunchReviewDirty, false);
                                              Set(varPunchReviewPendingAction, "");
                                              Set(varPunchReviewPendingIndex, 0);
                                              Set(varPunchReviewShowDirtyDialog, false),

                                              Set(varPunchReviewCurrentIndex, targetIndex);

                                              Set(
                                                  varPunchReviewCurrent,
                                                  LookUp(
                                                      colPunchReviewQueue,
                                                      ReviewOrder = varPunchReviewCurrentIndex
                                                  )
                                              );

                                              Set(
                                                  varPunchReviewCurrentId,
                                                  varPunchReviewCurrent.PunchIdNumber
                                              );

                                              Set(
                                                  varPunchReviewRequestedIndex,
                                                  varPunchReviewCurrentIndex
                                              );

                                              Set(varPunchReviewPendingAction, "");
                                              Set(varPunchReviewPendingIndex, 0);
                                              Set(varPunchReviewShowDirtyDialog, false);

                                              Set(varPunchReviewCommentsPage, 1);
                                              Select(btnPR_LoadComments);
                                              Select(btnPR_LoadCustomFields)
                                          )
                                      )
                                    Text: =""
                                    Visible: =false
                                    Width: =1
