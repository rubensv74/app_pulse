                                          Height: =48
                                          LayoutMinHeight: =48
                                          LayoutMinWidth: =200
                                          RadiusBottomLeft: =9
                                          RadiusBottomRight: =9
                                          RadiusTopLeft: =9
                                          RadiusTopRight: =9
                                          Width: =220
                                        Children:
                                          - lblPR_TemplateLabel:
                                              Control: Label@2.5.1
