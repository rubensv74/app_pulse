                  Fill: =varTheme_PageBg
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutMinHeight: =320
                  LayoutMinWidth: =320
                  PaddingBottom: =10
                  PaddingLeft: =10
                  PaddingRight: =10
                  PaddingTop: =10
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conPR_HeaderCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =varTheme_Border
                        BorderThickness: =1
                        DropShadow: =DropShadow.Semilight
                        Fill: =varTheme_Surface
                        FillPortions: =0
                        Height: =If(App.Width < 1400, 168, 118)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =6
                        LayoutMinHeight: =118
                        LayoutMinWidth: =320
                        PaddingBottom: =10
                        PaddingLeft: =14
                        PaddingRight: =14
                        PaddingTop: =10
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Width: =Parent.Width
                      Children:
                        - conPR_HeaderMain:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =If(App.Width < 1400, 112, 66)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =If(App.Width < 1400, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                              LayoutGap: =8
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              LayoutMinHeight: =66
                              LayoutMinWidth: =300
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                            Children:
                              - conPR_HeaderIdentity:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    Height: =50
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
