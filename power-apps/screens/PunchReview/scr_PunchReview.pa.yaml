                                          LayoutGap: =10
                                          LayoutMinHeight: |-
                                            =If(
                                                App.Width < 1320,
                                                640,
                                                520
                                            )
                                          LayoutMinWidth: =300
                                          Width: =Parent.Width
                                        Children:
                                          - cmpPR_Actions:
                                              Control: CanvasComponent
                                              ComponentName: cmp_ActionToolbarPro
                                              Properties:
                                                AccentColor: =varTheme_PulseBlueDark
                                                Actions: |-
                                                  =Table(
                                                      {
                                                          Key: "MARK_REVIEWED",
                                                          Label: "Mark Reviewed",
                                                          IconText: "✓",
                                                          Tone: "primary",
                                                          IsVisible:
                                                              !IsBlank(varPunchReviewCurrentId) &&
                                                              !Coalesce(varPunchReviewCurrent.IsReviewedInSession, false),
                                                          IsEnabled:
                                                              !varPunchReviewIsLoading &&
                                                              !IsBlank(varPunchReviewCurrentId),
                                                          Order: 1
                                                      },
                                                      {
                                                          Key: "UNMARK_REVIEWED",
                                                          Label: "Undo Review",
                                                          IconText: "↶",
                                                          Tone: "neutral",
                                                          IsVisible:
                                                              !IsBlank(varPunchReviewCurrentId) &&
                                                              Coalesce(varPunchReviewCurrent.IsReviewedInSession, false),
                                                          IsEnabled:
                                                              !varPunchReviewIsLoading &&
                                                              !IsBlank(varPunchReviewCurrentId),
                                                          Order: 1
                                                      },
                                                      {
                                                          Key: "OPEN_PUNCHES",
                                                          Label: "Open Punch List",
                                                          IconText: "↗",
                                                          Tone: "neutral",
                                                          IsVisible: true,
                                                          IsEnabled:
                                                              !varPunchReviewIsLoading &&
                                                              !IsBlank(varPunchReviewCurrentId),
                                                          Order: 2
                                                      },
                                                      {
                                                      Key: "EXPORT",
                                                      Label: "Export",
                                                      IconText: "⇩",
                                                      Tone: "neutral",
                                                      IsVisible: true,
                                                      IsEnabled:
                                                          !varPunchReviewIsLoading &&
                                                          !IsBlank(varProjectId),
                                                      Order: 3
                                                  }
                                                  )
                                                BackgroundColor: =varTheme_Surface
                                                BorderColor: =varTheme_Border
                                                ContextText: |-
                                                  =If(
                                                      IsBlank(varPunchReviewCurrentId),
                                                      "No Punch selected",
                                                      Coalesce(
                                                          varPunchReviewCurrent.PunchCode,
                                                          Text(varPunchReviewCurrentId)
                                                      )
                                                  )
                                                DangerColor: =ColorValue("#EF4444")
                                                Height: =60
                                                IsLoading: =varPunchReviewIsLoading
                                                MutedTextColor: =varTheme_TextMuted
                                                OnAction: |-
                                                  =// Keep review marks session-local and guard navigation with unsaved-field state.
                                                  Switch(
                                                      cmpPR_Actions.SelectedActionKey,

                                                      "EXPORT",
                                                  Set(varPRExportOpen, false);
                                                  Set(varPRExportProfile, "CLIENT");
                                                  Set(varPRExportState, "CONFIGURE");
                                                  Set(varPRExportError, "");
                                                  Set(varPRExportFileUrl, "");
                                                  Set(varPRExportLoading, false);
                                                  Set(varPRExportWorkItemIdsJson, "[]");
                                                  Set(varPRExportScopeCount, 0);
                                                  Set(varPRExportScopeValid, false);
                                                  Set(varPRExportScopeError, "");

                                                  With(
                                                      {
                                                          _queue:
                                                              SortByColumns(
                                                                  Filter(
                                                                      colPunchReviewQueue,
                                                                      Value(PunchIdNumber) > 0
                                                                  ),
                                                                  "ReviewOrder",
                                                                  SortOrder.Ascending
                                                              )
                                                      },

                                                      Set(varPRExportScopeCount, CountRows(_queue));

                                                      If(
                                                          CountRows(_queue) = 0,

                                                          Set(varPRExportScopeError, "The Review Queue does not contain valid Punch identifiers."),

                                                          CountRows(Distinct(_queue, PunchIdNumber)) <> CountRows(_queue),

                                                          Set(varPRExportScopeError, "The Review Queue contains duplicate Punch identifiers."),

                                                          Set(
                                                              varPRExportWorkItemIdsJson,
                                                              JSON(
                                                                  ShowColumns(
                                                                      AddColumns(
                                                                          _queue,
                                                                          WorkItemId,
                                                                          Value(PunchIdNumber)
                                                                      ),
                                                                      WorkItemId
                                                                  ),
                                                                  JSONFormat.Compact
                                                              )
                                                          );

                                                          If(
                                                              CountRows(Table(ParseJSON(varPRExportWorkItemIdsJson))) <> CountRows(_queue),
                                                              Set(varPRExportScopeError, "The Review Queue export scope could not be serialized completely."),
                                                              Set(varPRExportScopeValid, true)
                                                          )
                                                      )
                                                  );

                                                  Set(varPRExportOpen, true),

                                                      "MARK_REVIEWED",

                                                          If(
                                                              IsBlank(varPunchReviewCurrentId),

                                                              Notify(
                                                                  "Select a Punch before marking it as reviewed.",
                                                                  NotificationType.Information
                                                              ),

                                                              With(
                                                                  {
                                                                      currentOrder: varPunchReviewCurrent.ReviewOrder,
                                                                      currentPunchId: varPunchReviewCurrentId,
                                                                      currentPunchCode:
                                                                          Coalesce(
                                                                              varPunchReviewCurrent.PunchCode,
                                                                              Text(varPunchReviewCurrentId)
                                                                          )
                                                                  },

                                                                  Patch(
                                                                      colPunchReviewQueue,
                                                                      LookUp(
                                                                          colPunchReviewQueue,
                                                                          PunchIdNumber = currentPunchId
                                                                      ),
                                                                      {
                                                                          IsReviewedInSession: true,
                                                                          IsDirty: varPunchReviewDirty
                                                                      }
                                                                  );

                                                                  Set(
                                                                      varPunchReviewCurrent,
                                                                      LookUp(
                                                                          colPunchReviewQueue,
                                                                          PunchIdNumber = currentPunchId
                                                                      )
                                                                  );

                                                                  Collect(
                                                                      colPunchReviewSessionEvents,
                                                                      {
                                                                          EventKey: Text(GUID()),
                                                                          PunchIdNumber: currentPunchId,
                                                                          EventLabel:
                                                                              currentPunchCode &
                                                                              " marked as reviewed in this session",
                                                                          EventOn: Now(),
                                                                          EventBy: User().FullName,
                                                                          EventType: "REVIEWED"
                                                                      }
                                                                  );

                                                                  Select(btnPR_RebuildQueue);

                                                                  If(
                                                                      varPunchReviewQuickFilter = "REMAINING" &&
                                                                      CountRows(colPunchReviewQueueView) > 0,

                                                                      Set(
                                                                          varPunchReviewRequestedIndex,
                                                                          Coalesce(
                                                                              Min(
                                                                                  Filter(
                                                                                      colPunchReviewQueueView,
                                                                                      ReviewOrder > currentOrder
                                                                                  ),
                                                                                  ReviewOrder
                                                                              ),
                                                                              Min(
                                                                                  colPunchReviewQueueView,
                                                                                  ReviewOrder
                                                                              )
                                                                          )
                                                                      );

                                                                      Select(btnPR_SelectCurrent),

                                                                      varPunchReviewQuickFilter = "REMAINING" &&
                                                                      CountRows(colPunchReviewQueueView) = 0,

                                                                      Notify(
                                                                          "All punches in the current queue are reviewed.",
                                                                          NotificationType.Success
                                                                      )
                                                                  )
                                                              )
                                                          ),

                                                      "UNMARK_REVIEWED",

                                                          If(
                                                              IsBlank(varPunchReviewCurrentId),

                                                              Notify(
                                                                  "Select a Punch before changing its review state.",
                                                                  NotificationType.Information
                                                              ),

                                                              With(
                                                                  {
                                                                      currentOrder: varPunchReviewCurrent.ReviewOrder,
                                                                      currentPunchId: varPunchReviewCurrentId,
                                                                      currentPunchCode:
                                                                          Coalesce(
                                                                              varPunchReviewCurrent.PunchCode,
                                                                              Text(varPunchReviewCurrentId)
                                                                          )
                                                                  },

                                                                  Patch(
                                                                      colPunchReviewQueue,
                                                                      LookUp(
                                                                          colPunchReviewQueue,
                                                                          PunchIdNumber = currentPunchId
                                                                      ),
                                                                      {
                                                                          IsReviewedInSession: false,
                                                                          IsDirty: varPunchReviewDirty
                                                                      }
                                                                  );

                                                                  Set(
                                                                      varPunchReviewCurrent,
                                                                      LookUp(
                                                                          colPunchReviewQueue,
                                                                          PunchIdNumber = currentPunchId
                                                                      )
                                                                  );

                                                                  Collect(
                                                                      colPunchReviewSessionEvents,
                                                                      {
                                                                          EventKey: Text(GUID()),
                                                                          PunchIdNumber: currentPunchId,
                                                                          EventLabel:
                                                                              currentPunchCode &
                                                                              " review mark removed",
                                                                          EventOn: Now(),
                                                                          EventBy: User().FullName,
                                                                          EventType: "REVIEW_UNDONE"
                                                                      }
                                                                  );

                                                                  Select(btnPR_RebuildQueue);

                                                                  If(
                                                                      varPunchReviewQuickFilter = "REVIEWED" &&
                                                                      CountRows(colPunchReviewQueueView) > 0,

                                                                      Set(
                                                                          varPunchReviewRequestedIndex,
                                                                          Coalesce(
                                                                              Min(
                                                                                  Filter(
                                                                                      colPunchReviewQueueView,
                                                                                      ReviewOrder > currentOrder
                                                                                  ),
                                                                                  ReviewOrder
                                                                              ),
                                                                              Min(
                                                                                  colPunchReviewQueueView,
                                                                                  ReviewOrder
                                                                              )
                                                                          )
                                                                      );

                                                                      Select(btnPR_SelectCurrent),

                                                                      varPunchReviewQuickFilter = "REVIEWED" &&
                                                                      CountRows(colPunchReviewQueueView) = 0,

                                                                      Notify(
                                                                          "There are no reviewed punches in the current queue.",
                                                                          NotificationType.Information
                                                                      )
                                                                  )
                                                              )
                                                          ),

                                                  Set(varPunches_FilterSource, "PunchReview");
                                                  Set(varPunches_ReturnView, "PunchReview");
                                                  Set(varPunches_FocusPunchId, varPunchReviewCurrentId);
                                                  Set(varSelectedTaskId, varPunchReviewCurrentId);
                                                  Set(varDrawerRecordId, varPunchReviewCurrentId);

                                                  ClearCollect(
                                                      colPunchesReviewFocus,
                                                      With(
                                                          {p: varPunchReviewCurrent},
                                                          {
                                                              AreaCode: Coalesce(Text(p.AreaCode), ""),
                                                              UnitCode: Coalesce(Text(p.UnitCode), ""),
                                                              SystemCode: Coalesce(Text(p.SystemCode), ""),
                                                              SubsystemCode: Coalesce(Text(p.SubsystemCode), ""),
                                                              ElementCode: Coalesce(Text(p.ElementCode), ""),
                                                              ElementDiscipline: Coalesce(Text(p.Discipline), ""),
                                                              TypeCode: "",

                                                              ProjectId: varProjectId,
                                                              TemplateId: varPunchReviewTemplateId,

                                                              PunchId: Value(p.PunchIdNumber),
                                                              PunchCode: Coalesce(Text(p.PunchCode), Text(p.PunchIdNumber)),
                                                              PunchDescription: Coalesce(Text(p.Description), ""),

                                                              PunchCoordinator: "",
                                                              Originator: Coalesce(Text(p.Originator), ""),

                                                              CategoryCode: Coalesce(Text(p.Category), ""),
                                                              Category: Coalesce(Text(p.Category), ""),

                                                              PunchDiscipline: Coalesce(Text(p.Discipline), ""),
                                                              StatusCode: Coalesce(Text(p.StatusCode), ""),
                                                              PunchStatus: Coalesce(Text(p.StatusLabel), Text(p.StatusCode), ""),

                                                              InspectionCode: "",
                                                              InspectionName: Coalesce(Text(p.InspectionName), ""),
                                                              InspectionType: "",

                                                              EntryType: "",
                                                              EntryTypeColor: "",
                                                              Topic: "",
                                                              RejectCount: 0,
                                                              ElementCodeMapped: "",

                                                              SubcontractorId: Blank(),
                                                              SubcontractorCode: "",
                                                              SubcontractorName: Coalesce(Text(p.ResponsibleParty), ""),
                                                              SubcontractorShortName: "",
                                                              DepartmentAction: "",

                                                              CustomJson: "{}",
                                                              CustomFlag1: false,
                                                              CustomFlag2: false,
                                                              CustomText1: "",
                                                              CustomText2: "",
                                                              CustomDate1: Blank(),
                                                              CustomNumber1: Blank(),
                                                              CustomLastUpdatedByEmail: "",
                                                              CustomLastUpdatedOn: Blank(),

                                                              LastCommentOn: p.LastCommentOn,
                                                              LastCommentText: "",
                                                              LastCommentByEmail: "",
                                                              CommentCount: Coalesce(Value(p.CommentCount), 0),

                                                              TotalRows: 1,
                                                              TotalPages: 1,
                                                              PageNumber: 1,
                                                              PageSize: 1
                                                          }
                                                      )
                                                  );

                                                  Set(varPunches_Page, 1);
                                                  Set(varPunches_TotalRows, 1);
                                                  Set(varPunches_TotalPages, 1);
                                                  Set(varPunchesLoaded, true);
                                                  Set(varPunches_HasSearched, true);
                                                  Set(varAppView, "Punches");
                                                  Navigate(scr_Punches, ScreenTransition.None)
                                                  )
                                                SecondaryText: |-
                                                  =If(
                                                      CountRows(colPunchReviewQueue) = 0,
                                                      "No active review queue",
                                                      Text(varPunchReviewCurrentIndex) &
                                                      " of " &
                                                      Text(CountRows(colPunchReviewQueue)) &
                                                      " · " &
                                                      Text(
                                                          CountIf(
                                                              colPunchReviewQueue,
                                                              IsReviewedInSession
                                                          )
                                                      ) &
                                                      " reviewed"
                                                  )
                                                ShowContext: =true
                                                SurfaceAltColor: =varTheme_SurfaceAlt
                                                TextColor: =varTheme_Text
                                                Width: =Parent.Width
