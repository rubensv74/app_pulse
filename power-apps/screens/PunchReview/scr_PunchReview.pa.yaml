                                          RadiusTopLeft: =10
                                          RadiusTopRight: =10
                                          Width: =40
                                        Children:
                                          - icoPR_OpenHelp:
                                              Control: Classic/Icon@2.5.0
                                              Properties:
                                                BorderColor: =RGBA(0,0,0,0)
                                                Color: =varTheme_PulseBlueDark
                                                Height: =22
                                                HoverColor: =ColorFade(varTheme_PulseBlueDark, -0.12)
                                                Icon: =Icon.Information
                                                OnSelect: =Set(varPunchReviewHelpVisible, true)
                                                Tooltip: ="Ayuda / Help"
                                                Width: =22
                                                X: =9
                                                Y: =9
