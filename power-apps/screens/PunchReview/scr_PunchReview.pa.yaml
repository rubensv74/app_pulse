                                                - conPR_CustomFieldsHost:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: ManualLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Fill: =Color.Transparent
                                                      LayoutMinHeight: =280
                                                      LayoutMinWidth: =300
                                                      Width: =Parent.Width
                                                      X: =40
                                                      Y: =40
                                                    Children:
                                                      - btnPR_LoadCustomFields:
                                                          Control: Classic/Button@2.2.0
                                                          Properties:
                                                            Height: =1
                                                            OnSelect: |-
                                                              =If(
                                                                  IsBlank(varPunchReviewCurrentId),

                                                                  Clear(colPunchReviewFieldsUI);
                                                                  Clear(colPunchReviewFieldsBase);
                                                                  Clear(colPunchReviewFieldsDirty);
                                                                  Set(varPunchReviewFieldsError, "");
                                                                  Set(varPunchReviewFieldsLoading, false);
                                                                  Set(varPunchReviewDirty, false);
                                                                  UpdateIf(
                                                                      colPunchReviewQueue,
                                                                      PunchIdNumber = varPunchReviewCurrentId,
                                                                      {IsDirty: false}
                                                                  );
                                                                  Reset(cmpPR_CustomFieldValues),

                                                                  IsBlank(varProjectId),

                                                                  Clear(colPunchReviewFieldsUI);
                                                                  Clear(colPunchReviewFieldsBase);
                                                                  Clear(colPunchReviewFieldsDirty);
                                                                  Set(
                                                                      varPunchReviewFieldsError,
                                                                      "No active project is available for loading custom fields."
                                                                  );
                                                                  Set(varPunchReviewFieldsLoading, false);
                                                                  Set(varPunchReviewDirty, false);
                                                                  Reset(cmpPR_CustomFieldValues),

                                                                  Set(varPunchReviewFieldsLoading, true);
                                                                  Set(varPunchReviewFieldsError, "");
                                                                  Set(varPunchReviewDirty, false);
                                                                  Clear(colPunchReviewFieldsDirty);
                                                                  Clear(colPunchReviewFieldsUI);
                                                                  Clear(colPunchReviewFieldsBase);

                                                                  IfError(
                                                                      With(
                                                                          {
                                                                              resp:
                                                                                  WarRoom_GetCustomBundle.Run(
                                                                                      varProjectId,
                                                                                      "PUNCH",
                                                                                      varPunchReviewCurrentId
                                                                                  )
                                                                          },
                                                                          With(
                                                                              {
                                                                                  bundle:
                                                                                      ParseJSON(
                                                                                          Coalesce(
                                                                                              resp.bundlejson,
                                                                                              "{}"
                                                                                          )
                                                                                      )
                                                                              },
                                                                              ClearCollect(
                                                                                  colPunchReviewFieldsUI,
                                                                                  ForAll(
                                                                                      Table(bundle.merged),
                                                                                      With(
                                                                                          {r: ThisRecord.Value},
                                                                                          {
                                                                                              FieldKey:
                                                                                                  Coalesce(Text(r.FieldKey), ""),
                                                                                              FieldLabel:
                                                                                                  Coalesce(Text(r.Label), Text(r.FieldKey), ""),
                                                                                              FieldType:
                                                                                                  Coalesce(Text(r.FieldType), "Text"),
                                                                                              HelpText:
                                                                                                  Coalesce(Text(r.HelpText), ""),
                                                                                              IsRequired:
                                                                                                  Boolean(r.IsRequired),
                                                                                              IsPinned:
                                                                                                  Boolean(r.IsPinned),
                                                                                              IsEditable:
                                                                                                  Lower(Coalesce(varUserRole, "reader")) = "manager",
                                                                                              SortOrder:
                                                                                                  If(
                                                                                                      IsBlank(Text(r.SortOrder)) ||
                                                                                                      Text(r.SortOrder) = "null",
                                                                                                      0,
                                                                                                      Value(Text(r.SortOrder))
                                                                                                  ),
                                                                                              OptionsJson:
                                                                                                  Coalesce(Text(r.OptionsJson), ""),
                                                                                              ValueText:
                                                                                                  Coalesce(Text(r.ValueText), ""),
                                                                                              ValueNumber:
                                                                                                  If(
                                                                                                      IsBlank(Text(r.ValueNumber)) ||
                                                                                                      Text(r.ValueNumber) = "null",
                                                                                                      Blank(),
                                                                                                      Value(Text(r.ValueNumber))
                                                                                                  ),
                                                                                              ValueDate:
                                                                                                  If(
                                                                                                      IsBlank(Text(r.ValueDate)) ||
                                                                                                      Text(r.ValueDate) = "null",
                                                                                                      Blank(),
                                                                                                      DateValue(Text(r.ValueDate))
                                                                                                  ),
                                                                                              ValueBool:
                                                                                                  Boolean(r.ValueBool),
                                                                                              ValueJson:
                                                                                                  Coalesce(Text(r.ValueJson), ""),
                                                                                              LastUpdatedOn:
                                                                                                  If(
                                                                                                      IsBlank(Text(r.LastUpdatedOn)) ||
                                                                                                      Text(r.LastUpdatedOn) = "null",
                                                                                                      Blank(),
                                                                                                      DateTimeValue(Text(r.LastUpdatedOn))
                                                                                                  ),
                                                                                              LastUpdatedByEmail:
                                                                                                  Coalesce(Text(r.LastUpdatedByEmail), "")
                                                                                          }
                                                                                      )
                                                                                  )
                                                                              );

                                                                              ClearCollect(
                                                                                  colPunchReviewFieldsBase,
                                                                                  colPunchReviewFieldsUI
                                                                              )
                                                                          )
                                                                      ),

                                                                      Set(
                                                                          varPunchReviewFieldsError,
                                                                          Coalesce(
                                                                              FirstError.Message,
                                                                              "Custom fields could not be loaded."
                                                                          )
                                                                      );
                                                                      Clear(colPunchReviewFieldsUI);
                                                                      Clear(colPunchReviewFieldsBase)
                                                                  );

                                                                  Clear(colPunchReviewFieldsDirty);
                                                                  Set(varPunchReviewDirty, false);
                                                                  UpdateIf(
                                                                      colPunchReviewQueue,
                                                                      PunchIdNumber = varPunchReviewCurrentId,
                                                                      {IsDirty: false}
                                                                  );
                                                                  Set(varPunchReviewFieldsLoading, false);
                                                                  Reset(cmpPR_CustomFieldValues)
                                                              )
                                                            Text: =""
                                                            Visible: =false
                                                            Width: =1
                                                      - btnPR_SaveCustomFields:
                                                          Control: Classic/Button@2.2.0
                                                          Properties:
                                                            Height: =1
                                                            OnSelect: |-
                                                              =If(
                                                                  IsBlank(varPunchReviewCurrentId),

                                                                  Notify(
                                                                      "Select a Punch before saving custom fields.",
                                                                      NotificationType.Information
                                                                  ),

                                                                  Lower(Coalesce(varUserRole, "reader")) <> "manager",

                                                                  Notify(
                                                                      "Your current role has read-only access to custom fields.",
                                                                      NotificationType.Warning
                                                                  ),

                                                                  CountRows(colPunchReviewFieldsDirty) = 0,

                                                                  Notify(
                                                                      "There are no custom-field changes to save.",
                                                                      NotificationType.Information
                                                                  ),

                                                                  IsBlank(varProjectId),

                                                                  Notify(
                                                                      "No active project is available.",
                                                                      NotificationType.Error
                                                                  ),

                                                                  With(
                                                                      {
                                                                          currentPunchId: varPunchReviewCurrentId,
                                                                          currentPunchCode:
                                                                              Coalesce(
                                                                                  varPunchReviewCurrent.PunchCode,
                                                                                  Text(varPunchReviewCurrentId)
                                                                              ),
                                                                          saveJson:
                                                                              JSON(
                                                                                  colPunchReviewFieldsDirty,
                                                                                  JSONFormat.Compact
                                                                              )
                                                                      },

                                                                      Set(varPunchReviewFieldsSaving, true);
                                                                      Set(varPunchReviewFieldsError, "");

                                                                      IfError(
                                                                          With(
                                                                              {
                                                                                  resp:
                                                                                      WarRoom_SaveCustomBulk.Run(
                                                                                          varProjectId,
                                                                                          "PUNCH",
                                                                                          currentPunchId,
                                                                                          saveJson,
                                                                                          Lower(User().Email)
                                                                                      )
                                                                              },
                                                                              With(
                                                                                  {
                                                                                      saveOuter:
                                                                                          Table(
                                                                                              ParseJSON(
                                                                                                  Coalesce(
                                                                                                      resp.result,
                                                                                                      "[]"
                                                                                                  )
                                                                                              )
                                                                                          )
                                                                                  },
                                                                                  If(
                                                                                      CountRows(saveOuter) = 0,

                                                                                      Set(
                                                                                          varPunchReviewFieldsError,
                                                                                          "Save returned no data."
                                                                                      ),

                                                                                      With(
                                                                                          {
                                                                                              bundle:
                                                                                                  ParseJSON(
                                                                                                      Text(
                                                                                                          First(saveOuter).Value.result
                                                                                                      )
                                                                                                  )
                                                                                          },
                                                                                          ClearCollect(
                                                                                              colPunchReviewFieldsUI,
                                                                                              ForAll(
                                                                                                  Table(bundle.merged),
                                                                                                  With(
                                                                                                      {r: ThisRecord.Value},
                                                                                                      {
                                                                                                          FieldKey:
                                                                                                              Coalesce(Text(r.FieldKey), ""),
                                                                                                          FieldLabel:
                                                                                                              Coalesce(Text(r.Label), Text(r.FieldKey), ""),
                                                                                                          FieldType:
                                                                                                              Coalesce(Text(r.FieldType), "Text"),
                                                                                                          HelpText:
                                                                                                              Coalesce(Text(r.HelpText), ""),
                                                                                                          IsRequired:
                                                                                                              Boolean(r.IsRequired),
                                                                                                          IsPinned:
                                                                                                              Boolean(r.IsPinned),
                                                                                                          IsEditable:
                                                                                                              Lower(Coalesce(varUserRole, "reader")) = "manager",
                                                                                                          SortOrder:
                                                                                                              If(
                                                                                                                  IsBlank(Text(r.SortOrder)) ||
                                                                                                                  Text(r.SortOrder) = "null",
                                                                                                                  0,
                                                                                                                  Value(Text(r.SortOrder))
                                                                                                              ),
                                                                                                          OptionsJson:
                                                                                                              Coalesce(Text(r.OptionsJson), ""),
                                                                                                          ValueText:
                                                                                                              Coalesce(Text(r.ValueText), ""),
                                                                                                          ValueNumber:
                                                                                                              If(
                                                                                                                  IsBlank(Text(r.ValueNumber)) ||
                                                                                                                  Text(r.ValueNumber) = "null",
                                                                                                                  Blank(),
                                                                                                                  Value(Text(r.ValueNumber))
                                                                                                              ),
                                                                                                          ValueDate:
                                                                                                              If(
                                                                                                                  IsBlank(Text(r.ValueDate)) ||
                                                                                                                  Text(r.ValueDate) = "null",
                                                                                                                  Blank(),
                                                                                                                  DateValue(Text(r.ValueDate))
                                                                                                              ),
                                                                                                          ValueBool:
                                                                                                              Boolean(r.ValueBool),
                                                                                                          ValueJson:
                                                                                                              Coalesce(Text(r.ValueJson), ""),
                                                                                                          LastUpdatedOn:
                                                                                                              If(
                                                                                                                  IsBlank(Text(r.LastUpdatedOn)) ||
                                                                                                                  Text(r.LastUpdatedOn) = "null",
                                                                                                                  Blank(),
                                                                                                                  DateTimeValue(Text(r.LastUpdatedOn))
                                                                                                              ),
                                                                                                          LastUpdatedByEmail:
                                                                                                              Coalesce(Text(r.LastUpdatedByEmail), "")
                                                                                                      }
                                                                                                  )
                                                                                              )
                                                                                          );

                                                                                          ClearCollect(
                                                                                              colPunchReviewFieldsBase,
                                                                                              colPunchReviewFieldsUI
                                                                                          );

                                                                                          Clear(colPunchReviewFieldsDirty);
                                                                                          Set(varPunchReviewDirty, false);

                                                                                          UpdateIf(
                                                                                              colPunchReviewQueue,
                                                                                              PunchIdNumber = currentPunchId,
                                                                                              {IsDirty: false}
                                                                                          );

                                                                                          Collect(
                                                                                              colPunchReviewSessionEvents,
                                                                                              {
                                                                                                  EventKey: Text(GUID()),
                                                                                                  PunchIdNumber: currentPunchId,
                                                                                                  EventLabel:
                                                                                                      "Custom fields saved for " &
                                                                                                      currentPunchCode,
                                                                                                  EventOn: Now(),
                                                                                                  EventBy: User().FullName,
                                                                                                  EventType: "CUSTOM_FIELDS_SAVED"
                                                                                              }
                                                                                          );

                                                                                          Reset(cmpPR_CustomFieldValues);

                                                                                          Notify(
                                                                                              "Custom fields saved successfully.",
                                                                                              NotificationType.Success
                                                                                          )
                                                                                      )
                                                                                  )
                                                                              )
                                                                          ),

                                                                          Set(
                                                                              varPunchReviewFieldsError,
                                                                              Coalesce(
                                                                                  FirstError.Message,
                                                                                  "Custom fields could not be saved."
                                                                              )
                                                                          )
                                                                      );

                                                                      Set(varPunchReviewFieldsSaving, false);

                                                                      If(
                                                                          !IsBlank(varPunchReviewFieldsError),
                                                                          Notify(
                                                                              varPunchReviewFieldsError,
                                                                              NotificationType.Error
                                                                          )
                                                                      )
                                                                  )
                                                              )
                                                            Text: =""
                                                            Visible: =false
                                                            Width: =1
                                                      - cmpPR_CustomFieldValues:
                                                          Control: CanvasComponent
                                                          ComponentName: cmp_CustomFieldValuesPro
                                                          Properties:
                                                            AccentColor: =varTheme_PulseBlueDark
                                                            BackgroundColor: =varTheme_Surface
                                                            BorderColor: =varTheme_Border
                                                            CanEdit: =Lower(Coalesce(varUserRole, "reader")) = "manager"
                                                            CanManageFields: =Lower(Coalesce(varUserRole, "reader")) = "manager"
                                                            DangerColor: =ColorValue("#EF4444")
                                                            ErrorText: =Coalesce(varPunchReviewFieldsError, "")
                                                            Height: =Parent.Height
                                                            IsLoading: =varPunchReviewFieldsLoading
                                                            IsSaving: =varPunchReviewFieldsSaving
                                                            Items: =colPunchReviewFieldsUI
                                                            MutedTextColor: =varTheme_TextMuted
                                                            OnCancelRequested: |-
                                                              =ClearCollect(
                                                                  colPunchReviewFieldsUI,
                                                                  cmpPR_CustomFieldValues.EditedItems
                                                              );
                                                              Clear(colPunchReviewFieldsDirty);
                                                              Set(varPunchReviewDirty, false);
                                                              Set(varPunchReviewFieldsError, "");
                                                              UpdateIf(
                                                                  colPunchReviewQueue,
                                                                  PunchIdNumber = varPunchReviewCurrentId,
                                                                  {IsDirty: false}
                                                              )
                                                            OnManageFieldsRequested: |-
                                                              =

                                                              If(
                                                                  IsBlank(varProjectId),
                                                                  Notify(
                                                                      "Selecciona un proyecto antes de administrar Custom Fields.",
                                                                      NotificationType.Error
                                                                  ),
                                                                  Lower(Coalesce(varUserRole, "reader")) <> "manager",
                                                                  Notify(
                                                                      "No tienes permisos para administrar las definiciones de Custom Fields.",
                                                                      NotificationType.Error
                                                                  ),
                                                                  varPunchReviewDirty,
                                                                  Notify(
                                                                      "Guarda los cambios de Custom Fields antes de administrar sus definiciones.",
                                                                      NotificationType.Warning
                                                                  ),
                                                                  Set(varPunchReviewFieldDefsModalVisible, true);
                                                                  Select(btnPR_LoadCustomFieldDefs)
                                                              )
                                                            OnRefresh: |-
                                                              =If(
                                                                  varPunchReviewDirty,
                                                                  Notify(
                                                                      "Guarda o descarta los cambios de Custom Fields antes de actualizar.",
                                                                      NotificationType.Warning
                                                                  ),
                                                                  Select(btnPR_LoadCustomFields)
                                                              )
                                                            OnSaveRequested: |-
                                                              =ClearCollect(
                                                                  colPunchReviewFieldsUI,
                                                                  cmpPR_CustomFieldValues.EditedItems
                                                              );
                                                              ClearCollect(
                                                                  colPunchReviewFieldsDirty,
                                                                  cmpPR_CustomFieldValues.DirtyItems
                                                              );
                                                              Set(
                                                                  varPunchReviewDirty,
                                                                  cmpPR_CustomFieldValues.IsDirty
                                                              );
                                                              UpdateIf(
                                                                  colPunchReviewQueue,
                                                                  PunchIdNumber = varPunchReviewCurrentId,
                                                                  {IsDirty: varPunchReviewDirty}
                                                              );
                                                              Select(btnPR_SaveCustomFields)
                                                            OnValueChanged: |-
                                                              =ClearCollect(
                                                                  colPunchReviewFieldsUI,
                                                                  cmpPR_CustomFieldValues.EditedItems
                                                              );
                                                              ClearCollect(
                                                                  colPunchReviewFieldsDirty,
                                                                  cmpPR_CustomFieldValues.DirtyItems
                                                              );
                                                              Set(
                                                                  varPunchReviewDirty,
                                                                  cmpPR_CustomFieldValues.IsDirty
                                                              );
                                                              UpdateIf(
                                                                  colPunchReviewQueue,
                                                                  PunchIdNumber = varPunchReviewCurrentId,
                                                                  {IsDirty: varPunchReviewDirty}
                                                              )
                                                            RecordLabel: |-
                                                              =If(
                                                                  IsBlank(varPunchReviewCurrentId),
                                                                  "No Punch selected",
                                                                  Coalesce(
                                                                      varPunchReviewCurrent.PunchCode,
                                                                      Text(varPunchReviewCurrentId)
                                                                  )
                                                              )
                                                            ShowFooter: =true
                                                            State: |-
                                                              =If(
                                                                  !IsBlank(varPunchReviewFieldsError),
                                                                  "ERROR",
                                                                  CountRows(colPunchReviewFieldsUI) = 0,
                                                                  "EMPTY",
                                                                  "READY"
                                                              )
                                                            SuccessColor: =ColorValue("#22C55E")
                                                            SurfaceAltColor: =varTheme_SurfaceAlt
                                                            TextColor: =varTheme_Text
                                                            Title: ="Custom Fields"
                                                            WarningColor: =ColorValue("#F59E0B")
                                                            Width: =Parent.Width
                                                      - btnPR_LoadCustomFieldDefs:
                                                          Control: Classic/Button@2.2.0
                                                          Properties:
                                                            Height: =1
                                                            OnSelect: |-
                                                              =Set(varPunchReviewFieldDefsLoading, true);
                                                              Set(varPunchReviewFieldDefsError, "");
                                                              Clear(colPunchReviewFieldDefsAdminNext);

                                                              If(
                                                                  IsBlank(varProjectId),

                                                                  Set(
                                                                      varPunchReviewFieldDefsError,
                                                                      "No active project is available for loading Custom Field definitions."
                                                                  ),

                                                                  IfError(
                                                                      With(
                                                                          {
                                                                              resp:
                                                                                  WarRoom_ListCustomFieldDefs.Run(
                                                                                      varProjectId,
                                                                                      "PUNCH",
                                                                                      1
                                                                                  )
                                                                          },
                                                                          With(
                                                                              {
                                                                                  outer:
                                                                                      Table(
                                                                                          ParseJSON(
                                                                                              Coalesce(
                                                                                                  resp.result,
                                                                                                  "[]"
                                                                                              )
                                                                                          )
                                                                                      )
                                                                              },
                                                                              If(
                                                                                  CountRows(outer) = 0,

                                                                                  Set(
                                                                                      varPunchReviewFieldDefsError,
                                                                                      "The definition service returned no data."
                                                                                  ),

                                                                                  With(
                                                                                      {
                                                                                          bundle:
                                                                                              ParseJSON(
                                                                                                  Text(
                                                                                                      First(outer).Value.result
                                                                                                  )
                                                                                              )
                                                                                      },

                                                                                      ClearCollect(
                                                                                          colPunchReviewFieldDefsAdminNext,
                                                                                          ForAll(
                                                                                              Table(bundle.defs),
                                                                                              With(
                                                                                                  {r: ThisRecord.Value},
                                                                                                  {
                                                                                                      FieldDefId:
                                                                                                          If(
                                                                                                              IsBlank(Text(r.FieldDefId)) ||
                                                                                                              Text(r.FieldDefId) = "null",
                                                                                                              0,
                                                                                                              Value(Text(r.FieldDefId))
                                                                                                          ),
                                                                                                      ProjectId:
                                                                                                          If(
                                                                                                              IsBlank(Text(r.ProjectId)) ||
                                                                                                              Text(r.ProjectId) = "null",
                                                                                                              Value(varProjectId),
                                                                                                              Value(Text(r.ProjectId))
                                                                                                          ),
                                                                                                      EntityType:
                                                                                                          Coalesce(Text(r.EntityType), "PUNCH"),
                                                                                                      FieldKey:
                                                                                                          Coalesce(Text(r.FieldKey), ""),
                                                                                                      Label:
                                                                                                          Coalesce(Text(r.Label), Text(r.FieldKey), ""),
                                                                                                      FieldType:
                                                                                                          Coalesce(Text(r.FieldType), "Text"),
                                                                                                      HelpText:
                                                                                                          Coalesce(Text(r.HelpText), ""),
                                                                                                      IsRequired:
                                                                                                          Boolean(r.IsRequired),
                                                                                                      IsPinned:
                                                                                                          Boolean(r.IsPinned),
                                                                                                      IsActive:
                                                                                                          Boolean(r.IsActive),
                                                                                                      SortOrder:
                                                                                                          If(
                                                                                                              IsBlank(Text(r.SortOrder)) ||
                                                                                                              Text(r.SortOrder) = "null",
                                                                                                              1000,
                                                                                                              Value(Text(r.SortOrder))
                                                                                                          ),
                                                                                                      OptionsJson:
                                                                                                          Coalesce(Text(r.OptionsJson), "[]"),
                                                                                                      IsFilterable:
                                                                                                          Boolean(r.IsFilterable),
                                                                                                      ShowInQuickFilters:
                                                                                                          Boolean(r.ShowInQuickFilters),
                                                                                                      FilterOrder:
                                                                                                          If(
                                                                                                              IsBlank(Text(r.FilterOrder)) ||
                                                                                                              Text(r.FilterOrder) = "null",
                                                                                                              If(
                                                                                                                  IsBlank(Text(r.SortOrder)) ||
                                                                                                                  Text(r.SortOrder) = "null",
                                                                                                                  1000,
                                                                                                                  Value(Text(r.SortOrder))
                                                                                                              ),
                                                                                                              Value(Text(r.FilterOrder))
                                                                                                          ),
                                                                                                      FilterMode:
                                                                                                          Coalesce(Text(r.FilterMode), "Equals")
                                                                                                  }
                                                                                              )
                                                                                          )
                                                                                      );

                                                                                      ClearCollect(
                                                                                          colPunchReviewFieldDefsAdmin,
                                                                                          colPunchReviewFieldDefsAdminNext
                                                                                      )
                                                                                  )
                                                                              )
                                                                          )
                                                                      ),

                                                                      Set(
                                                                          varPunchReviewFieldDefsError,
                                                                          Coalesce(
                                                                              FirstError.Message,
                                                                              "Custom Field definitions could not be loaded."
                                                                          )
                                                                      )
                                                                  )
                                                              );

                                                              Clear(colPunchReviewFieldDefsAdminNext);
                                                              Set(varPunchReviewFieldDefsLoading, false)
                                                            Text: =""
                                                            Visible: =false
                                                            Width: =1
                                                      - btnPR_SaveCustomFieldDef:
                                                          Control: Classic/Button@2.2.0
                                                          Properties:
                                                            Height: =1
                                                            OnSelect: |-
                                                              =Set(varPunchReviewFieldDefsSaving, true);
                                                              Set(varPunchReviewFieldDefsError, "");

                                                              Set(varPunchReviewFieldDefsLastMutationSucceeded, false);
                                                              Set(varPunchReviewFieldDefsRefreshWarning, "");

                                                              If(
                                                                  IsBlank(varProjectId),

                                                                  Set(
                                                                      varPunchReviewFieldDefsError,
                                                                      "No active project is available for saving Custom Field definitions."
                                                                  ),

                                                                  Lower(Coalesce(varUserRole, "reader")) <> "manager",

                                                                  Set(
                                                                      varPunchReviewFieldDefsError,
                                                                      "Your current role does not allow Custom Field definition management."
                                                                  ),

                                                                  IsBlank(Trim(Coalesce(varPunchReviewDef_Label, ""))),

                                                                  Set(
                                                                      varPunchReviewFieldDefsError,
                                                                      "Field label is required."
                                                                  ),

                                                                  IsBlank(Trim(Coalesce(varPunchReviewDef_FieldKey, ""))),

                                                                  Set(
                                                                      varPunchReviewFieldDefsError,
                                                                      "Field key is required."
                                                                  ),

                                                                  !IsBlank(
                                                                      LookUp(
                                                                          colPunchReviewFieldDefsAdmin,
                                                                          Lower(Trim(FieldKey)) = Lower(Trim(varPunchReviewDef_FieldKey)) &&
                                                                          FieldDefId <> Coalesce(varPunchReviewDef_FieldDefId, 0)
                                                                      )
                                                                  ),

                                                                  Set(
                                                                      varPunchReviewFieldDefsError,
                                                                      "This Field Key already exists. Use another key or edit the existing field."
                                                                  ),

                                                                  Value(Coalesce(varPunchReviewDef_SortOrder, 0)) <= 0,

                                                                  Set(
                                                                      varPunchReviewFieldDefsError,
                                                                      "Sort order must be greater than zero."
                                                                  ),

                                                                  (
                                                                      varPunchReviewDef_FieldType = "Choice" ||
                                                                      varPunchReviewDef_FieldType = "MultiChoice"
                                                                  ) &&
                                                                  IfError(
                                                                      CountRows(
                                                                          Table(
                                                                              ParseJSON(
                                                                                  Coalesce(varPunchReviewDef_OptionsJson, "[]")
                                                                              )
                                                                          )
                                                                      ) = 0,
                                                                      true
                                                                  ),

                                                                  Set(
                                                                      varPunchReviewFieldDefsError,
                                                                      "Choice and MultiChoice fields require at least one valid option."
                                                                  ),

                                                                  IfError(
                                                                      With(
                                                                          {
                                                                              resp:
                                                                                  WarRoom_UpsertCustomFieldDef.Run(
                                                                                      Coalesce(varPunchReviewDef_FieldDefId, 0),
                                                                                      varProjectId,
                                                                                      "PUNCH",
                                                                                      Trim(varPunchReviewDef_Label),
                                                                                      Coalesce(varPunchReviewDef_FieldType, "Text"),
                                                                                      Trim(Coalesce(varPunchReviewDef_HelpText, "")),
                                                                                      Value(varPunchReviewDef_SortOrder),
                                                                                      If(
                                                                                          varPunchReviewDef_FieldType = "Choice" ||
                                                                                          varPunchReviewDef_FieldType = "MultiChoice",
                                                                                          Coalesce(varPunchReviewDef_OptionsJson, "[]"),
                                                                                          " "
                                                                                      ),
                                                                                      Lower(User().Email),
                                                                                      Lower(Trim(varPunchReviewDef_FieldKey)),
                                                                                      Coalesce(varPunchReviewDef_IsRequired, false),
                                                                                      Coalesce(varPunchReviewDef_IsPinned, false),
                                                                                      Coalesce(varPunchReviewDef_IsActive, true),
                                                                                      Coalesce(varPunchReviewDef_IsFilterable, false),
                                                                                      Coalesce(varPunchReviewDef_ShowInQuickFilters, false),
                                                                                      Coalesce(
                                                                                          varPunchReviewDef_FilterOrder,
                                                                                          varPunchReviewDef_SortOrder,
                                                                                          1000
                                                                                      ),
                                                                                      Coalesce(varPunchReviewDef_FilterMode, "Equals")
                                                                                  )
                                                                          },

                                                              Set(varPunchReviewFieldDefsLastMutationSucceeded, true);
                                                              Select(btnPR_RefreshCustomFieldDefinitionContext);
                                                              Set(varPunchReviewDefDirty, false);

                                                              Notify(
                                                                  "Custom Field definition saved successfully.",
                                                                  NotificationType.Success
                                                              );

                                                              If(
                                                                  !IsBlank(varPunchReviewFieldDefsRefreshWarning),
                                                                  Notify(
                                                                      varPunchReviewFieldDefsRefreshWarning,
                                                                      NotificationType.Warning
                                                                  )
                                                              )
                                                                      ),

                                                                      Set(
                                                                          varPunchReviewFieldDefsError,
                                                                          Coalesce(
                                                                              FirstError.Message,
                                                                              "Custom Field definition could not be saved."
                                                                          )
                                                                      )
                                                                  )
                                                              );

                                                              Set(varPunchReviewFieldDefsSaving, false);

                                                              If(
                                                                  !IsBlank(varPunchReviewFieldDefsError),
                                                                  Notify(
                                                                      varPunchReviewFieldDefsError,
                                                                      NotificationType.Error
                                                                  )
                                                              )
                                                            Text: =""
                                                            Visible: =false
                                                            Width: =1
                                                      - btnPR_SetCustomFieldActive:
                                                          Control: Classic/Button@2.2.0
                                                          Properties:
                                                            Height: =1
                                                            OnSelect: |-
                                                              =Set(varPunchReviewFieldDefToggleLoading, true);
                                                              Set(varPunchReviewFieldDefToggleError, "");
                                                              Set(varPunchReviewFieldDefsLastMutationSucceeded, false);
                                                              Set(varPunchReviewFieldDefsRefreshWarning, "");
                                                              Set(varPunchReviewFieldDefMutationCallSucceeded, false);

                                                              If(
                                                                  IsBlank(varProjectId),

                                                                  Set(
                                                                      varPunchReviewFieldDefToggleError,
                                                                      "No active project is available for changing Custom Field definition status."
                                                                  ),

                                                                  Lower(Coalesce(varUserRole, "reader")) <> "manager",

                                                                  Set(
                                                                      varPunchReviewFieldDefToggleError,
                                                                      "Your current role does not allow Custom Field definition management."
                                                                  ),

                                                                  IsBlank(Trim(Coalesce(varPunchReviewFieldDefToggleKey, ""))),

                                                                  Set(
                                                                      varPunchReviewFieldDefToggleError,
                                                                      "Field key is required for changing definition status."
                                                                  ),

                                                                  With(
                                                                      {
                                                                          requestedKey:
                                                                              Lower(Trim(varPunchReviewFieldDefToggleKey))
                                                                      },

                                                                      If(
                                                                          IsBlank(
                                                                              LookUp(
                                                                                  colPunchReviewFieldDefsAdmin,
                                                                                  Lower(Trim(FieldKey)) = requestedKey
                                                                              )
                                                                          ),
                                                                          Select(btnPR_LoadCustomFieldDefs)
                                                                      );

                                                                      If(
                                                                          !IsBlank(varPunchReviewFieldDefsError),

                                                                          Set(
                                                                              varPunchReviewFieldDefToggleError,
                                                                              "The Custom Field catalog could not be refreshed: " &
                                                                              varPunchReviewFieldDefsError
                                                                          ),

                                                                          IsBlank(
                                                                              LookUp(
                                                                                  colPunchReviewFieldDefsAdmin,
                                                                                  Lower(Trim(FieldKey)) = requestedKey
                                                                              )
                                                                          ),

                                                                          Set(
                                                                              varPunchReviewFieldDefToggleError,
                                                                              "The selected Custom Field definition is not present in the loaded catalog after refresh."
                                                                          ),

                                                                          Coalesce(
                                                                              LookUp(
                                                                                  colPunchReviewFieldDefsAdmin,
                                                                                  Lower(Trim(FieldKey)) = requestedKey,
                                                                                  IsActive
                                                                              ),
                                                                              false
                                                                          ) = Coalesce(varPunchReviewFieldDefToggleActive, false),

                                                                          Notify(
                                                                              If(
                                                                                  Coalesce(varPunchReviewFieldDefToggleActive, false),
                                                                                  "Custom Field definition is already active.",
                                                                                  "Custom Field definition is already inactive."
                                                                              ),
                                                                              NotificationType.Information
                                                                          ),

                                                                          IfError(
                                                                              With(
                                                                                  {
                                                                                      resp:
                                                                                          WarRoom_SetCustomFieldActive.Run(
                                                                                              varProjectId,
                                                                                              "PUNCH",
                                                                                              Trim(varPunchReviewFieldDefToggleKey),
                                                                                              Coalesce(varPunchReviewFieldDefToggleActive, false),
                                                                                              Lower(User().Email)
                                                                                          )
                                                                                  },
                                                                                  Set(varPunchReviewFieldDefMutationCallSucceeded, true)
                                                                              ),
                                                                              Set(
                                                                                  varPunchReviewFieldDefToggleError,
                                                                                  Coalesce(
                                                                                      FirstError.Message,
                                                                                      "Custom Field definition status could not be changed."
                                                                                  )
                                                                              )
                                                                          );

                                                                          If(
                                                                              varPunchReviewFieldDefMutationCallSucceeded,

                                                                              Set(varPunchDynamicFilters_NeedRefresh, true);

                                                                              If(
                                                                                  Lower(Trim(Coalesce(varPunchReviewDef_FieldKey, ""))) = requestedKey,
                                                                                  Set(
                                                                                      varPunchReviewDef_IsActive,
                                                                                      Coalesce(varPunchReviewFieldDefToggleActive, false)
                                                                                  )
                                                                              );

                                                                              Set(varPunchReviewFieldDefsLastMutationSucceeded, true);

                                                                              Select(btnPR_RefreshCustomFieldDefinitionContext);

                                                                              Notify(
                                                                                  If(
                                                                                      Coalesce(varPunchReviewFieldDefToggleActive, false),
                                                                                      "Custom Field definition activated successfully.",
                                                                                      "Custom Field definition deactivated successfully."
                                                                                  ),
                                                                                  NotificationType.Success
                                                                              );

                                                                              If(
                                                                                  !IsBlank(varPunchReviewFieldDefsRefreshWarning),
                                                                                  Notify(
                                                                                      varPunchReviewFieldDefsRefreshWarning,
                                                                                      NotificationType.Warning
                                                                                  )
                                                                              )
                                                                          )
                                                                      )
                                                                  )
                                                              );

                                                              Set(varPunchReviewFieldDefToggleLoading, false);

                                                              If(
                                                                  !IsBlank(varPunchReviewFieldDefToggleError),
                                                                  Notify(
                                                                      varPunchReviewFieldDefToggleError,
                                                                      NotificationType.Error
                                                                  )
                                                              )
                                                            Text: =""
                                                            Visible: =false
                                                            Width: =1
                                                      - btnPR_RefreshCustomFieldDefinitionContext:
                                                          Control: Classic/Button@2.2.0
                                                          Properties:
                                                            Height: =1
                                                            OnSelect: |-
                                                              =Set(varPunchReviewFieldDefsRefreshWarning, "");
                                                              Set(varPunchDynamicFilters_NeedRefresh, true);

                                                              Select(btnPR_LoadCustomFieldDefs);

                                                              If(
                                                                  !IsBlank(varPunchReviewFieldDefsError),
                                                                  Set(
                                                                      varPunchReviewFieldDefsRefreshWarning,
                                                                      "The definition change was saved, but the definition catalog could not be refreshed: " &
