      - conPR_CustomFieldsEditorModalLayer:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            Visible: =Coalesce(varPunchReviewFieldDefsModalVisible, false)
            Width: =Parent.Width
          Children:
            - rectPR_CustomFieldsEditorBackdrop:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderStyle: =BorderStyle.None
                  Fill: =RGBA(15,23,42,0.58)
                  Height: =Parent.Height
                  Width: =Parent.Width
            - cmpPR_CustomFieldsEditor:
                Control: CanvasComponent
                ComponentName: cmp_CustomFieldsEditorPro
                Properties:
                  AccentColor: =varTheme_PulseBlueDark
                  ActiveMutationSucceeded: |-
                    =Coalesce(varPunchReviewFieldDefsLastMutationSucceeded, false) &&
                    IsBlank(Coalesce(varPunchReviewFieldDefToggleError, ""))
                  BackgroundColor: =varTheme_Surface
                  BorderColor: =varTheme_Border
                  CanManage: =Lower(Coalesce(varUserRole, "reader")) = "manager"
                  DangerColor: =ColorValue("#DC2626")
                  Definitions: =colPunchReviewFieldDefsAdmin
                  EntityType: ="PUNCH"
                  ErrorText: |-
                    =If(
                        !IsBlank(Coalesce(varPunchReviewFieldDefsError, "")),
                        varPunchReviewFieldDefsError,
                        If(
                            !IsBlank(Coalesce(varPunchReviewFieldDefToggleError, "")),
                            varPunchReviewFieldDefToggleError,
                            ""
                        )
                    )
                  Height: =Min(700, Parent.Height - 48)
                  IsLoading: =Coalesce(varPunchReviewFieldDefsLoading, false)
                  IsSaving: |-
                    =Coalesce(varPunchReviewFieldDefsSaving, false) ||
                    Coalesce(varPunchReviewFieldDefToggleLoading, false)
                  MutedTextColor: =varTheme_TextMuted
                  OnActiveChangeRequested: |-
                    =Set(varPunchReviewFieldDefsLastMutationSucceeded, false);
                    Set(varPunchReviewFieldDefToggleError, "");

                    With(
                        {
                            draft:
                                First(cmpPR_CustomFieldsEditor.DraftDefinition)
                        },

                        Set(
                            varPunchReviewFieldDefToggleKey,
                            Trim(Coalesce(draft.FieldKey, ""))
                        );

                        Set(
                            varPunchReviewFieldDefToggleActive,
                            Coalesce(draft.IsActive, false)
                        )
                    );

                    Select(btnPR_SetCustomFieldActive)
                  OnAddRequested: =
                  OnCancelRequested: =
                  OnClose: |-
                    =With(
                        {
                            hasUnsavedDefinitionDraft:
                                Coalesce(cmpPR_CustomFieldsEditor.DraftDirty, false) &&
                                (
                                    cmpPR_CustomFieldsEditor.EditMode = "ADD" ||
                                    (
                                        cmpPR_CustomFieldsEditor.EditMode = "EDIT" &&
                                        !IsBlank(
                                            Trim(
                                                Coalesce(
                                                    First(cmpPR_CustomFieldsEditor.DraftDefinition).FieldKey,
                                                    ""
                                                )
                                            )
                                        )
                                    )
                                )
                        },
                        If(
                            hasUnsavedDefinitionDraft,
                            Notify(
                                "Hay cambios sin guardar. Guarda o cancela el borrador antes de cerrar.",
                                NotificationType.Warning
                            ),
                            Set(varPunchReviewFieldDefsModalVisible, false)
                        )
                    )
                  OnRefresh: |-
                    =If(
                        Coalesce(cmpPR_CustomFieldsEditor.DraftDirty, false),

                        Notify(
                            "Guarda o cancela los cambios antes de actualizar las definiciones.",
                            NotificationType.Warning
                        ),

                        Set(varPunchReviewFieldDefToggleError, "");
                        Set(varPunchReviewFieldDefsError, "");
                        Select(btnPR_LoadCustomFieldDefs)
                    )
                  OnSaveRequested: |-
                    =Set(varPunchReviewFieldDefsLastSavedId, 0);

                    With(
                        {
                            draft: First(cmpPR_CustomFieldsEditor.DraftDefinition)
                        },

                        Set(varPunchReviewDef_FieldDefId, Coalesce(draft.FieldDefId, 0));
                        Set(varPunchReviewDef_FieldKey, Coalesce(draft.FieldKey, ""));
                        Set(varPunchReviewDef_Label, Coalesce(draft.Label, ""));
                        Set(varPunchReviewDef_FieldType, Coalesce(draft.FieldType, "Text"));
                        Set(varPunchReviewDef_HelpText, Coalesce(draft.HelpText, ""));
                        Set(varPunchReviewDef_IsRequired, Coalesce(draft.IsRequired, false));
                        Set(varPunchReviewDef_IsPinned, Coalesce(draft.IsPinned, false));
                        Set(varPunchReviewDef_IsActive, Coalesce(draft.IsActive, true));
                        Set(varPunchReviewDef_SortOrder, Coalesce(draft.SortOrder, 100));
                        Set(varPunchReviewDef_OptionsJson, Coalesce(draft.OptionsJson, "[]"));
                        Set(varPunchReviewDef_IsFilterable, Coalesce(draft.IsFilterable, false));
                        Set(varPunchReviewDef_ShowInQuickFilters, Coalesce(draft.ShowInQuickFilters, false));
                        Set(varPunchReviewDef_FilterOrder, Coalesce(draft.FilterOrder, 100));
                        Set(varPunchReviewDef_FilterMode, Coalesce(draft.FilterMode, "Equals"));
                        Set(varPunchReviewDefDirty, Coalesce(cmpPR_CustomFieldsEditor.DraftDirty, false))
                    );

                    Select(btnPR_SaveCustomFieldDef);

                    If(
                        Coalesce(varPunchReviewFieldDefsLastMutationSucceeded, false) &&
                        IsBlank(Coalesce(varPunchReviewFieldDefsRefreshWarning, "")),

                        With(
                            {
                                savedDef:
                                    LookUp(
                                        colPunchReviewFieldDefsAdmin,
                                        Lower(Trim(FieldKey)) = Lower(Trim(varPunchReviewDef_FieldKey))
                                    )
                            },

                            If(
                                IsBlank(savedDef),

                                Set(
                                    varPunchReviewFieldDefsRefreshWarning,
                                    "La definición se guardó, pero no pudo reconciliarse con el catálogo recargado. Actualiza las definiciones antes de continuar editando."
                                );
                                Notify(
                                    varPunchReviewFieldDefsRefreshWarning,
                                    NotificationType.Warning
                                ),

                                Set(
                                    varPunchReviewFieldDefsLastSavedId,
                                    Coalesce(savedDef.FieldDefId, 0)
                                )
                            )
                        )
                    )
                  ProjectId: =Coalesce(varProjectId, 0)
                  ProjectLabel: |-
                    =If(
                        IsBlank(varProjectId),
                        "No project selected",
                        Coalesce(
                            varSelectedProject.ProjectCode,
                            "Project " & Text(varProjectId)
                        ) &
                        If(
                            !IsBlank(Coalesce(varSelectedProject.ProjectName, "")),
                            " · " & varSelectedProject.ProjectName,
                            ""
                        )
                    )
                  SaveSucceeded: |-
                    =Coalesce(varPunchReviewFieldDefsLastMutationSucceeded, false) &&
                    IsBlank(Coalesce(varPunchReviewFieldDefsRefreshWarning, "")) &&
                    Coalesce(varPunchReviewFieldDefsLastSavedId, 0) > 0
                  SavedFieldDefId: =Coalesce(varPunchReviewFieldDefsLastSavedId, 0)
                  SurfaceAltColor: =varTheme_SurfaceAlt
                  TextColor: =varTheme_Text
                  Title: ="Custom Fields"
                  Width: =Min(1180, Parent.Width - 48)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
