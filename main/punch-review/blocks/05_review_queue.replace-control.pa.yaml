# BLOCK 05 — INTERACTIVE REVIEW QUEUE
#
# Operation: REPLACE CONTROL COMPLETELY.
# Target control: conPR_QueueCard
# Parent: conPR_Body
#
# In Source Code, replace the complete existing conPR_QueueCard node from Block 03
# with this complete node. Do not keep conPR_QueueHeaderSlot, rectPR_QueueHeaderDivider
# or conPR_QueueContentSlot because this block replaces all of them.
#
# Dependencies:
# - Blocks 01, 02, 03 and 04 validated.
# - colPunchReviewQueue and colPunchReviewQueueView exist from Block 04.
#
# This block does not call flows. Selection updates only the session state:
# varPunchReviewCurrentIndex, varPunchReviewCurrent and varPunchReviewCurrentId.
#
# Validation after paste:
# 1. Empty queue shows a deliberate empty state.
# 2. Search and quick-filter controls render without overlap.
# 3. With optional test data, row selection highlights the current Punch.
# 4. Previous and Next change the current position.
# 5. Search matches Punch code, description, subsystem and discipline.
# 6. Reviewed/Remaining filters operate only on IsReviewedInSession.

- conPR_QueueCard:
    Control: GroupContainer@1.5.0
    Variant: AutoLayout
    Properties:
      AlignInContainer: =AlignInContainer.Stretch
      BorderColor: =varTheme_Border
      BorderThickness: =1
      DropShadow: =DropShadow.Semilight
      Fill: =varTheme_Surface
      FillPortions: =0
      Height: =If(App.Width < 1100, 420, Parent.Height)
      LayoutAlignItems: =LayoutAlignItems.Stretch
      LayoutDirection: =LayoutDirection.Vertical
      LayoutGap: =0
      LayoutMinHeight: =360
      LayoutMinWidth: =300
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Width: =If(App.Width < 1100, Parent.Width, 330)
    Children:
      - btnPR_RebuildQueue:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            BorderThickness: =0
            Color: =RGBA(0,0,0,0)
            DisplayMode: =DisplayMode.Edit
            Fill: =RGBA(0,0,0,0)
            FillPortions: =0
            Height: =0
            HoverFill: =RGBA(0,0,0,0)
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            OnSelect: |-
              =ClearCollect(
                  colPunchReviewQueueView,
                  SortByColumns(
                      Filter(
                          colPunchReviewQueue,
                          (
                              Coalesce(varPunchReviewQueueQuickFilter, "ALL") = "ALL" ||
                              (
                                  Coalesce(varPunchReviewQueueQuickFilter, "ALL") = "REMAINING" &&
                                  !IsReviewedInSession
                              ) ||
                              (
                                  Coalesce(varPunchReviewQueueQuickFilter, "ALL") = "REVIEWED" &&
                                  IsReviewedInSession
                              )
                          ) &&
                          (
                              IsBlank(Trim(Coalesce(varPunchReviewSearch, ""))) ||
                              Lower(Trim(Coalesce(varPunchReviewSearch, ""))) in
                                  Lower(
                                      Coalesce(PunchCode, "") & " " &
                                      Coalesce(Description, "") & " " &
                                      Coalesce(SubsystemCode, "") & " " &
                                      Coalesce(Discipline, "")
                                  )
                          )
                      ),
                      "ReviewOrder",
                      SortOrder.Ascending
                  )
              )
            PressedFill: =RGBA(0,0,0,0)
            Text: =""
            Visible: =false
            Width: =0
      - btnPR_SelectCurrent:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            BorderThickness: =0
            Color: =RGBA(0,0,0,0)
            DisplayMode: =DisplayMode.Edit
            Fill: =RGBA(0,0,0,0)
            FillPortions: =0
            Height: =0
            HoverFill: =RGBA(0,0,0,0)
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            OnSelect: |-
              =If(
                  CountRows(colPunchReviewQueue) = 0,

                  Set(varPunchReviewCurrentIndex, 1);
                  Set(varPunchReviewCurrentId, Blank());
                  Set(varPunchReviewCurrent, Blank()),

                  varPunchReviewDirty,

                  Notify(
                      "Save or discard the current changes before moving to another Punch.",
                      NotificationType.Warning
                  ),

                  Set(
                      varPunchReviewCurrentIndex,
                      Min(
                          Max(1, Value(varPunchReviewRequestedIndex)),
                          CountRows(colPunchReviewQueue)
                      )
                  );

                  Set(
                      varPunchReviewCurrent,
                      LookUp(
                          colPunchReviewQueue,
                          ReviewOrder = varPunchReviewCurrentIndex
                      )
                  );

                  Set(
                      varPunchReviewCurrentId,
                      varPunchReviewCurrent.PunchIdNumber
                  )
              )
            PressedFill: =RGBA(0,0,0,0)
            Text: =""
            Visible: =false
            Width: =0
      - conPR_QueueHeader:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            DropShadow: =DropShadow.None
            Fill: =varTheme_Surface
            FillPortions: =0
            Height: =44
            LayoutMinHeight: =44
            LayoutMinWidth: =280
            Width: =Parent.Width
          Children:
            - lblPR_QueueTitle:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =varTheme_Text
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =11
                  Text: ="Review Queue"
                  Width: =170
                  X: =12
                  Y: =10
            - lblPR_QueueCount:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =varTheme_TextMuted
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =24
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =8
                  Text: =Text(CountRows(colPunchReviewQueue)) & " punches"
                  Width: =112
                  X: =Parent.Width - 124
                  Y: =10
      - rectPR_QueueHeaderDivider:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            BorderStyle: =BorderStyle.None
            Fill: =varTheme_Border
            FillPortions: =0
            Height: =1
            Width: =Parent.Width
      - conPR_QueueSearch:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            DropShadow: =DropShadow.None
            Fill: =varTheme_Surface
            FillPortions: =0
            Height: =48
            LayoutMinHeight: =48
            LayoutMinWidth: =280
            Width: =Parent.Width
          Children:
            - txtPR_Search:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =varTheme_Border
                  BorderThickness: =1
                  Color: =varTheme_Text
                  Default: =Coalesce(varPunchReviewSearch, "")
                  Fill: =varTheme_Surface
                  Font: =Font.'Segoe UI'
                  Height: =32
                  HintText: ="Search Punch ID or description..."
                  HoverBorderColor: =varTheme_PulseBlueDark
                  HoverColor: =varTheme_Text
                  HoverFill: =varTheme_Surface
                  OnChange: |-
                    =Set(varPunchReviewSearch, Trim(Self.Text));
                    Select(btnPR_RebuildQueue)
                  PaddingLeft: =30
                  PressedBorderColor: =varTheme_PulseBlueDark
                  PressedColor: =varTheme_Text
                  PressedFill: =varTheme_Surface
                  RadiusBottomLeft: =7
                  RadiusBottomRight: =7
                  RadiusTopLeft: =7
                  RadiusTopRight: =7
                  Size: =9
                  Width: =Parent.Width - 52
                  X: =8
                  Y: =8
            - icoPR_Search:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =varTheme_TextMuted
                  Height: =16
                  Icon: =Icon.Search
                  OnSelect: =SetFocus(txtPR_Search)
                  Width: =16
                  X: =17
                  Y: =16
            - btnPR_ClearSearch:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =varTheme_Border
                  BorderThickness: =1
                  Color: =varTheme_TextMuted
                  DisplayMode: =If(IsBlank(Trim(Coalesce(varPunchReviewSearch, ""))), DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =varTheme_Surface
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  HoverBorderColor: =varTheme_PulseBlueDark
                  HoverColor: =varTheme_PulseBlueDark
                  HoverFill: =varTheme_SurfaceAlt
                  OnSelect: |-
                    =Set(varPunchReviewSearch, "");
                    Reset(txtPR_Search);
                    Select(btnPR_RebuildQueue)
                  PressedBorderColor: =varTheme_PulseBlueDark
                  PressedColor: =varTheme_PulseBlueDark
                  PressedFill: =varTheme_SurfaceAlt
                  RadiusBottomLeft: =7
                  RadiusBottomRight: =7
                  RadiusTopLeft: =7
                  RadiusTopRight: =7
                  Size: =10
                  Text: ="×"
                  Width: =32
                  X: =Parent.Width - 40
                  Y: =8
      - conPR_QueueQuickFilters:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            DropShadow: =DropShadow.None
            Fill: =varTheme_Surface
            FillPortions: =0
            Height: =34
            LayoutMinHeight: =34
            LayoutMinWidth: =280
            Width: =Parent.Width
          Children:
            - btnPR_FilterAll:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =If(Coalesce(varPunchReviewQueueQuickFilter, "ALL") = "ALL", varTheme_PulseBlueDark, varTheme_Border)
                  BorderThickness: =1
                  Color: =If(Coalesce(varPunchReviewQueueQuickFilter, "ALL") = "ALL", varTheme_PulseBlueDark, varTheme_TextMuted)
                  Fill: =If(Coalesce(varPunchReviewQueueQuickFilter, "ALL") = "ALL", ColorValue("#EFF6FF"), varTheme_Surface)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =26
                  HoverBorderColor: =varTheme_PulseBlueDark
                  HoverColor: =varTheme_PulseBlueDark
                  HoverFill: =ColorValue("#EFF6FF")
                  OnSelect: |-
                    =Set(varPunchReviewQueueQuickFilter, "ALL");
                    Select(btnPR_RebuildQueue)
                  PressedBorderColor: =varTheme_PulseBlueDark
                  PressedColor: =varTheme_PulseBlueDark
                  PressedFill: =ColorValue("#DBEAFE")
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =8
                  Text: ="All · " & Text(CountRows(colPunchReviewQueue))
                  Width: =(Parent.Width - 24) / 3
                  X: =8
                  Y: =4
            - btnPR_FilterRemaining:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =If(Coalesce(varPunchReviewQueueQuickFilter, "ALL") = "REMAINING", varTheme_PulseBlueDark, varTheme_Border)
                  BorderThickness: =1
                  Color: =If(Coalesce(varPunchReviewQueueQuickFilter, "ALL") = "REMAINING", varTheme_PulseBlueDark, varTheme_TextMuted)
                  Fill: =If(Coalesce(varPunchReviewQueueQuickFilter, "ALL") = "REMAINING", ColorValue("#EFF6FF"), varTheme_Surface)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =26
                  HoverBorderColor: =varTheme_PulseBlueDark
                  HoverColor: =varTheme_PulseBlueDark
                  HoverFill: =ColorValue("#EFF6FF")
                  OnSelect: |-
                    =Set(varPunchReviewQueueQuickFilter, "REMAINING");
                    Select(btnPR_RebuildQueue)
                  PressedBorderColor: =varTheme_PulseBlueDark
                  PressedColor: =varTheme_PulseBlueDark
                  PressedFill: =ColorValue("#DBEAFE")
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =8
                  Text: ="Remaining · " & Text(CountIf(colPunchReviewQueue, !IsReviewedInSession))
                  Width: =(Parent.Width - 24) / 3
                  X: =btnPR_FilterAll.X + btnPR_FilterAll.Width + 4
                  Y: =4
            - btnPR_FilterReviewed:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =If(Coalesce(varPunchReviewQueueQuickFilter, "ALL") = "REVIEWED", varTheme_PulseBlueDark, varTheme_Border)
                  BorderThickness: =1
                  Color: =If(Coalesce(varPunchReviewQueueQuickFilter, "ALL") = "REVIEWED", varTheme_PulseBlueDark, varTheme_TextMuted)
                  Fill: =If(Coalesce(varPunchReviewQueueQuickFilter, "ALL") = "REVIEWED", ColorValue("#EFF6FF"), varTheme_Surface)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =26
                  HoverBorderColor: =varTheme_PulseBlueDark
                  HoverColor: =varTheme_PulseBlueDark
                  HoverFill: =ColorValue("#EFF6FF")
                  OnSelect: |-
                    =Set(varPunchReviewQueueQuickFilter, "REVIEWED");
                    Select(btnPR_RebuildQueue)
                  PressedBorderColor: =varTheme_PulseBlueDark
                  PressedColor: =varTheme_PulseBlueDark
                  PressedFill: =ColorValue("#DBEAFE")
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =8
                  Text: ="Reviewed · " & Text(CountIf(colPunchReviewQueue, IsReviewedInSession))
                  Width: =(Parent.Width - 24) / 3
                  X: =btnPR_FilterRemaining.X + btnPR_FilterRemaining.Width + 4
                  Y: =4
      - conPR_QueuePager:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =varTheme_Border
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =varTheme_SurfaceAlt
            FillPortions: =0
            Height: =36
            LayoutMinHeight: =36
            LayoutMinWidth: =280
            Width: =Parent.Width
          Children:
            - btnPR_Previous:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  Color: =varTheme_TextMuted
                  DisabledBorderColor: =RGBA(0,0,0,0)
                  DisabledColor: =ColorValue("#CBD5E1")
                  DisabledFill: =RGBA(0,0,0,0)
                  DisplayMode: =If(CountRows(colPunchReviewQueue) = 0 || varPunchReviewCurrentIndex <= 1, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =RGBA(0,0,0,0)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =30
                  HoverBorderColor: =RGBA(0,0,0,0)
                  HoverColor: =varTheme_PulseBlueDark
                  HoverFill: =ColorValue("#EFF6FF")
                  OnSelect: |-
                    =Set(varPunchReviewRequestedIndex, varPunchReviewCurrentIndex - 1);
                    Select(btnPR_SelectCurrent)
                  PressedBorderColor: =RGBA(0,0,0,0)
                  PressedColor: =varTheme_PulseBlueDark
                  PressedFill: =ColorValue("#DBEAFE")
                  Size: =12
                  Text: ="‹"
                  Width: =34
                  X: =8
                  Y: =3
            - lblPR_QueuePosition:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =varTheme_Text
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =26
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =9
                  Text: |-
                    =If(
                        CountRows(colPunchReviewQueue) = 0,
                        "No review queue",
                        Text(varPunchReviewCurrentIndex) & " of " & Text(CountRows(colPunchReviewQueue))
                    )
                  Width: =Parent.Width - 92
                  X: =46
                  Y: =5
            - btnPR_Next:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  Color: =varTheme_TextMuted
                  DisabledBorderColor: =RGBA(0,0,0,0)
                  DisabledColor: =ColorValue("#CBD5E1")
                  DisabledFill: =RGBA(0,0,0,0)
                  DisplayMode: =If(CountRows(colPunchReviewQueue) = 0 || varPunchReviewCurrentIndex >= CountRows(colPunchReviewQueue), DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =RGBA(0,0,0,0)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =30
                  HoverBorderColor: =RGBA(0,0,0,0)
                  HoverColor: =varTheme_PulseBlueDark
                  HoverFill: =ColorValue("#EFF6FF")
                  OnSelect: |-
                    =Set(varPunchReviewRequestedIndex, varPunchReviewCurrentIndex + 1);
                    Select(btnPR_SelectCurrent)
                  PressedBorderColor: =RGBA(0,0,0,0)
                  PressedColor: =varTheme_PulseBlueDark
                  PressedFill: =ColorValue("#DBEAFE")
                  Size: =12
                  Text: ="›"
                  Width: =34
                  X: =Parent.Width - 42
                  Y: =3
      - conPR_QueueListHost:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =varTheme_Surface
            FillPortions: =1
            LayoutMinHeight: =160
            LayoutMinWidth: =280
            Width: =Parent.Width
          Children:
            - galPR_Queue:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Fill: =varTheme_Surface
                  Height: =Parent.Height
                  Items: =colPunchReviewQueueView
                  ShowNavigation: =false
                  ShowScrollbar: =true
                  TemplateFill: =Color.Transparent
                  TemplatePadding: =0
                  TemplateSize: =88
                  Visible: =CountRows(colPunchReviewQueueView) > 0
                  Width: =Parent.Width
                Children:
                  - btnPR_QueueRow:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =If(ThisItem.ReviewOrder = varPunchReviewCurrentIndex, varTheme_PulseBlueDark, varTheme_Border)
                        BorderThickness: =If(ThisItem.ReviewOrder = varPunchReviewCurrentIndex, 2, 1)
                        Color: =RGBA(0,0,0,0)
                        Fill: =If(ThisItem.ReviewOrder = varPunchReviewCurrentIndex, ColorValue("#EFF6FF"), varTheme_Surface)
                        Font: =Font.'Segoe UI'
                        Height: =Parent.TemplateHeight - 4
                        HoverBorderColor: =varTheme_PulseBlueDark
                        HoverColor: =RGBA(0,0,0,0)
                        HoverFill: =ColorValue("#F8FAFC")
                        OnSelect: |-
                          =Set(varPunchReviewRequestedIndex, ThisItem.ReviewOrder);
                          Select(btnPR_SelectCurrent)
                        PressedBorderColor: =varTheme_PulseBlueDark
                        PressedColor: =RGBA(0,0,0,0)
                        PressedFill: =ColorValue("#DBEAFE")
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: =""
                        Width: =Parent.TemplateWidth - 12
                        X: =6
                        Y: =2
                  - lblPR_QueuePunchCode:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =varTheme_Text
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        OnSelect: =Select(btnPR_QueueRow)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =9
                        Text: =Coalesce(ThisItem.PunchCode, Text(ThisItem.PunchIdNumber))
                        Width: =170
                        X: =16
                        Y: =8
                  - conPR_QueueStatusPill:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        DropShadow: =DropShadow.None
                        Fill: |-
                          =Switch(
                              Upper(Coalesce(ThisItem.StatusCode, ThisItem.StatusLabel, "")),
                              "CLOSED", ColorValue("#DCFCE7"),
                              "CLEARED", ColorValue("#DCFCE7"),
                              "IN PROGRESS", ColorValue("#FFEDD5"),
                              "IN_PROGRESS", ColorValue("#FFEDD5"),
                              ColorValue("#FEE2E2")
                          )
                        Height: =20
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Width: =82
                        X: =Parent.TemplateWidth - 94
                        Y: =6
                      Children:
                        - lblPR_QueueStatus:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0,0,0,0)
                              Color: |-
                                =Switch(
                                    Upper(Coalesce(ThisItem.StatusCode, ThisItem.StatusLabel, "")),
                                    "CLOSED", ColorValue("#166534"),
                                    "CLEARED", ColorValue("#166534"),
                                    "IN PROGRESS", ColorValue("#C2410C"),
                                    "IN_PROGRESS", ColorValue("#C2410C"),
                                    ColorValue("#B91C1C")
                                )
                              Fill: =Color.Transparent
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =Parent.Height
                              OnSelect: =Select(btnPR_QueueRow)
                              PaddingBottom: =0
                              PaddingLeft: =3
                              PaddingRight: =3
                              PaddingTop: =0
                              Size: =7
                              Text: =Upper(Coalesce(ThisItem.StatusLabel, ThisItem.StatusCode, "OPEN"))
                              Width: =Parent.Width
                  - lblPR_QueueDescription:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =varTheme_Text
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        Height: =34
                        OnSelect: =Select(btnPR_QueueRow)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =8
                        Text: =Coalesce(ThisItem.Description, "No description")
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.TemplateWidth - 32
                        X: =16
                        Y: =29
                  - lblPR_QueueDisciplineDot:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0,0,0,0)
                        Color: |-
                          =Switch(
                              Lower(Coalesce(ThisItem.Discipline, "")),
                              "mechanical", ColorValue("#16A34A"),
                              "electrical", ColorValue("#EAB308"),
                              "piping", ColorValue("#8B5CF6"),
                              "structural", ColorValue("#3B82F6"),
                              varTheme_TextMuted
                          )
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =18
                        OnSelect: =Select(btnPR_QueueRow)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10
                        Text: ="●"
                        Width: =12
                        X: =14
                        Y: =65
                  - lblPR_QueueDiscipline:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =varTheme_TextMuted
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        Height: =18
                        OnSelect: =Select(btnPR_QueueRow)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =8
                        Text: =Coalesce(ThisItem.Discipline, "No discipline")
                        Width: =126
                        X: =29
                        Y: =65
                  - lblPR_QueueReviewedState:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =If(ThisItem.IsReviewedInSession, ColorValue("#15803D"), varTheme_TextMuted)
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =If(ThisItem.IsReviewedInSession, FontWeight.Semibold, FontWeight.Normal)
                        Height: =18
                        OnSelect: =Select(btnPR_QueueRow)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =8
                        Text: =If(ThisItem.IsReviewedInSession, "Reviewed  ✓", "Not reviewed  ○")
                        Width: =145
                        X: =Parent.TemplateWidth - 157
                        Y: =65
            - conPR_QueueEmpty:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =varTheme_Surface
                  Height: =Parent.Height
                  Visible: =CountRows(colPunchReviewQueueView) = 0
                  Width: =Parent.Width
                Children:
                  - icoPR_QueueEmpty:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =varTheme_PulseBlueDark
                        Height: =36
                        Icon: =Icon.DocumentWithContent
                        Width: =36
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =Max(24, (Parent.Height - 100) / 2)
                  - lblPR_QueueEmptyTitle:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =varTheme_Text
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10
                        Text: =If(CountRows(colPunchReviewQueue) = 0, "No review queue", "No matching punches")
                        Width: =Parent.Width - 40
                        X: =20
                        Y: =icoPR_QueueEmpty.Y + icoPR_QueueEmpty.Height + 8
                  - lblPR_QueueEmptyText:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =varTheme_TextMuted
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        Height: =40
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =8
                        Text: |-
                          =If(
                              CountRows(colPunchReviewQueue) = 0,
                              "Open this workspace from Home or Punch List to create a contextual review queue.",
                              "Clear the search or select another queue filter."
                          )
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width - 56
                        X: =28
                        Y: =lblPR_QueueEmptyTitle.Y + lblPR_QueueEmptyTitle.Height + 4
      - conPR_QueueFooter:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =varTheme_Border
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =varTheme_SurfaceAlt
            FillPortions: =0
            Height: =34
            LayoutMinHeight: =34
            LayoutMinWidth: =280
            Width: =Parent.Width
          Children:
            - lblPR_QueueShowing:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =varTheme_TextMuted
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =24
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =8
                  Text: ="Showing " & Text(CountRows(colPunchReviewQueueView)) & " of " & Text(CountRows(colPunchReviewQueue))
                  Width: =150
                  X: =12
                  Y: =5
            - lblPR_QueueReviewedTotal:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =varTheme_TextMuted
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =24
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =8
