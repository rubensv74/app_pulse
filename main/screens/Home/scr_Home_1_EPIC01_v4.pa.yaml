                                          SubsystemName: Text(Value.SubsystemName),
                                          CategoryCode: Text(Value.CategoryCode),
                                          CategoryName: Text(Value.CategoryName),
                                          StatusCode: Text(Value.StatusCode),
                                          StatusName: Text(Value.StatusName),
                                          StatusOrder: Value(Coalesce(Text(Value.StatusOrder), "0")),
