                                                !IsBlank(varPunchDashboardError),
                                                "Dashboard unavailable",
                                                !varPunchDashboardHasSnapshot,
                                                "No snapshot available",
                                                "Punch Dashboard"
                                            )
                                          Width: =Max(160, Min(520, Parent.Width - 48))
                                          X: =(Parent.Width - Self.Width) / 2
                                          Y: =icoPunchDashboardState_1.Y + icoPunchDashboardState_1.Height + 14
                                    - lblPunchDashboardStateText_1:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          AutoHeight: =true
                                          Color: =varTheme_TextMuted
                                          Size: =10
                                          Text: |-
                                            =
                                            If(
                                                IsBlank(varProjectId),
                                                "Choose a project from the selector above.",
                                                IsBlank(varPunchDashboardTemplateId),
                                                "No configured punch template was returned for this project.",
                                                !IsBlank(varPunchDashboardError),
                                                varPunchDashboardError,
                                                !varPunchDashboardHasSnapshot,
                                                Coalesce(varPunchDashboardMessage, "Generate a snapshot before loading this dashboard."),
                                                ""
                                            )
                                          Width: =Max(160, Min(640, Parent.Width - 48))
                                          X: =(Parent.Width - Self.Width) / 2
                                          Y: =lblPunchDashboardStateTitle_1.Y + lblPunchDashboardStateTitle_1.Height + 6
                        - conHome_NoDataState_2:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
