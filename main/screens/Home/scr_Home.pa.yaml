                                                                      CategoryCode = varPunchDrillCategoryCode
                                                                  ) &&

                                                                  (
                                                                      Coalesce(varPunchDrillSubcontractorId, -1) < 0 ||

                                                                      Value(Coalesce(SubcontractorId, -1)) =
