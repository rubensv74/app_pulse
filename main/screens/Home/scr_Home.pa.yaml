                                          EmptyTitle: ="No punches found"
                                          Height: =Parent.Height - Self.Y - 12
                                          IsLoading: =varPunchExecutiveGridLoading
                                          LoadingText: ="Loading rows..."
                                          MutedTextColor: =ColorValue("#64748B")
                                          OnBulkAction: =
                                          OnColumnAction: |-
                                            =Switch(
                                                Self.ColumnActionOut,

                                                "RESET",
                                                    UpdateIf(
                                                        colHomePunchGridColumns,
                                                        true,
                                                        {
                                                            IsVisible:
                                                                Key in [
                                                                    "PunchId",
                                                                    "Title",
                                                                    "Subsystem",
                                                                    "Priority",
                                                                    "Status",
                                                                    "OwnerName"
                                                                ]
                                                        }
                                                    ),

                                                "APPLY",
                                                    false,

                                                "CLOSE",
                                                    false
                                            )
                                          OnColumnToggle: |-
                                            =With(
                                                {
                                                    _key:
                                                        Text(Self.ColumnToggleKeyOut),

                                                    _column:
                                                        LookUp(
                                                            colHomePunchGridColumns,
                                                            Key = Text(Self.ColumnToggleKeyOut)
                                                        )
                                                },

                                                If(
                                                    !_column.IsLocked,

                                                    Patch(
                                                        colHomePunchGridColumns,
                                                        _column,
                                                        {
                                                            IsVisible:
                                                                !_column.IsVisible
                                                        }
                                                    )
                                                )
                                            )
                                          OnContextAction: =
                                          OnPageChange: |-
                                            =Set(varPunchExecutiveGridPage, Max(1, Self.PageRequestedOut));
                                            Select(btnPunchExecutiveLoadCellDetails)
                                          OnRowSelect: =Set(varHomePunchGridSelectedKey, Self.SelectedRowKeyOut)
                                          OnRowsPerPage: =
                                          OnSelectionAction: |-
                                            =Switch(
                                                Self.SelectionActionOut,

                                                "SELECT_VISIBLE",
                                                    ForAll(
                                                        Self.Rows As _row,

                                                        If(
                                                            IsBlank(
                                                                LookUp(
                                                                    colHomePunchGridSelectedKeys,
                                                                    RowKey = Text(_row.RowKey)
                                                                )
                                                            ),

                                                            Collect(
                                                                colHomePunchGridSelectedKeys,
                                                                {
                                                                    RowKey: Text(_row.RowKey)
                                                                }
                                                            )
                                                        )
                                                    );

                                                    Set(varHomePunchGridAllMatchingSelected, false),

                                                "CLEAR_VISIBLE",
                                                    RemoveIf(
                                                        colHomePunchGridSelectedKeys,
                                                        RowKey in Self.Rows.RowKey
                                                    );

                                                    Set(varHomePunchGridAllMatchingSelected, false),

                                                "SELECT_MATCHING",
                                                    ClearCollect(
                                                        colHomePunchGridSelectedKeys,

                                                        ForAll(
                                                            Self.Rows As _row,

                                                            {
                                                                RowKey: Text(_row.RowKey)
                                                            }
                                                        )
                                                    );

                                                    Set(varHomePunchGridAllMatchingSelected, true),

                                                "CLEAR_ALL",
                                                    Clear(colHomePunchGridSelectedKeys);
                                                    Set(varHomePunchGridAllMatchingSelected, false)
                                            )
                                          OnSort: |-
                                            =Set(varHomePunchGridSortKey, Self.SortKeyOut);
                                            Set(varHomePunchGridSortDirection, Self.SortDirectionOut);
                                            Select(btnHome_RebuildPunchGridView)
                                          OnToggleRowSelect: |-
                                            =With(
                                                {
                                                    _key:
                                                        Text(Self.ToggleRowKeyOut)
                                                },

                                                If(
                                                    IsBlank(
                                                        LookUp(
                                                            colHomePunchGridSelectedKeys,
                                                            RowKey = _key
                                                        )
                                                    ),

                                                    Collect(
                                                        colHomePunchGridSelectedKeys,
                                                        {
                                                            RowKey: _key
                                                        }
                                                    ),

                                                    RemoveIf(
                                                        colHomePunchGridSelectedKeys,
                                                        RowKey = _key
                                                    )
                                                )
                                            );

                                            Set(varHomePunchGridAllMatchingSelected, false)
                                          Rows: =colHomePunchGridView
                                          RowsPerPage: =varPunchExecutiveGridPageSize
                                          SelectedKeys: =colHomePunchGridSelectedKeys
                                          SelectedRowKeyIn: =varHomePunchGridSelectedKey
                                          ShowBulkActions: =true
                                          ShowCheckboxes: =true
                                          ShowColumnSelector: =true
                                          ShowPagination: =true
                                          ShowRowActions: =true
                                          ShowSelectAllMatching: =true
                                          SortDirectionIn: =varHomePunchGridSortDirection
                                          SortKeyIn: =varHomePunchGridSortKey
                                          SuccessColor: =ColorValue("#10B981")
                                          SurfaceAltColor: =ColorValue("#F8FAFC")
                                          TextColor: =ColorValue("#0F172A")
                                          TotalCount: =varPunchExecutiveGridTotalRows
                                          TotalPages: =varPunchExecutiveGridTotalPages
                                          VisibleEnd: =25
                                          VisibleStart: =1
                                          WarningColor: =ColorValue("#F59E0B")
                                          Width: =Parent.Width
                                          X: =12
                                          Y: |-
                                            =    cmpHomePunchActionToolbar.Y +
                                                cmpHomePunchActionToolbar.Height +
                                                8
                              - conPunchDashboardState_1:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderColor: =varTheme_Border
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =varTheme_Surface
                                    Height: =100
                                    LayoutMinHeight: =260
                                    RadiusBottomLeft: =16
                                    RadiusBottomRight: =16
                                    RadiusTopLeft: =16
                                    RadiusTopRight: =16
                                    Visible: =!varPunchDashboardHasSnapshot || !IsBlank(varPunchDashboardError)
                                    Width: =Parent.Width
                                  Children:
                                    - icoPunchDashboardState_1:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          BorderColor: =RGBA(0,0,0,0)
                                          Color: =If(!IsBlank(varPunchDashboardError), varTheme_Red, varTheme_PulseBlueDark)
                                          DisabledBorderColor: =RGBA(0,0,0,0)
                                          DisabledColor: =varTheme_TextSoft
                                          DisabledFill: =RGBA(0,0,0,0)
                                          Height: =44
                                          HoverBorderColor: =RGBA(0,0,0,0)
                                          HoverColor: =varTheme_PulseBlueDark
                                          HoverFill: =RGBA(0,0,0,0)
                                          Icon: =If(!IsBlank(varPunchDashboardError), Icon.Warning, Icon.Folder)
                                          PressedBorderColor: =RGBA(0,0,0,0)
                                          PressedColor: =varTheme_PulseBlueDark
                                          PressedFill: =RGBA(0,0,0,0)
                                          Width: =44
                                          X: =(Parent.Width - Self.Width) / 2
                                          Y: =Max(36, (Parent.Height - 150) / 2)
                                    - lblPunchDashboardStateTitle_1:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          AutoHeight: =true
                                          Color: =varTheme_Text
