Screens:
  scr_Home:
    Properties:
      Fill: =varTheme_PageBg
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |+
        =
        // =====================================================
        // scr_App.OnVisible
        // Runtime state only. DO NOT reset selected project here.
        // =====================================================

        // =====================================================
        // PREMIUM PUNCH DASHBOARD UI STATE
        // =====================================================

        // =====================================================
        // TYPED COLLECTION BOOTSTRAP
        // Creates collection names and schemas once per session.
        // =====================================================

        If(
            IsBlank(varHomePunchSelectedDisciplineCode),
            Set(varHomePunchSelectedDisciplineCode, "")
        );

        If(
            IsBlank(varHomePunchGridSelectionInitialized),

            ClearCollect(
                colHomePunchGridSelectedKeys,
                {
                    RowKey: ""
                }
            );

            Clear(colHomePunchGridSelectedKeys);

            Set(varHomePunchGridAllMatchingSelected, false);
            Set(varHomePunchGridSelectionInitialized, true)
        );

        If(
            IsBlank(varHomePunchCollectionsInitialized),

            ClearCollect(
                colHomePunchGridNormalized,

                {
                    RowIndex: 0,
                    RowKey: "",
                    PunchId: "",
                    Title: "",
                    Subsystem: "",
                    Discipline: "",
                    DisciplineCode: "",
                    Priority: "",
                    Status: "",
                    DueDateText: "",
                    IsOverdue: false,
                    OwnerInitials: "",
                    OwnerName: "",
                    ProgressPct: 0
                }
            );

            Clear(
                colHomePunchGridNormalized
            );


            ClearCollect(
                colHomePunchGridView,

                {
                    RowIndex: 0,
                    RowKey: "",
                    PunchId: "",
                    Title: "",
                    Subsystem: "",
                    Discipline: "",
                    Priority: "",
                    Status: "",
                    DueDateText: "",
                    IsOverdue: false,
                    OwnerInitials: "",
                    OwnerName: "",
                    ProgressPct: 0
                }
            );

            Clear(
                colHomePunchGridView
            );


            ClearCollect(
                colPunchExecutiveDisciplineDistribution,

                {
                    DisciplineCode: "",
                    DisciplineName: "",
                    PunchCount: 0,
                    DisciplineColor: "#64748B"
                }
            );

            Clear(
                colPunchExecutiveDisciplineDistribution
            );


            ClearCollect(
                colPunchExecutiveDonutItems,

                {
                    SegmentKey: "",
                    SegmentLabel: "",
                    SegmentValue: 0,
                    SegmentColor: "#64748B",
                    SegmentOrder: 0
                }
            );

            Clear(
                colPunchExecutiveDonutItems
            );


            Set(
                varHomePunchCollectionsInitialized,
                true
            )
        );

        If(
            IsBlank(varHomePunchQuickFilter),
            Set(varHomePunchQuickFilter, "OPEN")
        );

        If(
            IsBlank(varHomePunchSearchText),
            Set(varHomePunchSearchText, "")
        );

        If(
            IsBlank(varHomePunchGridDensity),
            Set(varHomePunchGridDensity, "Compact")
        );

        If(
            IsBlank(varHomePunchGridSortKey),
            Set(varHomePunchGridSortKey, "PunchId")
        );

        If(
            IsBlank(varHomePunchGridSortDirection),
            Set(varHomePunchGridSortDirection, "asc")
        );

        If(
            IsBlank(varHomePunchGridSelectedKey),
            Set(varHomePunchGridSelectedKey, "")
        );

        If(
            IsBlank(varHomePunchKpiTotal),
            Set(varHomePunchKpiTotal, 0)
        );

        If(
            IsBlank(varHomePunchKpiOpen),
            Set(varHomePunchKpiOpen, 0)
        );

        If(
            IsBlank(varHomePunchKpiClosed),
            Set(varHomePunchKpiClosed, 0)
        );

        If(
            IsBlank(varHomePunchKpiCompletion),
            Set(varHomePunchKpiCompletion, 0)
        );

        If(
            IsBlank(varHomePunchKpiHasPreviousSnapshot),
            Set(varHomePunchKpiHasPreviousSnapshot, false)
        );

        If(
            CountRows(colHomePunchGridColumns) = 0,

            ClearCollect(
                colHomePunchGridColumns,

                {
                    Key: "PunchId",
                    Label: "Punch",
                    IsVisible: true,
                    IsLocked: true,
                    Width: 116,
                    Sortable: true,
                    Order: 1
                },

                {
                    Key: "Title",
                    Label: "Description",
                    IsVisible: true,
                    IsLocked: true,
                    Width: 360,
                    Sortable: true,
                    Order: 2
                },

                {
                    Key: "Subsystem",
                    Label: "Category / Subsystem / Discipline",
                    IsVisible: true,
                    IsLocked: false,
                    Width: 300,
                    Sortable: true,
                    Order: 3
                },

                {
                    Key: "Discipline",
                    Label: "Discipline",
                    IsVisible: false,
                    IsLocked: false,
                    Width: 110,
                    Sortable: true,
                    Order: 4
                },

                {
                    Key: "Priority",
                    Label: "Priority",
                    IsVisible: true,
                    IsLocked: false,
                    Width: 108,
                    Sortable: true,
                    Order: 5
                },

                {
                    Key: "Status",
                    Label: "Status",
                    IsVisible: true,
                    IsLocked: false,
                    Width: 100,
                    Sortable: true,
                    Order: 6
                },

                {
                    Key: "DueDateText",
                    Label: "Due Date",
                    IsVisible: false,
                    IsLocked: false,
                    Width: 108,
                    Sortable: false,
                    Order: 7
                },

                {
                    Key: "OwnerName",
                    Label: "Responsible",
                    IsVisible: true,
                    IsLocked: false,
                    Width: 240,
                    Sortable: true,
                    Order: 8
                },

                {
                    Key: "ProgressPct",
                    Label: "Progress",
                    IsVisible: false,
                    IsLocked: false,
                    Width: 116,
                    Sortable: false,
                    Order: 9
                }
            )
        );

        If(
            IsBlank(varPunchExecutiveGridPage),
            Set(varPunchExecutiveGridPage, 1)
        );

        If(
            IsBlank(varPunchExecutiveGridPageSize),
            Set(varPunchExecutiveGridPageSize, 25)
        );

        If(
            IsBlank(varPunchExecutiveGridTotalRows),
            Set(varPunchExecutiveGridTotalRows, 0)
        );

        If(
            IsBlank(varPunchExecutiveGridTotalPages),
            Set(varPunchExecutiveGridTotalPages, 0)
        );

        If(
            IsBlank(varPunchExecutiveGridHasPreviousPage),
            Set(varPunchExecutiveGridHasPreviousPage, false)
        );

        If(
            IsBlank(varPunchExecutiveGridHasNextPage),
            Set(varPunchExecutiveGridHasNextPage, false)
        );

        If(
            IsBlank(varPunchExecutiveGridLoading),
            Set(varPunchExecutiveGridLoading, false)
        );

        If(
            IsBlank(varPunchExecutiveGridError),
            Set(varPunchExecutiveGridError, "")
        );

        If(
            IsBlank(varPunchExecutiveGridMessage),
            Set(varPunchExecutiveGridMessage, "")
        );

        // Theme / visual tokens
        Set(varHiveColorExcellent, "#22C55E");
        Set(varHiveColorGood, "#F59E0B");
        Set(varHiveColorInProgress, "#00C8FF");
        Set(varHiveColorDelayed, "#EF4444");
        Set(varHiveColorNeutral, "#64748B");

        Set(varHiveColorSelected, "#00C8FF");
        Set(varHiveColorCardBg, "#FFFFFF");
        Set(varHiveColorPageBg, "#F6F8FB");
        Set(varHiveColorBorder, "#E2E8F0");
        Set(varHiveColorText, "#0F172A");
        Set(varHiveColorMuted, "#64748B");

        Set(varTheme_NavBg, ColorValue("#07111F"));
        Set(varTheme_NavBg2, ColorValue("#0B1220"));
        Set(varTheme_TopBg, ColorValue("#FFFFFF"));
        Set(varTheme_PageBg, ColorValue("#F6F8FB"));
        Set(varTheme_Surface, ColorValue("#FFFFFF"));
        Set(varTheme_SurfaceAlt, ColorValue("#F8FAFC"));
        Set(varTheme_Border, ColorValue("#E2E8F0"));
        Set(varTheme_Text, ColorValue("#0F172A"));
        Set(varTheme_TextMuted, ColorValue("#64748B"));
        Set(varTheme_TextSoft, ColorValue("#94A3B8"));
        Set(varTheme_TextWhite, ColorValue("#FFFFFF"));
        Set(varTheme_PulseBlue, ColorValue("#00C8FF"));
        Set(varTheme_PulseBlueDark, ColorValue("#1677FF"));
        Set(varTheme_PulseSoft, ColorValue("#E0F7FF"));
        Set(varTheme_Green, ColorValue("#22C55E"));
        Set(varTheme_Amber, ColorValue("#F59E0B"));
        Set(varTheme_Red, ColorValue("#EF4444"));
        Set(varTheme_CardRadius, 16);
        Set(varTheme_ButtonRadius, 10);

        // Responsive
        Set(varIsMobile, App.Width < 900);
        Set(varIsTablet, App.Width >= 900 && App.Width < 1400);
        Set(varIsDesktop, App.Width >= 1400);

        // User
        Set(varCurrentUserEmail, Lower(User().Email));
        Set(varCurrentUserName, User().FullName);

        // Navigation defaults only
        If(IsBlank(varAppView), Set(varAppView, "Home"));
        If(IsBlank(varHomeViewMode), Set(varHomeViewMode, "DASHBOARD"));
        If(IsBlank(varHomeDashboard), Set(varHomeDashboard, "PUNCHES"));
        If(IsBlank(varOps_ViewMode), Set(varOps_ViewMode, "OVERVIEW"));
        If(IsBlank(varOps_QuickFilter), Set(varOps_QuickFilter, "ALL"));

        // Project context: preserve if already selected
        If(
            IsBlank(varProjectId),
            Set(varProjectLoaded, false),
            Set(varProjectLoaded, true)
        );

        // Loading states


        If(
            !varProjectSwitching && !varGlobalLoadPending,

            Set(varGlobalLoading, false);
            Set(varGlobalLoadingMsg, "");
            Set(varGlobalLoadingSubMsg, "");
            Set(varGlobalLoadingScope, "");
            Set(varGlobalLoadAction, "");
            Set(varGlobalLoadPending, false);

            Set(varLoading, false);
            Set(varLoadingMsg, "");
            Set(varProjectSwitching, false);
            Set(varHomeLoading, false)
        );



        Set(varOps_IsLoading, false);
        Set(varPHR_IsLoading, false);
        Set(varDash_IsLoading, false);
        Set(varExecDashboardLoading, false);

        // Executive dashboard runtime status
        If(IsBlank(varExecutiveDashboardStatus), Set(varExecutiveDashboardStatus, "IDLE"));
        If(IsBlank(varExecutiveDashboardError), Set(varExecutiveDashboardError, ""));
        If(IsBlank(varExecutiveDashboardRequestedAt), Set(varExecutiveDashboardRequestedAt, Blank()));
        If(IsBlank(varExecutiveDashboardCompletedAt), Set(varExecutiveDashboardCompletedAt, Blank()));
        If(IsBlank(varExecutiveAlertDismissed), Set(varExecutiveAlertDismissed, false));

        // Error states
        Set(varAppError, "");
        Set(varAppWarning, "");
        Set(varHomeError, "");
        Set(varOps_Error, "");
        Set(varCfg_Error, "");
        Set(varHomePendingError, "");

        // UI defaults
        If(IsBlank(varHiveCardWidth), Set(varHiveCardWidth, 330));
        If(IsBlank(varHiveCardHeight), Set(varHiveCardHeight, 215));
        If(IsBlank(varHiveRightPanelWidth), Set(varHiveRightPanelWidth, 326));

        If(IsBlank(varHomeShowOverview), Set(varHomeShowOverview, false));
        If(IsBlank(varHomeShowCards), Set(varHomeShowCards, false));
        If(IsBlank(varHomeShowRightPanel), Set(varHomeShowRightPanel, false));

        If(IsBlank(varHomeNoData), Set(varHomeNoData, false));
        If(IsBlank(varOverviewNoConfig), Set(varOverviewNoConfig, false));
        If(IsBlank(varOverviewNoData), Set(varOverviewNoData, false));

        // Selected objects typed defaults
        Set(varOps_SelectedCellId, 0);
        Set(
            varOps_SelectedCell,
            {
                OperationalCellId: 0,
                ProjectId: 0,
                SubsystemCode: "",
                L1NodeId: "",
                L2NodeId: "",
                L3NodeId: "",
                L1DisplayName: "",
                L2DisplayName: "",
                L3DisplayName: "",
                TotalTasks: 0,
                DoneTasks: 0,
                RemainingTasks: 0,
                ProgressPercent: 0,
                OwnerEmail: "",
                DueDate: Blank(),
                OperationalStatus: "",
                StatusComment: "",
                LastReviewedOn: Blank(),
                LastReviewedBy: "",
                IsOverdue: false,
                AgingDays: 0,
                RefreshedOn: Blank()
            }
        );

        If(
            IsBlank(varSelectedHiveNode) || IsBlank(varSelectedHiveNode.NodeId),
            Set(
                varSelectedHiveNode,
                {
                    NodeId: "",
                    NodeNo: "",
                    NodeTitle: "",
                    NodeSubtitle: "",
                    Discipline: "",
                    SubsystemCode: "",
                    Total: 0,
                    Done: 0,
                    Remaining: 0,
                    Progress: 0,
                    ProgressStatus: "",
                    ProgressColor: "",
                    SortOrder: 0
                }
            )
        );

        If(
            IsBlank(varSelectedHiveSubsystem) || IsBlank(varSelectedHiveSubsystem.SubsystemCode),
            Set(
                varSelectedHiveSubsystem,
                {
                    SubsystemCode: "",
                    Discipline: "",
                    Total: 0,
                    Done: 0,
                    Remaining: 0,
                    Progress: 0,
                    ProgressStatus: "",
                    ProgressColor: ""
                }
            )
        );

        // PHR defaults
        If(IsBlank(varPHR_Page), Set(varPHR_Page, 1));
        If(IsBlank(varPHR_PageSize), Set(varPHR_PageSize, 50));
        If(IsBlank(varPHR_TotalCount), Set(varPHR_TotalCount, 0));

        Set(varPHR_ColW, Coalesce(varPHR_ColW, 66));
        Set(varPHR_StatusW, Coalesce(varPHR_StatusW, 56));
        Set(varPHR_SubsysW, Coalesce(varPHR_SubsysW, 170));
        Set(varPHR_ActionsW, Coalesce(varPHR_ActionsW, 92));
        Set(varPHR_LeftFixedW, varPHR_StatusW + varPHR_SubsysW + varPHR_ActionsW);

        Set(varPHR_HeaderH1, Coalesce(varPHR_HeaderH1, 28));
        Set(varPHR_HeaderH2, Coalesce(varPHR_HeaderH2, 28));
        Set(varPHR_HeaderH3, Coalesce(varPHR_HeaderH3, 28));
        Set(varPHR_HeaderH4, Coalesce(varPHR_HeaderH4, 32));
        Set(varPHR_RowH, Coalesce(varPHR_RowH, 52));

        // No automatic refresh
        Set(varOps_AutoLoadAllowed, false);
        Set(varShowFilters, false);
        Set(varShowMenu, false);
        Set(varCacheEnabled, true);
        Set(varUseCompactMode, false);

        Set(varBriefingEmailVisible, false);

        // Skyline defaults
        If(IsBlank(varSkylineLoaded), Set(varSkylineLoaded, false));
        If(IsBlank(varSkylineLoading), Set(varSkylineLoading, false));
        If(IsBlank(varSkylineError), Set(varSkylineError, ""));
        If(IsBlank(varSkylineFromDate), Set(varSkylineFromDate, DateAdd(Today(), -7, TimeUnit.Days)));
        If(IsBlank(varSkylinePunchWeight), Set(varSkylinePunchWeight, 3));
        If(IsBlank(varSelectedSkylineMode), Set(varSelectedSkylineMode, "DENSITY"));






















    Children:
      - tmrGlobalLoader_2:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =varGlobalLoadPending
            BorderColor: =RGBA(0, 120, 212, 1)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(242, 242, 241, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Duration: =150
            Fill: =RGBA(0, 120, 212, 1)
            Font: =Font.'Segoe UI'
            HoverBorderColor: =RGBA(16, 110, 190, 1)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(16, 110, 190, 1)
            OnTimerEnd: |-
              =
              If(
                  IsBlank(varGlobalLoadAction),

                  Set(varGlobalLoadPending, false),

                  Set(varGlobalLoadPending, false);

                  Switch(
                      varGlobalLoadAction,

                      "PROJECT_CHANGE",
                          Select(btnHome_ProjectChange_Commit_2),

                      "LOAD_PUNCH_DASHBOARD",
                          Select(btnHome_LoadPunchDashboard_1),

                      "LOAD_TASK_DASHBOARD",
                          Select(btnHome_LoadHive_2),

                      Set(varExecutiveDashboardStatus, "ERROR");
                      Set(
                          varExecutiveDashboardError,
                          "Unsupported dashboard load action: " &
                          Coalesce(varGlobalLoadAction, "-")
                      );
                      Set(varExecutiveDashboardCompletedAt, Now());

                      Notify(
                          "Home cannot execute action: " &
                          Coalesce(varGlobalLoadAction, "-"),
                          NotificationType.Warning
                      );

                      Set(varGlobalLoading, false);
                      Set(varGlobalLoadingMsg, "");
                      Set(varGlobalLoadingSubMsg, "");
                      Set(varGlobalLoadingScope, "");
                      Set(varGlobalLoadAction, "");
                      Set(varGlobalLoadPending, false);
                      Set(varHomeLoading, false);
                      Set(varPunchDashboardLoading, false);
                      Set(varProjectSwitching, false)
                  )
              )
            PressedBorderColor: =RGBA(16, 110, 190, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(16, 110, 190, 1)
            Visible: =false
            X: =100
            Y: =100
      - conLayer_Drawer_5:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(0,0,0,0)
            Height: =App.Height
            Visible: =Coalesce(varShowDetailDrawer, false)
            Width: =App.Width
          Children:
            - comp_DetailDrawer_5:
                Control: CanvasComponent
                ComponentName: cmp_DetailDrawer_Premium
                Properties:
                  AppColors: =gblAppColors
                  CloseAction: =Set(varShowDetailDrawer, false)
                  EntityType: =varDrawerEntityType
                  Fill: =RGBA(0,0,0,0)
                  Height: =App.Height
                  HostHeight: =App.Height
                  HostWidth: =App.Width
                  IsLoading: =varDrawerIsLoading
                  IsOpen: =varShowDetailDrawer
                  NormalizedRecord: =varDrawerNormalized
                  OnDeleteComment: =Set(varDrawerSelectedCommentId, 0)
                  OnManageFieldsRequested: |-
                    =
                    Set(varCT_ShowManageFields, true);

                    Set(varCT_DefsSearch, "");

                    Set(varCT_DefsError, "");

                    Select(btnCT_LoadDefs_5)
                  OnPostComment: |-
                    =
                    If(
                        IsBlank(Trim(varDrawerCommentDraft)),
                        Notify("Comment is required.", NotificationType.Warning),
                        Set(varIsLoadingComments, true);
                        Set(varDrawerIsLoading, true);
                        IfError(
                            Warroom_AddTaskComment.Run(
                                varProjectId,
                                varDrawerRecordId,
                                varDrawerCommentDraft,
                                varUserEmail,
                                varDrawerEntityType,
                                varUserName,
                                "Comment"
                            );
                            Set(varDrawerCommentDraft, "");
                            Select(btnDrawerLoad_Comments_5);
                            Set(varDrawerIsLoading, false),
                            Set(varIsLoadingComments, false);
                            Set(varDrawerIsLoading, false);
                            Notify("The comment could not be saved.", NotificationType.Error)
                        )
                    )
                  OnRefreshRequested: =Select(btnDrawerLoad_2)
                  OnSaveFields: |-
                    =
                    If(
                        CountRows(colCT_Dirty) = 0,
                        Notify("There are no changes to save.", NotificationType.Information),
                        Set(varCT_IsSaving, true);
                        Set(varCT_Error, "");
                        IfError(
                            WarRoom_SaveCustomBulk.Run(
                                varProjectId,
                                varDrawerEntityType,
                                varDrawerRecordId,
                                JSON(colCT_Dirty, JSONFormat.Compact),
                                varUserEmail
                            );
                            Clear(colCT_Dirty);
                            Select(btnDrawerLoad_Custom_5);
                            Set(varCT_IsSaving, false);
                            Notify("Custom fields saved.", NotificationType.Success),
                            Set(varCT_IsSaving, false);
                            Set(varCT_Error, "The custom fields could not be saved.");
                            Notify(varCT_Error, NotificationType.Error)
                        )
                    )
                  OnTabChanged: =Select(btnDrawerLoad_2)
                  ProjectId: =varProjectId
                  RecordId: =varDrawerRecordId
                  SelectedRecord: =varDrawerSelectedRecord
                  UserEmail: =varUserEmail
                  UserName: =varUserName
                  UserRole: =varUserRole
                  Visible: =varShowDetailDrawer
                  Width: =App.Width
            - btnDrawerLoad_Custom_5:
                Control: Button@0.0.45
                Properties:
                  OnSelect: |-
                    =

                    Set(varCT_Loading, true);
                    Set(varCT_Error, "");

                    // Limpieza
                    Clear(colCT_Quick);
                    Clear(colCT_Merged_Base);
                    Clear(colCT_Merged_UI);

                    // Llamada al flow
                    With(
                        {
                            resp: WarRoom_GetCustomBundle.Run(
                                varProjectId,
                                varDrawerEntityType,
                                varDrawerRecordId
                            )
                        },

                        With(
                            {
                                parsed: ParseJSON(Coalesce(resp.bundlejson, "{}"))
                            },

                            // Base (defs)
                            ClearCollect(
                                colCT_Merged_Base,
                                ForAll(
                                    Table(parsed.defs),
                                    {
                                        FieldKey: Text(ThisRecord.Value.FieldKey),
                                        Label: Text(ThisRecord.Value.Label),
                                        FieldType: Text(ThisRecord.Value.FieldType),
                                        IsRequired: Boolean(ThisRecord.Value.IsRequired),
                                        IsPinned: Boolean(ThisRecord.Value.IsPinned),
                                        SortOrder: Value(ThisRecord.Value.SortOrder),
                                        OptionsJson: Text(ThisRecord.Value.OptionsJson)
                                    }
                                )
                            );

                            // Valores (values)
                            ClearCollect(
                                colCT_Merged_UI,
                                ForAll(
                                    Table(parsed.values),
                                    {
                                        FieldKey: Text(ThisRecord.Value.FieldKey),
                                        ValueText: Text(ThisRecord.Value.ValueText),
                                        ValueNumber: Value(ThisRecord.Value.ValueNumber),
                                        ValueDate: If(
                                            !IsBlank(ThisRecord.Value.ValueDate),
                                            DateTimeValue(Text(ThisRecord.Value.ValueDate)),
                                            Blank()
                                        ),
                                        ValueBool: Boolean(ThisRecord.Value.ValueBool)
                                    }
                                )
                            )
                        )
                    );

                    // Merge final (lo que pinta la UI)
                    ClearCollect(
                        colCT_Quick,
                        AddColumns(
                            colCT_Merged_Base,
                            CurrentValue,
                            LookUp(colCT_Merged_UI, FieldKey = ThisRecord.FieldKey)
                        )
                    );

                    Set(varCT_Loading, false);
                  Visible: =false
                  X: =60
                  Y: =60
            - btnDrawerLoad_Comments_5:
                Control: Button@0.0.45
                Properties:
                  OnSelect: |-
                    =Set(varIsLoadingComments, true);

                    Set(varCommentsPage, 1);
                    Set(varCommentsPageSize, Coalesce(varCommentsPageSize, 20));

                    With(
                        {
                            resp: Warroom_GetTaskCommentsPaged.Run(
                                varProjectId,
                                varDrawerRecordId,
                                varCommentsPage,
                                varCommentsPageSize,
                                varDrawerEntityType
                            )
                        },
                        With(
                            {
                                arr: Table(ParseJSON(Coalesce(resp.result, "[]")))
                            },
                            ClearCollect(
                                colComments,
                                ForAll(
                                    arr,
                                    {
                                        CommentId: Value(ThisRecord.Value.CommentId),
                                        CommentText: Text(ThisRecord.Value.CommentText),
                                        CommentType: Text(ThisRecord.Value.CommentType),
                                        CreatedOn: DateTimeValue(Text(ThisRecord.Value.CreatedOn)),
                                        CreatedByEmail: Text(ThisRecord.Value.CreatedByEmail),
                                        CreatedByName: Text(ThisRecord.Value.CreatedByName),
                                        TotalRows: Value(ThisRecord.Value.TotalRows),
                                        TotalPages: Value(ThisRecord.Value.TotalPages),
                                        PageNumber: Value(ThisRecord.Value.PageNumber),
                                        PageSize: Value(ThisRecord.Value.PageSize)
                                    }
                                )
                            )
                        )
                    );

                    Set(varCommentsTotalRows, If(CountRows(colComments) > 0, First(colComments).TotalRows, 0));
                    Set(varCommentsTotalPages, If(CountRows(colComments) > 0, First(colComments).TotalPages, 0));

                    Set(varIsLoadingComments, false);
                    Set(varDrawerIsLoading, false);
                  Visible: =false
                  X: =80
                  Y: =80
            - btnDrawerLoad_2:
                Control: Button@0.0.45
                Properties:
                  OnSelect: |-
                    =Set(varDrawerIsLoading, true);

                    Switch(
                        varDrawerTab,
                        "Comments", Select(btnDrawerLoad_Comments_5),
                        "Fields", Select(btnDrawerLoad_Custom_5),
                        "Custom", Select(btnDrawerLoad_Custom_5),
                        "Summary", Set(varDrawerIsLoading, false),
                        "Overview", Set(varDrawerIsLoading, false),
                        "Activity", Set(varDrawerIsLoading, false),
                        "History", Set(varDrawerIsLoading, false),
                        Set(varDrawerIsLoading, false)
                    );
                  Visible: =false
                  X: =40
                  Y: =40
            - btnDrawerRefreshFromTab_5:
                Control: Button@0.0.45
                Properties:
                  OnSelect: |-
                    =
                    Set(varDrawerTab, "Custom");
                    Select(btnDrawerLoad_Custom_5)
                  Visible: =false
            - btnCT_LoadDefs_5:
                Control: Button@0.0.45
                Properties:
                  OnSelect: |-
                    =
                    Set(varCT_DefsIsLoading, true);
                    Set(varCT_DefsError, "");

                    Clear(colCT_Defs_Admin);

                    Set(
                        varCT_DefsResp,
                        WarRoom_ListCustomFieldDefs.Run(
                            varProjectId,
                            varDrawerEntityType,
                            If(varCT_ShowInactiveDefs, 1, 0)
                        )
                    );


                    Set(
                        varCT_DefsOuter,
                        Table(ParseJSON(Coalesce(varCT_DefsResp.result, "[]")))
                    );

                    If(
                        CountRows(varCT_DefsOuter) = 0,

                        Set(varCT_DefsError, "The flow returned no data."),

                        Set(
                            varCT_DefsBundle,
                            ParseJSON(
                                Text(First(varCT_DefsOuter).Value.result)
                            )
                        );

                        ClearCollect(
                            colCT_Defs_Admin,
                            ForAll(
                                Table(varCT_DefsBundle.defs),
                                {
                                    FieldDefId: Value(ThisRecord.Value.FieldDefId),
                                    ProjectId: Value(ThisRecord.Value.ProjectId),
                                    EntityType: Text(ThisRecord.Value.EntityType),
                                    FieldKey: Text(ThisRecord.Value.FieldKey),
                                    Label: Text(ThisRecord.Value.Label),
                                    FieldType: Text(ThisRecord.Value.FieldType),
                                    HelpText: Coalesce(Text(ThisRecord.Value.HelpText), ""),
                                    IsRequired: Boolean(ThisRecord.Value.IsRequired),
                                    IsPinned: Boolean(ThisRecord.Value.IsPinned),
                                    IsActive: Boolean(ThisRecord.Value.IsActive),
                                    SortOrder: Value(ThisRecord.Value.SortOrder),
                                    OptionsJson: Coalesce(Text(ThisRecord.Value.OptionsJson), ""),
                                    ModifiedOn: If(
                                        IsBlank(Text(ThisRecord.Value.ModifiedOn)),
                                        Blank(),
                                        DateTimeValue(Text(ThisRecord.Value.ModifiedOn))
                                    ),
                                    ModifiedByEmail: Coalesce(Text(ThisRecord.Value.ModifiedByEmail), ""),
                                    IsFilterable: Boolean(ThisRecord.Value.IsFilterable),
                                    ShowInQuickFilters: Boolean(ThisRecord.Value.ShowInQuickFilters),
                                    FilterOrder: If(
                                        IsBlank(Text(ThisRecord.Value.FilterOrder)),
                                        Coalesce(Value(ThisRecord.Value.SortOrder), 1000),
                                        Value(ThisRecord.Value.FilterOrder)
                                    ),
                                    FilterMode: Coalesce(Text(ThisRecord.Value.FilterMode), "Equals")
                                }
                            )
                        )
                    );

                    Set(varCT_DefsIsLoading, false);
                  Visible: =false
                  X: =100
                  Y: =100
