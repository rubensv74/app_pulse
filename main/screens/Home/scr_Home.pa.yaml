                                    Width: =Max(160, Min(640, Parent.Width - 48))
                                    X: =(Parent.Width - Self.Width) / 2
                                    Y: =Text13_2.Y + Text13_2.Height + 8
      - btnHome_LoadPunchDashboard_1:
          Control: ModernButton@1.0.0
          Properties:
            OnSelect: |-
              =
              Set(
                  varPunchDashboardForceRefreshRequest,
                  Coalesce(
                      varPunchDashboardForceRefresh,
                      false
                  )
              );

              Set(
                  varPunchDashboardForceRefresh,
                  false
              );


              If(
                  IsBlank(varProjectId),

                  Notify(
                      "Please select a project first.",
                      NotificationType.Warning
                  );

                  Set(varPunchDashboardLoading, false);
                  Set(varGlobalLoading, false);
                  Set(varGlobalLoadingMsg, "");
                  Set(varGlobalLoadingSubMsg, "");
                  Set(varGlobalLoadingScope, "");
                  Set(varGlobalLoadAction, "");
                  Set(varGlobalLoadPending, false);

                  Exit()
              );

              If(
                  varPunchDashboardLoading,
                  Exit()
              );

              Set(varPunchDashboardLoading, true);
              Set(varPunchDashboardError, "");
              Set(varPunchDashboardHasSnapshot, false);

              Clear(colPunchDashboardSnapshotInfo);
              Clear(colPunchDashboardSummary);
              Clear(colPunchDashboardMatrix);
              Clear(colPunchDashboardTimeline);
              Clear(colPunchDashboardInsights);
              Clear(colPunchDashboardSubsystems);
              Clear(colPunchDashboardSubcontractors);
              Clear(colPunchDashboardPunches);

              Clear(colPunchExecutiveHeatmapRows);
              Clear(colPunchExecutiveHeatmapColumns);
              Clear(colPunchExecutiveHeatmapCells);
              Clear(colPunchExecutiveDistribution);
              Clear(colPunchExecutiveSelection);

              Set(varPunchDrillSubsystemCode, "");
              Set(varPunchDrillCategoryCode, "");
              Set(varPunchDrillSubcontractorId, -1);
              Set(varPunchDrillSubcontractorName, "");
              Set(varPunchDrillStatusCode, "");
              Set(varPunchDrillDisciplineCode, "");

              Set(varPunchExecutiveGridPage, 1);
              Set(
                  varPunchExecutiveGridPageSize,
                  Coalesce(
                      varPunchExecutiveGridPageSize,
                      25
                  )
              );
              Set(
                  varPunchExecutiveGridSortColumn,
                  Coalesce(
                      varPunchExecutiveGridSortColumn,
                      "SourceOrder"
                  )
              );
              Set(
                  varPunchExecutiveGridSortDirection,
                  Coalesce(
                      varPunchExecutiveGridSortDirection,
                      SortOrder.Ascending
                  )
              );
              Set(varPunchExecutiveGridSelectedId, Blank());

              Clear(colHomePunchTimelineSorted);
              Clear(colHomePunchKpiTrendTotal);
              Clear(colHomePunchKpiTrendOpen);
              Clear(colHomePunchKpiTrendClosed);
              Clear(colHomePunchKpiTrendCompletion);
              Clear(colHomePunchDonutItems);

              Set(varHomePunchKpiTotal, 0);
              Set(varHomePunchKpiOpen, 0);
              Set(varHomePunchKpiClosed, 0);
              Set(varHomePunchKpiCompletion, 0);


              // =====================================================
              // LOAD PROJECT PUNCH TEMPLATES
              // Only load when the local catalog is empty.
              // =====================================================

              If(
                  CountRows(colPunchTemplates_Filter) = 0,

                  IfError(
                      With(
                          {
                              _templatesResp:
                                  Warroom_GetProjectPunchTemplates.Run(
                                      Value(varProjectId)
                                  )
                          },

                          ClearCollect(
                              colPunchTemplates_Filter,

                              SortByColumns(
                                  Filter(
                                      ForAll(
                                          Table(
                                              ParseJSON(
                                                  Coalesce(
                                                      _templatesResp.result,
                                                      "[]"
                                                  )
                                              )
                                          ),

                                          {
                                              ProjectId:
                                                  Value(
                                                      Text(Value.ProjectId)
                                                  ),

                                              TemplateId:
                                                  Value(
                                                      Text(Value.TemplateId)
                                                  ),

                                              TemplateCode:
                                                  Text(Value.TemplateCode),

                                              TemplateName:
                                                  Text(Value.TemplateName),

                                              TemplateDisplayName:
                                                  Coalesce(
                                                      Text(Value.TemplateDisplayName),
                                                      Text(Value.TemplateName),
                                                      Text(Value.TemplateCode)
                                                  ),

                                              IsIncluded:
                                                  Lower(
                                                      Text(Value.IsIncluded)
                                                  ) = "true" ||
                                                  Text(Value.IsIncluded) = "1",

                                              DisplayOrder:
                                                  If(
                                                      IsBlank(
                                                          Text(Value.DisplayOrder)
                                                      ) ||
                                                      Text(Value.DisplayOrder) = "null",

                                                      9999,

                                                      Value(
                                                          Text(Value.DisplayOrder)
                                                      )
                                                  )
                                          }
                                      ),

                                      IsIncluded
                                  ),

                                  "DisplayOrder",
                                  SortOrder.Ascending
                              )
                          );

                          true
                      ),

                      Set(
                          varPunchDashboardError,
                          FirstError.Message
                      );

                      false
                  )
              );


              // =====================================================
              // DEFAULT TEMPLATE
              // =====================================================

              If(
                  IsBlank(varPunchDashboardTemplateId) &&
                  CountRows(colPunchTemplates_Filter) > 0,

                  Set(
                      varPunchDashboardTemplateId,
                      Value(
                          First(colPunchTemplates_Filter).TemplateId
                      )
                  )
              );


              // =====================================================
              // LOAD DASHBOARD BUNDLE
              // =====================================================

              If(
                  IsBlank(varPunchDashboardError) &&
                  !IsBlank(varPunchDashboardTemplateId),

                  IfError(
                      With(
                          {
                              _resp:
                                  warroom_GetPunchDashboardBundle.Run(
                  Value(varProjectId),
                  Value(varPunchDashboardTemplateId),
                  If(
                      varPunchDashboardForceRefreshRequest,
                      1,
                      0
                  )
              )
                          },

                          With(
                              {
                                  _bundle:
                                      ParseJSON(
                                          Coalesce(
                                              _resp.result,
                                              "{}"
                                          )
                                      )
                              },


                              // =====================================================
                              // BUNDLE STATUS
                              // =====================================================

                              Set(
                                  varPunchDashboardHasSnapshot,

                                  Lower(
                                      Text(_bundle.hasSnapshot)
                                  ) = "true" ||
                                  Text(_bundle.hasSnapshot) = "1"
                              );

                              Set(
                                  varPunchDashboardMessage,
                                  Coalesce(
                                      Text(_bundle.message),
                                      ""
                                  )
                              );


               // =====================================================
              // CONTRACT VERSION
              // =====================================================

              Set(
                  varPunchDashboardContractVersion,
                  Coalesce(
                      Text(_bundle.contractVersion),
                      ""
                  )
              );

              If(
                  !IsBlank(varPunchDashboardContractVersion) &&
                  !StartsWith(
                      varPunchDashboardContractVersion,
                      "3."
                  ),

                  Set(
                      varPunchDashboardError,
                      "Unsupported Punch Dashboard contract version: " &
                      varPunchDashboardContractVersion
                  )
              );


              // =====================================================
              // SNAPSHOT INFO
              // Contract v3 property: snapshotInfo
              // =====================================================

              ClearCollect(
                  colPunchDashboardSnapshotInfo,

                  ForAll(
                      Table(_bundle.snapshotInfo),

                      {
                          SnapshotRunId:
                              If(
                                  IsBlank(Text(Value.SnapshotRunId)) ||
                                  Lower(Text(Value.SnapshotRunId)) = "null",

                                  Blank(),

                                  Value(
                                      Text(Value.SnapshotRunId)
                                  )
                              ),

                          PreviousSnapshotRunId:
                              If(
                                  IsBlank(Text(Value.PreviousSnapshotRunId)) ||
                                  Lower(Text(Value.PreviousSnapshotRunId)) = "null",

                                  Blank(),

                                  Value(
                                      Text(Value.PreviousSnapshotRunId)
                                  )
                              ),

                          GeneratedOn:
                              If(
                                  IsBlank(Text(Value.GeneratedOn)) ||
                                  Lower(Text(Value.GeneratedOn)) = "null",

                                  Blank(),

                                  DateTimeValue(
                                      Text(Value.GeneratedOn)
                                  )
                              ),

                          SourcePunchCount:
                              Value(
                                  Coalesce(
                                      Text(Value.SourcePunchCount),
                                      "0"
                                  )
                              ),

                          DurationMs:
                              Value(
                                  Coalesce(
                                      Text(Value.DurationMs),
                                      "0"
                                  )
                              ),

                          DataVersion:
                              Coalesce(
                                  Text(Value.DataVersion),
                                  varPunchDashboardContractVersion,
                                  ""
                              )
                      }
                  )
              );


              // =====================================================
              // KPI SUMMARY
              // Contract v3 property: summary
              // =====================================================

              ClearCollect(
                  colPunchDashboardSummary,

                  ForAll(
                      Table(_bundle.summary),

                      {
                          StatusCode:
                              Upper(
                                  Trim(
                                      Coalesce(
                                          Text(Value.StatusCode),
                                          ""
                                      )
                                  )
                              ),

                          StatusName:
                              Coalesce(
                                  Text(Value.StatusName),
                                  Text(Value.StatusCode),
                                  "Unknown"
                              ),

                          StatusOrder:
                              Value(
                                  Coalesce(
                                      Text(Value.StatusOrder),
                                      "9999"
                                  )
                              ),

                          StatusColor:
                              Coalesce(
                                  Text(Value.StatusColor),
                                  "#64748B"
                              ),

                          PunchCount:
                              Value(
                                  Coalesce(
                                      Text(Value.PunchCount),
                                      "0"
                                  )
                              ),

                          PreviousPunchCount:
                              Value(
                                  Coalesce(
                                      Text(Value.PreviousPunchCount),
                                      Text(Value.PunchCount),
                                      "0"
                                  )
                              ),

                          Delta:
                              Value(
                                  Coalesce(
                                      Text(Value.Delta),
                                      "0"
                                  )
                              ),

                          DeltaPercent:
                              Value(
                                  Coalesce(
                                      Text(Value.DeltaPercent),
                                      "0"
                                  )
                              ),

                          Trend:
                              Coalesce(
                                  Text(Value.Trend),
                                  "Neutral"
                              )
                      }
                  )
              );


                              // =====================================================
                              // CATEGORY / STATUS MATRIX
                              // =====================================================

                              ClearCollect(
                                  colPunchDashboardMatrix,

                                  ForAll(
                                      Table(_bundle.matrix),

                                      {
                                          CategoryCode:
                                              Text(Value.CategoryCode),

                                          CategoryName:
                                              Text(Value.CategoryName),

                                          CategoryOrder:
                                              Value(
                                                  Coalesce(
                                                      Text(Value.CategoryOrder),
                                                      "0"
                                                  )
                                              ),

                                          StatusCode:
                                              Text(Value.StatusCode),

                                          StatusName:
                                              Text(Value.StatusName),

                                          StatusOrder:
                                              Value(
                                                  Coalesce(
                                                      Text(Value.StatusOrder),
                                                      "0"
                                                  )
                                              ),

                                          StatusColor:
                                              Coalesce(
                                                  Text(Value.StatusColor),
                                                  "#64748B"
                                              ),

                                          PunchCount:
                                              Value(
                                                  Coalesce(
                                                      Text(Value.PunchCount),
                                                      "0"
                                                  )
                                              ),

                                          Intensity:
                                              Value(
                                                  Coalesce(
                                                      Text(Value.Intensity),
                                                      "0"
                                                  )
                                              ),

                                          IntensityBand:
                                              Coalesce(
                                                  Text(Value.IntensityBand),
                                                  "NONE"
                                              )
                                      }
                                  )
                              );


                              // =====================================================
                              // TIMELINE
                              // =====================================================

                              ClearCollect(
                                  colPunchDashboardTimeline,

                                  ForAll(
                                      Table(_bundle.timeline),

                                      {
                                          SnapshotRunId:
                                              Value(
                                                  Coalesce(
                                                      Text(Value.SnapshotRunId),
                                                      "0"
                                                  )
                                              ),

                                          SnapshotDate:
                                              If(
                                                  IsBlank(
                                                      Text(Value.SnapshotDate)
                                                  ) ||
                                                  Text(Value.SnapshotDate) = "null",

                                                  Blank(),

                                                  DateTimeValue(
                                                      Text(Value.SnapshotDate)
                                                  )
                                              ),

                                          SnapshotSequence:
                                              Value(
                                                  Coalesce(
                                                      Text(Value.SnapshotSequence),
                                                      "0"
                                                  )
                                              ),

                                          OpenCount:
                                              Value(
                                                  Coalesce(
                                                      Text(Value.Open),
                                                      "0"
                                                  )
                                              ),

                                          ClearedCount:
                                              Value(
                                                  Coalesce(
                                                      Text(Value.Cleared),
                                                      "0"
                                                  )
                                              ),

                                          ClosedCount:
                                              Value(
                                                  Coalesce(
                                                      Text(Value.Closed),
                                                      "0"
                                                  )
                                              ),

                                          TotalCount:
                                              Value(
                                                  Coalesce(
                                                      Text(Value.Total),
                                                      "0"
                                                  )
                                              ),

                                          OpenDelta:
                                              Value(
                                                  Coalesce(
                                                      Text(Value.OpenDelta),
                                                      "0"
                                                  )
                                              ),

                                          OpenDeltaPercent:
                                              Value(
                                                  Coalesce(
                                                      Text(Value.OpenDeltaPercent),
                                                      "0"
                                                  )
                                              )
                                      }
                                  )
                              );


                              // =====================================================
                              // INSIGHTS
                              // =====================================================

                              ClearCollect(
                                  colPunchDashboardInsights,

                                  ForAll(
                                      Table(_bundle.insights),

                                      {
                                          InsightId:
                                              Value(
                                                  Coalesce(
                                                      Text(Value.InsightId),
                                                      "0"
                                                  )
                                              ),

                                          Priority:
                                              Value(
                                                  Coalesce(
                                                      Text(Value.Priority),
                                                      "99"
                                                  )
                                              ),

                                          Severity:
                                              Coalesce(
                                                  Text(Value.Severity),
                                                  "INFO"
                                              ),

                                          InsightType:
                                              Coalesce(
                                                  Text(Value.InsightType),
                                                  "GENERAL"
                                              ),

                                          Title:
                                              Coalesce(
                                                  Text(Value.Title),
                                                  "Executive insight"
                                              ),

                                          Message:
                                              Coalesce(
                                                  Text(Value.Message),
                                                  ""
                                              ),

                                          MetricValue:
                                              Value(
                                                  Coalesce(
                                                      Text(Value.MetricValue),
                                                      "0"
                                                  )
                                              ),

                                          MetricLabel:
                                              Coalesce(
                                                  Text(Value.MetricLabel),
                                                  ""
                                              ),

                                          StatusCode:
                                              Coalesce(
                                                  Text(Value.StatusCode),
                                                  ""
                                              ),

                                          CategoryCode:
                                              Coalesce(
                                                  Text(Value.CategoryCode),
                                                  ""
                                              ),

                                          SubsystemCode:
                                              Coalesce(
                                                  Text(Value.SubsystemCode),
                                                  ""
                                              ),

                                          SubcontractorId:
                                              Value(
                                                  Coalesce(
                                                      Text(Value.SubcontractorId),
                                                      "-1"
                                                  )
                                              ),

                                          DisciplineCode:
                                              Coalesce(
                                                  Text(Value.DisciplineCode),
                                                  ""
                                              )
                                      }
                                  )
                              );


                              // =====================================================
                              // SUBSYSTEM AGGREGATES
                              // =====================================================

                              ClearCollect(
                                  colPunchDashboardSubsystems,

                                  ForAll(
                                      Table(_bundle.subsystems),

                                      {
                                          SubsystemCode:
                                              Text(Value.SubsystemCode),

                                          SubsystemName:
                                              Text(Value.SubsystemName),

                                          CategoryCode:
                                              Text(Value.CategoryCode),

                                          CategoryName:
                                              Text(Value.CategoryName),

                                          StatusCode:
                                              Text(Value.StatusCode),

                                          StatusName:
                                              Text(Value.StatusName),

                                          StatusOrder:
                                              Value(
                                                  Coalesce(
                                                      Text(Value.StatusOrder),
                                                      "0"
                                                  )
                                              ),

                                          StatusColor:
                                              Coalesce(
                                                  Text(Value.StatusColor),
                                                  "#64748B"
                                              ),

                                          PunchCount:
                                              Value(
                                                  Coalesce(
                                                      Text(Value.PunchCount),
                                                      "0"
                                                  )
                                              )
                                      }
                                  )
                              );


                              // =====================================================
                              // SUBCONTRACTOR AGGREGATES
                              // Source for the executive heatmap.
                              // =====================================================

                              ClearCollect(
                                  colPunchDashboardSubcontractors,

                                  ForAll(
                                      Table(_bundle.subcontractors),

                                      {
                                          SubcontractorId:
                                              Value(
                                                  Coalesce(
                                                      Text(Value.SubcontractorId),
                                                      "-1"
                                                  )
                                              ),

                                          SubcontractorName:
                                              Coalesce(
                                                  Text(Value.SubcontractorName),
                                                  "No subcontractor"
                                              ),

                                          DisciplineCode:
                                              Coalesce(
                                                  Text(Value.DisciplineCode),
                                                  ""
                                              ),

                                          DisciplineName:
                                              Coalesce(
                                                  Text(Value.DisciplineName),
                                                  ""
                                              ),

                                          CategoryCode:
                                              Coalesce(
                                                  Text(Value.CategoryCode),
                                                  "NO_CATEGORY"
                                              ),

                                          CategoryName:
                                              Coalesce(
                                                  Text(Value.CategoryName),
                                                  Text(Value.CategoryCode),
                                                  "No category"
                                              ),

                                          StatusCode:
                                              Coalesce(
                                                  Text(Value.StatusCode),
                                                  ""
                                              ),

                                          StatusName:
                                              Coalesce(
                                                  Text(Value.StatusName),
                                                  Text(Value.StatusCode),
                                                  ""
                                              ),

                                          StatusOrder:
                                              Value(
                                                  Coalesce(
                                                      Text(Value.StatusOrder),
                                                      "0"
                                                  )
                                              ),

                                          StatusColor:
                                              Coalesce(
                                                  Text(Value.StatusColor),
                                                  "#64748B"
                                              ),

                                          PunchCount:
                                              Value(
                                                  Coalesce(
                                                      Text(Value.PunchCount),
                                                      "0"
                                                  )
                                              )
                                      }
                                  )
                              );


                              // =====================================================
                              // EXECUTIVE PUNCH ROWS
                              // Subcontractor fields are parsed when supplied by Bundle v4.
                              // =====================================================

                              ClearCollect(
                                  colPunchDashboardPunches,

                                  ForAll(
                                      Table(_bundle.punches),

                                      {
                                          PunchId:
                                              Value(
                                                  Coalesce(
                                                      Text(Value.PunchId),
                                                      "0"
                                                  )
                                              ),

                                          PunchCode:
                                              Coalesce(
                                                  Text(Value.PunchCode),
                                                  ""
                                              ),

                                          PunchDescription:
                                              Coalesce(
                                                  Text(Value.PunchDescription),
                                                  ""
                                              ),

                                          StatusCode:
                                              Coalesce(
                                                  Text(Value.StatusCode),
                                                  ""
                                              ),

                                          PunchStatus:
                                              Coalesce(
                                                  Text(Value.PunchStatus),
                                                  ""
                                              ),

                                          CategoryCode:
                                              Coalesce(
                                                  Text(Value.CategoryCode),
                                                  ""
                                              ),

                                          CategoryName:
                                              Coalesce(
                                                  Text(Value.CategoryName),
                                                  ""
                                              ),

                                          SubsystemCode:
                                              Coalesce(
                                                  Text(Value.SubsystemCode),
                                                  ""
                                              ),

                                          DisciplineCode:
                                              Coalesce(
                                                  Text(Value.DisciplineCode),
                                                  ""
                                              ),

                                          SubcontractorId:
                                              Value(
                                                  Coalesce(
                                                      Text(Value.SubcontractorId),
                                                      "-1"
                                                  )
                                              ),

                                          SubcontractorName:
                                              Coalesce(
                                                  Text(Value.SubcontractorName),
                                                  "No subcontractor"
                                              ),

                                          ResponsibleCompany:
                                              Coalesce(
                                                  Text(Value.ResponsibleCompany),
                                                  "Unassigned"
                                              ),

                                          ResponsiblePerson:
                                              Coalesce(
                                                  Text(Value.ResponsiblePerson),
                                                  "Unassigned"
                                              ),

                                          DueDate:
                                              If(
                                                  IsBlank(
                                                      Text(Value.DueDate)
                                                  ) ||
                                                  Text(Value.DueDate) = "null",

                                                  Blank(),

                                                  DateValue(
                                                      Text(Value.DueDate)
                                                  )
                                              ),

                                          PriorityCode:
                                              Coalesce(
                                                  Text(Value.PriorityCode),
                                                  "Normal"
                                              ),

                                          PriorityColor:
                                              Coalesce(
                                                  Text(Value.PriorityColor),
                                                  "#64748B"
                                              ),

                                          SourceOrder:
                                              Value(
                                                  Coalesce(
                                                      Text(Value.SourceOrder),
                                                      "0"
                                                  )
                                              )
                                      }
                                  )
                              );


                              // =====================================================
                              // EXECUTIVE GRID DEFAULTS
                              // =====================================================

                              Set(varPunchExecutiveGridPage, 1);

                              Set(
                                  varPunchExecutiveGridPageSize,
                                  Coalesce(
                                      varPunchExecutiveGridPageSize,
                                      25
                                  )
                              );

                              Set(
                                  varPunchExecutiveGridSortColumn,
                                  Coalesce(
                                      varPunchExecutiveGridSortColumn,
                                      "SourceOrder"
                                  )
                              );

                              Set(
                                  varPunchExecutiveGridSortDirection,
                                  Coalesce(
                                      varPunchExecutiveGridSortDirection,
                                      SortOrder.Ascending
                                  )
                              );

                              Set(
                                  varPunchExecutiveGridSelectedId,
                                  Blank()
                              );


                              // =====================================================
              // EXECUTIVE HEATMAP
              // X axis: Categories
              // Y axis: Subcontractors
              // Cell: OPEN punches for subcontractor × category
              // =====================================================


              // -----------------------------------------------------
              // SOURCE — OPEN PUNCHES ONLY
              // -----------------------------------------------------

              ClearCollect(
                  colPunchExecutiveHeatmapSource,

                  Filter(
                      colPunchDashboardSubcontractors,

                      Upper(
                          Trim(
                              Coalesce(
                                  StatusCode,
                                  ""
                              )
                          )
                      ) in [
                          "OPEN",
                          "O"
                      ] ||

                      Upper(
                          Trim(
                              Coalesce(
                                  StatusName,
                                  ""
                              )
                          )
                      ) = "OPEN"
                  )
              );


              // -----------------------------------------------------
              // X AXIS — CATEGORIES WITH OPEN PUNCHES
              // -----------------------------------------------------

              ClearCollect(
                  colPunchExecutiveHeatmapColumns,

                  SortByColumns(
                      AddColumns(
                          GroupBy(
                              colPunchExecutiveHeatmapSource,
                              CategoryCode,
                              CategoryRows
                          ),

                          CategoryName,
                              Coalesce(
                                  First(CategoryRows).CategoryName,
                                  CategoryCode,
                                  "No category"
                              ),

                          PunchCount,
                              Sum(
                                  CategoryRows,
                                  PunchCount
                              )
                      ),

                      "CategoryCode",
                      SortOrder.Ascending
                  )
              );


              // -----------------------------------------------------
              // Y AXIS — SUBCONTRACTORS WITH OPEN PUNCHES
              // -----------------------------------------------------

              ClearCollect(
                  colPunchExecutiveHeatmapRows,

                  SortByColumns(
                      AddColumns(
                          GroupBy(
                              colPunchExecutiveHeatmapSource,
                              SubcontractorId,
                              SubcontractorName,
                              SubcontractorRows
                          ),

                          PunchCount,
                              Sum(
                                  SubcontractorRows,
                                  PunchCount
                              )
                      ),

                      "PunchCount",
                      SortOrder.Descending
                  )
              );


              // -----------------------------------------------------
              // COMPLETE OPEN-PUNCH MATRIX
              // -----------------------------------------------------

              Clear(
                  colPunchExecutiveHeatmapCells
              );

              ForAll(
                  colPunchExecutiveHeatmapRows As _subcontractor,

                  ForAll(
                      colPunchExecutiveHeatmapColumns As _category,

                      Collect(
                          colPunchExecutiveHeatmapCells,

                          {
                              SubcontractorId:
                                  Value(
                                      _subcontractor.SubcontractorId
                                  ),

                              SubcontractorName:
                                  Coalesce(
                                      Text(
                                          _subcontractor.SubcontractorName
                                      ),
                                      "No subcontractor"
                                  ),

                              CategoryCode:
                                  Text(
                                      _category.CategoryCode
                                  ),

                              CategoryName:
                                  Coalesce(
                                      Text(
                                          _category.CategoryName
                                      ),
                                      Text(
                                          _category.CategoryCode
                                      ),
                                      "No category"
                                  ),

                              PunchCount:
                                  Sum(
                                      Filter(
                                          colPunchExecutiveHeatmapSource,

                                          Value(SubcontractorId) =
                                              Value(
                                                  _subcontractor.SubcontractorId
                                              ) &&

                                          CategoryCode =
                                              _category.CategoryCode
                                      ),

                                      PunchCount
                                  )
                          }
                      )
                  )
              );


              // -----------------------------------------------------
              // INITIAL OPEN-PUNCH CONTEXT
              // -----------------------------------------------------

              ClearCollect(
                  colPunchExecutiveSelection,

                  {
                      SelectedRow:
                          "All subcontractors",

                      SelectedColumn:
                          "All categories",

                      PunchCount:
                          Sum(
                              colPunchExecutiveHeatmapCells,
                              PunchCount
                          ),

                      PercentOfTotal:
                          100,

                      PercentOfRow:
                          100,

                      IsSelection:
                          false
                  }
              );

              Select(btnHome_BuildPunchPresentationModel);

              // -----------------------------------------------------
              // INITIAL STATUS DISTRIBUTION
              // Heatmap scope is OPEN only.
              // -----------------------------------------------------

              ClearCollect(
                  colPunchExecutiveDistribution,

                  {
                      StatusCode:
                          "OPEN",

                      StatusName:
                          "OPEN",

                      StatusOrder:
                          1,

                      StatusColor:
                          Coalesce(
                              LookUp(
                                  colPunchExecutiveHeatmapSource,
                                  !IsBlank(StatusColor),
                                  StatusColor
                              ),
                              "#64748B"
                          ),

                      PunchCount:
                          Sum(
                              colPunchExecutiveHeatmapSource,
                              PunchCount
                          )
                  }
              );

                              // =====================================================
                              // DEFAULT STATUS DISTRIBUTION
                              //
                              // Before selecting a heatmap cell, the donut shows
                              // the complete dashboard distribution by status.
                              // =====================================================

                              ClearCollect(
                                  colPunchExecutiveDistribution,

                                  SortByColumns(
                                      AddColumns(
                                          GroupBy(
                                              colPunchDashboardSubcontractors,
                                              StatusCode,
                                              StatusRows
                                          ),

                                          StatusName,
                                              First(StatusRows).StatusName,

                                          StatusOrder,
                                              First(StatusRows).StatusOrder,

                                          StatusColor,
                                              First(StatusRows).StatusColor,

                                          PunchCount,
                                              Sum(
                                                  StatusRows,
                                                  PunchCount
                                              )
                                      ),

                                      "StatusOrder",
                                      SortOrder.Ascending
                                  )
                              );


                              // =====================================================
                              // DEFAULT ANALYTICAL SELECTION
                              // =====================================================

                              ClearCollect(
                                  colPunchExecutiveSelection,

                                  {
                                      SelectedRow:
                                          "All subcontractors",

                                      SelectedColumn:
                                          "All categories",

                                      PunchCount:
                                          Sum(
                                              colPunchExecutiveHeatmapCells,
                                              PunchCount
                                          ),

                                      PercentOfTotal:
                                          100,

                                      PercentOfRow:
                                          100,

                                      IsSelection:
                                          false
                                  }
                              )
                          );

                          true
                      ),

                      Set(
                          varPunchDashboardError,
                          FirstError.Message
                      );

                      false
                  )
              );


              // =====================================================
              // FINAL SNAPSHOT STATE
              // =====================================================

              Set(
                  varPunchDashboardSnapshotId,

                  If(
                      CountRows(
                          colPunchDashboardSnapshotInfo
                      ) > 0,

                      First(
                          colPunchDashboardSnapshotInfo
                      ).SnapshotRunId,

                      Blank()
                  )
              );

              Set(
                  varPunchDashboardLastRefresh,

                  If(
                      CountRows(
                          colPunchDashboardSnapshotInfo
                      ) > 0,

                      First(
                          colPunchDashboardSnapshotInfo
                      ).GeneratedOn,

                      Blank()
                  )
              );

              Set(
                  varPunchDashboardLoaded,
                  IsBlank(varPunchDashboardError)
              );

              Set(
                  varPunchDashboardLoading,
                  false
              );

              Set(
                  varExecutiveDashboardCompletedAt,
                  Now()
              );

              Set(
                  varExecutiveDashboardStatus,

                  If(
                      IsBlank(varPunchDashboardError),
                      "READY",
                      "ERROR"
                  )
              );

              Set(
                  varExecutiveDashboardError,
                  Coalesce(
                      varPunchDashboardError,
                      ""
                  )
              );

              If(
                  !IsBlank(varPunchDashboardError),

                  Notify(
                      "Punch Dashboard could not be loaded: " &
                      varPunchDashboardError,

                      NotificationType.Error
                  )
              );


              // =====================================================
              // RELEASE GLOBAL LOADING STATE
              // =====================================================

              Set(varGlobalLoading, false);
              Set(varGlobalLoadingMsg, "");
              Set(varGlobalLoadingSubMsg, "");
              Set(varGlobalLoadingScope, "");
              Set(varGlobalLoadAction, "");
              Set(varGlobalLoadPending, false);

              Set(varPunchDashboardLoading, false);
              Set(varProjectSwitching, false);
            Visible: =false
            X: =180
            Y: =180
      - btnHome_OpenNodeOperations_2:
          Control: ModernButton@1.0.0
          Properties:
            OnSelect: |-
              =

              If(
                  IsBlank(varSelectedHiveSubsystem.SubsystemCode),

                  Notify("Select a pending subsystem first.", NotificationType.Warning),

                  Set(varTasks_ReturnView, "Home");
                  Set(varTasks_ContextSource, "Hive");

                  Set(varTasks_Filter_Subsystem, Text(varSelectedHiveSubsystem.SubsystemCode));
                  Set(varFilter_ElementDiscipline, Text(varSelectedHiveSubsystem.Discipline));
                  Set(varFilter_Subcontractor, "");

                  Set(varTasks_Page, 1);
                  Set(varTasks_PageSize, 50);
                  Set(varTasks_HasSearched, true);

                  Set(varApplySubsystemDefault, true);
                  Set(varTasks_AutoLoad, true);

                  Clear(colTasks);

                  Set(varGlobalLoading, false);
                  Set(varGlobalLoadingMsg, "");
                  Set(varGlobalLoadingSubMsg, "");
                  Set(varGlobalLoadingScope, "");
                  Set(varGlobalLoadAction, "");
                  Set(varGlobalLoadPending, false);

                  Set(varAppView, "Tasks");
                  Set(varPageKey, "TASKS");
                  Set(varPageTitle, "Tasks");
                  Set(varPageSubtitle, "Inspection task management");

                  Navigate(scr_Tasks, ScreenTransition.None)
              )
            Visible: =false
            X: =140
            Y: =140
      - btnHome_LoadPendingSubsystems_2:
          Control: ModernButton@1.0.0
          Properties:
            OnSelect: |-
              =

              If(
                  IsBlank(varProjectId) || IsBlank(varSelectedHiveNode.Discipline),

                  Clear(colHomePendingSubsystems);
                  Clear(colHomePendingSubsystems_Staging);

                  Set(varPendingSubsystemsLoading, false);
                  Set(varHomePendingError, "");

                  Exit()
              );

              If(
                  varPendingSubsystemsLoading,
                  Exit()
              );

              Set(varPendingSubsystemsLoading, true);
              Set(varHomePendingError, "");

              Clear(colHomePendingSubsystems);
              Clear(colHomePendingSubsystems_Staging);

              IfError(
                  With(
                      {
                          _resp:
                              Warroom_GetPendingSubsystemsByDiscipline.Run(
                                  varProjectId,
                                  varSelectedHiveNode.Discipline
                              )
                      },

                      ClearCollect(
                          colHomePendingSubsystems_Staging,
                          ForAll(
                              Table(ParseJSON(Coalesce(_resp.result, "[]"))),
                              With(
                                  { r: ThisRecord.Value },
                                  {
                                      RowNo:
                                          If(
                                              IsBlank(Text(r.RowNo)) || Text(r.RowNo) = "null",
                                              0,
                                              Value(Text(r.RowNo))
                                          ),

                                      SubsystemCode: Text(r.SubsystemCode),
                                      Discipline: Text(r.Discipline),

                                      Total:
                                          If(
                                              IsBlank(Text(r.Total)) || Text(r.Total) = "null",
                                              0,
                                              Value(Text(r.Total))
                                          ),

                                      Done:
                                          If(
                                              IsBlank(Text(r.Done)) || Text(r.Done) = "null",
                                              0,
                                              Value(Text(r.Done))
                                          ),

                                      Remaining:
                                          If(
                                              IsBlank(Text(r.Remaining)) || Text(r.Remaining) = "null",
                                              0,
                                              Value(Text(r.Remaining))
                                          ),

                                      Progress:
                                          If(
                                              IsBlank(Text(r.Progress)) || Text(r.Progress) = "null",
                                              0,
                                              Value(Text(r.Progress))
                                          ),

                                      ProgressStatus: Text(r.ProgressStatus),

                                      ProgressColor:
                                          Switch(
                                              Text(r.ProgressStatus),
                                              "Excellent", "#22C55E",
                                              "Good", "#F59E0B",
                                              "In Progress", "#00C8FF",
                                              "Delayed", "#EF4444",
                                              "#64748B"
                                          )
                                  }
                              )
                          )
                      )
                  ),

                  Set(varHomePendingError, FirstError.Message)
              );

              If(
                  IsBlank(varHomePendingError),

                  ClearCollect(
                      colHomePendingSubsystems,
                      SortByColumns(
                          colHomePendingSubsystems_Staging,
                          "RowNo",
                          SortOrder.Ascending
                      )
                  ),

                  Notify(
                      "Pending subsystems could not be loaded.",
                      NotificationType.Warning
                  )
              );

              Set(varPendingSubsystemsLoading, false)
            Visible: =false
            X: =80
            Y: =80
      - btnHome_LoadHive_2:
          Control: ModernButton@1.0.0
          Properties:
            OnSelect: |-
              =

              Set(varGlobalLoading, true);
              Set(
                  varGlobalLoadingMsg,
                  If(varHomeDashboard = "TASKS", "Loading Tasks Dashboard...", "Loading Home...")
              );
              Set(
                  varGlobalLoadingSubMsg,
                  If(
                      varHomeDashboard = "TASKS",
                      "Preparing discipline and subsystem overview",
                      "Loading selected project dashboard"
                  )
              );
              Set(varGlobalLoadingScope, "HOME");

              If(
                  IsBlank(varProjectId),

                  Notify("Please select a project first.", NotificationType.Warning);

                  Set(varHomeLoading, false);
                  Set(varProjectSwitching, false);
                  Set(varGlobalLoading, false);
                  Set(varGlobalLoadingMsg, "");
                  Set(varGlobalLoadingSubMsg, "");
                  Set(varGlobalLoadingScope, "");
                  Set(varGlobalLoadAction, "");
                  Set(varGlobalLoadPending, false);

                  //Exit()
              );

              If(
                  varHomeLoading,

                  Exit()
              );

              Set(varHomeLoading, true);
              Set(varProjectSwitching, true);
              Set(varHomeError, "");
              Set(varHomeNoData, false);
              Set(varProjectHasHomeData, false);
              Set(varProjectHasReportConfig, false);

              Set(varHomeShowOverview, false);
              Set(varHomeShowCards, false);
              Set(varHomeShowRightPanel, false);

              Clear(colHomeHiveNodes);
              Clear(colHomeHiveNodesSorted);
              Clear(colHomeLowestProgress);

              Clear(colHomeHiveNodes_Staging);
              Clear(colHomeHiveNodesSorted_Staging);
              Clear(colHomeLowestProgress_Staging);

              IfError(
                  With(
                      {
                          _resp: Warroom_GetHiveNodesByDiscipline.Run(varProjectId)
                      },
                      With(
                          {
                              _obj: ParseJSON(Coalesce(_resp.result, "{}"))
                          },

                          If(
                              Text(_obj.success) = "false",

                              Set(varHomeNoData, true);
                              Set(varProjectHasHomeData, false);
                              Set(varHomeHiveLoaded, false);
                              Set(varProjectHasReportConfig, false);

                              Set(varHomeShowOverview, false);
                              Set(varHomeShowCards, false);
                              Set(varHomeShowRightPanel, true);

                              Set(
                                  varAppWarning,
                                  Coalesce(
                                      Text(_obj.message),
                                      "This project has no published report configuration yet."
                                  )
                              ),

                              ClearCollect(
                                  colHomeHiveNodes_Staging,
                                  ForAll(
                                      Table(_obj.result),
                                      With(
                                          { r: ThisRecord.Value },
                                          {
                                              NodeId: Text(r.NodeId),
                                              NodeNo: Text(r.NodeNo),
                                              NodeTitle: Text(r.NodeTitle),
                                              NodeSubtitle: Text(r.NodeSubtitle),
                                              Discipline: Text(r.Discipline),
                                              SubsystemCode: Coalesce(Text(r.SubsystemCode), Text(r.Discipline)),

                                              Total:
                                                  If(
                                                      IsBlank(Text(r.Total)) || Text(r.Total) = "null",
                                                      0,
                                                      Value(Text(r.Total))
                                                  ),

                                              Done:
                                                  If(
                                                      IsBlank(Text(r.Done)) || Text(r.Done) = "null",
                                                      0,
                                                      Value(Text(r.Done))
                                                  ),

                                              Remaining:
                                                  If(
                                                      IsBlank(Text(r.Remaining)) || Text(r.Remaining) = "null",
                                                      0,
                                                      Value(Text(r.Remaining))
                                                  ),

                                              Progress:
                                                  If(
                                                      IsBlank(Text(r.Progress)) || Text(r.Progress) = "null",
                                                      0,
                                                      Value(Text(r.Progress))
                                                  ),

                                              ProgressStatus: Text(r.ProgressStatus),

                                              SortOrder:
                                                  If(
                                                      IsBlank(Text(r.SortOrder)) || Text(r.SortOrder) = "null",
                                                      0,
                                                      Value(Text(r.SortOrder))
                                                  ),

                                              ProgressColor:
                                                  Switch(
                                                      Text(r.ProgressStatus),
                                                      "Excellent", "#22C55E",
                                                      "Good", "#F59E0B",
                                                      "In Progress", "#00C8FF",
                                                      "Delayed", "#EF4444",
                                                      "#64748B"
                                                  )
                                          }
                                      )
                                  )
                              );

                              ClearCollect(
                                  colHomeHiveNodesSorted_Staging,
                                  SortByColumns(
                                      colHomeHiveNodes_Staging,
                                      "SortOrder",
                                      SortOrder.Ascending
                                  )
                              );

                              ClearCollect(
                                  colHomeLowestProgress_Staging,
                                  FirstN(
                                      SortByColumns(
                                          colHomeHiveNodes_Staging,
                                          "Progress",
                                          SortOrder.Ascending,
                                          "Remaining",
                                          SortOrder.Descending
                                      ),
                                      3
                                  )
                              )
                          )
                      )
                  ),

                  Set(varHomeError, FirstError.Message)
              );

              If(
                  !IsBlank(varHomeError),

                  Set(varHomeNoData, true);
                  Set(varProjectHasHomeData, false);
                  Set(varProjectHasReportConfig, false);
                  Set(varHomeHiveLoaded, false);

                  Set(varHomeShowOverview, false);
                  Set(varHomeShowCards, false);
                  Set(varHomeShowRightPanel, true);

                  Notify(
                      "Home dashboard could not be loaded for this project.",
                      NotificationType.Warning
                  ),

                  If(
                      CountRows(colHomeHiveNodes_Staging) = 0,

                      Set(varHomeNoData, true);
                      Set(varProjectHasHomeData, false);
                      Set(varProjectHasReportConfig, false);
                      Set(varHomeHiveLoaded, false);

                      Set(varHomeShowOverview, false);
                      Set(varHomeShowCards, false);
                      Set(varHomeShowRightPanel, true);

                      If(
                          IsBlank(varAppWarning),
                          Set(
                              varAppWarning,
                              "This project has no published report configuration yet."
                          )
                      ),

                      ClearCollect(colHomeHiveNodes, colHomeHiveNodes_Staging);
                      ClearCollect(colHomeHiveNodesSorted, colHomeHiveNodesSorted_Staging);
                      ClearCollect(colHomeLowestProgress, colHomeLowestProgress_Staging);

                      Set(varHomeNoData, false);
                      Set(varProjectHasHomeData, true);
                      Set(varProjectHasReportConfig, true);
                      Set(varHomeHiveLoaded, true);

                      Set(varHomeShowOverview, true);
                      Set(varHomeShowCards, true);
                      Set(varHomeShowRightPanel, true);

                      Set(varHomeLastRefresh, Now())
                  )
              );

              Set(varHomeLoading, false);
              Set(varProjectSwitching, false);
              Set(varExecutiveDashboardCompletedAt, Now());
              Set(
                  varExecutiveDashboardStatus,
                  If(IsBlank(varHomeError) && IsBlank(varAppError), "READY", "ERROR")
              );
              Set(varExecutiveDashboardError, Coalesce(varHomeError, varAppError, ""));
              Set(varGlobalLoading, false);
              Set(varGlobalLoadingMsg, "");
              Set(varGlobalLoadingSubMsg, "");
              Set(varGlobalLoadingScope, "");
              Set(varGlobalLoadAction, "");
              Set(varGlobalLoadPending, false)
            Visible: =false
            X: =60
            Y: =60
      - btnHome_ProjectChange_Commit_2:
          Control: ModernButton@1.0.0
          Properties:
            OnSelect: "=\nIf(\n    IsBlank(varPendingProjectId),\n\n    Notify(\n        \"No pending project selected.\",\n        NotificationType.Warning\n    );\n\n    Set(varProjectSwitching, false);\n    Set(varHomeLoading, false);\n    Set(varPunchDashboardLoading, false);\n\n    Set(varGlobalLoading, false);\n    Set(varGlobalLoadingMsg, \"\");\n    Set(varGlobalLoadingSubMsg, \"\");\n    Set(varGlobalLoadingScope, \"\");\n    Set(varGlobalLoadAction, \"\");\n    Set(varGlobalLoadPending, false);\n\n    \n);\n\n\n// Preserve the dashboard selected by the user.\nSet(\n    varHomeDashboardTarget,\n    If(\n        varHomeDashboard in [\"PUNCHES\", \"TASKS\"],\n        varHomeDashboard,\n        \"PUNCHES\"\n    )\n);\n\n\n// Resolve project.\nSet(\n    varSelectedProject,\n    LookUp(\n        colEnabledProjectsUI,\n        Value(ProjectId) =\n            Value(varPendingProjectId)\n    )\n);\n\n\nIf(\n    IsBlank(varSelectedProject) ||\n    IsBlank(varSelectedProject.ProjectId),\n\n    Notify(\n        \"Selected project was not found in the enabled projects list.\",\n        NotificationType.Error\n    );\n\n    Set(varProjectLoaded, false);\n    Set(varProjectId, Blank());\n    Set(varPendingProjectId, Blank());\n\n    Set(varProjectSwitching, false);\n    Set(varHomeLoading, false);\n    Set(varPunchDashboardLoading, false);\n\n    Set(varGlobalLoading, false);\n    Set(varGlobalLoadingMsg, \"\");\n    Set(varGlobalLoadingSubMsg, \"\");\n    Set(varGlobalLoadingScope, \"\");\n    Set(varGlobalLoadAction, \"\");\n    Set(varGlobalLoadPending, false);\n\n \n);\n\n\n// =====================================================\n// PROJECT CONTEXT\n// =====================================================\n\nSet(\n    varProjectId,\n    Value(varSelectedProject.ProjectId)\n);\n\nSet(\n    varProjectCode,\n    Text(varSelectedProject.ProjectCode)\n);\n\nSet(\n    varProjectName,\n    Text(varSelectedProject.ProjectName)\n);\n\nSet(\n    varProjectDescription,\n    Text(varSelectedProject.ProjectDescription)\n);\n\nSet(varProjectLoaded, true);\nSet(varPendingProjectId, Blank());\n\n\n// =====================================================\n// NAVIGATION\n// =====================================================\n\nSet(varAppView, \"Home\");\nSet(varPageKey, \"HOME\");\nSet(varPageTitle, \"Home\");\nSet(varPageSubtitle, \"Project command center\");\nSet(varHomeViewMode, \"DASHBOARD\");\n\nSet(\n    varHomeDashboard,\n    varHomeDashboardTarget\n);\n\n\n// =====================================================\n// ERROR RESET\n// =====================================================\n\nSet(varAppError, \"\");\nSet(varAppWarning, \"\");\nSet(varHomeError, \"\");\nSet(varOps_Error, \"\");\nSet(varCfg_Error, \"\");\nSet(varHomePendingError, \"\");\n\nSet(varExecutiveDashboardError, \"\");\nSet(varExecutiveDashboardStatus, \"LOADING\");\nSet(varExecutiveDashboardRequestedAt, Now());\nSet(varExecutiveAlertDismissed, false);\n\n\n// =====================================================\n// HOME / TASK DASHBOARD RESET\n// =====================================================\n\nSet(varProjectHasHomeData, false);\nSet(varProjectHasReportConfig, false);\nSet(varHomeHiveLoaded, false);\nSet(varHomeNoData, false);\n\nSet(varHomeShowOverview, false);\nSet(varHomeShowCards, false);\nSet(varHomeShowRightPanel, false);\n\nSet(\n    varSelectedHiveNode,\n    {\n        NodeId: \"\",\n        NodeNo: \"\",\n        NodeTitle: \"\",\n        NodeSubtitle: \"\",\n        Discipline: \"\",\n        SubsystemCode: \"\",\n        Total: 0,\n        Done: 0,\n        Remaining: 0,\n        Progress: 0,\n        ProgressStatus: \"\",\n        ProgressColor: \"\",\n        SortOrder: 0\n    }\n);\n\nSet(\n    varSelectedHiveSubsystem,\n    {\n        SubsystemCode: \"\",\n        Discipline: \"\",\n        Total: 0,\n        Done: 0,\n        Remaining: 0,\n        Progress: 0,\n        ProgressStatus: \"\",\n        ProgressColor: \"\"\n    }\n);\n\nClear(colHomeHiveNodes);\nClear(colHomeHiveNodesSorted);\nClear(colHomeLowestProgress);\nClear(colHomePendingSubsystems);\nClear(colHomePendingSubsystems_Staging);\n\n\n// =====================================================\n// DEPENDENT SCREEN COLLECTIONS\n// =====================================================\n\nClear(colTasks);\nClear(colTasks_Staging);\nClear(colPunches);\nClear(colPunches_Staging);\n\n\n// =====================================================\n// PUNCH DASHBOARD RESET\n// =====================================================\n\nSet(varPunchDashboardTemplateId, Blank());\nSet(varPunchDashboardLoaded, false);\nSet(varPunchDashboardLoading, false);\nSet(varPunchDashboardError, \"\");\nSet(varPunchDashboardMessage, \"\");\nSet(varPunchDashboardHasSnapshot, false);\nSet(varPunchDashboardSnapshotId, Blank());\nSet(varPunchDashboardLastRefresh, Blank());\n\nSet(varPunchDrillStatusCode, \"\");\nSet(varPunchDrillCategoryCode, \"\");\nSet(varPunchDrillSubsystemCode, \"\");\nSet(varPunchDrillSubcontractorId, -1);\nSet(varPunchDrillSubcontractorName, \"\");\nSet(varPunchDrillDisciplineCode, \"\");\n\nSet(varPunchExecutiveGridPage, 1);\nSet(varPunchExecutiveGridSelectedId, Blank());\n\nClear(colPunchDashboardSnapshotInfo);\nClear(colPunchDashboardSummary);\nClear(colPunchDashboardMatrix);\nClear(colPunchDashboardTimeline);\nClear(colPunchDashboardInsights);\nClear(colPunchDashboardSubsystems);\nClear(colPunchDashboardSubcontractors);\nClear(colPunchDashboardPunches);\n\nClear(colPunchExecutiveHeatmapRows);\nClear(colPunchExecutiveHeatmapColumns);\nClear(colPunchExecutiveHeatmapCells);\nClear(colPunchExecutiveDistribution);\nClear(colPunchExecutiveSelection);\nClear(colPunchExecutiveGridFiltered);\n\n\n// =====================================================\n// PUNCH FILTER CATALOG RESET\n// =====================================================\n\nSet(varPunchCatalogs_ProjectId, Blank());\n\nClear(colPunchSubsystems_Filter);\nClear(colPunchTemplates_Filter);\nClear(colPunchCategories_Filter);\nClear(colPunchStatuses_Filter);\nClear(colPunchDisciplines_Filter);\nClear(colPunchSubcontractors_Filter);\n\nSet(varPunchesLoaded, false);\nSet(varPunches_HasSearched, false);\nSet(varPunches_Page, 1);\nSet(varPunches_TotalPages, 0);\nSet(varPunches_TotalRows, 0);\n\n\n// =====================================================\n// SCHEDULE THE ACTIVE DASHBOARD\n// =====================================================\n\nSet(varProjectSwitching, true);\nSet(varHomeLoading, false);\nSet(varPunchDashboardLoading, false);\n\nSet(varGlobalLoading, true);\n\nSet(\n    varGlobalLoadingMsg,\n    If(\n        varHomeDashboardTarget = \"PUNCHES\",\n        \"Loading Punch Dashboard...\",\n        \"Loading Tasks Dashboard...\"\n    )\n);\n\nSet(\n    varGlobalLoadingSubMsg,\n    If(\n        varHomeDashboardTarget = \"PUNCHES\",\n        \"Loading selected project punch analytics\",\n        \"Loading selected project task overview\"\n    )\n);\n\nSet(varGlobalLoadingScope, \"HOME\");\n\nSet(\n    varGlobalLoadAction,\n    If(\n        varHomeDashboardTarget = \"PUNCHES\",\n        \"LOAD_PUNCH_DASHBOARD\",\n        \"LOAD_TASK_DASHBOARD\"\n    )\n);\n\nSet(varGlobalLoadPending, false);\nSet(varGlobalLoadPending, true)"
            Visible: =false
            X: =120
            Y: =120
      - btnHome_RequestDashboardLoad_1:
          Control: ModernButton@1.0.0
          Properties:
            OnSelect: |-
              =
              If(
                  IsBlank(varProjectId),

                  Notify(
                      "Please select a project first.",
                      NotificationType.Warning
                  );

                  Set(varGlobalLoading, false);
                  Set(varGlobalLoadingMsg, "");
                  Set(varGlobalLoadingSubMsg, "");
                  Set(varGlobalLoadingScope, "");
                  Set(varGlobalLoadAction, "");
                  Set(varGlobalLoadPending, false),

                  Set(varGlobalLoading, true);

              Set(
                  varGlobalLoadingMsg,
                  If(
                      Coalesce(varPunchDashboardForceRefresh, false),
                      "Refreshing Punch Dashboard...",
                      "Loading Punch Dashboard..."
                  )
              );

              Set(
                  varGlobalLoadingSubMsg,
                  If(
                      Coalesce(varPunchDashboardForceRefresh, false),
                      "Generating a new snapshot from current Punch data",
                      "Reading the latest available Punch snapshot"
                  )
              );
                  Set(varGlobalLoadingScope, "HOME");

                  Set(varHomeError, "");
                  Set(varPunchDashboardError, "");

                  Set(varExecutiveDashboardStatus, "LOADING");
                  Set(varExecutiveDashboardError, "");
                  Set(varExecutiveDashboardRequestedAt, Now());
                  Set(varExecutiveAlertDismissed, false);

                  Set(varProjectSwitching, false);

                  Set(
                      varGlobalLoadAction,
                      Switch(
                          varHomeDashboard,
                          "PUNCHES", "LOAD_PUNCH_DASHBOARD",
                          "TASKS", "LOAD_TASK_DASHBOARD",
                          "LOAD_PUNCH_DASHBOARD"
                      )
                  );

                  Set(varGlobalLoadPending, false);
                  Set(varGlobalLoadPending, true)
              )
            Visible: =false
            X: =140
            Y: =140
      - btnHome_BuildPunchPresentationModel:
          Control: ModernButton@1.0.0
          Properties:
            OnSelect: |-
              =// =====================================================
              // KPI CURRENT VALUES
              // =====================================================

              Set(
                  varHomePunchKpiTotal,
                  Sum(
                      colPunchDashboardSummary,
                      Coalesce(PunchCount, 0)
                  )
              );

              Set(
                  varHomePunchKpiOpen,
                  Sum(
                      Filter(
                          colPunchDashboardSummary,
                          Upper(Trim(Coalesce(StatusCode, ""))) in ["OPEN", "O"] ||
                          Upper(Trim(Coalesce(StatusName, ""))) = "OPEN"
                      ),
                      Coalesce(PunchCount, 0)
                  )
              );

              Set(
                  varHomePunchKpiClosed,
                  Sum(
                      Filter(
                          colPunchDashboardSummary,
                          Upper(Trim(Coalesce(StatusCode, ""))) in ["CLOSED", "CLOSE", "CL"] ||
                          Upper(Trim(Coalesce(StatusName, ""))) = "CLOSED"
                      ),
                      Coalesce(PunchCount, 0)
                  )
              );

              Set(
                  varHomePunchKpiCompletion,
                  Round(
                      100 *
                      varHomePunchKpiClosed /
                      Max(1, varHomePunchKpiTotal),
                      1
                  )
              );


              // =====================================================
              // NORMALIZED TIMELINE
              // =====================================================

              ClearCollect(
                  colHomePunchTimelineSorted,
                  SortByColumns(
                      colPunchDashboardTimeline,
                      "SnapshotSequence",
                      SortOrder.Ascending
                  )
              );

              ClearCollect(
                  colHomePunchKpiTrendTotal,
                  ForAll(
                      Sequence(CountRows(colHomePunchTimelineSorted)) As _point,
                      With(
                          {
                              _row:
                                  Last(
                                      FirstN(
                                          colHomePunchTimelineSorted,
                                          _point.Value
                                      )
                                  )
                          },
                          {
                              PointIndex: _point.Value,
                              PointValue: Coalesce(_row.TotalCount, 0)
                          }
                      )
                  )
              );

              ClearCollect(
                  colHomePunchKpiTrendOpen,
                  ForAll(
                      Sequence(CountRows(colHomePunchTimelineSorted)) As _point,
                      With(
                          {
                              _row:
                                  Last(
                                      FirstN(
                                          colHomePunchTimelineSorted,
                                          _point.Value
                                      )
                                  )
                          },
                          {
                              PointIndex: _point.Value,
                              PointValue: Coalesce(_row.OpenCount, 0)
                          }
                      )
                  )
              );

              ClearCollect(
                  colHomePunchKpiTrendClosed,
                  ForAll(
                      Sequence(CountRows(colHomePunchTimelineSorted)) As _point,
                      With(
                          {
                              _row:
                                  Last(
                                      FirstN(
                                          colHomePunchTimelineSorted,
                                          _point.Value
                                      )
                                  )
                          },
                          {
                              PointIndex: _point.Value,
                              PointValue: Coalesce(_row.ClosedCount, 0)
                          }
                      )
                  )
              );

              ClearCollect(
                  colHomePunchKpiTrendCompletion,
                  ForAll(
                      Sequence(CountRows(colHomePunchTimelineSorted)) As _point,
                      With(
                          {
                              _row:
                                  Last(
                                      FirstN(
                                          colHomePunchTimelineSorted,
                                          _point.Value
                                      )
                                  )
                          },
                          {
                              PointIndex: _point.Value,
                              PointValue:
                                  Round(
                                      100 *
                                      Coalesce(_row.ClosedCount, 0) /
                                      Max(1, Coalesce(_row.TotalCount, 0)),
                                      1
                                  )
                          }
                      )
                  )
              );


              // =====================================================
              // DELTAS BETWEEN THE LAST TWO SNAPSHOTS
              // =====================================================

              Set(
                  varHomePunchKpiHasPreviousSnapshot,
                  CountRows(colHomePunchTimelineSorted) >= 2
              );

              If(
                  varHomePunchKpiHasPreviousSnapshot,

                  With(
                      {
                          _current:
                              Last(colHomePunchTimelineSorted),

                          _previous:
                              Last(
                                  FirstN(
                                      colHomePunchTimelineSorted,
                                      CountRows(colHomePunchTimelineSorted) - 1
                                  )
                              )
                      },

                      Set(
                          varHomePunchKpiTotalDelta,
                          Coalesce(_current.TotalCount, 0) -
                          Coalesce(_previous.TotalCount, 0)
                      );

                      Set(
                          varHomePunchKpiOpenDelta,
                          Coalesce(_current.OpenCount, 0) -
                          Coalesce(_previous.OpenCount, 0)
                      );

                      Set(
                          varHomePunchKpiClosedDelta,
                          Coalesce(_current.ClosedCount, 0) -
                          Coalesce(_previous.ClosedCount, 0)
                      );

                      Set(
                          varHomePunchKpiCompletionDelta,
                          Round(
                              100 * Coalesce(_current.ClosedCount, 0) /
                                  Max(1, Coalesce(_current.TotalCount, 0)) -
                              100 * Coalesce(_previous.ClosedCount, 0) /
                                  Max(1, Coalesce(_previous.TotalCount, 0)),
                              1
                          )
                      )
                  ),

                  Set(varHomePunchKpiTotalDelta, 0);
                  Set(varHomePunchKpiOpenDelta, 0);
                  Set(varHomePunchKpiClosedDelta, 0);
                  Set(varHomePunchKpiCompletionDelta, 0)
              );


              // =====================================================
              // GLOBAL DONUT MODEL
              // =====================================================

              ClearCollect(
                  colHomePunchDonutItems,

                  ForAll(
                      SortByColumns(
                          colPunchDashboardSummary,
                          "StatusOrder",
                          SortOrder.Ascending
                      ) As _status,

                      {
                          SegmentKey:
                              Coalesce(
                                  _status.StatusCode,
                                  _status.StatusName,
                                  "UNKNOWN"
                              ),

                          SegmentLabel:
                              Coalesce(
                                  _status.StatusName,
                                  _status.StatusCode,
                                  "Unknown"
                              ),

                          SegmentValue:
                              Coalesce(_status.PunchCount, 0),

                          SegmentColor:
                              Coalesce(_status.StatusColor, "#64748B"),

                          SegmentOrder:
                              Coalesce(_status.StatusOrder, 9999)
                      }
                  )
              )
            Visible: =false
            X: =160
            Y: =160
      - btnHome_RebuildPunchGridView:
          Control: ModernButton@1.0.0
          Properties:
            OnSelect: |-
              =// =====================================================
              // NORMALIZE OPEN PUNCHES FROM THE CURRENT SERVER PAGE
              // =====================================================

              ClearCollect(
                  colHomePunchGridNormalized,

                  ForAll(
                      Filter(
                          colPunchExecutiveGridFiltered,

                          Upper(
                              Trim(
                                  Coalesce(
                                      PunchStatus,
                                      StatusName,
                                      StatusCode,
                                      ""
                                  )
                              )
                          ) in ["OPEN", "O"]
                      ) As _row,

                      {
                          RowIndex:
                              Coalesce(
                                  _row.SourceOrder,
                                  0
                              ),

                          RowKey:
                              Text(
                                  _row.PunchId
                              ),

                          PunchId:
                              Coalesce(
                                  _row.PunchCode,
                                  Text(_row.PunchId)
                              ),

                          Title:
                              Coalesce(
                                  _row.PunchDescription,
                                  ""
                              ),

                          Subsystem:
                              Coalesce(
                                  _row.CategoryName,
                                  _row.CategoryCode,
                                  "No category"
                              ) &
                              " · " &
                              Coalesce(
                                  _row.SubsystemCode,
                                  _row.SubsystemName,
                                  "No subsystem"
                              ) &
                              " · " &
                              Coalesce(
                                  _row.DisciplineName,
                                  _row.DisciplineCode,
                                  "No discipline"
                              ),

                          Discipline:
                              Coalesce(
                                  _row.DisciplineName,
                                  _row.DisciplineCode,
                                  "No discipline"
                              ),

                          DisciplineCode:
                              Upper(
                                  Trim(
                                      Coalesce(
                                          _row.DisciplineCode,
                                          _row.DisciplineName,
                                          "NO_DISCIPLINE"
                                      )
                                  )
                              ),

                          Priority:
                              Coalesce(
                                  _row.PriorityName,
                                  _row.PriorityCode,
                                  "—"
                              ),

                          Status:
                              "OPEN",

                          DueDateText:
                              If(
                                  IsBlank(_row.DueDate),

                                  "",

                                  Text(
                                      _row.DueDate,
                                      "[$-en-US]dd mmm yyyy"
                                  )
                              ),

                          IsOverdue:
                              !IsBlank(_row.DueDate) &&
                              DateValue(_row.DueDate) < Today(),

                          OwnerInitials:
                              Upper(
                                  Left(
                                      Trim(
                                          Coalesce(
                                              _row.ResponsiblePerson,
                                              _row.ResponsibleCompany,
                                              "—"
                                          )
                                      ),
                                      2
                                  )
                              ),

                          OwnerName:
                              Trim(
                                  Coalesce(
                                      _row.ResponsibleCompany,
                                      ""
                                  ) &

                                  If(
                                      !IsBlank(
                                          Trim(
                                              Coalesce(
                                                  _row.ResponsiblePerson,
                                                  ""
                                              )
                                          )
                                      ),

                                      If(
                                          !IsBlank(
                                              Trim(
                                                  Coalesce(
                                                      _row.ResponsibleCompany,
                                                      ""
                                                  )
                                              )
                                          ),
                                          " · ",
                                          ""
                                      ) &
                                      _row.ResponsiblePerson,

                                      ""
                                  )
                              ),

                          ProgressPct:
                              0
                      }
                  )
              );


              // =====================================================
              // PAGE-LOCAL SEARCH
              // THE DATASET ALWAYS CONTAINS OPEN PUNCHES ONLY
              // =====================================================

              With(
                  {
                      _search:
                          Lower(
                              Trim(
                                  Coalesce(
                                      varHomePunchSearchText,
                                      ""
                                  )
                              )
                          )
                  },
              With(
                  {
                      _selectedDiscipline:
                          Upper(
                              Trim(
                                  Coalesce(
                                      varHomePunchSelectedDisciplineCode,
                                      ""
                                  )
                              )
                          )
                  },

                  With(
                      {
                          _filtered:
                              Filter(
                                  colHomePunchGridNormalized,

                                  IsBlank(_selectedDiscipline) ||
                                  DisciplineCode = _selectedDiscipline
                              )
                      },

                      With(
                          {
                              _sorted:
                                  SortByColumns(
                                      _filtered,
                                      Coalesce(
                                          varHomePunchGridSortKey,
                                          "PunchId"
                                      ),
                                      If(
                                          Lower(
                                              Coalesce(
                                                  varHomePunchGridSortDirection,
                                                  "asc"
                                              )
                                          ) = "desc",
                                          SortOrder.Descending,
                                          SortOrder.Ascending
                                      )
                                  )
                          },

                          ClearCollect(
                              colHomePunchGridView,

                              ForAll(
                                  Sequence(CountRows(_sorted)) As _position,

                                  Patch(
                                      Last(
                                          FirstN(
                                              _sorted,
                                              _position.Value
                                          )
                                      ),
                                      {
                                          RowIndex: _position.Value
                                      }
                                  )
                              )
                          )
                      )
                  )
              )

              );


              // =====================================================
              // REMOVE A SELECTION THAT IS NO LONGER VISIBLE
              // =====================================================

              If(
                  !IsBlank(
                      varHomePunchGridSelectedKey
                  ) &&

                  IsBlank(
                      LookUp(
                          colHomePunchGridView,
                          RowKey = varHomePunchGridSelectedKey
                      )
                  ),

                  Set(
                      varHomePunchGridSelectedKey,
                      ""
                  )
              )
            Visible: =false
            X: =200
            Y: =200
