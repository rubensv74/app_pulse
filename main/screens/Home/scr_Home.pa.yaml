                        Width: =Parent.Width - 88
                        X: =88
                        Y: =98
                  - Rectangle6_8:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        DisabledFill: =RGBA(161, 159, 157, 1)
                        Fill: =varTheme_PulseBlue
                        FocusedBorderThickness: =4
                        Height: =4
                        HoverFill: =RGBA(0, 120, 212, 1)
                        PressedFill: =RGBA(0, 120, 212, 1)
                        Width: =90
                        X: =64
                        Y: =98
      - btnPunchExecutiveLoadCellDetails:
          Control: Classic/Button@2.2.0
          Properties:
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Fill: =Color.Transparent
            Height: =1
            OnSelect: |-
              =Set(varPunchExecutiveGridLoading, true);
              Set(varPunchExecutiveGridError, "");
              Set(varPunchExecutiveGridMessage, "Loading open punches...");
              Set(varPunchExecutiveGridSelectedId, Blank());
              Set(varPunchExecutiveGridLoadPending, false);

              Clear(colPunchExecutiveGridFiltered);
              Clear(colHomePunchGridNormalized);
              Clear(colHomePunchGridView);
              Clear(colPunchExecutiveDisciplineDistribution);
              Clear(colPunchExecutiveDonutItems);

              If(
                  IsBlank(varProjectId) ||
                  IsBlank(varPunchDashboardTemplateId) ||
                  IsBlank(varPunchDrillCategoryCode) ||
                  IsBlank(varPunchDrillSubcontractorId),

                  Set(
                      varPunchExecutiveGridError,
                      "The selected heatmap cell does not contain a valid project, template, subcontractor and category."
                  );

                  Set(varPunchExecutiveGridTotalRows, 0);
                  Set(varPunchExecutiveGridTotalPages, 0);
                  Set(varPunchExecutiveGridHasPreviousPage, false);
                  Set(varPunchExecutiveGridHasNextPage, false),

                  IfError(
                      With(
                          {
                              _response:
                                  warroom_GetPunchDashboardCellDetails.Run(
                                      Value(varProjectId),
                                      Value(varPunchDashboardTemplateId),
                                      Value(varPunchDrillSubcontractorId),
                                      Upper(
                                          Trim(
                                              Coalesce(
                                                  varPunchDrillCategoryCode,
                                                  "NO_CATEGORY"
                                              )
                                          )
                                      ),
                                      Max(
                                          1,
                                          Coalesce(
                                              varPunchExecutiveGridPage,
                                              1
                                          )
                                      ),
                                      Max(
                                          1,
                                          Coalesce(
                                              varPunchExecutiveGridPageSize,
                                              25
                                          )
                                      )
                                  )
                          },

                          With(
                              {
                                  _payload:
                                      ParseJSON(
                                          Coalesce(
                                              _response.result,
                                              "{}"
                                          )
                                      )
                              },

                              With(
                                  {
                                      _isSuccess:
                                          Lower(
                                              Coalesce(
                                                  Text(_payload.success),
                                                  "false"
                                              )
                                          ) = "true" ||
                                          Coalesce(
                                              Text(_payload.success),
                                              "0"
                                          ) = "1"
                                  },

                                  If(
                                      _isSuccess,

                                      // =====================================================
                                      // OPEN PUNCHES ONLY
                                      // =====================================================

                                      ClearCollect(
                                          colPunchExecutiveGridFiltered,

                                          ForAll(
                                              Filter(
                                                  Table(_payload.rows),

                                                  Upper(
                                                      Trim(
                                                          Coalesce(
                                                              Text(Value.PunchStatus),
                                                              Text(Value.StatusName),
                                                              Text(Value.StatusCode),
                                                              ""
                                                          )
                                                      )
                                                  ) in ["OPEN", "O"]
                                              ),

                                              {
                                                  SourceOrder:
                                                      Value(
                                                          Coalesce(
                                                              Text(Value.SourceOrder),
                                                              "0"
                                                          )
                                                      ),

                                                  PunchId:
                                                      Value(
                                                          Coalesce(
                                                              Text(Value.PunchId),
                                                              "0"
                                                          )
                                                      ),

                                                  ProjectId:
                                                      Value(
                                                          Coalesce(
                                                              Text(Value.ProjectId),
                                                              "0"
                                                          )
                                                      ),

                                                  TemplateId:
                                                      Value(
                                                          Coalesce(
                                                              Text(Value.TemplateId),
                                                              "0"
                                                          )
                                                      ),

                                                  PunchCode:
                                                      Coalesce(
                                                          Text(Value.PunchCode),
                                                          ""
                                                      ),

                                                  PunchDescription:
                                                      Coalesce(
                                                          Text(Value.PunchDescription),
                                                          ""
                                                      ),

                                                  PunchStatus:
                                                      "OPEN",

                                                  StatusCode:
                                                      Coalesce(
                                                          Text(Value.StatusCode),
                                                          "OPEN"
                                                      ),

                                                  StatusName:
                                                      Coalesce(
                                                          Text(Value.StatusName),
                                                          "OPEN"
                                                      ),

                                                  StatusColor:
                                                      Coalesce(
                                                          Text(Value.StatusColor),
                                                          "#F97316"
                                                      ),

                                                  CategoryCode:
                                                      Coalesce(
                                                          Text(Value.CategoryCode),
                                                          "NO_CATEGORY"
                                                      ),

                                                  CategoryName:
                                                      Coalesce(
                                                          Text(Value.CategoryName),
                                                          "No category"
                                                      ),

                                                  SubsystemCode:
                                                      Coalesce(
                                                          Text(Value.SubsystemCode),
                                                          "NO_SUBSYSTEM"
                                                      ),

                                                  SubsystemName:
                                                      Coalesce(
                                                          Text(Value.SubsystemName),
                                                          "No subsystem"
                                                      ),

                                                  DisciplineCode:
                                                      Upper(
                                                          Trim(
                                                              Coalesce(
                                                                  Text(Value.DisciplineCode),
                                                                  "NO_DISCIPLINE"
                                                              )
                                                          )
                                                      ),

                                                  DisciplineName:
                                                      Coalesce(
                                                          Text(Value.DisciplineName),
                                                          Text(Value.DisciplineCode),
                                                          "No discipline"
                                                      ),

                                                  SubcontractorId:
                                                      Value(
                                                          Coalesce(
                                                              Text(Value.SubcontractorId),
                                                              "-1"
                                                          )
                                                      ),

                                                  SubcontractorName:
                                                      Coalesce(
                                                          Text(Value.SubcontractorName),
                                                          "No subcontractor"
                                                      ),

                                                  ResponsibleCompany:
                                                      Coalesce(
                                                          Text(Value.ResponsibleCompany),
                                                          "No subcontractor"
                                                      ),

                                                  ResponsiblePerson:
                                                      Coalesce(
                                                          Text(Value.ResponsiblePerson),
                                                          "Unassigned"
                                                      ),

                                                  DueDate:
                                                      If(
                                                          IsBlank(Text(Value.DueDate)) ||
                                                          Lower(Text(Value.DueDate)) = "null",

                                                          Blank(),

                                                          DateTimeValue(
                                                              Text(Value.DueDate)
                                                          )
                                                      ),

                                                  PriorityCode:
                                                      Coalesce(
                                                          Text(Value.PriorityCode),
                                                          ""
                                                      ),

                                                  PriorityName:
                                                      Coalesce(
                                                          Text(Value.PriorityName),
                                                          Text(Value.PriorityCode),
                                                          ""
                                                      ),

                                                  PriorityColor:
                                                      Coalesce(
                                                          Text(Value.PriorityColor),
                                                          "#64748B"
                                                      ),

                                                  OriginatorCode:
                                                      Coalesce(
                                                          Text(Value.OriginatorCode),
                                                          ""
                                                      ),

                                                  Originator:
                                                      Coalesce(
                                                          Text(Value.Originator),
                                                          ""
                                                      ),

                                                  DepartmentActionCode:
                                                      Coalesce(
                                                          Text(Value.DepartmentActionCode),
                                                          ""
                                                      ),

                                                  DepartmentAction:
                                                      Coalesce(
                                                          Text(Value.DepartmentAction),
                                                          ""
                                                      ),

                                                  InspectionId:
                                                      Value(
                                                          Coalesce(
                                                              Text(Value.InspectionId),
                                                              "0"
                                                          )
                                                      ),

                                                  InspectionCode:
                                                      Coalesce(
                                                          Text(Value.InspectionCode),
                                                          ""
                                                      ),

                                                  InspectionName:
                                                      Coalesce(
                                                          Text(Value.InspectionName),
                                                          ""
                                                      ),

                                                  PunchLocation:
                                                      Coalesce(
                                                          Text(Value.PunchLocation),
                                                          ""
                                                      ),

                                                  CreatedAt:
                                                      If(
                                                          IsBlank(Text(Value.CreatedAt)) ||
                                                          Lower(Text(Value.CreatedAt)) = "null",

                                                          Blank(),

                                                          DateTimeValue(
                                                              Text(Value.CreatedAt)
                                                          )
                                                      ),

                                                  LastModifiedAt:
                                                      If(
                                                          IsBlank(Text(Value.LastModifiedAt)) ||
                                                          Lower(Text(Value.LastModifiedAt)) = "null",

                                                          Blank(),

                                                          DateTimeValue(
                                                              Text(Value.LastModifiedAt)
                                                          )
                                                      ),

                                                  IsClosed:
                                                      false,

                                                  IsLocked:
                                                      Lower(
                                                          Coalesce(
                                                              Text(Value.IsLocked),
                                                              "false"
                                                          )
                                                      ) = "true" ||
                                                      Coalesce(
                                                          Text(Value.IsLocked),
                                                          "0"
                                                      ) = "1"
                                              }
                                          )
                                      );


                                      // =====================================================
                                      // DISCIPLINE DISTRIBUTION
                                      // Use server aggregate when available.
                                      // Fall back to the returned OPEN page.
                                      // =====================================================

                                      With(
                                          {
                                              _serverDistribution:
                                                  Filter(
                                                      ForAll(
                                                          Table(
                                                              _payload.disciplineDistribution
                                                          ),

                                                          {
                                                              DisciplineCode:
                                                                  Upper(
                                                                      Trim(
                                                                          Coalesce(
                                                                              Text(
                                                                                  Value.DisciplineCode
                                                                              ),
                                                                              "NO_DISCIPLINE"
                                                                          )
                                                                      )
                                                                  ),

                                                              DisciplineName:
                                                                  Coalesce(
                                                                      Text(
                                                                          Value.DisciplineName
                                                                      ),
                                                                      Text(
                                                                          Value.DisciplineCode
                                                                      ),
                                                                      "No discipline"
                                                                  ),

                                                              PunchCount:
                                                                  Value(
                                                                      Coalesce(
                                                                          Text(
                                                                              Value.PunchCount
                                                                          ),
                                                                          "0"
                                                                      )
                                                                  ),

                                                              DisciplineColor:
                                                                  Switch(
                                                                      Upper(
                                                                          Trim(
                                                                              Coalesce(
                                                                                  Text(
                                                                                      Value.DisciplineCode
                                                                                  ),
                                                                                  "NO_DISCIPLINE"
                                                                              )
                                                                          )
                                                                      ),

                                                                      "MECHANICAL", "#2563EB",
                                                                      "MECH", "#2563EB",

                                                                      "ELECTRICAL", "#F97316",
                                                                      "ELEC", "#F97316",

                                                                      "INSTRUMENTATION", "#DC2626",
                                                                      "INSTR", "#DC2626",
                                                                      "I&C", "#7C3AED",
                                                                      "IC", "#7C3AED",

                                                                      "PIPING", "#14B8A6",
                                                                      "PIPE", "#14B8A6",

                                                                      "HVAC", "#0EA5E9",

                                                                      "CIVIL", "#A16207",
                                                                      "CIV", "#A16207",

                                                                      "STRUCTURAL", "#0F766E",
                                                                      "STR", "#0F766E",

                                                                      "COMMS", "#9333EA",
                                                                      "COMMUNICATIONS", "#9333EA",

                                                                      "FIRE & GAS", "#E11D48",
                                                                      "FIRE_AND_GAS", "#E11D48",

                                                                      "#64748B"
                                                                  )
                                                          }
                                                      ),

                                                      PunchCount > 0
                                                  )
                                          },

                                          ClearCollect(
                                              colPunchExecutiveDisciplineDistribution,

                                              SortByColumns(
                                                  If(
                                                      CountRows(
                                                          _serverDistribution
                                                      ) > 0,

                                                      _serverDistribution,

                                                      ForAll(
                                                          GroupBy(
                                                              colPunchExecutiveGridFiltered,
                                                              DisciplineCode,
                                                              DisciplineName,
                                                              DisciplineRows
                                                          ) As _discipline,

                                                          {
                                                              DisciplineCode:
                                                                  Coalesce(
                                                                      _discipline.DisciplineCode,
                                                                      "NO_DISCIPLINE"
                                                                  ),

                                                              DisciplineName:
                                                                  Coalesce(
                                                                      _discipline.DisciplineName,
                                                                      _discipline.DisciplineCode,
                                                                      "No discipline"
                                                                  ),

                                                              PunchCount:
                                                                  CountRows(
                                                                      _discipline.DisciplineRows
                                                                  ),

                                                              DisciplineColor:
                                                                  Switch(
                                                                      Upper(
                                                                          Trim(
                                                                              Coalesce(
                                                                                  _discipline.DisciplineCode,
                                                                                  "NO_DISCIPLINE"
                                                                              )
                                                                          )
                                                                      ),

                                                                      "MECHANICAL", "#2563EB",
                                                                      "MECH", "#2563EB",

                                                                      "ELECTRICAL", "#F97316",
                                                                      "ELEC", "#F97316",

                                                                      "INSTRUMENTATION", "#DC2626",
                                                                      "INSTR", "#DC2626",
                                                                      "I&C", "#7C3AED",
                                                                      "IC", "#7C3AED",

                                                                      "PIPING", "#14B8A6",
                                                                      "PIPE", "#14B8A6",

                                                                      "HVAC", "#0EA5E9",

                                                                      "CIVIL", "#A16207",
                                                                      "CIV", "#A16207",

                                                                      "STRUCTURAL", "#0F766E",
                                                                      "STR", "#0F766E",

                                                                      "COMMS", "#9333EA",
                                                                      "COMMUNICATIONS", "#9333EA",

                                                                      "FIRE & GAS", "#E11D48",
                                                                      "FIRE_AND_GAS", "#E11D48",

                                                                      "#64748B"
                                                                  )
                                                          }
                                                      )
                                                  ),

                                                  "PunchCount",
                                                  SortOrder.Descending
                                              )
                                          )
                                      );


                                      // =====================================================
                                      // DONUT MODEL
                                      // =====================================================

                                      ClearCollect(
                                          colPunchExecutiveDonutItems,

                                          ForAll(
                                              Sequence(
                                                  CountRows(
                                                      colPunchExecutiveDisciplineDistribution
                                                  )
                                              ) As _position,

                                              With(
                                                  {
                                                      _discipline:
                                                          Last(
                                                              FirstN(
                                                                  colPunchExecutiveDisciplineDistribution,
                                                                  _position.Value
                                                              )
                                                          )
                                                  },

                                                  {
                                                      SegmentKey:
                                                          Coalesce(
                                                              _discipline.DisciplineCode,
                                                              "NO_DISCIPLINE"
                                                          ),

                                                      SegmentLabel:
                                                          Coalesce(
                                                              _discipline.DisciplineName,
                                                              "No discipline"
                                                          ),

                                                      SegmentValue:
                                                          Coalesce(
                                                              _discipline.PunchCount,
                                                              0
                                                          ),

                                                      SegmentColor:
                                                          Coalesce(
                                                              _discipline.DisciplineColor,
                                                              "#64748B"
                                                          ),

                                                      SegmentOrder:
                                                          _position.Value
                                                  }
                                              )
                                          )
                                      );


                                      // =====================================================
                                      // SERVER PAGE METADATA
                                      // =====================================================

                                      Set(
                                          varPunchExecutiveGridPage,
                                          Max(
                                              1,
                                              Value(
                                                  Coalesce(
                                                      Text(_payload.pageNumber),
                                                      Text(varPunchExecutiveGridPage)
                                                  )
                                              )
                                          )
                                      );

                                      Set(
                                          varPunchExecutiveGridPageSize,
                                          Max(
                                              1,
                                              Value(
                                                  Coalesce(
                                                      Text(_payload.pageSize),
                                                      Text(varPunchExecutiveGridPageSize)
                                                  )
                                              )
                                          )
                                      );

                                      Set(
                                          varPunchExecutiveGridTotalRows,
                                          Max(
                                              CountRows(
                                                  colPunchExecutiveGridFiltered
                                              ),

                                              If(
                                                  CountRows(
                                                      colPunchExecutiveSelection
                                                  ) > 0,

                                                  Value(
                                                      First(
                                                          colPunchExecutiveSelection
                                                      ).PunchCount
                                                  ),

                                                  0
                                              ),

                                              Value(
                                                  Coalesce(
                                                      Text(_payload.totalRows),
                                                      "0"
                                                  )
                                              )
                                          )
                                      );

                                      Set(
                                          varPunchExecutiveGridTotalPages,
                                          If(
                                              varPunchExecutiveGridTotalRows = 0,
                                              0,
                                              RoundUp(
                                                  varPunchExecutiveGridTotalRows /
                                                  varPunchExecutiveGridPageSize,
                                                  0
                                              )
                                          )
                                      );

                                      Set(
                                          varPunchExecutiveGridHasPreviousPage,
                                          varPunchExecutiveGridPage > 1
                                      );

                                      Set(
                                          varPunchExecutiveGridHasNextPage,
                                          varPunchExecutiveGridPage <
                                          varPunchExecutiveGridTotalPages
                                      );

                                      Set(varPunchExecutiveGridError, "");

                                      Set(
                                          varPunchExecutiveGridMessage,
                                          Coalesce(
                                              Text(_payload.message),
                                              If(
                                                  CountRows(
                                                      colPunchExecutiveGridFiltered
                                                  ) = 0,
                                                  "No OPEN punches were returned for the selected cell.",
                                                  ""
                                              )
                                          )
                                      );

                                      Select(
                                          btnHome_RebuildPunchGridView
                                      ),

                                      // =====================================================
                                      // UNSUCCESSFUL SERVICE RESPONSE
                                      // =====================================================

                                      Clear(colPunchExecutiveGridFiltered);
                                      Clear(colHomePunchGridNormalized);
                                      Clear(colHomePunchGridView);
                                      Clear(colPunchExecutiveDisciplineDistribution);
                                      Clear(colPunchExecutiveDonutItems);

                                      Set(varPunchExecutiveGridTotalRows, 0);
                                      Set(varPunchExecutiveGridTotalPages, 0);
                                      Set(varPunchExecutiveGridHasPreviousPage, false);
                                      Set(varPunchExecutiveGridHasNextPage, false);

                                      Set(
                                          varPunchExecutiveGridError,
                                          Coalesce(
                                              Text(_payload.message),
                                              "The Punch detail service returned an unsuccessful response."
                                          )
                                      )
                                  )
                              )
                          )
                      ),

                      Clear(colPunchExecutiveGridFiltered);
                      Clear(colHomePunchGridNormalized);
                      Clear(colHomePunchGridView);
                      Clear(colPunchExecutiveDisciplineDistribution);
                      Clear(colPunchExecutiveDonutItems);

                      Set(varPunchExecutiveGridTotalRows, 0);
                      Set(varPunchExecutiveGridTotalPages, 0);
                      Set(varPunchExecutiveGridHasPreviousPage, false);
                      Set(varPunchExecutiveGridHasNextPage, false);

                      Set(
                          varPunchExecutiveGridError,
                          Coalesce(
                              FirstError.Message,
                              "Punch details could not be loaded."
                          )
                      )
                  )
              );

              Set(varPunchExecutiveGridLoading, false);
              Set(varPunchExecutiveGridLoadPending, false)
            Text: =""
            Visible: =false
            Width: =1
      - tmrPunchExecutiveGridLoadDelay:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =varPunchExecutiveGridLoadPending
            BorderColor: =RGBA(0, 120, 212, 1)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(242, 242, 241, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Duration: =100
            Fill: =RGBA(0, 120, 212, 1)
            Font: =Font.'Segoe UI'
            HoverBorderColor: =RGBA(16, 110, 190, 1)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(16, 110, 190, 1)
            OnTimerEnd: |-
              =Set(
                  varPunchExecutiveGridLoadPending,
                  false
              );

              Select(
                  btnPunchExecutiveLoadCellDetails
              )
            PressedBorderColor: =RGBA(16, 110, 190, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(16, 110, 190, 1)
            Visible: =false
            X: =40
            Y: =40
      - btnHome_ClearPunchGridUi:
          Control: ModernButton@1.0.0
          Properties:
            OnSelect: |+
              =Clear(colPunchExecutiveGridFiltered);
              Clear(colHomePunchGridNormalized);
              Clear(colHomePunchGridView);

              Set(varHomePunchSearchText, "");
              Set(varHomePunchQuickFilter, "ALL");
              Set(varHomePunchGridSelectedKey, "");
              Set(varHomePunchGridSortKey, "PunchId");
              Set(varHomePunchGridSortDirection, "asc");
              Set(varPunchExecutiveGridPage, 1);



            Visible: =false
            X: =220
            Y: =220
