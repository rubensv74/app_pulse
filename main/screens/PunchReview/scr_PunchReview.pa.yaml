                                                      Width: =1
                                                - btnPR_AddComment:
                                                    Control: Classic/Button@2.2.0
                                                    Properties:
                                                      Height: =1
                                                      OnSelect: |-
                                                        =
                                                        If(
                                                            IsBlank(varPunchReviewCurrentId),

                                                            Notify(
                                                                "Select a Punch before adding a comment.",
                                                                NotificationType.Information
                                                            ),

                                                            IsBlank(Trim(txtPR_NewComment.Text)),

                                                            Notify(
                                                                "Write a comment before submitting.",
                                                                NotificationType.Information
                                                            ),

                                                            IsBlank(varProjectId),

                                                            Notify(
                                                                "No active project is available.",
                                                                NotificationType.Error
                                                            ),

                                                            With(
                                                                {
                                                                    currentPunchId: varPunchReviewCurrentId,
                                                                    currentPunchCode:
                                                                        Coalesce(
                                                                            varPunchReviewCurrent.PunchCode,
                                                                            Text(varPunchReviewCurrentId)
                                                                        ),
                                                                    newComment: Trim(txtPR_NewComment.Text)
                                                                },

                                                                Set(varPunchReviewCommentsLoading, true);
                                                                Set(varPunchReviewCommentsError, "");

                                                                IfError(
                                                                    Warroom_AddTaskComment.Run(
                                                                        varProjectId,
                                                                        currentPunchId,
                                                                        newComment,
                                                                        User().Email,
                                                                        "PUNCH",
                                                                        User().FullName,
                                                                        "GENERAL"
                                                                    );

                                                                    Patch(
                                                                        colPunchReviewQueue,
                                                                        LookUp(
                                                                            colPunchReviewQueue,
                                                                            PunchIdNumber = currentPunchId
                                                                        ),
                                                                        {
                                                                            CommentCount:
                                                                                Coalesce(
                                                                                    varPunchReviewCurrent.CommentCount,
                                                                                    0
                                                                                ) + 1,
                                                                            LastCommentOn: Now()
                                                                        }
                                                                    );

                                                                    Set(
                                                                        varPunchReviewCurrent,
                                                                        LookUp(
                                                                            colPunchReviewQueue,
                                                                            PunchIdNumber = currentPunchId
                                                                        )
                                                                    );

                                                                    Collect(
                                                                        colPunchReviewSessionEvents,
                                                                        {
                                                                            EventKey: Text(GUID()),
                                                                            PunchIdNumber: currentPunchId,
                                                                            EventLabel:
                                                                                "Comment added to " &
                                                                                currentPunchCode,
                                                                            EventOn: Now(),
                                                                            EventBy: User().FullName,
                                                                            EventType: "COMMENT_ADDED"
                                                                        }
                                                                    );

                                                                    Reset(txtPR_NewComment);
                                                                    Set(varPunchReviewCommentsPage, 1);
                                                                    Set(varPunchReviewCommentsLoading, false);
                                                                    Select(btnPR_LoadComments);

                                                                    Notify(
                                                                        "Comment added successfully.",
                                                                        NotificationType.Success
                                                                    ),

                                                                    Set(
                                                                        varPunchReviewCommentsError,
                                                                        Coalesce(
                                                                            FirstError.Message,
                                                                            "The comment could not be added."
                                                                        )
                                                                    );
                                                                    Set(varPunchReviewCommentsLoading, false);

                                                                    Notify(
                                                                        varPunchReviewCommentsError,
                                                                        NotificationType.Error
                                                                    )
                                                                )
                                                            )
                                                        )
                                                      Text: =""
                                                      Visible: =false
                                                      Width: =1
