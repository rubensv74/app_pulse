ComponentDefinitions:
  cmp_DashboardSectionHeader:
    DefinitionType: CanvasComponent
    CustomProperties:
      Title:
        PropertyKind: Input
        DataType: Text
        Default: ="Section title"
      Subtitle:
        PropertyKind: Input
        DataType: Text
        Default: ="Supporting context"
      ActionText:
        PropertyKind: Input
        DataType: Text
        Default: ="View details"
      ShowAction:
        PropertyKind: Input
        DataType: Boolean
        Default: =false
      TextColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#0F172A")
      MutedTextColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#64748B")
      AccentColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#1677FF")
      OnAction:
        PropertyKind: Event
        ReturnType: None
        Default: =
    Properties:
      Width: =900
      Height: =54
    Children:
      - conDSH_Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            Width: =Parent.Width
          Children:
            - lblDSH_Title:
                Control: ModernText@1.0.0
                Properties:
                  Color: =cmp_DashboardSectionHeader.TextColor
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  Size: =16
                  Text: =cmp_DashboardSectionHeader.Title
                  Width: =Parent.Width-180
                  X: =0
                  Y: =4
            - lblDSH_Subtitle:
                Control: ModernText@1.0.0
                Properties:
                  Color: =cmp_DashboardSectionHeader.MutedTextColor
                  Height: =18
                  Size: =9
                  Text: =cmp_DashboardSectionHeader.Subtitle
                  Width: =Parent.Width-180
                  X: =0
                  Y: =31
            - btnDSH_Action:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =cmp_DashboardSectionHeader.AccentColor
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =1
                  Color: =cmp_DashboardSectionHeader.AccentColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  HoverFill: =ColorValue("#EFF6FF")
                  OnSelect: =cmp_DashboardSectionHeader.OnAction()
                  PressedFill: =ColorValue("#DBEAFE")
                  RadiusBottomLeft: =9
                  RadiusBottomRight: =9
                  RadiusTopLeft: =9
                  RadiusTopRight: =9
                  Size: =9
                  Text: =cmp_DashboardSectionHeader.ActionText
                  Visible: =cmp_DashboardSectionHeader.ShowAction
                  Width: =132
                  X: =Parent.Width-Self.Width
                  Y: =10
