ComponentDefinitions:
  cmp_DataTableProV2:
    DefinitionType: CanvasComponent
    CustomProperties:
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        DataType: Color
        Default: =ColorValue("#2563EB")
      AllMatchingSelectedIn:
        PropertyKind: Input
        DisplayName: AllMatchingSelectedIn
        Description: True when every record matching the current filters is selected, not only the visible page.
        DataType: Boolean
        Default: =false
      BackgroundColor:
        PropertyKind: Input
        DisplayName: BackgroundColor
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        DataType: Color
        Default: =ColorValue("#E2E8F0")
      BulkActionKeyOut:
        PropertyKind: Output
        DisplayName: BulkActionKeyOut
        Description: REVIEW, EXPORT or another bulk action key.
        DataType: Text
      ColumnActionOut:
        PropertyKind: Output
        DisplayName: ColumnActionOut
        Description: APPLY, RESET or CLOSE.
        DataType: Text
      ColumnToggleKeyOut:
        PropertyKind: Output
        DisplayName: ColumnToggleKeyOut
        Description: Column key requested for visibility toggle.
        DataType: Text
      Columns:
        PropertyKind: Input
        DisplayName: Columns
        Description: Column configuration table with Key, Label, IsVisible, IsLocked, Width, Sortable and Order.
        DataType: Table
        Default: |-
          =Table(
              {Key:"PunchId", Label:"Punch ID", IsVisible:true, IsLocked:true, Width:116, Sortable:true, Order:1},
              {Key:"Title", Label:"Title", IsVisible:true, IsLocked:true, Width:300, Sortable:true, Order:2},
              {Key:"Subsystem", Label:"Subsystem", IsVisible:true, IsLocked:false, Width:104, Sortable:true, Order:3},
              {Key:"Discipline", Label:"Discipline", IsVisible:true, IsLocked:false, Width:104, Sortable:true, Order:4},
              {Key:"Priority", Label:"Priority", IsVisible:true, IsLocked:false, Width:92, Sortable:true, Order:5},
              {Key:"Status", Label:"Status", IsVisible:true, IsLocked:false, Width:92, Sortable:true, Order:6},
              {Key:"DueDateText", Label:"Due Date", IsVisible:true, IsLocked:false, Width:108, Sortable:true, Order:7},
              {Key:"OwnerName", Label:"Owner", IsVisible:true, IsLocked:false, Width:152, Sortable:true, Order:8},
              {Key:"ProgressPct", Label:"Progress", IsVisible:true, IsLocked:false, Width:116, Sortable:true, Order:9}
          )
      ContextActionKeyOut:
        PropertyKind: Output
        DisplayName: ContextActionKeyOut
        DataType: Text
      ContextActions:
        PropertyKind: Input
        DisplayName: ContextActions
        Description: Context menu definitions with Key, Label, Tone, IsVisible and Order.
        DataType: Table
        Default: |-
          =Table(
              {Key:"OPEN", Label:"Open details", Tone:"primary", IsVisible:true, Order:1},
              {Key:"REVIEW", Label:"Mark as reviewed", Tone:"neutral", IsVisible:true, Order:2},
              {Key:"COMMENT", Label:"Add comment", Tone:"neutral", IsVisible:true, Order:3},
              {Key:"HISTORY", Label:"View history", Tone:"neutral", IsVisible:true, Order:4},
              {Key:"EXPORT", Label:"Export row", Tone:"neutral", IsVisible:true, Order:5}
          )
      ContextRowKeyOut:
        PropertyKind: Output
        DisplayName: ContextRowKeyOut
        DataType: Text
      CurrentPage:
        PropertyKind: Input
        DisplayName: CurrentPage
        Description: Current page, 1-based.
        DataType: Number
        Default: =1
      DangerColor:
        PropertyKind: Input
        DisplayName: DangerColor
        DataType: Color
        Default: =ColorValue("#EF4444")
      DensityIn:
        PropertyKind: Input
        DisplayName: DensityIn
        Description: Compact, Comfortable or Spacious.
        DataType: Text
        Default: ="Compact"
      EmptyText:
        PropertyKind: Input
        DisplayName: EmptyText
        DataType: Text
        Default: ="Adjust the filters or search criteria to see records here."
      EmptyTitle:
        PropertyKind: Input
        DisplayName: EmptyTitle
        DataType: Text
        Default: ="No punches found"
      IsLoading:
        PropertyKind: Input
        DisplayName: IsLoading
        DataType: Boolean
        Default: =false
      LoadingText:
        PropertyKind: Input
        DisplayName: LoadingText
        DataType: Text
        Default: ="Loading rows..."
      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        DataType: Color
        Default: =ColorValue("#64748B")
      OnBulkAction:
        PropertyKind: Event
        DisplayName: OnBulkAction
        ReturnType: None
        Default: =
      OnColumnAction:
        PropertyKind: Event
        DisplayName: OnColumnAction
        ReturnType: None
        Default: =
      OnColumnToggle:
        PropertyKind: Event
        DisplayName: OnColumnToggle
        ReturnType: None
        Default: =
      OnContextAction:
        PropertyKind: Event
        DisplayName: OnContextAction
        ReturnType: None
        Default: =
      OnPageChange:
        PropertyKind: Event
        DisplayName: OnPageChange
        ReturnType: None
        Default: =
      OnRowSelect:
        PropertyKind: Event
        DisplayName: OnRowSelect
        ReturnType: None
        Default: =
      OnRowsPerPage:
        PropertyKind: Event
        DisplayName: OnRowsPerPage
        Description: Opens or delegates the page-size selector.
        ReturnType: None
        Default: =
      OnSelectionAction:
        PropertyKind: Event
        DisplayName: OnSelectionAction
        Description: Handles visible-page, all-matching and clear selection commands.
        ReturnType: None
        Default: =
      OnSort:
        PropertyKind: Event
        DisplayName: OnSort
        ReturnType: None
        Default: =
      OnToggleRowSelect:
        PropertyKind: Event
        DisplayName: OnToggleRowSelect
        ReturnType: None
        Default: =
      PageRequestedOut:
        PropertyKind: Output
        DisplayName: PageRequestedOut
        Description: Requested page number.
        DataType: Number
      Rows:
        PropertyKind: Input
        DisplayName: Rows
        Description: Normalized rows already filtered, sorted and paginated by the consuming screen.
        DataType: Table
        Default: |-
          =Table(
              {
                  RowIndex:1,
                  RowKey:"PULSE-02457",
                  PunchId:"PULSE-02457",
                  Title:"Install missing support for pump P-102A",
                  Subsystem:"Mechanical",
                  Discipline:"Mechanical",
                  Priority:"Critical",
                  Status:"Open",
                  DueDateText:"May 10, 2024",
                  IsOverdue:true,
                  OwnerInitials:"RB",
                  OwnerName:"Robert Brown",
                  ProgressPct:20
              },
              {
                  RowIndex:2,
                  RowKey:"PULSE-02459",
                  PunchId:"PULSE-02459",
                  Title:"High temp alarm not functioning - AHU-07",
                  Subsystem:"HVAC",
                  Discipline:"Mechanical",
                  Priority:"High",
                  Status:"Open",
                  DueDateText:"May 12, 2024",
                  IsOverdue:true,
                  OwnerInitials:"MJ",
                  OwnerName:"Michael Johnson",
                  ProgressPct:35
              }
          )
      RowsPerPage:
        PropertyKind: Input
        DisplayName: RowsPerPage
        Description: Current page size.
        DataType: Number
        Default: =25
      SelectedKeys:
        PropertyKind: Input
        DisplayName: SelectedKeys
        Description: Single-column or normalized table containing RowKey for every selected record, including selections on other pages.
        DataType: Table
        Default: =FirstN(Table({RowKey:""}), 0)
      SelectedRowKeyIn:
        PropertyKind: Input
        DisplayName: SelectedRowKeyIn
        Description: Active row used by the details drawer or keyboard navigation.
        DataType: Text
        Default: =""
      SelectedRowKeyOut:
        PropertyKind: Output
        DisplayName: SelectedRowKeyOut
        DataType: Text
      SelectionActionOut:
        PropertyKind: Output
        DisplayName: SelectionActionOut
        Description: SELECT_VISIBLE, CLEAR_VISIBLE, SELECT_MATCHING or CLEAR_ALL.
        DataType: Text
      ShowBulkActions:
        PropertyKind: Input
        DisplayName: ShowBulkActions
        DataType: Boolean
        Default: =true
      ShowCheckboxes:
        PropertyKind: Input
        DisplayName: ShowCheckboxes
        DataType: Boolean
        Default: =true
      ShowColumnSelector:
        PropertyKind: Input
        DisplayName: ShowColumnSelector
        DataType: Boolean
        Default: =true
      ShowPagination:
        PropertyKind: Input
        DisplayName: ShowPagination
        DataType: Boolean
        Default: =true
      ShowRowActions:
        PropertyKind: Input
        DisplayName: ShowRowActions
        DataType: Boolean
        Default: =true
      ShowSelectAllMatching:
        PropertyKind: Input
        DisplayName: ShowSelectAllMatching
        Description: Offers selection of all filtered results after the visible page has been selected.
        DataType: Boolean
        Default: =true
      SortDirectionIn:
        PropertyKind: Input
        DisplayName: SortDirectionIn
        Description: asc or desc.
        DataType: Text
        Default: ="asc"
      SortDirectionOut:
        PropertyKind: Output
        DisplayName: SortDirectionOut
        DataType: Text
      SortKeyIn:
        PropertyKind: Input
        DisplayName: SortKeyIn
        Description: Current sort key.
        DataType: Text
        Default: ="PunchId"
      SortKeyOut:
        PropertyKind: Output
        DisplayName: SortKeyOut
        DataType: Text
      SuccessColor:
        PropertyKind: Input
        DisplayName: SuccessColor
        DataType: Color
        Default: =ColorValue("#10B981")
      SurfaceAltColor:
        PropertyKind: Input
        DisplayName: SurfaceAltColor
        DataType: Color
        Default: =ColorValue("#F8FAFC")
      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        DataType: Color
        Default: =ColorValue("#0F172A")
      ToggleRowKeyOut:
        PropertyKind: Output
        DisplayName: ToggleRowKeyOut
        DataType: Text
      TotalCount:
        PropertyKind: Input
        DisplayName: TotalCount
        Description: Total records matching the current filters.
        DataType: Number
        Default: =248
      TotalPages:
        PropertyKind: Input
        DisplayName: TotalPages
        Description: Total number of pages.
        DataType: Number
        Default: =10
      VisibleEnd:
        PropertyKind: Input
        DisplayName: VisibleEnd
        Description: Last result ordinal shown.
        DataType: Number
        Default: =25
      VisibleStart:
        PropertyKind: Input
        DisplayName: VisibleStart
        Description: First result ordinal shown.
        DataType: Number
        Default: =1
      WarningColor:
        PropertyKind: Input
        DisplayName: WarningColor
        DataType: Color
        Default: =ColorValue("#F59E0B")
    Properties:
      BulkActionKeyOut: =Coalesce(varDTP2_BulkActionKey, "")
      ColumnActionOut: =Coalesce(varDTP2_ColumnAction, "")
      ColumnToggleKeyOut: =Coalesce(varDTP2_ColumnToggleKey, "")
      ContextActionKeyOut: =Coalesce(varDTP2_ContextActionKey, "")
      ContextRowKeyOut: =Coalesce(varDTP2_ContextRowKey, "")
      Height: =408
      PageRequestedOut: =Coalesce(varDTP2_PageRequested, cmp_DataTableProV2.CurrentPage)
      SelectedRowKeyOut: =Coalesce(varDTP2_SelectedRowKey, cmp_DataTableProV2.SelectedRowKeyIn, "")
      SelectionActionOut: =Coalesce(varDTP2_SelectionAction, "")
      SortDirectionOut: =Coalesce(varDTP2_SortDirection, cmp_DataTableProV2.SortDirectionIn, "asc")
      SortKeyOut: =Coalesce(varDTP2_SortKey, cmp_DataTableProV2.SortKeyIn, "PunchId")
      ToggleRowKeyOut: =Coalesce(varDTP2_ToggleRowKey, "")
      Width: =1380
    Children:
      - conDTP2_Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =cmp_DataTableProV2.BorderColor
            BorderThickness: =1
            DropShadow: =DropShadow.Semilight
            Fill: =cmp_DataTableProV2.BackgroundColor
            Height: =Parent.Height
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Width: =Parent.Width
          Children:
            - rectDTP2_HeaderBg:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderStyle: =BorderStyle.None
                  Fill: =cmp_DataTableProV2.SurfaceAltColor
                  Height: =42
                  Width: =Parent.Width - 2
                  X: =1
                  Y: =1
            - btnDTP2_HeaderSelectAll:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =If(CountIf(cmp_DataTableProV2.Rows, RowKey in cmp_DataTableProV2.SelectedKeys.RowKey) > 0, cmp_DataTableProV2.AccentColor, cmp_DataTableProV2.BorderColor)
                  BorderThickness: =1
                  Color: =If(CountIf(cmp_DataTableProV2.Rows, RowKey in cmp_DataTableProV2.SelectedKeys.RowKey) > 0, Color.White, cmp_DataTableProV2.AccentColor)
                  DisplayMode: =If(cmp_DataTableProV2.IsLoading || CountRows(cmp_DataTableProV2.Rows) = 0, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =If(CountIf(cmp_DataTableProV2.Rows, RowKey in cmp_DataTableProV2.SelectedKeys.RowKey) > 0, cmp_DataTableProV2.AccentColor, cmp_DataTableProV2.BackgroundColor)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =18
                  HoverBorderColor: =cmp_DataTableProV2.AccentColor
                  HoverColor: =cmp_DataTableProV2.AccentColor
                  HoverFill: =ColorFade(cmp_DataTableProV2.AccentColor, 0.92)
                  OnSelect: |-
                    =
                    Set(
                        varDTP2_SelectionAction,
                        If(
                            CountRows(cmp_DataTableProV2.Rows) > 0 &&
                            CountIf(cmp_DataTableProV2.Rows, RowKey in cmp_DataTableProV2.SelectedKeys.RowKey) = CountRows(cmp_DataTableProV2.Rows),
                            "CLEAR_VISIBLE",
                            "SELECT_VISIBLE"
                        )
                    );
                    cmp_DataTableProV2.OnSelectionAction()
                  PressedBorderColor: =cmp_DataTableProV2.AccentColor
                  PressedColor: =Color.White
                  PressedFill: =cmp_DataTableProV2.AccentColor
                  RadiusBottomLeft: =4
                  RadiusBottomRight: =4
                  RadiusTopLeft: =4
                  RadiusTopRight: =4
                  Size: =8
                  Text: |-
                    =If(
                        CountRows(cmp_DataTableProV2.Rows) > 0 &&
                        CountIf(cmp_DataTableProV2.Rows, RowKey in cmp_DataTableProV2.SelectedKeys.RowKey) = CountRows(cmp_DataTableProV2.Rows),
                        "✓",
                        If(CountIf(cmp_DataTableProV2.Rows, RowKey in cmp_DataTableProV2.SelectedKeys.RowKey) > 0, "−", "")
                    )
                  Visible: =cmp_DataTableProV2.ShowCheckboxes
                  Width: =18
                  X: =12
                  Y: =12
            - btnDTP2_SortPunchId:
                Control: Classic/Button@2.2.0
                Properties:
                  Align: =Align.Left
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  Color: =cmp_DataTableProV2.TextColor
                  DisplayMode: =If(cmp_DataTableProV2.IsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =26
                  HoverBorderColor: =RGBA(0,0,0,0)
                  HoverColor: =cmp_DataTableProV2.AccentColor
                  HoverFill: =RGBA(0,0,0,0)
                  OnSelect: |-
                    =
                    Set(varDTP2_SortKey, "PunchId");
                    Set(varDTP2_SortDirection, If(cmp_DataTableProV2.SortKeyIn = "PunchId" && Lower(cmp_DataTableProV2.SortDirectionIn) = "asc", "desc", "asc"));
                    cmp_DataTableProV2.OnSort()
                  PaddingLeft: =0
                  PressedBorderColor: =RGBA(0,0,0,0)
                  PressedColor: =cmp_DataTableProV2.AccentColor
                  PressedFill: =RGBA(0,0,0,0)
                  Size: =9
                  Text: |-
                    =

                    Coalesce(
                        LookUp(
                            cmp_DataTableProV2.Columns,
                            Key = "PunchId"
                        ).Label,
                        "Punch ID"
                    ) &
                    If(
                        cmp_DataTableProV2.SortKeyIn = "PunchId",
                        "  " &
                        If(
                            Lower(cmp_DataTableProV2.SortDirectionIn) = "asc",
                            UniChar(8593),
                            UniChar(8595)
                        ),
                        ""
                    )
                  Visible: =Coalesce(LookUp(cmp_DataTableProV2.Columns, Key = "PunchId").IsVisible, true)
                  Width: =Coalesce(LookUp(cmp_DataTableProV2.Columns, Key = "PunchId").Width, 116)
                  X: =If(cmp_DataTableProV2.ShowCheckboxes, 42, 14)
                  Y: =8
            - btnDTP2_SortTitle:
                Control: Classic/Button@2.2.0
                Properties:
                  Align: =Align.Left
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  Color: =cmp_DataTableProV2.TextColor
                  DisplayMode: =If(cmp_DataTableProV2.IsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =26
                  HoverBorderColor: =RGBA(0,0,0,0)
                  HoverColor: =cmp_DataTableProV2.AccentColor
                  HoverFill: =RGBA(0,0,0,0)
                  OnSelect: |-
                    =
                    Set(varDTP2_SortKey, "Title");
                    Set(varDTP2_SortDirection, If(cmp_DataTableProV2.SortKeyIn = "Title" && Lower(cmp_DataTableProV2.SortDirectionIn) = "asc", "desc", "asc"));
                    cmp_DataTableProV2.OnSort()
                  PaddingLeft: =0
                  PressedBorderColor: =RGBA(0,0,0,0)
                  PressedColor: =cmp_DataTableProV2.AccentColor
                  PressedFill: =RGBA(0,0,0,0)
                  Size: =9
                  Text: =Coalesce(LookUp(cmp_DataTableProV2.Columns, Key = "Title").Label, "Title") & If(cmp_DataTableProV2.SortKeyIn = "Title", "  " & If(Lower(cmp_DataTableProV2.SortDirectionIn) = "asc", UniChar(8593), UniChar(8595)), "")
                  Visible: =Coalesce(LookUp(cmp_DataTableProV2.Columns, Key = "Title").IsVisible, true)
                  Width: =Coalesce(LookUp(cmp_DataTableProV2.Columns, Key = "Title").Width, 300)
                  X: =btnDTP2_SortPunchId.X + If(btnDTP2_SortPunchId.Visible, btnDTP2_SortPunchId.Width + 12, 0)
                  Y: =8
            - btnDTP2_SortSubsystem:
                Control: Classic/Button@2.2.0
                Properties:
                  Align: =Align.Left
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  Color: =cmp_DataTableProV2.TextColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =26
                  HoverColor: =cmp_DataTableProV2.AccentColor
                  HoverFill: =RGBA(0,0,0,0)
                  OnSelect: |-
                    =
                    Set(varDTP2_SortKey, "Subsystem");
                    Set(varDTP2_SortDirection, If(cmp_DataTableProV2.SortKeyIn = "Subsystem" && Lower(cmp_DataTableProV2.SortDirectionIn) = "asc", "desc", "asc"));
                    cmp_DataTableProV2.OnSort()
                  PaddingLeft: =0
                  PressedColor: =cmp_DataTableProV2.AccentColor
                  PressedFill: =RGBA(0,0,0,0)
                  Size: =9
                  Text: =Coalesce(LookUp(cmp_DataTableProV2.Columns, Key = "Subsystem").Label, "Subsystem") & If(cmp_DataTableProV2.SortKeyIn = "Subsystem", "  " & If(Lower(cmp_DataTableProV2.SortDirectionIn) = "asc", UniChar(8593), UniChar(8595)), "")
                  Visible: =Coalesce(LookUp(cmp_DataTableProV2.Columns, Key = "Subsystem").IsVisible, true)
                  Width: =Coalesce(LookUp(cmp_DataTableProV2.Columns, Key = "Subsystem").Width, 104)
                  X: =btnDTP2_SortTitle.X + If(btnDTP2_SortTitle.Visible, btnDTP2_SortTitle.Width + 12, 0)
                  Y: =8
            - btnDTP2_SortDiscipline:
                Control: Classic/Button@2.2.0
                Properties:
                  Align: =Align.Left
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  Color: =cmp_DataTableProV2.TextColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =26
                  HoverColor: =cmp_DataTableProV2.AccentColor
                  HoverFill: =RGBA(0,0,0,0)
                  OnSelect: |-
                    =
                    Set(varDTP2_SortKey, "Discipline");
                    Set(varDTP2_SortDirection, If(cmp_DataTableProV2.SortKeyIn = "Discipline" && Lower(cmp_DataTableProV2.SortDirectionIn) = "asc", "desc", "asc"));
                    cmp_DataTableProV2.OnSort()
                  PaddingLeft: =0
                  PressedColor: =cmp_DataTableProV2.AccentColor
                  PressedFill: =RGBA(0,0,0,0)
                  Size: =9
                  Text: =Coalesce(LookUp(cmp_DataTableProV2.Columns, Key = "Discipline").Label, "Discipline") & If(cmp_DataTableProV2.SortKeyIn = "Discipline", "  " & If(Lower(cmp_DataTableProV2.SortDirectionIn) = "asc", UniChar(8593), UniChar(8595)), "")
                  Visible: =Coalesce(LookUp(cmp_DataTableProV2.Columns, Key = "Discipline").IsVisible, true)
                  Width: =Coalesce(LookUp(cmp_DataTableProV2.Columns, Key = "Discipline").Width, 104)
                  X: =btnDTP2_SortSubsystem.X + If(btnDTP2_SortSubsystem.Visible, btnDTP2_SortSubsystem.Width + 12, 0)
                  Y: =8
            - btnDTP2_SortPriority:
                Control: Classic/Button@2.2.0
                Properties:
                  Align: =Align.Left
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  Color: =cmp_DataTableProV2.TextColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =26
                  HoverColor: =cmp_DataTableProV2.AccentColor
                  HoverFill: =RGBA(0,0,0,0)
                  OnSelect: |-
                    =
                    Set(varDTP2_SortKey, "Priority");
                    Set(varDTP2_SortDirection, If(cmp_DataTableProV2.SortKeyIn = "Priority" && Lower(cmp_DataTableProV2.SortDirectionIn) = "asc", "desc", "asc"));
                    cmp_DataTableProV2.OnSort()
                  PaddingLeft: =0
                  PressedColor: =cmp_DataTableProV2.AccentColor
                  PressedFill: =RGBA(0,0,0,0)
                  Size: =9
                  Text: =Coalesce(LookUp(cmp_DataTableProV2.Columns, Key = "Priority").Label, "Priority") & If(cmp_DataTableProV2.SortKeyIn = "Priority", "  " & If(Lower(cmp_DataTableProV2.SortDirectionIn) = "asc", UniChar(8593), UniChar(8595)), "")
                  Visible: =Coalesce(LookUp(cmp_DataTableProV2.Columns, Key = "Priority").IsVisible, true)
                  Width: =Coalesce(LookUp(cmp_DataTableProV2.Columns, Key = "Priority").Width, 92)
                  X: =btnDTP2_SortDiscipline.X + If(btnDTP2_SortDiscipline.Visible, btnDTP2_SortDiscipline.Width + 12, 0)
                  Y: =8
            - btnDTP2_SortStatus:
                Control: Classic/Button@2.2.0
                Properties:
                  Align: =Align.Left
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  Color: =cmp_DataTableProV2.TextColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =26
                  HoverColor: =cmp_DataTableProV2.AccentColor
                  HoverFill: =RGBA(0,0,0,0)
                  OnSelect: |-
                    =
                    Set(varDTP2_SortKey, "Status");
                    Set(varDTP2_SortDirection, If(cmp_DataTableProV2.SortKeyIn = "Status" && Lower(cmp_DataTableProV2.SortDirectionIn) = "asc", "desc", "asc"));
                    cmp_DataTableProV2.OnSort()
                  PaddingLeft: =0
                  PressedColor: =cmp_DataTableProV2.AccentColor
                  PressedFill: =RGBA(0,0,0,0)
                  Size: =9
                  Text: =Coalesce(LookUp(cmp_DataTableProV2.Columns, Key = "Status").Label, "Status") & If(cmp_DataTableProV2.SortKeyIn = "Status", "  " & If(Lower(cmp_DataTableProV2.SortDirectionIn) = "asc", UniChar(8593), UniChar(8595)), "")
                  Visible: =Coalesce(LookUp(cmp_DataTableProV2.Columns, Key = "Status").IsVisible, true)
                  Width: =Coalesce(LookUp(cmp_DataTableProV2.Columns, Key = "Status").Width, 92)
                  X: =btnDTP2_SortPriority.X + If(btnDTP2_SortPriority.Visible, btnDTP2_SortPriority.Width + 12, 0)
                  Y: =8
            - btnDTP2_SortDueDate:
                Control: Classic/Button@2.2.0
                Properties:
                  Align: =Align.Left
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  Color: =cmp_DataTableProV2.TextColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =26
                  HoverColor: =cmp_DataTableProV2.AccentColor
                  HoverFill: =RGBA(0,0,0,0)
                  OnSelect: |-
                    =
                    Set(varDTP2_SortKey, "DueDateText");
                    Set(varDTP2_SortDirection, If(cmp_DataTableProV2.SortKeyIn = "DueDateText" && Lower(cmp_DataTableProV2.SortDirectionIn) = "asc", "desc", "asc"));
                    cmp_DataTableProV2.OnSort()
                  PaddingLeft: =0
                  PressedColor: =cmp_DataTableProV2.AccentColor
