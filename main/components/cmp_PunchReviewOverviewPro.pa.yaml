                  Y: =164
            - lblPRO_DueDate:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =cmp_PunchReviewOverviewPro.TextColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =24
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =9
                  Text: =Coalesce(cmp_PunchReviewOverviewPro.PunchRecord.DueDateText, "—")
                  Visible: =cmp_PunchReviewOverviewPro.HasRecord
                  Width: =174
                  X: =Parent.Width - 190
                  Y: =182
            - conPRO_Loading:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =Color.Transparent
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255,255,255,0.82)
                  Height: =Parent.Height
                  Visible: =cmp_PunchReviewOverviewPro.IsLoading
                  Width: =Parent.Width
                Children:
                  - spnPRO_Loading:
                      Control: Spinner@1.4.6
                      Properties:
                        Height: =40
                        SpinnerColor: =cmp_PunchReviewOverviewPro.AccentColor
                        Width: =40
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =(Parent.Height - Self.Height) / 2
