ComponentDefinitions:
  cmp_DetailDrawer_Premium:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      AppColors:
        PropertyKind: Input
        DisplayName: AppColors
        Description: PULSE theme record.
        DataType: Record
        Default: =gblAppColors
      CloseAction:
        PropertyKind: Event
        DisplayName: CloseAction
        Description: Closes the drawer.
        ReturnType: None
        Default: =Set(varShowDetailDrawer, false)
      EntityType:
        PropertyKind: Input
        DisplayName: EntityType
        Description: Entity code, for example PUNCH or TASK.
        DataType: Text
        Default: ="PUNCH"
      HostHeight:
        PropertyKind: Input
        DisplayName: HostHeight
        Description: Available application height.
        DataType: Number
        Default: =App.Height
      HostWidth:
        PropertyKind: Input
        DisplayName: HostWidth
        Description: Available application width.
        DataType: Number
        Default: =App.Width
      IsLoading:
        PropertyKind: Input
        DisplayName: IsLoading
        Description: Shows the drawer loading layer.
        DataType: Boolean
        Default: =false
      IsOpen:
        PropertyKind: Input
        DisplayName: IsOpen
        Description: Controls drawer visibility.
        DataType: Boolean
        Default: =false
      NormalizedRecord:
        PropertyKind: Input
        DisplayName: NormalizedRecord
        Description: Normalized task or punch record.
        DataType: Record
        Default: |-
          ={
              EntityType: "",
              ProjectId: 0,
              RecordId: 0,
              AreaCode: "",
              UnitCode: "",
              SystemCode: "",
              SubsystemCode: "",
              ElementCode: "",
              TypeCode: "",
              TitleValue: "",
              DescValue: "",
              StatusValue: "",
              CategoryValue: "",
              DisciplineValue: "",
              SecondaryValue: "",
              ResponsibleSubcontractorValue: "",
              ActionByValue: ""
          }
      OnDeleteComment:
        PropertyKind: Event
        DisplayName: OnDeleteComment
        Description: Requests deletion of the selected comment.
        ReturnType: None
        Default: =
      OnManageFieldsRequested:
        PropertyKind: Event
        DisplayName: OnManageFieldsRequested
        Description: Opens custom field administration.
        ReturnType: None
        Default: =
      OnPostComment:
        PropertyKind: Event
        DisplayName: OnPostComment
        Description: Posts the comment composer value.
        ReturnType: None
        Default: =
      OnRefreshRequested:
        PropertyKind: Event
        DisplayName: OnRefreshRequested
        Description: Refreshes the current drawer tab.
        ReturnType: None
        Default: =
      OnSaveFields:
        PropertyKind: Event
        DisplayName: OnSaveFields
        Description: Saves dirty custom fields.
        ReturnType: None
        Default: =
      OnTabChanged:
        PropertyKind: Event
        DisplayName: OnTabChanged
        Description: Notifies the host screen after a tab change.
        ReturnType: None
        Default: =
      ProjectId:
        PropertyKind: Input
        DisplayName: ProjectId
        Description: Current project identifier.
        DataType: Number
        Default: =varProjectId
      RecordId:
        PropertyKind: Input
        DisplayName: RecordId
        Description: Current task or punch identifier.
        DataType: Number
        Default: =varDrawerRecordId
      SelectedRecord:
        PropertyKind: Input
        DisplayName: SelectedRecord
        Description: Raw selected record.
        DataType: Record
        Default: =varDrawerSelectedRecord
      UserEmail:
        PropertyKind: Input
        DisplayName: UserEmail
        Description: Current user email.
        DataType: Text
        Default: =varUserEmail
      UserName:
        PropertyKind: Input
        DisplayName: UserName
        Description: Current user display name.
        DataType: Text
        Default: =varUserName
      UserRole:
        PropertyKind: Input
        DisplayName: UserRole
        Description: Current PULSE role.
        DataType: Text
        Default: =varUserRole
    Properties:
      Fill: =RGBA(0,0,0,0)
      Height: =Self.HostHeight
      OnReset: |-
        =
        Set(varDrawerTab, "Summary");
        Set(varDrawerCommentDraft, "");
        Set(varDrawerSelectedCommentId, 0)
      Width: =Self.HostWidth
    Children:
      - recDrawerScrim:
          Control: Rectangle@2.3.0
          Properties:
            BorderStyle: =BorderStyle.None
            Fill: =RGBA(15,23,42,0.42)
            Height: =Parent.Height
            OnSelect: =cmp_DetailDrawer_Premium.CloseAction()
            Visible: =cmp_DetailDrawer_Premium.IsOpen
            Width: =Parent.Width
      - conDrawerPanel:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =ColorValue("#DCE3EC")
            BorderThickness: =1
            DropShadow: =DropShadow.Regular
            Fill: =ColorValue("#F5F7FA")
            Height: =Parent.Height
            RadiusBottomLeft: =If(cmp_DetailDrawer_Premium.HostWidth < 1100,0,20)
            RadiusBottomRight: =0
            RadiusTopLeft: =If(cmp_DetailDrawer_Premium.HostWidth < 1100,0,20)
            RadiusTopRight: =0
            Visible: =cmp_DetailDrawer_Premium.IsOpen
            Width: |-
              =
              If(
                  cmp_DetailDrawer_Premium.HostWidth < 1100,
                  cmp_DetailDrawer_Premium.HostWidth,
                  Min(
                      980,
                      Max(
                          760,
                          Round(cmp_DetailDrawer_Premium.HostWidth * 0.52,0)
                      )
                  )
              )
            X: =Parent.Width - Self.Width
          Children:
            - conDrawerHeader:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ColorValue("#E2E8F0")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#FFFFFF")
                  Height: =154
                  Width: =Parent.Width
                Children:
                  - lblDrawerEyebrow:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorValue("#64748B")
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        Size: =9
                        Text: =Upper(cmp_DetailDrawer_Premium.EntityType) & " DETAILS"
                        Width: =180
                        X: =28
                        Y: =20
                  - lblDrawerCode:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorValue("#0F172A")
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =36
                        Size: =20
                        Text: =Coalesce(Text(cmp_DetailDrawer_Premium.NormalizedRecord.TitleValue), "Record " & Text(cmp_DetailDrawer_Premium.RecordId))
                        Width: =Parent.Width - 170
                        X: =28
                        Y: =38
                  - lblDrawerDescription:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorValue("#475569")
                        Font: =Font.'Segoe UI'
                        Height: =46
                        Size: =10
                        Text: =Coalesce(Text(cmp_DetailDrawer_Premium.NormalizedRecord.DescValue), "No description available.")
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width - 190
                        X: =28
                        Y: =77
                  - btnDrawerRefresh:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        BorderColor: =Color.Transparent
                        Color: =ColorValue("#475569")
                        Height: =34
                        HoverColor: =ColorValue("#1677FF")
                        HoverFill: =ColorValue("#EFF6FF")
                        Icon: =Icon.Reload
                        OnSelect: =cmp_DetailDrawer_Premium.OnRefreshRequested()
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Width: =34
                        X: =Parent.Width - 92
                        Y: =20
                  - btnDrawerClose:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        BorderColor: =Color.Transparent
                        Color: =ColorValue("#475569")
                        Height: =34
                        HoverColor: =ColorValue("#0F172A")
                        HoverFill: =ColorValue("#F1F5F9")
                        Icon: =Icon.Cancel
                        OnSelect: |-
                          =
                          Set(varDrawerCommentDraft, "");
                          Set(varDrawerSelectedCommentId, 0);
                          cmp_DetailDrawer_Premium.CloseAction()
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Width: =34
                        X: =Parent.Width - 50
                        Y: =20
                  - lblDrawerStatusPill:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: |-
                          =
                          If(
                              Lower(Coalesce(Text(cmp_DetailDrawer_Premium.NormalizedRecord.StatusValue),"")) in ["closed","complete","completed","done"],
                              ColorValue("#166534"),
                              ColorValue("#1D4ED8")
                          )
                        Fill: |-
                          =
                          If(
                              Lower(Coalesce(Text(cmp_DetailDrawer_Premium.NormalizedRecord.StatusValue),"")) in ["closed","complete","completed","done"],
                              ColorValue("#DCFCE7"),
                              ColorValue("#DBEAFE")
                          )
                        Font: =Font.'Segoe UI'
                        Height: =28
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Size: =9
                        Text: =Coalesce(Text(cmp_DetailDrawer_Premium.NormalizedRecord.StatusValue), "No status")
                        Width: =Min(160,Max(90,Len(Self.Text)*7+28))
                        X: =28
                        Y: =120
                  - lblDrawerCategoryPill:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =ColorValue("#7C2D12")
                        Fill: =ColorValue("#FFEDD5")
                        Font: =Font.'Segoe UI'
                        Height: =28
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Size: =9
                        Text: =Coalesce(Text(cmp_DetailDrawer_Premium.NormalizedRecord.CategoryValue), "Uncategorised")
                        Width: =Min(160,Max(90,Len(Self.Text)*7+28))
                        X: =lblDrawerStatusPill.X + lblDrawerStatusPill.Width + 8
                        Y: =120
            - conDrawerTabs:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ColorValue("#E2E8F0")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#FFFFFF")
                  Height: =58
                  Width: =Parent.Width
                  Y: =154
                Children:
                  - btnTabSummary:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        Color: =If(varDrawerTab="Summary",ColorValue("#1677FF"),ColorValue("#64748B"))
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =If(varDrawerTab="Summary",FontWeight.Semibold,FontWeight.Normal)
                        Height: =56
                        HoverColor: =ColorValue("#1677FF")
                        HoverFill: =ColorValue("#F8FAFC")
                        OnSelect: =Set(varDrawerTab,"Summary"); cmp_DetailDrawer_Premium.OnTabChanged()
                        PressedFill: =ColorValue("#EFF6FF")
                        Size: =10
                        Text: ="Summary"
                        Width: =Parent.Width/4
                  - btnTabComments:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        Color: =If(varDrawerTab="Comments",ColorValue("#1677FF"),ColorValue("#64748B"))
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =If(varDrawerTab="Comments",FontWeight.Semibold,FontWeight.Normal)
                        Height: =56
                        HoverColor: =ColorValue("#1677FF")
                        HoverFill: =ColorValue("#F8FAFC")
                        OnSelect: =Set(varDrawerTab,"Comments"); cmp_DetailDrawer_Premium.OnTabChanged()
                        PressedFill: =ColorValue("#EFF6FF")
                        Size: =10
                        Text: ="Comments" & If(Coalesce(varCommentsTotalRows,0)>0,"  " & Text(varCommentsTotalRows),"")
                        Width: =Parent.Width/4
                        X: =Parent.Width/4
                  - btnTabFields:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        Color: =If(varDrawerTab="Fields",ColorValue("#1677FF"),ColorValue("#64748B"))
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =If(varDrawerTab="Fields",FontWeight.Semibold,FontWeight.Normal)
                        Height: =56
                        HoverColor: =ColorValue("#1677FF")
                        HoverFill: =ColorValue("#F8FAFC")
                        OnSelect: =Set(varDrawerTab,"Fields"); cmp_DetailDrawer_Premium.OnTabChanged()
                        PressedFill: =ColorValue("#EFF6FF")
                        Size: =10
                        Text: ="Fields" & If(CountRows(colCT_Merged)>0,"  " & Text(CountRows(colCT_Merged)),"")
                        Width: =Parent.Width/4
                        X: =Parent.Width/2
                  - btnTabActivity:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        Color: =If(varDrawerTab="Activity",ColorValue("#1677FF"),ColorValue("#64748B"))
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =If(varDrawerTab="Activity",FontWeight.Semibold,FontWeight.Normal)
                        Height: =56
                        HoverColor: =ColorValue("#1677FF")
                        HoverFill: =ColorValue("#F8FAFC")
                        OnSelect: =Set(varDrawerTab,"Activity"); cmp_DetailDrawer_Premium.OnTabChanged()
                        PressedFill: =ColorValue("#EFF6FF")
                        Size: =10
                        Text: ="Activity"
                        Width: =Parent.Width/4
                        X: =Parent.Width*0.75
                  - recTabIndicator:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        Fill: =ColorValue("#1677FF")
                        Height: =3
                        Width: =Parent.Width/4 - 32
                        X: |-
                          =
                          Switch(
                              varDrawerTab,
                              "Comments", Parent.Width/4 + 16,
                              "Fields", Parent.Width/2 + 16,
                              "Activity", Parent.Width*0.75 + 16,
                              16
                          )
                        Y: =55
            - conSummary:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =ColorValue("#F5F7FA")
                  Height: =Parent.Height - 212
                  Visible: =varDrawerTab="Summary"
                  Width: =Parent.Width
                  Y: =212
                Children:
                  - conSummaryMain:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ColorValue("#E2E8F0")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue("#FFFFFF")
                        Height: =176
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =24
                      Children:
                        - lblSummaryMainTitle:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ColorValue("#0F172A")
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              Size: =12
                              Text: ="Main information"
                              Width: =220
                              X: =20
                              Y: =16
                        - lblSummarySubsystemLabel:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ColorValue("#64748B")
                              Font: =Font.'Segoe UI'
                              Height: =20
                              Size: =9
                              Text: ="SUBSYSTEM"
                              Width: =160
                              X: =20
                              Y: =58
                        - lblSummarySubsystemValue:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ColorValue("#0F172A")
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =26
                              Size: =11
                              Text: =Coalesce(Text(cmp_DetailDrawer_Premium.NormalizedRecord.SubsystemCode),"-")
                              Width: =(Parent.Width-60)/2
                              X: =20
                              Y: =78
                        - lblSummaryDisciplineLabel:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ColorValue("#64748B")
                              Font: =Font.'Segoe UI'
                              Height: =20
                              Size: =9
                              Text: ="DISCIPLINE"
                              Width: =160
                              X: =Parent.Width/2
                              Y: =58
                        - lblSummaryDisciplineValue:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ColorValue("#0F172A")
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =26
                              Size: =11
                              Text: =Coalesce(Text(cmp_DetailDrawer_Premium.NormalizedRecord.DisciplineValue),"-")
                              Width: =(Parent.Width-60)/2
                              X: =Parent.Width/2
                              Y: =78
                        - lblSummaryInspectionLabel:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ColorValue("#64748B")
                              Font: =Font.'Segoe UI'
                              Height: =20
                              Size: =9
                              Text: ="INSPECTION / SOURCE"
                              Width: =180
                              X: =20
                              Y: =118
                        - lblSummaryInspectionValue:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ColorValue("#334155")
                              Font: =Font.'Segoe UI'
                              Height: =28
                              Size: =10
                              Text: =Coalesce(Text(cmp_DetailDrawer_Premium.NormalizedRecord.SecondaryValue),"-")
                              Width: =Parent.Width - 40
                              X: =20
                              Y: =138
                  - conSummaryWbs:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ColorValue("#E2E8F0")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue("#FFFFFF")
                        Height: =154
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =216
                      Children:
                        - lblSummaryWbsTitle:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ColorValue("#0F172A")
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              Size: =12
                              Text: ="Asset hierarchy"
                              Width: =220
                              X: =20
                              Y: =16
                        - lblSummaryWbsPath:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ColorValue("#334155")
                              Font: =Font.'Segoe UI'
                              Height: =78
                              Size: =10
                              Text: |-
                                =
                                Concat(
                                    Filter(
                                        Table(
                                            {Value:Coalesce(Text(cmp_DetailDrawer_Premium.NormalizedRecord.AreaCode),"")},
                                            {Value:Coalesce(Text(cmp_DetailDrawer_Premium.NormalizedRecord.UnitCode),"")},
                                            {Value:Coalesce(Text(cmp_DetailDrawer_Premium.NormalizedRecord.SystemCode),"")},
                                            {Value:Coalesce(Text(cmp_DetailDrawer_Premium.NormalizedRecord.SubsystemCode),"")},
                                            {Value:Coalesce(Text(cmp_DetailDrawer_Premium.NormalizedRecord.ElementCode),"")},
                                            {Value:Coalesce(Text(cmp_DetailDrawer_Premium.NormalizedRecord.TypeCode),"")}
                                        ),
                                        !IsBlank(Value)
                                    ),
                                    Value,
                                    "  â€º  "
                                )
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width - 40
                              X: =20
                              Y: =58
                  - conSummaryOwnership:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ColorValue("#E2E8F0")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue("#FFFFFF")
                        Height: =150
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =386
                      Children:
                        - lblOwnershipTitle:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ColorValue("#0F172A")
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              Size: =12
                              Text: ="Ownership"
                              Width: =220
                              X: =20
                              Y: =16
                        - lblResponsibleSubLabel:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ColorValue("#64748B")
                              Font: =Font.'Segoe UI'
                              Height: =20
                              Size: =9
                              Text: ="RESPONSIBLE SUBCONTRACTOR"
                              Width: =220
                              X: =20
                              Y: =56
                        - lblResponsibleSubValue:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ColorValue("#0F172A")
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              Size: =10
                              Text: =Coalesce(Text(cmp_DetailDrawer_Premium.NormalizedRecord.ResponsibleSubcontractorValue),"-")
                              Width: =(Parent.Width-60)/2
                              X: =20
                              Y: =78
                        - lblActionByLabel:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ColorValue("#64748B")
                              Font: =Font.'Segoe UI'
                              Height: =20
                              Size: =9
                              Text: ="ACTION BY"
                              Width: =180
                              X: =Parent.Width/2
                              Y: =56
                        - lblActionByValue:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ColorValue("#0F172A")
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              Size: =10
                              Text: =Coalesce(Text(cmp_DetailDrawer_Premium.NormalizedRecord.ActionByValue),"-")
                              Width: =(Parent.Width-60)/2
                              X: =Parent.Width/2
                              Y: =78
            - conComments_1:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =ColorValue("#F5F7FA")
                  Height: =Parent.Height - 212
                  Visible: =varDrawerTab="Comments"
                  Width: =Parent.Width
                  Y: =212
                Children:
                  - galDrawerComments:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        BorderColor: =ColorValue("#E2E8F0")
                        BorderThickness: =1
                        Fill: =ColorValue("#FFFFFF")
                        Height: =Parent.Height - 176
                        Items: =SortByColumns(colComments,"CreatedOn",SortOrder.Descending)
                        TemplatePadding: =12
                        TemplateSize: =112
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =20
                      Children:
                        - lblCommentAuthor:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ColorValue("#0F172A")
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              OnSelect: =Select(Parent)
                              Size: =10
                              Text: =Coalesce(ThisItem.CreatedByName,ThisItem.CreatedByEmail,"Unknown user")
                              Width: =Parent.TemplateWidth - 190
                              X: =12
                              Y: =8
                        - lblCommentDate:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              Color: =ColorValue("#64748B")
                              Font: =Font.'Segoe UI'
                              Height: =22
                              OnSelect: =Select(Parent)
                              Size: =8
                              Text: =Text(ThisItem.CreatedOn,"dd mmm yyyy Â· HH:mm")
                              Width: =160
                              X: =Parent.TemplateWidth - 172
                              Y: =8
                        - lblCommentBody:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ColorValue("#334155")
                              Font: =Font.'Segoe UI'
                              Height: =58
                              OnSelect: =Select(Parent)
                              Size: =10
                              Text: =ThisItem.CommentText
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.TemplateWidth - 24
                              X: =12
                              Y: =38
                  - lblCommentsEmpty:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =ColorValue("#64748B")
                        Font: =Font.'Segoe UI'
                        Height: =80
                        Size: =11
                        Text: ="No comments yet. Start the conversation below."
                        Visible: =!varIsLoadingComments && CountRows(colComments)=0
                        Width: =Parent.Width - 96
                        X: =48
                        Y: =80
                  - txtDrawerComment:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =ColorValue("#CBD5E1")
                        BorderThickness: =1
                        Default: =varDrawerCommentDraft
                        Fill: =ColorValue("#FFFFFF")
                        Font: =Font.'Segoe UI'
                        Height: =88
                        HintText: ="Add a comment..."
                        Mode: =TextMode.MultiLine
                        OnChange: =Set(varDrawerCommentDraft,Self.Text)
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        Size: =10
                        Width: =Parent.Width - 170
                        X: =24
                        Y: =Parent.Height - 132
                  - btnDrawerPostComment:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        Color: =Color.White
                        DisplayMode: =If(IsBlank(Trim(txtDrawerComment.Text)) || cmp_DetailDrawer_Premium.IsLoading,DisplayMode.Disabled,DisplayMode.Edit)
                        Fill: =ColorValue("#1677FF")
                        Font: =Font.'Segoe UI'
