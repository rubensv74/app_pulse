ComponentDefinitions:
  cmp_SmartFilterBarPro_Stable:
    DefinitionType: CanvasComponent
    CustomProperties:
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Primary interaction color.
        DataType: Color
        Default: =ColorValue("#1677FF")
      ActiveFilterCount:
        PropertyKind: Output
        DisplayName: ActiveFilterCount
        Description: Number of active filters.
        DataType: Number
      ActiveFilters:
        PropertyKind: Input
        DisplayName: ActiveFilters
        Description: Normalized table with Key, Label, Value and DisplayText.
        DataType: Table
        Default: |-
          =
          FirstN(
              Table(
                  {
                      Key: "",
                      Label: "",
                      Value: "",
                      DisplayText: ""
                  }
              ),
              0
          )
      BackgroundColor:
        PropertyKind: Input
        DisplayName: BackgroundColor
        Description: Component surface color.
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        Description: Border and separator color.
        DataType: Color
        Default: =ColorValue("#E2E8F0")
      DangerColor:
        PropertyKind: Input
        DisplayName: DangerColor
        Description: Error or destructive action color.
        DataType: Color
        Default: =ColorValue("#DC2626")
      Density:
        PropertyKind: Output
        DisplayName: Density
        Description: Current density value.
        DataType: Text
      DensityIn:
        PropertyKind: Input
        DisplayName: DensityIn
        Description: Compact, Comfortable or Spacious.
        DataType: Text
        Default: ="Compact"
      FilterButtonText:
        PropertyKind: Input
        DisplayName: FilterButtonText
        Description: Advanced filters button label.
        DataType: Text
        Default: ="Filters"
      FilterKeyToRemove:
        PropertyKind: Output
        DisplayName: FilterKeyToRemove
        Description: Key of the chip that requested removal.
        DataType: Text
      HasActiveFilters:
        PropertyKind: Output
        DisplayName: HasActiveFilters
        Description: True when one or more active filters exist.
        DataType: Boolean
      IsLoading:
        PropertyKind: Input
        DisplayName: IsLoading
        Description: Displays loading state and disables actions.
        DataType: Boolean
        Default: =false
      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Secondary text color.
        DataType: Color
        Default: =ColorValue("#64748B")
      NoFiltersText:
        PropertyKind: Input
        DisplayName: NoFiltersText
        Description: Message displayed when no filters are active.
        DataType: Text
        Default: ="No active filters"
      OnClearAll:
        PropertyKind: Event
        DisplayName: OnClearAll
        Description: Raised when all active filters are cleared.
        ReturnType: None
        Default: =false
      OnColumnSelector:
        PropertyKind: Event
        DisplayName: OnColumnSelector
        Description: Raised when the column selector is selected.
        ReturnType: None
        Default: =false
      OnDensityChanged:
        PropertyKind: Event
        DisplayName: OnDensityChanged
        Description: Raised after cycling table density.
        ReturnType: None
        Default: =false
      OnExport:
        PropertyKind: Event
        DisplayName: OnExport
        Description: Raised when export is selected.
        ReturnType: None
        Default: =false
      OnOpenFilters:
        PropertyKind: Event
        DisplayName: OnOpenFilters
        Description: Raised when advanced filters are selected.
        ReturnType: None
        Default: =false
      OnOpenSavedViews:
        PropertyKind: Event
        DisplayName: OnOpenSavedViews
        Description: Raised when saved views are selected.
        ReturnType: None
        Default: =false
      OnQuickFilterSelected:
        PropertyKind: Event
        DisplayName: OnQuickFilterSelected
        Description: Raised when a quick filter is selected.
        ReturnType: None
        Default: =false
      OnRefresh:
        PropertyKind: Event
        DisplayName: OnRefresh
        Description: Raised when refresh is selected.
        ReturnType: None
        Default: =false
      OnRemoveFilter:
        PropertyKind: Event
        DisplayName: OnRemoveFilter
        Description: Raised when an active filter requests removal.
        ReturnType: None
        Default: =false
      OnSearchChanged:
        PropertyKind: Event
        DisplayName: OnSearchChanged
        Description: Raised when the search text changes.
        ReturnType: None
        Default: =false
      QuickFilters:
        PropertyKind: Input
        DisplayName: QuickFilters
        Description: Normalized table with Key, Label, Count and Tone.
        DataType: Table
        Default: |-
          =
          Table(
              {
                  Key: "ALL",
                  Label: "All",
                  Count: 0,
                  Tone: "neutral"
              },
              {
                  Key: "OPEN",
                  Label: "Open",
                  Count: 0,
                  Tone: "info"
              },
              {
                  Key: "CLOSED",
                  Label: "Closed",
                  Count: 0,
                  Tone: "success"
              }
          )
      ResultCount:
        PropertyKind: Input
        DisplayName: ResultCount
        Description: Number of records in the current filtered result.
        DataType: Number
        Default: =0
      SavedViewsText:
        PropertyKind: Input
        DisplayName: SavedViewsText
        Description: Saved views button label.
        DataType: Text
        Default: ="Views"
      SearchPlaceholder:
        PropertyKind: Input
        DisplayName: SearchPlaceholder
        Description: Search input placeholder.
        DataType: Text
        Default: ="Search punches..."
      SearchText:
        PropertyKind: Output
        DisplayName: SearchText
        Description: Current search text.
        DataType: Text
      SearchTextIn:
        PropertyKind: Input
        DisplayName: SearchTextIn
        Description: Initial or externally controlled search text.
        DataType: Text
        Default: =""
      SelectedQuickFilterIn:
        PropertyKind: Input
        DisplayName: SelectedQuickFilterIn
        Description: Initially selected quick filter key.
        DataType: Text
        Default: ="ALL"
      SelectedQuickFilterKey:
        PropertyKind: Output
        DisplayName: SelectedQuickFilterKey
        Description: Current quick filter key.
        DataType: Text
      ShowActiveFilters:
        PropertyKind: Input
        DisplayName: ShowActiveFilters
        Description: Shows active filter chips and empty-state text.
        DataType: Boolean
        Default: =true
      ShowColumnSelector:
        PropertyKind: Input
        DisplayName: ShowColumnSelector
        Description: Shows the column selector action.
        DataType: Boolean
        Default: =true
      ShowDensity:
        PropertyKind: Input
        DisplayName: ShowDensity
        Description: Shows the density action.
        DataType: Boolean
        Default: =true
      ShowExport:
        PropertyKind: Input
        DisplayName: ShowExport
        Description: Shows the export action.
        DataType: Boolean
        Default: =true
      ShowFiltersButton:
        PropertyKind: Input
        DisplayName: ShowFiltersButton
        Description: Shows the advanced filters button.
        DataType: Boolean
        Default: =true
      ShowQuickFilters:
        PropertyKind: Input
        DisplayName: ShowQuickFilters
        Description: Shows quick filter buttons.
        DataType: Boolean
        Default: =true
      ShowRefresh:
        PropertyKind: Input
        DisplayName: ShowRefresh
        Description: Shows the refresh action.
        DataType: Boolean
        Default: =true
      ShowSavedViews:
        PropertyKind: Input
        DisplayName: ShowSavedViews
        Description: Shows the saved views action.
        DataType: Boolean
        Default: =true
      ShowSearch:
        PropertyKind: Input
        DisplayName: ShowSearch
        Description: Shows the search input.
        DataType: Boolean
        Default: =true
      SurfaceAltColor:
        PropertyKind: Input
        DisplayName: SurfaceAltColor
        Description: Secondary surface and chip color.
        DataType: Color
        Default: =ColorValue("#F8FAFC")
      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Main text color.
        DataType: Color
        Default: =ColorValue("#0F172A")
      TotalCount:
        PropertyKind: Input
        DisplayName: TotalCount
        Description: Total number of records before current filters.
        DataType: Number
        Default: =0
    Properties:
      ActiveFilterCount: =CountRows(Filter(cmp_SmartFilterBarPro_Stable.ActiveFilters, !IsBlank(Key)))
      Density: =Coalesce(varSFB_Density, cmp_SmartFilterBarPro_Stable.DensityIn)
      FilterKeyToRemove: =Coalesce(varSFB_FilterKeyToRemove, "")
      HasActiveFilters: =CountRows(Filter(cmp_SmartFilterBarPro_Stable.ActiveFilters, !IsBlank(Key))) > 0
      Height: =118
      OnReset: |-
        =
        Set(varSFB_SelectedQuickFilter, cmp_SmartFilterBarPro_Stable.SelectedQuickFilterIn);
        Set(varSFB_FilterKeyToRemove, "");
        Set(varSFB_Density, cmp_SmartFilterBarPro_Stable.DensityIn)
      SearchText: =Coalesce(txtSFB_Search.Text, "")
      SelectedQuickFilterKey: =Coalesce(varSFB_SelectedQuickFilter, cmp_SmartFilterBarPro_Stable.SelectedQuickFilterIn)
      Width: =1180
    Children:
      - conSFB_Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =cmp_SmartFilterBarPro_Stable.BorderColor
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =cmp_SmartFilterBarPro_Stable.BackgroundColor
            Height: =Parent.Height
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Width: =Parent.Width
          Children:
            - txtSFB_Search:
                Control: ModernTextInput@1.1.1
                Properties:
                  Appearance: =Appearance.Outline
                  Default: =cmp_SmartFilterBarPro_Stable.SearchTextIn
                  DisplayMode: =If(cmp_SmartFilterBarPro_Stable.IsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Height: =36
                  OnChange: =cmp_SmartFilterBarPro_Stable.OnSearchChanged()
                  Placeholder: =cmp_SmartFilterBarPro_Stable.SearchPlaceholder
                  Visible: =cmp_SmartFilterBarPro_Stable.ShowSearch
                  Width: =260
                  X: =16
                  Y: =12
            - galSFB_QuickFilters:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  BorderColor: =RGBA(245, 245, 245, 1)
                  Height: =40
                  Items: =Filter(cmp_SmartFilterBarPro_Stable.QuickFilters, !IsBlank(Key))
                  ShowScrollbar: =false
                  TemplatePadding: =4
                  TemplateSize: =110
                  Visible: =cmp_SmartFilterBarPro_Stable.ShowQuickFilters
                  Width: =Max(180, Parent.Width - Self.X - 420)
                  X: =If(cmp_SmartFilterBarPro_Stable.ShowSearch, 284, 16)
                  Y: =10
                Children:
                  - btnSFB_QuickFilter:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: |-
                          =
                          If(
                              ThisItem.Key = Coalesce(varSFB_SelectedQuickFilter, cmp_SmartFilterBarPro_Stable.SelectedQuickFilterIn),
                              cmp_SmartFilterBarPro_Stable.AccentColor,
                              cmp_SmartFilterBarPro_Stable.BorderColor
                          )
                        BorderThickness: =1
                        Color: |-
                          =
                          If(
                              ThisItem.Key = Coalesce(varSFB_SelectedQuickFilter, cmp_SmartFilterBarPro_Stable.SelectedQuickFilterIn),
                              cmp_SmartFilterBarPro_Stable.AccentColor,
                              cmp_SmartFilterBarPro_Stable.TextColor
                          )
                        DisabledBorderColor: =cmp_SmartFilterBarPro_Stable.BorderColor
                        DisabledColor: =cmp_SmartFilterBarPro_Stable.MutedTextColor
                        DisabledFill: =cmp_SmartFilterBarPro_Stable.SurfaceAltColor
                        DisplayMode: =If(cmp_SmartFilterBarPro_Stable.IsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: |-
                          =
                          If(
                              ThisItem.Key = Coalesce(varSFB_SelectedQuickFilter, cmp_SmartFilterBarPro_Stable.SelectedQuickFilterIn),
                              ColorFade(cmp_SmartFilterBarPro_Stable.AccentColor, 0.88),
                              cmp_SmartFilterBarPro_Stable.BackgroundColor
                          )
                        Font: =Font.'Segoe UI'
                        Height: =32
                        HoverBorderColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                        HoverColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                        HoverFill: =ColorFade(cmp_SmartFilterBarPro_Stable.AccentColor, 0.92)
                        OnSelect: |-
                          =
                          Set(varSFB_SelectedQuickFilter, ThisItem.Key);
                          cmp_SmartFilterBarPro_Stable.OnQuickFilterSelected()
                        PressedBorderColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                        PressedColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                        PressedFill: =ColorFade(cmp_SmartFilterBarPro_Stable.AccentColor, 0.86)
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                        Size: =9
                        Text: =ThisItem.Label & If(ThisItem.Count >= 0, "  " & Text(ThisItem.Count), "")
                        Width: =102
                        Y: =4
            - btnSFB_Filters:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =cmp_SmartFilterBarPro_Stable.BorderColor
                  BorderThickness: =1
                  Color: =cmp_SmartFilterBarPro_Stable.TextColor
                  DisabledBorderColor: =cmp_SmartFilterBarPro_Stable.BorderColor
                  DisabledColor: =cmp_SmartFilterBarPro_Stable.MutedTextColor
                  DisabledFill: =cmp_SmartFilterBarPro_Stable.SurfaceAltColor
                  DisplayMode: =If(cmp_SmartFilterBarPro_Stable.IsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =cmp_SmartFilterBarPro_Stable.BackgroundColor
                  Font: =Font.'Segoe UI'
                  Height: =34
                  HoverBorderColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                  HoverColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                  HoverFill: =ColorFade(cmp_SmartFilterBarPro_Stable.AccentColor, 0.94)
                  OnSelect: =cmp_SmartFilterBarPro_Stable.OnOpenFilters()
                  PressedBorderColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                  PressedColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                  PressedFill: =ColorFade(cmp_SmartFilterBarPro_Stable.AccentColor, 0.88)
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =9
                  Text: =cmp_SmartFilterBarPro_Stable.FilterButtonText
                  Visible: =cmp_SmartFilterBarPro_Stable.ShowFiltersButton
                  Width: =90
                  X: =Parent.Width - 408
                  Y: =13
            - btnSFB_Views:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =cmp_SmartFilterBarPro_Stable.BorderColor
                  BorderThickness: =1
                  Color: =cmp_SmartFilterBarPro_Stable.TextColor
                  DisabledBorderColor: =cmp_SmartFilterBarPro_Stable.BorderColor
                  DisabledColor: =cmp_SmartFilterBarPro_Stable.MutedTextColor
                  DisabledFill: =cmp_SmartFilterBarPro_Stable.SurfaceAltColor
                  DisplayMode: =If(cmp_SmartFilterBarPro_Stable.IsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =cmp_SmartFilterBarPro_Stable.BackgroundColor
                  Font: =Font.'Segoe UI'
                  Height: =34
                  HoverBorderColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                  HoverColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                  HoverFill: =cmp_SmartFilterBarPro_Stable.SurfaceAltColor
                  OnSelect: =cmp_SmartFilterBarPro_Stable.OnOpenSavedViews()
                  PressedBorderColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                  PressedColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                  PressedFill: =ColorFade(cmp_SmartFilterBarPro_Stable.AccentColor, 0.92)
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =9
                  Text: =cmp_SmartFilterBarPro_Stable.SavedViewsText
                  Visible: =cmp_SmartFilterBarPro_Stable.ShowSavedViews
                  Width: =82
                  X: =Parent.Width - 310
                  Y: =13
            - icoSFB_Refresh:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =cmp_SmartFilterBarPro_Stable.MutedTextColor
                  DisplayMode: =If(cmp_SmartFilterBarPro_Stable.IsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Height: =20
                  HoverColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                  Icon: =Icon.Reload
                  OnSelect: =cmp_SmartFilterBarPro_Stable.OnRefresh()
                  PressedColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                  Tooltip: ="Refresh"
                  Visible: =cmp_SmartFilterBarPro_Stable.ShowRefresh
                  Width: =20
                  X: =Parent.Width - 216
                  Y: =20
            - icoSFB_Export:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =cmp_SmartFilterBarPro_Stable.MutedTextColor
                  DisplayMode: =If(cmp_SmartFilterBarPro_Stable.IsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Height: =20
                  HoverColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                  Icon: =Icon.Download
                  OnSelect: =cmp_SmartFilterBarPro_Stable.OnExport()
                  PressedColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                  Tooltip: ="Export"
                  Visible: =cmp_SmartFilterBarPro_Stable.ShowExport
                  Width: =20
                  X: =Parent.Width - 180
                  Y: =20
            - icoSFB_Columns:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =cmp_SmartFilterBarPro_Stable.MutedTextColor
                  DisplayMode: =If(cmp_SmartFilterBarPro_Stable.IsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Height: =20
                  HoverColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                  Icon: =Icon.Items
                  OnSelect: =cmp_SmartFilterBarPro_Stable.OnColumnSelector()
                  PressedColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                  Tooltip: ="Columns"
                  Visible: =cmp_SmartFilterBarPro_Stable.ShowColumnSelector
                  Width: =20
                  X: =Parent.Width - 144
                  Y: =20
            - btnSFB_Density:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =cmp_SmartFilterBarPro_Stable.BorderColor
                  BorderThickness: =1
                  Color: =cmp_SmartFilterBarPro_Stable.TextColor
                  DisabledBorderColor: =cmp_SmartFilterBarPro_Stable.BorderColor
                  DisabledColor: =cmp_SmartFilterBarPro_Stable.MutedTextColor
                  DisabledFill: =cmp_SmartFilterBarPro_Stable.SurfaceAltColor
                  DisplayMode: =If(cmp_SmartFilterBarPro_Stable.IsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =cmp_SmartFilterBarPro_Stable.BackgroundColor
                  Font: =Font.'Segoe UI'
                  Height: =34
                  HoverBorderColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                  HoverColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                  HoverFill: =cmp_SmartFilterBarPro_Stable.SurfaceAltColor
                  OnSelect: |-
                    =
                    Set(
                        varSFB_Density,
                        Switch(
                            Lower(Coalesce(varSFB_Density, cmp_SmartFilterBarPro_Stable.DensityIn)),
                            "compact", "Comfortable",
                            "comfortable", "Spacious",
                            "spacious", "Compact",
                            "Compact"
                        )
                    );
                    cmp_SmartFilterBarPro_Stable.OnDensityChanged()
                  PressedBorderColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                  PressedColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                  PressedFill: =ColorFade(cmp_SmartFilterBarPro_Stable.AccentColor, 0.92)
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =8
                  Text: =Coalesce(varSFB_Density, cmp_SmartFilterBarPro_Stable.DensityIn)
                  Visible: =cmp_SmartFilterBarPro_Stable.ShowDensity
                  Width: =90
                  X: =Parent.Width - 106
                  Y: =13
            - rectSFB_Divider:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  DisabledFill: =cmp_SmartFilterBarPro_Stable.BorderColor
                  Fill: =cmp_SmartFilterBarPro_Stable.BorderColor
                  Height: =1
                  HoverFill: =cmp_SmartFilterBarPro_Stable.BorderColor
                  PressedFill: =cmp_SmartFilterBarPro_Stable.BorderColor
                  Width: =Parent.Width
                  Y: =59
            - lblSFB_ResultCount:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =cmp_SmartFilterBarPro_Stable.TextColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =38
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =9
                  Text: |-
                    =
                    Text(cmp_SmartFilterBarPro_Stable.ResultCount) &
                    " results" &
                    If(
                        cmp_SmartFilterBarPro_Stable.TotalCount > 0,
                        " from " & Text(cmp_SmartFilterBarPro_Stable.TotalCount),
                        ""
                    )
                  Width: =178
                  X: =16
                  Y: =68
            - galSFB_ActiveFilters:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  BorderColor: =RGBA(245, 245, 245, 1)
                  Height: =42
                  Items: =Filter(cmp_SmartFilterBarPro_Stable.ActiveFilters, !IsBlank(Key))
                  ShowScrollbar: =false
                  TemplatePadding: =4
                  TemplateSize: =170
                  Visible: |-
                    =
                    cmp_SmartFilterBarPro_Stable.ShowActiveFilters &&
                    CountRows(Filter(cmp_SmartFilterBarPro_Stable.ActiveFilters, !IsBlank(Key))) > 0
                  Width: =Parent.Width - 298
                  X: =194
                  Y: =66
                Children:
                  - btnSFB_FilterChip:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =cmp_SmartFilterBarPro_Stable.BorderColor
                        BorderThickness: =1
                        Color: =cmp_SmartFilterBarPro_Stable.TextColor
                        DisabledBorderColor: =cmp_SmartFilterBarPro_Stable.BorderColor
                        DisabledColor: =cmp_SmartFilterBarPro_Stable.MutedTextColor
                        DisabledFill: =cmp_SmartFilterBarPro_Stable.SurfaceAltColor
                        DisplayMode: =If(cmp_SmartFilterBarPro_Stable.IsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =cmp_SmartFilterBarPro_Stable.SurfaceAltColor
                        Font: =Font.'Segoe UI'
                        Height: =30
                        HoverBorderColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                        HoverColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                        HoverFill: =ColorFade(cmp_SmartFilterBarPro_Stable.AccentColor, 0.94)
                        OnSelect: |-
                          =
                          Set(varSFB_FilterKeyToRemove, ThisItem.Key);
                          cmp_SmartFilterBarPro_Stable.OnRemoveFilter()
                        PressedBorderColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                        PressedColor: =cmp_SmartFilterBarPro_Stable.AccentColor
                        PressedFill: =ColorFade(cmp_SmartFilterBarPro_Stable.AccentColor, 0.88)
                        RadiusBottomLeft: =15
                        RadiusBottomRight: =15
                        RadiusTopLeft: =15
                        RadiusTopRight: =15
                        Size: =8
                        Text: =ThisItem.DisplayText & "  ×"
                        Width: =162
                        Y: =4
            - lblSFB_NoFilters:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =cmp_SmartFilterBarPro_Stable.MutedTextColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =38
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =9
                  Text: =cmp_SmartFilterBarPro_Stable.NoFiltersText
                  Visible: |-
                    =
                    cmp_SmartFilterBarPro_Stable.ShowActiveFilters &&
                    CountRows(Filter(cmp_SmartFilterBarPro_Stable.ActiveFilters, !IsBlank(Key))) = 0
                  Width: =300
                  X: =194
                  Y: =68
            - btnSFB_ClearAll:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderThickness: =0
                  Color: =cmp_SmartFilterBarPro_Stable.MutedTextColor
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =cmp_SmartFilterBarPro_Stable.MutedTextColor
                  DisabledFill: =Color.Transparent
                  DisplayMode: =If(cmp_SmartFilterBarPro_Stable.IsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =30
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =cmp_SmartFilterBarPro_Stable.DangerColor
                  HoverFill: =Color.Transparent
                  OnSelect: =cmp_SmartFilterBarPro_Stable.OnClearAll()
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =cmp_SmartFilterBarPro_Stable.DangerColor
                  PressedFill: =Color.Transparent
                  Size: =9
                  Text: ="Clear all"
                  Visible: |-
                    =
                    cmp_SmartFilterBarPro_Stable.ShowActiveFilters &&
                    CountRows(Filter(cmp_SmartFilterBarPro_Stable.ActiveFilters, !IsBlank(Key))) > 0
                  Width: =72
                  X: =Parent.Width - 88
                  Y: =72
            - lblSFB_Loading:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =cmp_SmartFilterBarPro_Stable.MutedTextColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =8
                  Text: ="Loading..."
                  Visible: =cmp_SmartFilterBarPro_Stable.IsLoading
                  Width: =72
                  X: =Parent.Width - 88
                  Y: =75
