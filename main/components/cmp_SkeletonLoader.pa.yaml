ComponentDefinitions:
  cmp_SkeletonLoader:
    DefinitionType: CanvasComponent
    CustomProperties:
      VisibleState:
        PropertyKind: Input
        DataType: Boolean
        Default: =true
      BackgroundColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      SkeletonColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#E8EEF6")
      BorderColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#E2E8F0")
    Properties:
      Width: =900
      Height: =280
    Children:
      - conSKL_Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =cmp_SkeletonLoader.BorderColor
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =cmp_SkeletonLoader.BackgroundColor
            Height: =Parent.Height
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            RadiusTopLeft: =14
            RadiusTopRight: =14
            Visible: =cmp_SkeletonLoader.VisibleState
            Width: =Parent.Width
          Children:
            - recSKL_Title:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Fill: =cmp_SkeletonLoader.SkeletonColor
                  Height: =22
                  Width: =Min(240,Parent.Width-48)
                  X: =24
                  Y: =24
            - recSKL_Subtitle:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Fill: =cmp_SkeletonLoader.SkeletonColor
                  Height: =12
                  Width: =Min(420,Parent.Width-48)
                  X: =24
                  Y: =58
            - recSKL_Card1:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Fill: =cmp_SkeletonLoader.SkeletonColor
                  Height: =78
                  Width: =(Parent.Width-84)/3
                  X: =24
                  Y: =94
            - recSKL_Card2:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Fill: =cmp_SkeletonLoader.SkeletonColor
                  Height: =78
                  Width: =(Parent.Width-84)/3
                  X: =recSKL_Card1.X+recSKL_Card1.Width+18
                  Y: =94
            - recSKL_Card3:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Fill: =cmp_SkeletonLoader.SkeletonColor
                  Height: =78
                  Width: =(Parent.Width-84)/3
                  X: =recSKL_Card2.X+recSKL_Card2.Width+18
                  Y: =94
            - recSKL_Row1:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Fill: =cmp_SkeletonLoader.SkeletonColor
                  Height: =14
                  Width: =Parent.Width-48
                  X: =24
                  Y: =198
            - recSKL_Row2:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Fill: =cmp_SkeletonLoader.SkeletonColor
                  Height: =14
                  Width: =Parent.Width-120
                  X: =24
                  Y: =226
