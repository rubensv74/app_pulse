ComponentDefinitions:
  cmp_DonutPro:
    DefinitionType: CanvasComponent
    CustomProperties:
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Selection and interaction accent color
        DataType: Color
        Default: =ColorValue("#1677FF")
      BackgroundColor:
        PropertyKind: Input
        DisplayName: BackgroundColor
        Description: Main component background
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        Description: Component and row border color
        DataType: Color
        Default: =ColorValue("#E2E8F0")
      CenterFillColorHex:
        PropertyKind: Input
        DisplayName: CenterFillColorHex
        Description: CSS color used inside the donut hole
        DataType: Text
        Default: ="#FFFFFF"
      CenterLabel:
        PropertyKind: Input
        DisplayName: CenterLabel
        Description: Label shown below the central total
        DataType: Text
        Default: ="TOTAL"
      CenterLabelColorHex:
        PropertyKind: Input
        DisplayName: CenterLabelColorHex
        Description: CSS color used by the central label
        DataType: Text
        Default: ="#64748B"
      CenterValueColorHex:
        PropertyKind: Input
        DisplayName: CenterValueColorHex
        Description: CSS color used by the central value
        DataType: Text
        Default: ="#0F172A"
      CenterValueText:
        PropertyKind: Input
        DisplayName: CenterValueText
        Description: Optional custom central text; blank uses the calculated value
        DataType: Text
        Default: =""
      CompactMode:
        PropertyKind: Input
        DisplayName: CompactMode
        Description: Use compact legend rows and typography
        DataType: Boolean
        Default: =true
      DangerColor:
        PropertyKind: Input
        DisplayName: DangerColor
        Description: Error-state color
        DataType: Color
        Default: =ColorValue("#DC2626")
      DonutThickness:
        PropertyKind: Input
        DisplayName: DonutThickness
        Description: Ring thickness in SVG view-box units
        DataType: Number
        Default: =14
      EmptyText:
        PropertyKind: Input
        DisplayName: EmptyText
        Description: Empty-state message
        DataType: Text
        Default: ="No distribution data available."
      EnableSelection:
        PropertyKind: Input
        DisplayName: EnableSelection
        Description: Allow selection from the legend
        DataType: Boolean
        Default: =true
      ErrorText:
        PropertyKind: Input
        DisplayName: ErrorText
        Description: Error-state message
        DataType: Text
        Default: ="Distribution unavailable."
      HasSelection:
        PropertyKind: Output
        DataType: Boolean
      IsEmpty:
        PropertyKind: Output
        DataType: Boolean
      IsError:
        PropertyKind: Output
        DataType: Boolean
      IsLoading:
        PropertyKind: Output
        DataType: Boolean
      Items:
        PropertyKind: Input
        DisplayName: Items
        Description: Table with SegmentKey, SegmentLabel, SegmentValue, SegmentColor and SegmentOrder
        DataType: Table
        Default: |-
          =Table(
              {
                  SegmentKey: "OPEN",
                  SegmentLabel: "OPEN",
                  SegmentValue: 7370,
                  SegmentColor: "#64748B",
                  SegmentOrder: 1
              },
              {
                  SegmentKey: "CLEARED",
                  SegmentLabel: "CLEARED",
                  SegmentValue: 8,
                  SegmentColor: "#94A3B8",
                  SegmentOrder: 2
              },
              {
                  SegmentKey: "CLOSED",
                  SegmentLabel: "CLOSED",
                  SegmentValue: 3464,
                  SegmentColor: "#16A34A",
                  SegmentOrder: 3
              }
          )
      LoadingText:
        PropertyKind: Input
        DisplayName: LoadingText
        Description: Loading-state message
        DataType: Text
        Default: ="Loading distribution..."
      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Secondary text color
        DataType: Color
        Default: =ColorValue("#64748B")
      OnClearSelection:
        PropertyKind: Event
        ReturnType: None
        Default: =
      OnSegmentSelect:
        PropertyKind: Event
        ReturnType: None
        Default: =
      PercentageFormat:
        PropertyKind: Input
        DisplayName: PercentageFormat
        Description: Power Fx format used for percentages
        DataType: Text
        Default: ="[$-en-US]0.0%"
      SegmentCount:
        PropertyKind: Output
        DataType: Number
      SegmentGapPercent:
        PropertyKind: Input
        DisplayName: SegmentGapPercent
        Description: Visual gap removed from each positive segment
        DataType: Number
        Default: =0.65
      SelectedPercentage:
        PropertyKind: Output
        DataType: Number
      SelectedSegment:
        PropertyKind: Output
        DataType: Record
      SelectedSegmentColor:
        PropertyKind: Output
        DataType: Text
      SelectedSegmentKey:
        PropertyKind: Output
        DataType: Text
      SelectedSegmentLabel:
        PropertyKind: Output
        DataType: Text
      SelectedSegmentValue:
        PropertyKind: Output
        DataType: Number
      ShowLegend:
        PropertyKind: Input
        DisplayName: ShowLegend
        Description: Show the interactive legend
        DataType: Boolean
        Default: =true
      ShowPercentages:
        PropertyKind: Input
        DisplayName: ShowPercentages
        Description: Show percentages in the legend
        DataType: Boolean
        Default: =true
      ShowValues:
        PropertyKind: Input
        DisplayName: ShowValues
        Description: Show values in the legend
        DataType: Boolean
        Default: =true
      ShowZeroSegments:
        PropertyKind: Input
        DisplayName: ShowZeroSegments
        Description: Include zero-value segments in the legend
        DataType: Boolean
        Default: =true
      State:
        PropertyKind: Input
        DisplayName: State
        Description: ready, loading, empty or error
        DataType: Text
        Default: ="ready"
      Subtitle:
        PropertyKind: Input
        DisplayName: Subtitle
        Description: Component subtitle
        DataType: Text
        Default: ="Breakdown by category"
      SurfaceAltColor:
        PropertyKind: Input
        DisplayName: SurfaceAltColor
        Description: Alternate surface used by rows and states
        DataType: Color
        Default: =ColorValue("#F8FAFC")
      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Primary text color
        DataType: Color
        Default: =ColorValue("#0F172A")
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Component title
        DataType: Text
        Default: ="Distribution"
      TotalValue:
        PropertyKind: Output
        DataType: Number
      TrackColorHex:
        PropertyKind: Input
        DisplayName: TrackColorHex
        Description: CSS color used by the donut background track
        DataType: Text
        Default: ="#E2E8F0"
      ValueFormat:
        PropertyKind: Input
        DisplayName: ValueFormat
        Description: Power Fx format used for values
        DataType: Text
        Default: ="[$-en-US]#,##0"
      ValueSuffix:
        PropertyKind: Input
        DisplayName: ValueSuffix
        Description: Optional suffix appended to values
        DataType: Text
        Default: =""
    Properties:
      HasSelection: =!IsBlank(cmp_DonutPro.SelectedSegmentKey)
      Height: =168
      IsEmpty: |-
        =Lower(cmp_DonutPro.State) = "empty" ||
        CountRows(cmp_DonutPro.Items) = 0 ||
        cmp_DonutPro.TotalValue <= 0
      IsError: =Lower(cmp_DonutPro.State) = "error"
      IsLoading: =Lower(cmp_DonutPro.State) = "loading"
      OnReset: |-
        =
        Set(varDNP_SelectedSegmentKey, "")
      SegmentCount: |-
        =CountRows(
            Filter(
                cmp_DonutPro.Items,
                Coalesce(Value(SegmentValue), 0) > 0
            )
        )
      SelectedPercentage: |-
        =If(
            cmp_DonutPro.TotalValue <= 0,
            0,
            cmp_DonutPro.SelectedSegmentValue / cmp_DonutPro.TotalValue
        )
      SelectedSegment: |-
        =LookUp(
            cmp_DonutPro.Items,
            Text(SegmentKey) = cmp_DonutPro.SelectedSegmentKey
        )
      SelectedSegmentColor: |-
        =Coalesce(
            LookUp(
                cmp_DonutPro.Items,
                Text(SegmentKey) = cmp_DonutPro.SelectedSegmentKey,
                Text(SegmentColor)
            ),
            ""
        )
      SelectedSegmentKey: =Coalesce(varDNP_SelectedSegmentKey, "")
      SelectedSegmentLabel: |-
        =Coalesce(
            LookUp(
                cmp_DonutPro.Items,
                Text(SegmentKey) = cmp_DonutPro.SelectedSegmentKey,
                Text(SegmentLabel)
            ),
            ""
        )
      SelectedSegmentValue: |-
        =Coalesce(
            LookUp(
                cmp_DonutPro.Items,
                Text(SegmentKey) = cmp_DonutPro.SelectedSegmentKey,
                Value(SegmentValue)
            ),
            0
        )
      TotalValue: |-
        =Sum(
            cmp_DonutPro.Items,
            Coalesce(Value(SegmentValue), 0)
        )
      Width: =560
    Children:
      - conDNP_Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =cmp_DonutPro.BorderColor
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =cmp_DonutPro.BackgroundColor
            Height: =Parent.Height
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            RadiusTopLeft: =14
            RadiusTopRight: =14
            Width: =Parent.Width
          Children:
            - lblDNP_Title:
                Control: Label@2.5.1
                Properties:
                  Color: =cmp_DonutPro.TextColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =cmp_DonutPro.Title
                  Width: =Parent.Width - 170
                  X: =16
                  Y: =10
            - lblDNP_Subtitle:
                Control: Label@2.5.1
                Properties:
                  Color: =cmp_DonutPro.MutedTextColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =16
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =8
                  Text: =cmp_DonutPro.Subtitle
                  Width: =Parent.Width - 170
                  X: =16
                  Y: =31
            - lblDNP_SelectedContext:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =cmp_DonutPro.MutedTextColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =18
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =8
                  Text: |-
                    =If(
                        cmp_DonutPro.HasSelection,
                        cmp_DonutPro.SelectedSegmentLabel &
                        "  ·  " &
                        Text(
                            cmp_DonutPro.SelectedPercentage,
                            cmp_DonutPro.PercentageFormat
                        ),
                        Text(
                            cmp_DonutPro.SegmentCount,
                            "[$-en-US]#,##0"
                        ) & " segments"
                    )
                  Tooltip: |-
                    =If(
                        cmp_DonutPro.HasSelection,
                        cmp_DonutPro.SelectedSegmentLabel &
                        " · " &
                        Text(
                            cmp_DonutPro.SelectedSegmentValue,
                            cmp_DonutPro.ValueFormat
                        ) &
                        cmp_DonutPro.ValueSuffix &
                        " · " &
                        Text(
                            cmp_DonutPro.SelectedPercentage,
                            cmp_DonutPro.PercentageFormat
                        ),
                        cmp_DonutPro.CenterLabel
                    )
                  Width: =145
                  X: =Parent.Width - 177
                  Y: =16
            - icoDNP_ClearSelection:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =cmp_DonutPro.MutedTextColor
                  Height: =15
                  HoverColor: =cmp_DonutPro.AccentColor
                  Icon: =Icon.Cancel
                  OnSelect: |-
                    =
                    Set(varDNP_SelectedSegmentKey, "");
                    cmp_DonutPro.OnClearSelection()
                  PressedColor: =cmp_DonutPro.AccentColor
                  Visible: =cmp_DonutPro.HasSelection
                  Width: =15
                  X: =Parent.Width - 24
                  Y: =17
            - htmlDNP_Donut:
                Control: HtmlViewer@2.1.0
                Properties:
                  Height: =Parent.Height - 52
                  HtmlText: |-
                    =With(
                        {
                            _positiveItems:
                                SortByColumns(
                                    Filter(
                                        cmp_DonutPro.Items,
                                        Coalesce(Value(SegmentValue), 0) > 0
                                    ),
                                    "SegmentOrder",
                                    SortOrder.Ascending
                                ),
                            _total: cmp_DonutPro.TotalValue,
                            _centerNumber:
                                If(
                                    cmp_DonutPro.HasSelection,
                                    cmp_DonutPro.SelectedSegmentValue,
                                    cmp_DonutPro.TotalValue
                                ),
                            _centerText:
                                If(
                                    !IsBlank(cmp_DonutPro.CenterValueText) &&
                                    !cmp_DonutPro.HasSelection,
                                    cmp_DonutPro.CenterValueText,
                                    Text(
                                        If(
                                            cmp_DonutPro.HasSelection,
                                            cmp_DonutPro.SelectedSegmentValue,
                                            cmp_DonutPro.TotalValue
                                        ),
                                        cmp_DonutPro.ValueFormat
                                    ) & cmp_DonutPro.ValueSuffix
                                ),
                            _centerLabelRaw:
                                Upper(
                                    If(
                                        cmp_DonutPro.HasSelection,
                                        cmp_DonutPro.SelectedSegmentLabel,
                                        cmp_DonutPro.CenterLabel
                                    )
                                )
                        },
                        With(
                            {
                                _centerLabel:
                                    Substitute(
                                        Substitute(
                                            Substitute(
                                                Substitute(
                                                    If(
                                                        Len(_centerLabelRaw) > 18,
                                                        Left(_centerLabelRaw, 16) & "…",
                                                        _centerLabelRaw
                                                    ),
                                                    "&",
                                                    "&amp;"
                                                ),
                                                "<",
                                                "&lt;"
                                            ),
                                            ">",
                                            "&gt;"
                                        ),
                                        Char(34),
                                        "&quot;"
                                    ),
                                _safeCenterText:
                                    Substitute(
                                        Substitute(
                                            Substitute(
                                                Substitute(
                                                    _centerText,
                                                    "&",
                                                    "&amp;"
                                                ),
                                                "<",
                                                "&lt;"
                                            ),
                                            ">",
                                            "&gt;"
                                        ),
                                        Char(34),
                                        "&quot;"
                                    )
                            },
                            "<div style='width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Segoe UI,Arial,sans-serif;'>" &
                            "<svg viewBox='0 0 190 120' width='100%' height='100%' role='img' aria-label='Donut distribution'>" &
                            "<circle cx='82' cy='60' r='43' pathLength='100' fill='none' stroke='" &
                                cmp_DonutPro.TrackColorHex &
                                "' stroke-width='" &
                                Text(cmp_DonutPro.DonutThickness, "[$-en-US]0.##") &
                                "'/>" &
                            Concat(
                                Sequence(CountRows(_positiveItems)) As DNPIndex,
                                With(
                                    {
                                        _item:
                                            Last(
                                                FirstN(
                                                    _positiveItems,
                                                    DNPIndex.Value
                                                )
                                            ),
                                        _percent:
                                            100 *
                                            Coalesce(
                                                Value(
                                                    Last(
                                                        FirstN(
                                                            _positiveItems,
                                                            DNPIndex.Value
                                                        )
                                                    ).SegmentValue
                                                ),
                                                0
                                            ) /
                                            Max(0.0001, _total),
                                        _previousPercent:
                                            100 *
                                            Sum(
                                                FirstN(
                                                    _positiveItems,
                                                    DNPIndex.Value - 1
                                                ),
                                                Coalesce(Value(SegmentValue), 0)
                                            ) /
                                            Max(0.0001, _total),
                                        _isSelected:
                                            cmp_DonutPro.SelectedSegmentKey =
                                            Text(
                                                Last(
                                                    FirstN(
                                                        _positiveItems,
                                                        DNPIndex.Value
                                                    )
                                                ).SegmentKey
                                            )
                                    },
                                    "<circle cx='82' cy='60' r='43' pathLength='100' fill='none' stroke='" &
                                        Coalesce(Text(_item.SegmentColor), "#64748B") &
                                        "' stroke-width='" &
                                        Text(
                                            If(
                                                _isSelected,
                                                cmp_DonutPro.DonutThickness + 2,
                                                cmp_DonutPro.DonutThickness
                                            ),
                                            "[$-en-US]0.##"
                                        ) &
                                        "' stroke-dasharray='" &
                                        Text(
                                            Max(
                                                0.15,
                                                _percent -
                                                If(
                                                    CountRows(_positiveItems) > 1,
                                                    cmp_DonutPro.SegmentGapPercent,
                                                    0
                                                )
                                            ),
                                            "[$-en-US]0.########"
                                        ) &
                                        " " &
                                        Text(
                                            100 -
                                            Max(
                                                0.15,
                                                _percent -
                                                If(
                                                    CountRows(_positiveItems) > 1,
                                                    cmp_DonutPro.SegmentGapPercent,
                                                    0
                                                )
                                            ),
                                            "[$-en-US]0.########"
                                        ) &
                                        "' stroke-dashoffset='-" &
                                        Text(
                                            _previousPercent,
                                            "[$-en-US]0.########"
                                        ) &
                                        "' stroke-linecap='butt' transform='rotate(-90 82 60)' opacity='" &
                                        If(
                                            cmp_DonutPro.HasSelection && !_isSelected,
                                            "0.48",
                                            "1"
                                        ) &
                                        "'/>"
                                )
                            ) &
                            "<circle cx='82' cy='60' r='31' fill='" &
                                cmp_DonutPro.CenterFillColorHex &
                                "'/>" &
                            "<text x='82' y='57' text-anchor='middle' dominant-baseline='middle' fill='" &
                                cmp_DonutPro.CenterValueColorHex &
                                "' font-size='17' font-weight='700'>" &
                                _safeCenterText &
                                "</text>" &
                            "<text x='82' y='75' text-anchor='middle' dominant-baseline='middle' fill='" &
                                cmp_DonutPro.CenterLabelColorHex &
                                "' font-size='7.5' font-weight='600' letter-spacing='0.5'>" &
                                _centerLabel &
                                "</text>" &
                            If(
                                cmp_DonutPro.HasSelection,
                                "<text x='82' y='88' text-anchor='middle' dominant-baseline='middle' fill='" &
                                    cmp_DonutPro.CenterLabelColorHex &
                                    "' font-size='7'>" &
                                    Text(
                                        cmp_DonutPro.SelectedPercentage,
                                        cmp_DonutPro.PercentageFormat
                                    ) &
                                    "</text>",
                                ""
                            ) &
                            "</svg></div>"
                        )
                    )
                  Visible: =!cmp_DonutPro.IsLoading && !cmp_DonutPro.IsEmpty && !cmp_DonutPro.IsError
                  Width: |-
                    =If(
                        cmp_DonutPro.ShowLegend && Parent.Width >= 420,
                        194,
                        Parent.Width - 24
                    )
                  X: =8
                  Y: =48
            - galDNP_Legend:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Height: =Parent.Height - 58
                  Items: |-
                    =SortByColumns(
                        AddColumns(
                            Filter(
                                cmp_DonutPro.Items,
                                cmp_DonutPro.ShowZeroSegments ||
                                Coalesce(Value(SegmentValue), 0) > 0
                            ),
                            DNPPercentage,
                                If(
                                    cmp_DonutPro.TotalValue <= 0,
                                    0,
                                    Coalesce(Value(SegmentValue), 0) /
                                    cmp_DonutPro.TotalValue
                                )
                        ),
                        "SegmentOrder",
                        SortOrder.Ascending
                    )
                  TemplatePadding: =2
                  TemplateSize: =If(cmp_DonutPro.CompactMode, 34, 42)
                  Visible: |-
                    =cmp_DonutPro.ShowLegend &&
                    Parent.Width >= 420 &&
                    !cmp_DonutPro.IsLoading &&
                    !cmp_DonutPro.IsEmpty &&
                    !cmp_DonutPro.IsError
                  Width: =Parent.Width - 214
                  X: =206
                  Y: =52
                Children:
                  - btnDNP_LegendRow:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =cmp_DonutPro.AccentColor
                        BorderThickness: |-
                          =If(
                              cmp_DonutPro.SelectedSegmentKey = Text(ThisItem.SegmentKey),
                              1,
                              0
                          )
                        Color: =Color.Transparent
                        DisabledBorderColor: =Color.Transparent
                        DisabledFill: =Color.Transparent
                        DisplayMode: |-
                          =If(
                              cmp_DonutPro.EnableSelection,
                              DisplayMode.Edit,
                              DisplayMode.Disabled
                          )
                        Fill: |-
                          =If(
                              cmp_DonutPro.SelectedSegmentKey = Text(ThisItem.SegmentKey),
                              ColorFade(cmp_DonutPro.AccentColor, 0.92),
                              Color.Transparent
                          )
                        FocusedBorderColor: =cmp_DonutPro.AccentColor
                        FocusedBorderThickness: =1
                        Height: =Parent.TemplateHeight - 2
                        HoverBorderColor: =cmp_DonutPro.AccentColor
                        HoverFill: =ColorFade(cmp_DonutPro.AccentColor, 0.96)
                        OnSelect: |-
                          =
                          Set(
                              varDNP_SelectedSegmentKey,
                              Text(ThisItem.SegmentKey)
                          );
                          cmp_DonutPro.OnSegmentSelect()
                        PressedBorderColor: =cmp_DonutPro.AccentColor
                        PressedFill: =ColorFade(cmp_DonutPro.AccentColor, 0.9)
                        RadiusBottomLeft: =7
                        RadiusBottomRight: =7
                        RadiusTopLeft: =7
                        RadiusTopRight: =7
                        Text: =""
                        Tooltip: |-
                          =Text(ThisItem.SegmentLabel) &
                          " · " &
                          Text(
                              Coalesce(Value(ThisItem.SegmentValue), 0),
                              cmp_DonutPro.ValueFormat
                          ) &
                          cmp_DonutPro.ValueSuffix &
                          " · " &
                          Text(
                              ThisItem.DNPPercentage,
                              cmp_DonutPro.PercentageFormat
                          )
                        Width: =Parent.TemplateWidth - 4
                        X: =2
                  - btnDNP_ColorSwatch:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =Color.Transparent
                        BorderThickness: =0
                        DisplayMode: =DisplayMode.View
                        Fill: =ColorValue(Coalesce(Text(ThisItem.SegmentColor), "#64748B"))
                        Height: =10
                        RadiusBottomLeft: =5
                        RadiusBottomRight: =5
                        RadiusTopLeft: =5
                        RadiusTopRight: =5
                        Text: =""
                        Width: =10
                        X: =10
                        Y: =8
                  - lblDNP_SegmentLabel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =cmp_DonutPro.TextColor
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        OnSelect: =Select(btnDNP_LegendRow)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =If(cmp_DonutPro.CompactMode, 8, 9)
                        Text: =Text(ThisItem.SegmentLabel)
                        Tooltip: =Text(ThisItem.SegmentLabel)
                        Width: |-
                          =Parent.TemplateWidth -
                          If(cmp_DonutPro.ShowValues, 86, 24) -
                          If(cmp_DonutPro.ShowPercentages, 62, 0)
                        X: =28
                        Y: =4
                  - lblDNP_SegmentValue:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =cmp_DonutPro.TextColor
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        OnSelect: =Select(btnDNP_LegendRow)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =If(cmp_DonutPro.CompactMode, 8, 9)
                        Text: |-
                          =Text(
                              Coalesce(Value(ThisItem.SegmentValue), 0),
                              cmp_DonutPro.ValueFormat
                          ) & cmp_DonutPro.ValueSuffix
                        Visible: =cmp_DonutPro.ShowValues
                        Width: =74
                        X: |-
                          =Parent.TemplateWidth -
                          Self.Width -
                          If(cmp_DonutPro.ShowPercentages, 58, 8)
                        Y: =4
                  - lblDNP_SegmentPercentage:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =cmp_DonutPro.MutedTextColor
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        Height: =18
                        OnSelect: =Select(btnDNP_LegendRow)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =If(cmp_DonutPro.CompactMode, 8, 9)
                        Text: |-
                          =Text(
                              ThisItem.DNPPercentage,
                              cmp_DonutPro.PercentageFormat
                          )
                        Visible: =cmp_DonutPro.ShowPercentages
                        Width: =52
                        X: =Parent.TemplateWidth - Self.Width - 6
                        Y: =4
                  - btnDNP_BarTrack:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =Color.Transparent
                        BorderThickness: =0
                        DisplayMode: =DisplayMode.View
                        Fill: =cmp_DonutPro.SurfaceAltColor
                        Height: =3
                        RadiusBottomLeft: =2
                        RadiusBottomRight: =2
                        RadiusTopLeft: =2
                        RadiusTopRight: =2
                        Text: =""
                        Width: =Parent.TemplateWidth - 36
                        X: =28
                        Y: =Parent.TemplateHeight - 8
                  - btnDNP_BarFill:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =Color.Transparent
                        BorderThickness: =0
                        DisplayMode: =DisplayMode.View
                        Fill: =ColorValue(Coalesce(Text(ThisItem.SegmentColor), "#64748B"))
                        Height: =3
                        RadiusBottomLeft: =2
                        RadiusBottomRight: =2
                        RadiusTopLeft: =2
                        RadiusTopRight: =2
                        Text: =""
                        Width: =Max(0, (Parent.TemplateWidth - 36) * ThisItem.DNPPercentage)
                        X: =28
                        Y: =Parent.TemplateHeight - 8
            - conDNP_StateOverlay:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255,255,255,0.94)
                  Height: =Parent.Height - 46
                  Visible: =cmp_DonutPro.IsLoading || cmp_DonutPro.IsEmpty || cmp_DonutPro.IsError
                  Width: =Parent.Width
                  Y: =46
                Children:
                  - spnDNP_Loading:
                      Control: Spinner@1.4.6
                      Properties:
                        Height: =28
                        SpinnerColor: =cmp_DonutPro.AccentColor
                        Visible: =cmp_DonutPro.IsLoading
                        Width: =28
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =(Parent.Height - 62) / 2
                  - lblDNP_State:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: |-
                          =If(
                              cmp_DonutPro.IsError,
                              cmp_DonutPro.DangerColor,
                              cmp_DonutPro.MutedTextColor
                          )
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =52
                        PaddingBottom: =8
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =8
                        Size: =10
                        Text: |-
                          =If(
                              cmp_DonutPro.IsLoading,
                              cmp_DonutPro.LoadingText,
                              If(
                                  cmp_DonutPro.IsError,
                                  cmp_DonutPro.ErrorText,
                                  cmp_DonutPro.EmptyText
                              )
                          )
                        Width: =Parent.Width - 80
                        X: =40
                        Y: =(Parent.Height - Self.Height) / 2 + If(cmp_DonutPro.IsLoading, 24, 0)

