            - btnDrawerLoad_Custom_2:
                Control: Button@0.0.45
                Properties:
                  OnSelect: |-
                    =

                    Set(varCT_Loading, true);
                    Set(varCT_Error, "");

                    // Limpieza
                    Clear(colCT_Quick);
                    Clear(colCT_Merged_Base);
                    Clear(colCT_Merged_UI);

                    // Llamada al flow
                    With(
                        {
                            resp: WarRoom_GetCustomBundle.Run(
                                comp_DetailDrawer_2.ProjectId,
                                comp_DetailDrawer_2.EntityType,
                                comp_DetailDrawer_2.RecordId
                            )
                        },

                        With(
                            {
                                parsed: ParseJSON(Coalesce(resp.bundlejson, "{}"))
                            },

                            // Base (defs)
                            ClearCollect(
                                colCT_Merged_Base,
                                ForAll(
                                    Table(parsed.defs),
                                    {
                                        FieldKey: Text(ThisRecord.Value.FieldKey),
                                        Label: Text(ThisRecord.Value.Label),
                                        FieldType: Text(ThisRecord.Value.FieldType),
                                        IsRequired: Boolean(ThisRecord.Value.IsRequired),
                                        IsPinned: Boolean(ThisRecord.Value.IsPinned),
                                        SortOrder: Value(ThisRecord.Value.SortOrder),
                                        OptionsJson: Text(ThisRecord.Value.OptionsJson)
                                    }
                                )
                            );

                            // Valores (values)
                            ClearCollect(
                                colCT_Merged_UI,
                                ForAll(
                                    Table(parsed.values),
                                    {
                                        FieldKey: Text(ThisRecord.Value.FieldKey),
                                        ValueText: Text(ThisRecord.Value.ValueText),
                                        ValueNumber: Value(ThisRecord.Value.ValueNumber),
                                        ValueDate: If(
                                            !IsBlank(ThisRecord.Value.ValueDate),
                                            DateTimeValue(Text(ThisRecord.Value.ValueDate)),
                                            Blank()
                                        ),
                                        ValueBool: Boolean(ThisRecord.Value.ValueBool)
                                    }
                                )
                            )
                        )
                    );

                    // Merge final (lo que pinta la UI)
                    ClearCollect(
                        colCT_Quick,
                        AddColumns(
                            colCT_Merged_Base,
                            CurrentValue,
                            LookUp(colCT_Merged_UI, FieldKey = ThisRecord.FieldKey)
                        )
                    );

                    Set(varCT_Loading, false);
                  Visible: =false
                  X: =60
                  Y: =60
            - btnDrawerLoad_Comments_2:
                Control: Button@0.0.45
                Properties:
                  OnSelect: |-
                    =Set(varIsLoadingComments, true);

                    Set(varCommentsPage, 1);
                    Set(varCommentsPageSize, Coalesce(varCommentsPageSize, 20));

                    With(
                        {
                            resp: Warroom_GetTaskCommentsPaged.Run(
                                varProjectId,
                                varDrawerRecordId,
                                varCommentsPage,
                                varCommentsPageSize,
                                varDrawerEntityType
                            )
                        },
                        With(
                            {
                                arr: Table(ParseJSON(Coalesce(resp.result, "[]")))
                            },
                            ClearCollect(
                                colComments,
                                ForAll(
                                    arr,
                                    {
                                        CommentId: Value(ThisRecord.Value.CommentId),
                                        CommentText: Text(ThisRecord.Value.CommentText),
                                        CommentType: Text(ThisRecord.Value.CommentType),
                                        CreatedOn: DateTimeValue(Text(ThisRecord.Value.CreatedOn)),
                                        CreatedByEmail: Text(ThisRecord.Value.CreatedByEmail),
                                        CreatedByName: Text(ThisRecord.Value.CreatedByName),
                                        TotalRows: Value(ThisRecord.Value.TotalRows),
                                        TotalPages: Value(ThisRecord.Value.TotalPages),
                                        PageNumber: Value(ThisRecord.Value.PageNumber),
                                        PageSize: Value(ThisRecord.Value.PageSize)
                                    }
                                )
                            )
                        )
                    );

                    Set(varCommentsTotalRows, If(CountRows(colComments) > 0, First(colComments).TotalRows, 0));
                    Set(varCommentsTotalPages, If(CountRows(colComments) > 0, First(colComments).TotalPages, 0));

                    Set(varIsLoadingComments, false);
                    Set(varDrawerIsLoading, false);
                  Visible: =false
                  X: =80
                  Y: =80
            - btnDrawerLoad_2:
                Control: Button@0.0.45
                Properties:
                  OnSelect: |-
                    =Set(varDrawerIsLoading, true);

                    Switch(
                        varDrawerTab,
                        "Comments", Select(btnDrawerLoad_Comments_2),
                        "Custom", Select(btnDrawerLoad_Custom_2),
                        "Overview", Set(varDrawerIsLoading, false),
                        "History", Set(varDrawerIsLoading, false),
                        Set(varDrawerIsLoading, false)
                    );
                  Visible: =false
                  X: =40
                  Y: =40
            - btnDrawerRefreshFromTab_2:
                Control: Button@0.0.45
                Properties:
                  OnSelect: |-
                    =
                    Set(varDrawerTab, "Custom");
                    Select(btnDrawerLoad_Custom_2)
                  Visible: =false
            - btnCT_LoadDefs_2:
                Control: Button@0.0.45
                Properties:
                  OnSelect: |-
                    =
                    Set(varCT_DefsIsLoading, true);
                    Set(varCT_DefsError, "");

                    Clear(colCT_Defs_Admin);

                    Set(
                        varCT_DefsResp,
                        WarRoom_ListCustomFieldDefs.Run(
                            comp_DetailDrawer_2.ProjectId,
                            comp_DetailDrawer_2.EntityType,
                            If(varCT_ShowInactiveDefs, 1, 0)
                        )
                    );


                    Set(
                        varCT_DefsOuter,
                        Table(ParseJSON(Coalesce(varCT_DefsResp.result, "[]")))
                    );

                    If(
                        CountRows(varCT_DefsOuter) = 0,

                        Set(varCT_DefsError, "The flow returned no data."),

                        Set(
                            varCT_DefsBundle,
                            ParseJSON(
                                Text(First(varCT_DefsOuter).Value.result)
                            )
                        );

                        ClearCollect(
                            colCT_Defs_Admin,
                            ForAll(
                                Table(varCT_DefsBundle.defs),
                                {
                                    FieldDefId: Value(ThisRecord.Value.FieldDefId),
                                    ProjectId: Value(ThisRecord.Value.ProjectId),
                                    EntityType: Text(ThisRecord.Value.EntityType),
                                    FieldKey: Text(ThisRecord.Value.FieldKey),
                                    Label: Text(ThisRecord.Value.Label),
                                    FieldType: Text(ThisRecord.Value.FieldType),
                                    HelpText: Coalesce(Text(ThisRecord.Value.HelpText), ""),
                                    IsRequired: Boolean(ThisRecord.Value.IsRequired),
                                    IsPinned: Boolean(ThisRecord.Value.IsPinned),
                                    IsActive: Boolean(ThisRecord.Value.IsActive),
                                    SortOrder: Value(ThisRecord.Value.SortOrder),
                                    OptionsJson: Coalesce(Text(ThisRecord.Value.OptionsJson), ""),
                                    ModifiedOn: If(
                                        IsBlank(Text(ThisRecord.Value.ModifiedOn)),
                                        Blank(),
                                        DateTimeValue(Text(ThisRecord.Value.ModifiedOn))
                                    ),
                                    ModifiedByEmail: Coalesce(Text(ThisRecord.Value.ModifiedByEmail), "")
                                }
                            )
                        )
                    );

                    Set(varCT_DefsIsLoading, false);
                  Visible: =false
                  X: =100
                  Y: =100
            - btnCT_SetActive_2:
                Control: Button@0.0.45
                Properties:
                  OnSelect: |-
                    =

                    With(
                        {
                            resp: WarRoom_SetCustomFieldActive.Run(
                                comp_DetailDrawer_2.ProjectId,
                                comp_DetailDrawer_2.EntityType,
                                varCT_Toggle_FieldKey,
                                varCT_Toggle_IsActive,
                                comp_DetailDrawer_2.UserEmail
                            )
                        },
                        Select(btnCT_LoadDefs_2);
                        Select(btnDrawerLoad_Custom_2)
                    );
                  Visible: =false
                  X: =140
                  Y: =140
            - btnCT_SaveFieldDef_2:
                Control: Button@0.0.45
                Properties:
                  OnSelect: "=\r\nIf(\r\n    IsBlank(Trim(varCT_Edit_Label)),\r\n    Set(varCT_SaveField_Error, \"Label is required.\");\r\n    Set(varCT_SaveField_IsLoading, false),\r\n\r\n    IsBlank(Trim(varCT_Edit_FieldKey)),\r\n    Set(varCT_SaveField_Error, \"Field key is required.\");\r\n    Set(varCT_SaveField_IsLoading, false),\r\n\r\n    !IsBlank(\r\n        LookUp(\r\n            colCT_Defs_Admin,\r\n            Lower(Trim(FieldKey)) = Lower(Trim(varCT_Edit_FieldKey)) &&\r\n            FieldDefId <> Coalesce(varCT_Edit_FieldDefId, 0)\r\n        )\r\n    ),\r\n\r\n    Set(varCT_SaveField_Error, \"This Field Key already exists.\");\r\n    Set(varCT_SaveField_IsLoading, false);\r\n    Notify(\"This Field Key already exists. Use another key or edit the existing field.\", NotificationType.Error),\r\n\r\n    Value(varCT_Edit_SortOrder) <= 0,\r\n    Set(varCT_SaveField_Error, \"Sort order must be greater than zero.\");\r\n    Set(varCT_SaveField_IsLoading, false),\r\n\r\n    (varCT_Edit_FieldType = \"Choice\" || varCT_Edit_FieldType = \"MultiChoice\") && IsBlank(Trim(varCT_Edit_OptionsJson)),\r\n    Set(varCT_SaveField_Error, \"OptionsJson is required for Choice and MultiChoice fields.\");\r\n    Set(varCT_SaveField_IsLoading, false),\r\n\r\n    With(\r\n        {\r\n            resp: WarRoom_UpsertCustomFieldDef.Run(\r\n                Coalesce(varCT_Edit_FieldDefId, 0),\r\n                comp_DetailDrawer_2.ProjectId,\r\n                comp_DetailDrawer_2.EntityType,\r\n                Trim(varCT_Edit_Label),\r\n                varCT_Edit_FieldType,\r\n                Trim(varCT_Edit_HelpText),\r\n                Value(varCT_Edit_SortOrder),\r\n                If(IsBlank(Trim(varCT_Edit_OptionsJson)), \" \", Trim(varCT_Edit_OptionsJson)),\r\n                comp_DetailDrawer_2.UserEmail,\r\n                Lower(Trim(varCT_Edit_FieldKey)),\r\n                varCT_Edit_IsRequired,\r\n                varCT_Edit_IsPinned,\r\n                varCT_Edit_IsActive\r\n            )\r\n        },\r\n        \r\n        Set(varShowCustomAddFields, false);\r\n        Set(varCT_SaveField_Error, \"\");\r\n        Set(varCT_SaveField_IsLoading, false);\r\n\r\n        Select(btnCT_LoadDefs_2);\r\n\r\n        Set(varCT_LoadKey, \"\");\r\n        Select(btnDrawerLoad_Custom_2);\r\n\r\n        Notify(\"Field definition saved successfully.\", NotificationType.Success)\r\n    )\r\n)"
                  Visible: =false
                  X: =160
                  Y: =160
