Screens:
  scr_Tasks:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =


        Set(varAppView, "Tasks");

        Set(varGlobalLoading, false);
        Set(varGlobalLoadingMsg, "");
        Set(varGlobalLoadingSubMsg, "");
        Set(varGlobalLoadingScope, "");

        If(
            varTasks_AutoLoad,
            Set(varTasks_AutoLoad, false);
            Select(btnTasks_LoadPage_Tasks)
        )
    Children:
      - conTasksScreenRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =varTheme_PageBg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width
          Children:
            - cmp_NavApp_Tasks:
                Control: CanvasComponent
                ComponentName: cmp_SidebarNav
                Properties:
                  ActiveKey: =varAppView
                  Fill: =varTheme_PulseBlue
                  Height: =Parent.Height
                  IsCollapsed: =true
                  Items: =colSidebarNavItems
                  NavItems: =colSidebarNavItems
                  OnSelectItem: |-
                    =

                    With(
                        {
                            _key: Lower(Trim(Self.SelectedItemKey)),
                            _hasProject: !IsBlank(varProjectId)
                        },
                        If(
                            _key <> "home" && !_hasProject,

                            Notify("Please select a project first.", NotificationType.Warning);
                            Set(varAppView, "Home");
                            Navigate(scr_Home, ScreenTransition.None),

                            Switch(
                                _key,

                                "home",
                                    Set(varAppView, "Home");
                                    Set(varHomeViewMode, "DASHBOARD");
                                    Navigate(scr_Home, ScreenTransition.None),

                                "overview",
                                    Set(varAppView, "Overview");
                                    Set(varOps_ViewMode, "OVERVIEW");
                                    Navigate(scr_Overview, ScreenTransition.None),

                                "tasks",
                                    Set(varAppView, "Tasks");
                                    Navigate(scr_Tasks, ScreenTransition.None),

                                "punches",
                                    Set(varAppView, "Punches");
                                    Navigate(scr_Punches, ScreenTransition.None),

                                "briefing",
                                    Set(varAppView, "Briefing");
                                    Navigate(scr_Briefing, ScreenTransition.None),

                                "config",
                                    Set(varAppView, "Config");
                                    Navigate(scr_Config, ScreenTransition.None),

                                "superadmin",
                                    Set(varAppView, "SuperAdmin");
                                    Navigate(scr_SuperAdmin, ScreenTransition.None),

                                Notify("Key not mapped: [" & _key & "]", NotificationType.Error)
                            )
                        )
                    )
                  OnToggleCollapse: =
                  UserRole: ="Text"
                  Width: =154
            - btnTasks_LoadPage_Tasks:
                Control: Button@0.0.45
                Properties:
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: |-
                    =
                    Set(varGlobalLoading, true);
                    Set(varGlobalLoadingMsg, "Loading Tasks...");
                    Set(varGlobalLoadingScope, "TASKS");

                    // =====================================================
                    // Load Tasks - Multi Project Safe
                    // =====================================================

                    If(
                        IsBlank(varProjectId),
                        Notify("Please select a project first.", NotificationType.Warning);
                        Set(varTasks_IsLoading, false);
                        Set(varLoadingMsg, "");

                        Set(varGlobalLoading, false);
                    Set(varGlobalLoadingMsg, "");
                    Set(varGlobalLoadingScope, "");

                        Exit()
                    );

                    If(
                        varTasks_IsLoading,
                        Notify("Tasks are already loading.", NotificationType.Information);

                        Set(varGlobalLoading, false);
                    Set(varGlobalLoadingMsg, "");
                    Set(varGlobalLoadingScope, "");

                        Exit()
                    );

                    Clear(colTasks);

                    Set(varLoadingMsg, "Loading tasks...");
                    Set(varTasks_IsLoading, true);
                    Set(varTasks_Error, "");

                    IfError(
                        With(
                            {
                                resp: Warroom_Tasks_Filtered_Paged.Run(
                                    varProjectId,
                                    If(IsBlank(varTasks_Filter_Subsystem), "", Text(varTasks_Filter_Subsystem)),
                                    If(IsBlank(varFilter_ElementDiscipline), "", Text(varFilter_ElementDiscipline)),
                                    If(IsBlank(varFilter_Subcontractor), "", Text(varFilter_Subcontractor)),
                                    Text(varTasks_Page),
                                    If(IsBlank(varOps_ToTasks_L3NodeId), "", Text(varOps_ToTasks_L3NodeId))
                                )
                            },
                            With(
                                {
                                    arr: Table(ParseJSON(Coalesce(resp.result, "[]")))
                                },
                                ClearCollect(
                                    colTasks,
                                    ForAll(
                                        arr,
                                        With(
                                            { r: ThisRecord.Value },
                                            {
                                                AreaCode: Text(r.AreaCode),
                                                UnitCode: Text(r.UnitCode),
                                                SystemCode: Text(r.SystemCode),
                                                SubsystemCode: Text(r.SubsystemCode),
                                                ElementCode: Text(r.ElementCode),
                                                ElementDiscipline: Text(r.ElementDiscipline),
                                                ElementLevel: Text(r.ElementLevel),
                                                TypeCode: Text(r.TypeCode),

                                                InspectionTaskId: Value(Text(r.InspectionTaskId)),
                                                TaskPhase: Text(r.TaskPhase),
                                                FormName: Text(r.FormName),
                                                FormDescription: Text(r.FormDescription),
                                                Sct: Text(r.Sct),
                                                TaskStatus: Text(r.TaskStatus),

                                                TaskActive: Boolean(r.TaskActive),

                                                ClosingDate: If(IsBlank(Text(r.ClosingDate)), Blank(), DateTimeValue(Text(r.ClosingDate))),
                                                SignedBySubcontractor: If(IsBlank(Text(r.SignedBySubcontractor)), Blank(), DateTimeValue(Text(r.SignedBySubcontractor))),
                                                SignedByContractor: If(IsBlank(Text(r.SignedByContractor)), Blank(), DateTimeValue(Text(r.SignedByContractor))),
                                                SignedByCompany: If(IsBlank(Text(r.SignedByCompany)), Blank(), DateTimeValue(Text(r.SignedByCompany))),

                                                SubcontractCode: Text(r.SubcontractCode),
                                                SubcontractorName: Text(r.SubcontractorName),

                                                CustomJson: Coalesce(Text(r.CustomJson), "{}"),
                                                CustomFlag1: Boolean(r.CustomFlag1),
                                                CustomFlag2: Boolean(r.CustomFlag2),
                                                CustomText1: Text(r.CustomText1),
                                                CustomText2: Text(r.CustomText2),
                                                CustomDate1: If(IsBlank(Text(r.CustomDate1)), Blank(), DateValue(Text(r.CustomDate1))),
                                                CustomNumber1: If(IsBlank(Text(r.CustomNumber1)), Blank(), Value(Text(r.CustomNumber1))),
                                                CustomLastUpdatedByEmail: Text(r.CustomLastUpdatedByEmail),
                                                CustomLastUpdatedOn: If(IsBlank(Text(r.CustomLastUpdatedOn)), Blank(), DateTimeValue(Text(r.CustomLastUpdatedOn))),

                                                LastCommentOn: If(IsBlank(Text(r.LastCommentOn)), Blank(), DateTimeValue(Text(r.LastCommentOn))),
                                                LastCommentText: Text(r.LastCommentText),
                                                LastCommentByEmail: Text(r.LastCommentByEmail),
                                                CommentCount: If(IsBlank(Text(r.CommentCount)), 0, Value(Text(r.CommentCount))),

                                                TotalRows: Value(Text(r.TotalRows)),
                                                TotalPages: Value(Text(r.TotalPages)),
                                                PageNumber: Value(Text(r.PageNumber)),
                                                PageSize: Value(Text(r.PageSize))
                                            }
                                        )
                                    )
                                )
                            )
                        ),

                        Set(varTasks_Error, FirstError.Message);
                        Notify("Error loading tasks: " & varTasks_Error, NotificationType.Error);
                        Clear(colTasks)
                    );

                    Set(varTasks_TotalPages, Coalesce(First(colTasks).TotalPages, 0));
                    Set(varTasks_TotalRows, Coalesce(First(colTasks).TotalRows, 0));

                    Set(varTasks_IsLoading, false);
                    Set(varLoadingMsg, "");


                    Set(varGlobalLoading, false);
                    Set(varGlobalLoadingMsg, "");
                    Set(varGlobalLoadingScope, "");


                    Set(varTasksLoaded, true);
                  Visible: =false
                  X: =40
                  Y: =40
