                      Clear(colPHR_Metrics);
                      Clear(colPHR_Headers);
                      Clear(colPHR_HeaderL4);
                      Clear(colPHR_HeaderL4Indexed);
                      Clear(colPHR_HeaderL3Base);
                      Clear(colPHR_HeaderL2Base);
                      Clear(colPHR_HeaderL1Base);
                      Clear(colPHR_TabsL1);
                      Clear(colPHR_RowCells);
                      Clear(colPHR_HeaderL4_Active);
                      Clear(colPHR_HeaderL3_Active);
                      Clear(colPHR_HeaderL2_Active);
                      Clear(colPHR_HeaderL1_Active);
                      Clear(colPHR_RowCells_Active);

                      Clear(colNodes);
                      Clear(colAssign);
                      Clear(colScope);
                      Clear(colReportDictionary);
                      Clear(colReportMapDebug);
                      Clear(colAssignedForTarget);
                      Clear(colAssignedForTargetSummary);

                      // Reset PHR variables
                      Set(varPHR_Page, 1);
                      Set(varPHR_PageSize, 50);
                      Set(varPHR_TotalCount, 0);

                      Set(varPHR_ColW, 66);
                      Set(varPHR_StatusW, 56);
                      Set(varPHR_SubsysW, 170);
                      Set(varPHR_ActionsW, 92);
                      Set(varPHR_LeftFixedW, varPHR_StatusW + varPHR_SubsysW + varPHR_ActionsW);

                      Set(varPHR_HeaderH1, 28);
                      Set(varPHR_HeaderH2, 28);
                      Set(varPHR_HeaderH3, 28);
                      Set(varPHR_HeaderH4, 32);
                      Set(varPHR_RowH, 52);

                      Set(varPHR_DataColsWidth_Active, 0);
                      Set(varPHR_TotalGridWidth_Active, 0);

                      // Reset drawers/modals
                      Set(varBriefingEmailVisible, false);
                      Set(varShowDetailDrawer, false);
                      Set(varOps_DrawerOpen, false);
                      Set(varScopeModalOpen, false);
                      Set(varNodeModalOpen, false);

                      Set(varOps_SelectedCellId, 0);
                      Set(
                          varOps_SelectedCell,
                          {
                              OperationalCellId: 0,
                              ProjectId: 0,
                              SubsystemCode: "",
                              L1NodeId: "",
                              L2NodeId: "",
                              L3NodeId: "",
                              L1DisplayName: "",
                              L2DisplayName: "",
                              L3DisplayName: "",
                              TotalTasks: 0,
                              DoneTasks: 0,
                              RemainingTasks: 0,
                              ProgressPercent: 0,
                              OwnerEmail: "",
                              DueDate: Blank(),
                              OperationalStatus: "",
                              StatusComment: "",
                              LastReviewedOn: Blank(),
                              LastReviewedBy: "",
                              IsOverdue: false,
                              AgingDays: 0,
                              RefreshedOn: Blank()
                          }
                      );

                      // Start load
                      Set(varProjectSwitching, true);
                      Set(varHomeLoading, true);

                      Select(btnHome_LoadHive);

                      // Defensive re-assertion: Home data failure must not delete project context
                      Set(varProjectLoaded, true);
                      Set(varProjectId, Value(varSelectedProject.ProjectId));
                      Set(varProjectCode, Text(varSelectedProject.ProjectCode));
                      Set(varProjectName, Text(varSelectedProject.ProjectName));
                      Set(varProjectDescription, Text(varSelectedProject.ProjectDescription))
                  )
              )
            Visible: =false
            X: =120
            Y: =120
      - conGlobalOverlay_Home:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(15, 23, 42, 0.32)
            Height: =App.Height
            Visible: =varGlobalLoading
            Width: =App.Width
          Children:
            - conGlobalLoadingCard:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ColorValue("#E2E8F0")
                  BorderThickness: =1
                  DropShadow: =DropShadow.Semilight
                  Fill: =ColorValue("#FFFFFF")
                  Height: =136
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Width: =340
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - Spinner3:
                      Control: Spinner@1.4.6
                      Properties:
                        Height: =32
                        SpinnerColor: =varTheme_PulseBlue
                        Width: =32
                        X: =24
                        Y: =86
                  - Text31:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =varTheme_TextMuted
                        Size: =11
                        Text: |-
                          =
                          Coalesce(varGlobalLoadingSubMsg, "")
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =52
                  - Text36:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =varTheme_Text
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =14
                        Text: |-
                          =
                          Coalesce(varGlobalLoadingMsg, "Loading...")
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =24
                  - Rectangle2:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        DisabledFill: =RGBA(161, 159, 157, 1)
                        Fill: =ColorValue("#E2E8F0")
                        FocusedBorderThickness: =4
                        Height: =4
                        HoverFill: =RGBA(0, 120, 212, 1)
                        PressedFill: =RGBA(0, 120, 212, 1)
                        Width: =Parent.Width - 88
                        X: =94
                        Y: =98
                  - Rectangle6:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        DisabledFill: =RGBA(161, 159, 157, 1)
                        Fill: =varTheme_PulseBlue
                        FocusedBorderThickness: =4
                        Height: =4
                        HoverFill: =RGBA(0, 120, 212, 1)
                        PressedFill: =RGBA(0, 120, 212, 1)
                        Width: =90
                        X: =64
                        Y: =98
      - tmrGlobalLoader:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =varGlobalLoadPending
            BorderColor: =RGBA(0, 120, 212, 1)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(242, 242, 241, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Duration: =80
            Fill: =RGBA(0, 120, 212, 1)
            Font: =Font.'Segoe UI'
            HoverBorderColor: =RGBA(16, 110, 190, 1)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(16, 110, 190, 1)
            OnTimerEnd: |-
              =

              Set(varGlobalLoadPending, false);

              Switch(
                  varGlobalLoadAction,

                  "PROJECT_CHANGE",
                      Select(btnHome_ProjectChange_Commit),

                  "LOAD_HOME",
                      Select(btnHome_LoadHive),

                  Notify(
                      "Home cannot execute action: " & Coalesce(varGlobalLoadAction, "-"),
                      NotificationType.Warning
                  );

                  Set(varGlobalLoading, false);
                  Set(varGlobalLoadingMsg, "");
                  Set(varGlobalLoadingSubMsg, "");
                  Set(varGlobalLoadingScope, "");
                  Set(varGlobalLoadAction, "");
                  Set(varGlobalLoadPending, false);
                  Set(varHomeLoading, false);
                  Set(varProjectSwitching, false)
              )
            PressedBorderColor: =RGBA(16, 110, 190, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(16, 110, 190, 1)
            Visible: =false
            X: =100
            Y: =100
