      - btnHome_LoadPendingSubsystems:
          Control: ModernButton@1.0.0
          Properties:
            OnSelect: |-
              =

              If(
                  IsBlank(varProjectId) || IsBlank(varSelectedHiveNode.Discipline),

                  Clear(colHomePendingSubsystems);
                  Set(varPendingSubsystemsLoading, false);
                  Set(varHomePendingError, "");
                  Exit()
              );

              Set(varPendingSubsystemsLoading, true);
              Set(varHomePendingError, "");

              Clear(colHomePendingSubsystems);

              IfError(
                  Set(
                      varHomePendingResponse,
                      Warroom_GetPendingSubsystemsByDiscipline.Run(
                          varProjectId,
                          varSelectedHiveNode.Discipline
                      )
                  ),
                  Set(varHomePendingError, FirstError.Message)
              );

              If(
                  IsBlank(varHomePendingError),

                  ClearCollect(
                      colHomePendingSubsystems,
                      ForAll(
                          Table(ParseJSON(Coalesce(varHomePendingResponse.result, "[]"))),
                          With(
                              { r: ThisRecord.Value },
                              {
                                  RowNo: If(IsBlank(Text(r.RowNo)) || Text(r.RowNo) = "null", 0, Value(Text(r.RowNo))),
                                  SubsystemCode: Text(r.SubsystemCode),
                                  Discipline: Text(r.Discipline),
                                  Total: If(IsBlank(Text(r.Total)) || Text(r.Total) = "null", 0, Value(Text(r.Total))),
                                  Done: If(IsBlank(Text(r.Done)) || Text(r.Done) = "null", 0, Value(Text(r.Done))),
                                  Remaining: If(IsBlank(Text(r.Remaining)) || Text(r.Remaining) = "null", 0, Value(Text(r.Remaining))),
                                  Progress: If(IsBlank(Text(r.Progress)) || Text(r.Progress) = "null", 0, Value(Text(r.Progress))),
                                  ProgressStatus: Text(r.ProgressStatus),
                                  ProgressColor:
                                      Switch(
                                          Text(r.ProgressStatus),
                                          "Excellent", "#22C55E",
                                          "Good", "#F59E0B",
                                          "In Progress", "#00C8FF",
                                          "Delayed", "#EF4444",
                                          "#64748B"
                                      )
                              }
                          )
                      )
                  ),

                  Notify(
                      "Pending subsystems could not be loaded.",
                      NotificationType.Warning
                  )
              );

              Set(varPendingSubsystemsLoading, false)
            Visible: =false
            X: =80
            Y: =80
      - btnHome_LoadHive:
          Control: ModernButton@1.0.0
          Properties:
            OnSelect: |-
              =
              Set(varGlobalLoading, true);
              Set(varGlobalLoadingMsg, "Loading Home...");
              Set(varGlobalLoadingSubMsg, "Loading project dashboard");
              Set(varGlobalLoadingScope, "HOME");

              If(
                  IsBlank(varProjectId),

                  Notify("Please select a project first.", NotificationType.Warning);
                  Set(varHomeLoading, false);
                  Set(varProjectSwitching, false);
                  Set(varGlobalLoading, false);
                  Set(varGlobalLoadingMsg, "");
                  Set(varGlobalLoadingSubMsg, "");
                  Set(varGlobalLoadingScope, "");
                  Set(varGlobalLoadAction, "");
                  Set(varGlobalLoadPending, false);
                  Exit()
              );

              Set(varHomeLoading, true);
              Set(varHomeError, "");
              Set(varHomeNoData, false);
              Set(varProjectHasHomeData, false);
              Set(varHomeHiveLoaded, false);

              Clear(colHomeHiveNodes);
              Clear(colHomeHiveNodesSorted);
              Clear(colHomeLowestProgress);
              Clear(colHomePendingSubsystems);

              IfError(
                  Set(
                      varHomeHiveResponse,
                      Warroom_GetHiveNodesByDiscipline.Run(varProjectId)
                  ),
                  Set(varHomeError, FirstError.Message)
              );

              If(
                  !IsBlank(varHomeError),

                  Set(varHomeNoData, true);
                  Set(varHomeShowOverview, false);
                  Set(varHomeShowCards, false);
                  Set(varHomeShowRightPanel, true);

                  Notify(
                      "Home dashboard could not be loaded for this project.",
                      NotificationType.Warning
                  ),

                  ClearCollect(
                      colHomeHiveNodes,
                      ForAll(
                          Table(ParseJSON(Coalesce(varHomeHiveResponse.result, "[]"))),
                          With(
                              { r: ThisRecord.Value },
                              {
                                  NodeId: Text(r.NodeId),
                                  NodeNo: Text(r.NodeNo),
                                  NodeTitle: Text(r.NodeTitle),
                                  NodeSubtitle: Text(r.NodeSubtitle),
                                  Discipline: Text(r.Discipline),
                                  SubsystemCode: Text(r.Discipline),

                                  Total: If(IsBlank(Text(r.Total)) || Text(r.Total) = "null", 0, Value(Text(r.Total))),
                                  Done: If(IsBlank(Text(r.Done)) || Text(r.Done) = "null", 0, Value(Text(r.Done))),
                                  Remaining: If(IsBlank(Text(r.Remaining)) || Text(r.Remaining) = "null", 0, Value(Text(r.Remaining))),
                                  Progress: If(IsBlank(Text(r.Progress)) || Text(r.Progress) = "null", 0, Value(Text(r.Progress))),
                                  ProgressStatus: Text(r.ProgressStatus),
                                  SortOrder: If(IsBlank(Text(r.SortOrder)) || Text(r.SortOrder) = "null", 0, Value(Text(r.SortOrder))),

                                  ProgressColor:
                                      Switch(
                                          Text(r.ProgressStatus),
                                          "Excellent", "#22C55E",
                                          "Good", "#F59E0B",
                                          "In Progress", "#00C8FF",
                                          "Delayed", "#EF4444",
                                          "#64748B"
                                      )
                              }
                          )
                      )
                  );

                  If(
                      CountRows(colHomeHiveNodes) = 0,

                      Set(varHomeNoData, true);
                      Set(varProjectHasHomeData, false);
                      Set(varHomeHiveLoaded, false);

                      Set(varHomeShowOverview, false);
                      Set(varHomeShowCards, false);
                      Set(varHomeShowRightPanel, true);

                      Set(
                          varAppWarning,
                          "This project has no dashboard data configured yet."
                      ),

                      ClearCollect(
                          colHomeHiveNodesSorted,
                          SortByColumns(
                              colHomeHiveNodes,
                              "SortOrder",
                              SortOrder.Ascending
                          )
                      );

                      ClearCollect(
                          colHomeLowestProgress,
                          FirstN(
                              SortByColumns(
                                  colHomeHiveNodes,
                                  "Progress",
                                  SortOrder.Ascending,
                                  "Remaining",
                                  SortOrder.Descending
                              ),
                              3
                          )
                      );

                      Set(varHomeNoData, false);
                      Set(varProjectHasHomeData, true);
                      Set(varHomeHiveLoaded, true);

                      Set(varHomeShowOverview, true);
                      Set(varHomeShowCards, true);
                      Set(varHomeShowRightPanel, true);

                      Set(varHomeLastRefresh, Now())
                  )
              );

              Set(varHomeLoading, false);
              Set(varProjectSwitching, false);
              Set(varPHR_IsLoading, false);

              Set(varGlobalLoading, false);
              Set(varGlobalLoadingMsg, "");
              Set(varGlobalLoadingSubMsg, "");
              Set(varGlobalLoadingScope, "");
              Set(varGlobalLoadAction, "");
              Set(varGlobalLoadPending, false);
              Set(varLoadingMsg, "")
            Visible: =false
            X: =60
            Y: =60
      - btnHome_ProjectChange_Commit:
          Control: ModernButton@1.0.0
          Properties:
            OnSelect: |-
              =
              If(
                  IsBlank(varPendingProjectId),

                  Notify("No pending project selected.", NotificationType.Warning);
                  Set(varProjectSwitching, false);
                  Set(varPHR_IsLoading, false);
