Screens:
  scr_Home:
    Properties:
      Fill: =varTheme_PageBg
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |+
        =
        // =====================================================
        // scr_App.OnVisible
        // Runtime state only. DO NOT reset selected project here.
        // =====================================================

        // Theme / visual tokens
        Set(varHiveColorExcellent, "#22C55E");
        Set(varHiveColorGood, "#F59E0B");
        Set(varHiveColorInProgress, "#00C8FF");
        Set(varHiveColorDelayed, "#EF4444");
        Set(varHiveColorNeutral, "#64748B");

        Set(varHiveColorSelected, "#00C8FF");
        Set(varHiveColorCardBg, "#FFFFFF");
        Set(varHiveColorPageBg, "#F6F8FB");
        Set(varHiveColorBorder, "#E2E8F0");
        Set(varHiveColorText, "#0F172A");
        Set(varHiveColorMuted, "#64748B");

        Set(varTheme_NavBg, ColorValue("#07111F"));
        Set(varTheme_NavBg2, ColorValue("#0B1220"));
        Set(varTheme_TopBg, ColorValue("#FFFFFF"));
        Set(varTheme_PageBg, ColorValue("#F6F8FB"));
        Set(varTheme_Surface, ColorValue("#FFFFFF"));
        Set(varTheme_SurfaceAlt, ColorValue("#F8FAFC"));
        Set(varTheme_Border, ColorValue("#E2E8F0"));
        Set(varTheme_Text, ColorValue("#0F172A"));
        Set(varTheme_TextMuted, ColorValue("#64748B"));
        Set(varTheme_TextSoft, ColorValue("#94A3B8"));
        Set(varTheme_TextWhite, ColorValue("#FFFFFF"));
        Set(varTheme_PulseBlue, ColorValue("#00C8FF"));
        Set(varTheme_PulseBlueDark, ColorValue("#1677FF"));
        Set(varTheme_PulseSoft, ColorValue("#E0F7FF"));
        Set(varTheme_Green, ColorValue("#22C55E"));
        Set(varTheme_Amber, ColorValue("#F59E0B"));
        Set(varTheme_Red, ColorValue("#EF4444"));
        Set(varTheme_CardRadius, 16);
        Set(varTheme_ButtonRadius, 10);

        // Responsive
        Set(varIsMobile, App.Width < 900);
        Set(varIsTablet, App.Width >= 900 && App.Width < 1400);
        Set(varIsDesktop, App.Width >= 1400);

        // User
        Set(varCurrentUserEmail, Lower(User().Email));
        Set(varCurrentUserName, User().FullName);

        // Navigation defaults only
        If(IsBlank(varAppView), Set(varAppView, "Home"));
        If(IsBlank(varHomeViewMode), Set(varHomeViewMode, "DASHBOARD"));
        If(IsBlank(varOps_ViewMode), Set(varOps_ViewMode, "OVERVIEW"));
        If(IsBlank(varOps_QuickFilter), Set(varOps_QuickFilter, "ALL"));

        // Project context: preserve if already selected
        If(
            IsBlank(varProjectId),
            Set(varProjectLoaded, false),
            Set(varProjectLoaded, true)
        );

        // Loading states
        Set(varGlobalLoading, false);
        Set(varGlobalLoadingMsg, "");
        Set(varGlobalLoadingSubMsg, "");
        Set(varGlobalLoadingScope, "");
        Set(varGlobalLoadAction, "");
        Set(varGlobalLoadPending, false);

        Set(varLoading, false);
        Set(varLoadingMsg, "");
        Set(varProjectSwitching, false);
        Set(varHomeLoading, false);
        Set(varOps_IsLoading, false);
        Set(varPHR_IsLoading, false);
        Set(varDash_IsLoading, false);
        Set(varExecDashboardLoading, false);

        // Error states
        Set(varAppError, "");
        Set(varAppWarning, "");
        Set(varHomeError, "");
        Set(varOps_Error, "");
        Set(varCfg_Error, "");
        Set(varHomePendingError, "");

        // UI defaults
        If(IsBlank(varHiveCardWidth), Set(varHiveCardWidth, 330));
        If(IsBlank(varHiveCardHeight), Set(varHiveCardHeight, 215));
        If(IsBlank(varHiveRightPanelWidth), Set(varHiveRightPanelWidth, 326));

        If(IsBlank(varHomeShowOverview), Set(varHomeShowOverview, false));
        If(IsBlank(varHomeShowCards), Set(varHomeShowCards, false));
        If(IsBlank(varHomeShowRightPanel), Set(varHomeShowRightPanel, false));

        If(IsBlank(varHomeNoData), Set(varHomeNoData, false));
        If(IsBlank(varOverviewNoConfig), Set(varOverviewNoConfig, false));
        If(IsBlank(varOverviewNoData), Set(varOverviewNoData, false));

        // Selected objects typed defaults
        Set(varOps_SelectedCellId, 0);
        Set(
            varOps_SelectedCell,
            {
                OperationalCellId: 0,
                ProjectId: 0,
                SubsystemCode: "",
                L1NodeId: "",
                L2NodeId: "",
                L3NodeId: "",
                L1DisplayName: "",
                L2DisplayName: "",
                L3DisplayName: "",
                TotalTasks: 0,
                DoneTasks: 0,
                RemainingTasks: 0,
                ProgressPercent: 0,
                OwnerEmail: "",
                DueDate: Blank(),
                OperationalStatus: "",
                StatusComment: "",
                LastReviewedOn: Blank(),
                LastReviewedBy: "",
                IsOverdue: false,
                AgingDays: 0,
                RefreshedOn: Blank()
            }
        );

        If(
            IsBlank(varSelectedHiveNode) || IsBlank(varSelectedHiveNode.NodeId),
            Set(
                varSelectedHiveNode,
                {
                    NodeId: "",
                    NodeNo: "",
                    NodeTitle: "",
                    NodeSubtitle: "",
                    Discipline: "",
                    SubsystemCode: "",
                    Total: 0,
                    Done: 0,
                    Remaining: 0,
                    Progress: 0,
                    ProgressStatus: "",
                    ProgressColor: "",
                    SortOrder: 0
                }
            )
        );

        If(
            IsBlank(varSelectedHiveSubsystem) || IsBlank(varSelectedHiveSubsystem.SubsystemCode),
            Set(
                varSelectedHiveSubsystem,
                {
                    SubsystemCode: "",
                    Discipline: "",
                    Total: 0,
                    Done: 0,
                    Remaining: 0,
                    Progress: 0,
                    ProgressStatus: "",
                    ProgressColor: ""
                }
            )
        );

        // PHR defaults
        If(IsBlank(varPHR_Page), Set(varPHR_Page, 1));
        If(IsBlank(varPHR_PageSize), Set(varPHR_PageSize, 50));
        If(IsBlank(varPHR_TotalCount), Set(varPHR_TotalCount, 0));

        Set(varPHR_ColW, Coalesce(varPHR_ColW, 66));
        Set(varPHR_StatusW, Coalesce(varPHR_StatusW, 56));
        Set(varPHR_SubsysW, Coalesce(varPHR_SubsysW, 170));
        Set(varPHR_ActionsW, Coalesce(varPHR_ActionsW, 92));
        Set(varPHR_LeftFixedW, varPHR_StatusW + varPHR_SubsysW + varPHR_ActionsW);

        Set(varPHR_HeaderH1, Coalesce(varPHR_HeaderH1, 28));
        Set(varPHR_HeaderH2, Coalesce(varPHR_HeaderH2, 28));
        Set(varPHR_HeaderH3, Coalesce(varPHR_HeaderH3, 28));
        Set(varPHR_HeaderH4, Coalesce(varPHR_HeaderH4, 32));
        Set(varPHR_RowH, Coalesce(varPHR_RowH, 52));

        // No automatic refresh
        Set(varOps_AutoLoadAllowed, false);
        Set(varShowFilters, false);
        Set(varShowMenu, false);
        Set(varCacheEnabled, true);
        Set(varUseCompactMode, false);

        Set(varBriefingEmailVisible, false);

        // Skyline defaults
        If(IsBlank(varSkylineLoaded), Set(varSkylineLoaded, false));
        If(IsBlank(varSkylineLoading), Set(varSkylineLoading, false));
        If(IsBlank(varSkylineError), Set(varSkylineError, ""));
        If(IsBlank(varSkylineFromDate), Set(varSkylineFromDate, DateAdd(Today(), -7, TimeUnit.Days)));
        If(IsBlank(varSkylinePunchWeight), Set(varSkylinePunchWeight, 3));
        If(IsBlank(varSelectedSkylineMode), Set(varSelectedSkylineMode, "DENSITY"));






















    Children:
      - conHomeScreenRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =App.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =App.Width
          Children:
            - cmp_NavApp:
                Control: CanvasComponent
                ComponentName: cmp_SidebarNav
                Properties:
                  ActiveKey: =varAppView
                  Fill: =varTheme_PulseBlue
                  Height: =Parent.Height
                  IsCollapsed: =true
                  Items: =colSidebarNavItems
                  NavItems: =colSidebarNavItems
                  OnSelectItem: |-
                    =

                    With(
                        {
                            _key: Lower(Trim(Self.SelectedItemKey)),
                            _hasProject: !IsBlank(varProjectId)
                        },
                        If(
                            _key <> "home" && !_hasProject,

                            Notify("Please select a project first.", NotificationType.Warning);
                            Set(varAppView, "Home");
                            Navigate(scr_Home, ScreenTransition.None),

                            Switch(
                                _key,

                                "home",
                                    Set(varAppView, "Home");
                                    Set(varHomeViewMode, "DASHBOARD");
                                    Navigate(scr_Home, ScreenTransition.None),

                                "overview",
                                    Set(varAppView, "Overview");
                                    Set(varOps_ViewMode, "OVERVIEW");
                                    Navigate(scr_Overview, ScreenTransition.None),

                                "tasks",
                                    Set(varAppView, "Tasks");
                                    Navigate(scr_Tasks, ScreenTransition.None),

                                "punches",
                                    Set(varAppView, "Punches");
                                    Navigate(scr_Punches, ScreenTransition.None),

                                "briefing",
                                    Set(varAppView, "Briefing");
                                    Navigate(scr_Briefing, ScreenTransition.None),

                                "config",
                                    Set(varAppView, "Config");
                                    Navigate(scr_Config, ScreenTransition.None),

                                "superadmin",
                                    Set(varAppView, "SuperAdmin");
                                    Navigate(scr_SuperAdmin, ScreenTransition.None),

                                Notify("Key not mapped: [" & _key & "]", NotificationType.Error)
                            )
                        )
                    )
                  OnToggleCollapse: =
                  UserRole: ="Text"
                  Width: =154
            - conHomeContent:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =varTheme_PageBg
                  Height: =App.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width - cmp_NavApp.Width
                Children:
                  - con_Home:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(15, 23, 42, 1)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =varView_Home
                      Children:
                        - conView_Home_Header:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =varTheme_PageBg
                              FillPortions: =0
                              Height: =56
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =8
                              PaddingLeft: =20
                              PaddingRight: =24
                              PaddingTop: =8
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              X: =40
                              Y: =40
                            Children:
                              - lblHomeTitle:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =varTheme_Text
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Parent.Height
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =0
                                    PaddingLeft: =10
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Size: =22
                                    Text: ="Home"
                                    Width: =90
                                    X: =40
                                    Y: =40
                        - conExecutiveHeader:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =varTheme_SurfaceAlt
                              FillPortions: =0
                              Height: =90
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =20
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =8
                              PaddingLeft: =20
                              PaddingRight: =24
                              PaddingTop: =8
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                            Children:
                              - conProjectSelectorCard:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderColor: =varTheme_Border
                                    BorderThickness: =1
                                    Fill: =varTheme_Surface
                                    FillPortions: =0
                                    Height: =68
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    RadiusBottomLeft: =10
                                    RadiusBottomRight: =10
                                    RadiusTopLeft: =10
                                    RadiusTopRight: =10
                                    Width: =400
                                  Children:
                                    - cmbHome_ProjectSelector:
                                        Control: ModernCombobox@1.1.0
                                        Properties:
                                          BorderThickness: =0
                                          Color: =varTheme_Text
                                          DefaultSelectedItems: |-
                                            =

                                            If(
                                                IsBlank(varProjectId),
                                                [],
                                                Filter(
                                                    colEnabledProjectsUI,
                                                    Value(ProjectId) = Value(varProjectId)
                                                )
                                            )
                                          Fill: =Color.Transparent
                                          FontWeight: =FontWeight.Bold
                                          InputTextPlaceholder: ="Select Project"
                                          IsSearchable: =false
                                          ItemDisplayText: =ThisItem.ProjectDisplayName
                                          Items: =colEnabledProjectsUI
                                          OnChange: |-
                                            =


                                            If(
                                                !IsBlank(Self.Selected.ProjectId),

                                                Set(varGlobalLoading, true);
                                                Set(varGlobalLoadingMsg, "Changing project...");
                                                Set(varGlobalLoadingSubMsg, "Preparing project dashboard");
                                                Set(varGlobalLoadingScope, "HOME");

                                                Set(varProjectSwitching, true);
                                                Set(varHomeLoading, true);

                                                Set(varPendingProjectId, Value(Self.Selected.ProjectId));

                                                Select(btnHome_ProjectChange_Commit)
                                            )
                                          RadiusBottomLeft: =4
                                          RadiusBottomRight: =4
                                          RadiusTopLeft: =4
                                          RadiusTopRight: =4
                                          SelectMultiple: =false
                                          Width: = Parent.Width - 64
                                          X: =47
                                          Y: =25
                                    - Icon16:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          Color: =ColorValue("#0B5ED7")
                                          DisabledBorderColor: =RGBA(245, 245, 245, 1)
                                          DisabledColor: =RGBA(225, 223, 221, 1)
                                          DisabledFill: =RGBA(0, 0, 0, 0)
                                          FocusedBorderThickness: =4
                                          Height: =24
                                          HoverBorderColor: =RGBA(0, 0, 0, 0)
                                          HoverColor: =RGBA(16, 110, 190, 1)
                                          HoverFill: =RGBA(0, 0, 0, 0)
                                          Icon: =Icon.Folder
                                          PressedBorderColor: =RGBA(0, 0, 0, 0)
                                          PressedColor: =RGBA(16, 110, 190, 1)
                                          PressedFill: =RGBA(0, 0, 0, 0)
                                          Width: =24
                                          X: =18
                                          Y: =25
                                    - Text38:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =varTheme_TextMuted
                                          Height: =24
                                          Size: =10
                                          Text: ="Project"
                                          Width: =220
                                          X: =56
                                          Y: =8
                              - conHomeRefreshArea:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    Width: =340
                                  Children:
                                    - lblExecLastRefresh:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Right
                                          Color: =ColorValue("#64748B")
                                          FontWeight: =FontWeight.Semibold
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          Size: =11
                                          Text: |-
                                            ="Last refresh: " &
                                            If(
                                                IsBlank(varHomeLastRefresh),
                                                "--",
                                                Text(varHomeLastRefresh, "dd/mm/yyyy hh:mm")
                                            )
                                          Width: =210
                                          X: =40
                                          Y: =40
                                    - btnHomeRefreshData:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Appearance: ='ButtonCanvas.Appearance'.Secondary
                                          BasePaletteColor: =ColorValue("#0B5ED7")
                                          DisplayMode: |-
                                            =

                                            If(
                                                IsBlank(varProjectId) || varGlobalLoading || varHomeLoading || varProjectSwitching,
                                                DisplayMode.Disabled,
                                                DisplayMode.Edit
                                            )
                                          Height: =36
                                          Icon: ="ArrowClockwise"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: "=\r\n\r\nIf(\r\n    IsBlank(varProjectId),\r\n\r\n    Notify(\"Please select a project first.\", NotificationType.Warning),\r\n\r\n    Set(varGlobalLoading, true);\r\n    Set(varGlobalLoadingMsg, \"Refreshing dashboard...\");\r\n    Set(varGlobalLoadingSubMsg, \"Updating operational data\");\r\n    \r\n    Set(varGlobalLoadingScope, \"HOME\");\r\n\r\n    Set(varHomeLoading, true);\r\n    Set(varProjectSwitching, false);\r\n\r\n    Set(varGlobalLoadAction, \"LOAD_HOME\");\r\n    Set(varGlobalLoadPending, true)\r\n)"
                                          RadiusBottomLeft: =10
                                          RadiusBottomRight: =10
                                          RadiusTopLeft: =10
                                          RadiusTopRight: =10
                                          Text: |-
                                            =If(
                                                varHomeLoading || varProjectSwitching,
                                                "Loading...",
                                                "Refresh"
                                            )
                                          Visible: =!varGlobalLoading
                                          Width: =110
                        - conHomeShell:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =varTheme_PageBg
                              Height: =Parent.Height
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =8
                              PaddingLeft: =10
                              PaddingRight: =8
                              PaddingTop: =8
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - conHomeMain:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =varTheme_PageBg
                                    FillPortions: =0
                                    Height: =Parent.Height - Parent.PaddingTop - Parent.PaddingBottom
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Width: =Parent.Width - 380
                                  Children:
                                    - cntHome_HiveGridArea:
                                        Control: GroupContainer@1.5.0
                                        Variant: ManualLayout
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          DropShadow: =DropShadow.None
                                          Height: =Parent.Height
                                          Width: =Parent.Width
                                        Children:
                                          - galHomeHiveNodes:
                                              Control: Gallery@2.15.0
                                              Variant: Vertical
                                              Properties:
                                                BorderColor: =RGBA(245, 245, 245, 1)
                                                Height: =Parent.Height - Self.Y - 16
                                                Items: |+
                                                  =

                                                      colHomeHiveNodesSorted

                                                NavigationStep: =2
                                                ShowNavigation: =true
                                                ShowScrollbar: =false
                                                TemplatePadding: =6
                                                TemplateSize: =200
                                                Transition: =Transition.Pop
                                                Visible: |-
                                                  =varHomeShowCards &&
                                                  !varHomeLoading &&
                                                  CountRows(colHomeHiveNodesSorted) > 0
                                                Width: =Parent.Width
                                                WrapCount: |-
                                                  =
                                                  If(
                                                      Parent.Width >= 1180,
                                                      4,
                                                      Parent.Width >= 900,
                                                      3,
                                                      Parent.Width >= 620,
                                                      2,
                                                      1
                                                  )
                                                Y: =conHome_DisciplinesOverview.Y + conHome_DisciplinesOverview.Height + 18
                                              Children:
                                                - conNodeCard:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: ManualLayout
                                                    Properties:
                                                      BorderColor: |-
                                                        =If(
                                                            varSelectedHiveNode.NodeId = ThisItem.NodeId,
                                                            varTheme_PulseBlue,
                                                            varTheme_Border
                                                        )
                                                      BorderThickness: |-
                                                        =If(
                                                            varSelectedHiveNode.NodeId = ThisItem.NodeId,
                                                            2,
                                                            1
                                                        )
                                                      DropShadow: =DropShadow.Semilight
                                                      Fill: =varTheme_Surface
                                                      Height: =184
                                                      RadiusBottomLeft: =16
                                                      RadiusBottomRight: =16
                                                      RadiusTopLeft: =16
                                                      RadiusTopRight: =16
                                                      Width: =Min(300, Parent.TemplateWidth - 12)
                                                      X: =(Parent.TemplateWidth - Self.Width) / 2
                                                      Y: =6
                                                    Children:
                                                      - Text10:
                                                          Control: ModernText@1.0.0
                                                          Properties:
                                                            Align: =Align.Center
                                                            Color: =ColorValue("#EF4444")
                                                            Fill: =ColorValue("#FEECEC")
                                                            FontWeight: =FontWeight.Bold
                                                            RadiusBottomLeft: =8
                                                            RadiusBottomRight: =8
                                                            RadiusTopLeft: =8
                                                            RadiusTopRight: =8
                                                            Size: =11
                                                            Text: =ThisItem.NodeNo
                                                            Width: =44
                                                            X: =16
                                                            Y: =15
                                                      - Text21:
                                                          Control: ModernText@1.0.0
                                                          Properties:
                                                            AutoHeight: =true
                                                            Color: =varTheme_Text
                                                            FontWeight: =FontWeight.Semibold
                                                            Height: =24
                                                            Size: =20
                                                            Text: =Proper(ThisItem.NodeTitle)
                                                            Width: =Parent.Width - 82
                                                            X: =64
                                                            Y: =10
                                                      - Text19:
                                                          Control: ModernText@1.0.0
                                                          Properties:
                                                            Align: =Align.Center
                                                            Color: |-
                                                              =

                                                              Switch(
                                                                  ThisItem.ProgressStatus,
                                                                  "Delayed", varTheme_Red,
                                                                  "At Risk", varTheme_Amber,
                                                                  "In Progress", varTheme_PulseBlueDark,
                                                                  "Completed", varTheme_Green,
                                                                  varTheme_TextMuted
                                                              )
                                                            Fill: |-
                                                              =

                                                              Switch(
                                                                  ThisItem.ProgressStatus,
                                                                  "Delayed", ColorFade(varTheme_Red, 85%),
                                                                  "At Risk", ColorFade(varTheme_Amber, 85%),
                                                                  "In Progress", ColorFade(varTheme_PulseBlue, 85%),
                                                                  "Completed", ColorFade(varTheme_Green, 85%),
                                                                  varTheme_SurfaceAlt
                                                              )
                                                            FontWeight: =FontWeight.Bold
                                                            Height: =26
                                                            RadiusBottomLeft: =8
                                                            RadiusBottomRight: =8
                                                            RadiusTopLeft: =8
                                                            RadiusTopRight: =8
                                                            Size: =10
                                                            Text: =ThisItem.ProgressStatus
                                                            Width: =88
                                                            X: =Parent.Width - 112
                                                            Y: =66
                                                      - Text20:
                                                          Control: ModernText@1.0.0
                                                          Properties:
                                                            Align: =Align.Center
                                                            AutoHeight: =true
                                                            Color: =varTheme_Text
                                                            Fill: =RGBA(0,0,0,0)
                                                            Height: =18
                                                            OnSelect: =
                                                            RadiusBottomLeft: =12
                                                            RadiusBottomRight: =12
                                                            RadiusTopLeft: =12
                                                            RadiusTopRight: =12
