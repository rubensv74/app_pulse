            - btnCT_SaveFieldDef:
                Control: Button@0.0.45
                Properties:
                  OnSelect: "=\r\nIf(\r\n    IsBlank(Trim(varCT_Edit_Label)),\r\n    Set(varCT_SaveField_Error, \"Label is required.\");\r\n    Set(varCT_SaveField_IsLoading, false),\r\n\r\n    IsBlank(Trim(varCT_Edit_FieldKey)),\r\n    Set(varCT_SaveField_Error, \"Field key is required.\");\r\n    Set(varCT_SaveField_IsLoading, false),\r\n\r\n    !IsBlank(\r\n        LookUp(\r\n            colCT_Defs_Admin,\r\n            Lower(Trim(FieldKey)) = Lower(Trim(varCT_Edit_FieldKey)) &&\r\n            FieldDefId <> Coalesce(varCT_Edit_FieldDefId, 0)\r\n        )\r\n    ),\r\n\r\n    Set(varCT_SaveField_Error, \"This Field Key already exists.\");\r\n    Set(varCT_SaveField_IsLoading, false);\r\n    Notify(\"This Field Key already exists. Use another key or edit the existing field.\", NotificationType.Error),\r\n\r\n    Value(varCT_Edit_SortOrder) <= 0,\r\n    Set(varCT_SaveField_Error, \"Sort order must be greater than zero.\");\r\n    Set(varCT_SaveField_IsLoading, false),\r\n\r\n    (varCT_Edit_FieldType = \"Choice\" || varCT_Edit_FieldType = \"MultiChoice\") && IsBlank(Trim(varCT_Edit_OptionsJson)),\r\n    Set(varCT_SaveField_Error, \"OptionsJson is required for Choice and MultiChoice fields.\");\r\n    Set(varCT_SaveField_IsLoading, false),\r\n\r\n    With(\r\n        {\r\n            resp: WarRoom_UpsertCustomFieldDef.Run(\r\n                Coalesce(varCT_Edit_FieldDefId, 0),\r\n                comp_DetailDrawer.ProjectId,\r\n                comp_DetailDrawer.EntityType,\r\n                Trim(varCT_Edit_Label),\r\n                varCT_Edit_FieldType,\r\n                Trim(varCT_Edit_HelpText),\r\n                Value(varCT_Edit_SortOrder),\r\n                If(IsBlank(Trim(varCT_Edit_OptionsJson)), \" \", Trim(varCT_Edit_OptionsJson)),\r\n                comp_DetailDrawer.UserEmail,\r\n                Lower(Trim(varCT_Edit_FieldKey)),\r\n                varCT_Edit_IsRequired,\r\n                varCT_Edit_IsPinned,\r\n                varCT_Edit_IsActive\r\n            )\r\n        },\r\n        \r\n        Set(varShowCustomAddFields, false);\r\n        Set(varCT_SaveField_Error, \"\");\r\n        Set(varCT_SaveField_IsLoading, false);\r\n\r\n        Select(btnCT_LoadDefs);\r\n\r\n        Set(varCT_LoadKey, \"\");\r\n        Select(btnDrawerLoad_Custom);\r\n\r\n        Notify(\"Field definition saved successfully.\", NotificationType.Success)\r\n    )\r\n)"
                  Visible: =false
                  X: =160
                  Y: =160
      - btnSkyline_LoadData:
          Control: ModernButton@1.0.0
          Properties:
            OnSelect: |-
              =

              Set(varSkylineLoading, true);
              Set(varSkylineError, "");
              Set(varSkylineLoaded, false);

              Clear(colSkylineRaw);
              Clear(colSkylineWeeks);
              Clear(colSkylineSelectedWeek);

              If(
                  IsBlank(varProjectId),
                  Notify("Please select a project first.", NotificationType.Warning);
                  Set(varSkylineLoading, false);
                  Exit()
              );

              IfError(
                  With(
                      {
                          resp: Warroom_Pulse_GetSubsystemSkyline.Run(
                              varProjectId,
                              Text(varSkylineFromDate, "yyyy-mm-dd"),
                              Text(varSkylineToDate, "yyyy-mm-dd"),
                              varSkylinePunchWeight
                          )
                      },
                      With(
                          {
                              arr: Table(ParseJSON(Coalesce(resp.result, "[]")))
                          },
                          ClearCollect(
                              colSkylineRaw,
                              ForAll(
                                  arr,
                                  With(
                                      { r: ThisRecord.Value },
                                      {
                                          Id: Value(Text(r.Id)),
                                          ProjectId: Value(Text(r.ProjectId)),
                                          SubsystemCode: Text(r.SubsystemCode),

                                          PlannedDate: If(IsBlank(Text(r.PlannedDate)), Blank(), DateValue(Text(r.PlannedDate))),
                                          ForecastDate: If(IsBlank(Text(r.ForecastDate)), Blank(), DateValue(Text(r.ForecastDate))),
                                          ActualDate: If(IsBlank(Text(r.ActualDate)), Blank(), DateValue(Text(r.ActualDate))),
                                          SkylineDate: If(IsBlank(Text(r.SkylineDate)), Blank(), DateValue(Text(r.SkylineDate))),
                                          WeekEnding: If(IsBlank(Text(r.WeekEnding)), Blank(), DateValue(Text(r.WeekEnding))),

                                          OpenTasks: If(IsBlank(Text(r.OpenTasks)), 0, Value(Text(r.OpenTasks))),
                                          OpenPunches: If(IsBlank(Text(r.OpenPunches)), 0, Value(Text(r.OpenPunches))),
                                          WorkloadScore: If(IsBlank(Text(r.WorkloadScore)), 0, Value(Text(r.WorkloadScore))),
                                          DaysRemaining: If(IsBlank(Text(r.DaysRemaining)), Blank(), Value(Text(r.DaysRemaining))),

                                          RiskStatus: Text(r.RiskStatus),
                                          ReadinessScore: If(IsBlank(Text(r.ReadinessScore)), 0, Value(Text(r.ReadinessScore))),
                                          Notes: Text(r.Notes),
                                          PunchWeight: If(IsBlank(Text(r.PunchWeight)), varSkylinePunchWeight, Value(Text(r.PunchWeight)))
                                      }
                                  )
                              )
                          )
                      )
                  ),

                  Set(varSkylineError, FirstError.Message);
                  Notify("Error loading Skyline: " & varSkylineError, NotificationType.Error);
                  Clear(colSkylineRaw)
              );

              ClearCollect(
                  colSkylineWeeks,
                  SortByColumns(
                      AddColumns(
                          GroupBy(
                              Filter(colSkylineRaw, !IsBlank(WeekEnding)),
                              WeekEnding,
                              WeekItems
                          ),
                          SubsystemsCount,
                          CountRows(WeekItems),
                          OpenTasksTotal,
                          Sum(WeekItems, OpenTasks),
                          OpenPunchesTotal,
                          Sum(WeekItems, OpenPunches),
                          WorkloadTotal,
                          Sum(WeekItems, WorkloadScore),
                          CriticalCount,
                          CountRows(Filter(WeekItems, RiskStatus = "Critical")),
                          AtRiskCount,
                          CountRows(Filter(WeekItems, RiskStatus = "At Risk")),
                          OverdueCount,
                          CountRows(Filter(WeekItems, RiskStatus = "Overdue")),
                          OnTrackCount,
                          CountRows(Filter(WeekItems, RiskStatus = "On Track")),
                          AttentionCount,
                          CountRows(Filter(WeekItems, RiskStatus = "Attention"))
                      ),
                      "WeekEnding",
                      SortOrder.Ascending
                  )
              );

              If(
                  CountRows(colSkylineWeeks) > 0,
                  Set(varSelectedSkylineWeek, First(colSkylineWeeks).WeekEnding);
                  ClearCollect(
                      colSkylineSelectedWeek,
                      SortByColumns(
                          Filter(
                              colSkylineRaw,
                              WeekEnding = varSelectedSkylineWeek
                          ),
                          "RiskStatus",
                          SortOrder.Ascending,
                          "WorkloadScore",
                          SortOrder.Descending
                      )
                  )
              );

              Set(varSkylineLoaded, true);
              Set(varSkylineLoading, false);
            Visible: =false
            X: =160
            Y: =160
      - btnHome_OpenNodeOperations:
