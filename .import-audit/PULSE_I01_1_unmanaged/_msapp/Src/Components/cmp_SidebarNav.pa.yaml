ComponentDefinitions:
  cmp_SidebarNav:
    DefinitionType: CanvasComponent
    CustomProperties:
      ActiveKey:
        PropertyKind: Input
        DisplayName: ActiveKey
        Description: A custom property
        DataType: Text
        Default: =varAppView
      IsCollapsed:
        PropertyKind: Input
        DisplayName: IsCollapsed
        Description: A custom property
        DataType: Boolean
        Default: =true
      Items:
        PropertyKind: Input
        DisplayName: Items
        Description: A custom property
        DataType: Table
        Default: |-
          =

          Table(
              {
                  Order: 10,
                  Key: "Home",
                  Label: "Home",
                  IconKey: "Home"
              }
          )
      NavItems:
        PropertyKind: Input
        DisplayName: NavItems
        Description: A custom property
        DataType: Table
        Default: |-
          =

          Table(
              {
                  Order: 10,
                  Key: "Home",
                  Label: "Home",
                  IconKey: "Home"
              }
          )
      OnSelectItem:
        PropertyKind: Event
        DisplayName: OnSelectItem
        Description: A custom property
        ReturnType: None
        Default: |+
          =
      OnToggleCollapse:
        PropertyKind: Event
        DisplayName: OnToggleCollapse
        Description: A custom property
        ReturnType: None
        Default: =
      SelectedItemKey:
        PropertyKind: Output
        DisplayName: SelectedItemKey
        Description: A custom property
        DataType: Text
      SelectedKey:
        PropertyKind: Output
        DisplayName: SelectedKey
        Description: A custom property
        DataType: Text
      UserRole:
        PropertyKind: Input
        DisplayName: UserRole
        Description: A custom property
        DataType: Text
        Default: ="Text"
    Properties:
      Fill: =RGBA(15, 23, 42, 1)
      Height: =App.Height
      SelectedItemKey: =Coalesce(varSidebar_SelectedKey, galNavMain.Selected.Key, "")
      SelectedKey: |+
        =Coalesce(varSidebar_SelectedKey, galNavMain.Selected.Key, "")
      Width: =154
    Children:
      - conNavRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderColor: =RGBA(45,48,56,1)
            Fill: =ColorValue("#07111F")
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =4
            LayoutJustifyContent: =LayoutJustifyContent.Center
            Width: = Parent.Width
          Children:
            - conNavTop:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =116
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Width: =Parent.Width - 20
                Children:
                  - Image2:
                      Control: Image@2.2.3
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =76
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Image: =Pulse_552_01
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Width: =76
            - conNavMenu:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =6
                  PaddingRight: =6
                  PaddingTop: =4
                  Width: |+
                    =Parent.Width
                Children:
                  - galNavMain:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        BorderColor: =RGBA(245, 245, 245, 1)
                        Items: |-
                          =

                          SortByColumns(
                              cmp_SidebarNav.NavItems,
                              "Order",
                              SortOrder.Ascending
                          )
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |+
                          =
                          Set(varSidebar_SelectedKey, ThisItem.Key);
                          cmp_SidebarNav.OnSelectItem()

                        TemplateFill: |-
                          =
                          If(
                              Lower(Text(ThisItem.Key)) = Lower(Text(cmp_SidebarNav.ActiveKey)),
                              ColorValue("#0E3A63"),
                              RGBA(0,0,0,0)
                          )
                        TemplatePadding: =2
                        TemplateSize: =48
                        Width: =Parent.Width
                      Children:
                        - icoNavItem:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Color: |-
                                =


                                If(
                                    Lower(Text(ThisItem.Key)) = Lower(Text(cmp_SidebarNav.ActiveKey)),
                                    Color.White,
                                    ColorValue("#D7E3F4")
                                )
                              DisabledBorderColor: =RGBA(245, 245, 245, 1)
                              DisabledColor: =RGBA(225, 223, 221, 1)
                              DisabledFill: =RGBA(0, 0, 0, 0)
                              FocusedBorderThickness: =8
                              Height: =22
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              Icon: |-
                                =

                                Switch(
                                    ThisItem.IconKey,

                                    "Home", Icon.Home,
                                	
                                    "Trending", Icon.Trending,
                                	
                                    "Document", Icon.Document,
                                	
                                    "Flag", Icon.Flag,

                                    "Message", Icon.Message,

                                    "Settings", Icon.Settings,

                                    "Lock", Icon.Lock,
                                	
                                	
                                    Icon.Home
                                )
                              OnSelect: =Select(Parent)
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedColor: =RGBA(16, 110, 190, 1)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              Width: =22
                              X: =14
                              Y: =12
                        - lblNavItem:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              Color: |-
                                =


                                If(
                                    Lower(Text(ThisItem.Key)) = Lower(Text(cmp_SidebarNav.ActiveKey)),
                                    Color.White,
                                    ColorValue("#D7E3F4")
                                )
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              FocusedBorderThickness: =4
                              Font: =Font.'Segoe UI'
                              FontWeight: |-
                                =
                                If(
                                    ThisItem.Key = cmp_SidebarNav.ActiveKey,
                                    FontWeight.Semibold,
                                    FontWeight.Normal
                                )
                              Height: =Parent.TemplateHeight
                              OnSelect: =Select(Parent)
                              Size: =11
                              Text: =ThisItem.Label
                              Width: =Parent.TemplateWidth - 52
                              Wrap: =false
                              X: =42
                        - recNavActiveBar:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              DisabledFill: =RGBA(161, 159, 157, 1)
                              Fill: =ColorValue("#00C8FF")
                              FocusedBorderThickness: =4
                              Height: =Parent.TemplateHeight - 8
                              HoverFill: =RGBA(0, 120, 212, 1)
                              PressedFill: =RGBA(0, 120, 212, 1)
                              Visible: =Lower(Text(ThisItem.Key)) = Lower(Text(cmp_SidebarNav.ActiveKey))
                              Width: =3
                              X: =1
                              Y: =4
                        - btnNavHitArea:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =0
                              Color: =RGBA(255, 255, 255, 1)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              Fill: =RGBA(0,0,0,0)
                              Font: =Font.'Segoe UI'
                              Height: =Parent.TemplateHeight
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(0,0,0,0)
                              OnSelect: =Select(Parent)
                              PressedBorderColor: =RGBA(0, 69, 120, 1)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(0,0,0,0)
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Text: =
                              Width: =Parent.TemplateWidth
