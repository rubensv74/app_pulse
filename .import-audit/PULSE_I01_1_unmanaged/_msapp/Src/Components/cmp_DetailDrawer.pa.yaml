                                            )
                                          Fill: |-
                                            =

                                            Switch(
                                                lblCustomStatus.Text,
                                                "Saved", RGBA(220,252,231,1),
                                                "Unsaved", RGBA(254,243,199,1),
                                                "Empty", RGBA(254,243,199,1),
                                                "Saving...", RGBA(219,234,254,1),
                                                "Loading...", RGBA(219,234,254,1),
                                                RGBA(229,231,235,1)
                                            )
                                          Height: =24
