ComponentDefinitions:
  cmp_DetailDrawer:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      AppColors:
        PropertyKind: Input
        DisplayName: AppColors
        Description: A custom property
        DataType: Record
        Default: =gblAppColors
      CloseAction:
        PropertyKind: Event
        DisplayName: CloseAction
        Description: A custom property
        ReturnType: None
        Default: =Set(varShowDetailDrawer, false)
      EntityType:
        PropertyKind: Input
        DisplayName: EntityType
        Description: A custom property
        DataType: Text
        Default: =varDrawerEntityType
      FormCodeText:
        PropertyKind: Input
        DisplayName: FormCodeText
        Description: A custom property
        DataType: Text
        Default: ="Text"
      HostHeight:
        PropertyKind: Input
        DisplayName: HostHeight
        Description: A custom property
        DataType: Number
        Default: =App.Height
      HostWidth:
        PropertyKind: Input
        DisplayName: HostWidth
        Description: A custom property
        DataType: Number
        Default: =App.Width
      IsLoading:
        PropertyKind: Input
        DisplayName: IsLoading
        Description: A custom property
        DataType: Boolean
        Default: =false
      IsOpen:
        PropertyKind: Input
        DisplayName: IsOpen
        Description: A custom property
        DataType: Boolean
        Default: =varShowDetailDrawer
      NormalizedRecord:
        PropertyKind: Input
        DisplayName: NormalizedRecord
        Description: A custom property
        DataType: Record
        Default: =varDrawerNormalized
      OnManageFieldsRequested:
        PropertyKind: Event
        DisplayName: OnManageFieldsRequested
        Description: A custom property
        ReturnType: None
        Default: =
      OnSaveCustomField:
        PropertyKind: Event
        DisplayName: OnSaveCustomField
        Description: A custom property
        ReturnType: None
        Default: =
      OnSaved:
        PropertyKind: Event
        DisplayName: OnSaved
        Description: A custom property
        ReturnType: None
        Default: =
      OnToggleFieldActiveRequested:
        PropertyKind: Event
        DisplayName: OnToggleFieldActiveRequested
        Description: A custom property
        ReturnType: None
        Default: =
      ProjectId:
        PropertyKind: Input
        DisplayName: ProjectId
        Description: A custom property
        DataType: Number
        Default: =varProjectId
      RecordId:
        PropertyKind: Input
        DisplayName: RecordId
        Description: A custom property
        DataType: Number
        Default: =varDrawerRecordId
      SelectedRecord:
        PropertyKind: Input
        DisplayName: SelectedRecord
        Description: A custom property
        DataType: Record
        Default: =varDrawerSelectedRecord
      StatusText:
        PropertyKind: Input
        DisplayName: StatusText
        Description: A custom property
        DataType: Text
        Default: ="Text"
      UserEmail:
        PropertyKind: Input
        DisplayName: UserEmail
        Description: A custom property
        DataType: Text
        Default: =varUserEmail
      UserName:
        PropertyKind: Input
        DisplayName: UserName
        Description: A custom property
        DataType: Text
        Default: =varUserName
      UserRole:
        PropertyKind: Input
        DisplayName: UserRole
        Description: A custom property
        DataType: Text
        Default: =varUserRole
    Properties:
      Fill: =RGBA(0,0,0,0.25)
      Height: |+
        =
        With({pad: 12}, Min(820, App.Height - 2*pad))
      OnReset: |+
        =

        Set(varDrawerProjectId, Self.ProjectId);
        Set(varDrawerEntityType, Self.EntityType);
        Set(varDrawerRecordId, Self.RecordId);

        // Variables tipadas
        Set(varCT_Error, "");
        Set(varCT_IsLoading, false);
        Set(varCT_IsSaving, false);
        Set(varCT_IsDirty, false);
        Set(varCT_LoadKey, "");

        // Crear colección vacía de forma segura
        Clear(colCT_Merged);
        Clear(colCT_Dirty);
        Clear(colCT_Quick);


        ClearCollect(
            colCT_Dirty,
            {
                FieldKey: "",
                FieldType: "",
                ValueText: "",
                ValueNumber: Blank(),
                ValueDate: Blank(),
                ValueBool: false,
                ValueJson: ""
            }
        );
        RemoveIf(colCT_Dirty, FieldKey = "");
      Width: |+
        =

        With({pad: 12}, Min(720, App.Width - 2*pad))
    Children:
      - conDrawer:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Height: |-
              =With(
                  { pad: 12 },
                  cmp_DetailDrawer.HostHeight - 2*pad
              )
            Width: |-
              =With(
                  { pad: 12, mode: If(cmp_DetailDrawer.HostWidth < 1100 || cmp_DetailDrawer.HostHeight < 750, "Overlay", "Side") },
                  Min(720, cmp_DetailDrawer.HostWidth - 2*pad)
              )
            X: =(Parent.Width - Self.Width) / 2
            Y: |-
              =With(
                  { pad: 12 },
                  RoundDown((cmp_DetailDrawer.HostHeight - Self.Height)/2, 0)
              )
          Children:
            - conDrawerSurface:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(245, 247, 250, 1)
                  Height: =744
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  PaddingBottom: =If(App.Width < 1100 || App.Height < 750, 16, 12)
                  PaddingLeft: =If(App.Width < 1100 || App.Height < 750, 16, 12)
                  PaddingRight: =If(App.Width < 1100 || App.Height < 750, 16, 12)
                  PaddingTop: =If(App.Width < 1100 || App.Height < 750, 16, 12)
                  Width: =Parent.Width
                Children:
                  - conSpinner:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        Fill: =RGBA(255,255,255,0.7)
                        Height: =Parent.Height
                        Visible: =false //cmp_DetailDrawer.IsOpen && cmp_DetailDrawer.IsOpen && cmp_DetailDrawer.IsLoading
                        Width: =Parent.Width
                        X: =40
                        Y: =40
                      Children:
                        - Spinner1:
                            Control: Spinner@1.4.6
                            Properties:
                              Height: =127
                              SpinnerSize: ='Spinner.SpinnerSize'.Large
                              Width: =168
                              X: =240
                              Y: =35
                        - lblCommentsTitle_1:
                            Control: Text@0.0.51
                            Properties:
                              Align: ='TextCanvas.Align'.Center
                              FontColor: =cmp_DetailDrawer.AppColors.TextPrimary
                              Height: =31
                              Text: ="Loading details..."
                              VerticalAlign: =VerticalAlign.Middle
                              Weight: ='TextCanvas.Weight'.Semibold
                              Width: =168
                              X: =240
                              Y: =146
                  - conHeader:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(229, 231, 235, 1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255,255,255,1)
                        FillPortions: =0
                        Height: =60
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =2
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =16
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =16
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                        Visible: =!cmp_DetailDrawer.IsLoading
                        Width: '=Parent.Width '
                      Children:
                        - lblTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =cmp_DetailDrawer.AppColors.Primary
                              FontWeight: =FontWeight.Bold
                              LayoutMinHeight: =40
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Size: =22
                              Text: |
                                =

                                Text(cmp_DetailDrawer.SelectedRecord.ElementCode) & "  •  " &

                                cmp_DetailDrawer.EntityType & " #" & 

                                Text(cmp_DetailDrawer.RecordId) 
                              VerticalAlign: =VerticalAlign.Top
                              Width: |+
                                =Parent.Width - 50

                        - icoClose:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Color: =RGBA(106, 122, 127, 1)
                              DisabledBorderColor: =RGBA(245, 245, 245, 1)
                              DisabledColor: =RGBA(225, 223, 221, 1)
                              DisabledFill: =RGBA(0, 0, 0, 0)
                              FocusedBorderThickness: =4
                              Height: =20
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =cmp_DetailDrawer.AppColors.TextPrimary
                              HoverFill: =RGBA(0, 0, 0, 0)
                              Icon: =Icon.Cancel
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: |-
                                =

                                cmp_DetailDrawer.CloseAction();

                                Set(varCT_LoadKey, "");
                                Clear(colCT_Merged);
                                Clear(colCT_Quick);
                                Clear(colCT_Dirty);
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedColor: =cmp_DetailDrawer.AppColors.TextPrimary
                              PressedFill: =RGBA(0, 0, 0, 0)
                              Width: =20
                  - tabDetail:
                      Control: TabList@2.2.31
                      Properties:
                        Alignment: ='TabList.Alignment'.Horizontal
                        BasePaletteColor: =RGBA(95, 121, 151, 1)
                        DefaultSelectedItems: =[varDrawerTab]
                        Font: =Font.'Segoe UI'
                        FontColor: =cmp_DetailDrawer.AppColors.TextPrimary
                        FontSize: =16
                        Height: =40
                        Items: =["Overview","Comments","Custom","History"]
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnChange: "=\r\n\r\nSet(varDrawerTab, Coalesce(tabDetail.Selected.Value, \"Overview\"));\r\n\r\nIf(\r\n    IsBlank(cmp_DetailDrawer.RecordId) || Value(cmp_DetailDrawer.RecordId) = 0,\r\n    Notify(\"No record selected.\", NotificationType.Warning\r\n),\r\n\r\n    Switch(\r\n        \r\n        varDrawerTab,\r\n\r\n        // =========================\r\n        // COMMENTS TAB\r\n        // =========================\r\n        \"Comments\",\r\n\r\n            Set(varIsLoadingComments, true);\r\n            Set(varCommentsPageSize, Coalesce(varCommentsPageSize, 20));\r\n            Set(varCommentsPage, 1);\r\n\r\n            // Asegura schema tipado de colComments (1 vez)\r\n            If(\r\n                IsEmpty(colComments),\r\n                ClearCollect(\r\n                    colComments,\r\n                    Table(\r\n                        {\r\n                            CommentId: 0,\r\n                            TaskId: 0,\r\n                            CommentText: \"\",\r\n                            CommentType: \"\",\r\n                            CreatedOn: Now(),\r\n                            CreatedByEmail: \"\",\r\n                            CreatedByName: \"\",\r\n                            ModifiedOn: Now(),\r\n                            ModifiedByEmail: \"\",\r\n                            TotalRows: 0,\r\n                            TotalPages: 0,\r\n                            PageNumber: 1,\r\n                            PageSize: 20\r\n                        }\r\n                    )\r\n                );\r\n                Clear(colComments)\r\n            );\r\n\r\n            Set(\r\n                varCommResp,\r\n                Warroom_GetTaskCommentsPaged.Run(\r\n                    cmp_DetailDrawer.ProjectId,\r\n                    cmp_DetailDrawer.RecordId,\r\n                    varCommentsPage,\r\n                    varCommentsPageSize,\r\n                    cmp_DetailDrawer.EntityType\r\n                )\r\n            );\r\n\r\n            Set(varCommResultText, Coalesce(Text(varCommResp.result), \"\"));\r\n\r\n            If(\r\n                varCommResultText = \"\",\r\n                Clear(colComments);\r\n                Set(varCommentsTotalRows, 0);\r\n                Set(varCommentsTotalPages, 0),\r\n                \r\n                ClearCollect(\r\n                    colComments,\r\n                    ForAll(\r\n                        Table(ParseJSON(varCommResultText)),\r\n                        {\r\n                            CommentId: Value(ThisRecord.Value.CommentId),\r\n                            TaskId: Value(ThisRecord.Value.TaskId),\r\n                            CommentType: Text(ThisRecord.Value.CommentType),\r\n                            CreatedOn: DateTimeValue(Text(ThisRecord.Value.CreatedOn)),\r\n                            CreatedByEmail: Text(ThisRecord.Value.CreatedByEmail),\r\n                            CreatedByName: Text(ThisRecord.Value.CreatedByName),\r\n                            ModifiedOn: DateTimeValue(Text(ThisRecord.Value.ModifiedOn)),\r\n                            ModifiedByEmail: Text(ThisRecord.Value.ModifiedByEmail),\r\n                            CommentText: Text(ThisRecord.Value.CommentText),\r\n                            TotalRows: Value(ThisRecord.Value.TotalRows),\r\n                            TotalPages: Value(ThisRecord.Value.TotalPages),\r\n                            PageNumber: Value(ThisRecord.Value.PageNumber),\r\n                            PageSize: Value(ThisRecord.Value.PageSize)\r\n                        }\r\n                    )\r\n                );\r\n\r\n                Set(varCommentsTotalRows,  Coalesce(First(colComments).TotalRows, 0));\r\n                Set(varCommentsTotalPages, Coalesce(First(colComments).TotalPages, 0))\r\n            );\r\n\r\n            Set(varIsLoadingComments, false),\r\n\r\n        // =========================\r\n        // CUSTOM TAB\r\n        // =========================\r\n            \"Custom\",\r\n            If(\r\n                IsBlank(cmp_DetailDrawer.RecordId) || cmp_DetailDrawer.RecordId = 0,\r\n                Notify(\"No record selected.\", NotificationType.Warning),\r\n                Select(btnCT_Load)\r\n            ),\r\n\r\n        // =========================\r\n        // DEFAULT: no action\r\n        // =========================\r\n        true\r\n    )\r\n);"
                        OnSelect: |-
                          =

                          /*
                          Switch(
                              tabDetail.Selected.Value,
                              "Overview",  Set(varDrawerTab, Coalesce(tabDetail.Selected.Value, "Overview")) ,
                              "Comments", Set(varDrawerTab, Coalesce(tabDetail.Selected.Value, "Comments")),
                              "Custom", Set(varDrawerTab, Coalesce(tabDetail.Selected.Value, "Custom")),
                              "History", Set(varDrawerTab, Coalesce(tabDetail.Selected.Value, "History"))
                          );
                          */
                        Size: ='TabList.Size'.Small
                        Width: |
                          =Parent.Width
                        X: =40
                        Y: =40
                  - conBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(245, 247, 250, 1)
                        Height: =conDrawer.Height - conHeader.Height - tabDetail.Height - 20
