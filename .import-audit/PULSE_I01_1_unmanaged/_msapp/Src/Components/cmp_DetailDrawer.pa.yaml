                                          Size: =14
                                          Text: |-
                                            =


                                            If(
                                                varCT_IsSaving,
                                                "Saving...",
                                                If(
                                                    varCT_IsLoading,
                                                    "Loading...",
                                                    If(
                                                        varCT_IsDirty,
                                                        "Unsaved",
                                                        If(varCT_HasValues, "Saved", "Empty")
                                                    )
                                                )
                                            )
                                          Width: =80
                                    - btnCustomSave:
                                        Control: Button@0.0.45
                                        Properties:
                                          BasePaletteColor: =RGBA(95,121,151,0.4)
                                          DisplayMode: |-
                                            =
                                            If(
                                                varCT_IsLoading || varCT_IsSaving || !varCT_IsDirty,
                                                DisplayMode.Disabled,
                                                DisplayMode.Edit
                                            )
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =
                                            If(
                                                CountRows(colCT_Dirty) = 0,
                                                Notify("There are no changes to save.", NotificationType.Information),

                                                Set(varCT_IsSaving, true);
                                                Set(varCT_Error, "");

                                                Set(
                                                    varCT_SaveJson, 
                                                    JSON(colCT_Dirty, JSONFormat.Compact)
                                                );

                                                IfError(
                                                    Set(
                                                        varCT_SaveResp,
                                                        WarRoom_SaveCustomBulk.Run(
                                                            cmp_DetailDrawer.ProjectId,
                                                            cmp_DetailDrawer.EntityType,
                                                            cmp_DetailDrawer.RecordId,
                                                            varCT_SaveJson,
                                                            cmp_DetailDrawer.UserEmail
                                                        )
                                                    );

                                                    Set(
                                                        varCT_SaveOuter,
                                                        Table(ParseJSON(Coalesce(varCT_SaveResp.result, "[]")))
                                                    );

                                                    If(
                                                        CountRows(varCT_SaveOuter) = 0,
                                                        Set(varCT_IsSaving, false);
                                                        Set(varCT_Error, "Save returned no data.");
                                                        Notify("Save returned no data.", NotificationType.Error),

                                                        Set(
                                                            varCT_Bundle,
                                                            ParseJSON(Text(First(varCT_SaveOuter).Value.result))
                                                        );

                                                        ClearCollect(
                                                            colCT_Merged_UI,
                                                            ForAll(
                                                                Table(varCT_Bundle.merged),
                                                                {
                                                                    FieldKey: Text(ThisRecord.Value.FieldKey),
                                                                    Label: Text(ThisRecord.Value.Label),
                                                                    FieldType: Text(ThisRecord.Value.FieldType),
                                                                    HelpText: Coalesce(Text(ThisRecord.Value.HelpText), ""),
                                                                    IsRequired: Boolean(ThisRecord.Value.IsRequired),
                                                                    IsPinned: Boolean(ThisRecord.Value.IsPinned),
                                                                    SortOrder: Value(ThisRecord.Value.SortOrder),
                                                                    OptionsJson: Coalesce(Text(ThisRecord.Value.OptionsJson), ""),

                                                                    ValueText: Coalesce(Text(ThisRecord.Value.ValueText), ""),
                                                                    ValueNumber: If(
                                                                        IsBlank(Text(ThisRecord.Value.ValueNumber)),
                                                                        Blank(),
                                                                        Value(Text(ThisRecord.Value.ValueNumber))
                                                                    ),
                                                                    ValueDate: If(
                                                                        IsBlank(Text(ThisRecord.Value.ValueDate)),
                                                                        Blank(),
                                                                        DateValue(Text(ThisRecord.Value.ValueDate))
                                                                    ),
                                                                    ValueBool: Boolean(ThisRecord.Value.ValueBool),
                                                                    ValueJson: Coalesce(Text(ThisRecord.Value.ValueJson), ""),

                                                                    LastUpdatedOn: If(
                                                                        IsBlank(Text(ThisRecord.Value.LastUpdatedOn)),
                                                                        Blank(),
                                                                        DateTimeValue(Text(ThisRecord.Value.LastUpdatedOn))
                                                                    ),
                                                                    LastUpdatedByEmail: Coalesce(Text(ThisRecord.Value.LastUpdatedByEmail), "")
                                                                }
                                                            )
                                                        );

                                                        ClearCollect(colCT_Merged_Base, colCT_Merged_UI);

                                                        ClearCollect(
                                                            colCT_Quick,
                                                            SortByColumns(
                                                                Filter(colCT_Merged_UI, IsPinned = true),
                                                                "SortOrder",
                                                                SortOrder.Ascending
                                                            )
                                                        );

                                                        Clear(colCT_Dirty);
                                                        Set(varCT_IsDirty, false);
                                                        Set(varCT_IsSaving, false);

                                                        If(
                                                            CountRows(colCT_Merged_UI) > 0,
                                                            Set(varCT_LastUpdatedBy, First(colCT_Merged_UI).LastUpdatedByEmail);
                                                            Set(varCT_LastUpdatedOn, First(colCT_Merged_UI).LastUpdatedOn);
                                                            Set(varCT_LastUpdatedOnTxt, Text(First(colCT_Merged_UI).LastUpdatedOn, "dd/mm/yyyy hh:mm"))
                                                        );

                                                        Notify("Custom fields saved successfully.", NotificationType.Success)
                                                    ),

                                                    Set(varCT_IsSaving, false);
                                                    Set(varCT_Error, FirstError.Message);
                                                    Notify("Save error: " & FirstError.Message, NotificationType.Error)
                                                )
