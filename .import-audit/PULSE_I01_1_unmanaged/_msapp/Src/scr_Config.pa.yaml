                Children:
                  - btnNode_Cancel_1:
                      Control: Button@0.0.45
                      Properties:
                        BasePaletteColor: =RGBA(95,121,151,1)
                        Height: =36
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =


                          Set(varNodeModalOpen, false);

                          Set(varEditMode, "NEW");
                          Set(varEditLevel, 1);
                          Set(varEditParentNodeId, "");
                          Set(varEditNodeId, "");

                          Set(varTmp_DisplayName, "");
                          Set(varTmp_Description, "");
                          Set(varTmp_SqlKey, "");
                          Set(varTmp_GridKey, "");
                          Set(varTmp_SortOrder, 0);
                          Set(varTmp_IsActive, true);
                        Text: ="Cancel"
