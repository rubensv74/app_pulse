                                    IsFilterable: Boolean(ThisRecord.Value.IsFilterable),
                                    ShowInQuickFilters: Boolean(ThisRecord.Value.ShowInQuickFilters),
                                    FilterOrder: If(
                                        IsBlank(Text(ThisRecord.Value.FilterOrder)),
                                        Coalesce(Value(ThisRecord.Value.SortOrder), 1000),
                                        Value(ThisRecord.Value.FilterOrder)
                                    ),
                                    FilterMode: Coalesce(Text(ThisRecord.Value.FilterMode), "Equals")
                                }
                            )
                        );
                
                        ClearCollect(
                            colPunchDynamicFilters,
                            SortByColumns(
                                Filter(
                                    colCT_Defs_Admin,
                                    EntityType = "PUNCH" &&
                                    IsActive = true &&
                                    IsFilterable = true
                                ),
                                "FilterOrder",
                                SortOrder.Ascending
                            )
                        );
                
                        ClearCollect(
                            colPunchQuickDynamicFilters,
                            SortByColumns(
                                Filter(
                                    colPunchDynamicFilters,
                                    ShowInQuickFilters = true
                                ),
                                "FilterOrder",
                                SortOrder.Ascending
                            )
                        );
                
                        ClearCollect(
                            colPunchMoreDynamicFilters,
                            SortByColumns(
                                Filter(
                                    colPunchDynamicFilters,
                                    ShowInQuickFilters = false
                                ),
                                "FilterOrder",
                                SortOrder.Ascending
                            )
                        );
                
                        ClearCollect(
                            colPunchDynamicFilterValues,
                            ForAll(
                                colPunchDynamicFilters,
                                {
                                    FieldKey: FieldKey,
                                    Label: Label,
                                    FieldType: FieldType,
                                    FilterMode: FilterMode,
                                    ValueText: "",
