        cmp_DynamicFilters_Punches_1 As cmp_DynamicFilters:
            ChildTabPriority: =true
            ContentLanguage: =""
            EnableChildFocus: =true
            Filters: =colPunchDynamicFilters
            Height: =Parent.Height
            OnApply: |-
                =
                Notify(
                    varPunchCustomFiltersJson,
                    NotificationType.Information,
                    10000
                );
                
                Set(varShowPunchDynamicFilters, false);
                Set(varPunches_Page, 1);
                Select(btnPunches_LoadPage_Punches_1)
            OnClear: |-
                =
                
                Set(varPunchCustomFiltersJson, "[]");
                
                Set(varPunches_Page, 1);
                Set(varPunches_PageSize, 50);
                Set(varPunches_HasSearched, true);
                
                Set(varShowPunchDynamicFilters, false);
                
                Select(btnPunches_LoadPage_Punches_1)
            OnValueChanged: |-
                =Switch(
                    cmp_DynamicFilters_Punches_1.ChangedValueSlot,
                
                    "ValueText",
                    UpdateIf(
                        colPunchDynamicFilterValues,
                        FieldKey = cmp_DynamicFilters_Punches_1.ChangedFieldKey,
                        { ValueText: cmp_DynamicFilters_Punches_1.ChangedValueText }
                    ),
                
                    "ValueJson",
                    UpdateIf(
                        colPunchDynamicFilterValues,
                        FieldKey = cmp_DynamicFilters_Punches_1.ChangedFieldKey,
                        { ValueJson: cmp_DynamicFilters_Punches_1.ChangedValueJson }
                    ),
                
                    "ValueDateFrom",
                    UpdateIf(
                        colPunchDynamicFilterValues,
                        FieldKey = cmp_DynamicFilters_Punches_1.ChangedFieldKey,
                        { ValueDateFrom: DateValue(cmp_DynamicFilters_Punches_1.ChangedValueDate) }
                    ),
                
                    "ValueDateTo",
                    UpdateIf(
                        colPunchDynamicFilterValues,
                        FieldKey = cmp_DynamicFilters_Punches_1.ChangedFieldKey,
                        { ValueDateTo: DateValue(cmp_DynamicFilters_Punches_1.ChangedValueDate) }
                    ),
                    "ValueNumberFrom",
                    UpdateIf(
                        colPunchDynamicFilterValues,
                        FieldKey = cmp_DynamicFilters_Punches_1.ChangedFieldKey,
                        { ValueNumberFrom: cmp_DynamicFilters_Punches_1.ChangedValueNumber }
                ),
                
                    "ValueNumberTo",
                    UpdateIf(
                        colPunchDynamicFilterValues,
                        FieldKey = cmp_DynamicFilters_Punches_1.ChangedFieldKey,
                        { ValueNumberTo: cmp_DynamicFilters_Punches_1.ChangedValueNumber }
                    ),
                    "ValueBool",
                    UpdateIf(
                        colPunchDynamicFilterValues,
                        FieldKey = cmp_DynamicFilters_Punches_1.ChangedFieldKey,
                        { ValueBool: cmp_DynamicFilters_Punches_1.ChangedValueBool }
                    ),
                    "ClearAll",
                        ClearCollect(
                            colPunchDynamicFilterValues,
                            ForAll(
                                colPunchDynamicFilters,
                                {
                                    FieldKey: FieldKey,
                                    Label: Label,
                                    FieldType: FieldType,
                                    FilterMode: FilterMode,
                                    ValueText: "",
                                    ValueNumberFrom: 0,
                                    ValueNumberTo: 0,
                                    ValueDateFrom: Date(1900,1,1),
                                    ValueDateTo: Date(1900,1,1),
                                    ValueBool: false,
                                    ValueJson: ""
                                }
                            )
                        )
                );
                
                Set(
                    varPunchCustomFiltersJson,
                    JSON(
                        Filter(
                            colPunchDynamicFilterValues,
                            !IsBlank(Trim(ValueText)) ||
                            !IsBlank(Trim(ValueJson)) ||
                            ValueDateFrom <> Date(1900,1,1) ||
                            ValueDateTo <> Date(1900,1,1) ||
                            ValueNumberFrom <> 0 ||
                            ValueNumberTo <> 0 ||
                            ValueBool = true
                        ),
                        JSONFormat.Compact
                    )
                )
            Values: =colPunchDynamicFilterValues
            Visible: =true
            X: =Parent.Width - Self.Width

