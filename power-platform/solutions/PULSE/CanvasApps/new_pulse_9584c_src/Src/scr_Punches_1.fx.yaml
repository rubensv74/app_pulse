scr_Punches_1 As screen:
    ContentLanguage: =""
    LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    OnVisible: |+
        =
        // =====================================================
        // Punch export collection schema initialization
        // =====================================================
        
        ClearCollect(
            colPunchExportColumns,
            {
                ColumnKey: "",
                ColumnLabel: "",
                ColumnGroup: "",
                SortOrder: 0,
                IsRequired: false,
                IsSensitive: false,
                IsSelected: false
            }
        );
        
        Clear(colPunchExportColumns);
        
        Set(varShowPunchExportColumns, false);
        Set(varPunchExportMode, "CLIENT");
        Set(varPunchExportColumnsJson, "[]");
        Set(varPunchExportConfigError, "");
        Set(varPunchExportLoading, false);
        
        
        // =====================================================
        // scr_Punches.OnVisible
        // Punch List initialization
        // Source of truth for filter catalogs:
        // Warroom_Punches_GetFilterCatalogs
        // =====================================================
        
        If(
            Coalesce(varPunches_FilterSource, "Manual") <> "Dashboard",
            Set(varFilter_SubsystemsCsv, "");
            Set(varFilter_Subsystem, Blank());
            Reset(cmp_MultiValueFilter_2)
        );
        
        Set(varPunchSubsystemPopup, false);
        
        Set(varAppView, "Punches");
        
        Set(varPageKey, "PUNCHES");
        Set(varPageTitle, "Punch List");
        Set(varPageSubtitle, "Punch item management");
        
        Set(varPunches_ViewReady, false);
        
        Set(varShowPunchDynamicFilters, false);
        
        Set(
            varPunchCustomFiltersJson,
            Coalesce(varPunchCustomFiltersJson, "[]")
        );
        
        Set(varPunches_FilterSource, Coalesce(varPunches_FilterSource, "Manual"));
        Set(varPunches_ReturnView, Coalesce(varPunches_ReturnView, "Overview"));
        
        If(
            varPunches_FilterSource = "Dashboard",
            Set(varPunches_HasSearched, true);
            Set(varPunches_Page, 1);
            Set(varPunches_AutoLoad, true)
        );
        
        Set(varPunches_Page, Coalesce(varPunches_Page, 1));
        Set(varPunches_PageSize, Coalesce(varPunches_PageSize, 50));
        
        Set(varPunches_IsLoading, false);
        Set(varPunches_Error, Coalesce(varPunches_Error, ""));
        
        Set(varPunchCatalogs_IsLoading, false);
        Set(varPunchCatalogs_Error, "");
        
        Set(varFilter_Subsystem, Coalesce(varFilter_Subsystem, Blank()));
        Set(varFilter_PunchDiscipline, Coalesce(varFilter_PunchDiscipline, Blank()));
        Set(varFilter_Subcontractor, Coalesce(varFilter_Subcontractor, Blank()));
        Set(varFilter_PunchTemplateId, Coalesce(varFilter_PunchTemplateId, Blank()));
        Set(varFilter_PunchCategoryCode, Coalesce(varFilter_PunchCategoryCode, Blank()));
        Set(varFilter_PunchStatusCode, Coalesce(varFilter_PunchStatusCode, Blank()));
        
        Set(varGlobalLoading, false);
        Set(varGlobalLoadingMsg, "");
        Set(varGlobalLoadingSubMsg, "");
        Set(varGlobalLoadingScope, "");
        
        If(
            !IsBlank(varProjectId) &&
            (
                IsBlank(varPunchCatalogs_ProjectId) ||
                Text(varPunchCatalogs_ProjectId) <> Text(varProjectId) ||
                CountRows(colPunchSubsystems_Filter) = 0 ||
                CountRows(colPunchTemplates_Filter) = 0
            ),
        
            Set(varPunchCatalogs_IsLoading, true);
            Set(varPunchCatalogs_Error, "");
        
            Set(varGlobalLoading, true);
            Set(varGlobalLoadingMsg, "Loading Punch List filters...");
            Set(varGlobalLoadingSubMsg, "Preparing filter catalogs");
            Set(varGlobalLoadingScope, "PUNCHES");
        
            IfError(
                With(
                    {
                        respCatalogs:
                            Warroom_Punches_GetFilterCatalogs.Run(
                                Value(varProjectId)
                            )
                    },
                    With(
                        {
                            objCatalogs:
                                ParseJSON(
                                    Coalesce(
                                        respCatalogs.result,
                                        "{}"
                                    )
                                )
                        },
        
                        ClearCollect(
                            colPunchSubsystems_Filter,
                            SortByColumns(
                                ForAll(
                                    Table(objCatalogs.Table1),
                                    With(
                                        { r: ThisRecord.Value },
                                        {
                                            Code: Text(r.Code),
                                            Label: Text(r.Label),
                                            SortOrder:
                                                If(
                                                    IsBlank(Text(r.SortOrder)) || Text(r.SortOrder) = "null",
                                                    1,
                                                    Value(Text(r.SortOrder))
                                                )
                                        }
                                    )
                                ),
                                "SortOrder",
                                SortOrder.Ascending,
                                "Code",
                                SortOrder.Ascending
                            )
                        );
        
                        ClearCollect(
                        colPunchSubsystems_MVF,
                        AddColumns(
                            colPunchSubsystems_Filter,
                            Display,
                            Label,
                            Id,
                            Code
                        )
                    );
        
                        ClearCollect(
                            colPunchTemplates_Filter,
                            SortByColumns(
                                ForAll(
                                    Table(objCatalogs.Table2),
                                    With(
                                        { r: ThisRecord.Value },
                                        {
                                            TemplateId:
                                                If(
                                                    IsBlank(Text(r.TemplateId)) || Text(r.TemplateId) = "null",
                                                    Blank(),
                                                    Value(Text(r.TemplateId))
                                                ),
                                            TemplateCode: Text(r.TemplateCode),
                                            TemplateLabel: Text(r.TemplateLabel),
                                            TemplateDescription: Text(r.TemplateDescription)
                                        }
                                    )
                                ),
                                "TemplateLabel",
                                SortOrder.Ascending
                            )
                        );
        
                        ClearCollect(
                            colPunchCategories_Filter,
                            SortByColumns(
                                ForAll(
                                    Table(objCatalogs.Table3),
                                    With(
                                        { r: ThisRecord.Value },
                                        {
                                            TemplateId:
                                                If(
                                                    IsBlank(Text(r.TemplateId)) || Text(r.TemplateId) = "null",
                                                    Blank(),
                                                    Value(Text(r.TemplateId))
                                                ),
                                            CategoryCode: Text(r.CategoryCode),
                                            CategoryLabel: Text(r.CategoryLabel),
                                            DisplayLabel: Text(r.DisplayLabel),
                                            SortOrder:
                                                If(
                                                    IsBlank(Text(r.SortOrder)) || Text(r.SortOrder) = "null",
                                                    999,
                                                    Value(Text(r.SortOrder))
                                                )
                                        }
                                    )
                                ),
                                "TemplateId",
                                SortOrder.Ascending,
                                "SortOrder",
                                SortOrder.Ascending,
                                "CategoryCode",
                                SortOrder.Ascending
                            )
                        );
        
                        ClearCollect(
                            colPunchStatuses_Filter,
                            SortByColumns(
                                ForAll(
                                    Table(objCatalogs.Table4),
                                    With(
                                        { r: ThisRecord.Value },
                                        {
                                            StatusCode: Text(r.StatusCode),
                                            StatusLabel: Text(r.StatusLabel),
                                            SortOrder:
                                                If(
                                                    IsBlank(Text(r.SortOrder)) || Text(r.SortOrder) = "null",
                                                    999,
                                                    Value(Text(r.SortOrder))
                                                )
                                        }
                                    )
                                ),
                                "SortOrder",
                                SortOrder.Ascending,
                                "StatusCode",
                                SortOrder.Ascending
                            )
                        );
        
                        ClearCollect(
                            colPunchDisciplines_Filter,
                            SortByColumns(
                                ForAll(
                                    Table(objCatalogs.Table5),
                                    With(
                                        { r: ThisRecord.Value },
                                        {
                                            Discipline: Text(r.Discipline),
                                            DisciplineLabel: Text(r.DisciplineLabel)
                                        }
                                    )
                                ),
                                "DisciplineLabel",
                                SortOrder.Ascending
                            )
                        );
        
                        ClearCollect(
                            colPunchSubcontractors_Filter,
                            SortByColumns(
                                ForAll(
                                    Table(objCatalogs.Table6),
                                    With(
                                        { r: ThisRecord.Value },
                                        {
                                            SubcontractorId:
                                                If(
                                                    IsBlank(Text(r.SubcontractorId)) || Text(r.SubcontractorId) = "null",
                                                    Blank(),
                                                    Value(Text(r.SubcontractorId))
                                                ),
                                            SubcontractorCode: Text(r.SubcontractorCode),
                                            SubcontractorName: Text(r.SubcontractorName),
                                            SubcontractorFullName: Text(r.SubcontractorFullName)
                                        }
                                    )
                                ),
                                "SubcontractorName",
                                SortOrder.Ascending
                            )
                        );
        
                        Set(varPunchCatalogs_ProjectId, varProjectId)
        
                        ;
        
                        Select(btnPunches_LoadDynamicFilters_1)
        
                        
                    )
                ),
        
                Set(varPunchCatalogs_Error, FirstError.Message);
        
                Notify(
                    "Punch filter catalogs could not be loaded.",
                    NotificationType.Warning
                );
        
                Clear(colPunchSubsystems_Filter);
                Clear(colPunchTemplates_Filter);
                Clear(colPunchCategories_Filter);
                Clear(colPunchStatuses_Filter);
                Clear(colPunchDisciplines_Filter);
                Clear(colPunchSubcontractors_Filter);
        
                Set(varPunchCatalogs_ProjectId, Blank())
            );
        
            Set(varPunchCatalogs_IsLoading, false);
        
            Set(varGlobalLoading, false);
            Set(varGlobalLoadingMsg, "");
            Set(varGlobalLoadingSubMsg, "");
            Set(varGlobalLoadingScope, "")
        );
        
        Set(varPunches_ViewReady, true);
        
        If(
            varPunches_AutoLoad,
        
            Set(varPunches_AutoLoad, false);
        
            Set(varGlobalLoading, true);
            Set(varGlobalLoadingMsg, "Loading Punches...");
            Set(
                varGlobalLoadingSubMsg,
                If(
                    varPunches_FilterSource = "Dashboard",
                    "Applying Home Dashboard context",
                    "Applying Overview context"
                )
            );
            Set(varGlobalLoadingScope, "PUNCHES");
        
            Select(btnPunches_LoadPage_Punches_1)
        );
        
        Set(varPunchSubsystemPopup, false);
        

    conPunchesScreenRoot_1 As groupContainer.horizontalAutoLayoutContainer:
        DropShadow: =DropShadow.Light
        Fill: =varTheme_PageBg
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Center
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        RadiusTopLeft: =4
        RadiusTopRight: =4
        Width: =Parent.Width
        ZIndex: =1

        cmp_NavApp_Punches_1 As cmp_SidebarNav:
            ChildTabPriority: =true
            ContentLanguage: =""
            EnableChildFocus: =true
            Fill: =varTheme_PulseBlue
            Height: =Parent.Height
            Items: =colSidebarNavItems
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =640
            LayoutMinWidth: =640
            NavItems: =colSidebarNavItems
            OnSelectItem: |-
                =
                
                
                
                With(
                    {
                        _key: Lower(Trim(Self.SelectedItemKey)),
                        _hasProject: !IsBlank(varProjectId),
                        _hasConfig: varProjectHasReportConfig || varHomeHiveLoaded || varProjectHasPHRData
                    },
                
                    If(
                        _key = "superadmin",
                
                        Set(varGlobalLoading, false);
                        Set(varGlobalLoadingMsg, "");
                        Set(varGlobalLoadingSubMsg, "");
                        Set(varGlobalLoadingScope, "");
                        Set(varGlobalLoadAction, "");
                        Set(varGlobalLoadPending, false);
                
                        Set(varPHR_IsLoading, false);
                        Set(varOps_IsLoading, false);
                        Set(varTasks_IsLoading, false);
                        Set(varPunches_IsLoading, false);
                        Set(varCfg_IsLoading, false);
                
                        Set(varAppView, "SuperAdmin");
                        Set(varPageKey, "SUPERADMIN");
                        Set(varPageTitle, "Administration");
                        Set(varPageSubtitle, "Platform configuration and governance");
                
                        Navigate(scr_SuperAdmin, ScreenTransition.None),
                
                        If(
                            _key <> "home" && !_hasProject,
                
                            Notify("Please select a project first.", NotificationType.Warning);
                
                            Set(varAppView, "Home");
                            Set(varPageKey, "HOME");
                            Set(varPageTitle, "Home");
                            Set(varPageSubtitle, "Project command center");
                
                            Navigate(scr_Home, ScreenTransition.None),
                
                            If(
                                _key in ["overview", "tasks", "punches", "briefing", "config", "skyline"] && !_hasConfig,
                
                                Notify(
                                    "This project has no published report configuration yet.",
                                    NotificationType.Warning
                                );
                
                                Set(varAppView, "Home");
                                Set(varPageKey, "HOME");
                                Set(varPageTitle, "Home");
                                Set(varPageSubtitle, "Project command center");
                
                                Navigate(scr_Home, ScreenTransition.None),
                
                                Switch(
                                    _key,
                
                                    "skyline",
                                    Set(varAppView, "Skyline");
                                    Set(varPageKey, "SKYLINE");
                                    Set(varPageTitle, "Delivery Skyline");
                                    Set(varPageSubtitle, "Weekly subsystem delivery risk and workload forecast");
                                    Set(varSkylineLoaded, false);
                                    Set(varSkylineError, "");
                                    Clear(colSkylineRaw);
                                    Clear(colSkylineWeeks);
                                    Clear(colSkylineSelectedWeek);
                
                                    Navigate(scr_Skyline, ScreenTransition.None),
                
                                    
                                    "home",
                                        Set(varGlobalLoading, false);
                                        Set(varGlobalLoadingMsg, "");
                                        Set(varGlobalLoadingSubMsg, "");
                                        Set(varGlobalLoadingScope, "");
                                        Set(varGlobalLoadAction, "");
                                        Set(varGlobalLoadPending, false);
                
                                        Set(varPHR_IsLoading, false);
                                        Set(varOps_IsLoading, false);
                                        Set(varTasks_IsLoading, false);
                                        Set(varPunches_IsLoading, false);
                                        Set(varCfg_IsLoading, false);
                
                                        Set(varAppView, "Home");
                                        Set(varPageKey, "HOME");
                                        Set(varPageTitle, "Home");
                                        Set(varPageSubtitle, "Project command center");
                                        Set(varHomeViewMode, "DASHBOARD");
                
                                        Navigate(scr_Home, ScreenTransition.None),
                
                                    "overview",
                                        Set(varAppView, "Overview");
                                        Set(varPageKey, "OVERVIEW");
                                        Set(varPageTitle, "Overview");
                                        Set(varPageSubtitle, "Project Handover Report by subsystem, discipline and form family");
                                        Set(varOps_ViewMode, "OVERVIEW");
                
                                        Navigate(scr_Overview, ScreenTransition.None),
                
                
                
                                    "tasks",
                                        Set(varAppView, "Tasks");
                                        Set(varPageKey, "TASKS");
                                        Set(varPageTitle, "Tasks");
                                        Set(varPageSubtitle, "Inspection task management");
                
                                        Navigate(scr_Tasks, ScreenTransition.None),
                
                                    "punches",
                                        Set(varAppView, "Punches");
                                        Set(varPageKey, "PUNCHES");
                                        Set(varPageTitle, "Punch List");
                                        Set(varPageSubtitle, "Punch item management");
                
                                        Navigate(scr_Punches_1, ScreenTransition.None),
                
                                    "briefing",
                                        Set(varAppView, "Briefing");
                                        Set(varPageKey, "BRIEFING");
                                        Set(varPageTitle, "Briefing");
                                        Set(varPageSubtitle, "Project reporting and communication");
                
                                        Navigate(scr_Briefing, ScreenTransition.None),
                
                                    "config",
                                        Set(varAppView, "Config");
                                        Set(varPageKey, "CONFIG");
                                        Set(varPageTitle, "Configuration");
                                        Set(varPageSubtitle, "Report structure and scope management");
                
                                        Navigate(scr_Config_NEW, ScreenTransition.None),
                
                                    Notify("Key not mapped: [" & _key & "]", NotificationType.Error)
                                )
                            )
                        )
                    )
                )
            OnToggleCollapse: =
            ProjectCode: =Coalesce(Text(varSelectedProject.ProjectCode), "")
            ProjectName: =Coalesce(varSelectedProject.ProjectName, "")
            Visible: =true

        btnPunches_LoadPage_Punches_1 As modernButton:
            Align: =Align.Center
            BorderStyle: =""
            Font: =""
            FontWeight: =""
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            OnSelect: |-
                =
                
                
                // =====================================================
                // btnPunches_LoadPage_Punches.OnSelect
                // Load Punches safely using staging collection
                // Flow parameter order:
                // ProjectId, Subsystem, Discipline, Subcontractor,
                // PageNumber, PageSize, TemplateId, CategoryCode,
                // StatusCode, CustomFiltersJson
                // =====================================================
                
                If(
                    IsBlank(varProjectId),
                
                    Notify("Please select a project first.", NotificationType.Warning);
                
                    Set(varPunches_IsLoading, false);
                    Set(varGlobalLoading, false);
                    Set(varGlobalLoadingMsg, "");
                    Set(varGlobalLoadingSubMsg, "");
                    Set(varGlobalLoadingScope, "");
                
                    Exit()
                );
                
                If(
                    varPunches_IsLoading,
                
                    Notify("Punches are already loading.", NotificationType.Information);
                
                    Set(varGlobalLoading, false);
                    Set(varGlobalLoadingMsg, "");
                    Set(varGlobalLoadingSubMsg, "");
                    Set(varGlobalLoadingScope, "");
                
                    Exit()
                );
                
                Set(varPunches_IsLoading, true);
                Set(varPunches_Error, "");
                Set(varLoadingMsg, "Loading punches...");
                
                Set(varGlobalLoading, true);
                Set(varGlobalLoadingMsg, "Loading Punches...");
                Set(varGlobalLoadingSubMsg, "Preparing punch list");
                Set(varGlobalLoadingScope, "PUNCHES");
                
                Set(
                    varPunchCustomFiltersJson_Safe,
                    If(
                        IsBlank(varPunchCustomFiltersJson) ||
                        Trim(varPunchCustomFiltersJson) = "" ||
                        Trim(varPunchCustomFiltersJson) = " ",
                        "[]",
                        varPunchCustomFiltersJson
                    )
                );
                
                Clear(colPunches_Staging);
                
                IfError(
                    With(
                        {
                            resp:
                                Warroom_Punches_Filtered_Paged.Run(
                                    Value(varProjectId),
                
                                    If(
                                        IsBlank(varFilter_SubsystemsCsv),
                                        " ",
                                        Text(varFilter_SubsystemsCsv)
                                    ),
                                    If(IsBlank(varFilter_PunchDiscipline), " ", Text(varFilter_PunchDiscipline)),
                                    If(IsBlank(varFilter_Subcontractor), " ", Text(varFilter_Subcontractor)),
                
                                    Value(Coalesce(varPunches_Page, 1)),
                                    Value(Coalesce(varPunches_PageSize, 50)),
                
                                    If(
                                        IsBlank(varFilter_PunchTemplateId),
                                        0,
                                        Value(varFilter_PunchTemplateId)
                                    ),
                
                                    If(IsBlank(varFilter_PunchCategoryCode), " ", Text(varFilter_PunchCategoryCode)),
                                    If(IsBlank(varFilter_PunchStatusCode), " ", Text(varFilter_PunchStatusCode)),
                
                                    varPunchCustomFiltersJson_Safe
                                )
                        },
                        With(
                            {
                                arr: Table(ParseJSON(Coalesce(resp.result, "[]")))
                            },
                            ClearCollect(
                                colPunches_Staging,
                                ForAll(
                                    arr,
                                    With(
                                        { r: ThisRecord.Value },
                                        {
                                            AreaCode: Text(r.AreaCode),
                                            UnitCode: Text(r.UnitCode),
                                            SystemCode: Text(r.SystemCode),
                                            SubsystemCode: Text(r.SubsystemCode),
                                            ElementCode: Text(r.ElementCode),
                                            ElementDiscipline: Text(r.ElementDiscipline),
                                            TypeCode: Text(r.TypeCode),
                
                                            ProjectId:
                                                If(
                                                    IsBlank(Text(r.ProjectId)) || Text(r.ProjectId) = "null",
                                                    varProjectId,
                                                    Value(Text(r.ProjectId))
                                                ),
                
                                            TemplateId:
                                                If(
                                                    IsBlank(Text(r.TemplateId)) || Text(r.TemplateId) = "null",
                                                    Blank(),
                                                    Value(Text(r.TemplateId))
                                                ),
                
                                            PunchId:
                                                If(
                                                    IsBlank(Text(r.Id)) || Text(r.Id) = "null",
                                                    0,
                                                    Value(Text(r.Id))
                                                ),
                
                                            PunchCode: Text(r.Code),
                                            PunchDescription: Text(r.Description),
                
                                            PunchCoordinator: Text(r.PunchCoordinator),
                                            Originator: Text(r.Originator),
                
                                            CategoryCode: Text(r.CategoryCode),
                                            Category: Text(r.Category),
                
                                            PunchDiscipline: Text(r.Discipline),
                                            StatusCode: Text(r.StatusCode),
                                            PunchStatus: Text(r.Status),
                
                                            InspectionCode: Text(r.InspectionCode),
                                            InspectionName: Text(r.InspectionName),
                                            InspectionType: Text(r.InspectionType),
                
                                            EntryType: Text(r.EntryType),
                                            EntryTypeColor: Text(r.EntryTypeColor),
                                            Topic: Text(r.Topic),
                
                                            RejectCount:
                                                If(
                                                    IsBlank(Text(r.RejectCount)) || Text(r.RejectCount) = "null",
                                                    0,
                                                    Value(Text(r.RejectCount))
                                                ),
                
                                            ElementCodeMapped: Text(r.ElementCodeMapped),
                
                                            SubcontractorId:
                                                If(
                                                    IsBlank(Text(r.SubcontractorId)) || Text(r.SubcontractorId) = "null",
                                                    Blank(),
                                                    Value(Text(r.SubcontractorId))
                                                ),
                
                                            SubcontractorCode: Text(r.SubcontractorCode),
                                            SubcontractorName: Text(r.SubcontractorName),
                                            SubcontractorShortName: Text(r.SubcontractorShortName),
                
                                            DepartmentAction: Text(r.DepartmentAction),
                
                                            CustomJson: Coalesce(Text(r.CustomJson), "{}"),
                                            CustomFlag1: Boolean(r.CustomFlag1),
                                            CustomFlag2: Boolean(r.CustomFlag2),
                                            CustomText1: Text(r.CustomText1),
                                            CustomText2: Text(r.CustomText2),
                
                                            CustomDate1:
                                                If(
                                                    IsBlank(Text(r.CustomDate1)) || Text(r.CustomDate1) = "null",
                                                    Blank(),
                                                    DateValue(Text(r.CustomDate1))
                                                ),
                
                                            CustomNumber1:
                                                If(
                                                    IsBlank(Text(r.CustomNumber1)) || Text(r.CustomNumber1) = "null",
                                                    Blank(),
                                                    Value(Text(r.CustomNumber1))
                                                ),
                
                                            CustomLastUpdatedByEmail: Text(r.CustomLastUpdatedByEmail),
                
                                            CustomLastUpdatedOn:
                                                If(
                                                    IsBlank(Text(r.CustomLastUpdatedOn)) || Text(r.CustomLastUpdatedOn) = "null",
                                                    Blank(),
                                                    DateTimeValue(Text(r.CustomLastUpdatedOn))
                                                ),
                
                                            LastCommentOn:
                                                If(
                                                    IsBlank(Text(r.LastCommentOn)) || Text(r.LastCommentOn) = "null",
                                                    Blank(),
                                                    DateTimeValue(Text(r.LastCommentOn))
                                                ),
                
                                            LastCommentText: Text(r.LastCommentText),
                                            LastCommentByEmail: Text(r.LastCommentByEmail),
                
                                            CommentCount:
                                                If(
                                                    IsBlank(Text(r.CommentCount)) || Text(r.CommentCount) = "null",
                                                    0,
                                                    Value(Text(r.CommentCount))
                                                ),
                
                                            TotalRows:
                                                If(
                                                    IsBlank(Text(r.TotalRows)) || Text(r.TotalRows) = "null",
                                                    0,
                                                    Value(Text(r.TotalRows))
                                                ),
                
                                            TotalPages:
                                                If(
                                                    IsBlank(Text(r.TotalPages)) || Text(r.TotalPages) = "null",
                                                    0,
                                                    Value(Text(r.TotalPages))
                                                ),
                
                                            PageNumber:
                                                If(
                                                    IsBlank(Text(r.PageNumber)) || Text(r.PageNumber) = "null",
                                                    varPunches_Page,
                                                    Value(Text(r.PageNumber))
                                                ),
                
                                            PageSize:
                                                If(
                                                    IsBlank(Text(r.PageSize)) || Text(r.PageSize) = "null",
                                                    varPunches_PageSize,
                                                    Value(Text(r.PageSize))
                                                )
                                        }
                                    )
                                )
                            )
                        )
                    ),
                
                    Set(varPunches_Error, FirstError.Message)
                );
                
                If(
                    IsBlank(varPunches_Error),
                
                    ClearCollect(colPunches, colPunches_Staging);
                
                    Set(
                        varPunches_TotalPages,
                        If(
                            CountRows(colPunches) = 0,
                            0,
                            Coalesce(First(colPunches).TotalPages, 0)
                        )
                    );
                
                    Set(
                        varPunches_TotalRows,
                        If(
                            CountRows(colPunches) = 0,
                            0,
                            Coalesce(First(colPunches).TotalRows, 0)
                        )
                    );
                
                    Set(varPunchesLoaded, true);
                    Set(varPunches_LastRefresh, Now()),
                
                    Notify("Error loading punches: " & varPunches_Error, NotificationType.Error)
                );
                
                Set(varPunches_IsLoading, false);
                Set(varLoadingMsg, "");
                
                Set(varGlobalLoading, false);
                Set(varGlobalLoadingMsg, "");
                Set(varGlobalLoadingSubMsg, "");
