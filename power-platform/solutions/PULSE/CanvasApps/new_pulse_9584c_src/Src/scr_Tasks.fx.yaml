scr_Tasks As screen:
    LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    OnVisible: |-
        =
        
        // =====================================================
        // scr_Tasks.OnVisible
        // Tasks initialization
        // Source of truth for filter catalogs:
        // Warroom_Tasks_GetFilterCatalogs
        // =====================================================
        
        Set(varAppView, "Tasks");
        
        Set(varPageKey, "TASKS");
        Set(varPageTitle, "Tasks");
        Set(varPageSubtitle, "Inspection task management");
        
        Set(varTasks_ViewReady, false);
        
        Set(varTasks_FilterSource, Coalesce(varTasks_FilterSource, "Manual"));
        
        Set(varTasks_Page, Coalesce(varTasks_Page, 1));
        Set(varTasks_PageSize, Coalesce(varTasks_PageSize, 20));
        
        Set(varTasks_IsLoading, false);
        Set(varTasks_Error, Coalesce(varTasks_Error, ""));
        
        Set(varTaskCatalogs_IsLoading, false);
        Set(varTaskCatalogs_Error, "");
        
        Set(varFilter_TaskSubsystem, Coalesce(varFilter_TaskSubsystem, Blank()));
        Set(varFilter_TaskDiscipline, Coalesce(varFilter_TaskDiscipline, Blank()));
        Set(varFilter_TaskSubcontractor, Coalesce(varFilter_TaskSubcontractor, Blank()));
        Set(varFilter_TaskStatusId, Coalesce(varFilter_TaskStatusId, Blank()));
        
        Set(varGlobalLoading, false);
        Set(varGlobalLoadingMsg, "");
        Set(varGlobalLoadingSubMsg, "");
        Set(varGlobalLoadingScope, "");
        
        If(
            !IsBlank(varProjectId) &&
            (
                IsBlank(varTaskCatalogs_ProjectId) ||
                Text(varTaskCatalogs_ProjectId) <> Text(varProjectId) ||
                CountRows(colTaskSubsystems_Filter) = 0 ||
                CountRows(colTaskStatuses_Filter) = 0
            ),
        
            Set(varTaskCatalogs_IsLoading, true);
            Set(varTaskCatalogs_Error, "");
        
            Set(varGlobalLoading, true);
            Set(varGlobalLoadingMsg, "Loading Task filters...");
            Set(varGlobalLoadingSubMsg, "Preparing subsystem, discipline, subcontractor and status catalogs");
            Set(varGlobalLoadingScope, "TASKS");
        
            IfError(
                With(
                    {
                        respCatalogs:
                            Warroom_Tasks_GetFilterCatalogs.Run(
                                Value(varProjectId)
                            )
                    },
                    With(
                        {
                            objCatalogs:
                                ParseJSON(Coalesce(respCatalogs.result, "{}"))
                        },
        
                        ClearCollect(
                            colTaskSubsystems_Filter,
                            SortByColumns(
                                ForAll(
                                    Table(objCatalogs.Table1),
                                    With(
                                        { r: ThisRecord.Value },
                                        {
                                            Code: Text(r.Code),
                                            Label: Text(r.Label),
                                            SortOrder:
                                                If(
                                                    IsBlank(Text(r.SortOrder)) || Text(r.SortOrder) = "null",
                                                    1,
                                                    Value(Text(r.SortOrder))
                                                )
                                        }
                                    )
                                ),
                                "SortOrder", SortOrder.Ascending,
                                "Code", SortOrder.Ascending
                            )
                        );
        
                        ClearCollect(
                            colTaskDisciplines_Filter,
                            SortByColumns(
                                ForAll(
                                    Table(objCatalogs.Table2),
                                    With(
                                        { r: ThisRecord.Value },
                                        {
                                            Discipline: Text(r.Discipline),
                                            DisciplineLabel: Text(r.DisciplineLabel)
                                        }
                                    )
                                ),
                                "DisciplineLabel", SortOrder.Ascending
                            )
                        );
        
                        ClearCollect(
                            colTaskSubcontractors_Filter,
                            SortByColumns(
                                ForAll(
                                    Table(objCatalogs.Table3),
                                    With(
                                        { r: ThisRecord.Value },
                                        {
                                            SubcontractCode: Text(r.SubcontractCode),
                                            SubcontractorName: Text(r.SubcontractorName),
                                            DisplayLabel: Text(r.DisplayLabel)
                                        }
                                    )
                                ),
                                "DisplayLabel", SortOrder.Ascending
                            )
                        );
        
                        ClearCollect(
                            colTaskStatuses_Filter,
                            SortByColumns(
                                ForAll(
                                    Table(objCatalogs.Table4),
                                    With(
                                        { r: ThisRecord.Value },
                                        {
                                            TaskStatusId:
                                                If(
                                                    IsBlank(Text(r.TaskStatusId)) || Text(r.TaskStatusId) = "null",
                                                    Blank(),
                                                    Value(Text(r.TaskStatusId))
                                                ),
                                            TaskStatusName: Text(r.TaskStatusName),
                                            DisplayLabel: Text(r.DisplayLabel)
                                        }
                                    )
                                ),
                                "TaskStatusId", SortOrder.Ascending
                            )
                        );
        
                        Set(varTaskCatalogs_ProjectId, varProjectId)
                    )
                ),
        
                Set(varTaskCatalogs_Error, FirstError.Message);
        
                Notify(
                    "Task filter catalogs could not be loaded.",
                    NotificationType.Warning
                );
        
                Clear(colTaskSubsystems_Filter);
                Clear(colTaskDisciplines_Filter);
                Clear(colTaskSubcontractors_Filter);
                Clear(colTaskStatuses_Filter);
        
                Set(varTaskCatalogs_ProjectId, Blank())
            );
        
            Set(varTaskCatalogs_IsLoading, false);
        
            Set(varGlobalLoading, false);
            Set(varGlobalLoadingMsg, "");
            Set(varGlobalLoadingSubMsg, "");
            Set(varGlobalLoadingScope, "")
        );
        
        Set(varTasks_ViewReady, true);
        
        If(
            varTasks_AutoLoad,
        
            Set(varTasks_AutoLoad, false);
        
            Set(varGlobalLoading, true);
            Set(varGlobalLoadingMsg, "Loading Tasks...");
            Set(varGlobalLoadingSubMsg, "Applying Overview context");
            Set(varGlobalLoadingScope, "TASKS");
        
            Select(btnTasks_LoadPage_Tasks)
        );

    conTasksScreenRoot As groupContainer.horizontalAutoLayoutContainer:
        DropShadow: =DropShadow.Light
        Fill: =varTheme_PageBg
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Center
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        RadiusTopLeft: =4
        RadiusTopRight: =4
        Width: =Parent.Width
        ZIndex: =1

        cmp_NavApp_Tasks As cmp_SidebarNav:
            ChildTabPriority: =true
            ContentLanguage: =""
            EnableChildFocus: =true
            Fill: =varTheme_PulseBlue
            Height: =Parent.Height
            Items: =colSidebarNavItems
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =640
            LayoutMinWidth: =640
            NavItems: =colSidebarNavItems
            OnSelectItem: |-
                =
                
                
                
                
                With(
                    {
                        _key: Lower(Trim(Self.SelectedItemKey)),
                        _hasProject: !IsBlank(varProjectId),
                        _hasConfig: varProjectHasReportConfig || varHomeHiveLoaded || varProjectHasPHRData
                    },
                
                    If(
                        _key = "superadmin",
                
                        Set(varGlobalLoading, false);
                        Set(varGlobalLoadingMsg, "");
                        Set(varGlobalLoadingSubMsg, "");
                        Set(varGlobalLoadingScope, "");
                        Set(varGlobalLoadAction, "");
                        Set(varGlobalLoadPending, false);
                
                        Set(varPHR_IsLoading, false);
                        Set(varOps_IsLoading, false);
                        Set(varTasks_IsLoading, false);
                        Set(varPunches_IsLoading, false);
                        Set(varCfg_IsLoading, false);
                
                        Set(varAppView, "SuperAdmin");
                        Set(varPageKey, "SUPERADMIN");
                        Set(varPageTitle, "Administration");
                        Set(varPageSubtitle, "Platform configuration and governance");
                
                        Navigate(scr_SuperAdmin, ScreenTransition.None),
                
                        If(
                            _key <> "home" && !_hasProject,
                
                            Notify("Please select a project first.", NotificationType.Warning);
                
                            Set(varAppView, "Home");
                            Set(varPageKey, "HOME");
                            Set(varPageTitle, "Home");
                            Set(varPageSubtitle, "Project command center");
                
                            Navigate(scr_Home, ScreenTransition.None),
                
                            If(
                                _key in ["overview", "tasks", "punches", "briefing", "config", "skyline"] && !_hasConfig,
                
                                Notify(
                                    "This project has no published report configuration yet.",
                                    NotificationType.Warning
                                );
                
                                Set(varAppView, "Home");
                                Set(varPageKey, "HOME");
                                Set(varPageTitle, "Home");
                                Set(varPageSubtitle, "Project command center");
                
                                Navigate(scr_Home, ScreenTransition.None),
                
                                Switch(
                                    _key,
                
                                    "skyline",
                                    Set(varAppView, "Skyline");
                                    Set(varPageKey, "SKYLINE");
                                    Set(varPageTitle, "Delivery Skyline");
                                    Set(varPageSubtitle, "Weekly subsystem delivery risk and workload forecast");
                                    Set(varSkylineLoaded, false);
                                    Set(varSkylineError, "");
                                    Clear(colSkylineRaw);
                                    Clear(colSkylineWeeks);
                                    Clear(colSkylineSelectedWeek);
                
                                    Navigate(scr_Skyline, ScreenTransition.None),
                
                                    
                                    "home",
                                        Set(varGlobalLoading, false);
                                        Set(varGlobalLoadingMsg, "");
                                        Set(varGlobalLoadingSubMsg, "");
                                        Set(varGlobalLoadingScope, "");
                                        Set(varGlobalLoadAction, "");
                                        Set(varGlobalLoadPending, false);
                
                                        Set(varPHR_IsLoading, false);
                                        Set(varOps_IsLoading, false);
                                        Set(varTasks_IsLoading, false);
                                        Set(varPunches_IsLoading, false);
                                        Set(varCfg_IsLoading, false);
                
                                        Set(varAppView, "Home");
                                        Set(varPageKey, "HOME");
                                        Set(varPageTitle, "Home");
                                        Set(varPageSubtitle, "Project command center");
                                        Set(varHomeViewMode, "DASHBOARD");
                
                                        Navigate(scr_Home, ScreenTransition.None),
                
                                    "overview",
                                        Set(varAppView, "Overview");
                                        Set(varPageKey, "OVERVIEW");
                                        Set(varPageTitle, "Overview");
                                        Set(varPageSubtitle, "Project Handover Report by subsystem, discipline and form family");
                                        Set(varOps_ViewMode, "OVERVIEW");
                
                                        Navigate(scr_Overview, ScreenTransition.None),
                
                
                
                                    "tasks",
                                        Set(varAppView, "Tasks");
                                        Set(varPageKey, "TASKS");
                                        Set(varPageTitle, "Tasks");
                                        Set(varPageSubtitle, "Inspection task management");
                
                                        Navigate(scr_Tasks, ScreenTransition.None),
                
                                    "punches",
                                        Set(varAppView, "Punches");
                                        Set(varPageKey, "PUNCHES");
                                        Set(varPageTitle, "Punch List");
                                        Set(varPageSubtitle, "Punch item management");
                
                                        Navigate(scr_Punches, ScreenTransition.None),
                
                                    "briefing",
                                        Set(varAppView, "Briefing");
                                        Set(varPageKey, "BRIEFING");
                                        Set(varPageTitle, "Briefing");
                                        Set(varPageSubtitle, "Project reporting and communication");
                
                                        Navigate(scr_Briefing, ScreenTransition.None),
                
                                    "config",
                                        Set(varAppView, "Config");
                                        Set(varPageKey, "CONFIG");
                                        Set(varPageTitle, "Configuration");
                                        Set(varPageSubtitle, "Report structure and scope management");
                
                                        Navigate(scr_Config_NEW, ScreenTransition.None),
                
                                    Notify("Key not mapped: [" & _key & "]", NotificationType.Error)
                                )
                            )
                        )
                    )
                )
            OnToggleCollapse: =
            ProjectCode: =Coalesce(Text(varSelectedProject.ProjectCode), "")
            ProjectName: =Coalesce(varSelectedProject.ProjectName, "")
            Visible: =true

        btnTasks_LoadPage_Tasks As modernButton:
            Align: =Align.Center
            BorderStyle: =""
            Font: =""
            FontWeight: =""
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            OnSelect: |-
                =
                
                
                // =====================================================
                // btnTasks_LoadPage_Tasks.OnSelect
                // Load Tasks safely using staging collection
                // Flow parameter order:
                // ProjectId, SubsystemCode, ElementDiscipline, Subcontractor,
                // TaskStatusId, PageNumber, PageSize, L3NodeId
                // =====================================================
                
                If(
                    IsBlank(varProjectId),
                
                    Notify("Please select a project first.", NotificationType.Warning);
                
                    Set(varTasks_IsLoading, false);
                    Set(varGlobalLoading, false);
                    Set(varGlobalLoadingMsg, "");
                    Set(varGlobalLoadingSubMsg, "");
                    Set(varGlobalLoadingScope, "");
                
                    Exit()
                );
                
                If(
                    varTasks_IsLoading,
                
                    Notify("Tasks are already loading.", NotificationType.Information);
                
                    Set(varGlobalLoading, false);
                    Set(varGlobalLoadingMsg, "");
                    Set(varGlobalLoadingSubMsg, "");
                    Set(varGlobalLoadingScope, "");
                
                    Exit()
                );
                
                Set(varTasks_IsLoading, true);
                Set(varTasks_Error, "");
                Set(varLoadingMsg, "Loading tasks...");
                
                Set(varGlobalLoading, true);
                Set(varGlobalLoadingMsg, "Loading Tasks...");
                Set(varGlobalLoadingSubMsg, "Preparing task list");
                Set(varGlobalLoadingScope, "TASKS");
                
                Clear(colTasks_Staging);
                
                IfError(
                    With(
                        {
                resp:
                    Warroom_Tasks_Filtered_Paged.Run(
                        Value(varProjectId),
                
                        If(
                            IsBlank(varFilter_TaskSubsystem),
                            " ",
                            Text(varFilter_TaskSubsystem)
                        ),
                
                        If(
                            IsBlank(varFilter_TaskDiscipline),
                            " ",
                            Text(varFilter_TaskDiscipline)
                        ),
                
                        If(
                            IsBlank(varFilter_TaskSubcontractor),
                            " ",
                            Text(varFilter_TaskSubcontractor)
                        ),
                
                        Value(Coalesce(varTasks_Page, 1)),
                
                        If(
                            IsBlank(varOps_ToTasks_L3NodeId),
                            " ",
                            Text(varOps_ToTasks_L3NodeId)
                        ),
                
                        If(
                            IsBlank(varFilter_TaskStatusId),
                            0,
                            Value(varFilter_TaskStatusId)
                        ),
                        If(
                            varTasks_ApplyReportScope,
                            1,
                            0
                )
                    )
                        },
                        With(
                            {
                                arr: Table(ParseJSON(Coalesce(resp.result, "[]")))
                            },
                            ClearCollect(
                                colTasks_Staging,
                                ForAll(
                                    arr,
                                    With(
                                        { r: ThisRecord.Value },
                                        {
                                            AreaCode: Text(r.AreaCode),
                                            UnitCode: Text(r.UnitCode),
                                            SystemCode: Text(r.SystemCode),
                                            SubsystemCode: Text(r.SubsystemCode),
                                            ElementCode: Text(r.ElementCode),
                                            ElementDiscipline: Text(r.ElementDiscipline),
                                            ElementLevel: Text(r.ElementLevel),
                                            TypeCode: Text(r.TypeCode),
                
                                            InspectionTaskId:
                                                If(
                                                    IsBlank(Text(r.InspectionTaskId)) || Text(r.InspectionTaskId) = "null",
                                                    0,
                                                    Value(Text(r.InspectionTaskId))
                                                ),
                
                                            TaskPhase: Text(r.TaskPhase),
                                            FormName: Text(r.FormName),
                                            FormDescription: Text(r.FormDescription),
                                            Sct: Text(r.Sct),
                
                                            TaskStatusId:
                                                If(
                                                    IsBlank(Text(r.TaskStatusId)) || Text(r.TaskStatusId) = "null",
                                                    Blank(),
                                                    Value(Text(r.TaskStatusId))
                                                ),
                
                                            TaskStatus: Text(r.TaskStatus),
                                            TaskActive: Boolean(r.TaskActive),
                
                                            ClosingDate:
                                                If(
                                                    IsBlank(Text(r.ClosingDate)) || Text(r.ClosingDate) = "null",
                                                    Blank(),
                                                    DateTimeValue(Text(r.ClosingDate))
                                                ),
                
                                            SubcontractCode: Text(r.SubcontractCode),
                                            SubcontractorName: Text(r.SubcontractorName),
                
                                            CustomJson: Coalesce(Text(r.CustomJson), "{}"),
                                            CustomFlag1: Boolean(r.CustomFlag1),
                                            CustomFlag2: Boolean(r.CustomFlag2),
                                            CustomText1: Text(r.CustomText1),
                                            CustomText2: Text(r.CustomText2),
                
                                            CustomDate1:
                                                If(
                                                    IsBlank(Text(r.CustomDate1)) || Text(r.CustomDate1) = "null",
                                                    Blank(),
                                                    DateValue(Text(r.CustomDate1))
                                                ),
                
                                            CustomNumber1:
                                                If(
                                                    IsBlank(Text(r.CustomNumber1)) || Text(r.CustomNumber1) = "null",
                                                    Blank(),
                                                    Value(Text(r.CustomNumber1))
                                                ),
                
                                            CustomLastUpdatedByEmail: Text(r.CustomLastUpdatedByEmail),
                
                                            CustomLastUpdatedOn:
                                                If(
                                                    IsBlank(Text(r.CustomLastUpdatedOn)) || Text(r.CustomLastUpdatedOn) = "null",
                                                    Blank(),
                                                    DateTimeValue(Text(r.CustomLastUpdatedOn))
                                                ),
                
                                            LastCommentOn:
                                                If(
                                                    IsBlank(Text(r.LastCommentOn)) || Text(r.LastCommentOn) = "null",
                                                    Blank(),
                                                    DateTimeValue(Text(r.LastCommentOn))
                                                ),
                
                                            LastCommentText: Text(r.LastCommentText),
                                            LastCommentByEmail: Text(r.LastCommentByEmail),
                
                                            CommentCount:
                                                If(
                                                    IsBlank(Text(r.CommentCount)) || Text(r.CommentCount) = "null",
                                                    0,
                                                    Value(Text(r.CommentCount))
                                                ),
                
                                            TotalRows:
                                                If(
                                                    IsBlank(Text(r.TotalRows)) || Text(r.TotalRows) = "null",
                                                    0,
                                                    Value(Text(r.TotalRows))
                                                ),
                
                                            TotalPages:
                                                If(
                                                    IsBlank(Text(r.TotalPages)) || Text(r.TotalPages) = "null",
                                                    0,
                                                    Value(Text(r.TotalPages))
                                                ),
                
                                            PageNumber:
                                                If(
                                                    IsBlank(Text(r.PageNumber)) || Text(r.PageNumber) = "null",
                                                    varTasks_Page,
                                                    Value(Text(r.PageNumber))
                                                ),
                
                                            PageSize:
                                                If(
                                                    IsBlank(Text(r.PageSize)) || Text(r.PageSize) = "null",
                                                    varTasks_PageSize,
                                                    Value(Text(r.PageSize))
                                                )
                                        }
                                    )
                                )
                            )
                        )
                    ),
                
                    Set(varTasks_Error, FirstError.Message)
                );
                
                If(
                    IsBlank(varTasks_Error),
                
                    ClearCollect(colTasks, colTasks_Staging);
                
                    Set(
                        varTasks_TotalPages,
                        If(
                            CountRows(colTasks) = 0,
                            0,
                            Coalesce(First(colTasks).TotalPages, 0)
                        )
                    );
                
                    Set(
                        varTasks_TotalRows,
                        If(
                            CountRows(colTasks) = 0,
                            0,
                            Coalesce(First(colTasks).TotalRows, 0)
                        )
                    );
                
                    Set(varTasksLoaded, true);
                    Set(varTasks_LastRefresh, Now()),
                
                    Notify(
                        "Error loading tasks: " & varTasks_Error,
                        NotificationType.Error
                    )
                );
                
                Set(varTasks_IsLoading, false);
                Set(varLoadingMsg, "");
                
                Set(varGlobalLoading, false);
                Set(varGlobalLoadingMsg, "");
                Set(varGlobalLoadingSubMsg, "");
                Set(varGlobalLoadingScope, "");
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =0
