            Height: =32
            Icon: =""
            IconRotation: =0
            IconStyle: ="Outline"
            Layout: ="Icon before"
            OnSelect: |-
                =
                // =====================================================
                // btnDrawerLoad_Custom_1.OnSelect
                // Load Task custom fields safely
                // =====================================================
                
                If(
                    IsBlank(varProjectId) || IsBlank(varDrawerRecordId) || IsBlank(varDrawerEntityType),
                
                    Notify("No task selected.", NotificationType.Warning);
                
                    Set(varCT_Loading, false);
                    Set(varDrawerIsLoading, false);
                
                    Exit()
                );
                
                Set(varCT_Loading, true);
                Set(varDrawerIsLoading, true);
                Set(varCT_Error, "");
                
                Clear(colCT_Merged_Base_Staging);
                Clear(colCT_Merged_UI_Staging);
                Clear(colCT_Quick_Staging);
                
                IfError(
                    With(
                        {
                            resp:
                                WarRoom_GetCustomBundle.Run(
                                    varProjectId,
                                    varDrawerEntityType,
                                    varDrawerRecordId
                                )
                        },
                        With(
                            {
                                parsed: ParseJSON(Coalesce(resp.bundlejson, "{}"))
                            },
                
                            ClearCollect(
                                colCT_Merged_Base_Staging,
                                ForAll(
                                    Table(parsed.defs),
                                    {
                                        FieldKey: Text(Value.FieldKey),
                                        Label: Text(Value.Label),
                                        FieldType: Text(Value.FieldType),
                                        IsRequired: Boolean(Value.IsRequired),
                                        IsPinned: Boolean(Value.IsPinned),
                                        SortOrder:
                                            If(
                                                IsBlank(Text(Value.SortOrder)) || Text(Value.SortOrder) = "null",
                                                0,
                                                Value(Text(Value.SortOrder))
                                            ),
                                        OptionsJson: Text(Value.OptionsJson)
                                    }
                                )
                            );
                
                            ClearCollect(
                                colCT_Merged_UI_Staging,
                                ForAll(
                                    Table(parsed.values),
                                    {
                                        FieldKey: Text(Value.FieldKey),
                                        ValueText: Text(Value.ValueText),
                
                                        ValueNumber:
                                            If(
                                                IsBlank(Text(Value.ValueNumber)) || Text(Value.ValueNumber) = "null",
                                                Blank(),
                                                Value(Text(Value.ValueNumber))
                                            ),
                
                                        ValueDate:
                                            If(
                                                IsBlank(Text(Value.ValueDate)) || Text(Value.ValueDate) = "null",
                                                Blank(),
                                                DateTimeValue(Text(Value.ValueDate))
                                            ),
                
                                        ValueBool: Boolean(Value.ValueBool)
                                    }
                                )
                            );
                
                            ClearCollect(
                                colCT_Quick_Staging,
                                AddColumns(
                                    colCT_Merged_Base_Staging,
                                    CurrentValue,
                                    LookUp(
                                        colCT_Merged_UI_Staging,
                                        FieldKey = ThisRecord.FieldKey
                                    )
                                )
                            )
                        )
                    ),
                
                    Set(varCT_Error, FirstError.Message)
                );
                
                If(
                    IsBlank(varCT_Error),
                
                    ClearCollect(colCT_Merged_Base, colCT_Merged_Base_Staging);
                    ClearCollect(colCT_Merged_UI, colCT_Merged_UI_Staging);
                    ClearCollect(colCT_Quick, colCT_Quick_Staging),
                
                    Notify(
                        "Custom fields could not be loaded.",
                        NotificationType.Warning
                    )
                );
                
                Set(varCT_Loading, false);
                Set(varDrawerIsLoading, false);
