    btnHome_LoadPunchDashboard As modernButton:
        BorderStyle: =""
        Font: =""
        OnSelect: |-
            =
            If(
                IsBlank(varProjectId),
            
                Notify("Please select a project first.", NotificationType.Warning);
                Set(varPunchDashboardLoading, false);
                Set(varGlobalLoading, false);
                Set(varGlobalLoadingMsg, "");
                Set(varGlobalLoadingSubMsg, "");
                Set(varGlobalLoadingScope, "");
                Set(varGlobalLoadAction, "");
                Set(varGlobalLoadPending, false);
                Exit()
            );
            
            If(varPunchDashboardLoading, Exit());
            
            Set(varPunchDashboardLoading, true);
            Set(varPunchDashboardError, "");
            Set(varPunchDashboardHasSnapshot, false);
            
            Clear(colPunchDashboardSnapshotInfo);
            Clear(colPunchDashboardSummary);
            Clear(colPunchDashboardMatrix);
            Clear(colPunchDashboardTimeline);
            Clear(colPunchDashboardInsights);
            Clear(colPunchDashboardSubsystems);
            Clear(colPunchDashboardSubcontractors);
            
            // Load project punch templates only when the local catalog is empty.
            If(
                CountRows(colPunchTemplates_Filter) = 0,
            
                IfError(
                    With(
                        {
                            _templatesResp: Warroom_GetProjectPunchTemplates.Run(Value(varProjectId))
                        },
                        ClearCollect(
                            colPunchTemplates_Filter,
                            SortByColumns(
                                Filter(
                                    ForAll(
                                        Table(ParseJSON(Coalesce(_templatesResp.result, "[]"))),
                                        {
                                            ProjectId: Value(Text(Value.ProjectId)),
                                            TemplateId: Value(Text(Value.TemplateId)),
                                            TemplateCode: Text(Value.TemplateCode),
                                            TemplateName: Text(Value.TemplateName),
                                            TemplateDisplayName: Coalesce(
                                                Text(Value.TemplateDisplayName),
                                                Text(Value.TemplateName),
                                                Text(Value.TemplateCode)
                                            ),
                                            IsIncluded:
                                                Lower(Text(Value.IsIncluded)) = "true" ||
                                                Text(Value.IsIncluded) = "1",
                                            DisplayOrder:
                                                If(
                                                    IsBlank(Text(Value.DisplayOrder)) || Text(Value.DisplayOrder) = "null",
                                                    9999,
                                                    Value(Text(Value.DisplayOrder))
                                                )
                                        }
                                    ),
                                    IsIncluded
                                ),
                                "DisplayOrder",
                                SortOrder.Ascending
                            )
                        );
                        true
                    ),
                    Set(varPunchDashboardError, FirstError.Message);
                    false
                )
            );
            
            If(
                IsBlank(varPunchDashboardTemplateId) && CountRows(colPunchTemplates_Filter) > 0,
                Set(varPunchDashboardTemplateId, Value(First(colPunchTemplates_Filter).TemplateId))
            );
            
            If(
                IsBlank(varPunchDashboardError) && !IsBlank(varPunchDashboardTemplateId),
            
                IfError(
                    With(
                        {
                            _resp:
                                warroom_GetPunchDashboardBundle.Run(
                                    Value(varProjectId),
                                    Value(varPunchDashboardTemplateId)
                                )
                        },
                        With(
                            {
                                _bundle: ParseJSON(Coalesce(_resp.result, "{}"))
                            },
            
                            Set(
                                varPunchDashboardHasSnapshot,
                                Lower(Text(_bundle.hasSnapshot)) = "true" ||
                                Text(_bundle.hasSnapshot) = "1"
                            );
            
                            Set(varPunchDashboardMessage, Coalesce(Text(_bundle.message), ""));
            
                            ClearCollect(
                                colPunchDashboardSnapshotInfo,
                                ForAll(
                                    Table(_bundle.snapshotInfo),
                                    {
                                        SnapshotRunId: Value(Text(Value.SnapshotRunId)),
                                        GeneratedOn:
                                            If(
                                                IsBlank(Text(Value.GeneratedOn)) || Text(Value.GeneratedOn) = "null",
                                                Blank(),
                                                DateTimeValue(Text(Value.GeneratedOn))
                                            ),
                                        SourcePunchCount: Value(Coalesce(Text(Value.SourcePunchCount), "0")),
                                        DurationMs: Value(Coalesce(Text(Value.DurationMs), "0"))
                                    }
                                )
                            );
            
                            ClearCollect(
                                colPunchDashboardSummary,
                                ForAll(
                                    Table(_bundle.summary),
                                    {
                                        StatusCode: Text(Value.StatusCode),
                                        StatusName: Text(Value.StatusName),
                                        StatusOrder: Value(Coalesce(Text(Value.StatusOrder), "0")),
                                        StatusColor: Coalesce(Text(Value.StatusColor), "#64748B"),
                                        PunchCount: Value(Coalesce(Text(Value.PunchCount), "0")),
                                        PreviousPunchCount: Value(Coalesce(Text(Value.PreviousPunchCount), Text(Value.PunchCount), "0")),
                                        Delta: Value(Coalesce(Text(Value.Delta), "0")),
                                        DeltaPercent: Value(Coalesce(Text(Value.DeltaPercent), "0")),
                                        Trend: Coalesce(Text(Value.Trend), "Neutral")
                                    }
                                )
                            );
            
                            ClearCollect(
                                colPunchDashboardMatrix,
                                ForAll(
                                    Table(_bundle.matrix),
                                    {
                                        CategoryCode: Text(Value.CategoryCode),
                                        CategoryName: Text(Value.CategoryName),
                                        CategoryOrder: Value(Coalesce(Text(Value.CategoryOrder), "0")),
                                        StatusCode: Text(Value.StatusCode),
                                        StatusName: Text(Value.StatusName),
                                        StatusOrder: Value(Coalesce(Text(Value.StatusOrder), "0")),
                                        StatusColor: Coalesce(Text(Value.StatusColor), "#64748B"),
                                        PunchCount: Value(Coalesce(Text(Value.PunchCount), "0")),
                                        Intensity: Value(Coalesce(Text(Value.Intensity), "0")),
                                        IntensityBand: Coalesce(Text(Value.IntensityBand), "NONE")
                                    }
                                )
                            );
            
                            ClearCollect(
                                colPunchDashboardTimeline,
                                ForAll(
                                    Table(_bundle.timeline),
                                    {
                                        SnapshotRunId: Value(Coalesce(Text(Value.SnapshotRunId), "0")),
                                        SnapshotDate:
                                            If(
                                                IsBlank(Text(Value.SnapshotDate)) || Text(Value.SnapshotDate) = "null",
                                                Blank(),
                                                DateTimeValue(Text(Value.SnapshotDate))
                                            ),
                                        SnapshotSequence: Value(Coalesce(Text(Value.SnapshotSequence), "0")),
                                        OpenCount: Value(Coalesce(Text(Value.Open), "0")),
                                        ClearedCount: Value(Coalesce(Text(Value.Cleared), "0")),
                                        ClosedCount: Value(Coalesce(Text(Value.Closed), "0")),
                                        TotalCount: Value(Coalesce(Text(Value.Total), "0")),
                                        OpenDelta: Value(Coalesce(Text(Value.OpenDelta), "0")),
                                        OpenDeltaPercent: Value(Coalesce(Text(Value.OpenDeltaPercent), "0"))
                                    }
                                )
                            );
            
                            ClearCollect(
                                colPunchDashboardInsights,
                                ForAll(
                                    Table(_bundle.insights),
                                    {
                                        InsightId: Value(Coalesce(Text(Value.InsightId), "0")),
                                        Priority: Value(Coalesce(Text(Value.Priority), "99")),
                                        Severity: Coalesce(Text(Value.Severity), "INFO"),
                                        InsightType: Coalesce(Text(Value.InsightType), "GENERAL"),
                                        Title: Coalesce(Text(Value.Title), "Executive insight"),
                                        Message: Coalesce(Text(Value.Message), ""),
                                        MetricValue: Value(Coalesce(Text(Value.MetricValue), "0")),
                                        MetricLabel: Coalesce(Text(Value.MetricLabel), ""),
                                        StatusCode: Coalesce(Text(Value.StatusCode), ""),
                                        CategoryCode: Coalesce(Text(Value.CategoryCode), ""),
                                        SubsystemCode: Coalesce(Text(Value.SubsystemCode), ""),
                                        SubcontractorId: Value(Coalesce(Text(Value.SubcontractorId), "-1")),
                                        DisciplineCode: Coalesce(Text(Value.DisciplineCode), "")
                                    }
                                )
                            );
            
                            ClearCollect(
                                colPunchDashboardSubsystems,
                                ForAll(
                                    Table(_bundle.subsystems),
                                    {
                                        SubsystemCode: Text(Value.SubsystemCode),
                                        SubsystemName: Text(Value.SubsystemName),
                                        CategoryCode: Text(Value.CategoryCode),
                                        CategoryName: Text(Value.CategoryName),
                                        StatusCode: Text(Value.StatusCode),
                                        StatusName: Text(Value.StatusName),
                                        StatusOrder: Value(Coalesce(Text(Value.StatusOrder), "0")),
                                        StatusColor: Coalesce(Text(Value.StatusColor), "#64748B"),
                                        PunchCount: Value(Coalesce(Text(Value.PunchCount), "0"))
                                    }
                                )
                            );
            
                            ClearCollect(
                                colPunchDashboardSubcontractors,
                                ForAll(
                                    Table(_bundle.subcontractors),
                                    {
                                        SubcontractorId: Value(Coalesce(Text(Value.SubcontractorId), "-1")),
                                        SubcontractorName: Text(Value.SubcontractorName),
                                        DisciplineCode: Text(Value.DisciplineCode),
                                        DisciplineName: Text(Value.DisciplineName),
                                        CategoryCode: Text(Value.CategoryCode),
                                        CategoryName: Text(Value.CategoryName),
                                        StatusCode: Text(Value.StatusCode),
                                        StatusName: Text(Value.StatusName),
                                        StatusOrder: Value(Coalesce(Text(Value.StatusOrder), "0")),
                                        StatusColor: Coalesce(Text(Value.StatusColor), "#64748B"),
                                        PunchCount: Value(Coalesce(Text(Value.PunchCount), "0"))
                                    }
                                )
                            )
                        );
                        true
                    ),
                    Set(varPunchDashboardError, FirstError.Message);
                    false
                )
            );
            
            Set(
                varPunchDashboardSnapshotId,
                If(CountRows(colPunchDashboardSnapshotInfo) > 0, First(colPunchDashboardSnapshotInfo).SnapshotRunId, Blank())
            );
            Set(
                varPunchDashboardLastRefresh,
                If(CountRows(colPunchDashboardSnapshotInfo) > 0, First(colPunchDashboardSnapshotInfo).GeneratedOn, Blank())
            );
            Set(varPunchDashboardLoaded, IsBlank(varPunchDashboardError));
            Set(varPunchDashboardLoading, false);
            Set(varExecutiveDashboardCompletedAt, Now());
            Set(
                varExecutiveDashboardStatus,
                If(IsBlank(varPunchDashboardError), "READY", "ERROR")
            );
            Set(varExecutiveDashboardError, Coalesce(varPunchDashboardError, ""));
            
            If(
                !IsBlank(varPunchDashboardError),
                Notify("Punch Dashboard could not be loaded: " & varPunchDashboardError, NotificationType.Error)
            );
            
            Set(varGlobalLoading, false);
            Set(varGlobalLoadingMsg, "");
            Set(varGlobalLoadingSubMsg, "");
            Set(varGlobalLoadingScope, "");
            Set(varGlobalLoadAction, "");
            Set(varGlobalLoadPending, false);
            
            Set(varPunchDashboardLoading, false);
            Set(varProjectSwitching, false);
        Size: =0
        Text: ="Button"
        Visible: =false
        X: =180
        Y: =180
        ZIndex: =5

    btnHome_OpenNodeOperations_1 As modernButton:
        BorderStyle: =""
        Font: =""
        OnSelect: |-
