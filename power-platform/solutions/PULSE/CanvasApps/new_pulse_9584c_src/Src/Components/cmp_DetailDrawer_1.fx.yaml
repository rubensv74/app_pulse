cmp_DetailDrawer_1 As CanvasComponent:
    OnClose():
        ThisProperty:
            Default: =
    OnPrimary():
        ThisProperty:
            Default: =
    OnTabChanged():
        ThisProperty:
            Default: =
    AccentColor: |-
        =ColorValue("#1677FF")
    ActiveTab: ="Overview"
    BackgroundColor: |-
        =ColorValue("#FFFFFF")
    BorderColor: |-
        =ColorValue("#E2E8F0")
    ChildTabPriority: =true
    ContentLanguage: =""
    EnableChildFocus: =true
    Fill: =RGBA(0, 0, 0, 0)
    Height: =720
    IsOpen: =true
    MutedTextColor: |-
        =ColorValue("#64748B")
    PrimaryButtonText: ="Save"
    SecondaryButtonText: ="Close"
    ShowFooter: =true
    Subtitle: =""
    SurfaceAltColor: |-
        =ColorValue("#F8FAFC")
    TextColor: |-
        =ColorValue("#0F172A")
    Title: ="Details"
    Visible: =true
    Width: =520
    X: =0
    Y: =0

    conRoot As groupContainer.manualLayoutContainer:
        BorderColor: =cmp_DetailDrawer_1.BorderColor
        BorderThickness: =1
        DropShadow: =DropShadow.Semibold
        Fill: =cmp_DetailDrawer_1.BackgroundColor
        Height: =Parent.Height
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        RadiusBottomLeft: =16
        RadiusBottomRight: =4
        RadiusTopLeft: =16
        RadiusTopRight: =4
        Visible: =cmp_DetailDrawer_1.IsOpen
        Width: =Parent.Width
        ZIndex: =1

        lblTitle_1 As modernText:
            BorderStyle: =""
            Color: =cmp_DetailDrawer_1.TextColor
            Font: =""
            FontWeight: =FontWeight.Semibold
            Size: =16
            Text: =cmp_DetailDrawer_1.Title
            Width: =360
            X: =20
            Y: =20
            ZIndex: =1

        lblSubtitle As modernText:
            BorderStyle: =""
            Color: =cmp_DetailDrawer_1.MutedTextColor
            Font: =""
            Size: =10
            Text: =cmp_DetailDrawer_1.Subtitle
            Visible: =!IsBlank(cmp_DetailDrawer_1.Subtitle)
            Width: =360
            X: =20
            Y: =48
            ZIndex: =2

        icoClose_1 As icon:
            BorderColor: =App.Theme.Colors.Darker40
            Color: =cmp_DetailDrawer_1.MutedTextColor
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(244, 244, 244, 1)
            Height: =16
            Icon: =Icon.Cancel
            OnSelect: =cmp_DetailDrawer.OnClose()
            Width: =16
            X: =Parent.Width-36
            Y: =20
            ZIndex: =3

        "galTabs As gallery.'BrowseLayout_Horizontal_TwoTextOneImageVariant_ver5.0'":
            '#CopilotOverlayLabel': ="Filtered"
            BorderColor: =App.Theme.Colors.Darker40
            DelayItemLoading: =true
            Height: =42
            Items: |-
                =Table({T:"Overview"},{T:"Comments"},{T:"Fields"},{T:"History"})
            LoadingSpinner: =LoadingSpinner.Data
            TemplatePadding: =0
            TemplateSize: =110
            Width: =Parent.Width-40
            X: =20
            Y: =84
            ZIndex: =4

            btnTab As button:
                BorderColor: =RGBA(0,0,0,0)
                BorderThickness: =0
                Color: =If(ThisItem.T=cmp_DetailDrawer_1.ActiveTab,cmp_DetailDrawer_1.AccentColor,cmp_DetailDrawer_1.TextColor)
                DisabledBorderColor: =RGBA(244, 244, 244, 1)
                DisabledColor: =RGBA(166, 166, 166, 1)
                DisabledFill: =RGBA(244, 244, 244, 1)
                Fill: =If(ThisItem.T=cmp_DetailDrawer_1.ActiveTab,cmp_DetailDrawer_1.SurfaceAltColor,Color.Transparent)
                Font: =App.Theme.Font
                FontWeight: =FontWeight.Semibold
                Height: =34
                HoverBorderColor: =App.Theme.Colors.Darker10
                HoverColor: =App.Theme.Colors.PrimaryForeground
                HoverFill: =App.Theme.Colors.Darker10
                OnSelect: =cmp_DetailDrawer.OnTabChanged()
                PressedBorderColor: =App.Theme.Colors.Darker40
                PressedColor: =Self.Color
                PressedFill: =App.Theme.Colors.Darker40
                Size: =15
                Text: =ThisItem.T
                Width: =100
                ZIndex: =1

        conContent As groupContainer.manualLayoutContainer:
            BorderColor: =cmp_DetailDrawer_1.BorderColor
            BorderThickness: =1
            DropShadow: =DropShadow.Light
            Fill: =cmp_DetailDrawer_1.BackgroundColor
            Height: =Parent.Height-216
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Width: =Parent.Width-40
            X: =20
            Y: =136
            ZIndex: =5

        btnPrimary As button:
            BorderColor: =App.Theme.Colors.Primary
            Color: =Color.White
            DisabledBorderColor: =RGBA(244, 244, 244, 1)
            DisabledColor: =RGBA(166, 166, 166, 1)
            DisabledFill: =RGBA(244, 244, 244, 1)
            Fill: =cmp_DetailDrawer_1.AccentColor
            Font: =App.Theme.Font
            FontWeight: =FontWeight.Semibold
            Height: =36
            HoverBorderColor: =App.Theme.Colors.Darker10
            HoverColor: =App.Theme.Colors.PrimaryForeground
            HoverFill: =App.Theme.Colors.Darker10
            OnSelect: =cmp_DetailDrawer.OnPrimary()
            PressedBorderColor: =App.Theme.Colors.Darker40
            PressedColor: =Self.Color
            PressedFill: =App.Theme.Colors.Darker40
            Size: =15
            Text: =cmp_DetailDrawer_1.PrimaryButtonText
            Visible: =cmp_DetailDrawer_1.ShowFooter
            Width: =120
            X: =Parent.Width-260
            Y: =Parent.Height-52
            ZIndex: =6

        btnSecondary As button:
            BorderColor: =cmp_DetailDrawer_1.BorderColor
            BorderThickness: =1
            Color: =cmp_DetailDrawer_1.TextColor
            DisabledBorderColor: =RGBA(244, 244, 244, 1)
            DisabledColor: =RGBA(166, 166, 166, 1)
            DisabledFill: =RGBA(244, 244, 244, 1)
            Fill: =cmp_DetailDrawer_1.BackgroundColor
            Font: =App.Theme.Font
            FontWeight: =FontWeight.Semibold
            Height: =36
            HoverBorderColor: =App.Theme.Colors.Darker10
            HoverColor: =App.Theme.Colors.PrimaryForeground
            HoverFill: =App.Theme.Colors.Darker10
            OnSelect: =cmp_DetailDrawer.OnClose()
            PressedBorderColor: =App.Theme.Colors.Darker40
            PressedColor: =Self.Color
            PressedFill: =App.Theme.Colors.Darker40
            Size: =15
            Text: =cmp_DetailDrawer_1.SecondaryButtonText
            Visible: =cmp_DetailDrawer_1.ShowFooter
            Width: =120
            X: =Parent.Width-130
            Y: =Parent.Height-52
            ZIndex: =7

