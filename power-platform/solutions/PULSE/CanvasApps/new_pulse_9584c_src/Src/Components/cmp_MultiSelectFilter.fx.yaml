cmp_MultiSelectFilter As CanvasComponent:
    OnApply():
        ThisProperty:
            Default: =
    OnClose():
        ThisProperty:
            Default: =
    AccentColor: |-
        =ColorValue("#1677FF")
    AllText: ="All"
    ApplyText: ="Apply"
    BackgroundColor: |-
        =ColorValue("#FFFFFF")
    BorderColor: |-
        =ColorValue("#E2E8F0")
    ChildTabPriority: =true
    ClearText: ="Clear"
    ContentLanguage: =""
    EnableChildFocus: =true
    EnablePaste: =true
    Fill: =RGBA(0, 0, 0, 0)
    HasInvalidCodes: =CountRows(varMSF_Invalid) > 0
    HasSelection: =CountRows(varMSF_Selected) > 0
    Height: =456
    InvalidCodes: =varMSF_Invalid
    Items: |-
        =Table(
            {
                Id: "",
                Code: "",
                Display: "",
                SortOrder: 0
            }
        )
    MutedTextColor: |-
        =ColorValue("#64748B")
    NotFoundText: ="not found"
    OnReset: |-
        =
        Set(varMSF_Search, "");
        
        ClearCollect(
            varMSF_Selected,
            FirstN(
                Table(
                    {
                        Id: "",
                        Code: "",
                        Display: "",
                        SortOrder: 0
                    }
                ),
                0
            )
        );
        
        ClearCollect(
            varMSF_Invalid,
            FirstN(
                Table({ Code: "" }),
                0
            )
        )
    PastePlaceholder: ="Paste values, one per line"
    SearchPlaceholder: ="Search..."
    SelectedCodesCRLF: =Concat(varMSF_Selected, Code, Char(10))
    SelectedCodesCSV: =Concat(varMSF_Selected, Code, ",")
    SelectedCount: =CountRows(varMSF_Selected)
    SelectedDisplayCSV: =Concat(varMSF_Selected, Display, ", ")
    SelectedItems: =varMSF_Selected
    SelectedText: ="selected"
    TextColor: |-
        =ColorValue("#0F172A")
    Title: ="Filter"
    Visible: =true
    Width: =360
    X: =0
    Y: =0

    conMSF_Header As groupContainer.manualLayoutContainer:
        BorderColor: =cmp_MultiSelectFilter.BorderColor
        BorderThickness: =1
        Fill: =cmp_MultiSelectFilter.BackgroundColor
        Height: =64
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        PaddingLeft: =12
        PaddingRight: =12
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        RadiusTopLeft: =4
        RadiusTopRight: =4
        Width: =Parent.Width - 16
        X: =8
        Y: =8
        ZIndex: =1

        btnMSF_HeaderClick As button:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Color: =Color.White
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =Color.Transparent
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =48
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =Color.White
            HoverFill: =RGBA(0,0,0,0.03)
            OnSelect: =cmp_MultiSelectFilter.OnClose()
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =Color.White
            PressedFill: =RGBA(0,0,0,0.06)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =15
            Text: =""
            Width: =Parent.Width - 48
            Y: =8
            ZIndex: =1

        lblMSF_Title As modernText:
            AutoHeight: =true
            BorderStyle: =""
            Color: =cmp_MultiSelectFilter.MutedTextColor
            Font: =""
            Height: =16
            Size: =10
            Text: =cmp_MultiSelectFilter.Title
            Width: =Parent.Width - 56
            X: =16
            Y: =10
            ZIndex: =2

        lblMSF_Summary As modernText:
            AutoHeight: =true
            BorderStyle: =""
            Color: =cmp_MultiSelectFilter.TextColor
            Font: =""
            FontWeight: =FontWeight.Semibold
            Height: =18
            Size: =11
            Text: |-
                =If(
                    CountRows(varMSF_Selected) = 0,
                    cmp_MultiSelectFilter.AllText,
                    CountRows(varMSF_Selected) & " " & cmp_MultiSelectFilter.SelectedText
                )
            Width: =Parent.Width - 56
            X: =16
            Y: =30
            ZIndex: =3

        icoMSF_Close As icon:
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =cmp_MultiSelectFilter.MutedTextColor
            DisabledBorderColor: =RGBA(245, 245, 245, 1)
            DisabledColor: =RGBA(225, 223, 221, 1)
            DisabledFill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =4
            Height: =20
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =cmp_MultiSelectFilter.AccentColor
            HoverFill: =RGBA(0, 0, 0, 0)
            Icon: =Icon.Cancel
            OnSelect: =cmp_MultiSelectFilter.OnClose()
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =cmp_MultiSelectFilter.AccentColor
            PressedFill: =RGBA(0, 0, 0, 0)
            Width: =20
            X: =Parent.Width - 38
            Y: =20
            ZIndex: =4

        rectMSF_HeaderSeparator As rectangle:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            DisabledFill: =RGBA(161, 159, 157, 1)
            Fill: =cmp_MultiSelectFilter.BorderColor
            FocusedBorderThickness: =4
            Height: =1
            HoverFill: =cmp_MultiSelectFilter.BorderColor
            PressedFill: =cmp_MultiSelectFilter.BorderColor
            Width: =Parent.Width
            Y: =Parent.Height - 1
            ZIndex: =5

    conMSF_Panel As groupContainer.manualLayoutContainer:
        BorderColor: =cmp_MultiSelectFilter.BorderColor
        BorderThickness: =1
        DropShadow: =DropShadow.Semibold
        Fill: =cmp_MultiSelectFilter.BackgroundColor
        Height: =Parent.Height - 80
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        PaddingLeft: =2
        PaddingRight: =2
        RadiusBottomLeft: =12
        RadiusBottomRight: =12
        Width: =Parent.Width - 16
        X: =8
        Y: =72
        ZIndex: =2

        txtMSF_Search As modernTextInput:
            Appearance: =Appearance.Outline
            BorderStyle: =""
            Default: =varMSF_Search
            Font: =""
            Height: =38
            OnChange: =Set(varMSF_Search, Self.Text)
            Placeholder: =cmp_MultiSelectFilter.SearchPlaceholder
            Required: =false
            TriggerOutput: =TriggerOutput.Keypress
            ValidationState: =ValidationState.None
            Width: =Parent.Width - 32
            X: =16
            Y: =16
            ZIndex: =1

        "galMSF_Items As gallery.'BrowseLayout_Vertical_OneTextVariant_ver5.0'":
            '#CopilotOverlayLabel': ="Filtered"
            BorderColor: =RGBA(245, 245, 245, 1)
            DelayItemLoading: =true
            Height: =If(cmp_MultiSelectFilter.EnablePaste, 170, Parent.Height - 154)
            Items: |-
                =
                SortByColumns(
                    Filter(
                        cmp_MultiSelectFilter.Items,
                        IsBlank(txtMSF_Search.Text) ||
                        StartsWith(Display, txtMSF_Search.Text) ||
                        StartsWith(Code, txtMSF_Search.Text)
                    ),
                    "SortOrder",
                    SortOrder.Ascending,
                    "Display",
                    SortOrder.Ascending
                )
            Layout: =Layout.Vertical
            LoadingSpinner: =LoadingSpinner.Data
            TemplatePadding: =0
            TemplateSize: =44
            Width: =Parent.Width - 32
            X: =16
            Y: =txtMSF_Search.Y + txtMSF_Search.Height + 12
            ZIndex: =2

            chkMSF_Item As checkbox:
                BorderColor: =RGBA(0, 0, 0, 0)
                BorderStyle: =BorderStyle.None
                BorderThickness: =2
                CheckboxBorderColor: =cmp_MultiSelectFilter.MutedTextColor
                CheckmarkFill: =cmp_MultiSelectFilter.AccentColor
                Color: =cmp_MultiSelectFilter.TextColor
                Default: =ThisItem.Code in varMSF_Selected.Code
                DisabledBorderColor: =RGBA(0, 0, 0, 0)
                DisabledColor: =RGBA(161, 159, 157, 1)
                FocusedBorderThickness: =4
                Font: =Font.'Segoe UI'
                Height: =32
                HoverBorderColor: =RGBA(0, 0, 0, 0)
                HoverColor: =cmp_MultiSelectFilter.TextColor
                HoverFill: =RGBA(0, 0, 0, 0)
                OnCheck: |-
                    =
                    If(
                        IsBlank(
                            LookUp(
                                varMSF_Selected,
                                Code = ThisItem.Code
                            )
                        ),
                        Collect(
                            varMSF_Selected,
                            {
                                Id: ThisItem.Id,
                                Code: ThisItem.Code,
                                Display: ThisItem.Display,
                                SortOrder: ThisItem.SortOrder
                            }
                        )
                    )
                OnSelect: =Select(Parent)
                OnUncheck: |-
                    =
                    RemoveIf(
                        varMSF_Selected,
                        Code = ThisItem.Code
                    )
                PressedBorderColor: =RGBA(0, 0, 0, 0)
                PressedColor: =cmp_MultiSelectFilter.TextColor
                PressedFill: =RGBA(0, 0, 0, 0)
                Size: =13
                Text: =""
                Width: =36
                Y: =8
                ZIndex: =1

            lblMSF_Item As modernText:
                BorderStyle: =""
                Color: =cmp_MultiSelectFilter.TextColor
                Font: =""
                Height: =36
                OnSelect: =Select(Parent)
                Size: =11
                Text: =ThisItem.Display
                Width: =Parent.TemplateWidth - 44
                X: =40
                Y: =4
                ZIndex: =2

        txtMSF_Paste As text:
            BorderColor: =RGBA(245, 245, 245, 1)
            BorderThickness: =2
            Color: =cmp_MultiSelectFilter.TextColor
            Default: =""
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            FocusedBorderThickness: =4
            Font: =Font.'Segoe UI'
            Height: =64
            HintText: =cmp_MultiSelectFilter.PastePlaceholder
            HoverBorderColor: =cmp_MultiSelectFilter.AccentColor
            HoverColor: =cmp_MultiSelectFilter.TextColor
            HoverFill: =Color.White
            Mode: =TextMode.MultiLine
            PressedBorderColor: =cmp_MultiSelectFilter.AccentColor
            PressedColor: =cmp_MultiSelectFilter.TextColor
            PressedFill: =Color.White
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Visible: =cmp_MultiSelectFilter.EnablePaste
            Width: =Parent.Width - 32
            X: =16
            Y: =galMSF_Items.Y + galMSF_Items.Height + 12
            ZIndex: =3

        lblMSF_Validation As modernText:
            BorderStyle: =""
            Color: |-
                =If(
                    CountRows(varMSF_Invalid) > 0,
                    ColorValue("#EA580C"),
                    ColorValue("#16A34A")
                )
            Font: =""
            Height: =16
            Size: =9
            Text: |-
                =If(
                    CountRows(varMSF_Selected) = 0 && CountRows(varMSF_Invalid) = 0,
                    "",
                    CountRows(varMSF_Selected) & " " & cmp_MultiSelectFilter.SelectedText &
                    If(
                        CountRows(varMSF_Invalid) > 0,
                        " · " & CountRows(varMSF_Invalid) & " " & cmp_MultiSelectFilter.NotFoundText,
                        ""
                    )
                )
            Width: =Parent.Width - 32
            X: =16
            Y: =Parent.Height - 72
            ZIndex: =4

        btnMSF_Clear As button:
            BorderColor: =cmp_MultiSelectFilter.TextColor
            BorderThickness: =1
            Color: =cmp_MultiSelectFilter.TextColor
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =cmp_MultiSelectFilter.BackgroundColor
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =36
            HoverBorderColor: =cmp_MultiSelectFilter.TextColor
            HoverColor: =cmp_MultiSelectFilter.TextColor
            HoverFill: |-
                =ColorValue("#F8FAFC")
            OnSelect: |-
                =
                ClearCollect(
                    varMSF_Selected,
                    FirstN(
                        Table(
                            {
                                Id: "",
                                Code: "",
                                Display: "",
                                SortOrder: 0
                            }
                        ),
                        0
                    )
                );
                
                ClearCollect(
                    varMSF_Invalid,
                    FirstN(
                        Table({ Code: "" }),
                        0
                    )
                );
                
                Set(varMSF_Search, "");
                
                Reset(txtMSF_Search);
                Reset(txtMSF_Paste);
                Reset(galMSF_Items)
            PressedBorderColor: =cmp_MultiSelectFilter.TextColor
            PressedColor: =cmp_MultiSelectFilter.TextColor
            PressedFill: |-
                =ColorValue("#F1F5F9")
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =11
            Text: =cmp_MultiSelectFilter.ClearText
            Width: =(Parent.Width - 44) / 2
            X: =16
            Y: =Parent.Height - 48
            ZIndex: =5

        btnMSF_Apply As button:
            BorderColor: =cmp_MultiSelectFilter.AccentColor
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Color: =Color.White
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =cmp_MultiSelectFilter.AccentColor
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =36
            HoverBorderColor: =cmp_MultiSelectFilter.AccentColor
            HoverColor: =Color.White
            HoverFill: =cmp_MultiSelectFilter.AccentColor
            OnSelect: |-
                =
                If(
                    cmp_MultiSelectFilter.EnablePaste && !IsBlank(Trim(txtMSF_Paste.Text)),
                
                    With(
                        {
                            _rawCodes:
                                ForAll(
                                    Split(
                                        Substitute(
                                            Substitute(
                                                Substitute(txtMSF_Paste.Text, Char(13), ""),
                                                ";",
                                                Char(10)
                                            ),
                                            ",",
                                            Char(10)
                                        ),
                                        Char(10)
                                    ),
                                    { Code: Upper(Trim(Value)) }
                                )
                        },
                        With(
                            {
                                _cleanCodes:
                                    Distinct(
                                        Filter(_rawCodes, !IsBlank(Code)),
                                        Code
                                    )
                            },
                            ClearCollect(
                                varMSF_Selected,
                                Filter(
                                    cmp_MultiSelectFilter.Items,
                                    Code in _cleanCodes.Value
                                )
                            );
                
                            ClearCollect(
                                varMSF_Invalid,
                                RenameColumns(
                                    Filter(
                                        _cleanCodes,
                                        !(Value in cmp_MultiSelectFilter.Items.Code)
                                    ),
                                    Value,
                                    Code
                                )
                            );
                
                            Reset(txtMSF_Paste)
                        )
                    )
                );
                
                cmp_MultiSelectFilter.OnApply();
                cmp_MultiSelectFilter.OnClose()
            PressedBorderColor: =cmp_MultiSelectFilter.AccentColor
            PressedColor: =Color.White
            PressedFill: =cmp_MultiSelectFilter.AccentColor
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =11
            Text: =cmp_MultiSelectFilter.ApplyText
            Width: =(Parent.Width - 44) / 2
            X: =btnMSF_Clear.X + btnMSF_Clear.Width + 12
            Y: =Parent.Height - 48
            ZIndex: =6

