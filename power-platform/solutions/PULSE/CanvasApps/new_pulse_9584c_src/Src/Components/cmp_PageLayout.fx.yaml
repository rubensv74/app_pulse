cmp_PageLayout As CanvasComponent:
    OnCloseDrawer():
        ThisProperty:
            Default: =
    OnNavigate():
        ThisProperty:
            Default: =
    OnPrimaryAction():
        ThisProperty:
            Default: =
    OnSecondaryAction():
        ThisProperty:
            Default: =
    AccentColor: |-
        =ColorValue("#1677FF")
    ActiveModule: ="Home"
    AppName: ="PULSE"
    BorderColor: |-
        =ColorValue("#E2E8F0")
    ChildTabPriority: =true
    CommandBarHeight: =64
    CommandBarWidth: =cmp_PageLayout.Width - If(cmp_PageLayout.ShowSidebar, cmp_PageLayout.SidebarWidth, 0) - If(cmp_PageLayout.IsDrawerOpen, cmp_PageLayout.DrawerWidth, 0) - 32
    CommandBarX: =If(cmp_PageLayout.ShowSidebar, cmp_PageLayout.SidebarWidth, 0) + 16
    CommandBarY: =If(cmp_PageLayout.ShowHeader, cmp_PageLayout.HeaderHeight, 0) + 8
    ContentHeight: =cmp_PageLayout.Height - cmp_PageLayout.ContentY - If(cmp_PageLayout.ShowFooter, cmp_PageLayout.FooterHeight, 0) - 16
    ContentLanguage: =""
    ContentWidth: =cmp_PageLayout.Width - If(cmp_PageLayout.ShowSidebar, cmp_PageLayout.SidebarWidth, 0) - If(cmp_PageLayout.IsDrawerOpen, cmp_PageLayout.DrawerWidth, 0) - 32
    ContentX: =If(cmp_PageLayout.ShowSidebar, cmp_PageLayout.SidebarWidth, 0) + 16
    ContentY: =If(cmp_PageLayout.ShowHeader, cmp_PageLayout.HeaderHeight, 0) + If(cmp_PageLayout.ShowCommandBar, cmp_PageLayout.CommandBarHeight, 0) + 16
    DrawerHeight: =cmp_PageLayout.Height
    DrawerWidth: =520
    DrawerX: =cmp_PageLayout.Width - cmp_PageLayout.DrawerWidth
    DrawerY: =0
    EnableChildFocus: =true
    Fill: =RGBA(0, 0, 0, 0)
    FooterHeight: =36
    FooterText: =""
    HeaderHeight: =72
    Height: =768
    IsDrawerOpen: =false
    IsLoading: =false
    LoadingText: ="Loading..."
    MutedTextColor: |-
        =ColorValue("#64748B")
    NavBackgroundColor: |-
        =ColorValue("#07111F")
    NavItems: |-
        =Table(
            {Key:"Home", Label:"Home", IconKey:"home", SortOrder:1},
            {Key:"Overview", Label:"Overview", IconKey:"dashboard", SortOrder:2},
            {Key:"Tasks", Label:"Tasks", IconKey:"check", SortOrder:3},
            {Key:"Punches", Label:"Punches", IconKey:"warning", SortOrder:4},
            {Key:"Skyline", Label:"Skyline", IconKey:"timeline", SortOrder:5},
            {Key:"Config", Label:"Config", IconKey:"settings", SortOrder:6}
        )
    NavTextColor: |-
        =ColorValue("#E5E7EB")
    OnReset: =Set(varPL_SelectedNavKey, cmp_PageLayout.ActiveModule)
    PageBackgroundColor: |-
        =ColorValue("#F6F8FB")
    PageSubtitle: =""
    PageTitle: ="Page"
    PrimaryActionText: ="Refresh"
    ProjectText: ="No project selected"
    SecondaryActionText: ="Export"
    SelectedNavKey: =varPL_SelectedNavKey
    ShowCommandBar: =true
    ShowFooter: =false
    ShowHeader: =true
    ShowPrimaryAction: =true
    ShowSecondaryAction: =true
    ShowSidebar: =true
    SidebarWidth: =156
    SurfaceAltColor: |-
        =ColorValue("#F8FAFC")
    SurfaceColor: |-
        =ColorValue("#FFFFFF")
    TextColor: |-
        =ColorValue("#0F172A")
    UserText: =""
    Visible: =true
    Width: =1366
    X: =0
    Y: =0

    conPL_Root As groupContainer.manualLayoutContainer:
        BorderColor: =RGBA(0, 0, 0, 0)
        Fill: =cmp_PageLayout.PageBackgroundColor
        Height: =Parent.Height
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        RadiusTopLeft: =4
        RadiusTopRight: =4
        Width: =Parent.Width
        ZIndex: =1

        conPL_Sidebar As groupContainer.manualLayoutContainer:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =cmp_PageLayout.NavBackgroundColor
            Height: =Parent.Height
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Visible: =cmp_PageLayout.ShowSidebar
            Width: =cmp_PageLayout.SidebarWidth
            ZIndex: =1

            lblPL_AppName As modernText:
                AutoHeight: =true
                BorderStyle: =""
                Color: =Color.White
                Font: =""
                FontWeight: =FontWeight.Semibold
                Height: =28
                Size: =18
                Text: =cmp_PageLayout.AppName
                Width: =Parent.Width - 24
                X: =12
                Y: =18
                ZIndex: =1

            lblPL_AppSub As modernText:
                AutoHeight: =true
                BorderStyle: =""
                Color: |-
                    =ColorValue("#94A3B8")
                Font: =""
                Height: =16
                Size: =8
                Text: ="Component Framework"
                Width: =Parent.Width - 24
                X: =12
                Y: =48
                ZIndex: =2

            "galPL_Nav As gallery.'BrowseLayout_Vertical_OneTextVariant_ver5.0'":
                '#CopilotOverlayLabel': ="Filtered"
                BorderColor: =RGBA(245, 245, 245, 1)
                DelayItemLoading: =true
                Height: =Parent.Height - 96
                Items: =SortByColumns(cmp_PageLayout.NavItems, "SortOrder", SortOrder.Ascending)
                Layout: =Layout.Vertical
                LoadingSpinner: =LoadingSpinner.Data
                TemplatePadding: =0
                TemplateSize: =44
                Width: =Parent.Width - 16
                X: =8
                Y: =84
                ZIndex: =3

                btnPL_NavRow As button:
                    BorderColor: =RGBA(0, 0, 0, 0)
                    BorderStyle: =BorderStyle.None
                    BorderThickness: =0
                    Color: =Color.White
                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                    DisabledColor: =RGBA(161, 159, 157, 1)
                    DisabledFill: =RGBA(242, 242, 241, 0)
                    Fill: |-
                        =If(ThisItem.Key = cmp_PageLayout.ActiveModule, ColorValue("#111827"), Color.Transparent)
                    Font: =Font.'Segoe UI'
                    FontWeight: =FontWeight.Semibold
                    Height: =36
                    HoverBorderColor: =RGBA(0, 0, 0, 0)
                    HoverColor: =Color.White
                    HoverFill: |-
                        =ColorValue("#111827")
                    OnSelect: |-
                        =
                        Set(varPL_SelectedNavKey, ThisItem.Key);
                        cmp_PageLayout.OnNavigate()
                    PressedBorderColor: =RGBA(0, 0, 0, 0)
                    PressedColor: =Color.White
                    PressedFill: |-
                        =ColorValue("#1F2937")
                    RadiusBottomLeft: =8
                    RadiusBottomRight: =8
                    RadiusTopLeft: =8
                    RadiusTopRight: =8
                    Size: =15
                    Text: =""
                    Width: =Parent.TemplateWidth
                    Y: =4
                    ZIndex: =1

                icoPL_Nav As icon:
                    BorderColor: =RGBA(0, 0, 0, 0)
                    Color: |-
                        =If(ThisItem.Key = cmp_PageLayout.ActiveModule, cmp_PageLayout.AccentColor, ColorValue("#94A3B8"))
                    DisabledBorderColor: =RGBA(245, 245, 245, 1)
                    DisabledColor: =RGBA(225, 223, 221, 1)
                    DisabledFill: =RGBA(0, 0, 0, 0)
                    FocusedBorderThickness: =4
                    Height: =16
                    HoverBorderColor: =RGBA(0, 0, 0, 0)
                    HoverColor: =cmp_PageLayout.AccentColor
                    HoverFill: =RGBA(0, 0, 0, 0)
                    Icon: |-
                        =Switch(
                            Lower(ThisItem.IconKey),
                            "home", Icon.Home,
                            "dashboard", Icon.Trending,
                            "check", Icon.Check,
                            "warning", Icon.Warning,
                            "timeline", Icon.Clock,
                            "settings", Icon.Settings,
                            "table", Icon.DetailList,
                            Icon.Information
                        )
                    OnSelect: =Select(btnPL_NavRow)
                    PressedBorderColor: =RGBA(0, 0, 0, 0)
                    PressedColor: =cmp_PageLayout.AccentColor
                    PressedFill: =RGBA(0, 0, 0, 0)
                    Width: =16
                    X: =10
                    Y: =14
                    ZIndex: =2

                lblPL_Nav As label:
                    BorderColor: =RGBA(0, 0, 0, 0)
                    Color: =If(ThisItem.Key = cmp_PageLayout.ActiveModule, Color.White, cmp_PageLayout.NavTextColor)
                    DisabledColor: =RGBA(161, 159, 157, 1)
                    Fill: =Color.Transparent
                    Font: =Font.'Segoe UI'
                    FontWeight: =If(ThisItem.Key = cmp_PageLayout.ActiveModule, FontWeight.Semibold, FontWeight.Normal)
                    Height: =36
                    OnSelect: =Select(btnPL_NavRow)
                    PaddingBottom: =0
                    PaddingLeft: =0
                    PaddingRight: =0
                    PaddingTop: =0
                    Size: =10
                    Text: =ThisItem.Label
                    VerticalAlign: =VerticalAlign.Top
                    Width: =Parent.TemplateWidth - 42
                    X: =34
                    Y: =13
                    ZIndex: =3

        conPL_Header As groupContainer.manualLayoutContainer:
            BorderColor: =cmp_PageLayout.BorderColor
            Fill: =cmp_PageLayout.SurfaceColor
            Height: =cmp_PageLayout.HeaderHeight
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Visible: =cmp_PageLayout.ShowHeader
            Width: =Parent.Width - If(cmp_PageLayout.ShowSidebar, cmp_PageLayout.SidebarWidth, 0)
            X: =If(cmp_PageLayout.ShowSidebar, cmp_PageLayout.SidebarWidth, 0)
            ZIndex: =2

            lblPL_PageTitle As modernText:
                AutoHeight: =true
                BorderStyle: =""
                Color: =cmp_PageLayout.TextColor
                Font: =""
                FontWeight: =FontWeight.Semibold
                Height: =24
                Size: =16
                Text: =cmp_PageLayout.PageTitle
                Width: =Parent.Width - 420
                X: =18
                Y: =12
                ZIndex: =1

            lblPL_PageSubtitle As modernText:
                AutoHeight: =true
                BorderStyle: =""
                Color: =cmp_PageLayout.MutedTextColor
                Font: =""
                Height: =18
                Size: =10
                Text: =cmp_PageLayout.PageSubtitle
                Visible: =!IsBlank(cmp_PageLayout.PageSubtitle)
                Width: =Parent.Width - 420
                X: =18
                Y: =40
                ZIndex: =2

            conPL_ProjectPill As groupContainer.manualLayoutContainer:
                BorderColor: =cmp_PageLayout.BorderColor
                BorderThickness: =1
                Fill: =cmp_PageLayout.SurfaceAltColor
                Height: =34
                LayoutGridColumnMinWidth: =0
                LayoutGridColumns: =6
                LayoutGridRowMinHeight: =0
                LayoutGridRows: =6
                RadiusBottomLeft: =17
                RadiusBottomRight: =17
                RadiusTopLeft: =17
                RadiusTopRight: =17
                Width: =220
                X: =Parent.Width - 392
                Y: =19
                ZIndex: =3

                lblPL_Project As label:
                    Align: =Align.Center
                    BorderColor: =RGBA(0, 0, 0, 0)
                    Color: =cmp_PageLayout.TextColor
                    DisabledColor: =RGBA(161, 159, 157, 1)
                    Fill: =Color.Transparent
                    Font: =Font.'Segoe UI'
                    FontWeight: =FontWeight.Semibold
                    Height: =34
                    PaddingBottom: =0
                    PaddingLeft: =8
                    PaddingRight: =8
                    PaddingTop: =0
                    Size: =9
                    Text: =cmp_PageLayout.ProjectText
                    VerticalAlign: =VerticalAlign.Top
                    Width: =Parent.Width
                    Y: =9
                    ZIndex: =1

            lblPL_User As modernText:
                AutoHeight: =true
                BorderStyle: =""
                Color: =cmp_PageLayout.MutedTextColor
                Font: =""
                Height: =18
                Size: =9
                Text: =cmp_PageLayout.UserText
                X: =Parent.Width - 156
                Y: =27
                ZIndex: =4

            rectPL_HeaderLine As rectangle:
                BorderColor: =RGBA(0, 0, 0, 0)
                BorderStyle: =BorderStyle.None
                DisabledFill: =RGBA(161, 159, 157, 1)
                Fill: =cmp_PageLayout.BorderColor
                FocusedBorderThickness: =4
                Height: =1
                HoverFill: =cmp_PageLayout.BorderColor
                PressedFill: =cmp_PageLayout.BorderColor
                Width: =Parent.Width
                Y: =Parent.Height - 1
                ZIndex: =5

        conPL_CommandBar As groupContainer.manualLayoutContainer:
            BorderColor: =cmp_PageLayout.BorderColor
            BorderThickness: =1
            Fill: =cmp_PageLayout.SurfaceColor
            Height: =cmp_PageLayout.CommandBarHeight - 16
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Visible: =cmp_PageLayout.ShowCommandBar
            Width: =cmp_PageLayout.CommandBarWidth
            X: =cmp_PageLayout.CommandBarX
            Y: =cmp_PageLayout.CommandBarY
            ZIndex: =3

            lblPL_CommandHint As modernText:
                AutoHeight: =true
                BorderStyle: =""
                Color: =cmp_PageLayout.MutedTextColor
                Font: =""
                Height: =18
                Size: =9
                Text: ="Command bar host"
                Width: =220
                X: =16
                Y: =15
                ZIndex: =1

            btnPL_Secondary As button:
                BorderColor: =cmp_PageLayout.BorderColor
                BorderThickness: =1
                Color: =cmp_PageLayout.TextColor
                DisabledBorderColor: =RGBA(0, 0, 0, 0)
                DisabledColor: =RGBA(161, 159, 157, 1)
                DisabledFill: =RGBA(242, 242, 241, 0)
                Fill: =cmp_PageLayout.SurfaceColor
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =32
                HoverBorderColor: =cmp_PageLayout.BorderColor
                HoverColor: =cmp_PageLayout.TextColor
                HoverFill: =cmp_PageLayout.SurfaceAltColor
                OnSelect: =cmp_PageLayout.OnSecondaryAction()
                PressedBorderColor: =cmp_PageLayout.BorderColor
                PressedColor: =cmp_PageLayout.TextColor
                PressedFill: |-
                    =ColorValue("#F1F5F9")
                RadiusBottomLeft: =8
                RadiusBottomRight: =8
                RadiusTopLeft: =8
                RadiusTopRight: =8
                Size: =10
                Text: =cmp_PageLayout.SecondaryActionText
                Visible: =cmp_PageLayout.ShowSecondaryAction
                Width: =104
                X: =Parent.Width - 224
                Y: =8
                ZIndex: =2

            btnPL_Primary As button:
                BorderColor: =cmp_PageLayout.AccentColor
                BorderStyle: =BorderStyle.None
                BorderThickness: =0
                Color: =Color.White
                DisabledBorderColor: =RGBA(0, 0, 0, 0)
                DisabledColor: =RGBA(161, 159, 157, 1)
                DisabledFill: =RGBA(242, 242, 241, 0)
                Fill: =cmp_PageLayout.AccentColor
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =32
                HoverBorderColor: =cmp_PageLayout.AccentColor
                HoverColor: =Color.White
                HoverFill: =cmp_PageLayout.AccentColor
                OnSelect: =cmp_PageLayout.OnPrimaryAction()
                PressedBorderColor: =cmp_PageLayout.AccentColor
                PressedColor: =Color.White
                PressedFill: =cmp_PageLayout.AccentColor
                RadiusBottomLeft: =8
                RadiusBottomRight: =8
                RadiusTopLeft: =8
                RadiusTopRight: =8
                Size: =10
                Text: =cmp_PageLayout.PrimaryActionText
                Visible: =cmp_PageLayout.ShowPrimaryAction
                Width: =104
                X: =Parent.Width - 112
                Y: =8
                ZIndex: =3

        conPL_ContentHost As groupContainer.manualLayoutContainer:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =Color.Transparent
            Height: =cmp_PageLayout.ContentHeight
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Width: =cmp_PageLayout.ContentWidth
            X: =cmp_PageLayout.ContentX
            Y: =cmp_PageLayout.ContentY
            ZIndex: =4

        conPL_Drawer As groupContainer.manualLayoutContainer:
            BorderColor: =cmp_PageLayout.BorderColor
            BorderThickness: =1
            DropShadow: =DropShadow.Semibold
            Fill: =cmp_PageLayout.SurfaceColor
            Height: =cmp_PageLayout.DrawerHeight
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Visible: =cmp_PageLayout.IsDrawerOpen
            Width: =cmp_PageLayout.DrawerWidth
            X: =cmp_PageLayout.DrawerX
            Y: =cmp_PageLayout.DrawerY
            ZIndex: =5

            lblPL_DrawerHost As modernText:
                AutoHeight: =true
                BorderStyle: =""
                Color: =cmp_PageLayout.MutedTextColor
                Font: =""
                Height: =20
                Size: =10
                Text: ="Drawer host"
                Width: =Parent.Width - 60
                X: =20
                Y: =20
                ZIndex: =1

            icoPL_CloseDrawer As icon:
                BorderColor: =RGBA(0, 0, 0, 0)
                Color: =cmp_PageLayout.MutedTextColor
                DisabledBorderColor: =RGBA(245, 245, 245, 1)
                DisabledColor: =RGBA(225, 223, 221, 1)
                DisabledFill: =RGBA(0, 0, 0, 0)
                FocusedBorderThickness: =4
                Height: =18
                HoverBorderColor: =RGBA(0, 0, 0, 0)
                HoverColor: =cmp_PageLayout.AccentColor
                HoverFill: =RGBA(0, 0, 0, 0)
                Icon: =Icon.Cancel
                OnSelect: =cmp_PageLayout.OnCloseDrawer()
                PressedBorderColor: =RGBA(0, 0, 0, 0)
                PressedColor: =cmp_PageLayout.AccentColor
                PressedFill: =RGBA(0, 0, 0, 0)
                Width: =18
                X: =Parent.Width - 34
                Y: =20
                ZIndex: =2

        conPL_Footer As groupContainer.manualLayoutContainer:
            BorderColor: =cmp_PageLayout.BorderColor
            Fill: =cmp_PageLayout.SurfaceColor
            Height: =cmp_PageLayout.FooterHeight
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Visible: =cmp_PageLayout.ShowFooter
            Width: =Parent.Width - If(cmp_PageLayout.ShowSidebar, cmp_PageLayout.SidebarWidth, 0)
            X: =If(cmp_PageLayout.ShowSidebar, cmp_PageLayout.SidebarWidth, 0)
            Y: =Parent.Height - cmp_PageLayout.FooterHeight
            ZIndex: =6

            lblPL_Footer As modernText:
                AutoHeight: =true
                BorderStyle: =""
                Color: =cmp_PageLayout.MutedTextColor
                Font: =""
                Height: =16
                Size: =8
                Text: =cmp_PageLayout.FooterText
                Width: =Parent.Width - 32
                X: =16
                Y: =10
                ZIndex: =1

        conPL_LoadingOverlay As groupContainer.manualLayoutContainer:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(15, 23, 42, 0.22)
            Height: =Parent.Height
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Visible: =cmp_PageLayout.IsLoading
            Width: =Parent.Width
            ZIndex: =7

            conPL_LoadingCard As groupContainer.manualLayoutContainer:
                BorderColor: =cmp_PageLayout.BorderColor
                BorderThickness: =1
                DropShadow: =DropShadow.Semibold
                Fill: =cmp_PageLayout.SurfaceColor
                Height: =96
                LayoutGridColumnMinWidth: =0
                LayoutGridColumns: =6
                LayoutGridRowMinHeight: =0
                LayoutGridRows: =6
                RadiusBottomLeft: =16
                RadiusBottomRight: =16
                RadiusTopLeft: =16
                RadiusTopRight: =16
                Width: =300
                X: =(Parent.Width - Self.Width) / 2
                Y: =(Parent.Height - Self.Height) / 2
                ZIndex: =1

                icoPL_Loading As icon:
                    BorderColor: =RGBA(0, 0, 0, 0)
                    Color: =cmp_PageLayout.AccentColor
                    DisabledBorderColor: =RGBA(245, 245, 245, 1)
                    DisabledColor: =RGBA(225, 223, 221, 1)
                    DisabledFill: =RGBA(0, 0, 0, 0)
                    FocusedBorderThickness: =4
                    Height: =24
                    HoverBorderColor: =RGBA(0, 0, 0, 0)
                    HoverColor: =cmp_PageLayout.AccentColor
                    HoverFill: =RGBA(0, 0, 0, 0)
                    Icon: =Icon.Reload
                    PressedBorderColor: =RGBA(0, 0, 0, 0)
                    PressedColor: =cmp_PageLayout.AccentColor
                    PressedFill: =RGBA(0, 0, 0, 0)
                    Width: =24
                    X: =24
                    Y: =36
                    ZIndex: =1

                lblPL_Loading As modernText:
                    AutoHeight: =true
                    BorderStyle: =""
                    Color: =cmp_PageLayout.TextColor
                    Font: =""
                    FontWeight: =FontWeight.Semibold
                    Height: =24
                    Size: =12
                    Text: =cmp_PageLayout.LoadingText
                    Width: =220
                    X: =64
                    Y: =38
                    ZIndex: =2

