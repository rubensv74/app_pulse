cmp_TableHeader_v2 As CanvasComponent:
    OnMenu():
        ThisProperty:
            Default: =
    OnResize():
        ThisProperty:
            Default: =
    OnSort():
        ThisProperty:
            Default: =
    AccentColor: |-
        =ColorValue("#1677FF")
    BackgroundColor: |-
        =ColorValue("#FFFFFF")
    BorderColor: |-
        =ColorValue("#E2E8F0")
    ChildTabPriority: =true
    ColumnKey: =""
    ContentLanguage: =""
    DataType: ="text"
    EnableChildFocus: =true
    Fill: =RGBA(0, 0, 0, 0)
    FilterCount: =0
    HasActiveState: =cmp_TableHeader_v2.IsSorted || cmp_TableHeader_v2.IsFiltered
    Height: =48
    IsFiltered: =false
    IsRequired: =false
    IsResizable: =true
    IsSorted: =false
    MutedTextColor: |-
        =ColorValue("#64748B")
    NextSortDirection: |-
        =Switch(
            Lower(cmp_TableHeader_v2.SortDirection),
            "none", "asc",
            "asc", "desc",
            "desc", "none",
            "asc"
        )
    ShowDataTypeIcon: =true
    ShowMenu: =true
    SortDirection: ="none"
    Subtitle: =""
    SurfaceAltColor: |-
        =ColorValue("#F8FAFC")
    TextColor: |-
        =ColorValue("#0F172A")
    Title: ="Column"
    Tooltip: =""
    Visible: =true
    Width: =220
    X: =0
    Y: =0

    conTH_Root As groupContainer.manualLayoutContainer:
        BorderColor: =If(cmp_TableHeader_v2.HasActiveState, cmp_TableHeader_v2.AccentColor, cmp_TableHeader_v2.BorderColor)
        BorderThickness: =If(cmp_TableHeader_v2.HasActiveState, 2, 1)
        Fill: =If(cmp_TableHeader_v2.HasActiveState, cmp_TableHeader_v2.SurfaceAltColor, cmp_TableHeader_v2.BackgroundColor)
        Height: =Parent.Height
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Width: =Parent.Width
        ZIndex: =1

        btnTH_Click As button:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Color: =Color.White
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =Color.Transparent
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =Parent.Height
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =Color.White
            HoverFill: =RGBA(0,0,0,0.03)
            OnSelect: =cmp_TableHeader_v2.OnSort()
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =Color.White
            PressedFill: =RGBA(0,0,0,0.06)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =15
            Text: =""
            Width: =Parent.Width
            ZIndex: =1

        icoTH_DataType As icon:
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =If(cmp_TableHeader_v2.HasActiveState, cmp_TableHeader_v2.AccentColor, cmp_TableHeader_v2.MutedTextColor)
            DisabledBorderColor: =RGBA(245, 245, 245, 1)
            DisabledColor: =RGBA(225, 223, 221, 1)
            DisabledFill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =4
            Height: =16
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =cmp_TableHeader_v2.AccentColor
            HoverFill: =RGBA(0, 0, 0, 0)
            Icon: |-
                =Switch(
                    Lower(cmp_TableHeader_v2.DataType),
                    "number", Icon.Calculator,
                    "date", Icon.CalendarBlank,
                    "status", Icon.Flag,
                    "user", Icon.People,
                    "boolean", Icon.Check,
                    Icon.Document
                )
            OnSelect: =cmp_TableHeader_v2.OnSort()
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =cmp_TableHeader_v2.AccentColor
            PressedFill: =RGBA(0, 0, 0, 0)
            Visible: =cmp_TableHeader_v2.ShowDataTypeIcon
            Width: =16
            X: =10
            Y: =16
            ZIndex: =2

        lblTH_Title As modernText:
            AutoHeight: =true
            BorderStyle: =""
            Color: =If(cmp_TableHeader_v2.HasActiveState, cmp_TableHeader_v2.AccentColor, cmp_TableHeader_v2.TextColor)
            Font: =""
            FontWeight: =If(cmp_TableHeader_v2.HasActiveState, FontWeight.Semibold, FontWeight.Normal)
            Height: =20
            OnSelect: =cmp_TableHeader_v2.OnSort()
            Size: =11
            Text: =cmp_TableHeader_v2.Title & If(cmp_TableHeader_v2.IsRequired, " *", "")
            Width: =Parent.Width - If(cmp_TableHeader_v2.ShowDataTypeIcon, 96, 72)
            X: =If(cmp_TableHeader_v2.ShowDataTypeIcon, 34, 12)
            Y: =If(IsBlank(cmp_TableHeader_v2.Subtitle), 14, 8)
            ZIndex: =3

        lblTH_Subtitle As modernText:
            AutoHeight: =true
            BorderStyle: =""
            Color: =cmp_TableHeader_v2.MutedTextColor
            Font: =""
            Height: =14
            OnSelect: =cmp_TableHeader_v2.OnSort()
            Size: =8
            Text: =cmp_TableHeader_v2.Subtitle
            Visible: =!IsBlank(cmp_TableHeader_v2.Subtitle)
            Width: =Parent.Width - If(cmp_TableHeader_v2.ShowDataTypeIcon, 96, 72)
            X: =If(cmp_TableHeader_v2.ShowDataTypeIcon, 34, 12)
            Y: =28
            ZIndex: =4

        icoTH_Sort As icon:
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =If(cmp_TableHeader_v2.IsSorted, cmp_TableHeader_v2.AccentColor, cmp_TableHeader_v2.MutedTextColor)
            DisabledBorderColor: =RGBA(245, 245, 245, 1)
            DisabledColor: =RGBA(225, 223, 221, 1)
            DisabledFill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =4
            Height: =15
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =cmp_TableHeader_v2.AccentColor
            HoverFill: =RGBA(0, 0, 0, 0)
            Icon: |-
                =Switch(
                    Lower(cmp_TableHeader_v2.SortDirection),
                    "asc", Icon.ChevronUp,
                    "desc", Icon.ChevronDown,
                    Icon.Sort
                )
            OnSelect: =cmp_TableHeader_v2.OnSort()
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =cmp_TableHeader_v2.AccentColor
            PressedFill: =RGBA(0, 0, 0, 0)
            Width: =15
            X: =Parent.Width - If(cmp_TableHeader_v2.ShowMenu, 54, 32)
            Y: =16
            ZIndex: =5

        conTH_FilterBadge As groupContainer.manualLayoutContainer:
            BorderColor: =cmp_TableHeader_v2.AccentColor
            Fill: =cmp_TableHeader_v2.AccentColor
            Height: =16
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Visible: =cmp_TableHeader_v2.IsFiltered
            Width: =If(cmp_TableHeader_v2.FilterCount > 9, 24, 18)
            X: =Parent.Width - If(cmp_TableHeader_v2.ShowMenu, 82, 60)
            Y: =16
            ZIndex: =6

            lblTH_FilterCount As label:
                Align: =Align.Center
                BorderColor: =RGBA(0, 0, 0, 0)
                Color: =Color.White
                DisabledColor: =RGBA(161, 159, 157, 1)
                Fill: =Color.Transparent
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =16
                OnSelect: =cmp_TableHeader_v2.OnMenu()
                PaddingBottom: =0
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                Size: =8
                Text: =If(cmp_TableHeader_v2.FilterCount > 0, Text(cmp_TableHeader_v2.FilterCount), "•")
                VerticalAlign: =VerticalAlign.Top
                Width: =Parent.Width
                ZIndex: =1

        icoTH_Menu As icon:
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =cmp_TableHeader_v2.MutedTextColor
            DisabledBorderColor: =RGBA(245, 245, 245, 1)
            DisabledColor: =RGBA(225, 223, 221, 1)
            DisabledFill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =4
            Height: =16
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =cmp_TableHeader_v2.AccentColor
            HoverFill: =RGBA(0, 0, 0, 0)
            Icon: =Icon.More
            OnSelect: =cmp_TableHeader_v2.OnMenu()
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =cmp_TableHeader_v2.AccentColor
            PressedFill: =RGBA(0, 0, 0, 0)
            Visible: =cmp_TableHeader_v2.ShowMenu
            Width: =16
            X: =Parent.Width - 28
            Y: =16
            ZIndex: =7

        rectTH_Resize As rectangle:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            DisabledFill: =RGBA(161, 159, 157, 1)
            Fill: =If(cmp_TableHeader_v2.IsResizable, cmp_TableHeader_v2.BorderColor, Color.Transparent)
            FocusedBorderThickness: =4
            Height: =Parent.Height - 12
            HoverFill: =cmp_TableHeader_v2.AccentColor
            OnSelect: =cmp_TableHeader_v2.OnResize()
            PressedFill: =cmp_TableHeader_v2.AccentColor
            Visible: =cmp_TableHeader_v2.IsResizable
            Width: =2
            X: =Parent.Width - 2
            Y: =6
            ZIndex: =8

