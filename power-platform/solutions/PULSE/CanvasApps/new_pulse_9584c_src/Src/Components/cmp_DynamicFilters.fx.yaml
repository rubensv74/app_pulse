cmp_DynamicFilters As CanvasComponent:
    OnApply():
        ThisProperty:
            Default: =false
    OnClear():
        ThisProperty:
            Default: =false
    OnValueChanged():
        ThisProperty:
            Default: =false
    ChangedFieldKey: =varDF_ChangedFieldKey
    ChangedFieldType: =varDF_ChangedFieldType
    ChangedValueBool: =varDF_ChangedValueBool
    ChangedValueDate: =varDF_ChangedValueDate
    ChangedValueJson: =varDF_ChangedValueJson
    ChangedValueNumber: =varDF_ChangedValueNumber
    ChangedValueSlot: =varDF_ChangedValueSlot
    ChangedValueText: =varDF_ChangedValueText
    Fill: =RGBA(0, 0, 0, 0)
    Filters: |-
        =
        Table(
            {
                FieldKey: "",
                Label: "",
                FieldType: "",
                FilterMode: "",
                OptionsJson: "",
                FilterOrder: 0,
                ShowInQuickFilters: false
            }
        )
    FiltersJson: ="[]"
    Height: =App.Height
    OnReset: |-
        =
        
        Set(varDF_ChangedFieldKey, "");
        Set(varDF_ChangedFieldType, "");
        Set(varDF_ChangedValueSlot, "");
        Set(varDF_ChangedValueText, "");
        Set(varDF_ChangedValueNumber, 0);
        Set(varDF_ChangedValueDate, DateTime(1900,1,1,0,0,0));
        Set(varDF_ChangedValueBool, false);
        Set(varDF_ChangedValueJson, "")
    SelectedValues: =Table()
    ShowApplyButton: =true
    ShowClearButton: =true
    Subtitle: ="Dynamic filters configured for this project"
    Title: ="Project filters"
    Values: |-
        =
        Table(
            {
                FieldKey: "__schema__",
                Label: "",
                FieldType: "",
                FilterMode: "",
                ValueText: "",
                ValueNumberFrom: 0,
                ValueNumberTo: 0,
                ValueDateFrom: Date(1900,1,1),
                ValueDateTo: Date(1900,1,1),
                ValueBool: false,
                ValueJson: ""
            }
        )
    Width: =420
    X: =0
    Y: =0
    ZIndex: =1

    DFconRoot As groupContainer.verticalAutoLayoutContainer:
        DropShadow: =DropShadow.Light
        Fill: =Color.White
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Center
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGap: =12
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        PaddingBottom: =24
        PaddingLeft: =20
        PaddingRight: =20
        PaddingTop: =24
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        RadiusTopLeft: =4
        RadiusTopRight: =4
        Width: =Parent.Width
        ZIndex: =1

        DFconHeader As groupContainer.verticalAutoLayoutContainer:
            FillPortions: =0
            Height: =70
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =4
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            LayoutMode: =LayoutMode.Auto
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Width: =Parent.Width
            ZIndex: =1

            Text3 As modernText:
                Color: |-
                    =ColorValue("#0F172A")
                FillPortions: =1
                FontWeight: =FontWeight.Bold
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                Size: =20
                Text: =cmp_DynamicFilters.Title
                ZIndex: =1

            Text5 As modernText:
                Align: =Align.Center
                AutoHeight: =true
                Color: |-
                    =ColorValue("#64748B")
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                Size: =12
                Text: =cmp_DynamicFilters.Subtitle
                Width: =300
                ZIndex: =2

        DFconBody As groupContainer.verticalAutoLayoutContainer:
            Height: =Parent.Height - DFconHeader.Height - DFconFooter.Height - 24
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            LayoutMode: =LayoutMode.Auto
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Width: =Parent.Width
            ZIndex: =2

            "galFilters As gallery.'BrowseLayout_Vertical_OneTextOneImageVariant_ver5.0'":
                AlignInContainer: =AlignInContainer.SetByContainer
                BorderColor: =RGBA(245, 245, 245, 1)
                DelayItemLoading: =true
                Height: =Parent.Height
                Items: |-
                    =Filter(
                        cmp_DynamicFilters.Filters,
                        !IsBlank(FieldKey)
                    )
                Layout: =Layout.Vertical
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =287
                LayoutMinWidth: =320
                LoadingSpinner: =LoadingSpinner.Data
                TemplatePadding: =4
                TemplateSize: =140
                Width: =Parent.Width
                ZIndex: =2

                conFilterCard As groupContainer.verticalAutoLayoutContainer:
                    BorderColor: |-
                        =ColorValue("#E2E8F0")
                    BorderThickness: =1
                    Fill: |-
                        =ColorValue("#FFFFFF")
                    Height: =130
                    LayoutAlignItems: =LayoutAlignItems.Center
                    LayoutDirection: =LayoutDirection.Vertical
                    LayoutGap: =4
                    LayoutGridColumnMinWidth: =0
                    LayoutGridColumns: =6
                    LayoutGridRowMinHeight: =0
                    LayoutGridRows: =6
                    LayoutMode: =LayoutMode.Auto
                    PaddingBottom: =8
                    PaddingLeft: =12
                    PaddingRight: =12
                    PaddingTop: =8
                    RadiusBottomLeft: =12
                    RadiusBottomRight: =12
                    RadiusTopLeft: =12
                    RadiusTopRight: =12
                    Width: =Parent.TemplateWidth
                    ZIndex: =7

                    lblFilterLabel As modernText:
                        AutoHeight: =true
                        Color: |-
                            =ColorValue("#0F172A")
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        LayoutMaxHeight: =0
                        LayoutMaxWidth: =0
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =13
                        Text: =ThisItem.Label
                        Width: =Parent.Width - 24
                        X: =12
                        Y: =8
                        ZIndex: =1

                    lblFilterMeta As modernText:
                        Color: |-
                            =ColorValue("#64748B")
                        Height: =10
                        LayoutMaxHeight: =0
                        LayoutMaxWidth: =0
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Text: =ThisItem.FieldType & " • " & ThisItem.FilterMode
                        Visible: =false
                        Width: =Parent.Width - 24
                        X: =12
                        Y: =30
                        ZIndex: =2

                    txtFilterText As text:
                        BorderColor: =RGBA(245, 245, 245, 1)
                        BorderThickness: =2
                        Color: =RGBA(50, 49, 48, 1)
                        Default: |-
                            =
                            
                            Coalesce(
                                LookUp(
                                    cmp_DynamicFilters.Values,
                                    FieldKey = ThisItem.FieldKey
                                ).ValueText,
                                ""
                            )
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        FocusedBorderThickness: =4
                        Font: =Font.'Segoe UI'
                        Height: =36
                        HintText: ="Search " & ThisItem.Label
                        HoverBorderColor: =RGBA(16, 110, 190, 1)
                        HoverColor: =RGBA(50, 49, 48, 1)
                        HoverFill: =RGBA(255, 255, 255, 1)
                        LayoutMaxHeight: =0
                        LayoutMaxWidth: =0
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnChange: |-
                            =
                            
                            Set(varDF_ChangedFieldKey, ThisItem.FieldKey);
                            Set(varDF_ChangedFieldType, ThisItem.FieldType);
                            Set(varDF_ChangedValueSlot, "ValueText");
                            Set(varDF_ChangedValueText, Self.Text);
                            
                            cmp_DynamicFilters.OnValueChanged()
                        PressedBorderColor: =RGBA(0, 120, 212, 1)
                        PressedColor: =RGBA(50, 49, 48, 1)
                        PressedFill: =RGBA(255, 255, 255, 1)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Size: =13
                        Visible: =ThisItem.FieldType = "Text" || ThisItem.FieldType = "Json"
                        Width: =Parent.Width - 24
                        X: =12
                        Y: =38
                        ZIndex: =4

                    cmbFilterChoice As modernCombobox:
                        Appearance: =Appearance.FilledDarker
                        DefaultSelectedItems: |-
                            =
                            
                            If(
                                Lower(Trim(ThisItem.FieldType)) = "choice",
                                If(
                                    IsBlank(
                                        LookUp(
                                            cmp_DynamicFilters.Values,
                                            FieldKey = ThisItem.FieldKey
                                        ).ValueText
                                    ),
                                    Blank(),
                                    Table(
                                        {
                                            Value:
                                                LookUp(
                                                    cmp_DynamicFilters.Values,
                                                    FieldKey = ThisItem.FieldKey
                                                ).ValueText
                                        }
                                    )
                                ),
                                If(
                                    Lower(Trim(ThisItem.FieldType)) = "multichoice",
                                    ForAll(
                                        Table(
                                            ParseJSON(
                                                Coalesce(
                                                    LookUp(
                                                        cmp_DynamicFilters.Values,
                                                        FieldKey = ThisItem.FieldKey
                                                    ).ValueJson,
                                                    "[]"
                                                )
                                            )
                                        ),
                                        {Value: Text(Value)}
                                    ),
                                    Blank()
                                )
                            )
                        Height: =36
                        ItemDisplayText: =ThisItem.Value
                        Items: |-
                            =
                            
                            ForAll(
                                Table(
                                    ParseJSON(
                                        If(
                                            IsBlank(Trim(Coalesce(ThisItem.OptionsJson, ""))),
                                            "[]",
                                            ThisItem.OptionsJson
                                        )
                                    )
                                ),
                                {Value: Text(Value)}
                            )
                        LayoutMaxHeight: =0
                        LayoutMaxWidth: =0
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnChange: |-
                            =
                            Set(varDF_ChangedFieldKey, ThisItem.FieldKey);
                            Set(varDF_ChangedFieldType, ThisItem.FieldType);
                            
                            If(
                                Lower(Trim(ThisItem.FieldType)) = "choice",
                            
                                Set(varDF_ChangedValueSlot, "ValueText");
                                Set(varDF_ChangedValueText, Coalesce(Self.Selected.Value, "")),
                            
                                Set(varDF_ChangedValueSlot, "ValueJson");
                                Set(
                                    varDF_ChangedValueJson,
                                    "[" &
                                    Concat(
                                        Self.SelectedItems,
                                        """" & Substitute(Value, """", "\""") & """",
                                        ","
                                    ) &
                                    "]"
                                )
                            );
                            
                            cmp_DynamicFilters.OnValueChanged()
                        SelectMultiple: =Lower(Trim(ThisItem.FieldType)) = "multichoice"
                        ValidationState: =ValidationState.None
                        Visible: =ThisItem.FieldType = "Choice" || ThisItem.FieldType = "MultiChoice"
                        Width: =Parent.Width - 24
                        X: =12
                        Y: =38
                        ZIndex: =5

                    dpFilterDateFrom As modernDatePicker:
                        Appearance: =Appearance.FilledDarker
                        DefaultDate: |-
                            =
                            
                            If(
                                LookUp(
                                    cmp_DynamicFilters.Values,
                                    FieldKey = ThisItem.FieldKey
                                ).ValueDateFrom = Date(1900,1,1),
                                Blank(),
                                LookUp(
                                    cmp_DynamicFilters.Values,
                                    FieldKey = ThisItem.FieldKey
                                ).ValueDateFrom
                            )
                        Height: =36
                        LayoutMaxHeight: =0
                        LayoutMaxWidth: =0
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnChange: |-
                            =
                            
                            Set(varDF_ChangedFieldKey, ThisItem.FieldKey);
                            Set(varDF_ChangedFieldType, ThisItem.FieldType);
                            Set(varDF_ChangedValueSlot, "ValueDateFrom");
                            Set(varDF_ChangedValueDate, Coalesce(Self.SelectedDate, Date(1900,1,1)));
                            
                            cmp_DynamicFilters.OnValueChanged()
                        Placeholder: ="Select a date"
                        ValidationState: =ValidationState.None
                        Visible: = ThisItem.FieldType = "Date"
                        Width: =Parent.Width - 24
                        X: =12
                        Y: =38
                        ZIndex: =6

                    dpFilterDateTo As modernDatePicker:
                        Appearance: =Appearance.FilledDarker
                        DefaultDate: |-
                            =
                            
                            
                            If(
                                LookUp(
                                    cmp_DynamicFilters.Values,
                                    FieldKey = ThisItem.FieldKey
                                ).ValueDateTo = Date(1900,1,1),
                                Blank(),
                                LookUp(
                                    cmp_DynamicFilters.Values,
                                    FieldKey = ThisItem.FieldKey
                                ).ValueDateTo
                            )
                        Height: =36
                        LayoutMaxHeight: =0
                        LayoutMaxWidth: =0
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnChange: |-
                            =
                            
                            Set(varDF_ChangedFieldKey, ThisItem.FieldKey);
                            Set(varDF_ChangedFieldType, ThisItem.FieldType);
                            Set(varDF_ChangedValueSlot, "ValueDateTo");
                            Set(varDF_ChangedValueDate, Coalesce(Self.SelectedDate, Date(1900,1,1)));
                            
                            cmp_DynamicFilters.OnValueChanged()
                        Placeholder: ="Select a date"
                        ValidationState: =ValidationState.None
                        Visible: =ThisItem.FieldType = "Date" && ThisItem.FilterMode = "Between"
                        Width: =Parent.Width - 24
                        X: =12
                        Y: =78
                        ZIndex: =7

                    numFilterFrom As modernNumberInput:
                        Default: |-
                            =
                            
                            
                            If(
                                LookUp(
                                    cmp_DynamicFilters.Values,
                                    FieldKey = ThisItem.FieldKey
                                ).ValueNumberFrom = 0,
                                Blank(),
                                LookUp(
                                    cmp_DynamicFilters.Values,
                                    FieldKey = ThisItem.FieldKey
                                ).ValueNumberFrom
                            )
                        Height: =36
                        LayoutMaxHeight: =0
                        LayoutMaxWidth: =0
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnChange: |-
                            =Set(varDF_ChangedFieldKey, ThisItem.FieldKey);
                            Set(varDF_ChangedFieldType, ThisItem.FieldType);
                            
                            If(
                                ThisItem.FilterMode = "Between",
                                Set(varDF_ChangedValueSlot, "ValueNumberFrom");
                                Set(varDF_ChangedValueNumber, Coalesce(Value(Self.Value), 0)),
                            
                                Set(varDF_ChangedValueSlot, "ValueNumberFrom");
                                Set(varDF_ChangedValueNumber, Coalesce(Value(Self.Value), 0));
                                cmp_DynamicFilters.OnValueChanged();
                            
                                Set(varDF_ChangedValueSlot, "ValueNumberTo");
                                Set(varDF_ChangedValueNumber, Coalesce(Value(Self.Value), 0))
                            );
                            
                            cmp_DynamicFilters.OnValueChanged()
                        ValidationState: =ValidationState.None
                        Visible: =ThisItem.FieldType = "Number"
                        Width: =Parent.Width - 24
                        X: =12
                        Y: =38
                        ZIndex: =8

                    numFilterTo As modernNumberInput:
                        Default: |-
                            =
                            
                            
                            
                            If(
                                LookUp(
                                    cmp_DynamicFilters.Values,
                                    FieldKey = ThisItem.FieldKey
                                ).ValueNumberTo = 0,
                                Blank(),
                                LookUp(
                                    cmp_DynamicFilters.Values,
                                    FieldKey = ThisItem.FieldKey
                                ).ValueNumberTo
                            )
                        Height: =36
                        LayoutMaxHeight: =0
                        LayoutMaxWidth: =0
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnChange: |-
                            =
                            
                            Set(varDF_ChangedFieldKey, ThisItem.FieldKey);
                            Set(varDF_ChangedFieldType, ThisItem.FieldType);
                            Set(varDF_ChangedValueSlot, "ValueNumberTo");
                            Set(varDF_ChangedValueNumber, Coalesce(Value(Self.Value), 0));
                            
                            cmp_DynamicFilters.OnValueChanged()
                        ValidationState: =ValidationState.None
                        Visible: =ThisItem.FieldType = "Number" && ThisItem.FilterMode = "Between"
                        Width: =Parent.Width - 24
                        X: =12
                        Y: =78
                        ZIndex: =9

                    tglFilterBool As Toggle:
                        BasePaletteColor: =
                        Checked: |-
                            =
                            
                            
                            Coalesce(
                                LookUp(
                                    cmp_DynamicFilters.Values,
                                    FieldKey = ThisItem.FieldKey
                                ).ValueBool,
                                false
                            )
                        DisplayMode: =DisplayMode.Edit
                        FontColor: =
                        Height: =36
                        Label: = "Yes / No"
                        LayoutMaxHeight: =0
                        LayoutMaxWidth: =0
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnCheck: |-
                            =
                            
                            
                            Set(varDF_ChangedFieldKey, ThisItem.FieldKey);
                            Set(varDF_ChangedFieldType, ThisItem.FieldType);
                            Set(varDF_ChangedValueSlot, "ValueBool");
                            Set(varDF_ChangedValueBool, true);
                            
                            cmp_DynamicFilters.OnValueChanged()
                        OnUncheck: |-
                            =
                            
                            
                            Set(varDF_ChangedFieldKey, ThisItem.FieldKey);
                            Set(varDF_ChangedFieldType, ThisItem.FieldType);
                            Set(varDF_ChangedValueSlot, "ValueBool");
                            Set(varDF_ChangedValueBool, false);
                            
                            cmp_DynamicFilters.OnValueChanged()
                        Visible: =ThisItem.FieldType = "YesNo"
                        Width: = Parent.Width - 24
                        X: =12
                        Y: =38
                        ZIndex: =10

        DFconFooter As groupContainer.horizontalAutoLayoutContainer:
            FillPortions: =0
            Height: =64
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutJustifyContent: =LayoutJustifyContent.End
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            LayoutMode: =LayoutMode.Auto
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Width: =Parent.Width
            ZIndex: =3

            btnClearAll As modernButton:
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                OnSelect: |-
                    =
                    
                    
                    Set(varDF_ChangedFieldKey, "");
                    Set(varDF_ChangedFieldType, "");
                    Set(varDF_ChangedValueSlot, "ClearAll");
                    Set(varDF_ChangedValueText, "");
                    Set(varDF_ChangedValueNumber, 0);
                    Set(varDF_ChangedValueDate, DateTime(1900,1,1,0,0,0));
                    Set(varDF_ChangedValueBool, false);
                    Set(varDF_ChangedValueJson, "");
                    
                    cmp_DynamicFilters.OnValueChanged();
                    
                    cmp_DynamicFilters.OnClear()
                Text: ="Clear all"
                Visible: =cmp_DynamicFilters.ShowClearButton
                Width: =120
                ZIndex: =1

            btnApplyFilters As modernButton:
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                OnSelect: |-
                    =
                    
                    cmp_DynamicFilters.OnApply()
                Text: ="Apply filters"
                Visible: =cmp_DynamicFilters.ShowApplyButton
                Width: =120
                ZIndex: =2

