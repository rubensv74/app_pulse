cmp_KpiCard As CanvasComponent:
    OnSelectCard():
        ThisProperty:
            Default: =
    AccentColor: |-
        =ColorValue("#1677FF")
    BackgroundColor: |-
        =ColorValue("#FFFFFF")
    BorderColor: |-
        =ColorValue("#E2E8F0")
    ChildTabPriority: =true
    ContentLanguage: =""
    DeltaText: =""
    EnableChildFocus: =true
    Fill: =RGBA(0, 0, 0, 0)
    FooterText: =""
    Height: =132
    Icon: ="Trending"
    IsSelected: =false
    MutedTextColor: |-
        =ColorValue("#64748B")
    ShowDelta: =true
    ShowFooter: =true
    ShowIcon: =true
    Subtitle: =""
    SurfaceAltColor: |-
        =ColorValue("#F8FAFC")
    TextColor: |-
        =ColorValue("#0F172A")
    Title: ="KPI"
    ValueText: ="0"
    Visible: =true
    Width: =240
    X: =0
    Y: =0

    conKPI_Root As groupContainer.manualLayoutContainer:
        BorderColor: =If(cmp_KpiCard.IsSelected, cmp_KpiCard.AccentColor, cmp_KpiCard.BorderColor)
        BorderThickness: =If(cmp_KpiCard.IsSelected, 2, 1)
        DropShadow: =DropShadow.Semibold
        Fill: =cmp_KpiCard.BackgroundColor
        Height: =Parent.Height
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        RadiusBottomLeft: =14
        RadiusBottomRight: =14
        RadiusTopLeft: =14
        RadiusTopRight: =14
        Width: =Parent.Width
        ZIndex: =1

        btnKPI_Click As button:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Color: =Color.White
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =Color.Transparent
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =Parent.Height
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =Color.White
            HoverFill: =RGBA(0,0,0,0.02)
            OnSelect: =cmp_KpiCard.OnSelectCard()
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =Color.White
            PressedFill: =RGBA(0,0,0,0.04)
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            RadiusTopLeft: =14
            RadiusTopRight: =14
            Size: =15
            Text: =""
            Width: =Parent.Width
            ZIndex: =1

        conKPI_IconBg As groupContainer.manualLayoutContainer:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =cmp_KpiCard.SurfaceAltColor
            Height: =36
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Visible: =cmp_KpiCard.ShowIcon
            Width: =36
            X: =Parent.Width - 52
            Y: =16
            ZIndex: =2

            icoKPI_Main As icon:
                BorderColor: =RGBA(0, 0, 0, 0)
                Color: =cmp_KpiCard.AccentColor
                DisabledBorderColor: =RGBA(245, 245, 245, 1)
                DisabledColor: =RGBA(225, 223, 221, 1)
                DisabledFill: =RGBA(0, 0, 0, 0)
                FocusedBorderThickness: =4
                Height: =18
                HoverBorderColor: =RGBA(0, 0, 0, 0)
                HoverColor: =cmp_KpiCard.AccentColor
                HoverFill: =RGBA(0, 0, 0, 0)
                Icon: |-
                    =Switch(
                        Lower(cmp_KpiCard.Icon),
                        "warning", Icon.Warning,
                        "check", Icon.Check,
                        "document", Icon.Document,
                        "filter", Icon.Filter,
                        "search", Icon.Search,
                        "people", Icon.People,
                        "calendar", Icon.CalendarBlank,
                        "error", Icon.Error,
                        Icon.Trending
                    )
                OnSelect: =cmp_KpiCard.OnSelectCard()
                PressedBorderColor: =RGBA(0, 0, 0, 0)
                PressedColor: =cmp_KpiCard.AccentColor
                PressedFill: =RGBA(0, 0, 0, 0)
                Width: =18
                X: =9
                Y: =9
                ZIndex: =1

        lblKPI_Title As modernText:
            AutoHeight: =true
            BorderStyle: =""
            Color: =cmp_KpiCard.MutedTextColor
            Font: =""
            Height: =18
            Size: =10
            Text: =cmp_KpiCard.Title
            Width: =If(cmp_KpiCard.ShowIcon, Parent.Width - 76, Parent.Width - 32)
            X: =16
            Y: =16
            ZIndex: =3

        lblKPI_Value As modernText:
            AutoHeight: =true
            BorderStyle: =""
            Color: =cmp_KpiCard.TextColor
            Font: =""
            FontWeight: =FontWeight.Semibold
            Height: =34
            Size: =24
            Text: =cmp_KpiCard.ValueText
            Width: =Parent.Width - 32
            X: =16
            Y: =40
            ZIndex: =4

        lblKPI_Subtitle As modernText:
            AutoHeight: =true
            BorderStyle: =""
            Color: =cmp_KpiCard.MutedTextColor
            Font: =""
            Height: =18
            Size: =10
            Text: =cmp_KpiCard.Subtitle
            Width: =Parent.Width - 32
            X: =16
            Y: =76
            ZIndex: =5

        lblKPI_Delta As label:
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =cmp_KpiCard.AccentColor
            DisabledColor: =RGBA(161, 159, 157, 1)
            Fill: =Color.Transparent
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =20
            OnSelect: =cmp_KpiCard.OnSelectCard()
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =10
            Text: =cmp_KpiCard.DeltaText
            VerticalAlign: =VerticalAlign.Top
            Visible: =cmp_KpiCard.ShowDelta && !IsBlank(cmp_KpiCard.DeltaText)
            Width: =Parent.Width - 32
            X: =16
            Y: =100
            ZIndex: =6

        lblKPI_Footer As modernText:
            AutoHeight: =true
            BorderStyle: =""
            Color: =cmp_KpiCard.MutedTextColor
            Font: =""
            Height: =18
            Size: =9
            Text: =cmp_KpiCard.FooterText
            Visible: =cmp_KpiCard.ShowFooter && !IsBlank(cmp_KpiCard.FooterText)
            Width: =Parent.Width - 32
            X: =16
            Y: =104
            ZIndex: =7

