cmp_FilterBar As CanvasComponent:
    OnAdvancedFilters():
        ThisProperty:
            Default: =
    OnClear():
        ThisProperty:
            Default: =
    OnRefresh():
        ThisProperty:
            Default: =
    OnSearch():
        ThisProperty:
            Default: =
    AccentColor: |-
        =ColorValue("#1677FF")
    ActiveFilterCount: =0
    AdvancedButtonText: ="Filters"
    BackgroundColor: |-
        =ColorValue("#FFFFFF")
    BorderColor: |-
        =ColorValue("#E2E8F0")
    ChildTabPriority: =true
    ClearButtonText: ="Clear"
    ContentLanguage: =""
    EnableChildFocus: =true
    Fill: =RGBA(0, 0, 0, 0)
    HasActiveFilters: =cmp_FilterBar.ActiveFilterCount > 0
    Height: =72
    MutedTextColor: |-
        =ColorValue("#64748B")
    RefreshButtonText: ="Refresh"
    SearchButtonText: ="Search"
    SearchText: =""
    ShowAdvanced: =true
    ShowClear: =true
    ShowRefresh: =true
    ShowSearch: =true
    SummaryText: |-
        =If(
            cmp_FilterBar.ActiveFilterCount > 0,
            cmp_FilterBar.ActiveFilterCount & " active filter" & If(cmp_FilterBar.ActiveFilterCount = 1, "", "s"),
            "No active filters"
        ) &
        If(
            cmp_FilterBar.TotalRows > 0,
            " · " & cmp_FilterBar.TotalRows & " rows",
            ""
        )
    SurfaceAltColor: |-
        =ColorValue("#F8FAFC")
    TextColor: |-
        =ColorValue("#0F172A")
    Title: ="Filters"
    TotalRows: =0
    Visible: =true
    Width: =920
    X: =0
    Y: =0

    conFB_Root As groupContainer.manualLayoutContainer:
        BorderColor: =cmp_FilterBar.BorderColor
        BorderThickness: =1
        Fill: =cmp_FilterBar.BackgroundColor
        Height: =Parent.Height
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        RadiusBottomLeft: =14
        RadiusBottomRight: =14
        RadiusTopLeft: =14
        RadiusTopRight: =14
        Width: =Parent.Width
        ZIndex: =1

        lblFB_Title As modernText:
            AutoHeight: =true
            BorderStyle: =""
            Color: =cmp_FilterBar.TextColor
            Font: =""
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =13
            Text: =cmp_FilterBar.Title
            Width: =220
            X: =18
            Y: =14
            ZIndex: =1

        lblFB_Summary As modernText:
            AutoHeight: =true
            BorderStyle: =""
            Color: =If(cmp_FilterBar.HasActiveFilters, cmp_FilterBar.AccentColor, cmp_FilterBar.MutedTextColor)
            Font: =""
            Height: =18
            Size: =10
            Text: =cmp_FilterBar.SummaryText
            Width: =300
            X: =18
            Y: =38
            ZIndex: =2

        conFB_Badge As groupContainer.manualLayoutContainer:
            BorderColor: =cmp_FilterBar.AccentColor
            Fill: =cmp_FilterBar.AccentColor
            Height: =20
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Visible: =cmp_FilterBar.HasActiveFilters
            Width: =If(cmp_FilterBar.ActiveFilterCount > 9, 34, 28)
            X: =btnFB_Advanced.X + btnFB_Advanced.Width - 18
            Y: =10
            ZIndex: =3

            lblFB_Badge As label:
                Align: =Align.Center
                BorderColor: =RGBA(0, 0, 0, 0)
                Color: =Color.White
                DisabledColor: =RGBA(161, 159, 157, 1)
                Fill: =Color.Transparent
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =20
                PaddingBottom: =0
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                Size: =9
                Text: =Text(cmp_FilterBar.ActiveFilterCount)
                VerticalAlign: =VerticalAlign.Top
                Width: =Parent.Width
                Y: =1
                ZIndex: =1

        btnFB_Search As button:
            BorderColor: =cmp_FilterBar.BorderColor
            BorderThickness: =1
            Color: =cmp_FilterBar.TextColor
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =cmp_FilterBar.BackgroundColor
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =36
            HoverBorderColor: =cmp_FilterBar.AccentColor
            HoverColor: =cmp_FilterBar.TextColor
            HoverFill: =cmp_FilterBar.SurfaceAltColor
            OnSelect: =cmp_FilterBar.OnSearch()
            PressedBorderColor: =cmp_FilterBar.AccentColor
            PressedColor: =cmp_FilterBar.TextColor
            PressedFill: |-
                =ColorValue("#F1F5F9")
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =11
            Text: =cmp_FilterBar.SearchButtonText
            Visible: =cmp_FilterBar.ShowSearch
            Width: =104
            X: =Parent.Width - 472
            Y: =18
            ZIndex: =4

        btnFB_Advanced As button:
            BorderColor: =If(cmp_FilterBar.HasActiveFilters, cmp_FilterBar.AccentColor, cmp_FilterBar.BorderColor)
            BorderThickness: =1
            Color: =If(cmp_FilterBar.HasActiveFilters, cmp_FilterBar.AccentColor, cmp_FilterBar.TextColor)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =If(cmp_FilterBar.HasActiveFilters, cmp_FilterBar.SurfaceAltColor, cmp_FilterBar.BackgroundColor)
            Font: =Font.'Segoe UI'
            FontWeight: =If(cmp_FilterBar.HasActiveFilters, FontWeight.Semibold, FontWeight.Normal)
            Height: =36
            HoverBorderColor: =cmp_FilterBar.AccentColor
            HoverColor: =cmp_FilterBar.AccentColor
            HoverFill: =cmp_FilterBar.SurfaceAltColor
            OnSelect: =cmp_FilterBar.OnAdvancedFilters()
            PressedBorderColor: =cmp_FilterBar.AccentColor
            PressedColor: =cmp_FilterBar.AccentColor
            PressedFill: |-
                =ColorValue("#F1F5F9")
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =11
            Text: =cmp_FilterBar.AdvancedButtonText
            Visible: =cmp_FilterBar.ShowAdvanced
            Width: =112
            X: =Parent.Width - 356
            Y: =18
            ZIndex: =5

        btnFB_Clear As button:
            BorderColor: =cmp_FilterBar.BorderColor
            BorderThickness: =1
            Color: =cmp_FilterBar.TextColor
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            DisplayMode: =If(cmp_FilterBar.HasActiveFilters, DisplayMode.Edit, DisplayMode.Disabled)
            Fill: =cmp_FilterBar.BackgroundColor
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =36
            HoverBorderColor: =cmp_FilterBar.BorderColor
            HoverColor: =cmp_FilterBar.TextColor
            HoverFill: =cmp_FilterBar.SurfaceAltColor
            OnSelect: =cmp_FilterBar.OnClear()
            PressedBorderColor: =cmp_FilterBar.BorderColor
            PressedColor: =cmp_FilterBar.TextColor
            PressedFill: |-
                =ColorValue("#F1F5F9")
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =11
            Text: =cmp_FilterBar.ClearButtonText
            Visible: =cmp_FilterBar.ShowClear
            Width: =100
            X: =Parent.Width - 232
            Y: =18
            ZIndex: =6

        btnFB_Refresh As button:
            BorderColor: =cmp_FilterBar.AccentColor
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Color: =Color.White
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =cmp_FilterBar.AccentColor
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =36
            HoverBorderColor: =cmp_FilterBar.AccentColor
            HoverColor: =Color.White
            HoverFill: =cmp_FilterBar.AccentColor
            OnSelect: =cmp_FilterBar.OnRefresh()
            PressedBorderColor: =cmp_FilterBar.AccentColor
            PressedColor: =Color.White
            PressedFill: =cmp_FilterBar.AccentColor
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =11
            Text: =cmp_FilterBar.RefreshButtonText
            Visible: =cmp_FilterBar.ShowRefresh
            Width: =104
            X: =Parent.Width - 116
            Y: =18
            ZIndex: =7

