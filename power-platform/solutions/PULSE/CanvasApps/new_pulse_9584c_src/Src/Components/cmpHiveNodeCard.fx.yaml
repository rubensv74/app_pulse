cmpHiveNodeCard As CanvasComponent:
    AtRisk: =100
    Blocked: =100
    Fill: =RGBA(0, 0, 0, 0)
    HealthColor: =RGBA(0, 0, 0, 1)
    HealthScore: =100
    HealthStatus: ="Text"
    Height: =230
    IsSelected: =true
    NodeId: ="Text"
    NodeNo: ="Text"
    NodeSubtitle: ="Text"
    NodeTitle: ="Text"
    Overdue: =100
    PressureLevel: ="Text"
    Progress: =100
    SubsystemCode: ="Text"
    Total: =100
    TrendDirection: ="Text"
    Width: =330
    X: =0
    Y: =0
    ZIndex: =1

    cntCardRoot As groupContainer.manualLayoutContainer:
        BorderColor: |-
            =
            
            If(
                cmpHiveNodeCard.IsSelected,
                cmpHiveNodeCard.HealthColor,
                ColorValue("#E7EDF5")
            )
        BorderThickness: =If(cmpHiveNodeCard.IsSelected, 2, 1)
        DropShadow: =DropShadow.Light
        Fill: |-
            =ColorValue("#FFFFFF")
        Height: =Parent.Height - 6
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        RadiusBottomLeft: =18
        RadiusBottomRight: =18
        RadiusTopLeft: =18
        RadiusTopRight: =18
        Width: =Parent.Width - 6
        X: =3
        Y: =3
        ZIndex: =1

        recHealthBar As rectangle:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =2
            DisabledFill: =RGBA(161, 159, 157, 1)
            Fill: =cmpHiveNodeCard.HealthColor
            FocusedBorderThickness: =4
            Height: =4
            HoverFill: =RGBA(0, 120, 212, 1)
            PressedFill: =RGBA(0, 120, 212, 1)
            Width: =44
            X: =18
            ZIndex: =1

        recHeaderBg As rectangle:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =2
            DisabledFill: =RGBA(161, 159, 157, 1)
            Fill: |-
                =ColorValue("#FBFCFE")
            FocusedBorderThickness: =4
            Height: =56
            HoverFill: =RGBA(0, 120, 212, 1)
            PressedFill: =RGBA(0, 120, 212, 1)
            Width: =Parent.Width
            ZIndex: =2

        lblNodeNo As modernText:
            Align: =Align.Center
            AutoHeight: =true
            Color: =cmpHiveNodeCard.HealthColor
            Fill: =ColorFade(cmpHiveNodeCard.HealthColor, 88%)
            FontWeight: =FontWeight.Bold
            Height: =28
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Size: =10
            Text: =cmpHiveNodeCard.NodeNo
            Width: =38
            X: =18
            Y: =15
            ZIndex: =3

        lblNodeTitle As modernText:
            AutoHeight: =true
            Color: |-
                =ColorValue("#0F172A")
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =14
            Text: =cmpHiveNodeCard.NodeTitle
            Width: =160
            X: =66
            Y: =13
            ZIndex: =4

        lblNodeSubtitle As modernText:
            AutoHeight: =true
            Color: |-
                =ColorValue("#64748B")
            Height: =18
            Size: =9
            Text: =cmpHiveNodeCard.NodeSubtitle
            Width: =170
            X: =66
            Y: =36
            ZIndex: =5

        lblHealthScore As modernText:
            AutoHeight: =true
            Color: =cmpHiveNodeCard.HealthColor
            FontWeight: =FontWeight.Bold
            Height: =48
            Size: =34
            Text: =cmpHiveNodeCard.HealthScore
            Width: =88
            X: =22
            Y: =78
            ZIndex: =6

        lblHealthScoreText As modernText:
            AutoHeight: =true
            Color: |-
                =ColorValue("#64748B")
            Height: =18
            Size: =9
            Text: ="Health Score"
            Width: =100
            X: =24
            Y: =122
            ZIndex: =7

        lblHealthStatus As modernText:
            Align: =Align.Center
            AutoHeight: =true
            Color: =cmpHiveNodeCard.HealthColor
            Fill: =ColorFade(cmpHiveNodeCard.HealthColor, 88%)
            FontWeight: =FontWeight.Semibold
            Height: =26
            RadiusBottomLeft: =999
            RadiusBottomRight: =999
            RadiusTopLeft: =999
            RadiusTopRight: =999
            Size: =9
            Text: |-
                =If(
                    cmpHiveNodeCard.HealthStatus = "Critical",
                    "⚠ Critical",
                    If(
                        cmpHiveNodeCard.HealthStatus = "At Risk",
                        "⚠ At Risk",
                        cmpHiveNodeCard.HealthStatus
                    )
                )
            Width: =94
            X: =118
            Y: =16
            ZIndex: =8

        lblPressure As modernText:
            Align: =Align.Center
            AutoHeight: =true
            Color: |-
                =ColorValue("#475569")
            Fill: |-
                =ColorValue("#F8FAFC")
            Height: =22
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =10
            Text: =cmpHiveNodeCard.PressureLevel
            Width: =86
            X: =122
            Y: =145
            ZIndex: =9

        HtmlText1 As htmlViewer:
            DisabledBorderColor: =RGBA(161, 159, 157, 1)
            Font: =Font.'Segoe UI'
            Height: =82
            HtmlText: |-
                =
                With(
                    {
                        _color: Switch(
                            cmpHiveNodeCard.HealthStatus,
                            "Excellent", "#2F9E44",
                            "Good", "#EAB308",
                            "At Risk", "#F97316",
                            "Critical", "#DC2626",
                            "#64748B"
                        )
                    },
                    "<svg width='82' height='82' viewBox='0 0 82 82' xmlns='http://www.w3.org/2000/svg'>
                        <circle cx='41' cy='41' r='31' fill='none' stroke='#E5E7EB' stroke-width='8'/>
                        <circle cx='41' cy='41' r='31' fill='none' stroke='" & _color & "' stroke-width='8'
                            stroke-dasharray='" & Text(cmpHiveNodeCard.Progress * 1.76) & " 176'
                            stroke-linecap='round'
                            transform='rotate(-90 38 38)'/>
                        <text x='38' y='37' text-anchor='middle' font-size='14' font-weight='700' fill='#0F172A'>" & cmpHiveNodeCard.Progress & "%</text>
                        <text x='38' y='52' text-anchor='middle' font-size='9' fill='#64748B'>Progress</text>
                    </svg>"
                )
            Size: =13
            Width: =82
            X: =130
            Y: =72
            ZIndex: =10

        lblTrend As modernText:
            Align: =Align.Center
            AutoHeight: =true
            Color: |-
                =
                
                Switch(
                    cmpHiveNodeCard.TrendDirection,
                    "Improving", ColorValue("#2F9E44"),
                    "Worsening", ColorValue("#DC2626"),
                    "Stable", ColorValue("#64748B"),
                    ColorValue("#64748B")
                )
            Fill: |-
                =ColorValue("#F8FAFC")
            Height: =22
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =10
            Text: |-
                =Switch(
                    cmpHiveNodeCard.TrendDirection,
                    "Improving", "↗ Improving",
                    "Worsening", "↘ Worsening",
                    "Stable", "→ Stable",
                    "New", "• New",
                    cmpHiveNodeCard.TrendDirection
                )
            Width: =88
            X: =225
            Y: =145
            ZIndex: =11

        recDivider As rectangle:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =2
            DisabledFill: =RGBA(161, 159, 157, 1)
