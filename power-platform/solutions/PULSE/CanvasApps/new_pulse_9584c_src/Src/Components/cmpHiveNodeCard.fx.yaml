            Width: =60
            X: =260
            Y: =196
            ZIndex: =20

        Button1 As button:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =RGBA(0,0,0,0)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =Parent.Height
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(15,23,42,0.025)
            OnSelect: |-
                =Set(
                    varSelectedHiveNode,
                    {
                        NodeId: cmpHiveNodeCard.NodeId,
                        NodeNo: cmpHiveNodeCard.NodeNo,
                        NodeTitle: cmpHiveNodeCard.NodeTitle,
                        NodeSubtitle: cmpHiveNodeCard.NodeSubtitle,
                        SubsystemCode: cmpHiveNodeCard.SubsystemCode,
                        HealthScore: cmpHiveNodeCard.HealthScore,
                        HealthStatus: cmpHiveNodeCard.HealthStatus,
                        HealthColor: cmpHiveNodeCard.HealthColor,
                        Progress: cmpHiveNodeCard.Progress,
                        TrendDirection: cmpHiveNodeCard.TrendDirection,
                        PressureLevel: cmpHiveNodeCard.PressureLevel,
                        Total: cmpHiveNodeCard.Total,
                        Overdue: cmpHiveNodeCard.Overdue,
                        Blocked: cmpHiveNodeCard.Blocked,
                        AtRisk: cmpHiveNodeCard.AtRisk
                    }
                )
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(15,23,42,0.05)
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            RadiusTopLeft: =18
            RadiusTopRight: =18
            Size: =15
            Text: =
            Width: =Parent.Width
            ZIndex: =21

