cmp_SearchBox As CanvasComponent:
    OnClear():
        ThisProperty:
            Default: =
    OnSearchChange():
        ThisProperty:
            Default: =
    AccentColor: |-
        =ColorValue("#1677FF")
    BackgroundColor: |-
        =ColorValue("#FFFFFF")
    BorderColor: |-
        =ColorValue("#E2E8F0")
    ChildTabPriority: =true
    ContentLanguage: =""
    DefaultSearchText: =""
    EnableChildFocus: =true
    Fill: =RGBA(0, 0, 0, 0)
    HasSearch: =!IsBlank(Trim(varSB_Search))
    Height: =44
    MutedTextColor: |-
        =ColorValue("#64748B")
    OnReset: |-
        =
        Set(varSB_Search, cmp_SearchBox.DefaultSearchText)
    Placeholder: ="Search..."
    SearchText: =varSB_Search
    ShowClearIcon: =true
    ShowSearchIcon: =true
    TextColor: |-
        =ColorValue("#0F172A")
    Visible: =true
    Width: =320
    X: =0
    Y: =0

    conSB_Root As groupContainer.manualLayoutContainer:
        BorderColor: =cmp_SearchBox.BorderColor
        BorderThickness: =1
        Fill: =cmp_SearchBox.BackgroundColor
        Height: =Parent.Height
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        RadiusBottomLeft: =10
        RadiusBottomRight: =10
        RadiusTopLeft: =10
        RadiusTopRight: =10
        Width: =Parent.Width
        ZIndex: =1

        icoSB_Search As icon:
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =cmp_SearchBox.MutedTextColor
            DisabledBorderColor: =RGBA(245, 245, 245, 1)
            DisabledColor: =RGBA(225, 223, 221, 1)
            DisabledFill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =4
            Height: =18
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =cmp_SearchBox.AccentColor
            HoverFill: =RGBA(0, 0, 0, 0)
            Icon: =Icon.Search
            OnSelect: =Select(txtSB_Search)
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =cmp_SearchBox.AccentColor
            PressedFill: =RGBA(0, 0, 0, 0)
            Visible: =cmp_SearchBox.ShowSearchIcon
            Width: =18
            X: =14
            Y: =(Parent.Height - Self.Height) / 2
            ZIndex: =1

        txtSB_Search As modernTextInput:
            Appearance: =Appearance.Outline
            BorderStyle: =""
            Default: =varSB_Search
            Font: =""
            Height: =Parent.Height - 8
            OnChange: |-
                =
                Set(varSB_Search, Self.Text);
                cmp_SearchBox.OnSearchChange()
            Placeholder: =cmp_SearchBox.Placeholder
            Required: =false
            TriggerOutput: =TriggerOutput.Keypress
            ValidationState: =ValidationState.None
            Width: =Parent.Width - If(cmp_SearchBox.ShowSearchIcon, 52, 20) - If(cmp_SearchBox.ShowClearIcon, 42, 0)
            X: =If(cmp_SearchBox.ShowSearchIcon, 42, 10)
            Y: =4
            ZIndex: =2

        icoSB_Clear As icon:
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =cmp_SearchBox.MutedTextColor
            DisabledBorderColor: =RGBA(245, 245, 245, 1)
            DisabledColor: =RGBA(225, 223, 221, 1)
            DisabledFill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =4
            Height: =18
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =cmp_SearchBox.AccentColor
            HoverFill: =RGBA(0, 0, 0, 0)
            Icon: =Icon.Cancel
            OnSelect: |-
                =
                Set(varSB_Search, "");
                Reset(txtSB_Search);
                cmp_SearchBox.OnClear();
                cmp_SearchBox.OnSearchChange()
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =cmp_SearchBox.AccentColor
            PressedFill: =RGBA(0, 0, 0, 0)
            Visible: =cmp_SearchBox.ShowClearIcon && !IsBlank(Trim(varSB_Search))
            Width: =18
            X: =Parent.Width - 30
            Y: =(Parent.Height - Self.Height) / 2
            ZIndex: =3

