cmp_SidebarNav As CanvasComponent:
    OnSelectItem():
        ThisProperty:
            Default: |
                =
    OnToggleCollapse():
        ThisProperty:
            Default: =
    ActiveKey: =varAppView
    AppVersion: ="Text"
    EnvironmentLabel: ="Text"
    Fill: =RGBA(15, 23, 42, 1)
    Height: =App.Height
    IsCollapsed: =true
    Items: |-
        =
        
        Table(
            {
                Order: 10,
                Key: "Home",
                Label: "Home",
                IconKey: "Home"
            }
        )
    NavItems: |-
        =
        
        Table(
            {
                Order: 10,
                Key: "Home",
                Label: "Home",
                IconKey: "Home"
            }
        )
    ProjectCode: ="Text"
    ProjectName: ="Text"
    SelectedItemKey: =Coalesce(varSidebar_SelectedKey, galNavMain.Selected.Key, "")
    SelectedKey: |
        =Coalesce(varSidebar_SelectedKey, galNavMain.Selected.Key, "")
    UserRole: ="Text"
    Width: =154
    X: =0
    Y: =0
    ZIndex: =1

    conNavRoot As groupContainer.verticalAutoLayoutContainer:
        BorderColor: =RGBA(45,48,56,1)
        DropShadow: =DropShadow.Light
        Fill: |-
            =ColorValue("#07111F")
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Center
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGap: =4
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        PaddingBottom: =10
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        RadiusTopLeft: =4
        RadiusTopRight: =4
        Width: = Parent.Width
        ZIndex: =1

        conNavTop As groupContainer.verticalAutoLayoutContainer:
            AlignInContainer: =AlignInContainer.SetByContainer
            FillPortions: =0
            Height: =116
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutJustifyContent: =LayoutJustifyContent.Center
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            LayoutMode: =LayoutMode.Auto
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Width: =Parent.Width
            ZIndex: =1

            Image2 As image:
                BorderColor: =RGBA(0, 0, 0, 0)
                BorderStyle: =BorderStyle.None
                BorderThickness: =2
                DisabledBorderColor: =RGBA(0, 0, 0, 0)
                DisabledFill: =RGBA(0, 0, 0, 0)
                FocusedBorderThickness: =4
                Height: =120
                HoverBorderColor: =RGBA(0, 0, 0, 0)
                HoverFill: =RGBA(0, 0, 0, 0)
                Image: ='PULSE_logo_sidebar_final_04-removebg-preview'
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                PaddingLeft: =10
                PaddingRight: =10
                PressedBorderColor: =RGBA(0, 0, 0, 0)
                PressedFill: =RGBA(0, 0, 0, 0)
                Width: =Parent.Width
                ZIndex: =1

        conNavMenu As groupContainer.verticalAutoLayoutContainer:
            AlignInContainer: =AlignInContainer.SetByContainer
            Height: =Parent.Height - conNavTop.Height - conSidebarFooter.Height - 16
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            LayoutMode: =LayoutMode.Auto
            PaddingBottom: =8
            PaddingLeft: =6
            PaddingRight: =6
            PaddingTop: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Width: |
                =Parent.Width
            ZIndex: =2

            galNavMain As gallery.galleryVertical:
                BorderColor: =RGBA(245, 245, 245, 1)
                DelayItemLoading: =true
                FillPortions: =0
                Height: =CountRows(Self.AllItems) * Self.TemplateHeight
                Items: |-
                    =
                    
                    SortByColumns(
                        cmp_SidebarNav.NavItems,
                        "Order",
                        SortOrder.Ascending
                    )
                Layout: =Layout.Vertical
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                LoadingSpinner: =LoadingSpinner.Data
                OnSelect: |+
                    =
                    Set(varSidebar_SelectedKey, ThisItem.Key);
                    cmp_SidebarNav.OnSelectItem()
                    
                ShowScrollbar: =false
                TemplateFill: |-
                    =
                    If(
                        Lower(Text(ThisItem.Key)) = Lower(Text(cmp_SidebarNav.ActiveKey)),
                        ColorValue("#0E3A63"),
                        RGBA(0,0,0,0)
                    )
                TemplatePadding: =2
                TemplateSize: =48
                Width: =Parent.Width
                ZIndex: =1

                icoNavItem As icon.Add:
                    BorderColor: =RGBA(0, 0, 0, 0)
                    Color: |-
                        =
                        
                        
                        If(
                            Lower(Text(ThisItem.Key)) = Lower(Text(cmp_SidebarNav.ActiveKey)),
                            Color.White,
                            ColorValue("#D7E3F4")
                        )
                    DisabledBorderColor: =RGBA(245, 245, 245, 1)
                    DisabledColor: =RGBA(225, 223, 221, 1)
                    DisabledFill: =RGBA(0, 0, 0, 0)
                    FocusedBorderThickness: =8
                    Height: =22
                    HoverBorderColor: =RGBA(0, 0, 0, 0)
                    HoverColor: =RGBA(255, 255, 255, 1)
                    HoverFill: =RGBA(0, 0, 0, 0)
                    Icon: |-
                        =
                        
                        Switch(
                            ThisItem.IconKey,
                        
                            "Home", Icon.Home,
                        	
                            "Trending", Icon.Trending,
                        	
                            "Document", Icon.Document,
                        	
                            "Flag", Icon.Flag,
                        
                            "Message", Icon.Message,
                        
                            "Settings", Icon.Settings,
                        
                            "Lock", Icon.Lock,
                        
                            "Chart", Icon.TrendingUpwards,
                        	
                        	
                            Icon.Home
                        )
                    OnSelect: =Select(Parent)
                    PressedBorderColor: =RGBA(0, 0, 0, 0)
                    PressedColor: =RGBA(16, 110, 190, 1)
                    PressedFill: =RGBA(0, 0, 0, 0)
                    Width: =22
                    X: =14
                    Y: =12
                    ZIndex: =2

                lblNavItem As label:
                    BorderColor: =RGBA(0, 0, 0, 0)
                    BorderStyle: =BorderStyle.None
                    BorderThickness: =2
                    Color: |-
                        =
                        
                        
                        If(
                            Lower(Text(ThisItem.Key)) = Lower(Text(cmp_SidebarNav.ActiveKey)),
                            Color.White,
                            ColorValue("#D7E3F4")
                        )
                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                    DisabledColor: =RGBA(161, 159, 157, 1)
                    FocusedBorderThickness: =4
                    Font: =Font.'Segoe UI'
                    FontWeight: |-
                        =
                        If(
                            ThisItem.Key = cmp_SidebarNav.ActiveKey,
                            FontWeight.Semibold,
                            FontWeight.Normal
                        )
                    Height: =Parent.TemplateHeight
                    OnSelect: =Select(Parent)
                    Size: =11
                    Text: =ThisItem.Label
                    Width: =Parent.TemplateWidth - 52
                    Wrap: =false
                    X: =42
                    ZIndex: =3

                recNavActiveBar As rectangle:
                    BorderColor: =RGBA(0, 0, 0, 0)
                    BorderStyle: =BorderStyle.None
                    BorderThickness: =2
                    DisabledFill: =RGBA(161, 159, 157, 1)
                    Fill: |-
                        =ColorValue("#00C8FF")
                    FocusedBorderThickness: =4
                    Height: =Parent.TemplateHeight - 8
                    HoverFill: =RGBA(0, 120, 212, 1)
                    PressedFill: =RGBA(0, 120, 212, 1)
                    Visible: =Lower(Text(ThisItem.Key)) = Lower(Text(cmp_SidebarNav.ActiveKey))
                    Width: =3
                    X: =1
                    Y: =4
                    ZIndex: =4

                btnNavHitArea As button:
                    BorderColor: =RGBA(0, 0, 0, 0)
                    BorderStyle: =BorderStyle.None
                    BorderThickness: =0
                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                    DisabledColor: =RGBA(161, 159, 157, 1)
                    DisabledFill: =RGBA(242, 242, 241, 0)
                    Fill: =RGBA(0,0,0,0)
                    Font: =Font.'Segoe UI'
                    FontWeight: =FontWeight.Semibold
                    Height: =Parent.TemplateHeight
                    HoverBorderColor: =RGBA(0, 0, 0, 0)
                    HoverColor: =RGBA(255, 255, 255, 1)
                    HoverFill: =RGBA(0,0,0,0)
                    OnSelect: =Select(Parent)
                    PressedBorderColor: =RGBA(0, 69, 120, 1)
                    PressedColor: =RGBA(255, 255, 255, 1)
                    PressedFill: =RGBA(0,0,0,0)
                    RadiusBottomLeft: =0
                    RadiusBottomRight: =0
                    RadiusTopLeft: =0
                    RadiusTopRight: =0
                    Size: =15
                    Text: =
                    Width: =Parent.TemplateWidth
                    ZIndex: =5

        conSidebarFooter As groupContainer.verticalAutoLayoutContainer:
            Fill: |-
                =ColorValue("#061322")
            FillPortions: =0
            Height: =122
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =2
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            LayoutMode: =LayoutMode.Auto
            PaddingBottom: =12
            PaddingLeft: =14
            PaddingRight: =14
            PaddingTop: =12
            Width: =Parent.Width
            ZIndex: =3

            lblFooterProjectTitle As modernText:
                Color: =RGBA(120,150,180,1)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =24
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                Size: =9
                Text: ="CURRENT PROJECT"
                ZIndex: =1

            lblFooterProjectCode As modernText:
                AutoHeight: =true
                Color: =Color.White
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =24
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                Text: |-
                    =
                    If(
                        IsBlank(cmp_SidebarNav.ProjectCode),
                        "No project",
                        cmp_SidebarNav.ProjectCode
                    )
                Wrap: =false
                ZIndex: =2

            lblFooterProjectName As modernText:
                AutoHeight: =true
                Color: =RGBA(190,210,230,1)
                Font: =Font.'Segoe UI'
                Height: =20
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                Size: =9
                Text: |-
                    =
                    
                    
                    If(
                        IsBlank(cmp_SidebarNav.ProjectName),
                        "Select project",
                        cmp_SidebarNav.ProjectName
                    )
                Wrap: =false
                ZIndex: =3

            recFooterDivider As rectangle:
                BorderColor: =RGBA(0, 0, 0, 0)
                BorderStyle: =BorderStyle.None
                BorderThickness: =2
                DisabledFill: =RGBA(161, 159, 157, 1)
                Fill: =RGBA(255,255,255,0.08)
                FocusedBorderThickness: =4
                Height: =1
                HoverFill: =RGBA(0, 120, 212, 1)
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                PressedFill: =RGBA(0, 120, 212, 1)
                Width: =Parent.Width
                ZIndex: =4

            lblFooterVersion As modernText:
                AutoHeight: =true
                Color: =RGBA(120,140,160,1)
                Font: =Font.'Segoe UI'
                Height: =18
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                Size: =8
                Text: ="PULSE  · v1.0 " 
                Wrap: =false
                ZIndex: =5

