        =
        
        Set(varDrawerProjectId, Self.ProjectId);
        Set(varDrawerEntityType, Self.EntityType);
        Set(varDrawerRecordId, Self.RecordId);
        
        // Variables tipadas
        Set(varCT_Error, "");
        Set(varCT_IsLoading, false);
        Set(varCT_IsSaving, false);
        Set(varCT_IsDirty, false);
        Set(varCT_LoadKey, "");
        
        // Crear colección vacía de forma segura
        Clear(colCT_Merged);
        Clear(colCT_Dirty);
        Clear(colCT_Quick);
        
        
        ClearCollect(
            colCT_Dirty,
            {
                FieldKey: "",
                FieldType: "",
                ValueText: "",
                ValueNumber: Blank(),
                ValueDate: Blank(),
                ValueBool: false,
                ValueJson: ""
            }
        );
        RemoveIf(colCT_Dirty, FieldKey = "");
