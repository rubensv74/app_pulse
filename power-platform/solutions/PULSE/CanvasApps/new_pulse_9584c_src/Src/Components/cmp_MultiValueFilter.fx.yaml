cmp_MultiValueFilter As CanvasComponent:
    OnClose():
        ThisProperty:
            Default: =
    AccentColor: |-
        =ColorValue("#1677FF")
    BackgroundColor: |-
        =ColorValue("#FFFFFF")
    BorderColor: |-
        =ColorValue("#E2E8F0")
    Fill: =RGBA(0, 0, 0, 0)
    HasInvalidCodes: =CountRows(varMVF_Invalid) > 0
    Height: =456
    InvalidCodes: =varMVF_Invalid
    ItemCode: ="Text"
    ItemDisplay: ="Text"
    ItemId: ="Text"
    Items: |-
        =Table(
            {
                Id: "",
                Code: "",
                Display: "",
                SortOrder: 0
            }
        )
    ItemSortOrder: =100
    MaxVisibleChips: =100
    MutedTextColor: |-
        =ColorValue("#64748B")
    OnReset: |-
        =
        
        Set(varMVF_Open, false);
        Set(varMVF_Search, "");
        
        ClearCollect(
            varMVF_Selected,
            FirstN(
                Table(
                    {
                        Id: "",
                        Code: "",
                        Display: "",
                        SortOrder: 0
                    }
                ),
                0
            )
        );
        
        ClearCollect(
            varMVF_Invalid,
            FirstN(
                Table({ Code: "" }),
                0
            )
        )
    Placeholder: ="Text"
    SelectedCodesCRLF: =Concat(varMVF_Selected, Code, Char(10))
    SelectedCodesCSV: =Concat(varMVF_Selected, Code, ",")
    SelectedCount: =CountRows(varMVF_Selected)
    SelectedItems: =varMVF_Selected
    TextColor: |-
        =ColorValue("#0F172A")
    Title: ="Text"
    Width: =360
    X: =0
    Y: =0
    ZIndex: =1

    conMVF_Panel As groupContainer.manualLayoutContainer:
        BorderColor: |-
            =ColorValue("#E2E8F0")
        BorderThickness: =1
        DropShadow: =DropShadow.Semibold
        Fill: =cmp_MultiValueFilter.BackgroundColor
        Height: =Parent.Height - 80
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        PaddingLeft: =2
        PaddingRight: =2
        RadiusBottomLeft: =12
        RadiusBottomRight: =12
        Width: =Parent.Width - 16
        X: =8
        Y: =72
        ZIndex: =1

        btnMVF_Clear As modernButton:
            Appearance: =ButtonAppearance.Secondary
            BorderColor: =cmp_MultiValueFilter.TextColor
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =1
            Color: =cmp_MultiValueFilter.TextColor
            Height: =36
            OnSelect: |-
                =
                ClearCollect(
                    varMVF_Selected,
                    FirstN(
                        Table(
                            {
                                Id: "",
                                Code: "",
                                Display: "",
                                SortOrder: 0
                            }
                        ),
                        0
                    )
                );
                
                ClearCollect(
                    varMVF_Invalid,
                    FirstN(
                        Table({ Code: "" }),
                        0
                    )
                );
                
                Set(varMVF_Search, "");
                
                Reset(txtMVF_Search);
                Reset(txtMVF_Paste);
                Reset(galMVF_Items)
            Text: ="Clear"
            Width: =(Parent.Width - 44) / 2
            X: =16
            Y: =Parent.Height - 48
            ZIndex: =1

        lblMVF_Validation As modernText:
            Color: |-
                =If(
                    CountRows(varMVF_Invalid) > 0,
                    ColorValue("#EA580C"),
                    ColorValue("#16A34A")
                )
            Height: =16
            Size: =9
            Text: |-
                =If(
                    CountRows(varMVF_Selected) = 0 && CountRows(varMVF_Invalid) = 0,
                    "",
                    CountRows(varMVF_Selected) & " selected" &
                    If(
                        CountRows(varMVF_Invalid) > 0,
                        " · " & CountRows(varMVF_Invalid) & " not found",
                        ""
                    )
                )
            Width: =Parent.Width - 32
            X: =16
            Y: =Parent.Height - 72
            ZIndex: =2

        btnMVF_ApplyPaste As modernButton:
            BorderThickness: =0
            Color: =Color.White
            Height: =36
            OnSelect: |-
                =If(
                    IsBlank(Trim(txtMVF_Paste.Text)),
                
                    Reset(txtMVF_Paste);
                    cmp_MultiValueFilter.OnClose(),
                
                    With(
                        {
                            _rawCodes:
                                ForAll(
                                    Split(
                                        Substitute(
                                            Substitute(
                                                Substitute(txtMVF_Paste.Text, Char(13), ""),
                                                ";",
                                                Char(10)
                                            ),
                                            ",",
                                            Char(10)
                                        ),
                                        Char(10)
                                    ),
                                    { Code: Upper(Trim(Value)) }
                                )
                        },
                        With(
                            {
                                _cleanCodes:
                                    Distinct(
                                        Filter(_rawCodes, !IsBlank(Code)),
                                        Code
                                    )
                            },
                            ClearCollect(
                                varMVF_Selected,
                                Filter(
                                    cmp_MultiValueFilter.Items,
                                    Code in _cleanCodes.Value
                                )
                            );
                
                            ClearCollect(
                                varMVF_Invalid,
                                RenameColumns(
                                    Filter(
                                        _cleanCodes,
                                        !(Value in cmp_MultiValueFilter.Items.Code)
                                    ),
                                    Value,
                                    Code
                                )
                            );
                
                            Reset(txtMVF_Paste);
                            cmp_MultiValueFilter.OnClose()
                        )
                    )
                )
            Text: ="Apply"
            Width: =(Parent.Width - 44) / 2
            X: =btnMVF_Clear.X + btnMVF_Clear.Width + 12
            Y: =Parent.Height - 48
            ZIndex: =3

        txtMVF_Paste As text:
            BorderColor: =RGBA(245, 245, 245, 1)
            BorderThickness: =2
            Color: =RGBA(50, 49, 48, 1)
            Default: =
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            FocusedBorderThickness: =4
            Font: =Font.'Segoe UI'
            Height: =64
            HintText: ="Paste subsystem codes, one per line"
            HoverBorderColor: =RGBA(16, 110, 190, 1)
            HoverColor: =RGBA(50, 49, 48, 1)
            HoverFill: =RGBA(255, 255, 255, 1)
            Mode: =TextMode.MultiLine
            PressedBorderColor: =RGBA(0, 120, 212, 1)
            PressedColor: =RGBA(50, 49, 48, 1)
            PressedFill: =RGBA(255, 255, 255, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Width: =Parent.Width - 32
            X: =16
            Y: =galMVF_Items.Y + galMVF_Items.Height + 12
            ZIndex: =4

        "galMVF_Items As gallery.'BrowseLayout_Vertical_OneTextVariant_ver5.0'":
            BorderColor: =RGBA(245, 245, 245, 1)
            DelayItemLoading: =true
            Height: =170
            Items: |-
                =
                SortByColumns(
                    Filter(
                        cmp_MultiValueFilter.Items,
                        IsBlank(txtMVF_Search.Text) ||
                        StartsWith(Display, txtMVF_Search.Text) ||
                        StartsWith(Code, txtMVF_Search.Text)
                    ),
                    "SortOrder",
                    SortOrder.Ascending,
                    "Display",
                    SortOrder.Ascending
                )
            Layout: =Layout.Vertical
            LoadingSpinner: =LoadingSpinner.Data
            TemplatePadding: =0
            TemplateSize: =44
            Width: =Parent.Width - 32
            X: =16
            Y: =txtMVF_Search.Y + txtMVF_Search.Height + 12
            ZIndex: =5

            chkMVF_Item As checkbox:
                BorderColor: =RGBA(0, 0, 0, 0)
                BorderStyle: =BorderStyle.None
                BorderThickness: =2
                CheckboxBorderColor: =RGBA(96, 94, 92, 1)
                CheckmarkFill: =RGBA(0, 120, 212, 1)
                Color: =RGBA(50, 49, 48, 1)
                Default: =ThisItem.Code in varMVF_Selected.Code
                DisabledBorderColor: =RGBA(0, 0, 0, 0)
                DisabledColor: =RGBA(161, 159, 157, 1)
                FocusedBorderThickness: =4
                Font: =Font.'Segoe UI'
                Height: =32
                HoverBorderColor: =RGBA(0, 0, 0, 0)
                HoverColor: =RGBA(50, 49, 48, 1)
                HoverFill: =RGBA(0, 0, 0, 0)
                OnCheck: |-
                    =
                    If(
                        IsBlank(
                            LookUp(
                                varMVF_Selected,
                                Code = ThisItem.Code
                            )
                        ),
                        Collect(
                            varMVF_Selected,
                            {
                                Id: ThisItem.Id,
                                Code: ThisItem.Code,
                                Display: ThisItem.Display,
                                SortOrder: ThisItem.SortOrder
                            }
                        )
                    )
                OnSelect: =Select(Parent)
                OnUncheck: |-
                    =
                    
                    
                    RemoveIf(
                        varMVF_Selected,
                        Code = ThisItem.Code
                    )
                PressedBorderColor: =RGBA(0, 0, 0, 0)
                PressedColor: =RGBA(50, 49, 48, 1)
                PressedFill: =RGBA(0, 0, 0, 0)
                Size: =13
                Text: =
                Width: =36
                Y: =8
                ZIndex: =7

            lblMVF_Item As modernText:
                Color: =cmp_MultiValueFilter.TextColor
                Height: =36
                OnSelect: =Select(Parent)
                Size: =11
                Text: =ThisItem.Display
                Width: =Parent.TemplateWidth - 40
                X: =39
                Y: =4
                ZIndex: =8

        txtMVF_Search As modernTextInput:
            Appearance: =Appearance.Outline
            Default: =varMVF_Search
            Height: =38
            OnChange: =Set(varMVF_Search, Self.Text)
            Placeholder: ="Search subsystems..."
            TriggerOutput: =TriggerOutput.Keypress
            ValidationState: =ValidationState.None
            Width: =Parent.Width - 32
            X: =16
            Y: =16
            ZIndex: =6

    conMVF_ChipsArea As groupContainer.manualLayoutContainer:
        DropShadow: =DropShadow.Light
        Fill: =Color.Transparent
        Height: =32
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        PaddingLeft: =2
        PaddingRight: =2
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        RadiusTopLeft: =4
        RadiusTopRight: =4
        Visible: =false //CountRows(varMVF_Selected) > 0
        Width: =Parent.Width - 32
        X: =16
        Y: =56
        ZIndex: =2

        "galMVF_Chips As gallery.'BrowseLayout_Horizontal_TwoTextOneImageVariant_ver5.0'":
            BorderColor: =RGBA(245, 245, 245, 1)
            DelayItemLoading: =true
            Height: =32
            Items: =FirstN(varMVF_Selected, cmp_MultiValueFilter.MaxVisibleChips)
            LoadingSpinner: =LoadingSpinner.Data
            TemplatePadding: =0
            TemplateSize: =96
            Width: =Parent.Width - 48
            ZIndex: =1

            lblMVF_Chip As label:
                Color: =RGBA(96, 94, 92, 1)
                DisabledColor: =RGBA(161, 159, 157, 1)
                Font: =Font.'Segoe UI'
                FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                Height: =Self.Size * 1.8
                OnSelect: =Select(Parent)
                PaddingBottom: =0
                PaddingLeft: =12
                PaddingRight: =0
                PaddingTop: =0
                Size: =12
                Text: =ThisItem.Code
                VerticalAlign: =VerticalAlign.Top
                Width: =100
                ZIndex: =3

            icoMVF_RemoveChip As icon.Cancel:
                BorderColor: =RGBA(0, 0, 0, 0)
                Color: =RGBA(0, 120, 212, 1)
                DisabledBorderColor: =RGBA(245, 245, 245, 1)
                DisabledColor: =RGBA(225, 223, 221, 1)
                DisabledFill: =RGBA(0, 0, 0, 0)
                FocusedBorderThickness: =4
                HoverBorderColor: =RGBA(0, 0, 0, 0)
                HoverColor: =RGBA(16, 110, 190, 1)
                HoverFill: =RGBA(0, 0, 0, 0)
                Icon: =Icon.Cancel
                OnSelect: |-
                    =Set(
                        varMVF_Selected,
                        Filter(
                            varMVF_Selected,
                            Code <> ThisItem.Code
                        )
                    )
                PressedBorderColor: =RGBA(0, 0, 0, 0)
                PressedColor: =RGBA(16, 110, 190, 1)
                PressedFill: =RGBA(0, 0, 0, 0)
                ZIndex: =4

            lblMVF_More As modernText:
                Height: =24
                OnSelect: =Select(Parent)
                Text: = "+" & CountRows(varMVF_Selected) - cmp_MultiValueFilter.MaxVisibleChips
                Visible: = CountRows(varMVF_Selected) > cmp_MultiValueFilter.MaxVisibleChips
                Width: =40
                X: =Parent.Width - 44
                Y: =4
                ZIndex: =5

    conMVF_Header As groupContainer.manualLayoutContainer:
        BorderColor: |-
            =ColorValue("#E2E8F0")
        BorderThickness: =1
        Fill: |-
            =ColorValue("#FFFFFF")
        Height: =64
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        PaddingLeft: =12
        PaddingRight: =12
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        RadiusTopLeft: =4
        RadiusTopRight: =4
        Width: =Parent.Width - 16
        X: =8
        Y: =8
        ZIndex: =3

        btnMVF_HeaderClick As button:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =Color.Transparent
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =48
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0,0,0,0.03)
            OnSelect: =Set(varPunchSubsystemPopup, false)
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0,0,0,0.06)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =15
            Text: =
            Width: =Parent.Width - 48
            ZIndex: =1

        lblMVF_Title As modernText:
            AutoHeight: =true
            Color: |-
                =ColorValue("#64748B")
            Height: =16
            Size: =10
            Text: =cmp_MultiValueFilter.Title
            Width: =Parent.Width - 48
            X: =16
            Y: =10
            ZIndex: =2

        lblMVF_Summary As modernText:
            AutoHeight: =true
            Color: |-
                =ColorValue("#0F172A")
            FontWeight: =FontWeight.Semibold
            Height: =18
            Size: =11
            Text: |-
                =If(
                    CountRows(varMVF_Selected) = 0,
                    "All subsystems",
                    CountRows(varMVF_Selected) & " selected"
                )
            Width: =Parent.Width - 48
            X: =16
            Y: =30
            ZIndex: =3

        icoMVF_Close As icon.ChevronDown:
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: |-
                =ColorValue("#64748B")
            DisabledBorderColor: =RGBA(245, 245, 245, 1)
            DisabledColor: =RGBA(225, 223, 221, 1)
            DisabledFill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =4
            Height: =20
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: |-
                =ColorValue("#1677FF")
            HoverFill: =RGBA(0, 0, 0, 0)
            Icon: =Icon.Cancel
            OnSelect: =cmp_MultiValueFilter.OnClose()
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(16, 110, 190, 1)
            PressedFill: =RGBA(0, 0, 0, 0)
            Width: =20
            X: =Parent.Width - 38
            Y: =20
            ZIndex: =4

        rectMVF_HeaderSeparator As rectangle:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =2
            DisabledFill: =RGBA(161, 159, 157, 1)
            Fill: |-
                =ColorValue("#E2E8F0")
            FocusedBorderThickness: =4
            Height: =1
            HoverFill: =RGBA(0, 120, 212, 1)
            PressedFill: =RGBA(0, 120, 212, 1)
            Width: =Parent.Width
            Y: =Parent.Height-1
            ZIndex: =5

