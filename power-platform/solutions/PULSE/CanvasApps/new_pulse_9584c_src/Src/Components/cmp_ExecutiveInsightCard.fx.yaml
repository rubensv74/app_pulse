cmp_ExecutiveInsightCard As CanvasComponent:
    OnSelect():
        ThisProperty:
            Default: =
    BorderColor: |-
        =ColorValue("#E2E8F0")
    Category: ="Operations"
    ChildTabPriority: =true
    ContentLanguage: =""
    DangerColor: |-
        =ColorValue("#DC2626")
    Detail: ="Project indicators remain inside the configured thresholds."
    EnableChildFocus: =true
    Fill: =RGBA(0, 0, 0, 0)
    Height: =128
    InfoColor: |-
        =ColorValue("#1677FF")
    MetricText: ="—"
    MutedTextColor: |-
        =ColorValue("#64748B")
    Severity: ="INFO"
    SurfaceColor: |-
        =ColorValue("#FFFFFF")
    TextColor: |-
        =ColorValue("#0F172A")
    Title: ="No material deviation detected"
    Visible: =true
    WarningColor: |-
        =ColorValue("#D97706")
    Width: =420
    X: =0
    Y: =0

    conEIC_Root As groupContainer.manualLayoutContainer:
        BorderColor: =cmp_ExecutiveInsightCard.BorderColor
        BorderThickness: =1
        Fill: =cmp_ExecutiveInsightCard.SurfaceColor
        Height: =Parent.Height
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        RadiusBottomLeft: =14
        RadiusBottomRight: =14
        RadiusTopLeft: =14
        RadiusTopRight: =14
        Width: =Parent.Width
        ZIndex: =1

        recEIC_Severity As rectangle:
            BorderColor: =RGBA(0,0,0,0)
            Fill: =Switch(Upper(cmp_ExecutiveInsightCard.Severity),"CRITICAL",cmp_ExecutiveInsightCard.DangerColor,"WARNING",cmp_ExecutiveInsightCard.WarningColor,cmp_ExecutiveInsightCard.InfoColor)
            Height: =Parent.Height
            Width: =5
            ZIndex: =1

        lblEIC_Category As modernText:
            AutoHeight: =true
            BorderStyle: =""
            Color: =Switch(Upper(cmp_ExecutiveInsightCard.Severity),"CRITICAL",cmp_ExecutiveInsightCard.DangerColor,"WARNING",cmp_ExecutiveInsightCard.WarningColor,cmp_ExecutiveInsightCard.InfoColor)
            Font: =""
            FontWeight: =FontWeight.Semibold
            Height: =18
            Size: =9
            Text: =Upper(cmp_ExecutiveInsightCard.Category)
            Width: =Parent.Width - 140
            X: =20
            Y: =14
            ZIndex: =2

        lblEIC_Metric As modernText:
            Align: =Align.Right
            AutoHeight: =true
            BorderStyle: =""
            Color: =cmp_ExecutiveInsightCard.TextColor
            Font: =""
            FontWeight: =FontWeight.Bold
            Height: =26
            Size: =16
            Text: =cmp_ExecutiveInsightCard.MetricText
            Width: =100
            X: =Parent.Width - 116
            Y: =10
            ZIndex: =3

        lblEIC_Title As modernText:
            AutoHeight: =true
            BorderStyle: =""
            Color: =cmp_ExecutiveInsightCard.TextColor
            Font: =""
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =12
            Text: =cmp_ExecutiveInsightCard.Title
            Width: =Parent.Width - 40
            X: =20
            Y: =40
            ZIndex: =4

        lblEIC_Detail As modernText:
            AutoHeight: =true
            BorderStyle: =""
            Color: =cmp_ExecutiveInsightCard.MutedTextColor
            Font: =""
            Height: =42
            Size: =9
            Text: =cmp_ExecutiveInsightCard.Detail
            Width: =Parent.Width - 40
            X: =20
            Y: =70
            ZIndex: =5

        btnEIC_Open As button:
            BorderColor: =RGBA(0,0,0,0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Color: =App.Theme.Colors.PrimaryForeground
            DisabledBorderColor: =RGBA(244, 244, 244, 1)
            DisabledColor: =RGBA(166, 166, 166, 1)
            DisabledFill: =RGBA(244, 244, 244, 1)
            Fill: =RGBA(0,0,0,0)
            Font: =App.Theme.Font
            FontWeight: =FontWeight.Semibold
            Height: =Parent.Height
            HoverBorderColor: =App.Theme.Colors.Darker10
            HoverColor: =App.Theme.Colors.PrimaryForeground
            HoverFill: =RGBA(22,119,255,0.035)
            OnSelect: =cmp_ExecutiveInsightCard.OnSelect()
            PressedBorderColor: =App.Theme.Colors.Darker40
            PressedColor: =Self.Color
            PressedFill: =RGBA(22,119,255,0.07)
            Size: =15
            Text: =""
            Width: =Parent.Width
            ZIndex: =6

