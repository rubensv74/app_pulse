    ContentLanguage: =""
    EnableChildFocus: =true
    Fill: =RGBA(0, 0, 0, 0)
    Height: =56
    MutedTextColor: |-
        =ColorValue("#64748B")
    PrimaryText: ="Apply"
    SecondaryText: ="Cancel"
    ShowExport: =true
    ShowMore: =true
    ShowPrimary: =true
    ShowRefresh: =true
    ShowSecondary: =true
    ShowSettings: =true
    ShowTitle: =true
    SurfaceAltColor: |-
        =ColorValue("#F8FAFC")
    TextColor: |-
        =ColorValue("#0F172A")
    Title: ="Actions"
    Visible: =true
    Width: =720
    X: =0
