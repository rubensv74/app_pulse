cmp_ActionToolbar As CanvasComponent:
    OnExport():
        ThisProperty:
            Default: =
    OnMore():
        ThisProperty:
            Default: =
    OnPrimary():
        ThisProperty:
            Default: =
    OnRefresh():
        ThisProperty:
            Default: =
    OnSecondary():
        ThisProperty:
            Default: =
    OnSettings():
        ThisProperty:
            Default: =
    AccentColor: |-
        =ColorValue("#1677FF")
    BackgroundColor: |-
        =ColorValue("#FFFFFF")
    BorderColor: |-
        =ColorValue("#E2E8F0")
