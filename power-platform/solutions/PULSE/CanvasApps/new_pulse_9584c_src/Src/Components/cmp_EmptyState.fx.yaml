cmp_EmptyState As CanvasComponent:
    OnAction():
        ThisProperty:
            Default: =
    AccentColor: |-
        =ColorValue("#1677FF")
    ActionText: ="Refresh"
    BorderColor: |-
        =ColorValue("#E2E8F0")
    ChildTabPriority: =true
    ContentLanguage: =""
    DangerColor: |-
        =ColorValue("#DC2626")
    EnableChildFocus: =true
    Fill: =RGBA(0, 0, 0, 0)
    Height: =260
    Message: ="Refresh the dashboard or review the current filters."
    MutedTextColor: |-
        =ColorValue("#64748B")
    ShowAction: =true
    State: ="EMPTY"
    SurfaceColor: |-
        =ColorValue("#FFFFFF")
    TextColor: |-
        =ColorValue("#0F172A")
    Title: ="No data available"
    Visible: =true
    Width: =720
    X: =0
    Y: =0

    conEST_Root As groupContainer.manualLayoutContainer:
        BorderColor: =cmp_EmptyState.BorderColor
        BorderThickness: =1
        Fill: =cmp_EmptyState.SurfaceColor
        Height: =Parent.Height
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        RadiusBottomLeft: =16
        RadiusBottomRight: =16
        RadiusTopLeft: =16
        RadiusTopRight: =16
        Width: =Parent.Width
        ZIndex: =1

        icoEST_State As icon:
            BorderColor: =RGBA(0,0,0,0)
            Color: =If(Upper(cmp_EmptyState.State)="ERROR",cmp_EmptyState.DangerColor,cmp_EmptyState.AccentColor)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(244, 244, 244, 1)
            Height: =44
            Icon: =Switch(Upper(cmp_EmptyState.State),"ERROR",Icon.Warning,"NO_PROJECT",Icon.Folder,"NO_PERMISSION",Icon.Lock,Icon.Information)
            Width: =44
            X: =(Parent.Width-Self.Width)/2
            Y: =38
            ZIndex: =1

        lblEST_Title As modernText:
            Align: =Align.Center
            AutoHeight: =true
            BorderStyle: =""
            Color: =cmp_EmptyState.TextColor
            Font: =""
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =16
            Text: =cmp_EmptyState.Title
            Width: =Parent.Width-64
            X: =32
            Y: =98
            ZIndex: =2

        lblEST_Message As modernText:
            Align: =Align.Center
            AutoHeight: =true
            BorderStyle: =""
            Color: =cmp_EmptyState.MutedTextColor
            Font: =""
            Height: =42
            Size: =10
            Text: =cmp_EmptyState.Message
            Width: =Parent.Width-120
            X: =60
            Y: =136
            ZIndex: =3

        btnEST_Action As button:
            BorderColor: =RGBA(0,0,0,0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Color: =Color.White
            DisabledBorderColor: =RGBA(244, 244, 244, 1)
            DisabledColor: =RGBA(166, 166, 166, 1)
            DisabledFill: =RGBA(244, 244, 244, 1)
            Fill: =If(Upper(cmp_EmptyState.State)="ERROR",cmp_EmptyState.DangerColor,cmp_EmptyState.AccentColor)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =34
            HoverBorderColor: =App.Theme.Colors.Darker10
            HoverColor: =App.Theme.Colors.PrimaryForeground
            HoverFill: =Self.Fill
            OnSelect: =cmp_EmptyState.OnAction()
            PressedBorderColor: =App.Theme.Colors.Darker40
            PressedColor: =Self.Color
            PressedFill: =Self.Fill
            Size: =10
            Text: =cmp_EmptyState.ActionText
            Visible: =cmp_EmptyState.ShowAction
            Width: =120
            X: =(Parent.Width-Self.Width)/2
            Y: =198
            ZIndex: =4

