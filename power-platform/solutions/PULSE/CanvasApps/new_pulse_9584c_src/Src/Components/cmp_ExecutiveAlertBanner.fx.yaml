cmp_ExecutiveAlertBanner As CanvasComponent:
    OnAction():
        ThisProperty:
            Default: =
    OnDismiss():
        ThisProperty:
            Default: =
    ActionText: ="Retry"
    ChildTabPriority: =true
    ContentLanguage: =""
    DangerColor: |-
        =ColorValue("#DC2626")
    EnableChildFocus: =true
    Fill: =RGBA(0, 0, 0, 0)
    Height: =64
    InfoColor: |-
        =ColorValue("#1677FF")
    Message: ="Some dashboard data may be incomplete."
    Severity: ="WARNING"
    ShowAction: =true
    ShowDismiss: =true
    TextColor: |-
        =ColorValue("#0F172A")
    Title: ="Dashboard warning"
    Visible: =true
    VisibleState: =true
    WarningColor: |-
        =ColorValue("#D97706")
    Width: =900
    X: =0
    Y: =0

    conEAB_Root As groupContainer.manualLayoutContainer:
        BorderColor: =Switch(Upper(cmp_ExecutiveAlertBanner.Severity),"ERROR",cmp_ExecutiveAlertBanner.DangerColor,"WARNING",cmp_ExecutiveAlertBanner.WarningColor,cmp_ExecutiveAlertBanner.InfoColor)
        BorderThickness: =1
        Fill: |-
            =Switch(Upper(cmp_ExecutiveAlertBanner.Severity),"ERROR",ColorValue("#FEF2F2"),"WARNING",ColorValue("#FFF7ED"),ColorValue("#EFF6FF"))
        Height: =Parent.Height
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        RadiusBottomLeft: =12
        RadiusBottomRight: =12
        RadiusTopLeft: =12
        RadiusTopRight: =12
        Visible: =cmp_ExecutiveAlertBanner.VisibleState
        Width: =Parent.Width
        ZIndex: =1

        icoEAB_Severity As icon:
            BorderColor: =RGBA(0,0,0,0)
            Color: =Switch(Upper(cmp_ExecutiveAlertBanner.Severity),"ERROR",cmp_ExecutiveAlertBanner.DangerColor,"WARNING",cmp_ExecutiveAlertBanner.WarningColor,cmp_ExecutiveAlertBanner.InfoColor)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(244, 244, 244, 1)
            Height: =22
            Icon: =If(Upper(cmp_ExecutiveAlertBanner.Severity)="ERROR",Icon.CancelBadge,If(Upper(cmp_ExecutiveAlertBanner.Severity)="WARNING",Icon.Warning,Icon.Information))
            Width: =22
            X: =16
            Y: =21
            ZIndex: =1

        lblEAB_Title As modernText:
            AutoHeight: =true
            BorderStyle: =""
            Color: =cmp_ExecutiveAlertBanner.TextColor
            Font: =""
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =11
            Text: =cmp_ExecutiveAlertBanner.Title
            Width: =Parent.Width - 280
            X: =52
            Y: =10
            ZIndex: =2

        lblEAB_Message As modernText:
            AutoHeight: =true
            BorderStyle: =""
            Color: =cmp_ExecutiveAlertBanner.TextColor
            Font: =""
            Height: =20
            Size: =9
            Text: =cmp_ExecutiveAlertBanner.Message
            Width: =Parent.Width - 280
            X: =52
            Y: =34
            ZIndex: =3

        btnEAB_Action As button:
            BorderColor: =RGBA(0,0,0,0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Color: =Color.White
            DisabledBorderColor: =RGBA(244, 244, 244, 1)
            DisabledColor: =RGBA(166, 166, 166, 1)
            DisabledFill: =RGBA(244, 244, 244, 1)
            Fill: =Switch(Upper(cmp_ExecutiveAlertBanner.Severity),"ERROR",cmp_ExecutiveAlertBanner.DangerColor,"WARNING",cmp_ExecutiveAlertBanner.WarningColor,cmp_ExecutiveAlertBanner.InfoColor)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =32
            HoverBorderColor: =App.Theme.Colors.Darker10
            HoverColor: =App.Theme.Colors.PrimaryForeground
            HoverFill: =Self.Fill
            OnSelect: =cmp_ExecutiveAlertBanner.OnAction()
            PressedBorderColor: =App.Theme.Colors.Darker40
            PressedColor: =Self.Color
            PressedFill: =Self.Fill
            RadiusBottomLeft: =9
            RadiusBottomRight: =9
            RadiusTopLeft: =9
            RadiusTopRight: =9
            Size: =9
            Text: =cmp_ExecutiveAlertBanner.ActionText
            Visible: =cmp_ExecutiveAlertBanner.ShowAction
            Width: =96
            X: =Parent.Width - 154
            Y: =16
            ZIndex: =4

        icoEAB_Dismiss As icon:
            BorderColor: =RGBA(0,0,0,0)
            Color: =cmp_ExecutiveAlertBanner.TextColor
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(244, 244, 244, 1)
            Height: =20
            Icon: =Icon.Cancel
            OnSelect: =cmp_ExecutiveAlertBanner.OnDismiss()
            Visible: =cmp_ExecutiveAlertBanner.ShowDismiss
            Width: =20
            X: =Parent.Width - 38
            Y: =22
            ZIndex: =5

