    btnHome_LoadPendingSubsystems As modernButton:
        OnSelect: |-
            =
            
            If(
                IsBlank(varProjectId) || IsBlank(varSelectedHiveNode.Discipline),
            
                Clear(colHomePendingSubsystems);
                Clear(colHomePendingSubsystems_Staging);
            
                Set(varPendingSubsystemsLoading, false);
                Set(varHomePendingError, "");
            
                Exit()
            );
            
            If(
                varPendingSubsystemsLoading,
                Exit()
            );
            
            Set(varPendingSubsystemsLoading, true);
            Set(varHomePendingError, "");
            
            Clear(colHomePendingSubsystems);
            Clear(colHomePendingSubsystems_Staging);
            
            IfError(
                With(
                    {
                        _resp:
                            Warroom_GetPendingSubsystemsByDiscipline.Run(
                                varProjectId,
                                varSelectedHiveNode.Discipline
                            )
                    },
            
                    ClearCollect(
                        colHomePendingSubsystems_Staging,
                        ForAll(
                            Table(ParseJSON(Coalesce(_resp.result, "[]"))),
                            With(
                                { r: ThisRecord.Value },
                                {
                                    RowNo:
                                        If(
                                            IsBlank(Text(r.RowNo)) || Text(r.RowNo) = "null",
                                            0,
                                            Value(Text(r.RowNo))
                                        ),
            
                                    SubsystemCode: Text(r.SubsystemCode),
                                    Discipline: Text(r.Discipline),
            
                                    Total:
                                        If(
                                            IsBlank(Text(r.Total)) || Text(r.Total) = "null",
                                            0,
                                            Value(Text(r.Total))
                                        ),
            
                                    Done:
                                        If(
                                            IsBlank(Text(r.Done)) || Text(r.Done) = "null",
                                            0,
                                            Value(Text(r.Done))
                                        ),
            
                                    Remaining:
                                        If(
                                            IsBlank(Text(r.Remaining)) || Text(r.Remaining) = "null",
                                            0,
                                            Value(Text(r.Remaining))
                                        ),
            
                                    Progress:
                                        If(
                                            IsBlank(Text(r.Progress)) || Text(r.Progress) = "null",
                                            0,
                                            Value(Text(r.Progress))
                                        ),
            
                                    ProgressStatus: Text(r.ProgressStatus),
            
                                    ProgressColor:
                                        Switch(
                                            Text(r.ProgressStatus),
                                            "Excellent", "#22C55E",
                                            "Good", "#F59E0B",
                                            "In Progress", "#00C8FF",
                                            "Delayed", "#EF4444",
                                            "#64748B"
                                        )
                                }
                            )
                        )
                    )
                ),
            
                Set(varHomePendingError, FirstError.Message)
            );
            
            If(
                IsBlank(varHomePendingError),
            
                ClearCollect(
                    colHomePendingSubsystems,
                    SortByColumns(
                        colHomePendingSubsystems_Staging,
                        "RowNo",
                        SortOrder.Ascending
                    )
                ),
            
                Notify(
                    "Pending subsystems could not be loaded.",
                    NotificationType.Warning
                )
            );
            
            Set(varPendingSubsystemsLoading, false)
        Text: ="Button"
        Visible: =false
        X: =80
        Y: =80
        ZIndex: =5

    btnHome_LoadHive As modernButton:
        OnSelect: |-
            =
            
            Set(varGlobalLoading, true);
            Set(varGlobalLoadingMsg, "Loading Home...");
            Set(varGlobalLoadingSubMsg, "Loading selected project dashboard");
            Set(varGlobalLoadingScope, "HOME");
            
            If(
                IsBlank(varProjectId),
            
                Notify("Please select a project first.", NotificationType.Warning);
            
                Set(varHomeLoading, false);
                Set(varProjectSwitching, false);
                Set(varGlobalLoading, false);
                Set(varGlobalLoadingMsg, "");
                Set(varGlobalLoadingSubMsg, "");
                Set(varGlobalLoadingScope, "");
                Set(varGlobalLoadAction, "");
                Set(varGlobalLoadPending, false);
            
                Exit()
            );
            
            If(
                varHomeLoading,
            
                Exit()
            );
            
            Set(varHomeLoading, true);
            Set(varProjectSwitching, true);
            Set(varHomeError, "");
            Set(varHomeNoData, false);
            Set(varProjectHasHomeData, false);
            Set(varProjectHasReportConfig, false);
            
            Set(varHomeShowOverview, false);
            Set(varHomeShowCards, false);
            Set(varHomeShowRightPanel, false);
            
            Clear(colHomeHiveNodes);
            Clear(colHomeHiveNodesSorted);
            Clear(colHomeLowestProgress);
            
            Clear(colHomeHiveNodes_Staging);
            Clear(colHomeHiveNodesSorted_Staging);
            Clear(colHomeLowestProgress_Staging);
            
            IfError(
                With(
                    {
                        _resp: Warroom_GetHiveNodesByDiscipline.Run(varProjectId)
                    },
                    With(
                        {
                            _obj: ParseJSON(Coalesce(_resp.result, "{}"))
                        },
            
                        If(
                            Text(_obj.success) = "false",
            
                            Set(varHomeNoData, true);
                            Set(varProjectHasHomeData, false);
                            Set(varHomeHiveLoaded, false);
                            Set(varProjectHasReportConfig, false);
            
                            Set(varHomeShowOverview, false);
                            Set(varHomeShowCards, false);
                            Set(varHomeShowRightPanel, true);
            
                            Set(
                                varAppWarning,
                                Coalesce(
                                    Text(_obj.message),
                                    "This project has no published report configuration yet."
                                )
                            ),
            
                            ClearCollect(
                                colHomeHiveNodes_Staging,
                                ForAll(
                                    Table(_obj.result),
                                    With(
                                        { r: ThisRecord.Value },
                                        {
                                            NodeId: Text(r.NodeId),
                                            NodeNo: Text(r.NodeNo),
                                            NodeTitle: Text(r.NodeTitle),
                                            NodeSubtitle: Text(r.NodeSubtitle),
                                            Discipline: Text(r.Discipline),
                                            SubsystemCode: Coalesce(Text(r.SubsystemCode), Text(r.Discipline)),
            
                                            Total:
                                                If(
                                                    IsBlank(Text(r.Total)) || Text(r.Total) = "null",
                                                    0,
                                                    Value(Text(r.Total))
                                                ),
            
                                            Done:
                                                If(
                                                    IsBlank(Text(r.Done)) || Text(r.Done) = "null",
                                                    0,
                                                    Value(Text(r.Done))
                                                ),
            
                                            Remaining:
                                                If(
                                                    IsBlank(Text(r.Remaining)) || Text(r.Remaining) = "null",
                                                    0,
                                                    Value(Text(r.Remaining))
                                                ),
            
                                            Progress:
                                                If(
                                                    IsBlank(Text(r.Progress)) || Text(r.Progress) = "null",
                                                    0,
                                                    Value(Text(r.Progress))
                                                ),
            
                                            ProgressStatus: Text(r.ProgressStatus),
            
                                            SortOrder:
                                                If(
                                                    IsBlank(Text(r.SortOrder)) || Text(r.SortOrder) = "null",
                                                    0,
                                                    Value(Text(r.SortOrder))
                                                ),
            
                                            ProgressColor:
                                                Switch(
                                                    Text(r.ProgressStatus),
                                                    "Excellent", "#22C55E",
                                                    "Good", "#F59E0B",
                                                    "In Progress", "#00C8FF",
                                                    "Delayed", "#EF4444",
                                                    "#64748B"
                                                )
                                        }
                                    )
                                )
                            );
            
                            ClearCollect(
                                colHomeHiveNodesSorted_Staging,
                                SortByColumns(
                                    colHomeHiveNodes_Staging,
                                    "SortOrder",
                                    SortOrder.Ascending
                                )
                            );
            
                            ClearCollect(
                                colHomeLowestProgress_Staging,
                                FirstN(
                                    SortByColumns(
                                        colHomeHiveNodes_Staging,
                                        "Progress",
                                        SortOrder.Ascending,
                                        "Remaining",
                                        SortOrder.Descending
                                    ),
                                    3
                                )
                            )
                        )
                    )
                ),
            
                Set(varHomeError, FirstError.Message)
            );
            
            If(
                !IsBlank(varHomeError),
            
                Set(varHomeNoData, true);
                Set(varProjectHasHomeData, false);
                Set(varProjectHasReportConfig, false);
                Set(varHomeHiveLoaded, false);
            
                Set(varHomeShowOverview, false);
                Set(varHomeShowCards, false);
                Set(varHomeShowRightPanel, true);
            
                Notify(
                    "Home dashboard could not be loaded for this project.",
                    NotificationType.Warning
                ),
            
                If(
                    CountRows(colHomeHiveNodes_Staging) = 0,
            
                    Set(varHomeNoData, true);
                    Set(varProjectHasHomeData, false);
                    Set(varProjectHasReportConfig, false);
                    Set(varHomeHiveLoaded, false);
            
                    Set(varHomeShowOverview, false);
                    Set(varHomeShowCards, false);
                    Set(varHomeShowRightPanel, true);
            
                    If(
                        IsBlank(varAppWarning),
                        Set(
                            varAppWarning,
                            "This project has no published report configuration yet."
                        )
                    ),
            
                    ClearCollect(colHomeHiveNodes, colHomeHiveNodes_Staging);
                    ClearCollect(colHomeHiveNodesSorted, colHomeHiveNodesSorted_Staging);
                    ClearCollect(colHomeLowestProgress, colHomeLowestProgress_Staging);
            
                    Set(varHomeNoData, false);
                    Set(varProjectHasHomeData, true);
                    Set(varProjectHasReportConfig, true);
                    Set(varHomeHiveLoaded, true);
            
                    Set(varHomeShowOverview, true);
                    Set(varHomeShowCards, true);
                    Set(varHomeShowRightPanel, true);
            
                    Set(varHomeLastRefresh, Now())
                )
            );
            
            Set(varHomeLoading, false);
            Set(varProjectSwitching, false);
            Set(varGlobalLoading, false);
            Set(varGlobalLoadingMsg, "");
            Set(varGlobalLoadingSubMsg, "");
            Set(varGlobalLoadingScope, "");
            Set(varGlobalLoadAction, "");
            Set(varGlobalLoadPending, false)
        Text: ="Button"
        Visible: =false
        X: =60
        Y: =60
        ZIndex: =6

    btnHome_ProjectChange_Commit As modernButton:
        OnSelect: |-
            =
            If(
                IsBlank(varPendingProjectId),
            
                Notify("No pending project selected.", NotificationType.Warning);
            
                Set(varProjectSwitching, false);
                Set(varHomeLoading, false);
                Set(varGlobalLoading, false);
                Set(varGlobalLoadingMsg, "");
                Set(varGlobalLoadingSubMsg, "");
                Set(varGlobalLoadingScope, "");
                Set(varGlobalLoadAction, "");
                Set(varGlobalLoadPending, false);
            
                Exit()
            );
            
            Set(
                varSelectedProject,
                LookUp(
                    colEnabledProjectsUI,
                    Value(ProjectId) = Value(varPendingProjectId)
                )
            );
            
            If(
                IsBlank(varSelectedProject) || IsBlank(varSelectedProject.ProjectId),
            
                Notify("Selected project was not found in the enabled projects list.", NotificationType.Error);
            
                Set(varProjectLoaded, false);
                Set(varProjectId, Blank());
                Set(varPendingProjectId, Blank());
            
                Set(varProjectSwitching, false);
                Set(varHomeLoading, false);
                Set(varGlobalLoading, false);
                Set(varGlobalLoadingMsg, "");
                Set(varGlobalLoadingSubMsg, "");
                Set(varGlobalLoadingScope, "");
                Set(varGlobalLoadAction, "");
                Set(varGlobalLoadPending, false);
            
                Exit()
            );
            
            // Project context
            Set(varProjectId, Value(varSelectedProject.ProjectId));
            Set(varProjectCode, Text(varSelectedProject.ProjectCode));
            Set(varProjectName, Text(varSelectedProject.ProjectName));
            Set(varProjectDescription, Text(varSelectedProject.ProjectDescription));
            Set(varProjectLoaded, true);
            Set(varPendingProjectId, Blank());
            
            // Navigation
            Set(varAppView, "Home");
            Set(varPageKey, "HOME");
            Set(varPageTitle, "Home");
            Set(varPageSubtitle, "Project command center");
            Set(varHomeViewMode, "DASHBOARD");
            
            // Reset errors
            Set(varAppError, "");
            Set(varAppWarning, "");
            Set(varHomeError, "");
            Set(varOps_Error, "");
            Set(varCfg_Error, "");
            Set(varHomePendingError, "");
            
            // Reset flags
            Set(varProjectHasHomeData, false);
            Set(varProjectHasReportConfig, false);
            Set(varHomeHiveLoaded, false);
            Set(varHomeNoData, false);
            
            // Reset visibility
            Set(varHomeShowOverview, false);
            Set(varHomeShowCards, false);
            Set(varHomeShowRightPanel, false);
            
            // Reset selected Home entities
            Set(
                varSelectedHiveNode,
                {
                    NodeId: "",
                    NodeNo: "",
                    NodeTitle: "",
                    NodeSubtitle: "",
                    Discipline: "",
                    SubsystemCode: "",
                    Total: 0,
                    Done: 0,
                    Remaining: 0,
                    Progress: 0,
                    ProgressStatus: "",
                    ProgressColor: "",
                    SortOrder: 0
                }
            );
            
            Set(
                varSelectedHiveSubsystem,
                {
                    SubsystemCode: "",
                    Discipline: "",
                    Total: 0,
                    Done: 0,
                    Remaining: 0,
                    Progress: 0,
                    ProgressStatus: "",
                    ProgressColor: ""
                }
            );
            
            // Clear Home collections
            Clear(colHomeHiveNodes);
            Clear(colHomeHiveNodesSorted);
            Clear(colHomeLowestProgress);
            Clear(colHomePendingSubsystems);
            Clear(colHomePendingSubsystems_Staging);
            
            // Reset dependent areas
            Clear(colTasks);
            Clear(colTasks_Staging);
            Clear(colPunches);
            Clear(colPunches_Staging);
            
            // Punch filters reset
            Set(varPunchCatalogs_ProjectId, Blank());
            Clear(colPunchSubsystems_Filter);
            Clear(colPunchTemplates_Filter);
            Clear(colPunchCategories_Filter);
            Clear(colPunchStatuses_Filter);
            Clear(colPunchDisciplines_Filter);
            Clear(colPunchSubcontractors_Filter);
            
            Set(varPunchesLoaded, false);
            Set(varPunches_HasSearched, false);
            Set(varPunches_Page, 1);
            Set(varPunches_TotalPages, 0);
            Set(varPunches_TotalRows, 0);
            
            // Loading state
            Set(varProjectSwitching, true);
            Set(varHomeLoading, false);
            
            Set(varGlobalLoading, true);
            Set(varGlobalLoadingMsg, "Loading Home...");
            Set(varGlobalLoadingSubMsg, "Loading selected project dashboard");
            Set(varGlobalLoadingScope, "HOME");
            
            // Schedule Home load
            Set(varGlobalLoadAction, "LOAD_HOME");
            Set(varGlobalLoadPending, false);
            Set(varGlobalLoadPending, true)
        Text: ="Button"
        Visible: =false
        X: =120
        Y: =120
        ZIndex: =7

