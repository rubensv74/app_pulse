    btnHome_OpenNodeOperations As modernButton:
        OnSelect: |-
            =
            
            If(
                IsBlank(varSelectedHiveSubsystem.SubsystemCode),
            
                Notify("Select a pending subsystem first.", NotificationType.Warning),
            
                Set(varAppView, "Tasks");
            
                Set(varTasks_ContextSource, "Hive");
                Set(varTasks_Filter_Subsystem, varSelectedHiveSubsystem.SubsystemCode);
                Set(varFilter_ElementDiscipline, varSelectedHiveSubsystem.Discipline);
                Set(varFilter_Subcontractor, "");
            
                Set(varTasks_Page, 1);
                Set(varTasks_PageSize, 50);
                Set(varTasks_HasSearched, true);
            
            
            
                Set(varGlobalLoading, true);
                Set(varGlobalLoadingMsg, "Loading Tasks...");
                Set(varGlobalLoadingSubMsg, "Opening subsystem task list");
                Set(varGlobalLoadingScope, "TASKS");
            
                Set(varGlobalLoadAction, "LOAD_TASKS");
                Set(varGlobalLoadPending, true)
            )
        Text: ="Button"
        Visible: =false
        X: =140
        Y: =140
