scr_Home As screen:
    Fill: =varTheme_PageBg
    LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    OnVisible: |+
        =
        // =====================================================
        // scr_App.OnVisible
        // Runtime state only. DO NOT reset selected project here.
        // =====================================================
        
        // Theme / visual tokens
        Set(varHiveColorExcellent, "#22C55E");
        Set(varHiveColorGood, "#F59E0B");
        Set(varHiveColorInProgress, "#00C8FF");
        Set(varHiveColorDelayed, "#EF4444");
        Set(varHiveColorNeutral, "#64748B");
        
        Set(varHiveColorSelected, "#00C8FF");
        Set(varHiveColorCardBg, "#FFFFFF");
        Set(varHiveColorPageBg, "#F6F8FB");
        Set(varHiveColorBorder, "#E2E8F0");
        Set(varHiveColorText, "#0F172A");
        Set(varHiveColorMuted, "#64748B");
        
        Set(varTheme_NavBg, ColorValue("#07111F"));
        Set(varTheme_NavBg2, ColorValue("#0B1220"));
        Set(varTheme_TopBg, ColorValue("#FFFFFF"));
        Set(varTheme_PageBg, ColorValue("#F6F8FB"));
        Set(varTheme_Surface, ColorValue("#FFFFFF"));
        Set(varTheme_SurfaceAlt, ColorValue("#F8FAFC"));
        Set(varTheme_Border, ColorValue("#E2E8F0"));
        Set(varTheme_Text, ColorValue("#0F172A"));
        Set(varTheme_TextMuted, ColorValue("#64748B"));
        Set(varTheme_TextSoft, ColorValue("#94A3B8"));
        Set(varTheme_TextWhite, ColorValue("#FFFFFF"));
        Set(varTheme_PulseBlue, ColorValue("#00C8FF"));
        Set(varTheme_PulseBlueDark, ColorValue("#1677FF"));
        Set(varTheme_PulseSoft, ColorValue("#E0F7FF"));
        Set(varTheme_Green, ColorValue("#22C55E"));
        Set(varTheme_Amber, ColorValue("#F59E0B"));
        Set(varTheme_Red, ColorValue("#EF4444"));
        Set(varTheme_CardRadius, 16);
        Set(varTheme_ButtonRadius, 10);
        
        // Responsive
        Set(varIsMobile, App.Width < 900);
        Set(varIsTablet, App.Width >= 900 && App.Width < 1400);
        Set(varIsDesktop, App.Width >= 1400);
        
        // User
        Set(varCurrentUserEmail, Lower(User().Email));
        Set(varCurrentUserName, User().FullName);
        
        // Navigation defaults only
        If(IsBlank(varAppView), Set(varAppView, "Home"));
        If(IsBlank(varHomeViewMode), Set(varHomeViewMode, "DASHBOARD"));
        If(IsBlank(varOps_ViewMode), Set(varOps_ViewMode, "OVERVIEW"));
        If(IsBlank(varOps_QuickFilter), Set(varOps_QuickFilter, "ALL"));
        
        // Project context: preserve if already selected
        If(
            IsBlank(varProjectId),
            Set(varProjectLoaded, false),
            Set(varProjectLoaded, true)
        );
        
        // Loading states
        
        
        If(
            !varProjectSwitching && !varGlobalLoadPending,
        
            Set(varGlobalLoading, false);
            Set(varGlobalLoadingMsg, "");
            Set(varGlobalLoadingSubMsg, "");
            Set(varGlobalLoadingScope, "");
            Set(varGlobalLoadAction, "");
            Set(varGlobalLoadPending, false);
        
            Set(varLoading, false);
            Set(varLoadingMsg, "");
            Set(varProjectSwitching, false);
            Set(varHomeLoading, false)
        );
        
        
        
        Set(varOps_IsLoading, false);
        Set(varPHR_IsLoading, false);
        Set(varDash_IsLoading, false);
        Set(varExecDashboardLoading, false);
        
        // Error states
        Set(varAppError, "");
        Set(varAppWarning, "");
        Set(varHomeError, "");
        Set(varOps_Error, "");
        Set(varCfg_Error, "");
        Set(varHomePendingError, "");
        
        // UI defaults
        If(IsBlank(varHiveCardWidth), Set(varHiveCardWidth, 330));
        If(IsBlank(varHiveCardHeight), Set(varHiveCardHeight, 215));
        If(IsBlank(varHiveRightPanelWidth), Set(varHiveRightPanelWidth, 326));
        
        If(IsBlank(varHomeShowOverview), Set(varHomeShowOverview, false));
        If(IsBlank(varHomeShowCards), Set(varHomeShowCards, false));
        If(IsBlank(varHomeShowRightPanel), Set(varHomeShowRightPanel, false));
        
        If(IsBlank(varHomeNoData), Set(varHomeNoData, false));
        If(IsBlank(varOverviewNoConfig), Set(varOverviewNoConfig, false));
        If(IsBlank(varOverviewNoData), Set(varOverviewNoData, false));
        
        // Selected objects typed defaults
        Set(varOps_SelectedCellId, 0);
        Set(
            varOps_SelectedCell,
            {
                OperationalCellId: 0,
                ProjectId: 0,
                SubsystemCode: "",
                L1NodeId: "",
                L2NodeId: "",
                L3NodeId: "",
                L1DisplayName: "",
                L2DisplayName: "",
                L3DisplayName: "",
                TotalTasks: 0,
                DoneTasks: 0,
                RemainingTasks: 0,
                ProgressPercent: 0,
                OwnerEmail: "",
                DueDate: Blank(),
                OperationalStatus: "",
                StatusComment: "",
                LastReviewedOn: Blank(),
                LastReviewedBy: "",
                IsOverdue: false,
                AgingDays: 0,
                RefreshedOn: Blank()
            }
        );
        
        If(
            IsBlank(varSelectedHiveNode) || IsBlank(varSelectedHiveNode.NodeId),
            Set(
                varSelectedHiveNode,
                {
                    NodeId: "",
                    NodeNo: "",
                    NodeTitle: "",
                    NodeSubtitle: "",
                    Discipline: "",
                    SubsystemCode: "",
                    Total: 0,
                    Done: 0,
                    Remaining: 0,
                    Progress: 0,
                    ProgressStatus: "",
                    ProgressColor: "",
                    SortOrder: 0
                }
            )
        );
        
        If(
            IsBlank(varSelectedHiveSubsystem) || IsBlank(varSelectedHiveSubsystem.SubsystemCode),
            Set(
                varSelectedHiveSubsystem,
                {
                    SubsystemCode: "",
                    Discipline: "",
                    Total: 0,
                    Done: 0,
                    Remaining: 0,
                    Progress: 0,
                    ProgressStatus: "",
                    ProgressColor: ""
                }
            )
        );
        
        // PHR defaults
        If(IsBlank(varPHR_Page), Set(varPHR_Page, 1));
        If(IsBlank(varPHR_PageSize), Set(varPHR_PageSize, 50));
        If(IsBlank(varPHR_TotalCount), Set(varPHR_TotalCount, 0));
        
        Set(varPHR_ColW, Coalesce(varPHR_ColW, 66));
        Set(varPHR_StatusW, Coalesce(varPHR_StatusW, 56));
        Set(varPHR_SubsysW, Coalesce(varPHR_SubsysW, 170));
        Set(varPHR_ActionsW, Coalesce(varPHR_ActionsW, 92));
        Set(varPHR_LeftFixedW, varPHR_StatusW + varPHR_SubsysW + varPHR_ActionsW);
        
        Set(varPHR_HeaderH1, Coalesce(varPHR_HeaderH1, 28));
        Set(varPHR_HeaderH2, Coalesce(varPHR_HeaderH2, 28));
        Set(varPHR_HeaderH3, Coalesce(varPHR_HeaderH3, 28));
        Set(varPHR_HeaderH4, Coalesce(varPHR_HeaderH4, 32));
        Set(varPHR_RowH, Coalesce(varPHR_RowH, 52));
        
        // No automatic refresh
        Set(varOps_AutoLoadAllowed, false);
        Set(varShowFilters, false);
        Set(varShowMenu, false);
        Set(varCacheEnabled, true);
        Set(varUseCompactMode, false);
        
        Set(varBriefingEmailVisible, false);
        
        // Skyline defaults
        If(IsBlank(varSkylineLoaded), Set(varSkylineLoaded, false));
        If(IsBlank(varSkylineLoading), Set(varSkylineLoading, false));
        If(IsBlank(varSkylineError), Set(varSkylineError, ""));
        If(IsBlank(varSkylineFromDate), Set(varSkylineFromDate, DateAdd(Today(), -7, TimeUnit.Days)));
        If(IsBlank(varSkylinePunchWeight), Set(varSkylinePunchWeight, 3));
        If(IsBlank(varSelectedSkylineMode), Set(varSelectedSkylineMode, "DENSITY"));
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        

    tmrGlobalLoader As timer:
        AutoStart: =varGlobalLoadPending
        BorderColor: =RGBA(0, 120, 212, 1)
        BorderStyle: =BorderStyle.None
        DisabledBorderColor: =RGBA(242, 242, 241, 0)
        DisabledColor: =RGBA(161, 159, 157, 1)
        DisabledFill: =RGBA(242, 242, 241, 0)
        Duration: =150
        Fill: =RGBA(0, 120, 212, 1)
        Font: =Font.'Segoe UI'
        HoverBorderColor: =RGBA(16, 110, 190, 1)
        HoverColor: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(16, 110, 190, 1)
        OnTimerEnd: |-
            =
            
            If(
                IsBlank(varGlobalLoadAction),
            
                Set(varGlobalLoadPending, false),
            
                Set(varGlobalLoadPending, false);
            
                Switch(
                    varGlobalLoadAction,
            
                    "PROJECT_CHANGE",
                        Select(btnHome_ProjectChange_Commit),
            
                    "LOAD_HOME",
                        Select(btnHome_LoadHive),
            
                    "LOAD_TASKS",
                        Set(varGlobalLoading, false);
                        Set(varGlobalLoadingMsg, "");
                        Set(varGlobalLoadingSubMsg, "");
                        Set(varGlobalLoadingScope, "");
                        Set(varGlobalLoadAction, "");
                        Set(varGlobalLoadPending, false),
            
                    Notify(
                        "Home cannot execute action: " & Coalesce(varGlobalLoadAction, "-"),
                        NotificationType.Warning
                    );
            
                    Set(varGlobalLoading, false);
                    Set(varGlobalLoadingMsg, "");
                    Set(varGlobalLoadingSubMsg, "");
                    Set(varGlobalLoadingScope, "");
                    Set(varGlobalLoadAction, "");
                    Set(varGlobalLoadPending, false);
                    Set(varHomeLoading, false);
                    Set(varProjectSwitching, false)
                )
            )
        PressedBorderColor: =RGBA(16, 110, 190, 1)
        PressedColor: =RGBA(255, 255, 255, 1)
        PressedFill: =RGBA(16, 110, 190, 1)
        Visible: =false
        X: =100
        Y: =100
        ZIndex: =1

    conLayer_Drawer As groupContainer.manualLayoutContainer:
        DropShadow: =DropShadow.Light
        Fill: =RGBA(0,0,0,0.25)
        Height: =App.Height
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        RadiusTopLeft: =4
        RadiusTopRight: =4
        Visible: =comp_DetailDrawer.IsOpen
        Width: =App.Width
        ZIndex: =2

        comp_DetailDrawer As cmp_DetailDrawer_old:
            ChildTabPriority: =true
            CloseAction: =Set(varShowDetailDrawer, false)
            ContentLanguage: =""
            EnableChildFocus: =true
            FormCodeText: |-
                =
                
                Coalesce(
                    varDrawerNormalized.TitleValue,
                    "Record " & Text(varDrawerRecordId)
                )
            Height: =768
            IsLoading: =varDrawerIsLoading
            OnManageFieldsRequested: |-
                =
                Set(varCT_ShowManageFields, true);
                
                Set(varCT_DefsSearch, "");
                
                Set(varCT_DefsError, "");
                
                Select(btnCT_LoadDefs)
            OnSaveCustomField: =Select(btnCT_SaveFieldDef);
            OnSaved: =
            OnToggleFieldActiveRequested: =Select(btnCT_SetActive)
            StatusText: |-
                =Coalesce(
                    varDrawerNormalized.StatusValue,
                    ""
                )
            Visible: =varShowDetailDrawer
            Width: =App.Width

        btnDrawerLoad_Custom As Button:
            BasePaletteColor: =
            BorderColor: =
            DisplayMode: =DisplayMode.Edit
            FontColor: =
            Height: =32
            OnSelect: |-
                =
                
                Set(varCT_Loading, true);
                Set(varCT_Error, "");
                
                // Limpieza
                Clear(colCT_Quick);
                Clear(colCT_Merged_Base);
                Clear(colCT_Merged_UI);
                
                // Llamada al flow
                With(
                    {
                        resp: WarRoom_GetCustomBundle.Run(
                            comp_DetailDrawer.ProjectId,
                            comp_DetailDrawer.EntityType,
                            comp_DetailDrawer.RecordId
                        )
                    },
                
                    With(
                        {
                            parsed: ParseJSON(Coalesce(resp.bundlejson, "{}"))
                        },
                
                        // Base (defs)
                        ClearCollect(
                            colCT_Merged_Base,
                            ForAll(
                                Table(parsed.defs),
                                {
                                    FieldKey: Text(ThisRecord.Value.FieldKey),
                                    Label: Text(ThisRecord.Value.Label),
                                    FieldType: Text(ThisRecord.Value.FieldType),
                                    IsRequired: Boolean(ThisRecord.Value.IsRequired),
                                    IsPinned: Boolean(ThisRecord.Value.IsPinned),
                                    SortOrder: Value(ThisRecord.Value.SortOrder),
                                    OptionsJson: Text(ThisRecord.Value.OptionsJson)
                                }
                            )
                        );
                
                        // Valores (values)
                        ClearCollect(
                            colCT_Merged_UI,
                            ForAll(
                                Table(parsed.values),
                                {
                                    FieldKey: Text(ThisRecord.Value.FieldKey),
                                    ValueText: Text(ThisRecord.Value.ValueText),
                                    ValueNumber: Value(ThisRecord.Value.ValueNumber),
                                    ValueDate: If(
                                        !IsBlank(ThisRecord.Value.ValueDate),
                                        DateTimeValue(Text(ThisRecord.Value.ValueDate)),
                                        Blank()
                                    ),
                                    ValueBool: Boolean(ThisRecord.Value.ValueBool)
                                }
                            )
                        )
                    )
                );
                
                // Merge final (lo que pinta la UI)
                ClearCollect(
                    colCT_Quick,
                    AddColumns(
                        colCT_Merged_Base,
                        'CurrentValue',
                        LookUp(colCT_Merged_UI, FieldKey = ThisRecord.FieldKey)
                    )
                );
                
                Set(varCT_Loading, false);
            Visible: =false
            Width: =96
            X: =60
            Y: =60
            ZIndex: =2

        btnDrawerLoad_Comments As Button:
            BasePaletteColor: =
            BorderColor: =
            DisplayMode: =DisplayMode.Edit
            FontColor: =
            Height: =32
            OnSelect: |-
                =Set(varIsLoadingComments, true);
                
                Set(varCommentsPage, 1);
                Set(varCommentsPageSize, Coalesce(varCommentsPageSize, 20));
                
                With(
                    {
                        resp: Warroom_GetTaskCommentsPaged.Run(
                            varProjectId,
                            varDrawerRecordId,
                            varCommentsPage,
                            varCommentsPageSize,
                            varDrawerEntityType
                        )
                    },
                    With(
                        {
                            arr: Table(ParseJSON(Coalesce(resp.result, "[]")))
                        },
                        ClearCollect(
                            colComments,
                            ForAll(
                                arr,
                                {
                                    CommentId: Value(ThisRecord.Value.CommentId),
                                    CommentText: Text(ThisRecord.Value.CommentText),
                                    CommentType: Text(ThisRecord.Value.CommentType),
                                    CreatedOn: DateTimeValue(Text(ThisRecord.Value.CreatedOn)),
                                    CreatedByEmail: Text(ThisRecord.Value.CreatedByEmail),
                                    CreatedByName: Text(ThisRecord.Value.CreatedByName),
                                    TotalRows: Value(ThisRecord.Value.TotalRows),
                                    TotalPages: Value(ThisRecord.Value.TotalPages),
                                    PageNumber: Value(ThisRecord.Value.PageNumber),
                                    PageSize: Value(ThisRecord.Value.PageSize)
                                }
                            )
                        )
                    )
                );
                
                Set(varCommentsTotalRows, If(CountRows(colComments) > 0, First(colComments).TotalRows, 0));
                Set(varCommentsTotalPages, If(CountRows(colComments) > 0, First(colComments).TotalPages, 0));
                
                Set(varIsLoadingComments, false);
                Set(varDrawerIsLoading, false);
            Visible: =false
            Width: =96
            X: =80
            Y: =80
            ZIndex: =3

        btnDrawerLoad As Button:
            AcceptsFocus: =true
            AccessibleLabel: =""
            Align: =""
            Appearance: ="Primary"
            BasePaletteColor: =
            BorderColor: =
            BorderStyle: =""
            ContentLanguage: =""
            DisplayMode: =DisplayMode.Edit
            Font: =""
            FontColor: =
            FontItalic: =false
            FontSize: =0
            FontStrikethrough: =false
            FontUnderline: =false
            FontWeight: =""
            Height: =32
            Icon: =""
            IconRotation: =0
            IconStyle: ="Outline"
            Layout: ="Icon before"
            OnSelect: |-
                =Set(varDrawerIsLoading, true);
                
                Switch(
                    varDrawerTab,
                    "Comments", Select(btnDrawerLoad_Comments),
                    "Custom", Select(btnDrawerLoad_Custom),
                    "Overview", Set(varDrawerIsLoading, false),
                    "History", Set(varDrawerIsLoading, false),
                    Set(varDrawerIsLoading, false)
                );
            TabIndex: =0
            Text: ="Button"
            Tooltip: =""
            VerticalAlign: =""
            Visible: =false
            Width: =96
            X: =40
            Y: =40
            ZIndex: =4

        btnDrawerRefreshFromTab As Button:
            BasePaletteColor: =
            BorderColor: =
            DisplayMode: =DisplayMode.Edit
            FontColor: =
            Height: =32
            OnSelect: |-
                =
                Set(varDrawerTab, "Custom");
                Select(btnDrawerLoad_Custom)
            Visible: =false
            Width: =96
            X: =0
            Y: =0
            ZIndex: =5

        btnCT_LoadDefs As Button:
            BasePaletteColor: =
            BorderColor: =
            DisplayMode: =DisplayMode.Edit
            FontColor: =
            Height: =32
            OnSelect: |-
                =
                Set(varCT_DefsIsLoading, true);
                Set(varCT_DefsError, "");
                
                Clear(colCT_Defs_Admin);
                
                Set(
                    varCT_DefsResp,
                    WarRoom_ListCustomFieldDefs.Run(
                        comp_DetailDrawer.ProjectId,
                        comp_DetailDrawer.EntityType,
                        If(varCT_ShowInactiveDefs, 1, 0)
                    )
                );
                
                
                Set(
                    varCT_DefsOuter,
                    Table(ParseJSON(Coalesce(varCT_DefsResp.result, "[]")))
                );
                
                If(
                    CountRows(varCT_DefsOuter) = 0,
                
                    Set(varCT_DefsError, "The flow returned no data."),
                
                    Set(
                        varCT_DefsBundle,
                        ParseJSON(
                            Text(First(varCT_DefsOuter).Value.result)
                        )
                    );
                
                    ClearCollect(
                        colCT_Defs_Admin,
                        ForAll(
                            Table(varCT_DefsBundle.defs),
                            {
                                FieldDefId: Value(ThisRecord.Value.FieldDefId),
                                ProjectId: Value(ThisRecord.Value.ProjectId),
                                EntityType: Text(ThisRecord.Value.EntityType),
                                FieldKey: Text(ThisRecord.Value.FieldKey),
                                Label: Text(ThisRecord.Value.Label),
                                FieldType: Text(ThisRecord.Value.FieldType),
                                HelpText: Coalesce(Text(ThisRecord.Value.HelpText), ""),
                                IsRequired: Boolean(ThisRecord.Value.IsRequired),
                                IsPinned: Boolean(ThisRecord.Value.IsPinned),
                                IsActive: Boolean(ThisRecord.Value.IsActive),
                                SortOrder: Value(ThisRecord.Value.SortOrder),
                                OptionsJson: Coalesce(Text(ThisRecord.Value.OptionsJson), ""),
                                ModifiedOn: If(
                                    IsBlank(Text(ThisRecord.Value.ModifiedOn)),
                                    Blank(),
                                    DateTimeValue(Text(ThisRecord.Value.ModifiedOn))
                                ),
                                ModifiedByEmail: Coalesce(Text(ThisRecord.Value.ModifiedByEmail), ""),
                                IsFilterable: Boolean(ThisRecord.Value.IsFilterable),
                                ShowInQuickFilters: Boolean(ThisRecord.Value.ShowInQuickFilters),
                                FilterOrder: If(
                                    IsBlank(Text(ThisRecord.Value.FilterOrder)),
                                    Coalesce(Value(ThisRecord.Value.SortOrder), 1000),
                                    Value(ThisRecord.Value.FilterOrder)
                                ),
                                FilterMode: Coalesce(Text(ThisRecord.Value.FilterMode), "Equals")
                            }
                        )
                    )
                );
                
                Set(varCT_DefsIsLoading, false);
            Visible: =false
            Width: =96
            X: =100
            Y: =100
            ZIndex: =6

        btnCT_SetActive As Button:
            BasePaletteColor: =
            BorderColor: =
            DisplayMode: =DisplayMode.Edit
            FontColor: =
            Height: =32
            OnSelect: |-
                =
                
                With(
                    {
                        resp: WarRoom_SetCustomFieldActive.Run(
                            comp_DetailDrawer.ProjectId,
                            comp_DetailDrawer.EntityType,
                            varCT_Toggle_FieldKey,
                            varCT_Toggle_IsActive,
                            comp_DetailDrawer.UserEmail
                        )
                    },
                    Select(btnCT_LoadDefs);
                    Select(btnDrawerLoad_Custom)
                );
            Visible: =false
            Width: =96
            X: =140
            Y: =140
            ZIndex: =8

        btnCT_SaveFieldDef As Button:
            BasePaletteColor: =
            BorderColor: =
            DisplayMode: =DisplayMode.Edit
            FontColor: =
            Height: =32
            OnSelect: |-
                =
                If(
                    IsBlank(Trim(varCT_Edit_Label)),
                    Set(varCT_SaveField_Error, "Label is required.");
                    Set(varCT_SaveField_IsLoading, false),
                
                    IsBlank(Trim(varCT_Edit_FieldKey)),
                    Set(varCT_SaveField_Error, "Field key is required.");
                    Set(varCT_SaveField_IsLoading, false),
                
                    !IsBlank(
                        LookUp(
                            colCT_Defs_Admin,
                            Lower(Trim(FieldKey)) = Lower(Trim(varCT_Edit_FieldKey)) &&
                            FieldDefId <> Coalesce(varCT_Edit_FieldDefId, 0)
                        )
                    ),
                
                    Set(varCT_SaveField_Error, "This Field Key already exists.");
                    Set(varCT_SaveField_IsLoading, false);
                    Notify("This Field Key already exists. Use another key or edit the existing field.", NotificationType.Error),
                
                    Value(varCT_Edit_SortOrder) <= 0,
                    Set(varCT_SaveField_Error, "Sort order must be greater than zero.");
                    Set(varCT_SaveField_IsLoading, false),
                
                    (varCT_Edit_FieldType = "Choice" || varCT_Edit_FieldType = "MultiChoice") && IsBlank(Trim(varCT_Edit_OptionsJson)),
                    Set(varCT_SaveField_Error, "OptionsJson is required for Choice and MultiChoice fields.");
                    Set(varCT_SaveField_IsLoading, false),
                
                    With(
                        {
                            resp: WarRoom_UpsertCustomFieldDef.Run(
                                Coalesce(varCT_Edit_FieldDefId, 0),
                                comp_DetailDrawer.ProjectId,
                                comp_DetailDrawer.EntityType,
                                Trim(varCT_Edit_Label),
                                varCT_Edit_FieldType,
                                Trim(varCT_Edit_HelpText),
                                Value(varCT_Edit_SortOrder),
                                If(IsBlank(Trim(varCT_Edit_OptionsJson)), " ", Trim(varCT_Edit_OptionsJson)),
                                comp_DetailDrawer.UserEmail,
                                Lower(Trim(varCT_Edit_FieldKey)),
                                varCT_Edit_IsRequired,
                                varCT_Edit_IsPinned,
                                varCT_Edit_IsActive,
                                varCT_Edit_IsFilterable,
                varCT_Edit_ShowInQuickFilters,
                Coalesce(varCT_Edit_FilterOrder, varCT_Edit_SortOrder, 1000),
                Coalesce(varCT_Edit_FilterMode, "Equals")
                            )
                        },
                        
                        Set(varShowCustomAddFields, false);
                        Set(varCT_SaveField_Error, "");
                        Set(varCT_SaveField_IsLoading, false);
                
                        Select(btnCT_LoadDefs);
                
                        Set(varCT_LoadKey, "");
                        Select(btnDrawerLoad_Custom);
                
                        Notify("Field definition saved successfully.", NotificationType.Success)
                    )
                )
            Visible: =false
            Width: =96
            X: =160
            Y: =160
            ZIndex: =9

    conHomeScreenRoot As groupContainer.horizontalAutoLayoutContainer:
        DropShadow: =DropShadow.Light
        Height: =App.Height
        LayoutAlignItems: =LayoutAlignItems.Center
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        Width: =App.Width
        ZIndex: =3

        cmp_NavApp As cmp_SidebarNav:
            AppVersion: ="v1.0.0"
            ChildTabPriority: =true
            ContentLanguage: =""
            EnableChildFocus: =true
            Fill: =varTheme_PulseBlue
            Height: =Parent.Height
            Items: =colSidebarNavItems
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =640
            LayoutMinWidth: =640
            NavItems: =colSidebarNavItems
            OnSelectItem: |-
                =
                
                With(
                    {
                        _key: Lower(Trim(Self.SelectedItemKey)),
                        _hasProject: !IsBlank(varProjectId),
                        _hasConfig: varProjectHasReportConfig || varHomeHiveLoaded || varProjectHasPHRData
                    },
                
                    If(
                        _key = "superadmin",
                
                        Set(varGlobalLoading, false);
                        Set(varGlobalLoadingMsg, "");
                        Set(varGlobalLoadingSubMsg, "");
                        Set(varGlobalLoadingScope, "");
                        Set(varGlobalLoadAction, "");
                        Set(varGlobalLoadPending, false);
                
                        Set(varPHR_IsLoading, false);
                        Set(varOps_IsLoading, false);
                        Set(varTasks_IsLoading, false);
                        Set(varPunches_IsLoading, false);
                        Set(varCfg_IsLoading, false);
                
                        Set(varAppView, "SuperAdmin");
                        Set(varPageKey, "SUPERADMIN");
