                                            If(
                                                !IsBlank(varProjectId),
                                                "Skyline based on subsystem milestone forecast dates",
                                                "Select a project from Home"
                                            )
                                          Width: =500
                                          X: =48
                                          Y: =44
                              - conSkyline_RefreshCard:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =varTheme_Surface
                                    FillPortions: =0
