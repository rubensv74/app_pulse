Screens:
  scr_Skyline:
    Properties:
      Fill: =varTheme_PageBg
      LoadingSpinnerColor: =varTheme_PulseBlueDark
      OnVisible: |-
        =
        If(
            !varSkylineLoaded && !varSkylineLoading && !IsBlank(varProjectId),
            Select(btnSkyline_LoadData)
        )
    Children:
      - btnSkyline_LoadData:
          Control: ModernButton@1.0.0
          Properties:
            OnSelect: |-
              =

              Set(varSkylineLoading, true);
              Set(varSkylineError, "");
              Set(varSkylineLoaded, false);

              Set(varGlobalLoading, true);
              Set(varGlobalLoadingMsg, "Loading Delivery Skyline");
              Set(varGlobalLoadingSubMsg, "Reading subsystem milestone forecast");
              Set(varGlobalLoadingScope, "SKYLINE");

              Clear(colSkylineRaw);
              Clear(colSkylineWeeks);
              Clear(colSkylineSelectedWeek);

              If(
                  IsBlank(varProjectId),
                  Notify("Please select a project first.", NotificationType.Warning);
                  Set(varSkylineLoading, false);
                  Set(varGlobalLoading, false);
                  Set(varGlobalLoadingMsg, "");
                  Set(varGlobalLoadingSubMsg, "");
                  Set(varGlobalLoadingScope, "");
                  Exit()
              );

              IfError(
                  With(
                      {
                          resp: Warroom_Pulse_GetSubsystemSkyline.Run(
                              varProjectId,
                              Text(varSkylineFromDate, "yyyy-mm-dd"),
                              Text(varSkylineToDate, "yyyy-mm-dd"),
                              varSkylinePunchWeight
                          )
                      },
                      With(
                          {
                              arr: Table(ParseJSON(Coalesce(resp.result, "[]")))
                          },
                          ClearCollect(
                              colSkylineRaw,
                              ForAll(
                                  arr,
                                  With(
                                      { r: ThisRecord.Value },
                                      {
                                          Id: Value(Text(r.Id)),
                                          ProjectId: Value(Text(r.ProjectId)),
                                          SubsystemCode: Text(r.SubsystemCode),
                                          PlannedDate: If(IsBlank(Text(r.PlannedDate)) || Text(r.PlannedDate) = "null", Blank(), DateValue(Text(r.PlannedDate))),
                                          ForecastDate: If(IsBlank(Text(r.ForecastDate)) || Text(r.ForecastDate) = "null", Blank(), DateValue(Text(r.ForecastDate))),
                                          ActualDate: If(IsBlank(Text(r.ActualDate)) || Text(r.ActualDate) = "null", Blank(), DateValue(Text(r.ActualDate))),
                                          SkylineDate: If(IsBlank(Text(r.SkylineDate)) || Text(r.SkylineDate) = "null", Blank(), DateValue(Text(r.SkylineDate))),
                                          WeekEnding: If(IsBlank(Text(r.WeekEnding)) || Text(r.WeekEnding) = "null", Blank(), DateValue(Text(r.WeekEnding))),
                                          OpenTasks: If(IsBlank(Text(r.OpenTasks)) || Text(r.OpenTasks) = "null", 0, Value(Text(r.OpenTasks))),
                                          OpenPunches: If(IsBlank(Text(r.OpenPunches)) || Text(r.OpenPunches) = "null", 0, Value(Text(r.OpenPunches))),
                                          WorkloadScore: If(IsBlank(Text(r.WorkloadScore)) || Text(r.WorkloadScore) = "null", 0, Value(Text(r.WorkloadScore))),
                                          DaysRemaining: If(IsBlank(Text(r.DaysRemaining)) || Text(r.DaysRemaining) = "null", Blank(), Value(Text(r.DaysRemaining))),
                                          RiskStatus: Text(r.RiskStatus),
                                          ReadinessScore: If(IsBlank(Text(r.ReadinessScore)) || Text(r.ReadinessScore) = "null", 0, Value(Text(r.ReadinessScore))),
                                          Notes: Text(r.Notes),
                                          PunchWeight: If(IsBlank(Text(r.PunchWeight)) || Text(r.PunchWeight) = "null", varSkylinePunchWeight, Value(Text(r.PunchWeight)))
                                      }
                                  )
                              )
                          )
                      )
                  ),

                  Set(varSkylineError, FirstError.Message);
                  Notify("Error loading Skyline: " & varSkylineError, NotificationType.Error);
                  Clear(colSkylineRaw)
              );

              ClearCollect(
                  colSkylineWeeks,
                  SortByColumns(
                      AddColumns(
                          GroupBy(
                              Filter(colSkylineRaw, !IsBlank(WeekEnding)),
                              WeekEnding,
                              WeekItems
                          ),
                          SubsystemsCount,
                          CountRows(WeekItems),
                          OpenTasksTotal,
                          Sum(WeekItems, OpenTasks),
                          OpenPunchesTotal,
                          Sum(WeekItems, OpenPunches),
                          WorkloadTotal,
                          Sum(WeekItems, WorkloadScore),
                          CriticalCount,
                          CountRows(Filter(WeekItems, RiskStatus = "Critical")),
                          AtRiskCount,
                          CountRows(Filter(WeekItems, RiskStatus = "At Risk")),
                          OverdueCount,
                          CountRows(Filter(WeekItems, RiskStatus = "Overdue")),
                          OnTrackCount,
                          CountRows(Filter(WeekItems, RiskStatus = "On Track")),
                          AttentionCount,
                          CountRows(Filter(WeekItems, RiskStatus = "Attention"))
                      ),
                      "WeekEnding",
                      SortOrder.Ascending
                  )
              );

              If(
                  CountRows(colSkylineWeeks) > 0,
                  Set(varSelectedSkylineWeek, First(colSkylineWeeks).WeekEnding);
                  ClearCollect(
                      colSkylineSelectedWeek,
                      SortByColumns(
                          Filter(colSkylineRaw, WeekEnding = varSelectedSkylineWeek),
                          "WorkloadScore",
                          SortOrder.Descending
                      )
                  ),
                  Set(varSelectedSkylineWeek, Blank())
              );

              Set(varSkylineLastRefresh, Now());
              Set(varSkylineLoaded, true);
              Set(varSkylineLoading, false);

              Set(varGlobalLoading, false);
              Set(varGlobalLoadingMsg, "");
              Set(varGlobalLoadingSubMsg, "");
              Set(varGlobalLoadingScope, "");
            Text: ="Load Skyline"
            Visible: =false
            X: =20
            Y: =20
      - conSkyline_Root:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =varTheme_PageBg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width
          Children:
            - cmp_NavApp_Skyline:
                Control: CanvasComponent
                ComponentName: cmp_SidebarNav
                Properties:
                  ActiveKey: =varAppView
                  AppVersion: ="Text"
                  EnvironmentLabel: ="Text"
                  Fill: =varTheme_PulseBlue
                  Height: =Parent.Height
                  IsCollapsed: =true
                  Items: =colSidebarNavItems
                  NavItems: =colSidebarNavItems
                  OnSelectItem: |-
                    =

                    With(
                        {
                            _key: Lower(Trim(Self.SelectedItemKey)),
                            _hasProject: !IsBlank(varProjectId),
                            _hasConfig: varProjectHasReportConfig || varHomeHiveLoaded || varProjectHasPHRData
                        },

                        If(
                            _key = "superadmin",

                            Set(varGlobalLoading, false);
                            Set(varGlobalLoadingMsg, "");
                            Set(varGlobalLoadingSubMsg, "");
                            Set(varGlobalLoadingScope, "");
                            Set(varGlobalLoadAction, "");
                            Set(varGlobalLoadPending, false);

                            Set(varPHR_IsLoading, false);
                            Set(varOps_IsLoading, false);
                            Set(varTasks_IsLoading, false);
                            Set(varPunches_IsLoading, false);
                            Set(varCfg_IsLoading, false);

                            Set(varAppView, "SuperAdmin");
                            Set(varPageKey, "SUPERADMIN");
                            Set(varPageTitle, "Administration");
                            Set(varPageSubtitle, "Platform configuration and governance");

                            Navigate(scr_SuperAdmin, ScreenTransition.None),

                            If(
                                _key <> "home" && !_hasProject,

                                Notify("Please select a project first.", NotificationType.Warning);

                                Set(varAppView, "Home");
                                Set(varPageKey, "HOME");
                                Set(varPageTitle, "Home");
                                Set(varPageSubtitle, "Project command center");

                                Navigate(scr_Home, ScreenTransition.None),

                                If(
                                    _key in ["overview", "tasks", "punches", "briefing", "config", "skyline"] && !_hasConfig,

                                    Notify(
                                        "This project has no published report configuration yet.",
                                        NotificationType.Warning
                                    );

                                    Set(varAppView, "Home");
                                    Set(varPageKey, "HOME");
                                    Set(varPageTitle, "Home");
                                    Set(varPageSubtitle, "Project command center");

                                    Navigate(scr_Home, ScreenTransition.None),

                                    Switch(
                                        _key,

                                        "skyline",
                                            Set(varAppView, "Skyline");
                                            Set(varPageKey, "SKYLINE");
                                            Set(varPageTitle, "Delivery Skyline");
                                            Set(varPageSubtitle, "Weekly subsystem delivery risk and workload forecast");
                                            Navigate(scr_Skyline, ScreenTransition.None),

                                        "home",
                                            Set(varGlobalLoading, false);
                                            Set(varGlobalLoadingMsg, "");
                                            Set(varGlobalLoadingSubMsg, "");
                                            Set(varGlobalLoadingScope, "");
                                            Set(varGlobalLoadAction, "");
                                            Set(varGlobalLoadPending, false);

                                            Set(varPHR_IsLoading, false);
                                            Set(varOps_IsLoading, false);
                                            Set(varTasks_IsLoading, false);
                                            Set(varPunches_IsLoading, false);
                                            Set(varCfg_IsLoading, false);

                                            Set(varAppView, "Home");
                                            Set(varPageKey, "HOME");
                                            Set(varPageTitle, "Home");
                                            Set(varPageSubtitle, "Project command center");
                                            Set(varHomeViewMode, "DASHBOARD");

                                            Navigate(scr_Home, ScreenTransition.None),

                                        "overview",
                                            Set(varAppView, "Overview");
                                            Set(varPageKey, "OVERVIEW");
                                            Set(varPageTitle, "Overview");
                                            Set(varPageSubtitle, "Project Handover Report by subsystem, discipline and form family");
                                            Set(varOps_ViewMode, "OVERVIEW");

                                            Navigate(scr_Overview, ScreenTransition.None),

                                        "tasks",
                                            Set(varAppView, "Tasks");
                                            Set(varPageKey, "TASKS");
                                            Set(varPageTitle, "Tasks");
                                            Set(varPageSubtitle, "Inspection task management");

                                            Navigate(scr_Tasks, ScreenTransition.None),

                                        "punches",
                                            Set(varAppView, "Punches");
                                            Set(varPageKey, "PUNCHES");
                                            Set(varPageTitle, "Punch List");
                                            Set(varPageSubtitle, "Punch item management");

                                            Navigate(scr_Punches, ScreenTransition.None),

                                        "briefing",
                                            Set(varAppView, "Briefing");
                                            Set(varPageKey, "BRIEFING");
                                            Set(varPageTitle, "Briefing");
                                            Set(varPageSubtitle, "Project reporting and communication");

                                            Navigate(scr_Briefing, ScreenTransition.None),

                                        "config",
                                            Set(varAppView, "Config");
                                            Set(varPageKey, "CONFIG");
                                            Set(varPageTitle, "Configuration");
                                            Set(varPageSubtitle, "Report structure and scope management");

                                            Navigate(scr_Config_NEW, ScreenTransition.None),

                                        Notify("Key not mapped: [" & _key & "]", NotificationType.Error)
                                    )
                                )
                            )
                        )
                    )
                  OnToggleCollapse: =
                  ProjectCode: =Coalesce(Text(varSelectedProject.ProjectCode), "")
                  ProjectName: =Coalesce(varSelectedProject.ProjectName, "")
                  UserRole: ="Text"
                  Width: =154
