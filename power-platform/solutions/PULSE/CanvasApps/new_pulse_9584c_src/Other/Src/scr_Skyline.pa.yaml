                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =8
                              PaddingTop: =8
                              Width: =Parent.Width
                            Children:
                              - conSky_KPI_PeakWeek:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderColor: =varTheme_Border
                                    BorderThickness: =1
