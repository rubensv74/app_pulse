                                          Text: ="Subsystems"
                                          X: =70
                                          Y: =68
                              - conSky_KPI_Critical:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderColor: =varTheme_Border
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =varTheme_Surface
                                    Height: =100
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                  Children:
                                    - icoKPI_Critical:
