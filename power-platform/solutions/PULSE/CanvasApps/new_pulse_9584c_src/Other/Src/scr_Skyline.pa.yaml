                                    - lblKPI_TotalTitle:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =varTheme_TextMuted
                                          FontWeight: =FontWeight.Semibold
                                          Size: =10
                                          Text: ="Total Scheduled"
                                          X: =70
                                          Y: =16
                                    - lblKPI_TotalValue:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =ColorValue("#7C3AED")
                                          FontWeight: =FontWeight.Bold
