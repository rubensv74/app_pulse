ComponentDefinitions:
  cmp_DetailDrawer_1:
    DefinitionType: CanvasComponent
    CustomProperties:
      AccentColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#1677FF")
      ActiveTab:
        PropertyKind: Input
        DataType: Text
        Default: ="Overview"
      BackgroundColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      BorderColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#E2E8F0")
      IsOpen:
        PropertyKind: Input
        DataType: Boolean
        Default: =true
      MutedTextColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#64748B")
      OnClose:
        PropertyKind: Event
        ReturnType: None
        Default: =
      OnPrimary:
        PropertyKind: Event
        ReturnType: None
        Default: =
      OnTabChanged:
        PropertyKind: Event
        ReturnType: None
        Default: =
      PrimaryButtonText:
        PropertyKind: Input
        DataType: Text
        Default: ="Save"
      SecondaryButtonText:
        PropertyKind: Input
        DataType: Text
        Default: ="Close"
      ShowFooter:
        PropertyKind: Input
        DataType: Boolean
        Default: =true
      Subtitle:
        PropertyKind: Input
        DataType: Text
        Default: =""
      SurfaceAltColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#F8FAFC")
      TextColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#0F172A")
      Title:
        PropertyKind: Input
        DataType: Text
        Default: ="Details"
    Properties:
      Height: =720
      Width: =520
    Children:
      - conRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =cmp_DetailDrawer_1.BorderColor
            BorderThickness: =1
            DropShadow: =DropShadow.Semibold
            Fill: =cmp_DetailDrawer_1.BackgroundColor
            Height: =Parent.Height
            RadiusBottomLeft: =16
            RadiusTopLeft: =16
            Visible: =cmp_DetailDrawer_1.IsOpen
            Width: =Parent.Width
          Children:
            - lblTitle_1:
                Control: ModernText@1.0.0
                Properties:
                  Color: =cmp_DetailDrawer_1.TextColor
                  FontWeight: =FontWeight.Semibold
                  Size: =16
                  Text: =cmp_DetailDrawer_1.Title
                  Width: =360
                  X: =20
                  Y: =20
            - lblSubtitle:
                Control: ModernText@1.0.0
                Properties:
                  Color: =cmp_DetailDrawer_1.MutedTextColor
                  Size: =10
                  Text: =cmp_DetailDrawer_1.Subtitle
                  Visible: =!IsBlank(cmp_DetailDrawer_1.Subtitle)
                  Width: =360
                  X: =20
                  Y: =48
            - icoClose_1:
                Control: Classic/Icon@2.5.0
                Properties:
                  Color: =cmp_DetailDrawer_1.MutedTextColor
                  Height: =16
                  Icon: =Icon.Cancel
                  OnSelect: =cmp_DetailDrawer.OnClose()
                  Width: =16
                  X: =Parent.Width-36
                  Y: =20
            - galTabs:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Horizontal_TwoTextOneImageVariant_ver5.0
                Properties:
                  Height: =42
                  Items: =Table({T:"Overview"},{T:"Comments"},{T:"Fields"},{T:"History"})
                  TemplateSize: =110
                  Width: =Parent.Width-40
                  X: =20
                  Y: =84
                Children:
                  - btnTab:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderThickness: =0
                        Color: =If(ThisItem.T=cmp_DetailDrawer_1.ActiveTab,cmp_DetailDrawer_1.AccentColor,cmp_DetailDrawer_1.TextColor)
                        Fill: =If(ThisItem.T=cmp_DetailDrawer_1.ActiveTab,cmp_DetailDrawer_1.SurfaceAltColor,Color.Transparent)
                        Height: =34
                        OnSelect: =cmp_DetailDrawer.OnTabChanged()
                        Text: =ThisItem.T
                        Width: =100
            - conContent:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =cmp_DetailDrawer_1.BorderColor
                  BorderThickness: =1
                  Fill: =cmp_DetailDrawer_1.BackgroundColor
                  Height: =Parent.Height-216
                  Width: =Parent.Width-40
                  X: =20
                  Y: =136
            - btnPrimary:
                Control: Classic/Button@2.2.0
                Properties:
                  Color: =Color.White
                  Fill: =cmp_DetailDrawer_1.AccentColor
                  Height: =36
                  OnSelect: =cmp_DetailDrawer.OnPrimary()
                  Text: =cmp_DetailDrawer_1.PrimaryButtonText
                  Visible: =cmp_DetailDrawer_1.ShowFooter
                  Width: =120
                  X: =Parent.Width-260
                  Y: =Parent.Height-52
            - btnSecondary:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =cmp_DetailDrawer_1.BorderColor
                  BorderThickness: =1
                  Color: =cmp_DetailDrawer_1.TextColor
                  Fill: =cmp_DetailDrawer_1.BackgroundColor
                  Height: =36
                  OnSelect: =cmp_DetailDrawer.OnClose()
                  Text: =cmp_DetailDrawer_1.SecondaryButtonText
                  Visible: =cmp_DetailDrawer_1.ShowFooter
                  Width: =120
                  X: =Parent.Width-130
                  Y: =Parent.Height-52
