ComponentDefinitions:
  cmp_TreeViewPro:
    DefinitionType: CanvasComponent
    CustomProperties:
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Main accent color.
        DataType: Color
        Default: =ColorValue("#1677FF")
      AllowSearch:
        PropertyKind: Input
        DisplayName: AllowSearch
        Description: Show or hide internal search box.
        DataType: Boolean
        Default: =true
      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        Description: Border color.
        DataType: Color
        Default: =ColorValue("#E2E8F0")
      CompactMode:
        PropertyKind: Input
        DisplayName: CompactMode
        Description: Compact row height.
        DataType: Boolean
        Default: =true
      Items:
        PropertyKind: Input
        DisplayName: Items
        Description: Flat tree rows to render. Required fields RowNodeId, RowParentNodeId, RowLevel, RowLabel, RowDescription, RowSortPath.
        DataType: Table
        Default: |-
          =Table(
              {
                  RowNodeId: "",
                  RowParentNodeId: "",
                  RowLevel: 1,
                  RowLabel: "",
                  RowDescription: "",
                  RowSortPath: "",
                  RowIcon: ""
              }
          )
      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Muted text color.
        DataType: Color
        Default: =ColorValue("#64748B")
      OnSelectNode:
        PropertyKind: Event
        DisplayName: OnSelectNode
        Description: Raised when the user selects a node.
        ReturnType: None
        Default: =false
      SearchText:
        PropertyKind: Input
        DisplayName: SearchText
        Description: External search text. Leave blank if using the internal search box.
        DataType: Text
        Default: =""
      SelectedLabelOut:
        PropertyKind: Output
        DisplayName: SelectedLabelOut
        Description: Selected label.
        DataType: Text
      SelectedLevelOut:
        PropertyKind: Output
        DisplayName: SelectedLevelOut
        Description: Selected level.
        DataType: Number
      SelectedNodeId:
        PropertyKind: Input
        DisplayName: SelectedNodeId
        Description: Currently selected node id.
        DataType: Text
        Default: =""
      SelectedNodeIdOut:
        PropertyKind: Output
        DisplayName: SelectedNodeIdOut
        Description: Selected node id.
        DataType: Text
      SelectedParentIdOut:
        PropertyKind: Output
        DisplayName: SelectedParentIdOut
        Description: Selected parent node id.
        DataType: Text
      SelectedRecordOut:
        PropertyKind: Output
        DisplayName: SelectedRecordOut
        Description: Selected row record.
        DataType: Record
      SelectionFill:
        PropertyKind: Input
        DisplayName: SelectionFill
        Description: Selected row background.
        DataType: Color
        Default: =ColorValue("#E0F7FF")
      ShowIcons:
        PropertyKind: Input
        DisplayName: ShowIcons
        Description: Show node icons.
        DataType: Boolean
        Default: =true
      ShowLines:
        PropertyKind: Input
        DisplayName: ShowLines
        Description: Show hierarchy guide lines.
        DataType: Boolean
        Default: =true
      SurfaceColor:
        PropertyKind: Input
        DisplayName: SurfaceColor
        Description: Component background.
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Main text color.
        DataType: Color
        Default: =ColorValue("#0F172A")
    Properties:
      Fill: =cmp_TreeViewPro.SurfaceColor
      Height: =520
      OnReset: |-
        =
        Set(varTree_SearchText, "");
        Set(varTree_SelectedNodeId, cmp_TreeViewPro.SelectedNodeId);
        Set(varTree_SelectedParentId, "");
        Set(varTree_SelectedLevel, 0);
        Set(varTree_SelectedLabel, "");
        Set(varTree_SelectedRecord, Blank())
      SelectedLabelOut: =varTree_SelectedLabel
      SelectedLevelOut: =varTree_SelectedLevel
      SelectedNodeIdOut: =varTree_SelectedNodeId
      SelectedParentIdOut: =varTree_SelectedParentId
      SelectedRecordOut: =varTree_SelectedRecord
      Width: =420
    Children:
      - conTreeRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =cmp_TreeViewPro.BorderColor
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =cmp_TreeViewPro.SurfaceColor
            Height: =Parent.Height
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Width: =Parent.Width
          Children:
            - txtTreeSearch:
                Control: ModernTextInput@1.1.1
                Properties:
                  Appearance: =Appearance.Outline
                  Default: =Coalesce(cmp_TreeViewPro.SearchText, varTree_SearchText)
                  Height: =36
                  OnChange: =Set(varTree_SearchText, Self.Text)
                  Placeholder: ="Search..."
                  Visible: =cmp_TreeViewPro.AllowSearch
                  Width: =Parent.Width - 28
                  X: =14
                  Y: =14
            - galTreeRows:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =Color.Transparent
                  Height: =Parent.Height - Self.Y - 12
                  Items: |-
                    =
                    SortByColumns(
                        Filter(
                            cmp_TreeViewPro.Items,
                            IsBlank(Coalesce(cmp_TreeViewPro.SearchText, varTree_SearchText)) ||
                            StartsWith(
                                Lower(Text(RowLabel)),
                                Lower(Text(Coalesce(cmp_TreeViewPro.SearchText, varTree_SearchText)))
                            ) ||
                            StartsWith(
                                Lower(Text(RowDescription)),
                                Lower(Text(Coalesce(cmp_TreeViewPro.SearchText, varTree_SearchText)))
                            )
                        ),
                        "RowSortPath",
                        SortOrder.Ascending
                    )
                  OnSelect: |-
                    =
                    Set(varTree_SelectedNodeId, Text(ThisItem.RowNodeId));
                    Set(varTree_SelectedParentId, Text(ThisItem.RowParentNodeId));
                    Set(varTree_SelectedLevel, Value(ThisItem.RowLevel));
                    Set(varTree_SelectedLabel, Text(ThisItem.RowLabel));
                    Set(varTree_SelectedRecord, ThisItem);
                    cmp_TreeViewPro.OnSelectNode()
                  TemplateFill: |-
                    =
                    If(
                        Text(ThisItem.RowNodeId) = Text(varTree_SelectedNodeId) ||
                        Text(ThisItem.RowNodeId) = Text(cmp_TreeViewPro.SelectedNodeId),
                        cmp_TreeViewPro.SelectionFill,
                        Color.Transparent
                    )
                  TemplatePadding: =0
                  TemplateSize: =If(cmp_TreeViewPro.CompactMode, 32, 40)
                  Width: =Parent.Width - 28
                  X: =14
                  Y: =If(cmp_TreeViewPro.AllowSearch, 62, 14)
                Children:
                  - recTreeGuide_1:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(148,163,184,0.28)
                        Height: =Parent.TemplateHeight
                        OnSelect: =Select(Parent)
                        Visible: =cmp_TreeViewPro.ShowLines && Value(ThisItem.RowLevel) > 1
                        Width: =1
                        X: =15 + ((Value(ThisItem.RowLevel) - 2) * 18)
                  - recTreeBranch_1:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(148,163,184,0.28)
                        Height: =1
                        OnSelect: =Select(Parent)
                        Visible: =cmp_TreeViewPro.ShowLines && Value(ThisItem.RowLevel) > 1
                        Width: =12
                        X: =15 + ((Value(ThisItem.RowLevel) - 2) * 18)
                        Y: =If(cmp_TreeViewPro.CompactMode, 15, 19)
                  - icoTreeRow:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Color: |-
                          =
                          Switch(
                              Value(ThisItem.RowLevel),
                              1, cmp_TreeViewPro.AccentColor,
                              2, ColorValue("#0EA5E9"),
                              3, cmp_TreeViewPro.MutedTextColor,
                              cmp_TreeViewPro.MutedTextColor
                          )
                        Height: =If(cmp_TreeViewPro.CompactMode, 16, 18)
                        Icon: |-
                          =
                          Switch(
                              Value(ThisItem.RowLevel),
                              1, Icon.Database,
                              2, Icon.Folder,
                              3, Icon.Document,
                              Icon.Document
                          )
                        OnSelect: =Select(Parent)
                        Visible: =cmp_TreeViewPro.ShowIcons
                        Width: =If(cmp_TreeViewPro.CompactMode, 16, 18)
                        X: =8 + ((Value(ThisItem.RowLevel) - 1) * 18)
                        Y: =If(cmp_TreeViewPro.CompactMode, 8, 11)
                  - lblTreeRow:
                      Control: Label@2.5.1
                      Properties:
                        Color: |-
                          =
                          If(
                              Text(ThisItem.RowNodeId) = Text(varTree_SelectedNodeId) ||
                              Text(ThisItem.RowNodeId) = Text(cmp_TreeViewPro.SelectedNodeId),
                              cmp_TreeViewPro.AccentColor,
                              cmp_TreeViewPro.TextColor
                          )
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: |-
                          =
                          If(
                              Text(ThisItem.RowNodeId) = Text(varTree_SelectedNodeId) ||
                              Text(ThisItem.RowNodeId) = Text(cmp_TreeViewPro.SelectedNodeId),
                              FontWeight.Semibold,
                              If(Value(ThisItem.RowLevel) = 1, FontWeight.Semibold, FontWeight.Normal)
                          )
                        Height: =Parent.TemplateHeight
                        OnSelect: =Select(Parent)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =If(cmp_TreeViewPro.CompactMode, 9, 10)
                        Text: =Text(ThisItem.RowLabel)
                        Width: =Parent.TemplateWidth - Self.X - 10
                        Wrap: =false
                        X: =If(cmp_TreeViewPro.ShowIcons, icoTreeRow.X + 24, 8 + ((Value(ThisItem.RowLevel) - 1) * 18))
