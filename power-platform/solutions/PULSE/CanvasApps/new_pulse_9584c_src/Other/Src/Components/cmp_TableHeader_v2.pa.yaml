ComponentDefinitions:
  cmp_TableHeader_v2:
    DefinitionType: CanvasComponent
    CustomProperties:
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Main accent color
        DataType: Color
        Default: =ColorValue("#1677FF")
      BackgroundColor:
        PropertyKind: Input
        DisplayName: BackgroundColor
        Description: Header background color
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        Description: Border color
        DataType: Color
        Default: =ColorValue("#E2E8F0")
      ColumnKey:
        PropertyKind: Input
        DisplayName: ColumnKey
        Description: Logical column key
        DataType: Text
        Default: =""
      DataType:
        PropertyKind: Input
        DisplayName: DataType
        Description: text, number, date, status, user, boolean
        DataType: Text
        Default: ="text"
      FilterCount:
        PropertyKind: Input
        DisplayName: FilterCount
        Description: Number of active filters for this column
        DataType: Number
        Default: =0
      HasActiveState:
        PropertyKind: Output
        DisplayName: HasActiveState
        Description: True when sorted or filtered
        DataType: Boolean
      IsFiltered:
        PropertyKind: Input
        DisplayName: IsFiltered
        Description: True when this column has an active filter
        DataType: Boolean
        Default: =false
      IsRequired:
        PropertyKind: Input
        DisplayName: IsRequired
        Description: Shows required marker
        DataType: Boolean
        Default: =false
      IsResizable:
        PropertyKind: Input
        DisplayName: IsResizable
        Description: Shows resize handle
        DataType: Boolean
        Default: =true
      IsSorted:
        PropertyKind: Input
        DisplayName: IsSorted
        Description: True when this column is the active sort column
        DataType: Boolean
        Default: =false
      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Muted text color
        DataType: Color
        Default: =ColorValue("#64748B")
      NextSortDirection:
        PropertyKind: Output
        DisplayName: NextSortDirection
        Description: Suggested next sort direction
        DataType: Text
      OnMenu:
        PropertyKind: Event
        DisplayName: OnMenu
        Description: Executes when menu icon is selected
        ReturnType: None
        Default: =
      OnResize:
        PropertyKind: Event
        DisplayName: OnResize
        Description: Executes when resize handle is selected
        ReturnType: None
        Default: =
      OnSort:
        PropertyKind: Event
        DisplayName: OnSort
        Description: Executes when header is selected
        ReturnType: None
        Default: =
      ShowDataTypeIcon:
        PropertyKind: Input
        DisplayName: ShowDataTypeIcon
        Description: Shows data type icon
        DataType: Boolean
        Default: =true
      ShowMenu:
        PropertyKind: Input
        DisplayName: ShowMenu
        Description: Shows menu icon
        DataType: Boolean
        Default: =true
      SortDirection:
        PropertyKind: Input
        DisplayName: SortDirection
        Description: none, asc or desc
        DataType: Text
        Default: ="none"
      Subtitle:
        PropertyKind: Input
        DisplayName: Subtitle
        Description: Optional small subtitle
        DataType: Text
        Default: =""
      SurfaceAltColor:
        PropertyKind: Input
        DisplayName: SurfaceAltColor
        Description: Soft hover/active background color
        DataType: Color
        Default: =ColorValue("#F8FAFC")
      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Main text color
        DataType: Color
        Default: =ColorValue("#0F172A")
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Column title
        DataType: Text
        Default: ="Column"
      Tooltip:
        PropertyKind: Input
        DisplayName: Tooltip
        Description: Tooltip text
        DataType: Text
        Default: =""
    Properties:
      HasActiveState: =cmp_TableHeader_v2.IsSorted || cmp_TableHeader_v2.IsFiltered
      Height: =48
      NextSortDirection: |-
        =Switch(
            Lower(cmp_TableHeader_v2.SortDirection),
            "none", "asc",
            "asc", "desc",
            "desc", "none",
            "asc"
        )
      Width: =220
    Children:
      - conTH_Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =If(cmp_TableHeader_v2.HasActiveState, cmp_TableHeader_v2.AccentColor, cmp_TableHeader_v2.BorderColor)
            BorderThickness: =If(cmp_TableHeader_v2.HasActiveState, 2, 1)
            DropShadow: =DropShadow.None
            Fill: =If(cmp_TableHeader_v2.HasActiveState, cmp_TableHeader_v2.SurfaceAltColor, cmp_TableHeader_v2.BackgroundColor)
            Height: =Parent.Height
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Width: =Parent.Width
          Children:
            - btnTH_Click:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  DisabledFill: =RGBA(242, 242, 241, 0)
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =Parent.Height
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =Color.White
                  HoverFill: =RGBA(0,0,0,0.03)
                  OnSelect: =cmp_TableHeader_v2.OnSort()
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =Color.White
                  PressedFill: =RGBA(0,0,0,0.06)
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Text: =""
                  Width: =Parent.Width
            - icoTH_DataType:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =If(cmp_TableHeader_v2.HasActiveState, cmp_TableHeader_v2.AccentColor, cmp_TableHeader_v2.MutedTextColor)
                  DisabledBorderColor: =RGBA(245, 245, 245, 1)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =16
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =cmp_TableHeader_v2.AccentColor
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Icon: |-
                    =Switch(
                        Lower(cmp_TableHeader_v2.DataType),
                        "number", Icon.Calculator,
                        "date", Icon.CalendarBlank,
                        "status", Icon.Flag,
                        "user", Icon.People,
                        "boolean", Icon.Check,
                        Icon.Document
                    )
                  OnSelect: =cmp_TableHeader_v2.OnSort()
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =cmp_TableHeader_v2.AccentColor
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Visible: =cmp_TableHeader_v2.ShowDataTypeIcon
                  Width: =16
                  X: =10
                  Y: =16
            - lblTH_Title:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =If(cmp_TableHeader_v2.HasActiveState, cmp_TableHeader_v2.AccentColor, cmp_TableHeader_v2.TextColor)
                  FontWeight: =If(cmp_TableHeader_v2.HasActiveState, FontWeight.Semibold, FontWeight.Normal)
                  Height: =20
                  OnSelect: =cmp_TableHeader_v2.OnSort()
                  Size: =11
                  Text: =cmp_TableHeader_v2.Title & If(cmp_TableHeader_v2.IsRequired, " *", "")
                  Width: =Parent.Width - If(cmp_TableHeader_v2.ShowDataTypeIcon, 96, 72)
                  X: =If(cmp_TableHeader_v2.ShowDataTypeIcon, 34, 12)
                  Y: =If(IsBlank(cmp_TableHeader_v2.Subtitle), 14, 8)
            - lblTH_Subtitle:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmp_TableHeader_v2.MutedTextColor
                  Height: =14
                  OnSelect: =cmp_TableHeader_v2.OnSort()
                  Size: =8
                  Text: =cmp_TableHeader_v2.Subtitle
                  Visible: =!IsBlank(cmp_TableHeader_v2.Subtitle)
                  Width: =Parent.Width - If(cmp_TableHeader_v2.ShowDataTypeIcon, 96, 72)
                  X: =If(cmp_TableHeader_v2.ShowDataTypeIcon, 34, 12)
                  Y: =28
            - icoTH_Sort:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =If(cmp_TableHeader_v2.IsSorted, cmp_TableHeader_v2.AccentColor, cmp_TableHeader_v2.MutedTextColor)
                  DisabledBorderColor: =RGBA(245, 245, 245, 1)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =15
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =cmp_TableHeader_v2.AccentColor
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Icon: |-
                    =Switch(
                        Lower(cmp_TableHeader_v2.SortDirection),
                        "asc", Icon.ChevronUp,
                        "desc", Icon.ChevronDown,
                        Icon.Sort
                    )
                  OnSelect: =cmp_TableHeader_v2.OnSort()
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =cmp_TableHeader_v2.AccentColor
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Width: =15
                  X: =Parent.Width - If(cmp_TableHeader_v2.ShowMenu, 54, 32)
                  Y: =16
            - conTH_FilterBadge:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =cmp_TableHeader_v2.AccentColor
                  DropShadow: =DropShadow.None
                  Fill: =cmp_TableHeader_v2.AccentColor
                  Height: =16
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =cmp_TableHeader_v2.IsFiltered
                  Width: =If(cmp_TableHeader_v2.FilterCount > 9, 24, 18)
                  X: =Parent.Width - If(cmp_TableHeader_v2.ShowMenu, 82, 60)
                  Y: =16
                Children:
                  - lblTH_FilterCount:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =Color.White
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =16
                        OnSelect: =cmp_TableHeader_v2.OnMenu()
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =8
                        Text: =If(cmp_TableHeader_v2.FilterCount > 0, Text(cmp_TableHeader_v2.FilterCount), "•")
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width
            - icoTH_Menu:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =cmp_TableHeader_v2.MutedTextColor
                  DisabledBorderColor: =RGBA(245, 245, 245, 1)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =16
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =cmp_TableHeader_v2.AccentColor
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Icon: =Icon.More
                  OnSelect: =cmp_TableHeader_v2.OnMenu()
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =cmp_TableHeader_v2.AccentColor
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Visible: =cmp_TableHeader_v2.ShowMenu
                  Width: =16
                  X: =Parent.Width - 28
                  Y: =16
            - rectTH_Resize:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  DisabledFill: =RGBA(161, 159, 157, 1)
                  Fill: =If(cmp_TableHeader_v2.IsResizable, cmp_TableHeader_v2.BorderColor, Color.Transparent)
                  FocusedBorderThickness: =4
                  Height: =Parent.Height - 12
                  HoverFill: =cmp_TableHeader_v2.AccentColor
                  OnSelect: =cmp_TableHeader_v2.OnResize()
                  PressedFill: =cmp_TableHeader_v2.AccentColor
                  Visible: =cmp_TableHeader_v2.IsResizable
                  Width: =2
                  X: =Parent.Width - 2
                  Y: =6
