ComponentDefinitions:
  cmp_OverviewTile:
    DefinitionType: CanvasComponent
    CustomProperties:
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Main accent color
        DataType: Color
        Default: =ColorValue("#1677FF")
      BackgroundColor:
        PropertyKind: Input
        DisplayName: BackgroundColor
        Description: Tile background color
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      BadgeText:
        PropertyKind: Input
        DisplayName: BadgeText
        Description: Optional badge text
        DataType: Text
        Default: =""
      BodyHeight:
        PropertyKind: Output
        DisplayName: BodyHeight
        Description: Suggested height for hosted external content
        DataType: Number
      BodyWidth:
        PropertyKind: Output
        DisplayName: BodyWidth
        Description: Suggested width for hosted external content
        DataType: Number
      BodyX:
        PropertyKind: Output
        DisplayName: BodyX
        Description: Suggested X for hosted external content
        DataType: Number
      BodyY:
        PropertyKind: Output
        DisplayName: BodyY
        Description: Suggested Y for hosted external content
        DataType: Number
      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        Description: Border color
        DataType: Color
        Default: =ColorValue("#E2E8F0")
      DangerColor:
        PropertyKind: Input
        DisplayName: DangerColor
        Description: Danger color
        DataType: Color
        Default: =ColorValue("#DC2626")
      DeltaDirection:
        PropertyKind: Input
        DisplayName: DeltaDirection
        Description: up, down, flat
        DataType: Text
        Default: ="flat"
      DeltaText:
        PropertyKind: Input
        DisplayName: DeltaText
        Description: Delta text
        DataType: Text
        Default: =""
      EmptyText:
        PropertyKind: Input
        DisplayName: EmptyText
        Description: Empty state text
        DataType: Text
        Default: ="No data available"
      ErrorText:
        PropertyKind: Input
        DisplayName: ErrorText
        Description: Error state text
        DataType: Text
        Default: ="Unable to load tile"
      FooterText:
        PropertyKind: Input
        DisplayName: FooterText
        Description: Footer text
        DataType: Text
        Default: =""
      InsightText:
        PropertyKind: Input
        DisplayName: InsightText
        Description: Insight body text
        DataType: Text
        Default: =""
      IsEmpty:
        PropertyKind: Output
        DisplayName: IsEmpty
        Description: True when State is Empty
        DataType: Boolean
      IsError:
        PropertyKind: Output
        DisplayName: IsError
        Description: True when State is Error
        DataType: Boolean
      IsInsight:
        PropertyKind: Output
        DisplayName: IsInsight
        Description: True when TileType is Insight or Warning
        DataType: Boolean
      IsLoading:
        PropertyKind: Output
        DisplayName: IsLoading
        Description: True when State is Loading
        DataType: Boolean
      IsMetric:
        PropertyKind: Output
        DisplayName: IsMetric
        Description: True when TileType is Metric
        DataType: Boolean
      IsProgress:
        PropertyKind: Output
        DisplayName: IsProgress
        Description: True when TileType is Progress
        DataType: Boolean
      IsSelected:
        PropertyKind: Input
        DisplayName: IsSelected
        Description: Selected state
        DataType: Boolean
        Default: =false
      IsSuccess:
        PropertyKind: Output
        DisplayName: IsSuccess
        Description: True when State is Success
        DataType: Boolean
      LoadingText:
        PropertyKind: Input
        DisplayName: LoadingText
        Description: Loading state text
        DataType: Text
        Default: ="Loading..."
      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Muted text color
        DataType: Color
        Default: =ColorValue("#64748B")
      OnExpand:
        PropertyKind: Event
        DisplayName: OnExpand
        Description: Executes when expand is selected
        ReturnType: None
        Default: =
      OnInfo:
        PropertyKind: Event
        DisplayName: OnInfo
        Description: Executes when info is selected
        ReturnType: None
        Default: =
      OnRefresh:
        PropertyKind: Event
        DisplayName: OnRefresh
        Description: Executes when refresh is selected
        ReturnType: None
        Default: =
      OnSelectTile:
        PropertyKind: Event
        DisplayName: OnSelectTile
        Description: Executes when tile is selected
        ReturnType: None
        Default: =
      ProgressLabel:
        PropertyKind: Input
        DisplayName: ProgressLabel
        Description: Progress label
        DataType: Text
        Default: =""
      ProgressValue:
        PropertyKind: Input
        DisplayName: ProgressValue
        Description: Progress value 0-100
        DataType: Number
        Default: =0
      SecondaryValueText:
        PropertyKind: Input
        DisplayName: SecondaryValueText
        Description: Secondary value
        DataType: Text
        Default: =""
      ShowExpand:
        PropertyKind: Input
        DisplayName: ShowExpand
        Description: Shows expand action
        DataType: Boolean
        Default: =true
      ShowFooter:
        PropertyKind: Input
        DisplayName: ShowFooter
        Description: Shows footer
        DataType: Boolean
        Default: =true
      ShowHeader:
        PropertyKind: Input
        DisplayName: ShowHeader
        Description: Shows header
        DataType: Boolean
        Default: =true
      ShowInfo:
        PropertyKind: Input
        DisplayName: ShowInfo
        Description: Shows info action
        DataType: Boolean
        Default: =false
      ShowRefresh:
        PropertyKind: Input
        DisplayName: ShowRefresh
        Description: Shows refresh action
        DataType: Boolean
        Default: =true
      ShowToolbar:
        PropertyKind: Input
        DisplayName: ShowToolbar
        Description: Shows toolbar
        DataType: Boolean
        Default: =true
      SourceText:
        PropertyKind: Input
        DisplayName: SourceText
        Description: Source text
        DataType: Text
        Default: =""
      State:
        PropertyKind: Input
        DisplayName: State
        Description: Success, Loading, Empty, Error
        DataType: Text
        Default: ="Success"
      StatusColor:
        PropertyKind: Input
        DisplayName: StatusColor
        Description: Status color
        DataType: Color
        Default: =ColorValue("#16A34A")
      Subtitle:
        PropertyKind: Input
        DisplayName: Subtitle
        Description: Tile subtitle
        DataType: Text
        Default: =""
      SurfaceAltColor:
        PropertyKind: Input
        DisplayName: SurfaceAltColor
        Description: Soft surface color
        DataType: Color
        Default: =ColorValue("#F8FAFC")
      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Main text color
        DataType: Color
        Default: =ColorValue("#0F172A")
      TileSize:
        PropertyKind: Input
        DisplayName: TileSize
        Description: XS, S, M, L, XL, Full
        DataType: Text
        Default: ="M"
      TileType:
        PropertyKind: Input
        DisplayName: TileType
        Description: Metric, Progress, Insight, Warning, Status, List, Chart
        DataType: Text
        Default: ="Metric"
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Tile title
        DataType: Text
        Default: ="Overview"
      ValueText:
        PropertyKind: Input
        DisplayName: ValueText
        Description: Main value
        DataType: Text
        Default: ="0"
      WarningColor:
        PropertyKind: Input
        DisplayName: WarningColor
        Description: Warning color
        DataType: Color
        Default: =ColorValue("#EA580C")
    Properties:
      BodyHeight: =cmp_OverviewTile.Height - If(cmp_OverviewTile.ShowHeader, 116, 60)
      BodyWidth: =cmp_OverviewTile.Width - 32
      BodyX: =16
      BodyY: =If(cmp_OverviewTile.ShowHeader, 72, 16)
      Height: =220
      IsEmpty: =Lower(cmp_OverviewTile.State) = "empty"
      IsError: =Lower(cmp_OverviewTile.State) = "error"
      IsInsight: =Lower(cmp_OverviewTile.TileType) = "insight" || Lower(cmp_OverviewTile.TileType) = "warning"
      IsLoading: =Lower(cmp_OverviewTile.State) = "loading"
      IsMetric: =Lower(cmp_OverviewTile.TileType) = "metric"
      IsProgress: =Lower(cmp_OverviewTile.TileType) = "progress"
      IsSuccess: =Lower(cmp_OverviewTile.State) = "success"
      Width: =320
    Children:
      - conOT_Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =If(cmp_OverviewTile.IsSelected, cmp_OverviewTile.AccentColor, cmp_OverviewTile.BorderColor)
            BorderThickness: =If(cmp_OverviewTile.IsSelected, 2, 1)
            DropShadow: =DropShadow.Semibold
            Fill: =cmp_OverviewTile.BackgroundColor
            Height: =Parent.Height
            RadiusBottomLeft: =16
            RadiusBottomRight: =16
            RadiusTopLeft: =16
            RadiusTopRight: =16
            Width: =Parent.Width
          Children:
            - btnOT_Click:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  DisabledFill: =RGBA(242, 242, 241, 0)
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =Parent.Height
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =Color.White
                  HoverFill: =RGBA(0,0,0,0.02)
                  OnSelect: =cmp_OverviewTile.OnSelectTile()
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =Color.White
                  PressedFill: =RGBA(0,0,0,0.04)
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Text: =""
                  Width: =Parent.Width
            - lblOT_Title:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmp_OverviewTile.TextColor
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Size: =13
                  Text: =cmp_OverviewTile.Title
                  Visible: =cmp_OverviewTile.ShowHeader
                  Width: =Parent.Width - If(cmp_OverviewTile.ShowToolbar, 150, 32)
                  X: =16
                  Y: =14
            - lblOT_Subtitle:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmp_OverviewTile.MutedTextColor
                  Height: =18
                  Size: =9
                  Text: =cmp_OverviewTile.Subtitle
                  Visible: =cmp_OverviewTile.ShowHeader && !IsBlank(cmp_OverviewTile.Subtitle)
                  Width: =Parent.Width - If(cmp_OverviewTile.ShowToolbar, 150, 32)
                  X: =16
                  Y: =38
            - conOT_Badge:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =cmp_OverviewTile.AccentColor
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =cmp_OverviewTile.SurfaceAltColor
                  Height: =24
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Visible: =cmp_OverviewTile.ShowHeader && !IsBlank(cmp_OverviewTile.BadgeText)
                  Width: =86
                  X: =Parent.Width - If(cmp_OverviewTile.ShowToolbar, 238, 104)
                  Y: =18
                Children:
                  - lblOT_Badge:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =cmp_OverviewTile.AccentColor
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =8
                        Text: =cmp_OverviewTile.BadgeText
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width
                        Y: =3
            - icoOT_Refresh:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =cmp_OverviewTile.MutedTextColor
                  DisabledBorderColor: =RGBA(245, 245, 245, 1)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =18
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =cmp_OverviewTile.AccentColor
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Icon: =Icon.Reload
                  OnSelect: =cmp_OverviewTile.OnRefresh()
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =cmp_OverviewTile.AccentColor
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Visible: =cmp_OverviewTile.ShowHeader && cmp_OverviewTile.ShowToolbar && cmp_OverviewTile.ShowRefresh
                  Width: =18
                  X: =Parent.Width - 104
                  Y: =20
            - icoOT_Expand:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =cmp_OverviewTile.MutedTextColor
                  DisabledBorderColor: =RGBA(245, 245, 245, 1)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =18
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =cmp_OverviewTile.AccentColor
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Icon: =Icon.ExpandView
                  OnSelect: =cmp_OverviewTile.OnExpand()
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =cmp_OverviewTile.AccentColor
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Visible: =cmp_OverviewTile.ShowHeader && cmp_OverviewTile.ShowToolbar && cmp_OverviewTile.ShowExpand
                  Width: =18
                  X: =Parent.Width - 68
                  Y: =20
            - icoOT_Info:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =cmp_OverviewTile.MutedTextColor
                  DisabledBorderColor: =RGBA(245, 245, 245, 1)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =18
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =cmp_OverviewTile.AccentColor
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Icon: =Icon.Information
                  OnSelect: =cmp_OverviewTile.OnInfo()
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =cmp_OverviewTile.AccentColor
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Visible: =cmp_OverviewTile.ShowHeader && cmp_OverviewTile.ShowToolbar && cmp_OverviewTile.ShowInfo
                  Width: =18
                  X: =Parent.Width - 32
                  Y: =20
            - rectOT_HeaderLine:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  DisabledFill: =RGBA(161, 159, 157, 1)
                  Fill: =cmp_OverviewTile.BorderColor
                  FocusedBorderThickness: =4
                  Height: =1
                  HoverFill: =cmp_OverviewTile.BorderColor
                  PressedFill: =cmp_OverviewTile.BorderColor
                  Visible: =cmp_OverviewTile.ShowHeader
                  Width: =Parent.Width
                  Y: =64
            - lblOT_State:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =If(cmp_OverviewTile.IsError, cmp_OverviewTile.DangerColor, cmp_OverviewTile.MutedTextColor)
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  Size: =12
                  Text: |-
                    =If(
                        cmp_OverviewTile.IsLoading,
                        cmp_OverviewTile.LoadingText,
                        If(
                            cmp_OverviewTile.IsError,
                            cmp_OverviewTile.ErrorText,
                            cmp_OverviewTile.EmptyText
                        )
                    )
                  Visible: =cmp_OverviewTile.IsLoading || cmp_OverviewTile.IsEmpty || cmp_OverviewTile.IsError
                  Width: =Parent.Width - 48
                  X: =24
                  Y: =(Parent.Height - 24) / 2
            - lblOT_Value:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmp_OverviewTile.TextColor
                  FontWeight: =FontWeight.Semibold
                  Height: =44
                  Size: =30
                  Text: =cmp_OverviewTile.ValueText
                  Visible: =cmp_OverviewTile.IsSuccess && cmp_OverviewTile.IsMetric
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =If(cmp_OverviewTile.ShowHeader, 84, 28)
            - lblOT_SecondaryValue:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmp_OverviewTile.MutedTextColor
                  Height: =18
                  Size: =10
                  Text: =cmp_OverviewTile.SecondaryValueText
                  Visible: =cmp_OverviewTile.IsSuccess && cmp_OverviewTile.IsMetric && !IsBlank(cmp_OverviewTile.SecondaryValueText)
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =If(cmp_OverviewTile.ShowHeader, 130, 74)
            - conOT_Delta:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  DropShadow: =DropShadow.None
                  Fill: =cmp_OverviewTile.SurfaceAltColor
                  Height: =26
                  RadiusBottomLeft: =13
                  RadiusBottomRight: =13
                  RadiusTopLeft: =13
                  RadiusTopRight: =13
                  Visible: =cmp_OverviewTile.IsSuccess && cmp_OverviewTile.IsMetric && !IsBlank(cmp_OverviewTile.DeltaText)
                  Width: =92
                  X: =16
                  Y: =If(cmp_OverviewTile.ShowHeader, 154, 98)
                Children:
                  - icoOT_Delta:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: |-
                          =Switch(
                              Lower(cmp_OverviewTile.DeltaDirection),
                              "up", cmp_OverviewTile.StatusColor,
                              "down", cmp_OverviewTile.DangerColor,
                              cmp_OverviewTile.MutedTextColor
                          )
                        DisabledBorderColor: =RGBA(245, 245, 245, 1)
                        DisabledColor: =RGBA(225, 223, 221, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =14
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =Self.Color
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Icon: |-
                          =Switch(
                              Lower(cmp_OverviewTile.DeltaDirection),
                              "up", Icon.ChevronUp,
                              "down", Icon.ChevronDown,
                              Icon.HorizontalLine
                          )
                        OnSelect: =cmp_OverviewTile.OnSelectTile()
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =Self.Color
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Width: =14
                        X: =8
                        Y: =6
                  - lblOT_Delta:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =icoOT_Delta.Color
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =26
                        OnSelect: =cmp_OverviewTile.OnSelectTile()
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =9
                        Text: =cmp_OverviewTile.DeltaText
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width - 30
                        X: =28
                        Y: =6
            - lblOT_ProgressValue:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmp_OverviewTile.TextColor
                  FontWeight: =FontWeight.Semibold
                  Height: =36
                  Size: =24
                  Text: =Text(cmp_OverviewTile.ProgressValue) & "%"
                  Visible: =cmp_OverviewTile.IsSuccess && cmp_OverviewTile.IsProgress
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =If(cmp_OverviewTile.ShowHeader, 84, 28)
            - lblOT_ProgressLabel:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmp_OverviewTile.MutedTextColor
                  Height: =18
                  Size: =10
                  Text: =cmp_OverviewTile.ProgressLabel
                  Visible: =cmp_OverviewTile.IsSuccess && cmp_OverviewTile.IsProgress && !IsBlank(cmp_OverviewTile.ProgressLabel)
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =If(cmp_OverviewTile.ShowHeader, 124, 68)
            - rectOT_ProgressBg:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  DisabledFill: =RGBA(161, 159, 157, 1)
                  Fill: =cmp_OverviewTile.SurfaceAltColor
                  FocusedBorderThickness: =4
                  Height: =10
                  HoverFill: =cmp_OverviewTile.SurfaceAltColor
                  PressedFill: =cmp_OverviewTile.SurfaceAltColor
                  Visible: =cmp_OverviewTile.IsSuccess && cmp_OverviewTile.IsProgress
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =If(cmp_OverviewTile.ShowHeader, 154, 98)
            - rectOT_ProgressFill:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  DisabledFill: =RGBA(161, 159, 157, 1)
                  Fill: =cmp_OverviewTile.AccentColor
                  FocusedBorderThickness: =4
                  Height: =10
                  HoverFill: =cmp_OverviewTile.AccentColor
                  PressedFill: =cmp_OverviewTile.AccentColor
                  Visible: =cmp_OverviewTile.IsSuccess && cmp_OverviewTile.IsProgress
                  Width: =(Parent.Width - 32) * Min(Max(cmp_OverviewTile.ProgressValue, 0), 100) / 100
                  X: =16
                  Y: =rectOT_ProgressBg.Y
            - conOT_InsightIcon:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  DropShadow: =DropShadow.None
                  Fill: =If(Lower(cmp_OverviewTile.TileType) = "warning", ColorValue("#FFF7ED"), cmp_OverviewTile.SurfaceAltColor)
                  Height: =38
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Visible: =cmp_OverviewTile.IsSuccess && cmp_OverviewTile.IsInsight
                  Width: =38
                  X: =16
                  Y: =If(cmp_OverviewTile.ShowHeader, 84, 28)
                Children:
                  - icoOT_Insight:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =If(Lower(cmp_OverviewTile.TileType) = "warning", cmp_OverviewTile.WarningColor, cmp_OverviewTile.AccentColor)
                        DisabledBorderColor: =RGBA(245, 245, 245, 1)
                        DisabledColor: =RGBA(225, 223, 221, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =20
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =Self.Color
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Icon: =If(Lower(cmp_OverviewTile.TileType) = "warning", Icon.Warning, Icon.Lightbulb)
                        OnSelect: =cmp_OverviewTile.OnSelectTile()
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =Self.Color
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Width: =20
                        X: =9
                        Y: =9
            - lblOT_Insight:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =cmp_OverviewTile.TextColor
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =76
                  OnSelect: =cmp_OverviewTile.OnSelectTile()
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =10
                  Text: =cmp_OverviewTile.InsightText
                  VerticalAlign: =VerticalAlign.Top
                  Visible: =cmp_OverviewTile.IsSuccess && cmp_OverviewTile.IsInsight
                  Width: =Parent.Width - 76
                  X: =64
                  Y: =If(cmp_OverviewTile.ShowHeader, 86, 30)
            - conOT_BodyHost:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =cmp_OverviewTile.BorderColor
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =Parent.Height - If(cmp_OverviewTile.ShowHeader, 116, 60)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =cmp_OverviewTile.IsSuccess && !(cmp_OverviewTile.IsMetric || cmp_OverviewTile.IsProgress || cmp_OverviewTile.IsInsight)
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =If(cmp_OverviewTile.ShowHeader, 76, 16)
            - rectOT_FooterLine:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  DisabledFill: =RGBA(161, 159, 157, 1)
                  Fill: =cmp_OverviewTile.BorderColor
                  FocusedBorderThickness: =4
                  Height: =1
                  HoverFill: =cmp_OverviewTile.BorderColor
