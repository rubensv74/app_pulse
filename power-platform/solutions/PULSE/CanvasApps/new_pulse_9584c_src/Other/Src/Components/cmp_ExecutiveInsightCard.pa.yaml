ComponentDefinitions:
  cmp_ExecutiveInsightCard:
    DefinitionType: CanvasComponent
    CustomProperties:
      BorderColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#E2E8F0")
      Category:
        PropertyKind: Input
        DataType: Text
        Default: ="Operations"
      DangerColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#DC2626")
      Detail:
        PropertyKind: Input
        DataType: Text
        Default: ="Project indicators remain inside the configured thresholds."
      InfoColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#1677FF")
      MetricText:
        PropertyKind: Input
        DataType: Text
        Default: ="—"
      MutedTextColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#64748B")
      OnSelect:
        PropertyKind: Event
        ReturnType: None
        Default: =
      Severity:
        PropertyKind: Input
        DataType: Text
        Default: ="INFO"
      SurfaceColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      TextColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#0F172A")
      Title:
        PropertyKind: Input
        DataType: Text
        Default: ="No material deviation detected"
      WarningColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#D97706")
    Properties:
      Height: =128
      Width: =420
    Children:
      - conEIC_Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =cmp_ExecutiveInsightCard.BorderColor
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =cmp_ExecutiveInsightCard.SurfaceColor
            Height: =Parent.Height
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            RadiusTopLeft: =14
            RadiusTopRight: =14
            Width: =Parent.Width
          Children:
            - recEIC_Severity:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Fill: =Switch(Upper(cmp_ExecutiveInsightCard.Severity),"CRITICAL",cmp_ExecutiveInsightCard.DangerColor,"WARNING",cmp_ExecutiveInsightCard.WarningColor,cmp_ExecutiveInsightCard.InfoColor)
                  Height: =Parent.Height
                  Width: =5
            - lblEIC_Category:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =Switch(Upper(cmp_ExecutiveInsightCard.Severity),"CRITICAL",cmp_ExecutiveInsightCard.DangerColor,"WARNING",cmp_ExecutiveInsightCard.WarningColor,cmp_ExecutiveInsightCard.InfoColor)
                  FontWeight: =FontWeight.Semibold
                  Height: =18
                  Size: =9
                  Text: =Upper(cmp_ExecutiveInsightCard.Category)
                  Width: =Parent.Width - 140
                  X: =20
                  Y: =14
            - lblEIC_Metric:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Right
                  AutoHeight: =true
                  Color: =cmp_ExecutiveInsightCard.TextColor
                  FontWeight: =FontWeight.Bold
                  Height: =26
                  Size: =16
                  Text: =cmp_ExecutiveInsightCard.MetricText
                  Width: =100
                  X: =Parent.Width - 116
                  Y: =10
            - lblEIC_Title:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmp_ExecutiveInsightCard.TextColor
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  Size: =12
                  Text: =cmp_ExecutiveInsightCard.Title
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =40
            - lblEIC_Detail:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmp_ExecutiveInsightCard.MutedTextColor
                  Height: =42
                  Size: =9
                  Text: =cmp_ExecutiveInsightCard.Detail
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =70
            - btnEIC_Open:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =0
                  Fill: =RGBA(0,0,0,0)
                  Height: =Parent.Height
                  HoverFill: =RGBA(22,119,255,0.035)
                  OnSelect: =cmp_ExecutiveInsightCard.OnSelect()
                  PressedFill: =RGBA(22,119,255,0.07)
                  Text: =""
                  Width: =Parent.Width
