                                colPunchMoreDynamicFilters,
                                SortByColumns(
                                    Filter(
                                        colPunchDynamicFilters,
                                        ShowInQuickFilters = false
                                    ),
                                    "FilterOrder",
                                    SortOrder.Ascending
                                )
                            );

