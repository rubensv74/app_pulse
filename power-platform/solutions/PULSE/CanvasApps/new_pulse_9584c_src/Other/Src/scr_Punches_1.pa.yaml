                    // =====================================================
                    // btnDrawerLoad_Punches.OnSelect
                    // Drawer tab loader
                    // =====================================================

                    If(
                        !varShowDetailDrawer,
                        Exit()
                    );

                    If(
                        IsBlank(varDrawerRecordId),

                        Set(varDrawerIsLoading, false);

                        Notify(
                            "No record selected.",
                            NotificationType.Warning
                        );

                        Exit()
                    );

                    Switch(
                        varDrawerTab,

                        "Overview",
                            Set(varDrawerIsLoading, false),

                        "History",
                            Set(varDrawerIsLoading, false),

                        "Comments",
                            Set(varDrawerIsLoading, true);
