Screens:
  scr_Punches_1:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: "=\r\n// =====================================================\r\n// Punch export collection schema initialization\r\n// =====================================================\r\n\r\nClearCollect(\r\n    colPunchExportColumns,\r\n    {\r\n        ColumnKey: \"\",\r\n        ColumnLabel: \"\",\r\n        ColumnGroup: \"\",\r\n        SortOrder: 0,\r\n        IsRequired: false,\r\n        IsSensitive: false,\r\n        IsSelected: false\r\n    }\r\n);\r\n\r\nClear(colPunchExportColumns);\r\n\r\nSet(varShowPunchExportColumns, false);\r\nSet(varPunchExportMode, \"CLIENT\");\r\nSet(varPunchExportColumnsJson, \"[]\");\r\nSet(varPunchExportConfigError, \"\");\r\nSet(varPunchExportLoading, false);\r\n\r\n\r\n// =====================================================\r\n// scr_Punches.OnVisible\r\n// Punch List initialization\r\n// Source of truth for filter catalogs:\r\n// Warroom_Punches_GetFilterCatalogs\r\n// =====================================================\r\n\r\nIf(\r\n    Coalesce(varPunches_FilterSource, \"Manual\") <> \"Dashboard\",\r\n    Set(varFilter_SubsystemsCsv, \"\");\r\n    Set(varFilter_Subsystem, Blank());\r\n    Reset(cmp_MultiValueFilter_2)\r\n);\r\n\r\nSet(varPunchSubsystemPopup, false);\r\n\r\nSet(varAppView, \"Punches\");\r\n\r\nSet(varPageKey, \"PUNCHES\");\r\nSet(varPageTitle, \"Punch List\");\r\nSet(varPageSubtitle, \"Punch item management\");\r\n\r\nSet(varPunches_ViewReady, false);\r\n\r\nSet(varShowPunchDynamicFilters, false);\r\n\r\nSet(\r\n    varPunchCustomFiltersJson,\r\n    Coalesce(varPunchCustomFiltersJson, \"[]\")\r\n);\r\n\r\nSet(varPunches_FilterSource, Coalesce(varPunches_FilterSource, \"Manual\"));\r\nSet(varPunches_ReturnView, Coalesce(varPunches_ReturnView, \"Overview\"));\r\n\r\nIf(\r\n    varPunches_FilterSource = \"Dashboard\",\r\n    Set(varPunches_HasSearched, true);\r\n    Set(varPunches_Page, 1);\r\n    Set(varPunches_AutoLoad, true)\r\n);\r\n\r\nSet(varPunches_Page, Coalesce(varPunches_Page, 1));\r\nSet(varPunches_PageSize, Coalesce(varPunches_PageSize, 50));\r\n\r\nSet(varPunches_IsLoading, false);\r\nSet(varPunches_Error, Coalesce(varPunches_Error, \"\"));\r\n\r\nSet(varPunchCatalogs_IsLoading, false);\r\nSet(varPunchCatalogs_Error, \"\");\r\n\r\nSet(varFilter_Subsystem, Coalesce(varFilter_Subsystem, Blank()));\r\nSet(varFilter_PunchDiscipline, Coalesce(varFilter_PunchDiscipline, Blank()));\r\nSet(varFilter_Subcontractor, Coalesce(varFilter_Subcontractor, Blank()));\r\nSet(varFilter_PunchTemplateId, Coalesce(varFilter_PunchTemplateId, Blank()));\r\nSet(varFilter_PunchCategoryCode, Coalesce(varFilter_PunchCategoryCode, Blank()));\r\nSet(varFilter_PunchStatusCode, Coalesce(varFilter_PunchStatusCode, Blank()));\r\n\r\nSet(varGlobalLoading, false);\r\nSet(varGlobalLoadingMsg, \"\");\r\nSet(varGlobalLoadingSubMsg, \"\");\r\nSet(varGlobalLoadingScope, \"\");\r\n\r\nIf(\r\n    !IsBlank(varProjectId) &&\r\n    (\r\n        IsBlank(varPunchCatalogs_ProjectId) ||\r\n        Text(varPunchCatalogs_ProjectId) <> Text(varProjectId) ||\r\n        CountRows(colPunchSubsystems_Filter) = 0 ||\r\n        CountRows(colPunchTemplates_Filter) = 0\r\n    ),\r\n\r\n    Set(varPunchCatalogs_IsLoading, true);\r\n    Set(varPunchCatalogs_Error, \"\");\r\n\r\n    Set(varGlobalLoading, true);\r\n    Set(varGlobalLoadingMsg, \"Loading Punch List filters...\");\r\n    Set(varGlobalLoadingSubMsg, \"Preparing filter catalogs\");\r\n    Set(varGlobalLoadingScope, \"PUNCHES\");\r\n\r\n    IfError(\r\n        With(\r\n            {\r\n                respCatalogs:\r\n                    Warroom_Punches_GetFilterCatalogs.Run(\r\n                        Value(varProjectId)\r\n                    )\r\n            },\r\n            With(\r\n                {\r\n                    objCatalogs:\r\n                        ParseJSON(\r\n                            Coalesce(\r\n                                respCatalogs.result,\r\n                                \"{}\"\r\n                            )\r\n                        )\r\n                },\r\n\r\n                ClearCollect(\r\n                    colPunchSubsystems_Filter,\r\n                    SortByColumns(\r\n                        ForAll(\r\n                            Table(objCatalogs.Table1),\r\n                            With(\r\n                                { r: ThisRecord.Value },\r\n                                {\r\n                                    Code: Text(r.Code),\r\n                                    Label: Text(r.Label),\r\n                                    SortOrder:\r\n                                        If(\r\n                                            IsBlank(Text(r.SortOrder)) || Text(r.SortOrder) = \"null\",\r\n                                            1,\r\n                                            Value(Text(r.SortOrder))\r\n                                        )\r\n                                }\r\n                            )\r\n                        ),\r\n                        \"SortOrder\",\r\n                        SortOrder.Ascending,\r\n                        \"Code\",\r\n                        SortOrder.Ascending\r\n                    )\r\n                );\r\n\r\n                ClearCollect(\r\n                colPunchSubsystems_MVF,\r\n                AddColumns(\r\n                    colPunchSubsystems_Filter,\r\n                    Display,\r\n                    Label,\r\n                    Id,\r\n                    Code\r\n                )\r\n            );\r\n\r\n                ClearCollect(\r\n                    colPunchTemplates_Filter,\r\n                    SortByColumns(\r\n                        ForAll(\r\n                            Table(objCatalogs.Table2),\r\n                            With(\r\n                                { r: ThisRecord.Value },\r\n                                {\r\n                                    TemplateId:\r\n                                        If(\r\n                                            IsBlank(Text(r.TemplateId)) || Text(r.TemplateId) = \"null\",\r\n                                            Blank(),\r\n                                            Value(Text(r.TemplateId))\r\n                                        ),\r\n                                    TemplateCode: Text(r.TemplateCode),\r\n                                    TemplateLabel: Text(r.TemplateLabel),\r\n                                    TemplateDescription: Text(r.TemplateDescription)\r\n                                }\r\n                            )\r\n                        ),\r\n                        \"TemplateLabel\",\r\n                        SortOrder.Ascending\r\n                    )\r\n                );\r\n\r\n                ClearCollect(\r\n                    colPunchCategories_Filter,\r\n                    SortByColumns(\r\n                        ForAll(\r\n                            Table(objCatalogs.Table3),\r\n                            With(\r\n                                { r: ThisRecord.Value },\r\n                                {\r\n                                    TemplateId:\r\n                                        If(\r\n                                            IsBlank(Text(r.TemplateId)) || Text(r.TemplateId) = \"null\",\r\n                                            Blank(),\r\n                                            Value(Text(r.TemplateId))\r\n                                        ),\r\n                                    CategoryCode: Text(r.CategoryCode),\r\n                                    CategoryLabel: Text(r.CategoryLabel),\r\n                                    DisplayLabel: Text(r.DisplayLabel),\r\n                                    SortOrder:\r\n                                        If(\r\n                                            IsBlank(Text(r.SortOrder)) || Text(r.SortOrder) = \"null\",\r\n                                            999,\r\n                                            Value(Text(r.SortOrder))\r\n                                        )\r\n                                }\r\n                            )\r\n                        ),\r\n                        \"TemplateId\",\r\n                        SortOrder.Ascending,\r\n                        \"SortOrder\",\r\n                        SortOrder.Ascending,\r\n                        \"CategoryCode\",\r\n                        SortOrder.Ascending\r\n                    )\r\n                );\r\n\r\n                ClearCollect(\r\n                    colPunchStatuses_Filter,\r\n                    SortByColumns(\r\n                        ForAll(\r\n                            Table(objCatalogs.Table4),\r\n                            With(\r\n                                { r: ThisRecord.Value },\r\n                                {\r\n                                    StatusCode: Text(r.StatusCode),\r\n                                    StatusLabel: Text(r.StatusLabel),\r\n                                    SortOrder:\r\n                                        If(\r\n                                            IsBlank(Text(r.SortOrder)) || Text(r.SortOrder) = \"null\",\r\n                                            999,\r\n                                            Value(Text(r.SortOrder))\r\n                                        )\r\n                                }\r\n                            )\r\n                        ),\r\n                        \"SortOrder\",\r\n                        SortOrder.Ascending,\r\n                        \"StatusCode\",\r\n                        SortOrder.Ascending\r\n                    )\r\n                );\r\n\r\n                ClearCollect(\r\n                    colPunchDisciplines_Filter,\r\n                    SortByColumns(\r\n                        ForAll(\r\n                            Table(objCatalogs.Table5),\r\n                            With(\r\n                                { r: ThisRecord.Value },\r\n                                {\r\n                                    Discipline: Text(r.Discipline),\r\n                                    DisciplineLabel: Text(r.DisciplineLabel)\r\n                                }\r\n                            )\r\n                        ),\r\n                        \"DisciplineLabel\",\r\n                        SortOrder.Ascending\r\n                    )\r\n                );\r\n\r\n                ClearCollect(\r\n                    colPunchSubcontractors_Filter,\r\n                    SortByColumns(\r\n                        ForAll(\r\n                            Table(objCatalogs.Table6),\r\n                            With(\r\n                                { r: ThisRecord.Value },\r\n                                {\r\n                                    SubcontractorId:\r\n                                        If(\r\n                                            IsBlank(Text(r.SubcontractorId)) || Text(r.SubcontractorId) = \"null\",\r\n                                            Blank(),\r\n                                            Value(Text(r.SubcontractorId))\r\n                                        ),\r\n                                    SubcontractorCode: Text(r.SubcontractorCode),\r\n                                    SubcontractorName: Text(r.SubcontractorName),\r\n                                    SubcontractorFullName: Text(r.SubcontractorFullName)\r\n                                }\r\n                            )\r\n                        ),\r\n                        \"SubcontractorName\",\r\n                        SortOrder.Ascending\r\n                    )\r\n                );\r\n\r\n                Set(varPunchCatalogs_ProjectId, varProjectId)\r\n\r\n                ;\r\n\r\n                Select(btnPunches_LoadDynamicFilters_1)\r\n\r\n                \r\n            )\r\n        ),\r\n\r\n        Set(varPunchCatalogs_Error, FirstError.Message);\r\n\r\n        Notify(\r\n            \"Punch filter catalogs could not be loaded.\",\r\n            NotificationType.Warning\r\n        );\r\n\r\n        Clear(colPunchSubsystems_Filter);\r\n        Clear(colPunchTemplates_Filter);\r\n        Clear(colPunchCategories_Filter);\r\n        Clear(colPunchStatuses_Filter);\r\n        Clear(colPunchDisciplines_Filter);\r\n        Clear(colPunchSubcontractors_Filter);\r\n\r\n        Set(varPunchCatalogs_ProjectId, Blank())\r\n    );\r\n\r\n    Set(varPunchCatalogs_IsLoading, false);\r\n\r\n    Set(varGlobalLoading, false);\r\n    Set(varGlobalLoadingMsg, \"\");\r\n    Set(varGlobalLoadingSubMsg, \"\");\r\n    Set(varGlobalLoadingScope, \"\")\r\n);\r\n\r\nSet(varPunches_ViewReady, true);\r\n\r\nIf(\r\n    varPunches_AutoLoad,\r\n\r\n    Set(varPunches_AutoLoad, false);\r\n\r\n    Set(varGlobalLoading, true);\r\n    Set(varGlobalLoadingMsg, \"Loading Punches...\");\r\n    Set(\r\n        varGlobalLoadingSubMsg,\r\n        If(\r\n            varPunches_FilterSource = \"Dashboard\",\r\n            \"Applying Home Dashboard context\",\r\n            \"Applying Overview context\"\r\n        )\r\n    );\r\n    Set(varGlobalLoadingScope, \"PUNCHES\");\r\n\r\n    Select(btnPunches_LoadPage_Punches_1)\r\n);\r\n\r\nSet(varPunchSubsystemPopup, false);\r\n\r\n"
    Children:
      - conPunchesScreenRoot_1:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =varTheme_PageBg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width
          Children:
            - cmp_NavApp_Punches_1:
                Control: CanvasComponent
                ComponentName: cmp_SidebarNav
                Properties:
                  ActiveKey: =varAppView
                  AppVersion: ="Text"
                  EnvironmentLabel: ="Text"
                  Fill: =varTheme_PulseBlue
                  Height: =Parent.Height
                  IsCollapsed: =true
                  Items: =colSidebarNavItems
                  NavItems: =colSidebarNavItems
                  OnSelectItem: "=\n\n\n\nWith(\n    {\n        _key: Lower(Trim(Self.SelectedItemKey)),\n        _hasProject: !IsBlank(varProjectId),\n        _hasConfig: varProjectHasReportConfig || varHomeHiveLoaded || varProjectHasPHRData\n    },\n\n    If(\n        _key = \"superadmin\",\n\n        Set(varGlobalLoading, false);\n        Set(varGlobalLoadingMsg, \"\");\n        Set(varGlobalLoadingSubMsg, \"\");\n        Set(varGlobalLoadingScope, \"\");\n        Set(varGlobalLoadAction, \"\");\n        Set(varGlobalLoadPending, false);\n\n        Set(varPHR_IsLoading, false);\n        Set(varOps_IsLoading, false);\n        Set(varTasks_IsLoading, false);\n        Set(varPunches_IsLoading, false);\n        Set(varCfg_IsLoading, false);\n\n        Set(varAppView, \"SuperAdmin\");\n        Set(varPageKey, \"SUPERADMIN\");\n        Set(varPageTitle, \"Administration\");\n        Set(varPageSubtitle, \"Platform configuration and governance\");\n\n        Navigate(scr_SuperAdmin, ScreenTransition.None),\n\n        If(\n            _key <> \"home\" && !_hasProject,\n\n            Notify(\"Please select a project first.\", NotificationType.Warning);\n\n            Set(varAppView, \"Home\");\n            Set(varPageKey, \"HOME\");\n            Set(varPageTitle, \"Home\");\n            Set(varPageSubtitle, \"Project command center\");\n\n            Navigate(scr_Home, ScreenTransition.None),\n\n            If(\n                _key in [\"overview\", \"tasks\", \"punches\", \"briefing\", \"config\", \"skyline\"] && !_hasConfig,\n\n                Notify(\n                    \"This project has no published report configuration yet.\",\n                    NotificationType.Warning\n                );\n\n                Set(varAppView, \"Home\");\n                Set(varPageKey, \"HOME\");\n                Set(varPageTitle, \"Home\");\n                Set(varPageSubtitle, \"Project command center\");\n\n                Navigate(scr_Home, ScreenTransition.None),\n\n                Switch(\n                    _key,\n\n                    \"skyline\",\n                    Set(varAppView, \"Skyline\");\n                    Set(varPageKey, \"SKYLINE\");\n                    Set(varPageTitle, \"Delivery Skyline\");\n                    Set(varPageSubtitle, \"Weekly subsystem delivery risk and workload forecast\");\n                    Set(varSkylineLoaded, false);\n                    Set(varSkylineError, \"\");\n                    Clear(colSkylineRaw);\n                    Clear(colSkylineWeeks);\n                    Clear(colSkylineSelectedWeek);\n\n                    Navigate(scr_Skyline, ScreenTransition.None),\n\n                    \n                    \"home\",\n                        Set(varGlobalLoading, false);\n                        Set(varGlobalLoadingMsg, \"\");\n                        Set(varGlobalLoadingSubMsg, \"\");\n                        Set(varGlobalLoadingScope, \"\");\n                        Set(varGlobalLoadAction, \"\");\n                        Set(varGlobalLoadPending, false);\n\n                        Set(varPHR_IsLoading, false);\n                        Set(varOps_IsLoading, false);\n                        Set(varTasks_IsLoading, false);\n                        Set(varPunches_IsLoading, false);\n                        Set(varCfg_IsLoading, false);\n\n                        Set(varAppView, \"Home\");\n                        Set(varPageKey, \"HOME\");\n                        Set(varPageTitle, \"Home\");\n                        Set(varPageSubtitle, \"Project command center\");\n                        Set(varHomeViewMode, \"DASHBOARD\");\n\n                        Navigate(scr_Home, ScreenTransition.None),\n\n                    \"overview\",\n                        Set(varAppView, \"Overview\");\n                        Set(varPageKey, \"OVERVIEW\");\n                        Set(varPageTitle, \"Overview\");\n                        Set(varPageSubtitle, \"Project Handover Report by subsystem, discipline and form family\");\n                        Set(varOps_ViewMode, \"OVERVIEW\");\n\n                        Navigate(scr_Overview, ScreenTransition.None),\n\n\n\n                    \"tasks\",\n                        Set(varAppView, \"Tasks\");\n                        Set(varPageKey, \"TASKS\");\n                        Set(varPageTitle, \"Tasks\");\n                        Set(varPageSubtitle, \"Inspection task management\");\n\n                        Navigate(scr_Tasks, ScreenTransition.None),\n\n                    \"punches\",\n                        Set(varAppView, \"Punches\");\n                        Set(varPageKey, \"PUNCHES\");\n                        Set(varPageTitle, \"Punch List\");\n                        Set(varPageSubtitle, \"Punch item management\");\n\n                        Navigate(scr_Punches_1, ScreenTransition.None),\n\n                    \"briefing\",\n                        Set(varAppView, \"Briefing\");\n                        Set(varPageKey, \"BRIEFING\");\n                        Set(varPageTitle, \"Briefing\");\n                        Set(varPageSubtitle, \"Project reporting and communication\");\n\n                        Navigate(scr_Briefing, ScreenTransition.None),\n\n                    \"config\",\n                        Set(varAppView, \"Config\");\n                        Set(varPageKey, \"CONFIG\");\n                        Set(varPageTitle, \"Configuration\");\n                        Set(varPageSubtitle, \"Report structure and scope management\");\n\n                        Navigate(scr_Config_NEW, ScreenTransition.None),\n\n                    Notify(\"Key not mapped: [\" & _key & \"]\", NotificationType.Error)\n                )\n            )\n        )\n    )\n)"
                  OnToggleCollapse: =
                  ProjectCode: =Coalesce(Text(varSelectedProject.ProjectCode), "")
                  ProjectName: =Coalesce(varSelectedProject.ProjectName, "")
                  UserRole: ="Text"
                  Width: =154
            - btnPunches_LoadPage_Punches_1:
                Control: ModernButton@1.0.0
                Properties:
                  Align: =Align.Center
                  FontWeight: =""
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: |-
                    =


                    // =====================================================
                    // btnPunches_LoadPage_Punches.OnSelect
                    // Load Punches safely using staging collection
                    // Flow parameter order:
                    // ProjectId, Subsystem, Discipline, Subcontractor,
                    // PageNumber, PageSize, TemplateId, CategoryCode,
                    // StatusCode, CustomFiltersJson
                    // =====================================================

                    If(
                        IsBlank(varProjectId),

                        Notify("Please select a project first.", NotificationType.Warning);

                        Set(varPunches_IsLoading, false);
                        Set(varGlobalLoading, false);
                        Set(varGlobalLoadingMsg, "");
                        Set(varGlobalLoadingSubMsg, "");
                        Set(varGlobalLoadingScope, "");

                        Exit()
                    );

                    If(
                        varPunches_IsLoading,

                        Notify("Punches are already loading.", NotificationType.Information);

                        Set(varGlobalLoading, false);
                        Set(varGlobalLoadingMsg, "");
                        Set(varGlobalLoadingSubMsg, "");
                        Set(varGlobalLoadingScope, "");

                        Exit()
                    );

                    Set(varPunches_IsLoading, true);
                    Set(varPunches_Error, "");
                    Set(varLoadingMsg, "Loading punches...");

                    Set(varGlobalLoading, true);
                    Set(varGlobalLoadingMsg, "Loading Punches...");
                    Set(varGlobalLoadingSubMsg, "Preparing punch list");
                    Set(varGlobalLoadingScope, "PUNCHES");

                    Set(
                        varPunchCustomFiltersJson_Safe,
                        If(
                            IsBlank(varPunchCustomFiltersJson) ||
                            Trim(varPunchCustomFiltersJson) = "" ||
                            Trim(varPunchCustomFiltersJson) = " ",
                            "[]",
                            varPunchCustomFiltersJson
                        )
                    );

                    Clear(colPunches_Staging);

                    IfError(
                        With(
                            {
                                resp:
                                    Warroom_Punches_Filtered_Paged.Run(
                                        Value(varProjectId),

                                        If(
                                            IsBlank(varFilter_SubsystemsCsv),
                                            " ",
                                            Text(varFilter_SubsystemsCsv)
                                        ),
                                        If(IsBlank(varFilter_PunchDiscipline), " ", Text(varFilter_PunchDiscipline)),
                                        If(IsBlank(varFilter_Subcontractor), " ", Text(varFilter_Subcontractor)),

                                        Value(Coalesce(varPunches_Page, 1)),
                                        Value(Coalesce(varPunches_PageSize, 50)),

                                        If(
                                            IsBlank(varFilter_PunchTemplateId),
                                            0,
                                            Value(varFilter_PunchTemplateId)
                                        ),

                                        If(IsBlank(varFilter_PunchCategoryCode), " ", Text(varFilter_PunchCategoryCode)),
                                        If(IsBlank(varFilter_PunchStatusCode), " ", Text(varFilter_PunchStatusCode)),

                                        varPunchCustomFiltersJson_Safe
                                    )
                            },
                            With(
                                {
                                    arr: Table(ParseJSON(Coalesce(resp.result, "[]")))
                                },
                                ClearCollect(
                                    colPunches_Staging,
                                    ForAll(
                                        arr,
                                        With(
                                            { r: ThisRecord.Value },
                                            {
                                                AreaCode: Text(r.AreaCode),
                                                UnitCode: Text(r.UnitCode),
                                                SystemCode: Text(r.SystemCode),
                                                SubsystemCode: Text(r.SubsystemCode),
                                                ElementCode: Text(r.ElementCode),
                                                ElementDiscipline: Text(r.ElementDiscipline),
                                                TypeCode: Text(r.TypeCode),

                                                ProjectId:
                                                    If(
                                                        IsBlank(Text(r.ProjectId)) || Text(r.ProjectId) = "null",
                                                        varProjectId,
                                                        Value(Text(r.ProjectId))
                                                    ),

                                                TemplateId:
                                                    If(
                                                        IsBlank(Text(r.TemplateId)) || Text(r.TemplateId) = "null",
                                                        Blank(),
                                                        Value(Text(r.TemplateId))
                                                    ),

                                                PunchId:
                                                    If(
                                                        IsBlank(Text(r.Id)) || Text(r.Id) = "null",
                                                        0,
                                                        Value(Text(r.Id))
                                                    ),

                                                PunchCode: Text(r.Code),
                                                PunchDescription: Text(r.Description),

                                                PunchCoordinator: Text(r.PunchCoordinator),
                                                Originator: Text(r.Originator),

                                                CategoryCode: Text(r.CategoryCode),
                                                Category: Text(r.Category),

                                                PunchDiscipline: Text(r.Discipline),
                                                StatusCode: Text(r.StatusCode),
                                                PunchStatus: Text(r.Status),

                                                InspectionCode: Text(r.InspectionCode),
                                                InspectionName: Text(r.InspectionName),
                                                InspectionType: Text(r.InspectionType),

                                                EntryType: Text(r.EntryType),
                                                EntryTypeColor: Text(r.EntryTypeColor),
                                                Topic: Text(r.Topic),

                                                RejectCount:
                                                    If(
                                                        IsBlank(Text(r.RejectCount)) || Text(r.RejectCount) = "null",
                                                        0,
                                                        Value(Text(r.RejectCount))
                                                    ),

                                                ElementCodeMapped: Text(r.ElementCodeMapped),

                                                SubcontractorId:
                                                    If(
                                                        IsBlank(Text(r.SubcontractorId)) || Text(r.SubcontractorId) = "null",
                                                        Blank(),
                                                        Value(Text(r.SubcontractorId))
                                                    ),

                                                SubcontractorCode: Text(r.SubcontractorCode),
                                                SubcontractorName: Text(r.SubcontractorName),
                                                SubcontractorShortName: Text(r.SubcontractorShortName),

                                                DepartmentAction: Text(r.DepartmentAction),

                                                CustomJson: Coalesce(Text(r.CustomJson), "{}"),
                                                CustomFlag1: Boolean(r.CustomFlag1),
                                                CustomFlag2: Boolean(r.CustomFlag2),
                                                CustomText1: Text(r.CustomText1),
                                                CustomText2: Text(r.CustomText2),

                                                CustomDate1:
                                                    If(
                                                        IsBlank(Text(r.CustomDate1)) || Text(r.CustomDate1) = "null",
                                                        Blank(),
                                                        DateValue(Text(r.CustomDate1))
                                                    ),

                                                CustomNumber1:
                                                    If(
                                                        IsBlank(Text(r.CustomNumber1)) || Text(r.CustomNumber1) = "null",
                                                        Blank(),
                                                        Value(Text(r.CustomNumber1))
                                                    ),

                                                CustomLastUpdatedByEmail: Text(r.CustomLastUpdatedByEmail),

                                                CustomLastUpdatedOn:
                                                    If(
                                                        IsBlank(Text(r.CustomLastUpdatedOn)) || Text(r.CustomLastUpdatedOn) = "null",
                                                        Blank(),
                                                        DateTimeValue(Text(r.CustomLastUpdatedOn))
                                                    ),

                                                LastCommentOn:
                                                    If(
                                                        IsBlank(Text(r.LastCommentOn)) || Text(r.LastCommentOn) = "null",
                                                        Blank(),
                                                        DateTimeValue(Text(r.LastCommentOn))
                                                    ),

                                                LastCommentText: Text(r.LastCommentText),
                                                LastCommentByEmail: Text(r.LastCommentByEmail),

                                                CommentCount:
                                                    If(
                                                        IsBlank(Text(r.CommentCount)) || Text(r.CommentCount) = "null",
                                                        0,
                                                        Value(Text(r.CommentCount))
                                                    ),

                                                TotalRows:
                                                    If(
                                                        IsBlank(Text(r.TotalRows)) || Text(r.TotalRows) = "null",
                                                        0,
                                                        Value(Text(r.TotalRows))
                                                    ),

                                                TotalPages:
                                                    If(
                                                        IsBlank(Text(r.TotalPages)) || Text(r.TotalPages) = "null",
                                                        0,
                                                        Value(Text(r.TotalPages))
                                                    ),

                                                PageNumber:
                                                    If(
                                                        IsBlank(Text(r.PageNumber)) || Text(r.PageNumber) = "null",
                                                        varPunches_Page,
                                                        Value(Text(r.PageNumber))
                                                    ),

                                                PageSize:
                                                    If(
                                                        IsBlank(Text(r.PageSize)) || Text(r.PageSize) = "null",
                                                        varPunches_PageSize,
                                                        Value(Text(r.PageSize))
                                                    )
                                            }
                                        )
                                    )
                                )
                            )
                        ),

