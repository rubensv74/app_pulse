                              ColorValue("#EFF6FF")
                          )
                        FillPortions: =0
                        Height: =54
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        PaddingLeft: =24
                        PaddingRight: =24
                      Children:
                        - icoPunchExportWarning_1:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Color: |-
                                =If(
                                    varPunchExportMode = "CLIENT",
                                    ColorValue("#C2410C"),
                                    ColorValue("#1D4ED8")
                                )
                              Height: =22
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              Icon: |-
                                =If(
                                    varPunchExportMode = "CLIENT",
                                    Icon.Warning,
                                    Icon.Information
                                )
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              Width: =22
                        - lblPunchExportWarning_1:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: |-
                                =If(
                                    varPunchExportMode = "CLIENT",
                                    ColorValue("#9A3412"),
                                    ColorValue("#1E40AF")
                                )
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              Height: =42
                              Size: =10
                              Text: |-
                                =If(
                                    varPunchExportMode = "CLIENT",
                                    "Columns not selected will be removed from the workbook. Hidden columns will not be used for client exports.",
                                    "Internal exports may contain operational and sensitive project information."
                                )
                  - conPunchExportFooter_1:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =ColorValue("#FFFFFF")
                        FillPortions: =0
                        Height: =72
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        PaddingBottom: =14
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =14
                      Children:
                        - btnPunchExportCancel_1:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Secondary
                              BasePaletteColor: =varTheme_PulseBlueDark
                              Height: =40
                              OnSelect: |-
                                =Set(varShowPunchExportColumns, false);
                                Set(varPunchExportColumnsJson, "[]");
                                Clear(colPunchExportColumns)
                              Text: ="Cancel"
                              Width: =110
                        - btnPunchExportContinue_1:
                            Control: ModernButton@1.0.0
                            Properties:
                              BasePaletteColor: =varTheme_PulseBlueDark
                              DisplayMode: |-
                                =If(
                                    varPunchExportLoading ||
                                    CountRows(
                                        Filter(
                                            colPunchExportColumns,
                                            IsSelected
                                        )
                                    ) = 0,
                                    DisplayMode.Disabled,
                                    DisplayMode.Edit
                                )
                              Height: =40
                              Icon: ="ArrowDownload"
                              OnSelect: |
                                =// =====================================================
                                // btnPunchExportContinue.OnSelect
                                // Generate Punch export using selected columns
                                //
                                // Flow parameter order:
                                // 1. ProjectId
                                // 2. SubsystemCode
                                // 3. TemplateId
                                // 4. CategoryCode
                                // 5. StatusCode
                                // 6. PunchDiscipline
                                // 7. Subcontractor
                                // 8. CustomFiltersJson
                                // 9. RequestedByEmail
                                // 10. RequestedByName
                                // 11. ExportMode
                                // 12. SelectedColumnsJson
                                // =====================================================

                                If(
                                    CountRows(
                                        Filter(
                                            colPunchExportColumns,
                                            IsSelected
                                        )
                                    ) = 0,

                                    Notify(
                                        "Select at least one export column.",
                                        NotificationType.Warning
                                    ),

                                    Set(
                                        varPunchExportColumnsJson,
                                        JSON(
                                            ShowColumns(
                                                SortByColumns(
                                                    Filter(
                                                        colPunchExportColumns,
                                                        IsSelected
                                                    ),
                                                    "SortOrder",
                                                    SortOrder.Ascending
                                                ),
                                                ColumnKey,
                                                ColumnLabel,
                                                SortOrder
                                            ),
                                            JSONFormat.Compact
                                        )
                                    );

                                    Set(varPunchExportLoading, true);
                                    Set(varPunchExportError, "");
                                    Set(varPunchExportResult, Blank());

                                    Set(varShowPunchExportColumns, false);

                                    Set(varGlobalLoading, true);
                                    Set(varGlobalLoadingMsg, "Exporting Punches...");
                                    Set(
                                        varGlobalLoadingSubMsg,
                                        "Applying filters and selected export columns"
                                    );
                                    Set(varGlobalLoadingScope, "PUNCHES");

                                    Set(
                                        varPunchExportCustomFiltersJson,
                                        If(
                                            IsBlank(varPunchCustomFiltersJson) ||
                                            Trim(varPunchCustomFiltersJson) = "" ||
                                            Trim(varPunchCustomFiltersJson) = " ",
                                            "[]",
                                            varPunchCustomFiltersJson
                                        )
                                    );

                                    Set(
                                        varPunchExportSubsystems,
                                        If(
                                            IsBlank(varFilter_SubsystemsCsv) ||
                                            Trim(varFilter_SubsystemsCsv) = "",
                                            " ",
                                            Text(varFilter_SubsystemsCsv)
                                        )
                                    );

                                    Set(
                                        varPunchExportTemplateId,
                                        If(
                                            IsBlank(varFilter_PunchTemplateId),
                                            0,
                                            Value(varFilter_PunchTemplateId)
                                        )
                                    );

                                    Set(
                                        varPunchExportCategoryCode,
                                        If(
                                            IsBlank(varFilter_PunchCategoryCode),
                                            " ",
                                            Text(varFilter_PunchCategoryCode)
                                        )
                                    );

                                    Set(
                                        varPunchExportStatusCode,
                                        If(
                                            IsBlank(varFilter_PunchStatusCode),
                                            " ",
                                            Text(varFilter_PunchStatusCode)
                                        )
                                    );

                                    Set(
                                        varPunchExportDiscipline,
                                        If(
                                            IsBlank(varFilter_PunchDiscipline),
                                            " ",
                                            Text(varFilter_PunchDiscipline)
                                        )
                                    );

                                    Set(
                                        varPunchExportSubcontractor,
                                        If(
                                            IsBlank(varFilter_Subcontractor),
                                            " ",
                                            Text(varFilter_Subcontractor)
                                        )
                                    );

                                    IfError(
                                        Set(
                                            varPunchExportResult,
                                            Warroom_ExportPunchesToExcel.Run(
                                                Value(varProjectId),
                                                varPunchExportSubsystems,
                                                varPunchExportTemplateId,
                                                varPunchExportCategoryCode,
                                                varPunchExportStatusCode,
                                                varPunchExportDiscipline,
                                                varPunchExportSubcontractor,
                                                varPunchExportCustomFiltersJson,
                                                User().Email,
                                                User().FullName,
                                                varPunchExportMode,
                                                varPunchExportColumnsJson
                                            )
                                        ),

                                        Set(
                                            varPunchExportError,
                                            Coalesce(
                                                FirstError.Message,
                                                "The Excel export could not be generated."
                                            )
                                        )
                                    );

                                    Set(varPunchExportLoading, false);

                                    Set(varGlobalLoading, false);
                                    Set(varGlobalLoadingMsg, "");
                                    Set(varGlobalLoadingSubMsg, "");
                                    Set(varGlobalLoadingScope, "");

                                    If(
                                        !IsBlank(varPunchExportError),

                                        Notify(
                                            "Error exporting punches: " & varPunchExportError,
                                            NotificationType.Error,
                                            10000
                                        ),

                                        IsBlank(varPunchExportResult),

                                        Notify(
                                            "The export Flow returned no response.",
                                            NotificationType.Error
                                        ),

                                        Coalesce(varPunchExportResult.success, false),

                                        Notify(
                                            "Excel export generated successfully. " &
                                            Text(Coalesce(varPunchExportResult.rowcount, 0)) &
                                            " punches exported.",
                                            NotificationType.Success
                                        );

                                        If(
                                            !IsBlank(varPunchExportResult.fileurl),

                                            Launch(varPunchExportResult.fileurl),

                                            Notify(
                                                "The Excel was generated, but the file link was not returned.",
                                                NotificationType.Warning
                                            )
                                        ),

                                        Notify(
                                            Coalesce(
                                                varPunchExportResult.message,
                                                "The Excel export could not be generated."
                                            ),
                                            NotificationType.Error,
                                            10000
                                        )
                                    )
                                )
                              Text: |-
                                =If(
                                    varPunchExportLoading,
                                    "Exporting...",
                                    "Generate export"
                                )
                              Width: =160
