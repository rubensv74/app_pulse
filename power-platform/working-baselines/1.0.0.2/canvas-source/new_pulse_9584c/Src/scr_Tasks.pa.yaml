Screens:
  scr_Tasks:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =

        // =====================================================
        // scr_Tasks.OnVisible
        // Tasks initialization
        // Source of truth for filter catalogs:
        // Warroom_Tasks_GetFilterCatalogs
        // =====================================================

        Set(varAppView, "Tasks");

        Set(varPageKey, "TASKS");
        Set(varPageTitle, "Tasks");
        Set(varPageSubtitle, "Inspection task management");

        Set(varTasks_ViewReady, false);

        Set(varTasks_FilterSource, Coalesce(varTasks_FilterSource, "Manual"));

        Set(varTasks_Page, Coalesce(varTasks_Page, 1));
        Set(varTasks_PageSize, Coalesce(varTasks_PageSize, 20));

        Set(varTasks_IsLoading, false);
        Set(varTasks_Error, Coalesce(varTasks_Error, ""));

        Set(varTaskCatalogs_IsLoading, false);
        Set(varTaskCatalogs_Error, "");

        Set(varFilter_TaskSubsystem, Coalesce(varFilter_TaskSubsystem, Blank()));
        Set(varFilter_TaskDiscipline, Coalesce(varFilter_TaskDiscipline, Blank()));
        Set(varFilter_TaskSubcontractor, Coalesce(varFilter_TaskSubcontractor, Blank()));
        Set(varFilter_TaskStatusId, Coalesce(varFilter_TaskStatusId, Blank()));

        Set(varGlobalLoading, false);
        Set(varGlobalLoadingMsg, "");
        Set(varGlobalLoadingSubMsg, "");
        Set(varGlobalLoadingScope, "");

        If(
            !IsBlank(varProjectId) &&
            (
                IsBlank(varTaskCatalogs_ProjectId) ||
                Text(varTaskCatalogs_ProjectId) <> Text(varProjectId) ||
                CountRows(colTaskSubsystems_Filter) = 0 ||
                CountRows(colTaskStatuses_Filter) = 0
            ),

            Set(varTaskCatalogs_IsLoading, true);
            Set(varTaskCatalogs_Error, "");

            Set(varGlobalLoading, true);
            Set(varGlobalLoadingMsg, "Loading Task filters...");
            Set(varGlobalLoadingSubMsg, "Preparing subsystem, discipline, subcontractor and status catalogs");
            Set(varGlobalLoadingScope, "TASKS");

            IfError(
                With(
                    {
                        respCatalogs:
                            Warroom_Tasks_GetFilterCatalogs.Run(
                                Value(varProjectId)
                            )
                    },
                    With(
                        {
                            objCatalogs:
                                ParseJSON(Coalesce(respCatalogs.result, "{}"))
                        },

                        ClearCollect(
                            colTaskSubsystems_Filter,
                            SortByColumns(
                                ForAll(
                                    Table(objCatalogs.Table1),
                                    With(
                                        { r: ThisRecord.Value },
                                        {
                                            Code: Text(r.Code),
                                            Label: Text(r.Label),
                                            SortOrder:
                                                If(
                                                    IsBlank(Text(r.SortOrder)) || Text(r.SortOrder) = "null",
                                                    1,
                                                    Value(Text(r.SortOrder))
                                                )
                                        }
                                    )
                                ),
                                "SortOrder", SortOrder.Ascending,
                                "Code", SortOrder.Ascending
                            )
                        );

                        ClearCollect(
                            colTaskDisciplines_Filter,
                            SortByColumns(
                                ForAll(
                                    Table(objCatalogs.Table2),
                                    With(
                                        { r: ThisRecord.Value },
                                        {
                                            Discipline: Text(r.Discipline),
                                            DisciplineLabel: Text(r.DisciplineLabel)
                                        }
                                    )
                                ),
                                "DisciplineLabel", SortOrder.Ascending
                            )
                        );

                        ClearCollect(
                            colTaskSubcontractors_Filter,
                            SortByColumns(
                                ForAll(
                                    Table(objCatalogs.Table3),
                                    With(
                                        { r: ThisRecord.Value },
                                        {
                                            SubcontractCode: Text(r.SubcontractCode),
                                            SubcontractorName: Text(r.SubcontractorName),
                                            DisplayLabel: Text(r.DisplayLabel)
                                        }
                                    )
                                ),
                                "DisplayLabel", SortOrder.Ascending
                            )
                        );

                        ClearCollect(
                            colTaskStatuses_Filter,
                            SortByColumns(
                                ForAll(
                                    Table(objCatalogs.Table4),
                                    With(
                                        { r: ThisRecord.Value },
                                        {
                                            TaskStatusId:
                                                If(
                                                    IsBlank(Text(r.TaskStatusId)) || Text(r.TaskStatusId) = "null",
                                                    Blank(),
                                                    Value(Text(r.TaskStatusId))
                                                ),
                                            TaskStatusName: Text(r.TaskStatusName),
                                            DisplayLabel: Text(r.DisplayLabel)
                                        }
                                    )
                                ),
                                "TaskStatusId", SortOrder.Ascending
                            )
                        );

                        Set(varTaskCatalogs_ProjectId, varProjectId)
                    )
                ),

                Set(varTaskCatalogs_Error, FirstError.Message);

                Notify(
                    "Task filter catalogs could not be loaded.",
                    NotificationType.Warning
                );

                Clear(colTaskSubsystems_Filter);
                Clear(colTaskDisciplines_Filter);
                Clear(colTaskSubcontractors_Filter);
                Clear(colTaskStatuses_Filter);

                Set(varTaskCatalogs_ProjectId, Blank())
            );

            Set(varTaskCatalogs_IsLoading, false);

            Set(varGlobalLoading, false);
            Set(varGlobalLoadingMsg, "");
            Set(varGlobalLoadingSubMsg, "");
            Set(varGlobalLoadingScope, "")
        );

        Set(varTasks_ViewReady, true);

        If(
            varTasks_AutoLoad,

            Set(varTasks_AutoLoad, false);

            Set(varGlobalLoading, true);
            Set(varGlobalLoadingMsg, "Loading Tasks...");
            Set(varGlobalLoadingSubMsg, "Applying Overview context");
            Set(varGlobalLoadingScope, "TASKS");

            Select(btnTasks_LoadPage_Tasks)
        );
    Children:
      - conTasksScreenRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =varTheme_PageBg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width
          Children:
            - cmp_NavApp_Tasks:
                Control: CanvasComponent
                ComponentName: cmp_SidebarNav
                Properties:
                  ActiveKey: =varAppView
                  AppVersion: ="Text"
                  EnvironmentLabel: ="Text"
                  Fill: =varTheme_PulseBlue
                  Height: =Parent.Height
                  IsCollapsed: =true
                  Items: =colSidebarNavItems
                  NavItems: =colSidebarNavItems
                  OnSelectItem: "=\n\n\n\n\nWith(\n    {\n        _key: Lower(Trim(Self.SelectedItemKey)),\n        _hasProject: !IsBlank(varProjectId),\n        _hasConfig: varProjectHasReportConfig || varHomeHiveLoaded || varProjectHasPHRData\n    },\n\n    If(\n        _key = \"superadmin\",\n\n        Set(varGlobalLoading, false);\n        Set(varGlobalLoadingMsg, \"\");\n        Set(varGlobalLoadingSubMsg, \"\");\n        Set(varGlobalLoadingScope, \"\");\n        Set(varGlobalLoadAction, \"\");\n        Set(varGlobalLoadPending, false);\n\n        Set(varPHR_IsLoading, false);\n        Set(varOps_IsLoading, false);\n        Set(varTasks_IsLoading, false);\n        Set(varPunches_IsLoading, false);\n        Set(varCfg_IsLoading, false);\n\n        Set(varAppView, \"SuperAdmin\");\n        Set(varPageKey, \"SUPERADMIN\");\n        Set(varPageTitle, \"Administration\");\n        Set(varPageSubtitle, \"Platform configuration and governance\");\n\n        Navigate(scr_SuperAdmin, ScreenTransition.None),\n\n        If(\n            _key <> \"home\" && !_hasProject,\n\n            Notify(\"Please select a project first.\", NotificationType.Warning);\n\n            Set(varAppView, \"Home\");\n            Set(varPageKey, \"HOME\");\n            Set(varPageTitle, \"Home\");\n            Set(varPageSubtitle, \"Project command center\");\n\n            Navigate(scr_Home, ScreenTransition.None),\n\n            If(\n                _key in [\"overview\", \"tasks\", \"punches\", \"briefing\", \"config\", \"skyline\"] && !_hasConfig,\n\n                Notify(\n                    \"This project has no published report configuration yet.\",\n                    NotificationType.Warning\n                );\n\n                Set(varAppView, \"Home\");\n                Set(varPageKey, \"HOME\");\n                Set(varPageTitle, \"Home\");\n                Set(varPageSubtitle, \"Project command center\");\n\n                Navigate(scr_Home, ScreenTransition.None),\n\n                Switch(\n                    _key,\n\n                    \"skyline\",\n                    Set(varAppView, \"Skyline\");\n                    Set(varPageKey, \"SKYLINE\");\n                    Set(varPageTitle, \"Delivery Skyline\");\n                    Set(varPageSubtitle, \"Weekly subsystem delivery risk and workload forecast\");\n                    Set(varSkylineLoaded, false);\n                    Set(varSkylineError, \"\");\n                    Clear(colSkylineRaw);\n                    Clear(colSkylineWeeks);\n                    Clear(colSkylineSelectedWeek);\n\n                    Navigate(scr_Skyline, ScreenTransition.None),\n\n                    \n                    \"home\",\n                        Set(varGlobalLoading, false);\n                        Set(varGlobalLoadingMsg, \"\");\n                        Set(varGlobalLoadingSubMsg, \"\");\n                        Set(varGlobalLoadingScope, \"\");\n                        Set(varGlobalLoadAction, \"\");\n                        Set(varGlobalLoadPending, false);\n\n                        Set(varPHR_IsLoading, false);\n                        Set(varOps_IsLoading, false);\n                        Set(varTasks_IsLoading, false);\n                        Set(varPunches_IsLoading, false);\n                        Set(varCfg_IsLoading, false);\n\n                        Set(varAppView, \"Home\");\n                        Set(varPageKey, \"HOME\");\n                        Set(varPageTitle, \"Home\");\n                        Set(varPageSubtitle, \"Project command center\");\n                        Set(varHomeViewMode, \"DASHBOARD\");\n\n                        Navigate(scr_Home, ScreenTransition.None),\n\n                    \"overview\",\n                        Set(varAppView, \"Overview\");\n                        Set(varPageKey, \"OVERVIEW\");\n                        Set(varPageTitle, \"Overview\");\n                        Set(varPageSubtitle, \"Project Handover Report by subsystem, discipline and form family\");\n                        Set(varOps_ViewMode, \"OVERVIEW\");\n\n                        Navigate(scr_Overview, ScreenTransition.None),\n\n\n\n                    \"tasks\",\n                        Set(varAppView, \"Tasks\");\n                        Set(varPageKey, \"TASKS\");\n                        Set(varPageTitle, \"Tasks\");\n                        Set(varPageSubtitle, \"Inspection task management\");\n\n                        Navigate(scr_Tasks, ScreenTransition.None),\n\n                    \"punches\",\n                        Set(varAppView, \"Punches\");\n                        Set(varPageKey, \"PUNCHES\");\n                        Set(varPageTitle, \"Punch List\");\n                        Set(varPageSubtitle, \"Punch item management\");\n\n                        Navigate(scr_Punches, ScreenTransition.None),\n\n                    \"briefing\",\n                        Set(varAppView, \"Briefing\");\n                        Set(varPageKey, \"BRIEFING\");\n                        Set(varPageTitle, \"Briefing\");\n                        Set(varPageSubtitle, \"Project reporting and communication\");\n\n                        Navigate(scr_Briefing, ScreenTransition.None),\n\n                    \"config\",\n                        Set(varAppView, \"Config\");\n                        Set(varPageKey, \"CONFIG\");\n                        Set(varPageTitle, \"Configuration\");\n                        Set(varPageSubtitle, \"Report structure and scope management\");\n\n                        Navigate(scr_Config_NEW, ScreenTransition.None),\n\n                    Notify(\"Key not mapped: [\" & _key & \"]\", NotificationType.Error)\n                )\n            )\n        )\n    )\n)"
                  OnToggleCollapse: =
                  ProjectCode: =Coalesce(Text(varSelectedProject.ProjectCode), "")
                  ProjectName: =Coalesce(varSelectedProject.ProjectName, "")
                  UserRole: ="Text"
                  Width: =154
            - btnTasks_LoadPage_Tasks:
                Control: ModernButton@1.0.0
                Properties:
                  Align: =Align.Center
                  FontWeight: =""
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: |-
                    =


                    // =====================================================
                    // btnTasks_LoadPage_Tasks.OnSelect
                    // Load Tasks safely using staging collection
                    // Flow parameter order:
                    // ProjectId, SubsystemCode, ElementDiscipline, Subcontractor,
                    // TaskStatusId, PageNumber, PageSize, L3NodeId
                    // =====================================================

                    If(
                        IsBlank(varProjectId),

                        Notify("Please select a project first.", NotificationType.Warning);

                        Set(varTasks_IsLoading, false);
                        Set(varGlobalLoading, false);
                        Set(varGlobalLoadingMsg, "");
                        Set(varGlobalLoadingSubMsg, "");
                        Set(varGlobalLoadingScope, "");

                        Exit()
                    );

                    If(
                        varTasks_IsLoading,

                        Notify("Tasks are already loading.", NotificationType.Information);

                        Set(varGlobalLoading, false);
                        Set(varGlobalLoadingMsg, "");
                        Set(varGlobalLoadingSubMsg, "");
                        Set(varGlobalLoadingScope, "");

                        Exit()
                    );

                    Set(varTasks_IsLoading, true);
                    Set(varTasks_Error, "");
                    Set(varLoadingMsg, "Loading tasks...");

                    Set(varGlobalLoading, true);
                    Set(varGlobalLoadingMsg, "Loading Tasks...");
                    Set(varGlobalLoadingSubMsg, "Preparing task list");
                    Set(varGlobalLoadingScope, "TASKS");

                    Clear(colTasks_Staging);

                    IfError(
                        With(
                            {
                    resp:
                        Warroom_Tasks_Filtered_Paged.Run(
                            Value(varProjectId),

                            If(
                                IsBlank(varFilter_TaskSubsystem),
                                " ",
                                Text(varFilter_TaskSubsystem)
                            ),

                            If(
                                IsBlank(varFilter_TaskDiscipline),
                                " ",
                                Text(varFilter_TaskDiscipline)
                            ),

                            If(
                                IsBlank(varFilter_TaskSubcontractor),
                                " ",
                                Text(varFilter_TaskSubcontractor)
                            ),

                            Value(Coalesce(varTasks_Page, 1)),

                            If(
                                IsBlank(varOps_ToTasks_L3NodeId),
                                " ",
                                Text(varOps_ToTasks_L3NodeId)
                            ),

                            If(
                                IsBlank(varFilter_TaskStatusId),
                                0,
                                Value(varFilter_TaskStatusId)
                            ),
                            If(
                                varTasks_ApplyReportScope,
                                1,
                                0
                    )
                        )
                            },
                            With(
                                {
                                    arr: Table(ParseJSON(Coalesce(resp.result, "[]")))
                                },
                                ClearCollect(
                                    colTasks_Staging,
                                    ForAll(
                                        arr,
                                        With(
                                            { r: ThisRecord.Value },
                                            {
                                                AreaCode: Text(r.AreaCode),
                                                UnitCode: Text(r.UnitCode),
                                                SystemCode: Text(r.SystemCode),
                                                SubsystemCode: Text(r.SubsystemCode),
                                                ElementCode: Text(r.ElementCode),
                                                ElementDiscipline: Text(r.ElementDiscipline),
                                                ElementLevel: Text(r.ElementLevel),
                                                TypeCode: Text(r.TypeCode),

                                                InspectionTaskId:
                                                    If(
                                                        IsBlank(Text(r.InspectionTaskId)) || Text(r.InspectionTaskId) = "null",
                                                        0,
                                                        Value(Text(r.InspectionTaskId))
                                                    ),

                                                TaskPhase: Text(r.TaskPhase),
                                                FormName: Text(r.FormName),
                                                FormDescription: Text(r.FormDescription),
                                                Sct: Text(r.Sct),

                                                TaskStatusId:
                                                    If(
                                                        IsBlank(Text(r.TaskStatusId)) || Text(r.TaskStatusId) = "null",
                                                        Blank(),
                                                        Value(Text(r.TaskStatusId))
                                                    ),

                                                TaskStatus: Text(r.TaskStatus),
                                                TaskActive: Boolean(r.TaskActive),

                                                ClosingDate:
                                                    If(
                                                        IsBlank(Text(r.ClosingDate)) || Text(r.ClosingDate) = "null",
                                                        Blank(),
                                                        DateTimeValue(Text(r.ClosingDate))
                                                    ),

                                                SubcontractCode: Text(r.SubcontractCode),
                                                SubcontractorName: Text(r.SubcontractorName),

                                                CustomJson: Coalesce(Text(r.CustomJson), "{}"),
                                                CustomFlag1: Boolean(r.CustomFlag1),
                                                CustomFlag2: Boolean(r.CustomFlag2),
                                                CustomText1: Text(r.CustomText1),
                                                CustomText2: Text(r.CustomText2),

                                                CustomDate1:
                                                    If(
                                                        IsBlank(Text(r.CustomDate1)) || Text(r.CustomDate1) = "null",
                                                        Blank(),
                                                        DateValue(Text(r.CustomDate1))
                                                    ),

                                                CustomNumber1:
                                                    If(
                                                        IsBlank(Text(r.CustomNumber1)) || Text(r.CustomNumber1) = "null",
                                                        Blank(),
                                                        Value(Text(r.CustomNumber1))
                                                    ),

                                                CustomLastUpdatedByEmail: Text(r.CustomLastUpdatedByEmail),

                                                CustomLastUpdatedOn:
                                                    If(
                                                        IsBlank(Text(r.CustomLastUpdatedOn)) || Text(r.CustomLastUpdatedOn) = "null",
                                                        Blank(),
                                                        DateTimeValue(Text(r.CustomLastUpdatedOn))
                                                    ),

                                                LastCommentOn:
                                                    If(
                                                        IsBlank(Text(r.LastCommentOn)) || Text(r.LastCommentOn) = "null",
                                                        Blank(),
                                                        DateTimeValue(Text(r.LastCommentOn))
                                                    ),

                                                LastCommentText: Text(r.LastCommentText),
                                                LastCommentByEmail: Text(r.LastCommentByEmail),

                                                CommentCount:
                                                    If(
                                                        IsBlank(Text(r.CommentCount)) || Text(r.CommentCount) = "null",
                                                        0,
                                                        Value(Text(r.CommentCount))
                                                    ),

                                                TotalRows:
                                                    If(
                                                        IsBlank(Text(r.TotalRows)) || Text(r.TotalRows) = "null",
                                                        0,
                                                        Value(Text(r.TotalRows))
                                                    ),

                                                TotalPages:
                                                    If(
                                                        IsBlank(Text(r.TotalPages)) || Text(r.TotalPages) = "null",
                                                        0,
                                                        Value(Text(r.TotalPages))
                                                    ),

                                                PageNumber:
                                                    If(
                                                        IsBlank(Text(r.PageNumber)) || Text(r.PageNumber) = "null",
                                                        varTasks_Page,
                                                        Value(Text(r.PageNumber))
                                                    ),

                                                PageSize:
                                                    If(
                                                        IsBlank(Text(r.PageSize)) || Text(r.PageSize) = "null",
                                                        varTasks_PageSize,
                                                        Value(Text(r.PageSize))
                                                    )
                                            }
                                        )
                                    )
                                )
                            )
                        ),

                        Set(varTasks_Error, FirstError.Message)
                    );

                    If(
                        IsBlank(varTasks_Error),

                        ClearCollect(colTasks, colTasks_Staging);

                        Set(
                            varTasks_TotalPages,
                            If(
                                CountRows(colTasks) = 0,
                                0,
                                Coalesce(First(colTasks).TotalPages, 0)
                            )
                        );

                        Set(
                            varTasks_TotalRows,
                            If(
                                CountRows(colTasks) = 0,
                                0,
                                Coalesce(First(colTasks).TotalRows, 0)
                            )
                        );

                        Set(varTasksLoaded, true);
                        Set(varTasks_LastRefresh, Now()),

                        Notify(
                            "Error loading tasks: " & varTasks_Error,
                            NotificationType.Error
                        )
                    );

                    Set(varTasks_IsLoading, false);
                    Set(varLoadingMsg, "");

                    Set(varGlobalLoading, false);
                    Set(varGlobalLoadingMsg, "");
                    Set(varGlobalLoadingSubMsg, "");
                    Set(varGlobalLoadingScope, "");
                  PaddingBottom: =5
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =5
                  RadiusBottomLeft: =4
                  RadiusBottomRight: =4
                  RadiusTopLeft: =4
                  RadiusTopRight: =4
                  VerticalAlign: =VerticalAlign.Middle
                  Visible: =false
                  X: =40
                  Y: =40
            - conTasksContent:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  Width: =Parent.Width - cmp_NavApp_Tasks.Width
                Children:
                  - con_TasksRoot:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        Fill: =varTheme_PageBg
                        FillPortions: =0
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - conPageHeader_Tasks:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(226,232,240,1)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =varTheme_PageBg
                              FillPortions: =0
                              Height: =56
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - TextCanvas1_3:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =varTheme_Text
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =0
                                    PaddingLeft: =10
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Size: =24
                                    Text: =varPageTitle
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =120
                              - TextCanvas1_4:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =varTheme_TextMuted
                                    Height: =50
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =0
                                    PaddingLeft: =10
                                    PaddingRight: =
                                    PaddingTop: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Size: =12
                                    Text: =varPageSubtitle
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =Parent.Width
                        - conTasks_HeaderContext:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =90
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =8
                              PaddingLeft: =2
                              PaddingRight: =20
                              PaddingTop: =8
                            Children:
                              - conTasks_ProjectContext:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderColor: =varTheme_Border
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =varTheme_Surface
                                    FillPortions: =0
                                    Height: =Parent.Height
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                    Width: =440
                                  Children:
                                    - icoTasks_Project:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          Color: =ColorValue("#0B5ED7")
                                          DisabledBorderColor: =RGBA(245, 245, 245, 1)
                                          DisabledColor: =RGBA(225, 223, 221, 1)
                                          DisabledFill: =RGBA(0, 0, 0, 0)
                                          FocusedBorderThickness: =4
                                          Height: =22
                                          HoverBorderColor: =RGBA(0, 0, 0, 0)
                                          HoverColor: =RGBA(16, 110, 190, 1)
                                          HoverFill: =RGBA(0, 0, 0, 0)
                                          Icon: =Icon.Folder
                                          PressedBorderColor: =RGBA(0, 0, 0, 0)
                                          PressedColor: =RGBA(16, 110, 190, 1)
                                          PressedFill: =RGBA(0, 0, 0, 0)
                                          Width: =22
                                          X: =19
                                          Y: =26
                                    - lblTasks_CurrentProject:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =varTheme_TextMuted
                                          Size: =10
                                          Text: ="Current Project"
                                          Width: =320
                                          X: =48
                                          Y: =8
                                    - lblTasks_ProjectName:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =varTheme_Text
                                          FontWeight: =FontWeight.Bold
                                          Size: =12
                                          Text: |-
                                            =If(
                                                !IsBlank(varProjectId),
                                                Coalesce(varSelectedProject.ProjectCode, "") & " · " & Coalesce(varSelectedProject.ProjectName, ""),
                                                "No project selected"
                                            )
                                          Width: =340
                                          X: =48
                                          Y: =25
                                    - lblTasks_ProjectDescription:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =varTheme_TextMuted
                                          Size: =9
                                          Text: |-
                                            =If(
                                                !IsBlank(varProjectId),
