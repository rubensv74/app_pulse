      - conLayer_Drawer_1:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(15, 23, 42, 0.42)
            Height: =App.Height
            Visible: =varShowDetailDrawer
            Width: =App.Width
          Children:
            - comp_DetailDrawer_1:
                Control: CanvasComponent
                ComponentName: cmp_DetailDrawer_old
                Properties:
                  AppColors: =gblAppColors
                  CloseAction: =Set(varShowDetailDrawer, false)
                  EntityType: =varDrawerEntityType
                  Fill: =Color.Transparent
                  FormCodeText: |-
                    =

                    Coalesce(
                        varDrawerNormalized.TitleValue,
                        "Record " & Text(varDrawerRecordId)
                    )
                  Height: =App.Height
                  HostHeight: =App.Height
                  HostWidth: =App.Width
                  IsLoading: =varDrawerIsLoading
                  IsOpen: =varShowDetailDrawer
                  NormalizedRecord: =varDrawerNormalized
                  OnManageFieldsRequested: |-
                    =
                    Set(varCT_ShowManageFields, true);

                    Set(varCT_DefsSearch, "");

                    Set(varCT_DefsError, "");

                    Select(btnCT_LoadDefs_1)
                  OnSaveCustomField: =Select(btnCT_SaveFieldDef_1);
                  OnSaved: =
                  OnToggleFieldActiveRequested: =Select(btnCT_SetActive_1)
                  ProjectId: =varProjectId
                  RecordId: =varDrawerRecordId
                  SelectedRecord: =varDrawerSelectedRecord
                  StatusText: |-
                    =Coalesce(
                        varDrawerNormalized.StatusValue,
                        ""
                    )
                  UserEmail: =varUserEmail
                  UserName: =varUserName
                  UserRole: =varUserRole
                  Visible: =varShowDetailDrawer
                  Width: =App.Width
            - btnDrawerLoad_Custom_1:
                Control: Button@0.0.45
                Properties:
                  OnSelect: |-
                    =
                    // =====================================================
                    // btnDrawerLoad_Custom_1.OnSelect
                    // Load Task custom fields safely
                    // =====================================================

                    If(
                        IsBlank(varProjectId) || IsBlank(varDrawerRecordId) || IsBlank(varDrawerEntityType),

                        Notify("No task selected.", NotificationType.Warning);

                        Set(varCT_Loading, false);
                        Set(varDrawerIsLoading, false);

                        Exit()
                    );

                    Set(varCT_Loading, true);
                    Set(varDrawerIsLoading, true);
                    Set(varCT_Error, "");

                    Clear(colCT_Merged_Base_Staging);
                    Clear(colCT_Merged_UI_Staging);
                    Clear(colCT_Quick_Staging);

                    IfError(
                        With(
                            {
                                resp:
                                    WarRoom_GetCustomBundle.Run(
                                        varProjectId,
                                        varDrawerEntityType,
                                        varDrawerRecordId
                                    )
                            },
                            With(
                                {
                                    parsed: ParseJSON(Coalesce(resp.bundlejson, "{}"))
                                },

                                ClearCollect(
                                    colCT_Merged_Base_Staging,
                                    ForAll(
                                        Table(parsed.defs),
                                        {
                                            FieldKey: Text(Value.FieldKey),
                                            Label: Text(Value.Label),
                                            FieldType: Text(Value.FieldType),
                                            IsRequired: Boolean(Value.IsRequired),
                                            IsPinned: Boolean(Value.IsPinned),
                                            SortOrder:
                                                If(
                                                    IsBlank(Text(Value.SortOrder)) || Text(Value.SortOrder) = "null",
                                                    0,
                                                    Value(Text(Value.SortOrder))
                                                ),
                                            OptionsJson: Text(Value.OptionsJson)
                                        }
                                    )
                                );

                                ClearCollect(
                                    colCT_Merged_UI_Staging,
                                    ForAll(
                                        Table(parsed.values),
                                        {
                                            FieldKey: Text(Value.FieldKey),
                                            ValueText: Text(Value.ValueText),

                                            ValueNumber:
                                                If(
                                                    IsBlank(Text(Value.ValueNumber)) || Text(Value.ValueNumber) = "null",
                                                    Blank(),
                                                    Value(Text(Value.ValueNumber))
                                                ),

                                            ValueDate:
                                                If(
                                                    IsBlank(Text(Value.ValueDate)) || Text(Value.ValueDate) = "null",
                                                    Blank(),
                                                    DateTimeValue(Text(Value.ValueDate))
                                                ),

                                            ValueBool: Boolean(Value.ValueBool)
                                        }
                                    )
                                );

                                ClearCollect(
                                    colCT_Quick_Staging,
                                    AddColumns(
                                        colCT_Merged_Base_Staging,
                                        CurrentValue,
                                        LookUp(
                                            colCT_Merged_UI_Staging,
                                            FieldKey = ThisRecord.FieldKey
                                        )
                                    )
                                )
                            )
                        ),

                        Set(varCT_Error, FirstError.Message)
                    );

                    If(
                        IsBlank(varCT_Error),

                        ClearCollect(colCT_Merged_Base, colCT_Merged_Base_Staging);
                        ClearCollect(colCT_Merged_UI, colCT_Merged_UI_Staging);
                        ClearCollect(colCT_Quick, colCT_Quick_Staging),

                        Notify(
                            "Custom fields could not be loaded.",
                            NotificationType.Warning
                        )
                    );

                    Set(varCT_Loading, false);
                    Set(varDrawerIsLoading, false);
                  Visible: =false
                  X: =60
                  Y: =60
            - btnDrawerLoad_Comments_1:
                Control: Button@0.0.45
                Properties:
                  OnSelect: |-
                    =


                    // =====================================================
                    // btnDrawerLoad_Comments_1.OnSelect
                    // Load Task comments safely
                    // =====================================================

                    If(
                        IsBlank(varProjectId) || IsBlank(varDrawerRecordId),

                        Notify("No task selected.", NotificationType.Warning);

                        Set(varIsLoadingComments, false);
                        Set(varDrawerIsLoading, false);

                        Exit()
                    );

                    Set(varIsLoadingComments, true);
                    Set(varDrawerIsLoading, true);

                    Set(varCommentsPage, 1);
                    Set(varCommentsPageSize, Coalesce(varCommentsPageSize, 20));
                    Set(varCommentsError, "");

                    Clear(colComments_Staging);

                    IfError(
                        With(
                            {
                                resp:
                                    Warroom_GetTaskCommentsPaged.Run(
                                        varProjectId,
                                        varDrawerRecordId,
                                        varCommentsPage,
                                        varCommentsPageSize,
                                        varDrawerEntityType
                                    )
                            },
                            ClearCollect(
                                colComments_Staging,
                                ForAll(
                                    Table(ParseJSON(Coalesce(resp.result, "[]"))),
                                    {
                                        CommentId:
                                            If(
                                                IsBlank(Text(Value.CommentId)) || Text(Value.CommentId) = "null",
                                                0,
                                                Value(Text(Value.CommentId))
                                            ),
                                        CommentText: Text(Value.CommentText),
                                        CommentType: Text(Value.CommentType),
                                        CreatedOn:
                                            If(
                                                IsBlank(Text(Value.CreatedOn)) || Text(Value.CreatedOn) = "null",
                                                Blank(),
                                                DateTimeValue(Text(Value.CreatedOn))
                                            ),
                                        CreatedByEmail: Text(Value.CreatedByEmail),
                                        CreatedByName: Text(Value.CreatedByName),
                                        TotalRows:
                                            If(
                                                IsBlank(Text(Value.TotalRows)) || Text(Value.TotalRows) = "null",
                                                0,
                                                Value(Text(Value.TotalRows))
                                            ),
                                        TotalPages:
                                            If(
                                                IsBlank(Text(Value.TotalPages)) || Text(Value.TotalPages) = "null",
                                                0,
                                                Value(Text(Value.TotalPages))
                                            ),
                                        PageNumber:
                                            If(
                                                IsBlank(Text(Value.PageNumber)) || Text(Value.PageNumber) = "null",
                                                varCommentsPage,
                                                Value(Text(Value.PageNumber))
                                            ),
                                        PageSize:
                                            If(
                                                IsBlank(Text(Value.PageSize)) || Text(Value.PageSize) = "null",
                                                varCommentsPageSize,
                                                Value(Text(Value.PageSize))
                                            )
                                    }
                                )
                            )
                        ),

                        Set(varCommentsError, FirstError.Message)
                    );

                    If(
                        IsBlank(varCommentsError),

                        ClearCollect(colComments, colComments_Staging);

                        Set(
                            varCommentsTotalRows,
                            If(
                                CountRows(colComments) > 0,
                                First(colComments).TotalRows,
                                0
                            )
                        );

                        Set(
                            varCommentsTotalPages,
                            If(
                                CountRows(colComments) > 0,
                                First(colComments).TotalPages,
                                0
                            )
                        ),

                        Notify(
                            "Task comments could not be loaded.",
                            NotificationType.Warning
                        )
                    );

                    Set(varIsLoadingComments, false);
                    Set(varDrawerIsLoading, false);
                  Visible: =false
                  X: =80
                  Y: =80
            - btnDrawerLoad_Tasks:
