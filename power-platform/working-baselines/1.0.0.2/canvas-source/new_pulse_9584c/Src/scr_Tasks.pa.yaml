                    If(
                        !varShowDetailDrawer,
                        Exit()
                    );

                    If(
                        IsBlank(varDrawerRecordId),

                        Set(varDrawerIsLoading, false);

                        Notify(
                            "No record selected.",
                            NotificationType.Warning
                        );

                        Exit()
                    );

                    Switch(
                        varDrawerTab,

                        // -------------------------------------------------
                        // Overview
                        // -------------------------------------------------
                        "Overview",
                            Set(varDrawerIsLoading, false),

                        // -------------------------------------------------
                        // History
                        // -------------------------------------------------
                        "History",
                            Set(varDrawerIsLoading, false),

                        // -------------------------------------------------
                        // Comments
                        // -------------------------------------------------
                        "Comments",
                            Set(varDrawerIsLoading, true);
                            Select(btnDrawerLoad_Comments_1),

                        // -------------------------------------------------
                        // Custom fields
                        // -------------------------------------------------
                        "Custom",
                            Set(varDrawerIsLoading, true);
                            Select(btnDrawerLoad_Custom_1),

                        // -------------------------------------------------
                        // Fallback
                        // -------------------------------------------------
                        Set(varDrawerIsLoading, false)
                    );
                  Visible: =false
                  X: =40
                  Y: =40
            - btnDrawerRefreshFromTab_1:
                Control: Button@0.0.45
                Properties:
                  OnSelect: |-
                    =
                    Set(varDrawerTab, "Custom");
                    Select(btnDrawerLoad_Custom_1)
                  Visible: =false
            - btnCT_LoadDefs_1:
                Control: Button@0.0.45
                Properties:
                  OnSelect: |-
                    =
                    Set(varCT_DefsIsLoading, true);
                    Set(varCT_DefsError, "");

                    Clear(colCT_Defs_Admin);

                    Set(
                        varCT_DefsResp,
                        WarRoom_ListCustomFieldDefs.Run(
                            comp_DetailDrawer_1.ProjectId,
                            comp_DetailDrawer_1.EntityType,
                            If(varCT_ShowInactiveDefs, 1, 0)
                        )
                    );


                    Set(
                        varCT_DefsOuter,
                        Table(ParseJSON(Coalesce(varCT_DefsResp.result, "[]")))
                    );

                    If(
                        CountRows(varCT_DefsOuter) = 0,

                        Set(varCT_DefsError, "The flow returned no data."),

                        Set(
                            varCT_DefsBundle,
                            ParseJSON(
                                Text(First(varCT_DefsOuter).Value.result)
                            )
                        );

                        ClearCollect(
                            colCT_Defs_Admin,
                            ForAll(
                                Table(varCT_DefsBundle.defs),
                                {
                                    FieldDefId: Value(ThisRecord.Value.FieldDefId),
                                    ProjectId: Value(ThisRecord.Value.ProjectId),
                                    EntityType: Text(ThisRecord.Value.EntityType),
                                    FieldKey: Text(ThisRecord.Value.FieldKey),
                                    Label: Text(ThisRecord.Value.Label),
                                    FieldType: Text(ThisRecord.Value.FieldType),
                                    HelpText: Coalesce(Text(ThisRecord.Value.HelpText), ""),
                                    IsRequired: Boolean(ThisRecord.Value.IsRequired),
                                    IsPinned: Boolean(ThisRecord.Value.IsPinned),
                                    IsActive: Boolean(ThisRecord.Value.IsActive),
                                    SortOrder: Value(ThisRecord.Value.SortOrder),
                                    OptionsJson: Coalesce(Text(ThisRecord.Value.OptionsJson), ""),
                                    ModifiedOn: If(
                                        IsBlank(Text(ThisRecord.Value.ModifiedOn)),
                                        Blank(),
                                        DateTimeValue(Text(ThisRecord.Value.ModifiedOn))
                                    ),
                                    ModifiedByEmail: Coalesce(Text(ThisRecord.Value.ModifiedByEmail), ""),
                                    IsFilterable: Boolean(ThisRecord.Value.IsFilterable),
                    ShowInQuickFilters: Boolean(ThisRecord.Value.ShowInQuickFilters),
                    FilterOrder: If(
                        IsBlank(Text(ThisRecord.Value.FilterOrder)),
                        Coalesce(Value(ThisRecord.Value.SortOrder), 1000),
                        Value(ThisRecord.Value.FilterOrder)
                    ),
                    FilterMode: Coalesce(Text(ThisRecord.Value.FilterMode), "Equals")
                                }
                            )
                        )
                    );

                    Set(varCT_DefsIsLoading, false);
                  Visible: =false
                  X: =100
                  Y: =100
            - btnCT_SetActive_1:
                Control: Button@0.0.45
                Properties:
                  OnSelect: |-
                    =

                    With(
                        {
                            resp: WarRoom_SetCustomFieldActive.Run(
                                comp_DetailDrawer_1.ProjectId,
                                comp_DetailDrawer_1.EntityType,
                                varCT_Toggle_FieldKey,
                                varCT_Toggle_IsActive,
                                comp_DetailDrawer_1.UserEmail
                            )
                        },
                        Select(btnCT_LoadDefs_1);
                        Select(btnDrawerLoad_Custom_1)
                    );
                  Visible: =false
                  X: =140
                  Y: =140
            - btnCT_SaveFieldDef_1:
                Control: ModernButton@1.0.0
                Properties:
                  Align: =Align.Center
                  FontWeight: =""
                  OnSelect: "=\r\nIf(\r\n    IsBlank(Trim(varCT_Edit_Label)),\r\n    Set(varCT_SaveField_Error, \"Label is required.\");\r\n    Set(varCT_SaveField_IsLoading, false),\r\n\r\n    IsBlank(Trim(varCT_Edit_FieldKey)),\r\n    Set(varCT_SaveField_Error, \"Field key is required.\");\r\n    Set(varCT_SaveField_IsLoading, false),\r\n\r\n    !IsBlank(\r\n        LookUp(\r\n            colCT_Defs_Admin,\r\n            Lower(Trim(FieldKey)) = Lower(Trim(varCT_Edit_FieldKey)) &&\r\n            FieldDefId <> Coalesce(varCT_Edit_FieldDefId, 0)\r\n        )\r\n    ),\r\n\r\n    Set(varCT_SaveField_Error, \"This Field Key already exists.\");\r\n    Set(varCT_SaveField_IsLoading, false);\r\n    Notify(\"This Field Key already exists. Use another key or edit the existing field.\", NotificationType.Error),\r\n\r\n    Value(varCT_Edit_SortOrder) <= 0,\r\n    Set(varCT_SaveField_Error, \"Sort order must be greater than zero.\");\r\n    Set(varCT_SaveField_IsLoading, false),\r\n\r\n    (varCT_Edit_FieldType = \"Choice\" || varCT_Edit_FieldType = \"MultiChoice\") && IsBlank(Trim(varCT_Edit_OptionsJson)),\r\n    Set(varCT_SaveField_Error, \"OptionsJson is required for Choice and MultiChoice fields.\");\r\n    Set(varCT_SaveField_IsLoading, false),\r\n\r\n    With(\r\n        {\r\n            resp: WarRoom_UpsertCustomFieldDef.Run(\r\n                Coalesce(varCT_Edit_FieldDefId, 0),\r\n                comp_DetailDrawer_1.ProjectId,\r\n                comp_DetailDrawer_1.EntityType,\r\n                Trim(varCT_Edit_Label),\r\n                varCT_Edit_FieldType,\r\n                Trim(varCT_Edit_HelpText),\r\n                Value(varCT_Edit_SortOrder),\r\n                If(IsBlank(Trim(varCT_Edit_OptionsJson)), \" \", Trim(varCT_Edit_OptionsJson)),\r\n                comp_DetailDrawer_1.UserEmail,\r\n                Lower(Trim(varCT_Edit_FieldKey)),\r\n                varCT_Edit_IsRequired,\r\n                varCT_Edit_IsPinned,\r\n                varCT_Edit_IsActive,\r\n                varCT_Edit_IsFilterable,\r\nvarCT_Edit_ShowInQuickFilters,\r\nCoalesce(varCT_Edit_FilterOrder, varCT_Edit_SortOrder, 1000),\r\nCoalesce(varCT_Edit_FilterMode, \"Equals\")\r\n            )\r\n        },\r\n        \r\n        Set(varShowCustomAddFields, false);\r\n        Set(varCT_SaveField_Error, \"\");\r\n        Set(varCT_SaveField_IsLoading, false);\r\n\r\n        Select(btnCT_LoadDefs_1);\r\n\r\n        Set(varCT_LoadKey, \"\");\r\n        Select(btnDrawerLoad_Custom_1);\r\n\r\n        Notify(\"Field definition saved successfully.\", NotificationType.Success)\r\n    )\r\n)"
                  PaddingBottom: =5
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =5
                  RadiusBottomLeft: =4
                  RadiusBottomRight: =4
                  RadiusTopLeft: =4
                  RadiusTopRight: =4
                  VerticalAlign: =VerticalAlign.Middle
                  Visible: =false
                  X: =160
                  Y: =160
