ComponentDefinitions:
  cmp_SearchBox:
    DefinitionType: CanvasComponent
    CustomProperties:
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Main accent color
        DataType: Color
        Default: =ColorValue("#1677FF")
      BackgroundColor:
        PropertyKind: Input
        DisplayName: BackgroundColor
        Description: Component background color
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        Description: Component border color
        DataType: Color
        Default: =ColorValue("#E2E8F0")
      DefaultSearchText:
        PropertyKind: Input
        DisplayName: DefaultSearchText
        Description: Initial search text
        DataType: Text
        Default: =""
      HasSearch:
        PropertyKind: Output
        DisplayName: HasSearch
        Description: True when search text is not blank
        DataType: Boolean
      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Muted text color
        DataType: Color
        Default: =ColorValue("#64748B")
      OnClear:
        PropertyKind: Event
        DisplayName: OnClear
        Description: Executes when search is cleared
        ReturnType: None
        Default: =
      OnSearchChange:
        PropertyKind: Event
        DisplayName: OnSearchChange
        Description: Executes when search text changes
        ReturnType: None
        Default: =
      Placeholder:
        PropertyKind: Input
        DisplayName: Placeholder
        Description: Search placeholder text
        DataType: Text
        Default: ="Search..."
      SearchText:
        PropertyKind: Output
        DisplayName: SearchText
        Description: Current search text
        DataType: Text
      ShowClearIcon:
        PropertyKind: Input
        DisplayName: ShowClearIcon
        Description: Shows the clear icon when search has text
        DataType: Boolean
        Default: =true
      ShowSearchIcon:
        PropertyKind: Input
        DisplayName: ShowSearchIcon
        Description: Shows the search icon
        DataType: Boolean
        Default: =true
      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Main text color
        DataType: Color
        Default: =ColorValue("#0F172A")
    Properties:
      HasSearch: =!IsBlank(Trim(varSB_Search))
      Height: =44
      OnReset: |-
        =
        Set(varSB_Search, cmp_SearchBox.DefaultSearchText)
      SearchText: =varSB_Search
      Width: =320
    Children:
      - conSB_Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =cmp_SearchBox.BorderColor
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =cmp_SearchBox.BackgroundColor
            Height: =Parent.Height
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Width: =Parent.Width
          Children:
            - icoSB_Search:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =cmp_SearchBox.MutedTextColor
                  DisabledBorderColor: =RGBA(245, 245, 245, 1)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =18
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =cmp_SearchBox.AccentColor
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Icon: =Icon.Search
                  OnSelect: =Select(txtSB_Search)
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =cmp_SearchBox.AccentColor
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Visible: =cmp_SearchBox.ShowSearchIcon
                  Width: =18
                  X: =14
                  Y: =(Parent.Height - Self.Height) / 2
            - txtSB_Search:
                Control: ModernTextInput@1.1.1
                Properties:
                  Appearance: =Appearance.Outline
                  Default: =varSB_Search
                  Height: =Parent.Height - 8
                  OnChange: |-
                    =
                    Set(varSB_Search, Self.Text);
                    cmp_SearchBox.OnSearchChange()
                  Placeholder: =cmp_SearchBox.Placeholder
                  Width: =Parent.Width - If(cmp_SearchBox.ShowSearchIcon, 52, 20) - If(cmp_SearchBox.ShowClearIcon, 42, 0)
                  X: =If(cmp_SearchBox.ShowSearchIcon, 42, 10)
                  Y: =4
            - icoSB_Clear:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =cmp_SearchBox.MutedTextColor
                  DisabledBorderColor: =RGBA(245, 245, 245, 1)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =18
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =cmp_SearchBox.AccentColor
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Icon: =Icon.Cancel
                  OnSelect: |-
                    =
                    Set(varSB_Search, "");
                    Reset(txtSB_Search);
                    cmp_SearchBox.OnClear();
                    cmp_SearchBox.OnSearchChange()
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =cmp_SearchBox.AccentColor
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Visible: =cmp_SearchBox.ShowClearIcon && !IsBlank(Trim(varSB_Search))
                  Width: =18
                  X: =Parent.Width - 30
                  Y: =(Parent.Height - Self.Height) / 2
