ComponentDefinitions:
  cmp_FilterBar:
    DefinitionType: CanvasComponent
    CustomProperties:
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Main accent color
        DataType: Color
        Default: =ColorValue("#1677FF")
      ActiveFilterCount:
        PropertyKind: Input
        DisplayName: ActiveFilterCount
        Description: Number of active filters
        DataType: Number
        Default: =0
      AdvancedButtonText:
        PropertyKind: Input
        DisplayName: AdvancedButtonText
        Description: Advanced filters button text
        DataType: Text
        Default: ="Filters"
      BackgroundColor:
        PropertyKind: Input
        DisplayName: BackgroundColor
        Description: Bar background color
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        Description: Border color
        DataType: Color
        Default: =ColorValue("#E2E8F0")
      ClearButtonText:
        PropertyKind: Input
        DisplayName: ClearButtonText
        Description: Clear filters button text
        DataType: Text
        Default: ="Clear"
      HasActiveFilters:
        PropertyKind: Output
        DisplayName: HasActiveFilters
        Description: True when ActiveFilterCount is greater than zero
        DataType: Boolean
      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Muted text color
        DataType: Color
        Default: =ColorValue("#64748B")
      OnAdvancedFilters:
        PropertyKind: Event
        DisplayName: OnAdvancedFilters
        Description: Executes when advanced filters action is selected
        ReturnType: None
        Default: =
      OnClear:
        PropertyKind: Event
        DisplayName: OnClear
        Description: Executes when clear filters action is selected
        ReturnType: None
        Default: =
      OnRefresh:
        PropertyKind: Event
        DisplayName: OnRefresh
        Description: Executes when refresh action is selected
        ReturnType: None
        Default: =
      OnSearch:
        PropertyKind: Event
        DisplayName: OnSearch
        Description: Executes when search action is selected
        ReturnType: None
        Default: =
      RefreshButtonText:
        PropertyKind: Input
        DisplayName: RefreshButtonText
        Description: Refresh button text
        DataType: Text
        Default: ="Refresh"
      SearchButtonText:
        PropertyKind: Input
        DisplayName: SearchButtonText
        Description: Search button text
        DataType: Text
        Default: ="Search"
      SearchText:
        PropertyKind: Input
        DisplayName: SearchText
        Description: Current search text shown in summary
        DataType: Text
        Default: =""
      ShowAdvanced:
        PropertyKind: Input
        DisplayName: ShowAdvanced
        Description: Shows advanced filters action
        DataType: Boolean
        Default: =true
      ShowClear:
        PropertyKind: Input
        DisplayName: ShowClear
        Description: Shows clear action
        DataType: Boolean
        Default: =true
      ShowRefresh:
        PropertyKind: Input
        DisplayName: ShowRefresh
        Description: Shows refresh action
        DataType: Boolean
        Default: =true
      ShowSearch:
        PropertyKind: Input
        DisplayName: ShowSearch
        Description: Shows search action
        DataType: Boolean
        Default: =true
      SummaryText:
        PropertyKind: Output
        DisplayName: SummaryText
        Description: Filter bar summary text
        DataType: Text
      SurfaceAltColor:
        PropertyKind: Input
        DisplayName: SurfaceAltColor
        Description: Soft surface color
        DataType: Color
        Default: =ColorValue("#F8FAFC")
      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Main text color
        DataType: Color
        Default: =ColorValue("#0F172A")
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Filter bar title
        DataType: Text
        Default: ="Filters"
      TotalRows:
        PropertyKind: Input
        DisplayName: TotalRows
        Description: Total rows after filtering
        DataType: Number
        Default: =0
    Properties:
      HasActiveFilters: =cmp_FilterBar.ActiveFilterCount > 0
      Height: =72
      SummaryText: |-
        =If(
            cmp_FilterBar.ActiveFilterCount > 0,
            cmp_FilterBar.ActiveFilterCount & " active filter" & If(cmp_FilterBar.ActiveFilterCount = 1, "", "s"),
            "No active filters"
        ) &
        If(
            cmp_FilterBar.TotalRows > 0,
            " · " & cmp_FilterBar.TotalRows & " rows",
            ""
        )
      Width: =920
    Children:
      - conFB_Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =cmp_FilterBar.BorderColor
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =cmp_FilterBar.BackgroundColor
            Height: =Parent.Height
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            RadiusTopLeft: =14
            RadiusTopRight: =14
            Width: =Parent.Width
          Children:
            - lblFB_Title:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmp_FilterBar.TextColor
                  FontWeight: =FontWeight.Semibold
                  Height: =20
                  Size: =13
                  Text: =cmp_FilterBar.Title
                  Width: =220
                  X: =18
                  Y: =14
            - lblFB_Summary:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =If(cmp_FilterBar.HasActiveFilters, cmp_FilterBar.AccentColor, cmp_FilterBar.MutedTextColor)
                  Height: =18
                  Size: =10
                  Text: =cmp_FilterBar.SummaryText
                  Width: =300
                  X: =18
                  Y: =38
            - conFB_Badge:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =cmp_FilterBar.AccentColor
                  DropShadow: =DropShadow.None
                  Fill: =cmp_FilterBar.AccentColor
                  Height: =20
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Visible: =cmp_FilterBar.HasActiveFilters
                  Width: =If(cmp_FilterBar.ActiveFilterCount > 9, 34, 28)
                  X: =btnFB_Advanced.X + btnFB_Advanced.Width - 18
                  Y: =10
                Children:
                  - lblFB_Badge:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =Color.White
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =9
                        Text: =Text(cmp_FilterBar.ActiveFilterCount)
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width
                        Y: =1
            - btnFB_Search:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =cmp_FilterBar.BorderColor
                  BorderThickness: =1
                  Color: =cmp_FilterBar.TextColor
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  DisabledFill: =RGBA(242, 242, 241, 0)
                  Fill: =cmp_FilterBar.BackgroundColor
                  Font: =Font.'Segoe UI'
                  Height: =36
                  HoverBorderColor: =cmp_FilterBar.AccentColor
                  HoverColor: =cmp_FilterBar.TextColor
                  HoverFill: =cmp_FilterBar.SurfaceAltColor
                  OnSelect: =cmp_FilterBar.OnSearch()
                  PressedBorderColor: =cmp_FilterBar.AccentColor
                  PressedColor: =cmp_FilterBar.TextColor
                  PressedFill: =ColorValue("#F1F5F9")
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =11
                  Text: =cmp_FilterBar.SearchButtonText
                  Visible: =cmp_FilterBar.ShowSearch
                  Width: =104
                  X: =Parent.Width - 472
                  Y: =18
            - btnFB_Advanced:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =If(cmp_FilterBar.HasActiveFilters, cmp_FilterBar.AccentColor, cmp_FilterBar.BorderColor)
                  BorderThickness: =1
                  Color: =If(cmp_FilterBar.HasActiveFilters, cmp_FilterBar.AccentColor, cmp_FilterBar.TextColor)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  DisabledFill: =RGBA(242, 242, 241, 0)
                  Fill: =If(cmp_FilterBar.HasActiveFilters, cmp_FilterBar.SurfaceAltColor, cmp_FilterBar.BackgroundColor)
                  Font: =Font.'Segoe UI'
                  FontWeight: =If(cmp_FilterBar.HasActiveFilters, FontWeight.Semibold, FontWeight.Normal)
                  Height: =36
                  HoverBorderColor: =cmp_FilterBar.AccentColor
                  HoverColor: =cmp_FilterBar.AccentColor
                  HoverFill: =cmp_FilterBar.SurfaceAltColor
                  OnSelect: =cmp_FilterBar.OnAdvancedFilters()
                  PressedBorderColor: =cmp_FilterBar.AccentColor
                  PressedColor: =cmp_FilterBar.AccentColor
                  PressedFill: =ColorValue("#F1F5F9")
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =11
                  Text: =cmp_FilterBar.AdvancedButtonText
                  Visible: =cmp_FilterBar.ShowAdvanced
                  Width: =112
                  X: =Parent.Width - 356
                  Y: =18
            - btnFB_Clear:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =cmp_FilterBar.BorderColor
                  BorderThickness: =1
                  Color: =cmp_FilterBar.TextColor
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  DisabledFill: =RGBA(242, 242, 241, 0)
                  DisplayMode: =If(cmp_FilterBar.HasActiveFilters, DisplayMode.Edit, DisplayMode.Disabled)
                  Fill: =cmp_FilterBar.BackgroundColor
                  Font: =Font.'Segoe UI'
                  Height: =36
                  HoverBorderColor: =cmp_FilterBar.BorderColor
                  HoverColor: =cmp_FilterBar.TextColor
                  HoverFill: =cmp_FilterBar.SurfaceAltColor
                  OnSelect: =cmp_FilterBar.OnClear()
                  PressedBorderColor: =cmp_FilterBar.BorderColor
                  PressedColor: =cmp_FilterBar.TextColor
                  PressedFill: =ColorValue("#F1F5F9")
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =11
                  Text: =cmp_FilterBar.ClearButtonText
                  Visible: =cmp_FilterBar.ShowClear
                  Width: =100
                  X: =Parent.Width - 232
                  Y: =18
            - btnFB_Refresh:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =cmp_FilterBar.AccentColor
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  DisabledFill: =RGBA(242, 242, 241, 0)
                  Fill: =cmp_FilterBar.AccentColor
                  Font: =Font.'Segoe UI'
                  Height: =36
                  HoverBorderColor: =cmp_FilterBar.AccentColor
                  HoverColor: =Color.White
                  HoverFill: =cmp_FilterBar.AccentColor
                  OnSelect: =cmp_FilterBar.OnRefresh()
                  PressedBorderColor: =cmp_FilterBar.AccentColor
                  PressedColor: =Color.White
                  PressedFill: =cmp_FilterBar.AccentColor
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =11
                  Text: =cmp_FilterBar.RefreshButtonText
                  Visible: =cmp_FilterBar.ShowRefresh
                  Width: =104
                  X: =Parent.Width - 116
                  Y: =18
