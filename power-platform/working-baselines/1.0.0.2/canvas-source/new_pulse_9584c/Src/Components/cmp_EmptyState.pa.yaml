ComponentDefinitions:
  cmp_EmptyState:
    DefinitionType: CanvasComponent
    CustomProperties:
      AccentColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#1677FF")
      ActionText:
        PropertyKind: Input
        DataType: Text
        Default: ="Refresh"
      BorderColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#E2E8F0")
      DangerColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#DC2626")
      Message:
        PropertyKind: Input
        DataType: Text
        Default: ="Refresh the dashboard or review the current filters."
      MutedTextColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#64748B")
      OnAction:
        PropertyKind: Event
        ReturnType: None
        Default: =
      ShowAction:
        PropertyKind: Input
        DataType: Boolean
        Default: =true
      State:
        PropertyKind: Input
        DataType: Text
        Default: ="EMPTY"
      SurfaceColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      TextColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#0F172A")
      Title:
        PropertyKind: Input
        DataType: Text
        Default: ="No data available"
    Properties:
      Height: =260
      Width: =720
    Children:
      - conEST_Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =cmp_EmptyState.BorderColor
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =cmp_EmptyState.SurfaceColor
            Height: =Parent.Height
            RadiusBottomLeft: =16
            RadiusBottomRight: =16
            RadiusTopLeft: =16
            RadiusTopRight: =16
            Width: =Parent.Width
          Children:
            - icoEST_State:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =If(Upper(cmp_EmptyState.State)="ERROR",cmp_EmptyState.DangerColor,cmp_EmptyState.AccentColor)
                  Height: =44
                  Icon: =Switch(Upper(cmp_EmptyState.State),"ERROR",Icon.Warning,"NO_PROJECT",Icon.Folder,"NO_PERMISSION",Icon.Lock,Icon.Information)
                  Width: =44
                  X: =(Parent.Width-Self.Width)/2
                  Y: =38
            - lblEST_Title:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: =cmp_EmptyState.TextColor
                  FontWeight: =FontWeight.Semibold
                  Height: =28
                  Size: =16
                  Text: =cmp_EmptyState.Title
                  Width: =Parent.Width-64
                  X: =32
                  Y: =98
            - lblEST_Message:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: =cmp_EmptyState.MutedTextColor
                  Height: =42
                  Size: =10
                  Text: =cmp_EmptyState.Message
                  Width: =Parent.Width-120
                  X: =60
                  Y: =136
            - btnEST_Action:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =0
                  Color: =Color.White
                  Fill: =If(Upper(cmp_EmptyState.State)="ERROR",cmp_EmptyState.DangerColor,cmp_EmptyState.AccentColor)
                  Font: =Font.'Segoe UI'
                  Height: =34
                  HoverFill: =Self.Fill
                  OnSelect: =cmp_EmptyState.OnAction()
                  PressedFill: =Self.Fill
                  Size: =10
                  Text: =cmp_EmptyState.ActionText
                  Visible: =cmp_EmptyState.ShowAction
                  Width: =120
                  X: =(Parent.Width-Self.Width)/2
                  Y: =198
