ComponentDefinitions:
  cmp_CustomFieldEditor:
    DefinitionType: CanvasComponent
    CustomProperties:
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Main accent color
        DataType: Color
        Default: =ColorValue("#1677FF")
      BackgroundColor:
        PropertyKind: Input
        DisplayName: BackgroundColor
        Description: Editor background color
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        Description: Border color
        DataType: Color
        Default: =ColorValue("#E2E8F0")
      CancelButtonText:
        PropertyKind: Input
        DisplayName: CancelButtonText
        Description: Cancel button text
        DataType: Text
        Default: ="Cancel"
      EmptyText:
        PropertyKind: Input
        DisplayName: EmptyText
        Description: Empty state text
        DataType: Text
        Default: ="No custom fields configured"
      HasFields:
        PropertyKind: Output
        DisplayName: HasFields
        Description: True when Items has fields
        DataType: Boolean
      Items:
        PropertyKind: Input
        DisplayName: Items
        Description: Normalized table with FieldKey, FieldLabel, FieldType, ValueText, HelpText, IsRequired, IsEditable
        DataType: Table
        Default: |-
          =Table(
              {
                  FieldKey: "",
                  FieldLabel: "",
                  FieldType: "Text",
                  ValueText: "",
                  HelpText: "",
                  IsRequired: false,
                  IsEditable: true
              }
          )
      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Muted text color
        DataType: Color
        Default: =ColorValue("#64748B")
      OnCancel:
        PropertyKind: Event
        DisplayName: OnCancel
        Description: Executes when cancel is selected
        ReturnType: None
        Default: =
      OnFieldSelect:
        PropertyKind: Event
        DisplayName: OnFieldSelect
        Description: Executes when a field is selected
        ReturnType: None
        Default: =
      OnSave:
        PropertyKind: Event
        DisplayName: OnSave
        Description: Executes when save is selected
        ReturnType: None
        Default: =
      SaveButtonText:
        PropertyKind: Input
        DisplayName: SaveButtonText
        Description: Save button text
        DataType: Text
        Default: ="Save"
      SelectedField:
        PropertyKind: Output
        DisplayName: SelectedField
        Description: Selected field record
        DataType: Record
      SelectedFieldKey:
        PropertyKind: Output
        DisplayName: SelectedFieldKey
        Description: Selected field key
        DataType: Text
      SelectedFieldType:
        PropertyKind: Output
        DisplayName: SelectedFieldType
        Description: Selected field type
        DataType: Text
      ShowFooter:
        PropertyKind: Input
        DisplayName: ShowFooter
        Description: Shows footer actions
        DataType: Boolean
        Default: =true
      ShowHelpText:
        PropertyKind: Input
        DisplayName: ShowHelpText
        Description: Shows help text
        DataType: Boolean
        Default: =true
      ShowTitle:
        PropertyKind: Input
        DisplayName: ShowTitle
        Description: Shows title
        DataType: Boolean
        Default: =true
      SurfaceAltColor:
        PropertyKind: Input
        DisplayName: SurfaceAltColor
        Description: Alternate surface color
        DataType: Color
        Default: =ColorValue("#F8FAFC")
      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Main text color
        DataType: Color
        Default: =ColorValue("#0F172A")
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Editor title
        DataType: Text
        Default: ="Custom fields"
    Properties:
      HasFields: =CountRows(cmp_CustomFieldEditor.Items) > 0
      Height: =560
      OnReset: =Set(varCFE_SelectedFieldKey, "")
      SelectedField: =LookUp(cmp_CustomFieldEditor.Items, FieldKey = varCFE_SelectedFieldKey)
      SelectedFieldKey: =varCFE_SelectedFieldKey
      SelectedFieldType: =LookUp(cmp_CustomFieldEditor.Items, FieldKey = varCFE_SelectedFieldKey).FieldType
      Width: =520
    Children:
      - conCFE_Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =cmp_CustomFieldEditor.BorderColor
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =cmp_CustomFieldEditor.BackgroundColor
            Height: =Parent.Height
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            RadiusTopLeft: =14
            RadiusTopRight: =14
            Width: =Parent.Width
          Children:
            - lblCFE_Title:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmp_CustomFieldEditor.TextColor
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  Size: =14
                  Text: =cmp_CustomFieldEditor.Title
                  Visible: =cmp_CustomFieldEditor.ShowTitle
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =14
            - rectCFE_TitleLine:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  DisabledFill: =RGBA(161, 159, 157, 1)
                  Fill: =cmp_CustomFieldEditor.BorderColor
                  FocusedBorderThickness: =4
                  Height: =1
                  HoverFill: =cmp_CustomFieldEditor.BorderColor
                  PressedFill: =cmp_CustomFieldEditor.BorderColor
                  Visible: =cmp_CustomFieldEditor.ShowTitle
                  Width: =Parent.Width
                  Y: =52
            - galCFE_Fields:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                Properties:
                  BorderColor: =RGBA(245, 245, 245, 1)
                  Height: =Parent.Height - If(cmp_CustomFieldEditor.ShowTitle, 118, 66) - If(cmp_CustomFieldEditor.ShowFooter, 56, 0)
                  Items: =cmp_CustomFieldEditor.Items
                  TemplateSize: =92
                  Visible: =cmp_CustomFieldEditor.HasFields
                  Width: =Parent.Width - 24
                  X: =12
                  Y: =If(cmp_CustomFieldEditor.ShowTitle, 64, 12)
                Children:
                  - btnCFE_Row:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =If(ThisItem.FieldKey = varCFE_SelectedFieldKey, cmp_CustomFieldEditor.AccentColor, cmp_CustomFieldEditor.BorderColor)
                        BorderThickness: =If(ThisItem.FieldKey = varCFE_SelectedFieldKey, 2, 1)
                        Color: =Color.White
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =If(ThisItem.FieldKey = varCFE_SelectedFieldKey, ColorValue("#EFF6FF"), cmp_CustomFieldEditor.BackgroundColor)
                        Font: =Font.'Segoe UI'
                        Height: =Parent.TemplateHeight - 8
                        HoverBorderColor: =cmp_CustomFieldEditor.AccentColor
                        HoverColor: =Color.White
                        HoverFill: =ColorValue("#EFF6FF")
                        OnSelect: |-
                          =
                          Set(varCFE_SelectedFieldKey, ThisItem.FieldKey);
                          cmp_CustomFieldEditor.OnFieldSelect()
                        PressedBorderColor: =cmp_CustomFieldEditor.AccentColor
                        PressedColor: =Color.White
                        PressedFill: =ColorValue("#DBEAFE")
                        Text: =""
                        Width: =Parent.TemplateWidth
                        Y: =4
                  - lblCFE_FieldLabel:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =cmp_CustomFieldEditor.TextColor
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        OnSelect: =Select(btnCFE_Row)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10
                        Text: =ThisItem.FieldLabel & If(ThisItem.IsRequired, " *", "")
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.TemplateWidth - 150
                        X: =14
                        Y: =12
                  - conCFE_TypePill:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =cmp_CustomFieldEditor.BorderColor
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =cmp_CustomFieldEditor.SurfaceAltColor
                        Height: =22
                        RadiusBottomLeft: =11
                        RadiusBottomRight: =11
                        RadiusTopLeft: =11
                        RadiusTopRight: =11
                        Width: =90
                        X: =Parent.TemplateWidth - 104
                        Y: =10
                      Children:
                        - lblCFE_Type:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Color: =cmp_CustomFieldEditor.MutedTextColor
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              Fill: =Color.Transparent
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =8
                              Text: =Upper(ThisItem.FieldType)
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width
                              Y: =3
                  - txtCFE_Value:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =cmp_CustomFieldEditor.BorderColor
                        Color: =cmp_CustomFieldEditor.TextColor
                        Default: =ThisItem.ValueText
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        DisplayMode: =If(ThisItem.IsEditable, DisplayMode.Edit, DisplayMode.Disabled)
                        Font: =Font.'Segoe UI'
                        Height: =32
                        HintText: ="Enter value"
                        HoverBorderColor: =cmp_CustomFieldEditor.AccentColor
                        HoverColor: =cmp_CustomFieldEditor.TextColor
                        HoverFill: =Color.White
                        PressedBorderColor: =cmp_CustomFieldEditor.AccentColor
                        PressedColor: =cmp_CustomFieldEditor.TextColor
                        PressedFill: =Color.White
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =10
                        Width: =Parent.TemplateWidth - 28
                        X: =14
                        Y: =38
                  - lblCFE_Help:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_CustomFieldEditor.MutedTextColor
                        Height: =14
                        Size: =8
                        Text: =ThisItem.HelpText
                        Visible: =cmp_CustomFieldEditor.ShowHelpText && !IsBlank(ThisItem.HelpText)
                        Width: =Parent.TemplateWidth - 28
                        X: =14
                        Y: =72
            - lblCFE_Empty:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmp_CustomFieldEditor.MutedTextColor
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  Size: =12
                  Text: =cmp_CustomFieldEditor.EmptyText
                  Visible: =!cmp_CustomFieldEditor.HasFields
                  Width: =Parent.Width - 48
                  X: =24
                  Y: =(Parent.Height - 24) / 2
            - rectCFE_FooterLine:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  DisabledFill: =RGBA(161, 159, 157, 1)
                  Fill: =cmp_CustomFieldEditor.BorderColor
                  FocusedBorderThickness: =4
                  Height: =1
                  HoverFill: =cmp_CustomFieldEditor.BorderColor
                  PressedFill: =cmp_CustomFieldEditor.BorderColor
                  Visible: =cmp_CustomFieldEditor.ShowFooter
                  Width: =Parent.Width
                  Y: =Parent.Height - 56
            - btnCFE_Cancel:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =cmp_CustomFieldEditor.BorderColor
                  BorderThickness: =1
                  Color: =cmp_CustomFieldEditor.TextColor
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  DisabledFill: =RGBA(242, 242, 241, 0)
                  Fill: =cmp_CustomFieldEditor.BackgroundColor
                  Font: =Font.'Segoe UI'
                  Height: =36
                  HoverBorderColor: =cmp_CustomFieldEditor.BorderColor
                  HoverColor: =cmp_CustomFieldEditor.TextColor
                  HoverFill: =cmp_CustomFieldEditor.SurfaceAltColor
                  OnSelect: =cmp_CustomFieldEditor.OnCancel()
                  PressedBorderColor: =cmp_CustomFieldEditor.BorderColor
                  PressedColor: =cmp_CustomFieldEditor.TextColor
                  PressedFill: =ColorValue("#F1F5F9")
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =11
                  Text: =cmp_CustomFieldEditor.CancelButtonText
                  Visible: =cmp_CustomFieldEditor.ShowFooter
                  Width: =104
                  X: =Parent.Width - 232
                  Y: =Parent.Height - 46
            - btnCFE_Save:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =cmp_CustomFieldEditor.AccentColor
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  DisabledFill: =RGBA(242, 242, 241, 0)
                  Fill: =cmp_CustomFieldEditor.AccentColor
                  Font: =Font.'Segoe UI'
                  Height: =36
                  HoverBorderColor: =cmp_CustomFieldEditor.AccentColor
                  HoverColor: =Color.White
                  HoverFill: =cmp_CustomFieldEditor.AccentColor
                  OnSelect: =cmp_CustomFieldEditor.OnSave()
                  PressedBorderColor: =cmp_CustomFieldEditor.AccentColor
                  PressedColor: =Color.White
                  PressedFill: =cmp_CustomFieldEditor.AccentColor
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =11
                  Text: =cmp_CustomFieldEditor.SaveButtonText
                  Visible: =cmp_CustomFieldEditor.ShowFooter
                  Width: =104
                  X: =Parent.Width - 116
                  Y: =Parent.Height - 46
