ComponentDefinitions:
  cmp_ExecutiveKpiCard:
    DefinitionType: CanvasComponent
    CustomProperties:
      AccentColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#1677FF")
      BorderColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#E2E8F0")
      DangerColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#DC2626")
      Icon:
        PropertyKind: Input
        DataType: Text
        Default: ="ClipboardBulletList"
      MutedTextColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#64748B")
      OnSelect:
        PropertyKind: Event
        ReturnType: None
        Default: =
      Status:
        PropertyKind: Input
        DataType: Text
        Default: ="NEUTRAL"
      SuccessColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#16A34A")
      SupportingText:
        PropertyKind: Input
        DataType: Text
        Default: ="No change"
      SurfaceColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      TextColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#0F172A")
      Title:
        PropertyKind: Input
        DataType: Text
        Default: ="Open punches"
      TooltipText:
        PropertyKind: Input
        DataType: Text
        Default: ="Open the related dashboard"
      Trend:
        PropertyKind: Input
        DataType: Text
        Default: ="FLAT"
      ValueText:
        PropertyKind: Input
        DataType: Text
        Default: ="0"
      WarningColor:
        PropertyKind: Input
        DataType: Color
        Default: =ColorValue("#D97706")
    Properties:
      Height: =112
      Width: =260
    Children:
      - conEKC_Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =cmp_ExecutiveKpiCard.BorderColor
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =cmp_ExecutiveKpiCard.SurfaceColor
            Height: =Parent.Height
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            RadiusTopLeft: =14
            RadiusTopRight: =14
            Width: =Parent.Width
          Children:
            - recEKC_Accent:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderStyle: =BorderStyle.None
                  Fill: =Switch(Upper(cmp_ExecutiveKpiCard.Status),"SUCCESS",cmp_ExecutiveKpiCard.SuccessColor,"WARNING",cmp_ExecutiveKpiCard.WarningColor,"CRITICAL",cmp_ExecutiveKpiCard.DangerColor,cmp_ExecutiveKpiCard.AccentColor)
                  Height: =4
                  Width: =Parent.Width
            - icoEKC_Icon:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =Switch(Upper(cmp_ExecutiveKpiCard.Status),"SUCCESS",cmp_ExecutiveKpiCard.SuccessColor,"WARNING",cmp_ExecutiveKpiCard.WarningColor,"CRITICAL",cmp_ExecutiveKpiCard.DangerColor,cmp_ExecutiveKpiCard.AccentColor)
                  Height: =22
                  Icon: =Switch(cmp_ExecutiveKpiCard.Icon,"Check",Icon.Check,"Warning",Icon.Warning,"Clock",Icon.Clock,Icon.Information)
                  Width: =22
                  X: =16
                  Y: =18
            - lblEKC_Value:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmp_ExecutiveKpiCard.TextColor
                  FontWeight: =FontWeight.Bold
                  Size: =22
                  Text: =cmp_ExecutiveKpiCard.ValueText
                  Width: =Parent.Width - 70
                  X: =50
                  Y: =12
            - lblEKC_Title:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmp_ExecutiveKpiCard.TextColor
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Size: =11
                  Text: =cmp_ExecutiveKpiCard.Title
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =50
            - lblEKC_Trend:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =Switch(Upper(cmp_ExecutiveKpiCard.Trend),"UP",cmp_ExecutiveKpiCard.SuccessColor,"DOWN",cmp_ExecutiveKpiCard.DangerColor,cmp_ExecutiveKpiCard.MutedTextColor)
                  FontWeight: =FontWeight.Semibold
                  Height: =20
                  Size: =9
                  Text: =Switch(Upper(cmp_ExecutiveKpiCard.Trend),"UP","↑ ","DOWN","↓ ","→ ") & cmp_ExecutiveKpiCard.SupportingText
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =78
            - btnEKC_Open:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =0
                  Fill: =RGBA(0,0,0,0)
                  Height: =Parent.Height
                  HoverFill: =RGBA(22,119,255,0.04)
                  OnSelect: =cmp_ExecutiveKpiCard.OnSelect()
                  PressedFill: =RGBA(22,119,255,0.08)
                  Text: =""
                  Tooltip: =cmp_ExecutiveKpiCard.TooltipText
                  Width: =Parent.Width
