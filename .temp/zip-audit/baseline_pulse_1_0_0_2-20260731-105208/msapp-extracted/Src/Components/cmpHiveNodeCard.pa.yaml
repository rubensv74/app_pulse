ComponentDefinitions:
  cmpHiveNodeCard:
    DefinitionType: CanvasComponent
    CustomProperties:
      AtRisk:
        PropertyKind: Input
        DisplayName: AtRisk
        Description: A custom property
        DataType: Number
        Default: =100
      Blocked:
        PropertyKind: Input
        DisplayName: Blocked
        Description: A custom property
        DataType: Number
        Default: =100
      HealthColor:
        PropertyKind: Input
        DisplayName: HealthColor
        Description: A custom property
        DataType: Color
        Default: =RGBA(0, 0, 0, 1)
      HealthScore:
        PropertyKind: Input
        DisplayName: HealthScore
        Description: A custom property
        DataType: Number
        Default: =100
      HealthStatus:
        PropertyKind: Input
        DisplayName: HealthStatus
        Description: A custom property
        DataType: Text
        Default: ="Text"
      IsSelected:
        PropertyKind: Input
        DisplayName: IsSelected
        Description: A custom property
        DataType: Boolean
        Default: =true
      NodeId:
        PropertyKind: Input
        DisplayName: NodeId
        Description: A custom property
        DataType: Text
        Default: ="Text"
      NodeNo:
        PropertyKind: Input
        DisplayName: NodeNo
        Description: A custom property
        DataType: Text
        Default: ="Text"
      NodeSubtitle:
        PropertyKind: Input
        DisplayName: NodeSubtitle
        Description: A custom property
        DataType: Text
        Default: ="Text"
      NodeTitle:
        PropertyKind: Input
        DisplayName: NodeTitle
        Description: A custom property
        DataType: Text
        Default: ="Text"
      Overdue:
        PropertyKind: Input
        DisplayName: Overdue
        Description: A custom property
        DataType: Number
        Default: =100
      PressureLevel:
        PropertyKind: Input
        DisplayName: PressureLevel
        Description: A custom property
        DataType: Text
        Default: ="Text"
      Progress:
        PropertyKind: Input
        DisplayName: Progress
        Description: A custom property
        DataType: Number
        Default: =100
      SubsystemCode:
        PropertyKind: Input
        DisplayName: SubsystemCode
        Description: A custom property
        DataType: Text
        Default: ="Text"
      Total:
        PropertyKind: Input
        DisplayName: Total
        Description: A custom property
        DataType: Number
        Default: =100
      TrendDirection:
        PropertyKind: Input
        DisplayName: TrendDirection
        Description: A custom property
        DataType: Text
        Default: ="Text"
    Properties:
      Height: =230
      Width: =330
    Children:
      - cntCardRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: |-
              =

              If(
                  cmpHiveNodeCard.IsSelected,
                  cmpHiveNodeCard.HealthColor,
                  ColorValue("#E7EDF5")
              )
            BorderThickness: =If(cmpHiveNodeCard.IsSelected, 2, 1)
            Fill: =ColorValue("#FFFFFF")
            Height: =Parent.Height - 6
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            RadiusTopLeft: =18
            RadiusTopRight: =18
            Width: =Parent.Width - 6
            X: =3
            Y: =3
          Children:
            - recHealthBar:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =2
                  DisabledFill: =RGBA(161, 159, 157, 1)
                  Fill: =cmpHiveNodeCard.HealthColor
                  FocusedBorderThickness: =4
                  Height: =4
                  HoverFill: =RGBA(0, 120, 212, 1)
                  PressedFill: =RGBA(0, 120, 212, 1)
                  Width: =44
                  X: =18
            - recHeaderBg:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =2
                  DisabledFill: =RGBA(161, 159, 157, 1)
                  Fill: =ColorValue("#FBFCFE")
                  FocusedBorderThickness: =4
                  Height: =56
                  HoverFill: =RGBA(0, 120, 212, 1)
                  PressedFill: =RGBA(0, 120, 212, 1)
                  Width: =Parent.Width
            - lblNodeNo:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: =cmpHiveNodeCard.HealthColor
                  Fill: =ColorFade(cmpHiveNodeCard.HealthColor, 88%)
                  FontWeight: =FontWeight.Bold
                  Height: =28
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Size: =10
                  Text: =cmpHiveNodeCard.NodeNo
                  Width: =38
                  X: =18
                  Y: =15
            - lblNodeTitle:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#0F172A")
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  Size: =14
                  Text: =cmpHiveNodeCard.NodeTitle
                  Width: =160
                  X: =66
                  Y: =13
            - lblNodeSubtitle:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#64748B")
                  Height: =18
                  Size: =9
                  Text: =cmpHiveNodeCard.NodeSubtitle
                  Width: =170
                  X: =66
                  Y: =36
            - lblHealthScore:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmpHiveNodeCard.HealthColor
                  FontWeight: =FontWeight.Bold
                  Height: =48
                  Size: =34
                  Text: =cmpHiveNodeCard.HealthScore
                  Width: =88
                  X: =22
                  Y: =78
            - lblHealthScoreText:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#64748B")
                  Height: =18
                  Size: =9
                  Text: ="Health Score"
                  Width: =100
                  X: =24
                  Y: =122
            - lblHealthStatus:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: =cmpHiveNodeCard.HealthColor
                  Fill: =ColorFade(cmpHiveNodeCard.HealthColor, 88%)
                  FontWeight: =FontWeight.Semibold
                  Height: =26
                  RadiusBottomLeft: =999
                  RadiusBottomRight: =999
                  RadiusTopLeft: =999
                  RadiusTopRight: =999
                  Size: =9
                  Text: |-
                    =If(
                        cmpHiveNodeCard.HealthStatus = "Critical",
                        "⚠ Critical",
                        If(
                            cmpHiveNodeCard.HealthStatus = "At Risk",
                            "⚠ At Risk",
                            cmpHiveNodeCard.HealthStatus
                        )
                    )
                  Width: =94
                  X: =118
                  Y: =16
            - lblPressure:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: =ColorValue("#475569")
                  Fill: =ColorValue("#F8FAFC")
                  Height: =22
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =10
                  Text: =cmpHiveNodeCard.PressureLevel
                  Width: =86
                  X: =122
                  Y: =145
            - HtmlText1:
                Control: HtmlViewer@2.1.0
                Properties:
                  DisabledBorderColor: =RGBA(161, 159, 157, 1)
                  Font: =Font.'Segoe UI'
                  Height: =82
                  HtmlText: |-
                    =
                    With(
                        {
                            _color: Switch(
                                cmpHiveNodeCard.HealthStatus,
                                "Excellent", "#2F9E44",
                                "Good", "#EAB308",
                                "At Risk", "#F97316",
                                "Critical", "#DC2626",
                                "#64748B"
                            )
                        },
                        "<svg width='82' height='82' viewBox='0 0 82 82' xmlns='http://www.w3.org/2000/svg'>
                            <circle cx='41' cy='41' r='31' fill='none' stroke='#E5E7EB' stroke-width='8'/>
                            <circle cx='41' cy='41' r='31' fill='none' stroke='" & _color & "' stroke-width='8'
                                stroke-dasharray='" & Text(cmpHiveNodeCard.Progress * 1.76) & " 176'
                                stroke-linecap='round'
                                transform='rotate(-90 38 38)'/>
                            <text x='38' y='37' text-anchor='middle' font-size='14' font-weight='700' fill='#0F172A'>" & cmpHiveNodeCard.Progress & "%</text>
                            <text x='38' y='52' text-anchor='middle' font-size='9' fill='#64748B'>Progress</text>
                        </svg>"
                    )
                  Width: =82
                  X: =130
                  Y: =72
            - lblTrend:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: |-
                    =

                    Switch(
                        cmpHiveNodeCard.TrendDirection,
                        "Improving", ColorValue("#2F9E44"),
                        "Worsening", ColorValue("#DC2626"),
                        "Stable", ColorValue("#64748B"),
                        ColorValue("#64748B")
                    )
                  Fill: =ColorValue("#F8FAFC")
                  Height: =22
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =10
                  Text: |-
                    =Switch(
                        cmpHiveNodeCard.TrendDirection,
                        "Improving", "↗ Improving",
                        "Worsening", "↘ Worsening",
                        "Stable", "→ Stable",
                        "New", "• New",
                        cmpHiveNodeCard.TrendDirection
                    )
                  Width: =88
                  X: =225
                  Y: =145
            - recDivider:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =2
                  DisabledFill: =RGBA(161, 159, 157, 1)
                  Fill: =ColorValue("#EDF2F7")
                  FocusedBorderThickness: =4
                  Height: =1
                  HoverFill: =RGBA(0, 120, 212, 1)
                  PressedFill: =RGBA(0, 120, 212, 1)
                  Width: =Parent.Width - 36
                  X: =18
                  Y: =174
            - lblTotalValue:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#0F172A")
                  FontWeight: =FontWeight.Bold
                  Height: =18
                  Size: =12
                  Text: =cmpHiveNodeCard.Total
                  Width: =50
                  X: =22
                  Y: =179
            - lblTotalText:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#64748B")
                  Height: =14
                  Size: =8
                  Text: ="TOTAL"
                  Width: =50
                  X: =22
                  Y: =196
            - Text39:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#F97316")
                  FontWeight: =FontWeight.Bold
                  Height: =18
                  Size: =12
                  Text: =cmpHiveNodeCard.Overdue
                  Width: =50
                  X: =95
                  Y: =179
            - Text40:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#64748B")
                  Height: =14
                  Size: =8
                  Text: ="OVERDUE"
                  Width: =60
                  X: =95
                  Y: =196
            - Text41:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#DC2626")
                  FontWeight: =FontWeight.Bold
                  Height: =18
                  Size: =12
                  Text: =cmpHiveNodeCard.Blocked
                  Width: =50
                  X: =178
                  Y: =179
            - Text42:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#64748B")
                  Height: =14
                  Size: =8
                  Text: ="BLOCKED"
                  Width: =60
                  X: =178
                  Y: =196
            - Text43:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#EAB308")
                  FontWeight: =FontWeight.Bold
                  Height: =18
                  Size: =12
                  Text: =cmpHiveNodeCard.AtRisk
                  Width: =50
                  X: =260
                  Y: =179
            - Text44:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#64748B")
                  Height: =14
                  Size: =8
                  Text: ="AT RISK"
                  Width: =60
                  X: =260
                  Y: =196
            - Button1:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =0
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  DisabledFill: =RGBA(242, 242, 241, 0)
                  Fill: =RGBA(0,0,0,0)
                  Font: =Font.'Segoe UI'
                  Height: =Parent.Height
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(15,23,42,0.025)
                  OnSelect: |-
                    =Set(
                        varSelectedHiveNode,
                        {
                            NodeId: cmpHiveNodeCard.NodeId,
                            NodeNo: cmpHiveNodeCard.NodeNo,
                            NodeTitle: cmpHiveNodeCard.NodeTitle,
                            NodeSubtitle: cmpHiveNodeCard.NodeSubtitle,
                            SubsystemCode: cmpHiveNodeCard.SubsystemCode,
                            HealthScore: cmpHiveNodeCard.HealthScore,
                            HealthStatus: cmpHiveNodeCard.HealthStatus,
                            HealthColor: cmpHiveNodeCard.HealthColor,
                            Progress: cmpHiveNodeCard.Progress,
                            TrendDirection: cmpHiveNodeCard.TrendDirection,
                            PressureLevel: cmpHiveNodeCard.PressureLevel,
                            Total: cmpHiveNodeCard.Total,
                            Overdue: cmpHiveNodeCard.Overdue,
                            Blocked: cmpHiveNodeCard.Blocked,
                            AtRisk: cmpHiveNodeCard.AtRisk
                        }
                    )
                  PressedBorderColor: =RGBA(0, 69, 120, 1)
                  PressedColor: =RGBA(255, 255, 255, 1)
                  PressedFill: =RGBA(15,23,42,0.05)
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                  Text: =
                  Width: =Parent.Width
            - recHeaderDivider:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =2
                  DisabledFill: =RGBA(161, 159, 157, 1)
                  Fill: =ColorValue("#EDF2F7")
                  FocusedBorderThickness: =4
                  Height: =1
                  HoverFill: =RGBA(0, 120, 212, 1)
                  PressedFill: =RGBA(0, 120, 212, 1)
                  Width: =Parent.Width - 36
                  X: =18
                  Y: =56
            - recProgressTrack:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =2
                  DisabledFill: =RGBA(161, 159, 157, 1)
                  Fill: =ColorValue("#EEF3F8")
                  FocusedBorderThickness: =4
                  Height: =4
                  HoverFill: =RGBA(0, 120, 212, 1)
                  PressedFill: =RGBA(0, 120, 212, 1)
                  Width: =Parent.Width - 36
                  X: =18
                  Y: =222
            - recProgressValue:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =2
                  DisabledFill: =RGBA(161, 159, 157, 1)
                  Fill: =cmpHiveNodeCard.HealthColor
                  FocusedBorderThickness: =4
                  Height: =4
                  HoverFill: =RGBA(0, 120, 212, 1)
                  PressedFill: =RGBA(0, 120, 212, 1)
                  Width: =Max(4, (Parent.Width - 36) * cmpHiveNodeCard.Progress / 100)
                  X: =18
                  Y: =222
