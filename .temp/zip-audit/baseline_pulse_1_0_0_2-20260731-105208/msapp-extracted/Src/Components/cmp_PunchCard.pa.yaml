ComponentDefinitions:
  cmp_PunchCard:
    DefinitionType: CanvasComponent
    CustomProperties:
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Main accent color
        DataType: Color
        Default: =ColorValue("#1677FF")
      AttachmentCount:
        PropertyKind: Input
        DisplayName: AttachmentCount
        Description: Number of attachments
        DataType: Number
        Default: =0
      BackgroundColor:
        PropertyKind: Input
        DisplayName: BackgroundColor
        Description: Card background color
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        Description: Card border color
        DataType: Color
        Default: =ColorValue("#E2E8F0")
      Category:
        PropertyKind: Input
        DisplayName: Category
        Description: Punch category
        DataType: Text
        Default: ="A"
      CategoryColor:
        PropertyKind: Input
        DisplayName: CategoryColor
        Description: Category accent color
        DataType: Color
        Default: =ColorValue("#EA580C")
      CommentCount:
        PropertyKind: Input
        DisplayName: CommentCount
        Description: Number of comments
        DataType: Number
        Default: =0
      Discipline:
        PropertyKind: Input
        DisplayName: Discipline
        Description: Discipline
        DataType: Text
        Default: =""
      DueDateText:
        PropertyKind: Input
        DisplayName: DueDateText
        Description: Due date as text
        DataType: Text
        Default: =""
      IsSelected:
        PropertyKind: Input
        DisplayName: IsSelected
        Description: Selected state
        DataType: Boolean
        Default: =false
      Location:
        PropertyKind: Input
        DisplayName: Location
        Description: Area / Unit / System text
        DataType: Text
        Default: =""
      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Muted text color
        DataType: Color
        Default: =ColorValue("#64748B")
      OnOpenDetails:
        PropertyKind: Event
        DisplayName: OnOpenDetails
        Description: Executes when details action is selected
        ReturnType: None
        Default: =
      OnSelectCard:
        PropertyKind: Event
        DisplayName: OnSelectCard
        Description: Executes when card is selected
        ReturnType: None
        Default: =
      Owner:
        PropertyKind: Input
        DisplayName: Owner
        Description: Owner or responsible party
        DataType: Text
        Default: =""
      PunchCode:
        PropertyKind: Input
        DisplayName: PunchCode
        Description: Punch code or number
        DataType: Text
        Default: ="PUNCH-000"
      PunchId:
        PropertyKind: Input
        DisplayName: PunchId
        Description: Punch unique id
        DataType: Text
        Default: =""
      SelectedPunchId:
        PropertyKind: Output
        DisplayName: SelectedPunchId
        Description: Current punch id
        DataType: Text
      ShowFooter:
        PropertyKind: Input
        DisplayName: ShowFooter
        Description: Shows footer metadata
        DataType: Boolean
        Default: =true
      Status:
        PropertyKind: Input
        DisplayName: Status
        Description: Punch status
        DataType: Text
        Default: ="Open"
      StatusColor:
        PropertyKind: Input
        DisplayName: StatusColor
        Description: Status accent color
        DataType: Color
        Default: =ColorValue("#16A34A")
      Subcontractor:
        PropertyKind: Input
        DisplayName: Subcontractor
        Description: Subcontractor
        DataType: Text
        Default: =""
      Subsystem:
        PropertyKind: Input
        DisplayName: Subsystem
        Description: Subsystem code
        DataType: Text
        Default: =""
      SummaryText:
        PropertyKind: Output
        DisplayName: SummaryText
        Description: Compact punch summary
        DataType: Text
      SurfaceAltColor:
        PropertyKind: Input
        DisplayName: SurfaceAltColor
        Description: Soft surface color
        DataType: Color
        Default: =ColorValue("#F8FAFC")
      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Main text color
        DataType: Color
        Default: =ColorValue("#0F172A")
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Punch title or description
        DataType: Text
        Default: ="Punch description"
    Properties:
      Height: =164
      SelectedPunchId: =cmp_PunchCard.PunchId
      SummaryText: =cmp_PunchCard.PunchCode & " · " & cmp_PunchCard.Category & " · " & cmp_PunchCard.Status
      Width: =420
    Children:
      - conPC_Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =If(cmp_PunchCard.IsSelected, cmp_PunchCard.AccentColor, cmp_PunchCard.BorderColor)
            BorderThickness: =If(cmp_PunchCard.IsSelected, 2, 1)
            DropShadow: =DropShadow.Semibold
            Fill: =cmp_PunchCard.BackgroundColor
            Height: =Parent.Height
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            RadiusTopLeft: =14
            RadiusTopRight: =14
            Width: =Parent.Width
          Children:
            - btnPC_Click:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  DisabledFill: =RGBA(242, 242, 241, 0)
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =Parent.Height
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =Color.White
                  HoverFill: =RGBA(0,0,0,0.02)
                  OnSelect: =cmp_PunchCard.OnSelectCard()
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =Color.White
                  PressedFill: =RGBA(0,0,0,0.04)
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Text: =""
                  Width: =Parent.Width
            - conPC_Category:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =cmp_PunchCard.CategoryColor
                  DropShadow: =DropShadow.None
                  Fill: =cmp_PunchCard.CategoryColor
                  Height: =28
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Width: =42
                  X: =16
                  Y: =14
                Children:
                  - lblPC_Category:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =Color.White
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =28
                        OnSelect: =cmp_PunchCard.OnSelectCard()
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                        Text: =cmp_PunchCard.Category
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width
                        Y: =5
            - lblPC_Code:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmp_PunchCard.MutedTextColor
                  FontWeight: =FontWeight.Semibold
                  Height: =18
                  Size: =10
                  Text: =cmp_PunchCard.PunchCode
                  Width: =Parent.Width - 170
                  X: =70
                  Y: =14
            - conPC_Status:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =cmp_PunchCard.StatusColor
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =cmp_PunchCard.SurfaceAltColor
                  Height: =26
                  RadiusBottomLeft: =13
                  RadiusBottomRight: =13
                  RadiusTopLeft: =13
                  RadiusTopRight: =13
                  Width: =98
                  X: =Parent.Width - 116
                  Y: =14
                Children:
                  - lblPC_Status:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =cmp_PunchCard.StatusColor
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =26
                        OnSelect: =cmp_PunchCard.OnSelectCard()
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =9
                        Text: =cmp_PunchCard.Status
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width
                        Y: =5
            - lblPC_Title:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =cmp_PunchCard.TextColor
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =38
                  OnSelect: =cmp_PunchCard.OnSelectCard()
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =11
                  Text: =cmp_PunchCard.Title
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =52
            - lblPC_Meta1:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmp_PunchCard.MutedTextColor
                  Height: =18
                  Size: =9
                  Text: =cmp_PunchCard.Subsystem & If(!IsBlank(cmp_PunchCard.Discipline), " · " & cmp_PunchCard.Discipline, "") & If(!IsBlank(cmp_PunchCard.Subcontractor), " · " & cmp_PunchCard.Subcontractor, "")
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =94
            - lblPC_Meta2:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmp_PunchCard.MutedTextColor
                  Height: =18
                  Size: =9
                  Text: =If(!IsBlank(cmp_PunchCard.Location), cmp_PunchCard.Location, cmp_PunchCard.Owner)
                  Width: =Parent.Width - 156
                  X: =16
                  Y: =116
            - icoPC_Comments:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =cmp_PunchCard.MutedTextColor
                  DisabledBorderColor: =RGBA(245, 245, 245, 1)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =16
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =cmp_PunchCard.AccentColor
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Icon: =Icon.Message
                  OnSelect: =cmp_PunchCard.OnOpenDetails()
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =cmp_PunchCard.AccentColor
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Visible: =cmp_PunchCard.ShowFooter
                  Width: =16
                  X: =Parent.Width - 124
                  Y: =118
            - lblPC_Comments:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =cmp_PunchCard.MutedTextColor
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =18
                  OnSelect: =cmp_PunchCard.OnOpenDetails()
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =9
                  Text: =Text(cmp_PunchCard.CommentCount)
                  VerticalAlign: =VerticalAlign.Top
                  Visible: =cmp_PunchCard.ShowFooter
                  Width: =22
                  X: =Parent.Width - 104
                  Y: =118
            - icoPC_Attachments:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =cmp_PunchCard.MutedTextColor
                  DisabledBorderColor: =RGBA(245, 245, 245, 1)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =16
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =cmp_PunchCard.AccentColor
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Icon: =Icon.PaperClip
                  OnSelect: =cmp_PunchCard.OnOpenDetails()
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =cmp_PunchCard.AccentColor
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Visible: =cmp_PunchCard.ShowFooter
                  Width: =16
                  X: =Parent.Width - 76
                  Y: =118
            - lblPC_Attachments:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =cmp_PunchCard.MutedTextColor
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =18
                  OnSelect: =cmp_PunchCard.OnOpenDetails()
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =9
                  Text: =Text(cmp_PunchCard.AttachmentCount)
                  VerticalAlign: =VerticalAlign.Top
                  Visible: =cmp_PunchCard.ShowFooter
                  Width: =22
                  X: =Parent.Width - 56
                  Y: =118
            - btnPC_Details:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =cmp_PunchCard.AccentColor
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  DisabledFill: =RGBA(242, 242, 241, 0)
                  Fill: =cmp_PunchCard.AccentColor
                  Font: =Font.'Segoe UI'
                  Height: =28
                  HoverBorderColor: =cmp_PunchCard.AccentColor
                  HoverColor: =Color.White
                  HoverFill: =cmp_PunchCard.AccentColor
                  OnSelect: =cmp_PunchCard.OnOpenDetails()
                  PressedBorderColor: =cmp_PunchCard.AccentColor
                  PressedColor: =Color.White
                  PressedFill: =cmp_PunchCard.AccentColor
                  RadiusBottomLeft: =7
                  RadiusBottomRight: =7
                  RadiusTopLeft: =7
                  RadiusTopRight: =7
                  Size: =9
                  Text: ="Details"
                  Width: =76
                  X: =Parent.Width - 92
                  Y: =Parent.Height - 42
