                        - conBriefing_ActionContext:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =60
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =20
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =8
                            Children:
                              - dpBriefingDate_1:
                                  Control: ModernDatePicker@1.0.1
                                  Properties:
                                    Appearance: =Appearance.Outline
                                    DefaultDate: =varBriefingDate
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnChange: =Set(varBriefingDate, Self.SelectedDate)
                                    Width: =200
                              - txtBriefingFromTime_1:
                                  Control: ModernTextInput@1.1.1
                                  Properties:
                                    Appearance: =Appearance.Outline
                                    Default: =varBriefingFromTime
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnChange: =Set(varBriefingFromTime, Self.Text)
                                    Placeholder: ="08:00"
                                    Width: =70
                              - txtBriefingToTime_1:
                                  Control: ModernTextInput@1.1.1
                                  Properties:
                                    Appearance: =Appearance.Outline
                                    Default: =varBriefingToTime
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnChange: =Set(varBriefingToTime, Self.Text)
                                    Placeholder: ="17:00"
                                    Width: =70
                              - btnBriefingGenerate_1:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    BasePaletteColor: =varTheme_PulseBlueDark
                                    DisplayMode: |-
                                      =If(
                                          IsBlank(varBriefingDate) ||
                                          IsBlank(varBriefingFromTime) ||
                                          IsBlank(varBriefingToTime),
                                          DisplayMode.Disabled,
                                          DisplayMode.Edit
                                      )
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =
                                      Set(varBriefingLoading, true);

                                      Set(
                                          varBriefingResponse,
                                          WarRoom_DailyBriefing_GetData.Run(
                                              varProjectId,
                                              Text(
                                                  DateValue(varBriefingDate) + TimeValue(varBriefingFromTime),
                                                  "yyyy-mm-ddTHH:mm:ss"
                                              ),
                                              Text(
                                                  DateValue(varBriefingDate) + TimeValue(varBriefingToTime),
                                                  "yyyy-mm-ddTHH:mm:ss"
                                              ),
                                              ""
                                          )
                                      );

                                      ClearCollect(
                                          colBriefingEvents,
                                          ForAll(
                                              Table(ParseJSON(varBriefingResponse.events)),
                                              {
                                                  ActivityLogId: Value(Value.ActivityLogId),
                                                  ProjectId: Value(Value.ProjectId),
                                                  EntityType: Text(Value.EntityType),
                                                  EntityId: Text(Value.EntityId),
                                                  EventType: Text(Value.EventType),
                                                  Title: Text(Value.Title),
                                                  Description: Text(Value.Description),
                                                  Severity: Text(Value.Severity),
                                                  SubsystemCode: Text(Value.SubsystemCode),
                                                  Owner: Text(Value.Owner),
                                                  ChangedBy: Text(Value.ChangedBy),
                                                  ChangedAt: DateTimeValue(Text(Value.ChangedAt))
                                              }
                                          )
                                      );

                                      ClearCollect(
                                          colBriefingKpis,
                                          ForAll(
                                              Table(ParseJSON(varBriefingResponse.kpis)),
                                              {
                                                  TotalEvents: Value(Value.TotalEvents),
                                                  StatusChanges: Value(Value.StatusChanges),
                                                  OwnerChanges: Value(Value.OwnerChanges),
                                                  DueDateChanges: Value(Value.DueDateChanges),
                                                  CommentsUpdated: Value(Value.CommentsUpdated),
                                                  CriticalEvents: Value(Value.CriticalEvents)
                                              }
                                          )
                                      );

                                      Set(varBriefingLoading, false);
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                    Text: ="Generate Briefing"
                                    Width: =170
                              - btnGenerateNotes_1:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    BasePaletteColor: =varTheme_PulseBlueDark
                                    DisplayMode: |-
                                      =If(
                                          CountRows(colBriefingKpis) = 0,
                                          DisplayMode.Disabled,
                                          DisplayMode.Edit
                                      )
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =If(
                                          CountRows(colBriefingKpis) = 0,
                                          Notify("Generate the briefing first.", NotificationType.Warning),

                                          Set(
                                              varBriefingNotes,
                                              "WARROOM DAILY BRIEFING" & Char(10) &
                                              Text(varBriefingDate, "dd/mm/yyyy") & Char(10) & Char(10) &

                                              "TIME RANGE" & Char(10) &
                                              varBriefingFromTime & " - " & varBriefingToTime & Char(10) & Char(10) &

                                              "SUMMARY" & Char(10) &
                                              "- Total operational events: " & Text(Coalesce(First(colBriefingKpis).TotalEvents, 0)) & Char(10) &
                                              "- Status changes: " & Text(Coalesce(First(colBriefingKpis).StatusChanges, 0)) & Char(10) &
                                              "- Owner changes: " & Text(Coalesce(First(colBriefingKpis).OwnerChanges, 0)) & Char(10) &
                                              "- Due date changes: " & Text(Coalesce(First(colBriefingKpis).DueDateChanges, 0)) & Char(10) &
                                              "- Comments updated: " & Text(Coalesce(First(colBriefingKpis).CommentsUpdated, 0)) & Char(10) &
                                              "- Critical events: " & Text(Coalesce(First(colBriefingKpis).CriticalEvents, 0)) & Char(10) & Char(10) &

                                              "KEY EVENTS" & Char(10) &
                                              If(
                                                  CountRows(colBriefingEvents) = 0,
                                                  "- No operational activity detected." & Char(10),
                                                  Concat(
                                                      FirstN(SortByColumns(colBriefingEvents, "ChangedAt", SortOrder.Ascending), 15),
                                                      "- " & Text(ChangedAt, "HH:mm") & " | " & Title & Char(10)
                                                  )
                                              ) & Char(10) &

                                              "CRITICAL ITEMS" & Char(10) &
                                              If(
                                                  CountRows(Filter(colBriefingEvents, Severity = "CRITICAL")) = 0,
                                                  "- No critical events detected.",
                                                  Concat(
                                                      Filter(colBriefingEvents, Severity = "CRITICAL"),
                                                      "- " & Title & " · " & Description & Char(10)
                                                  )
                                              )
                                          );

                                          Notify("Meeting notes generated.", NotificationType.Success)
                                      )
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                    Text: ="Generate Notes"
                                    Width: =170
                              - btnPrepareEmail_1:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    BasePaletteColor: =varTheme_PulseBlueDark
                                    DisplayMode: |-
                                      =If(
                                          IsBlank(varBriefingNotes),
                                          DisplayMode.Disabled,
                                          DisplayMode.Edit
                                      )
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
