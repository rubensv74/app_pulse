                                          varBriefingEmailSubject,
                                          "WARROOM DAILY BRIEFING | " &
                                          varProjectCode &
                                          " | " &
                                          Text(varBriefingDate, "dd-mmm-yyyy")
                                      );

                                      Set(
                                          varBriefingEmailBody,
                                          "<div style='font-family:Segoe UI, Arial; color:#0F172A;'>" &
                                          "<h2>WARROOM DAILY BRIEFING</h2>" &
                                          "<p><b>Project:</b> " & varProjectCode & " - " & varProjectName & "</p>" &
                                          "<p><b>Date:</b> " & Text(varBriefingDate, "dd/mm/yyyy") & "</p>" &
                                          "<p><b>Time range:</b> " & varBriefingFromTime & " - " & varBriefingToTime & "</p>" &
                                          "<hr>" &
                                          "<div style='white-space:pre-wrap;line-height:1.6;'>" &
                                          Substitute(varBriefingNotes, Char(10), "<br>") &
                                          "</div>" &
                                          "</div>"
                                      );

                                      Set(varBriefingEmailVisible, true);

                                      Notify(
                                          "Email prepared successfully.",
                                          NotificationType.Success
                                      );
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                    Text: ="Prepare Email"
                                    Width: =150
