      - btnOverview_RefreshCache:
          Control: ModernButton@1.0.0
          Properties:
            OnSelect: |-
              =


              Set(varOps_IsLoading, true);
              Set(varOps_Error, "");

              IfError(
                  WarRoom_Operations_RefreshCellCache.Run(
                      Text(varProjectId),
                      If(IsBlank(varOps_FilterSubsystem), "", Text(varOps_FilterSubsystem)),
                      true
                  ),
                  Set(varOps_Error, FirstError.Message);
                  Notify("Refresh cache error: " & varOps_Error, NotificationType.Error)
              );

              Set(varOps_IsLoading, false);
            Visible: =false
            X: =40
            Y: =40
      - btnPHR_RebuildActiveTab:
          Control: Button@0.0.45
          Properties:
            OnSelect: |-
              =

              // ======================================================
              // btnPHR_RebuildActiveTab.OnSelect
              // PHR - Rebuild active L1 tab optimized
              // ======================================================

              If(
                  IsBlank(varPHR_SelectedL1NodeId) && CountRows(colPHR_HeaderL1Base) > 0,
                  Set(varPHR_SelectedL1NodeId, First(colPHR_HeaderL1Base).L1NodeId);
                  Set(varPHR_SelectedL1Label, First(colPHR_HeaderL1Base).L1Label)
              );

              If(
                  IsBlank(varPHR_SelectedL1NodeId),
                  Clear(colPHR_HeaderL4_Active);
                  Clear(colPHR_HeaderL3_Active);
                  Clear(colPHR_HeaderL2_Active);
                  Clear(colPHR_HeaderL1_Active);
                  Clear(colPHR_RowCells_Active);
                  Clear(colPHR_RowStatus);
                  Exit()
              );

              // 1) Build active L4 columns using Index instead of CountRows(Filter(...))
              ClearCollect(
                  colPHR_HeaderL4_Active_Base,
                  SortByColumns(
                      Filter(
                          colPHR_HeaderL4Indexed,
                          Text(L1NodeId) = Text(varPHR_SelectedL1NodeId)
                      ),
                      "ColIndex",
                      SortOrder.Ascending
                  )
              );

              ClearCollect(
                  colPHR_HeaderL4_Active,
                  ForAll(
                      Sequence(CountRows(colPHR_HeaderL4_Active_Base)) As seq,
                      Patch(
                          Index(colPHR_HeaderL4_Active_Base, seq.Value),
                          {
                              LocalColIndex: seq.Value,
                              StartX: (seq.Value - 1) * varPHR_ColW,
                              WidthPx: varPHR_ColW
                          }
                      )
                  )
              );

              // 2) Build active L3 groups
              ClearCollect(
                  colPHR_HeaderL3_Active,
                  SortByColumns(
                      AddColumns(
                          GroupBy(
                              colPHR_HeaderL4_Active,
                              L1NodeId,
                              L1Label,
                              L1SortOrder,
                              L2NodeId,
                              L2Label,
                              L2SortOrder,
                              L3NodeId,
                              L3Label,
                              L3SortOrder,
                              Rows
                          ),
                          StartCol, Min(Rows, LocalColIndex),
                          EndCol, Max(Rows, LocalColIndex),
                          ColCount, CountRows(Rows),
                          StartX, (Min(Rows, LocalColIndex) - 1) * varPHR_ColW,
                          WidthPx, CountRows(Rows) * varPHR_ColW
                      ),
                      "StartCol",
                      SortOrder.Ascending
                  )
              );

              // 3) Build active L2 groups
              ClearCollect(
                  colPHR_HeaderL2_Active,
                  SortByColumns(
                      AddColumns(
                          GroupBy(
                              colPHR_HeaderL4_Active,
                              L1NodeId,
                              L1Label,
                              L1SortOrder,
                              L2NodeId,
                              L2Label,
                              L2SortOrder,
                              Rows
                          ),
                          StartCol, Min(Rows, LocalColIndex),
                          EndCol, Max(Rows, LocalColIndex),
                          ColCount, CountRows(Rows),
                          StartX, (Min(Rows, LocalColIndex) - 1) * varPHR_ColW,
                          WidthPx, CountRows(Rows) * varPHR_ColW
                      ),
                      "StartCol",
                      SortOrder.Ascending
                  )
              );

              // 4) Build active L1 group
              ClearCollect(
                  colPHR_HeaderL1_Active,
                  SortByColumns(
                      AddColumns(
                          GroupBy(
                              colPHR_HeaderL4_Active,
                              L1NodeId,
                              L1Label,
                              L1SortOrder,
                              Rows
                          ),
                          StartCol, Min(Rows, LocalColIndex),
                          EndCol, Max(Rows, LocalColIndex),
                          ColCount, CountRows(Rows),
                          StartX, 0,
                          WidthPx, CountRows(Rows) * varPHR_ColW
                      ),
                      "StartCol",
                      SortOrder.Ascending
                  )
              );

              // 5) Build active row cells
              ClearCollect(
                  colPHR_RowCells_Active,
                  Ungroup(
                      ForAll(
                          colPHR_Subsystems As s,
                          With(
                              {
                                  _subMetrics:
                                      Filter(
                                          colPHR_Metrics,
                                          SubsystemCode = s.SubsystemCode
                                      )
                              },
                              {
                                  RowCells:
                                      AddColumns(
                                          colPHR_HeaderL4_Active As h,
                                          SubsystemCode, s.SubsystemCode,
                                          RowNo, s.RowNo,
                                          CellValue,
                                              Coalesce(
                                                  LookUp(
                                                      _subMetrics,
                                                      MetricKey = h.MetricKey,
                                                      MetricValue
                                                  ),
                                                  0
                                              )
                                      )
                              }
                          )
                      ),
                      RowCells
                  )
              );

              // 6) Precalculate row status once
              ClearCollect(
                  colPHR_RowStatus,
                  ForAll(
                      colPHR_Subsystems As s,
                      With(
                          {
                              _maxRemaining:
                                  Coalesce(
                                      Max(
                                          Filter(
                                              colPHR_RowCells_Active,
                                              SubsystemCode = s.SubsystemCode &&
                                              Upper(Text(MetricLabel)) in ["REM.", "REMAINING"]
                                          ),
                                          Value(CellValue)
                                      ),
                                      0
                                  )
                          },
                          {
                              SubsystemCode: s.SubsystemCode,
                              MaxRemaining: _maxRemaining,
                              StatusColor:
                                  If(
                                      _maxRemaining >= 20,
                                      ColorValue("#DC2626"),
                                      If(
                                          _maxRemaining > 0,
                                          ColorValue("#D97706"),
                                          ColorValue("#16A34A")
                                      )
                                  ),
                              StatusTooltip:
                                  If(
                                      _maxRemaining >= 20,
                                      "Attention required · " & Text(_maxRemaining) & " remaining",
                                      If(
                                          _maxRemaining > 0,
                                          "In progress · " & Text(_maxRemaining) & " remaining",
                                          "Ready · no remaining items"
                                      )
                                  )
                          }
                      )
                  )
              );

              // 7) Recalculate active widths
              Set(
                  varPHR_DataColsWidth_Active,
                  Max(
                      CountRows(colPHR_HeaderL4_Active) * varPHR_ColW,
                      varPHR_ColW
                  )
              );

              Set(
                  varPHR_TotalGridWidth_Active,
                  varPHR_StatusW + varPHR_SubsysW + varPHR_ActionsW + varPHR_DataColsWidth_Active
              );

              // 8) Reset horizontal scroll
              Reset(sldPHR_HOffset_1);
            Visible: =false
            X: =20
            Y: =20
      - btnPHR_GenerateSnapshot:
          Control: ModernButton@1.0.0
          Properties:
            OnSelect: |-
              =

              If(
                  IsBlank(varProjectId) || !IsNumeric(Text(varProjectId)),
                  Notify("Select a valid project first.", NotificationType.Warning);
                  Exit()
              );

              Set(varPHR_IsLoading, true);
              Set(varOps_IsLoading, true);

              Set(varGlobalLoading, true);
              Set(varGlobalLoadingMsg, "Refreshing Project Handover Report");
              Set(varGlobalLoadingSubMsg, "Recalculating subsystem metrics");
              Set(varGlobalLoadingScope, "OVERVIEW");

              IfError(
                  Set(
                      varPHR_GenerateSnapshotResponse,
                      warroom_GenerateOverviewSnapshot.Run(
                          Value(varProjectId)
                      )
                  ),

                  Notify(
                      "Error generating Overview snapshot: " & FirstError.Message,
                      NotificationType.Error
                  );

                  Set(varPHR_LoadMode, "");

                  Set(varPHR_IsLoading, false);
                  Set(varOps_IsLoading, false);

                  Set(varGlobalLoading, false);
                  Set(varGlobalLoadingMsg, "");
                  Set(varGlobalLoadingSubMsg, "");
                  Set(varGlobalLoadingScope, "");

                  Exit()
              );
            Visible: =false
            X: =60
            Y: =60
      - btnPHR_LoadSnapshot:
          Control: ModernButton@1.0.0
          Properties:
            OnSelect: |-
              =// =====================================================
              // btnPHR_Search_Overview.OnSelect
              // Load Overview / PHR optimized
              // Includes TemplateId for Punch navigation
              // =====================================================

              If(
                  IsBlank(varProjectId) || !IsNumeric(Text(varProjectId)),

                  Notify("Select a valid project first.", NotificationType.Warning);

                  Set(varPHR_IsLoading, false);
                  Set(varPHR_IsRendering, false);
                  Set(varOps_IsLoading, false);

                  Set(varGlobalLoading, false);
                  Set(varGlobalLoadingMsg, "");
                  Set(varGlobalLoadingSubMsg, "");
                  Set(varGlobalLoadingScope, "");

                  Exit()
              );

              If(
                  (varPHR_IsLoading || varOps_IsLoading) &&
                  varPHR_LoadMode <> "REFRESH",

                  Notify("Overview is already loading.", NotificationType.Information);

                  Exit()
              );

              Set(varPHR_IsLoading, true);
              Set(varPHR_IsRendering, false);
              Set(varOps_IsLoading, true);

              Set(varGlobalLoading, true);

              If(
                  varPHR_LoadMode = "REFRESH",
                  Set(varGlobalLoadingMsg, "Refreshing Project Handover Report");
                  Set(varGlobalLoadingSubMsg, "Loading refreshed report data"),
                  Set(varGlobalLoadingMsg, "Loading Project Handover Report");
                  Set(varGlobalLoadingSubMsg, "Reading latest available data")
              );

              Set(varGlobalLoadingScope, "OVERVIEW");

              Set(varPHR_LastErrorMessage, "");
              Set(varOverviewNoConfig, false);
              Set(varOverviewNoData, false);
              Set(varProjectHasPHRData, false);
              Set(varPHR_OverviewLoaded, false);

              Clear(colPHR_Subsystems);
              Clear(colPHR_Metrics);
              Clear(colPHR_Headers);
              Clear(colPHR_RowCells);
              Clear(colPHR_RowCells_Active);
              Clear(colPHR_RowStatus);

              Clear(colPHR_HeaderL4);
              Clear(colPHR_HeaderL4Indexed);
              Clear(colPHR_HeaderL3Base);
              Clear(colPHR_HeaderL2Base);
              Clear(colPHR_HeaderL1Base);
              Clear(colPHR_TabsL1);

              Clear(colPHR_HeaderL4_Active);
              Clear(colPHR_HeaderL3_Active);
              Clear(colPHR_HeaderL2_Active);
              Clear(colPHR_HeaderL1_Active);

              Set(varPHR_Page, Coalesce(varPHR_Page, 1));
              Set(varPHR_PageSize, Coalesce(varPHR_PageSize, 50));

              Set(varPHR_HeaderH1, 26);
              Set(varPHR_HeaderH2, 24);
              Set(varPHR_HeaderH3, 30);
              Set(varPHR_HeaderH4, 36);
              Set(varPHR_RowH, 44);

              Set(varPHR_ColW, 66);
              Set(varPHR_StatusW, 52);
              Set(varPHR_SubsysW, 190);
              Set(varPHR_ActionsW, 90);
              Set(varPHR_LeftFixedW, varPHR_StatusW + varPHR_SubsysW + varPHR_ActionsW);

              Set(varPHR_SelectedL1NodeId, "");
              Set(varPHR_SelectedL1Label, "");
              Set(varPHR_SelectedTemplateId, Blank());

              IfError(
                  With(
                      {
                          resp:
                              Warroom_GetOverviewSnapshot.Run(
                                  Value(varProjectId),
                                  If(IsBlank(varFilter_Subsystem), "", Text(varFilter_Subsystem)),
                                  Value(varPHR_Page),
                                  Value(varPHR_PageSize)
                              )
                      },
                      With(
                          {
                              raw: Coalesce(resp.result, "{}"),
                              obj: ParseJSON(Coalesce(resp.result, "{}"))
                          },

                          Set(varPHR_LastRawResult, raw);

                          ClearCollect(
                              colPHR_Subsystems_Base,
                              ForAll(
                                  Table(obj.subsystems),
                                  {
                                      SubsystemCode: Text(Value.SubsystemCode)
                                  }
                              )
                          );

                          ClearCollect(
                              colPHR_Subsystems,
                              ForAll(
                                  Sequence(CountRows(colPHR_Subsystems_Base)) As seq,
                                  {
                                      RowNo: seq.Value,
                                      SubsystemCode:
                                          Index(
                                              colPHR_Subsystems_Base,
                                              seq.Value
                                          ).SubsystemCode
                                  }
                              )
                          );

                          ClearCollect(
                              colSubsystems,
                              SortByColumns(
                                  ForAll(
                                      colPHR_Subsystems,
                                      {
                                          Code: Text(SubsystemCode)
                                      }
                                  ),
                                  "Code",
                                  SortOrder.Ascending
                              )
                          );

                          ClearCollect(
                              colPHR_Metrics,
                              ForAll(
                                  Table(obj.metrics),
                                  {
                                      SubsystemCode: Text(Value.SubsystemCode),
                                      MetricKey: Text(Value.MetricKey),
                                      MetricValue:
                                          If(
                                              IsBlank(Text(Value.MetricValue)) || Text(Value.MetricValue) = "null",
                                              0,
                                              Value(Text(Value.MetricValue))
                                          )
                                  }
                              )
                          );

                          ClearCollect(
                              colPHR_Headers,
                              ForAll(
                                  Table(obj.headers),
                                  {
                                      TemplateId:
                                          If(
                                              IsBlank(Text(Value.TemplateId)) || Text(Value.TemplateId) = "null",
                                              Blank(),
                                              Value(Text(Value.TemplateId))
                                          ),

                                      L1NodeId: Text(Value.L1NodeId),
                                      L1Label: Text(Value.L1Label),
                                      L1SortOrder:
                                          If(
                                              IsBlank(Text(Value.L1SortOrder)) || Text(Value.L1SortOrder) = "null",
                                              0,
                                              Value(Text(Value.L1SortOrder))
                                          ),

                                      L2NodeId: Text(Value.L2NodeId),
                                      L2Label: Text(Value.L2Label),
                                      L2SortOrder:
                                          If(
                                              IsBlank(Text(Value.L2SortOrder)) || Text(Value.L2SortOrder) = "null",
                                              0,
                                              Value(Text(Value.L2SortOrder))
                                          ),

                                      L3NodeId: Text(Value.L3NodeId),
                                      L3Label: Text(Value.L3Label),
                                      L3SortOrder:
                                          If(
                                              IsBlank(Text(Value.L3SortOrder)) || Text(Value.L3SortOrder) = "null",
                                              0,
                                              Value(Text(Value.L3SortOrder))
                                          ),

                                      MetricKey: Text(Value.MetricKey),
                                      MetricSqlKey: Text(Value.MetricSqlKey),
                                      MetricLabel: Text(Value.MetricLabel),
                                      MetricSortOrder:
                                          If(
                                              IsBlank(Text(Value.MetricSortOrder)) || Text(Value.MetricSortOrder) = "null",
                                              0,
                                              Value(Text(Value.MetricSortOrder))
                                          )
                                  }
                              )
                          );

                          Set(
                              varPHR_TotalCount,
                              If(
                                  IsBlank(Text(obj.totalCount)) || Text(obj.totalCount) = "null",
                                  CountRows(colPHR_Subsystems),
                                  Value(Text(obj.totalCount))
                              )
                          );

                          Set(
                              varPHR_LastRefresh,
                              If(
                                  !IsBlank(Text(obj.generatedOn)) && Text(obj.generatedOn) <> "null",
                                  DateTimeValue(Text(obj.generatedOn)),
                                  Blank()
                              )
                          );

                          Set(varPHR_DebugGeneratedOn, Text(obj.generatedOn))
                      )
                  ),

                  Set(varPHR_LastErrorMessage, FirstError.Message);
                  Set(varOverviewNoConfig, true);
                  Set(varOverviewNoData, true);
                  Set(varProjectHasPHRData, false);

                  Clear(colPHR_Subsystems);
                  Clear(colPHR_Metrics);
                  Clear(colPHR_Headers)
              );

              If(
                  IsBlank(varPHR_LastErrorMessage) &&
                  CountRows(colPHR_Subsystems) > 0 &&
                  CountRows(colPHR_Headers) > 0,

                  ClearCollect(
                      colPHR_HeaderL4,
                      SortByColumns(
                          colPHR_Headers,
                          "L1SortOrder", SortOrder.Ascending,
                          "L1Label", SortOrder.Ascending,
                          "L2SortOrder", SortOrder.Ascending,
                          "L2Label", SortOrder.Ascending,
                          "L3SortOrder", SortOrder.Ascending,
                          "L3Label", SortOrder.Ascending,
                          "MetricSortOrder", SortOrder.Ascending,
                          "MetricKey", SortOrder.Ascending
                      )
                  );

                  ClearCollect(
                      colPHR_HeaderL4Indexed,
                      ForAll(
                          Sequence(CountRows(colPHR_HeaderL4)) As seq,
                          Patch(
                              Index(colPHR_HeaderL4, seq.Value),
                              {
                                  ColIndex: seq.Value,
                                  StartX: (seq.Value - 1) * varPHR_ColW,
                                  WidthPx: varPHR_ColW
                              }
                          )
                      )
                  );

                  ClearCollect(
                      colPHR_HeaderL3Base,
                      SortByColumns(
                          AddColumns(
                              GroupBy(
                                  colPHR_HeaderL4Indexed,
                                  TemplateId,
                                  L1NodeId,
                                  L1Label,
                                  L1SortOrder,
                                  L2NodeId,
                                  L2Label,
                                  L2SortOrder,
                                  L3NodeId,
                                  L3Label,
                                  L3SortOrder,
                                  Rows
                              ),
                              StartCol, Min(Rows, ColIndex),
                              EndCol, Max(Rows, ColIndex),
                              ColCount, CountRows(Rows),
                              StartX, (Min(Rows, ColIndex) - 1) * varPHR_ColW,
                              WidthPx, CountRows(Rows) * varPHR_ColW
                          ),
                          "L1SortOrder", SortOrder.Ascending,
                          "L1Label", SortOrder.Ascending,
                          "L2SortOrder", SortOrder.Ascending,
                          "L2Label", SortOrder.Ascending,
                          "L3SortOrder", SortOrder.Ascending,
                          "L3Label", SortOrder.Ascending
                      )
                  );

                  ClearCollect(
                      colPHR_HeaderL2Base,
                      SortByColumns(
                          AddColumns(
                              GroupBy(
                                  colPHR_HeaderL4Indexed,
                                  TemplateId,
                                  L1NodeId,
                                  L1Label,
                                  L1SortOrder,
                                  L2NodeId,
                                  L2Label,
                                  L2SortOrder,
                                  Rows
                              ),
                              StartCol, Min(Rows, ColIndex),
                              EndCol, Max(Rows, ColIndex),
                              ColCount, CountRows(Rows),
                              StartX, (Min(Rows, ColIndex) - 1) * varPHR_ColW,
                              WidthPx, CountRows(Rows) * varPHR_ColW
                          ),
                          "L1SortOrder", SortOrder.Ascending,
                          "L1Label", SortOrder.Ascending,
                          "L2SortOrder", SortOrder.Ascending,
                          "L2Label", SortOrder.Ascending
                      )
                  );

                  ClearCollect(
                      colPHR_HeaderL1Base,
                      SortByColumns(
                          AddColumns(
                              GroupBy(
                                  colPHR_HeaderL4Indexed,
                                  TemplateId,
                                  L1NodeId,
                                  L1Label,
                                  L1SortOrder,
                                  Rows
                              ),
                              StartCol, Min(Rows, ColIndex),
                              EndCol, Max(Rows, ColIndex),
                              ColCount, CountRows(Rows),
                              StartX, (Min(Rows, ColIndex) - 1) * varPHR_ColW,
                              WidthPx, CountRows(Rows) * varPHR_ColW
                          ),
                          "L1SortOrder", SortOrder.Ascending,
                          "L1Label", SortOrder.Ascending
                      )
                  );

                  ClearCollect(
                      colPHR_TabsL1,
                      AddColumns(
                          SortByColumns(
                              colPHR_HeaderL1Base,
                              "L1SortOrder", SortOrder.Ascending,
                              "L1Label", SortOrder.Ascending
                          ),
                          IsSelected, false
                      )
                  );

                  If(
                      CountRows(colPHR_TabsL1) > 0,
                      Set(varPHR_SelectedL1NodeId, First(colPHR_TabsL1).L1NodeId);
                      Set(varPHR_SelectedL1Label, First(colPHR_TabsL1).L1Label);
                      Set(varPHR_SelectedTemplateId, First(colPHR_TabsL1).TemplateId)
                  );

                  Set(varPHR_DataColsWidth, CountRows(colPHR_HeaderL4Indexed) * varPHR_ColW);
                  Set(varPHR_TotalGridWidth, varPHR_SubsysW + varPHR_ActionsW + varPHR_DataColsWidth);

                  If(
                      !IsBlank(varPHR_SelectedL1NodeId),
                      Select(btnPHR_RebuildActiveTab)
                  );

                  Set(varProjectHasPHRData, true);
                  Set(varOverviewNoConfig, false);
                  Set(varOverviewNoData, false);
                  Set(varPHR_OverviewLoaded, true),

                  If(
                      IsBlank(varPHR_LastErrorMessage),

                      Set(varProjectHasPHRData, false);
                      Set(varOverviewNoData, true);

                      If(
                          CountRows(colPHR_Headers) = 0,
                          Set(varOverviewNoConfig, true),
                          Set(varOverviewNoConfig, false)
                      )
                  )
              );

              Set(varPHR_LoadMode, "");

              Set(varPHR_IsLoading, false);
              Set(varPHR_IsRendering, false);
              Set(varOps_IsLoading, false);

              Set(varGlobalLoading, false);
              Set(varGlobalLoadingMsg, "");
              Set(varGlobalLoadingSubMsg, "");
              Set(varGlobalLoadingScope, "");
            Visible: =false
            X: =40
            Y: =40
      - btnPHR_RefreshOverview:
          Control: ModernButton@1.0.0
          Properties:
            OnSelect: |-
              =

              If(
                  IsBlank(varProjectId) || !IsNumeric(Text(varProjectId)),
                  Notify("Select a valid project first.", NotificationType.Warning);
                  Exit()
              );

              If(
                  varPHR_IsLoading || varOps_IsLoading,
                  Notify("Overview is already loading.", NotificationType.Information);
                  Exit()
              );

              Set(varPHR_LoadMode, "REFRESH");

              Select(btnPHR_GenerateSnapshot);

              Set(varPHR_Page, 1);

              Select(btnPHR_LoadSnapshot);
            Visible: =false
            X: =80
            Y: =80
      - tmrPHR_RebuildTab:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =varPHR_StartTabTimer
            BorderColor: =RGBA(0, 120, 212, 1)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(242, 242, 241, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Duration: =100
            Fill: =RGBA(0, 120, 212, 1)
            Font: =Font.'Segoe UI'
            HoverBorderColor: =RGBA(16, 110, 190, 1)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(16, 110, 190, 1)
            OnTimerEnd: |-
              =



              Set(varPHR_StartTabTimer, false);

              Set(varPHR_SelectedL1NodeId, varPHR_PendingL1NodeId);
              Set(varPHR_SelectedL1Label, varPHR_PendingL1Label);

              Set(
                  varPHR_SelectedTemplateId,
                  LookUp(
                      colPHR_TabsL1,
                      Text(L1NodeId) = Text(varPHR_PendingL1NodeId),
                      TemplateId
                  )
              );

              Select(btnPHR_RebuildActiveTab);

              Set(varPHR_TabSwitching, false);
              Set(varPHR_TabSwitchMsg, "");
            PressedBorderColor: =RGBA(16, 110, 190, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(16, 110, 190, 1)
            Visible: =false
            X: =40
            Y: =40
      - conGlobalOverlay_Overview:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(15, 23, 42, 0.32)
            Height: =App.Height
            Visible: |-
              =
              varGlobalLoading &&
              varGlobalLoadingScope = "OVERVIEW"
            Width: =App.Width
          Children:
            - conGlobalLoadingCard_1:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ColorValue("#E2E8F0")
                  BorderThickness: =1
                  DropShadow: =DropShadow.Semilight
                  Fill: =ColorValue("#FFFFFF")
                  Height: =136
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Width: =340
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - Spinner3_1:
                      Control: Spinner@1.4.6
                      Properties:
                        Height: =32
                        SpinnerColor: =varTheme_PulseBlue
                        Width: =32
                        X: =24
                        Y: =86
                  - Text31_1:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =varTheme_TextMuted
                        Size: =11
                        Text: |-
                          =
                          Coalesce(varGlobalLoadingSubMsg, "")
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =52
                  - Text36_1:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =varTheme_Text
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =14
                        Text: |-
                          =
                          Coalesce(varGlobalLoadingMsg, "Loading...")
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =24
                  - Rectangle2_1:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        DisabledFill: =RGBA(161, 159, 157, 1)
                        Fill: =ColorValue("#E2E8F0")
                        FocusedBorderThickness: =4
                        Height: =4
                        HoverFill: =RGBA(0, 120, 212, 1)
                        PressedFill: =RGBA(0, 120, 212, 1)
                        Width: =Parent.Width - 88
                        X: =88
                        Y: =98
                  - Rectangle6_1:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        DisabledFill: =RGBA(161, 159, 157, 1)
                        Fill: =varTheme_PulseBlue
                        FocusedBorderThickness: =4
                        Height: =4
                        HoverFill: =RGBA(0, 120, 212, 1)
                        PressedFill: =RGBA(0, 120, 212, 1)
                        Width: =90
                        X: =64
                        Y: =98
