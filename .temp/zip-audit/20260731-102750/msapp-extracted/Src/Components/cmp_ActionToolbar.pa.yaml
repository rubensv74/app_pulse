ComponentDefinitions:
  cmp_ActionToolbar:
    DefinitionType: CanvasComponent
    CustomProperties:
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Main accent color
        DataType: Color
        Default: =ColorValue("#1677FF")
      BackgroundColor:
        PropertyKind: Input
        DisplayName: BackgroundColor
        Description: Toolbar background color
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        Description: Toolbar border color
        DataType: Color
        Default: =ColorValue("#E2E8F0")
      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Muted text color
        DataType: Color
        Default: =ColorValue("#64748B")
      OnExport:
        PropertyKind: Event
        DisplayName: OnExport
        Description: Executes when export is selected
        ReturnType: None
        Default: =
      OnMore:
        PropertyKind: Event
        DisplayName: OnMore
        Description: Executes when more is selected
        ReturnType: None
        Default: =
      OnPrimary:
        PropertyKind: Event
        DisplayName: OnPrimary
        Description: Executes when primary action is selected
        ReturnType: None
        Default: =
      OnRefresh:
        PropertyKind: Event
        DisplayName: OnRefresh
        Description: Executes when refresh is selected
        ReturnType: None
        Default: =
      OnSecondary:
        PropertyKind: Event
        DisplayName: OnSecondary
        Description: Executes when secondary action is selected
        ReturnType: None
        Default: =
      OnSettings:
        PropertyKind: Event
        DisplayName: OnSettings
        Description: Executes when settings is selected
        ReturnType: None
        Default: =
      PrimaryText:
        PropertyKind: Input
        DisplayName: PrimaryText
        Description: Primary action text
        DataType: Text
        Default: ="Apply"
      SecondaryText:
        PropertyKind: Input
        DisplayName: SecondaryText
        Description: Secondary action text
        DataType: Text
        Default: ="Cancel"
      ShowExport:
        PropertyKind: Input
        DisplayName: ShowExport
        Description: Shows export icon
        DataType: Boolean
        Default: =true
      ShowMore:
        PropertyKind: Input
        DisplayName: ShowMore
        Description: Shows more icon
        DataType: Boolean
        Default: =true
      ShowPrimary:
        PropertyKind: Input
        DisplayName: ShowPrimary
        Description: Shows primary action
        DataType: Boolean
        Default: =true
      ShowRefresh:
        PropertyKind: Input
        DisplayName: ShowRefresh
        Description: Shows refresh icon
        DataType: Boolean
        Default: =true
      ShowSecondary:
        PropertyKind: Input
        DisplayName: ShowSecondary
        Description: Shows secondary action
        DataType: Boolean
        Default: =true
      ShowSettings:
        PropertyKind: Input
        DisplayName: ShowSettings
        Description: Shows settings icon
        DataType: Boolean
        Default: =true
      ShowTitle:
        PropertyKind: Input
        DisplayName: ShowTitle
        Description: Shows toolbar title
        DataType: Boolean
        Default: =true
      SurfaceAltColor:
        PropertyKind: Input
        DisplayName: SurfaceAltColor
        Description: Soft surface color
        DataType: Color
        Default: =ColorValue("#F8FAFC")
      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Main text color
        DataType: Color
        Default: =ColorValue("#0F172A")
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Optional toolbar title
        DataType: Text
        Default: ="Actions"
    Properties:
      Height: =56
      Width: =720
    Children:
      - conAT_Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =cmp_ActionToolbar.BorderColor
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =cmp_ActionToolbar.BackgroundColor
            Height: =Parent.Height
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Width: =Parent.Width
          Children:
            - lblAT_Title:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmp_ActionToolbar.TextColor
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Size: =12
                  Text: =cmp_ActionToolbar.Title
                  Visible: =cmp_ActionToolbar.ShowTitle
                  Width: =220
                  X: =16
                  Y: =18
            - icoAT_Refresh:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =cmp_ActionToolbar.MutedTextColor
                  DisabledBorderColor: =RGBA(245, 245, 245, 1)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =18
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =cmp_ActionToolbar.AccentColor
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Icon: =Icon.Reload
                  OnSelect: =cmp_ActionToolbar.OnRefresh()
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =cmp_ActionToolbar.AccentColor
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Visible: =cmp_ActionToolbar.ShowRefresh
                  Width: =18
                  X: =Parent.Width - 374
                  Y: =19
            - icoAT_Export:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =cmp_ActionToolbar.MutedTextColor
                  DisabledBorderColor: =RGBA(245, 245, 245, 1)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =18
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =cmp_ActionToolbar.AccentColor
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Icon: =Icon.Download
                  OnSelect: =cmp_ActionToolbar.OnExport()
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =cmp_ActionToolbar.AccentColor
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Visible: =cmp_ActionToolbar.ShowExport
                  Width: =18
                  X: =Parent.Width - 338
                  Y: =19
            - icoAT_Settings:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =cmp_ActionToolbar.MutedTextColor
                  DisabledBorderColor: =RGBA(245, 245, 245, 1)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =18
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =cmp_ActionToolbar.AccentColor
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Icon: =Icon.Settings
                  OnSelect: =cmp_ActionToolbar.OnSettings()
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =cmp_ActionToolbar.AccentColor
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Visible: =cmp_ActionToolbar.ShowSettings
                  Width: =18
                  X: =Parent.Width - 302
                  Y: =19
            - icoAT_More:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =cmp_ActionToolbar.MutedTextColor
                  DisabledBorderColor: =RGBA(245, 245, 245, 1)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =18
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =cmp_ActionToolbar.AccentColor
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Icon: =Icon.More
                  OnSelect: =cmp_ActionToolbar.OnMore()
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =cmp_ActionToolbar.AccentColor
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Visible: =cmp_ActionToolbar.ShowMore
                  Width: =18
                  X: =Parent.Width - 266
                  Y: =19
            - btnAT_Secondary:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =cmp_ActionToolbar.BorderColor
                  BorderThickness: =1
                  Color: =cmp_ActionToolbar.TextColor
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  DisabledFill: =RGBA(242, 242, 241, 0)
                  Fill: =cmp_ActionToolbar.BackgroundColor
                  Font: =Font.'Segoe UI'
                  Height: =36
                  HoverBorderColor: =cmp_ActionToolbar.BorderColor
                  HoverColor: =cmp_ActionToolbar.TextColor
                  HoverFill: =cmp_ActionToolbar.SurfaceAltColor
                  OnSelect: =cmp_ActionToolbar.OnSecondary()
                  PressedBorderColor: =cmp_ActionToolbar.BorderColor
                  PressedColor: =cmp_ActionToolbar.TextColor
                  PressedFill: =ColorValue("#F1F5F9")
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =11
                  Text: =cmp_ActionToolbar.SecondaryText
                  Visible: =cmp_ActionToolbar.ShowSecondary
                  Width: =104
                  X: =Parent.Width - 230
                  Y: =10
            - btnAT_Primary:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =cmp_ActionToolbar.AccentColor
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  DisabledFill: =RGBA(242, 242, 241, 0)
                  Fill: =cmp_ActionToolbar.AccentColor
                  Font: =Font.'Segoe UI'
                  Height: =36
                  HoverBorderColor: =cmp_ActionToolbar.AccentColor
                  HoverColor: =Color.White
                  HoverFill: =cmp_ActionToolbar.AccentColor
                  OnSelect: =cmp_ActionToolbar.OnPrimary()
                  PressedBorderColor: =cmp_ActionToolbar.AccentColor
                  PressedColor: =Color.White
                  PressedFill: =cmp_ActionToolbar.AccentColor
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =11
                  Text: =cmp_ActionToolbar.PrimaryText
                  Visible: =cmp_ActionToolbar.ShowPrimary
                  Width: =104
                  X: =Parent.Width - 116
                  Y: =10
