ComponentDefinitions:
  cmp_DynamicFilters:
    DefinitionType: CanvasComponent
    CustomProperties:
      ChangedFieldKey:
        PropertyKind: Output
        DisplayName: 'ChangedFieldKey '
        Description: A custom property
        DataType: Text
      ChangedFieldType:
        PropertyKind: Output
        DisplayName: 'ChangedFieldType '
        Description: A custom property
        DataType: Text
      ChangedValueBool:
        PropertyKind: Output
        DisplayName: 'ChangedValueBool '
        Description: A custom property
        DataType: Boolean
      ChangedValueDate:
        PropertyKind: Output
        DisplayName: ChangedValueDate
        Description: A custom property
        DataType: DateAndTime
      ChangedValueJson:
        PropertyKind: Output
        DisplayName: ChangedValueJson
        Description: A custom property
        DataType: Text
      ChangedValueNumber:
        PropertyKind: Output
        DisplayName: 'ChangedValueNumber '
        Description: A custom property
        DataType: Number
      ChangedValueSlot:
        PropertyKind: Output
        DisplayName: ChangedValueSlot
        Description: A custom property
        DataType: Text
      ChangedValueText:
        PropertyKind: Output
        DisplayName: ChangedValueText
        Description: A custom property
        DataType: Text
      Filters:
        PropertyKind: Input
        DisplayName: Filters
        Description: A custom property
        DataType: Table
        Default: |-
          =
          Table(
              {
                  FieldKey: "",
                  Label: "",
                  FieldType: "",
                  FilterMode: "",
                  OptionsJson: "",
                  FilterOrder: 0,
                  ShowInQuickFilters: false
              }
          )
      FiltersJson:
        PropertyKind: Output
        DisplayName: FiltersJson
        Description: A custom property
        DataType: Text
      OnApply:
        PropertyKind: Event
        DisplayName: OnApply
        Description: A custom property
        ReturnType: None
        Default: =false
      OnClear:
        PropertyKind: Event
        DisplayName: OnClear
        Description: A custom property
        ReturnType: None
        Default: =false
      OnValueChanged:
        PropertyKind: Event
        DisplayName: OnValueChanged
        Description: A custom property
        ReturnType: None
        Default: =false
      SelectedValues:
        PropertyKind: Output
        DisplayName: SelectedValues
        Description: A custom property
        DataType: Table
      ShowApplyButton:
        PropertyKind: Input
        DisplayName: ShowApplyButton
        Description: A custom property
        DataType: Boolean
        Default: =true
      ShowClearButton:
        PropertyKind: Input
        DisplayName: ShowClearButton
        Description: A custom property
        DataType: Boolean
        Default: =true
      Subtitle:
        PropertyKind: Input
        DisplayName: Subtitle
        Description: A custom property
        DataType: Text
        Default: ="Dynamic filters configured for this project"
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: A custom property
        DataType: Text
        Default: ="Project filters"
      Values:
        PropertyKind: Input
        DisplayName: Values
        Description: A custom property
        DataType: Table
        Default: |-
          =
          Table(
              {
                  FieldKey: "__schema__",
                  Label: "",
                  FieldType: "",
                  FilterMode: "",
                  ValueText: "",
                  ValueNumberFrom: 0,
                  ValueNumberTo: 0,
                  ValueDateFrom: Date(1900,1,1),
                  ValueDateTo: Date(1900,1,1),
                  ValueBool: false,
                  ValueJson: ""
              }
          )
    Properties:
      ChangedFieldKey: =varDF_ChangedFieldKey
      ChangedFieldType: =varDF_ChangedFieldType
      ChangedValueBool: =varDF_ChangedValueBool
      ChangedValueDate: =varDF_ChangedValueDate
      ChangedValueJson: =varDF_ChangedValueJson
      ChangedValueNumber: =varDF_ChangedValueNumber
      ChangedValueSlot: =varDF_ChangedValueSlot
      ChangedValueText: =varDF_ChangedValueText
      FiltersJson: ="[]"
      Height: =App.Height
      OnReset: |-
        =

        Set(varDF_ChangedFieldKey, "");
        Set(varDF_ChangedFieldType, "");
        Set(varDF_ChangedValueSlot, "");
        Set(varDF_ChangedValueText, "");
        Set(varDF_ChangedValueNumber, 0);
        Set(varDF_ChangedValueDate, DateTime(1900,1,1,0,0,0));
        Set(varDF_ChangedValueBool, false);
        Set(varDF_ChangedValueJson, "")
      SelectedValues: =Table()
      Width: =420
    Children:
      - DFconRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =Color.White
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            PaddingBottom: =24
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =24
            Width: =Parent.Width
          Children:
            - DFconHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =70
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Width: =Parent.Width
                Children:
                  - Text3:
                      Control: ModernText@1.0.0
                      Properties:
                        Color: =ColorValue("#0F172A")
                        FillPortions: =1
                        FontWeight: =FontWeight.Bold
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =20
                        Text: =cmp_DynamicFilters.Title
                  - Text5:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =ColorValue("#64748B")
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =12
                        Text: =cmp_DynamicFilters.Subtitle
                        Width: =300
            - DFconBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =Parent.Height - DFconHeader.Height - DFconFooter.Height - 24
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - galFilters:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_OneTextOneImageVariant_ver5.0
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =RGBA(245, 245, 245, 1)
                        Height: =Parent.Height
                        Items: |-
                          =Filter(
                              cmp_DynamicFilters.Filters,
                              !IsBlank(FieldKey)
                          )
                        TemplatePadding: =4
                        TemplateSize: =140
                        Width: =Parent.Width
                      Children:
                        - conFilterCard:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =ColorValue("#E2E8F0")
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorValue("#FFFFFF")
                              Height: =130
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              PaddingBottom: =8
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =8
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Width: =Parent.TemplateWidth
                            Children:
                              - lblFilterLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#0F172A")
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =13
                                    Text: =ThisItem.Label
                                    Width: =Parent.Width - 24
                                    X: =12
                                    Y: =8
                              - lblFilterMeta:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =ColorValue("#64748B")
                                    Height: =10
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Text: =ThisItem.FieldType & " • " & ThisItem.FilterMode
                                    Visible: =false
                                    Width: =Parent.Width - 24
                                    X: =12
                                    Y: =30
                              - txtFilterText:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    BorderColor: =RGBA(245, 245, 245, 1)
                                    Color: =RGBA(50, 49, 48, 1)
                                    Default: |-
                                      =

                                      Coalesce(
                                          LookUp(
                                              cmp_DynamicFilters.Values,
                                              FieldKey = ThisItem.FieldKey
                                          ).ValueText,
                                          ""
                                      )
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    DisabledFill: =RGBA(242, 242, 241, 0)
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    HintText: ="Search " & ThisItem.Label
                                    HoverBorderColor: =RGBA(16, 110, 190, 1)
                                    HoverColor: =RGBA(50, 49, 48, 1)
                                    HoverFill: =RGBA(255, 255, 255, 1)
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnChange: |-
                                      =

                                      Set(varDF_ChangedFieldKey, ThisItem.FieldKey);
                                      Set(varDF_ChangedFieldType, ThisItem.FieldType);
                                      Set(varDF_ChangedValueSlot, "ValueText");
                                      Set(varDF_ChangedValueText, Self.Text);

                                      cmp_DynamicFilters.OnValueChanged()
                                    PressedBorderColor: =RGBA(0, 120, 212, 1)
                                    PressedColor: =RGBA(50, 49, 48, 1)
                                    PressedFill: =RGBA(255, 255, 255, 1)
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Visible: =ThisItem.FieldType = "Text" || ThisItem.FieldType = "Json"
                                    Width: =Parent.Width - 24
                                    X: =12
                                    Y: =38
                              - cmbFilterChoice:
                                  Control: ModernCombobox@1.1.1
                                  Properties:
                                    DefaultSelectedItems: |-
                                      =

                                      If(
                                          Lower(Trim(ThisItem.FieldType)) = "choice",
                                          If(
                                              IsBlank(
                                                  LookUp(
                                                      cmp_DynamicFilters.Values,
                                                      FieldKey = ThisItem.FieldKey
                                                  ).ValueText
                                              ),
                                              Blank(),
                                              Table(
                                                  {
                                                      Value:
                                                          LookUp(
                                                              cmp_DynamicFilters.Values,
                                                              FieldKey = ThisItem.FieldKey
                                                          ).ValueText
                                                  }
                                              )
                                          ),
                                          If(
                                              Lower(Trim(ThisItem.FieldType)) = "multichoice",
                                              ForAll(
                                                  Table(
                                                      ParseJSON(
                                                          Coalesce(
                                                              LookUp(
                                                                  cmp_DynamicFilters.Values,
                                                                  FieldKey = ThisItem.FieldKey
                                                              ).ValueJson,
                                                              "[]"
                                                          )
                                                      )
                                                  ),
                                                  {Value: Text(Value)}
                                              ),
                                              Blank()
                                          )
                                      )
                                    Height: =36
                                    ItemDisplayText: =ThisItem.Value
                                    Items: |-
                                      =

                                      ForAll(
                                          Table(
                                              ParseJSON(
                                                  If(
                                                      IsBlank(Trim(Coalesce(ThisItem.OptionsJson, ""))),
                                                      "[]",
                                                      ThisItem.OptionsJson
                                                  )
                                              )
                                          ),
                                          {Value: Text(Value)}
                                      )
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnChange: |-
                                      =
                                      Set(varDF_ChangedFieldKey, ThisItem.FieldKey);
                                      Set(varDF_ChangedFieldType, ThisItem.FieldType);

                                      If(
                                          Lower(Trim(ThisItem.FieldType)) = "choice",

                                          Set(varDF_ChangedValueSlot, "ValueText");
                                          Set(varDF_ChangedValueText, Coalesce(Self.Selected.Value, "")),

                                          Set(varDF_ChangedValueSlot, "ValueJson");
                                          Set(
                                              varDF_ChangedValueJson,
                                              "[" &
                                              Concat(
                                                  Self.SelectedItems,
                                                  """" & Substitute(Value, """", "\""") & """",
                                                  ","
                                              ) &
                                              "]"
                                          )
                                      );

                                      cmp_DynamicFilters.OnValueChanged()
                                    SelectMultiple: =Lower(Trim(ThisItem.FieldType)) = "multichoice"
                                    Visible: =ThisItem.FieldType = "Choice" || ThisItem.FieldType = "MultiChoice"
                                    Width: =Parent.Width - 24
                                    X: =12
                                    Y: =38
                              - dpFilterDateFrom:
                                  Control: ModernDatePicker@1.0.1
                                  Properties:
                                    DefaultDate: |-
                                      =

                                      If(
                                          LookUp(
                                              cmp_DynamicFilters.Values,
                                              FieldKey = ThisItem.FieldKey
                                          ).ValueDateFrom = Date(1900,1,1),
                                          Blank(),
                                          LookUp(
                                              cmp_DynamicFilters.Values,
                                              FieldKey = ThisItem.FieldKey
                                          ).ValueDateFrom
                                      )
                                    Height: =36
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnChange: |-
                                      =

                                      Set(varDF_ChangedFieldKey, ThisItem.FieldKey);
                                      Set(varDF_ChangedFieldType, ThisItem.FieldType);
                                      Set(varDF_ChangedValueSlot, "ValueDateFrom");
                                      Set(varDF_ChangedValueDate, Coalesce(Self.SelectedDate, Date(1900,1,1)));

                                      cmp_DynamicFilters.OnValueChanged()
                                    Visible: = ThisItem.FieldType = "Date"
                                    Width: =Parent.Width - 24
                                    X: =12
                                    Y: =38
                              - dpFilterDateTo:
                                  Control: ModernDatePicker@1.0.1
                                  Properties:
                                    DefaultDate: |-
                                      =


                                      If(
                                          LookUp(
                                              cmp_DynamicFilters.Values,
                                              FieldKey = ThisItem.FieldKey
                                          ).ValueDateTo = Date(1900,1,1),
                                          Blank(),
                                          LookUp(
                                              cmp_DynamicFilters.Values,
                                              FieldKey = ThisItem.FieldKey
                                          ).ValueDateTo
                                      )
                                    Height: =36
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnChange: |-
                                      =

                                      Set(varDF_ChangedFieldKey, ThisItem.FieldKey);
                                      Set(varDF_ChangedFieldType, ThisItem.FieldType);
                                      Set(varDF_ChangedValueSlot, "ValueDateTo");
                                      Set(varDF_ChangedValueDate, Coalesce(Self.SelectedDate, Date(1900,1,1)));

                                      cmp_DynamicFilters.OnValueChanged()
                                    Visible: =ThisItem.FieldType = "Date" && ThisItem.FilterMode = "Between"
                                    Width: =Parent.Width - 24
                                    X: =12
                                    Y: =78
                              - numFilterFrom:
                                  Control: ModernNumberInput@1.1.1
                                  Properties:
                                    Default: |-
                                      =


                                      If(
                                          LookUp(
                                              cmp_DynamicFilters.Values,
                                              FieldKey = ThisItem.FieldKey
                                          ).ValueNumberFrom = 0,
                                          Blank(),
                                          LookUp(
                                              cmp_DynamicFilters.Values,
                                              FieldKey = ThisItem.FieldKey
                                          ).ValueNumberFrom
                                      )
                                    Height: =36
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnChange: |-
                                      =Set(varDF_ChangedFieldKey, ThisItem.FieldKey);
                                      Set(varDF_ChangedFieldType, ThisItem.FieldType);

                                      If(
                                          ThisItem.FilterMode = "Between",
                                          Set(varDF_ChangedValueSlot, "ValueNumberFrom");
                                          Set(varDF_ChangedValueNumber, Coalesce(Value(Self.Value), 0)),

                                          Set(varDF_ChangedValueSlot, "ValueNumberFrom");
                                          Set(varDF_ChangedValueNumber, Coalesce(Value(Self.Value), 0));
                                          cmp_DynamicFilters.OnValueChanged();

                                          Set(varDF_ChangedValueSlot, "ValueNumberTo");
                                          Set(varDF_ChangedValueNumber, Coalesce(Value(Self.Value), 0))
                                      );

                                      cmp_DynamicFilters.OnValueChanged()
                                    Visible: =ThisItem.FieldType = "Number"
                                    Width: =Parent.Width - 24
                                    X: =12
                                    Y: =38
                              - numFilterTo:
                                  Control: ModernNumberInput@1.1.1
                                  Properties:
                                    Default: |-
                                      =



                                      If(
                                          LookUp(
                                              cmp_DynamicFilters.Values,
                                              FieldKey = ThisItem.FieldKey
                                          ).ValueNumberTo = 0,
                                          Blank(),
                                          LookUp(
                                              cmp_DynamicFilters.Values,
                                              FieldKey = ThisItem.FieldKey
                                          ).ValueNumberTo
                                      )
                                    Height: =36
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnChange: |-
                                      =

                                      Set(varDF_ChangedFieldKey, ThisItem.FieldKey);
                                      Set(varDF_ChangedFieldType, ThisItem.FieldType);
                                      Set(varDF_ChangedValueSlot, "ValueNumberTo");
                                      Set(varDF_ChangedValueNumber, Coalesce(Value(Self.Value), 0));

                                      cmp_DynamicFilters.OnValueChanged()
                                    Visible: =ThisItem.FieldType = "Number" && ThisItem.FilterMode = "Between"
                                    Width: =Parent.Width - 24
                                    X: =12
                                    Y: =78
                              - tglFilterBool:
                                  Control: Toggle@1.1.5
                                  Properties:
                                    Checked: |-
                                      =


                                      Coalesce(
                                          LookUp(
                                              cmp_DynamicFilters.Values,
                                              FieldKey = ThisItem.FieldKey
                                          ).ValueBool,
                                          false
                                      )
                                    Height: =36
                                    Label: = "Yes / No"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnCheck: |-
                                      =


                                      Set(varDF_ChangedFieldKey, ThisItem.FieldKey);
                                      Set(varDF_ChangedFieldType, ThisItem.FieldType);
                                      Set(varDF_ChangedValueSlot, "ValueBool");
                                      Set(varDF_ChangedValueBool, true);

                                      cmp_DynamicFilters.OnValueChanged()
                                    OnUncheck: |-
                                      =


                                      Set(varDF_ChangedFieldKey, ThisItem.FieldKey);
                                      Set(varDF_ChangedFieldType, ThisItem.FieldType);
                                      Set(varDF_ChangedValueSlot, "ValueBool");
                                      Set(varDF_ChangedValueBool, false);

                                      cmp_DynamicFilters.OnValueChanged()
                                    Visible: =ThisItem.FieldType = "YesNo"
                                    Width: = Parent.Width - 24
                                    X: =12
                                    Y: =38
            - DFconFooter:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - btnClearAll:
                      Control: ModernButton@1.0.0
                      Properties:
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =


                          Set(varDF_ChangedFieldKey, "");
                          Set(varDF_ChangedFieldType, "");
                          Set(varDF_ChangedValueSlot, "ClearAll");
                          Set(varDF_ChangedValueText, "");
                          Set(varDF_ChangedValueNumber, 0);
                          Set(varDF_ChangedValueDate, DateTime(1900,1,1,0,0,0));
                          Set(varDF_ChangedValueBool, false);
                          Set(varDF_ChangedValueJson, "");

                          cmp_DynamicFilters.OnValueChanged();

                          cmp_DynamicFilters.OnClear()
                        Text: ="Clear all"
                        Visible: =cmp_DynamicFilters.ShowClearButton
                        Width: =120
                  - btnApplyFilters:
                      Control: ModernButton@1.0.0
                      Properties:
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =

                          cmp_DynamicFilters.OnApply()
                        Text: ="Apply filters"
                        Visible: =cmp_DynamicFilters.ShowApplyButton
                        Width: =120
