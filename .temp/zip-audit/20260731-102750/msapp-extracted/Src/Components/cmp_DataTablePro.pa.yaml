            - lblDTP_State:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =If(cmp_DataTablePro.IsError, cmp_DataTablePro.DangerColor, cmp_DataTablePro.MutedTextColor)
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  Size: =13
                  Text: |-
                    =If(
                        cmp_DataTablePro.IsLoading,
                        cmp_DataTablePro.LoadingText,
                        If(
                            cmp_DataTablePro.IsError,
                            cmp_DataTablePro.ErrorText,
                            cmp_DataTablePro.EmptyText
                        )
                    )
                  Visible: =cmp_DataTablePro.IsLoading || cmp_DataTablePro.IsEmpty || cmp_DataTablePro.IsError
                  Width: =Parent.Width - 64
                  X: =32
                  Y: =(Parent.Height - 24) / 2
