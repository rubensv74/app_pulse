        Description: Sort direction
        DataType: Boolean
        Default: =true
      SortColumn:
        PropertyKind: Input
        DisplayName: SortColumn
        Description: Active sort column key Col1-Col10
        DataType: Text
        Default: =""
      State:
        PropertyKind: Input
        Description: Success, Loading, Empty, Error
        DataType: Text
        Default: ="Success"
      Subtitle:
        PropertyKind: Input
        DisplayName: Subtitle
        Description: Table subtitle
        DataType: Text
        Default: =""
      SuccessColor:
        PropertyKind: Input
        DisplayName: SuccessColor
        Description: Success color
        DataType: Color
        Default: =ColorValue("#16A34A")
      SurfaceAltColor:
        PropertyKind: Input
        DisplayName: SurfaceAltColor
        Description: Alternate row color
        DataType: Color
        Default: =ColorValue("#F8FAFC")
      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Main text color
        DataType: Color
        Default: =ColorValue("#0F172A")
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Table title
        DataType: Text
        Default: ="Data table"
      TotalPages:
        PropertyKind: Input
        DataType: Number
        Default: =1
      TotalRows:
        PropertyKind: Input
        DataType: Number
        Default: =0
      VisibleColumnWidth:
        PropertyKind: Output
        DataType: Number
      WarningColor:
        PropertyKind: Input
        DisplayName: WarningColor
        Description: Warning color
        DataType: Color
        Default: =ColorValue("#EA580C")
    Properties:
      HasSelection: =cmp_DataTablePro.SelectedCount > 0
      Height: =620
      IsEmpty: =Lower(cmp_DataTablePro.State) = "empty" || CountRows(cmp_DataTablePro.Items) = 0
      IsError: =Lower(cmp_DataTablePro.State) = "error"
      IsLoading: =Lower(cmp_DataTablePro.State) = "loading"
      OnReset: |-
        =
        Set(varDTP_SelectedId, "");
        ClearCollect(varDTP_SelectedItems, FirstN(cmp_DataTablePro.Items, 0))
      SelectedCount: =If(cmp_DataTablePro.EnableMultiSelect, CountRows(varDTP_SelectedItems), If(IsBlank(varDTP_SelectedId), 0, 1))
      SelectedId: =varDTP_SelectedId
      SelectedItem: =LookUp(cmp_DataTablePro.Items, Id = varDTP_SelectedId)
      SelectedItems: =varDTP_SelectedItems
      VisibleColumnWidth: =If(cmp_DataTablePro.ShowCol1, cmp_DataTablePro.Col1Width, 0) + If(cmp_DataTablePro.ShowCol2, cmp_DataTablePro.Col2Width, 0) + If(cmp_DataTablePro.ShowCol3, cmp_DataTablePro.Col3Width, 0) + If(cmp_DataTablePro.ShowCol4, cmp_DataTablePro.Col4Width, 0) + If(cmp_DataTablePro.ShowCol5, cmp_DataTablePro.Col5Width, 0) + If(cmp_DataTablePro.ShowCol6, cmp_DataTablePro.Col6Width, 0) + If(cmp_DataTablePro.ShowCol7, cmp_DataTablePro.Col7Width, 0) + If(cmp_DataTablePro.ShowCol8, cmp_DataTablePro.Col8Width, 0) + If(cmp_DataTablePro.ShowCol9, cmp_DataTablePro.Col9Width, 0) + If(cmp_DataTablePro.ShowCol10, cmp_DataTablePro.Col10Width, 0)
      Width: =1180
    Children:
      - conDTP_Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =cmp_DataTablePro.BorderColor
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =cmp_DataTablePro.BackgroundColor
            Height: =Parent.Height
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            RadiusTopLeft: =14
            RadiusTopRight: =14
            Width: =Parent.Width
          Children:
            - lblDTP_Title:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmp_DataTablePro.TextColor
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Size: =14
                  Text: =cmp_DataTablePro.Title
                  Visible: =cmp_DataTablePro.ShowToolbar
                  Width: =360
                  X: =16
                  Y: =14
            - lblDTP_Subtitle:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmp_DataTablePro.MutedTextColor
                  Height: =16
                  Size: =9
                  Text: =cmp_DataTablePro.Subtitle
                  Visible: =cmp_DataTablePro.ShowToolbar && !IsBlank(cmp_DataTablePro.Subtitle)
                  Width: =460
                  X: =16
                  Y: =38
            - icoDTP_Refresh:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =cmp_DataTablePro.MutedTextColor
                  DisabledBorderColor: =RGBA(245, 245, 245, 1)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =18
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =cmp_DataTablePro.AccentColor
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Icon: =Icon.Reload
                  OnSelect: =cmp_DataTablePro.OnRefresh()
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =cmp_DataTablePro.AccentColor
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Visible: =cmp_DataTablePro.ShowToolbar && cmp_DataTablePro.ShowRefresh
                  Width: =18
                  X: =Parent.Width - 74
                  Y: =22
            - icoDTP_Export:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =cmp_DataTablePro.MutedTextColor
                  DisabledBorderColor: =RGBA(245, 245, 245, 1)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =18
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =cmp_DataTablePro.AccentColor
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Icon: =Icon.Download
                  OnSelect: =cmp_DataTablePro.OnExport()
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =cmp_DataTablePro.AccentColor
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Visible: =cmp_DataTablePro.ShowToolbar && cmp_DataTablePro.ShowExport
                  Width: =18
                  X: =Parent.Width - 36
                  Y: =22
            - rectDTP_ToolbarLine:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  DisabledFill: =RGBA(161, 159, 157, 1)
                  Fill: =cmp_DataTablePro.BorderColor
                  FocusedBorderThickness: =4
                  Height: =1
                  HoverFill: =cmp_DataTablePro.BorderColor
                  PressedFill: =cmp_DataTablePro.BorderColor
                  Visible: =cmp_DataTablePro.ShowToolbar
                  Width: =Parent.Width
                  Y: =64
            - conDTP_Header:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =cmp_DataTablePro.BorderColor
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =cmp_DataTablePro.HeaderColor
                  Height: =cmp_DataTablePro.HeaderHeight
                  Visible: =cmp_DataTablePro.ShowHeader
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =If(cmp_DataTablePro.ShowToolbar, 76, 16)
                Children:
                  - lblDTP_H1:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =If(cmp_DataTablePro.SortColumn = "Col1", cmp_DataTablePro.AccentColor, cmp_DataTablePro.MutedTextColor)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =cmp_DataTablePro.HeaderHeight
                        OnSelect: =cmp_DataTablePro.OnSortCol1()
                        PaddingBottom: =0
                        PaddingLeft: =10
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10
                        Text: =cmp_DataTablePro.Col1Title & If(cmp_DataTablePro.SortColumn = "Col1", If(cmp_DataTablePro.SortAscending, " ▲", " ▼"), "")
                        VerticalAlign: =VerticalAlign.Top
                        Visible: =cmp_DataTablePro.ShowCol1
                        Width: =cmp_DataTablePro.Col1Width
                        Y: =13
                  - lblDTP_H2:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =If(cmp_DataTablePro.SortColumn = "Col2", cmp_DataTablePro.AccentColor, cmp_DataTablePro.MutedTextColor)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =cmp_DataTablePro.HeaderHeight
                        OnSelect: =cmp_DataTablePro.OnSortCol2()
                        PaddingBottom: =0
                        PaddingLeft: =10
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10
                        Text: =cmp_DataTablePro.Col2Title & If(cmp_DataTablePro.SortColumn = "Col2", If(cmp_DataTablePro.SortAscending, " ▲", " ▼"), "")
                        VerticalAlign: =VerticalAlign.Top
                        Visible: =cmp_DataTablePro.ShowCol2
                        Width: =cmp_DataTablePro.Col2Width
                        X: =lblDTP_H1.X + If(cmp_DataTablePro.ShowCol1, lblDTP_H1.Width, 0)
                        Y: =13
                  - lblDTP_H3:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =If(cmp_DataTablePro.SortColumn = "Col3", cmp_DataTablePro.AccentColor, cmp_DataTablePro.MutedTextColor)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =cmp_DataTablePro.HeaderHeight
                        OnSelect: =cmp_DataTablePro.OnSortCol3()
                        PaddingBottom: =0
                        PaddingLeft: =10
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10
                        Text: =cmp_DataTablePro.Col3Title & If(cmp_DataTablePro.SortColumn = "Col3", If(cmp_DataTablePro.SortAscending, " ▲", " ▼"), "")
                        VerticalAlign: =VerticalAlign.Top
                        Visible: =cmp_DataTablePro.ShowCol3
                        Width: =cmp_DataTablePro.Col3Width
                        X: =lblDTP_H2.X + If(cmp_DataTablePro.ShowCol2, lblDTP_H2.Width, 0)
                        Y: =13
                  - lblDTP_H4:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =If(cmp_DataTablePro.SortColumn = "Col4", cmp_DataTablePro.AccentColor, cmp_DataTablePro.MutedTextColor)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =cmp_DataTablePro.HeaderHeight
                        OnSelect: =cmp_DataTablePro.OnSortCol4()
                        PaddingBottom: =0
                        PaddingLeft: =10
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10
                        Text: =cmp_DataTablePro.Col4Title & If(cmp_DataTablePro.SortColumn = "Col4", If(cmp_DataTablePro.SortAscending, " ▲", " ▼"), "")
                        VerticalAlign: =VerticalAlign.Top
                        Visible: =cmp_DataTablePro.ShowCol4
                        Width: =cmp_DataTablePro.Col4Width
                        X: =lblDTP_H3.X + If(cmp_DataTablePro.ShowCol3, lblDTP_H3.Width, 0)
                        Y: =13
                  - lblDTP_H5:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =If(cmp_DataTablePro.SortColumn = "Col5", cmp_DataTablePro.AccentColor, cmp_DataTablePro.MutedTextColor)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =cmp_DataTablePro.HeaderHeight
                        OnSelect: =cmp_DataTablePro.OnSortCol5()
                        PaddingBottom: =0
                        PaddingLeft: =10
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10
                        Text: =cmp_DataTablePro.Col5Title & If(cmp_DataTablePro.SortColumn = "Col5", If(cmp_DataTablePro.SortAscending, " ▲", " ▼"), "")
                        VerticalAlign: =VerticalAlign.Top
                        Visible: =cmp_DataTablePro.ShowCol5
                        Width: =cmp_DataTablePro.Col5Width
                        X: =lblDTP_H4.X + If(cmp_DataTablePro.ShowCol4, lblDTP_H4.Width, 0)
                        Y: =13
                  - lblDTP_H6:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =If(cmp_DataTablePro.SortColumn = "Col6", cmp_DataTablePro.AccentColor, cmp_DataTablePro.MutedTextColor)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =cmp_DataTablePro.HeaderHeight
                        OnSelect: =cmp_DataTablePro.OnSortCol6()
                        PaddingBottom: =0
                        PaddingLeft: =10
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10
                        Text: =cmp_DataTablePro.Col6Title & If(cmp_DataTablePro.SortColumn = "Col6", If(cmp_DataTablePro.SortAscending, " ▲", " ▼"), "")
                        VerticalAlign: =VerticalAlign.Top
                        Visible: =cmp_DataTablePro.ShowCol6
                        Width: =cmp_DataTablePro.Col6Width
                        X: =lblDTP_H5.X + If(cmp_DataTablePro.ShowCol5, lblDTP_H5.Width, 0)
                        Y: =13
            - galDTP_Rows:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                Properties:
                  BorderColor: =RGBA(245, 245, 245, 1)
                  Height: =Parent.Height - If(cmp_DataTablePro.ShowToolbar, 178, 130)
                  Items: =cmp_DataTablePro.Items
                  TemplateSize: =cmp_DataTablePro.RowHeight
                  Visible: =!cmp_DataTablePro.IsLoading && !cmp_DataTablePro.IsEmpty && !cmp_DataTablePro.IsError
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =If(cmp_DataTablePro.ShowHeader, conDTP_Header.Y + conDTP_Header.Height, If(cmp_DataTablePro.ShowToolbar, 76, 16))
                Children:
                  - btnDTP_Row:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =0
                        Color: =Color.White
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: |-
                          =If(
                              ThisItem.Id = varDTP_SelectedId,
                              ColorValue("#EFF6FF"),
                              If(
                                  Lower(ThisItem.RowState) = "warning",
                                  ColorValue("#FFF7ED"),
                                  If(
                                      Lower(ThisItem.RowState) = "error" || Lower(ThisItem.RowState) = "danger",
                                      ColorValue("#FEF2F2"),
                                      If(ThisItem.IsSelected, cmp_DataTablePro.SurfaceAltColor, cmp_DataTablePro.BackgroundColor)
                                  )
                              )
                          )
                        Font: =Font.'Segoe UI'
                        Height: =Parent.TemplateHeight
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =Color.White
                        HoverFill: =ColorValue("#EFF6FF")
                        OnSelect: |-
                          =
                          If(
                              cmp_DataTablePro.EnableSelection && ThisItem.IsSelectable,
                              Set(varDTP_SelectedId, ThisItem.Id)
                          );
                          cmp_DataTablePro.OnRowSelect()
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =Color.White
                        PressedFill: =ColorValue("#DBEAFE")
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Text: =""
                        Width: =Parent.TemplateWidth
                  - chkDTP_Select:
                      Control: Classic/CheckBox@2.1.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        CheckboxBorderColor: =cmp_DataTablePro.MutedTextColor
                        CheckmarkFill: =cmp_DataTablePro.AccentColor
                        Color: =cmp_DataTablePro.TextColor
                        Default: =ThisItem.Id in varDTP_SelectedItems.Id
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        FocusedBorderThickness: =4
                        Font: =Font.'Segoe UI'
                        Height: =28
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =cmp_DataTablePro.TextColor
                        HoverFill: =RGBA(0, 0, 0, 0)
                        OnCheck: =Collect(varDTP_SelectedItems, ThisItem)
                        OnSelect: =Select(Parent)
                        OnUncheck: =RemoveIf(varDTP_SelectedItems, Id = ThisItem.Id)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =cmp_DataTablePro.TextColor
