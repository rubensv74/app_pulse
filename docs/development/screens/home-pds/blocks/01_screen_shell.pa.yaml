      - conHPDS_ScreenRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =varTheme_PageBg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =0
            Width: =Parent.Width
          Children:
            - cmpHPDS_Sidebar:
                Control: CanvasComponent
                ComponentName: cmp_SidebarNav
                Properties:
                  ActiveKey: ="Home"
                  AppVersion: ="PULSE"
                  EnvironmentLabel: ="ENV.PRE.TR.162"
                  Fill: =varTheme_BrandDark
                  Height: =Parent.Height
                  IsCollapsed: =true
                  Items: =colSidebarNavItems
                  NavItems: =colSidebarNavItems
                  ProjectCode: =Coalesce(varProjectCode, varSelectedProject.ProjectCode, "")
                  ProjectName: =Coalesce(varProjectName, varSelectedProject.ProjectName, "")
                  UserRole: =Coalesce(varUserRole, "reader")
                  Width: =154
