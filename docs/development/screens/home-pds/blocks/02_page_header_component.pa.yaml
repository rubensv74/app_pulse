# HOME_PDS — BLOCK 02 — PDS PAGE HEADER COMPONENT
#
# Status: PUBLISHED — PENDING POWER APPS STUDIO VALIDATION
# Operation: CREATE NEW CANVAS COMPONENT FROM SOURCE CODE
# Target component: cmp_PageHeaderPro
# First consumer: scr_Home_PDS (integration belongs to Block 03)
# Baseline screens/components: 3b71b860ed869a970a5a1b43cc137a580118b30c
#
# Primary responsibility:
# - create the canonical PDS page-header component;
# - render page identity + three generic context slots + utility/help actions;
# - expose all behavior through component events;
# - own no business/global state.
#
# Explicitly OUT OF SCOPE:
# - inserting the component into scr_Home_PDS;
# - loading project/template data;
# - opening selectors;
# - refresh logic;
# - page business primary actions;
# - flows / SQL;
# - responsive stacking beyond the stable desktop contract.
#
# Compatibility notes:
# - uses control families already demonstrated in the audited PULSE source;
# - intentionally does NOT use AccessibleLabel on Classic/Button@2.2.0;
# - no reusable component is nested inside a Gallery;
# - no internal Set()/global variable state exists.
#
# Validation after paste/save in Power Apps Studio:
# 1. cmp_PageHeaderPro appears in Components.
# 2. The component opens without formula errors.
# 3. Default preview shows title/subtitle, 3 context slots, Refresh and ?.
# 4. Header has white surface + subtle bottom divider + no normal-card shadow.
# 5. Interactive context slots display a chevron and hover treatment.
# 6. Last refresh default context is informational and has no chevron.
# 7. Utility can be disabled/hidden through public inputs.
# 8. Help can be hidden through public input.
# 9. App Checker reports no new PA1001 / PA2108 attributable to Block 02.
# 10. scr_Home_PDS is NOT modified in this block.

ComponentDefinitions:
