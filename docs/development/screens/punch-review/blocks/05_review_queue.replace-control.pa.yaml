# BLOCK 05 — INTERACTIVE REVIEW QUEUE
#
# Operation: REPLACE CONTROL COMPLETELY.
# Target control: conPR_QueueCard
# Parent: conPR_Body
#
# In Source Code, replace the complete existing conPR_QueueCard node from Block 03
# with this complete node. Do not keep conPR_QueueHeaderSlot, rectPR_QueueHeaderDivider
# or conPR_QueueContentSlot because this block replaces all of them.
#
# Dependencies:
# - Blocks 01, 02, 03 and 04 validated.
# - colPunchReviewQueue and colPunchReviewQueueView exist from Block 04.
#
# This block does not call flows. Selection updates only the session state:
# varPunchReviewCurrentIndex, varPunchReviewCurrent and varPunchReviewCurrentId.
#
# Validation after paste:
# 1. Empty queue shows a deliberate empty state.
# 2. Search and quick-filter controls render without overlap.
# 3. Previous/Next update the active record.
# 4. Row selection updates varPunchReviewCurrent.
#
# Source Code compatibility:
# - Label@2.5.1 does not support RadiusBottomLeft, RadiusBottomRight,
#   RadiusTopLeft or RadiusTopRight. See ../POWER_APPS_SOURCE_CODE_COMPATIBILITY.md.

- conPR_QueueCard:
    Control: GroupContainer@1.5.0
    Variant: AutoLayout
    Properties:
      AlignInContainer: =AlignInContainer.Stretch
      BorderColor: =varTheme_Border
      BorderThickness: =1
      DropShadow: =DropShadow.Semilight
      Fill: =varTheme_Surface
      FillPortions: =0
      Height: =If(App.Width < 1100, 360, Parent.Height)
      LayoutAlignItems: =LayoutAlignItems.Stretch
      LayoutDirection: =LayoutDirection.Vertical
      LayoutGap: =0
      LayoutMinHeight: =320
      LayoutMinWidth: =300
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Width: =If(App.Width < 1100, Parent.Width, 330)
    Children:
      - btnPR_RebuildQueue:
          Control: Classic/Button@2.2.0
          Properties:
            Height: =1
            OnSelect: |-
              =
              ClearCollect(
                  colPunchReviewQueueView,
                  SortByColumns(
                      Filter(
                          colPunchReviewQueue,
                          (
                              IsBlank(varPunchReviewSearch) ||
                              Lower(varPunchReviewSearch) in
                                  Lower(
                                      Coalesce(PunchCode, "") & " " &
                                      Coalesce(Description, "") & " " &
                                      Coalesce(SubsystemCode, "") & " " &
                                      Coalesce(Discipline, "")
                                  )
                          ) &&
                          Switch(
                              Coalesce(varPunchReviewQuickFilter, "ALL"),
                              "REMAINING", !IsReviewedInSession,
                              "REVIEWED", IsReviewedInSession,
                              true
                          )
                      ),
                      "ReviewOrder",
                      SortOrder.Ascending
                  )
              )
            Text: =""
            Visible: =false
            Width: =1
      - btnPR_SelectCurrent:
          Control: Classic/Button@2.2.0
          Properties:
            Height: =1
            OnSelect: |-
              =
              If(
                  CountRows(colPunchReviewQueue) = 0,
                  Set(varPunchReviewCurrent, Blank());
                  Set(varPunchReviewCurrentId, Blank()),
                  Set(
                      varPunchReviewCurrentIndex,
                      Min(
                          Max(1, Coalesce(varPunchReviewRequestedIndex, varPunchReviewCurrentIndex, 1)),
                          CountRows(colPunchReviewQueue)
                      )
                  );
                  Set(
                      varPunchReviewCurrent,
                      LookUp(
                          colPunchReviewQueue,
                          ReviewOrder = varPunchReviewCurrentIndex
                      )
                  );
                  Set(
                      varPunchReviewCurrentId,
                      varPunchReviewCurrent.PunchIdNumber
                  )
              )
            Text: =""
            Visible: =false
            Width: =1
      - conPR_QueueHeader:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =varTheme_Surface
            FillPortions: =0
            Height: =48
            LayoutMinHeight: =48
            LayoutMinWidth: =280
            Width: =Parent.Width
          Children:
            - lblPR_QueueTitle:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =varTheme_Text
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =11
                  Text: ="Review Queue"
                  Width: =190
                  X: =14
                  Y: =12
            - lblPR_QueueCount:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =varTheme_TextMuted
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =24
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =8
                  Text: =Text(CountRows(colPunchReviewQueue)) & " punches"
                  Width: =100
                  X: =Parent.Width - 114
                  Y: =12
      - rectPR_QueueHeaderDivider:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            BorderStyle: =BorderStyle.None
            Fill: =varTheme_Border
            FillPortions: =0
            Height: =1
            Width: =Parent.Width
      - conPR_QueueSearch:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =varTheme_Surface
            FillPortions: =0
            Height: =48
            LayoutMinHeight: =48
            LayoutMinWidth: =280
            Width: =Parent.Width
          Children:
            - txtPR_Search:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =varTheme_Border
                  Color: =varTheme_Text
                  Default: =Coalesce(varPunchReviewSearch, "")
                  Fill: =varTheme_Surface
                  Font: =Font.'Segoe UI'
                  Height: =34
                  HintText: ="Search punch ID or title..."
                  HoverBorderColor: =varTheme_PulseBlueDark
                  OnChange: |-
                    =Set(varPunchReviewSearch, Trim(Self.Text));
                    Select(btnPR_RebuildQueue)
                  PaddingLeft: =30
                  RadiusBottomLeft: =7
                  RadiusBottomRight: =7
                  RadiusTopLeft: =7
                  RadiusTopRight: =7
                  Size: =9
                  Width: =Parent.Width - 50
                  X: =10
                  Y: =7
            - icoPR_Search:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =varTheme_TextMuted
                  Height: =16
                  Icon: =Icon.Search
                  Width: =16
                  X: =18
                  Y: =16
            - btnPR_ClearSearch:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =varTheme_TextMuted
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =28
                  HoverColor: =varTheme_PulseBlueDark
                  HoverFill: =varTheme_SurfaceAlt
                  OnSelect: |-
                    =Set(varPunchReviewSearch, "");
                    Reset(txtPR_Search);
                    Select(btnPR_RebuildQueue)
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =10
                  Text: ="×"
                  Visible: =!IsBlank(varPunchReviewSearch)
                  Width: =28
                  X: =Parent.Width - 38
                  Y: =10
      - conPR_QueueQuickFilters:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =varTheme_Surface
            FillPortions: =0
            Height: =34
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =6
            LayoutMinHeight: =34
            LayoutMinWidth: =280
            PaddingLeft: =10
            PaddingRight: =10
            Width: =Parent.Width
          Children:
            - btnPR_FilterAll:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =If(Coalesce(varPunchReviewQuickFilter, "ALL") = "ALL", varTheme_PulseBlueDark, varTheme_Border)
                  BorderThickness: =1
                  Color: =If(Coalesce(varPunchReviewQuickFilter, "ALL") = "ALL", varTheme_PulseBlueDark, varTheme_TextMuted)
                  Fill: =If(Coalesce(varPunchReviewQuickFilter, "ALL") = "ALL", ColorValue("#EFF6FF"), varTheme_Surface)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =26
                  OnSelect: =Set(varPunchReviewQuickFilter, "ALL"); Select(btnPR_RebuildQueue)
                  RadiusBottomLeft: =7
                  RadiusBottomRight: =7
                  RadiusTopLeft: =7
                  RadiusTopRight: =7
                  Size: =8
                  Text: ="All · " & Text(CountRows(colPunchReviewQueue))
                  Width: =84
            - btnPR_FilterRemaining:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =If(varPunchReviewQuickFilter = "REMAINING", varTheme_PulseBlueDark, varTheme_Border)
                  BorderThickness: =1
                  Color: =If(varPunchReviewQuickFilter = "REMAINING", varTheme_PulseBlueDark, varTheme_TextMuted)
                  Fill: =If(varPunchReviewQuickFilter = "REMAINING", ColorValue("#EFF6FF"), varTheme_Surface)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =26
                  OnSelect: =Set(varPunchReviewQuickFilter, "REMAINING"); Select(btnPR_RebuildQueue)
                  RadiusBottomLeft: =7
                  RadiusBottomRight: =7
                  RadiusTopLeft: =7
                  RadiusTopRight: =7
                  Size: =8
                  Text: ="Remaining · " & Text(CountIf(colPunchReviewQueue, !IsReviewedInSession))
                  Width: =112
            - btnPR_FilterReviewed:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =If(varPunchReviewQuickFilter = "REVIEWED", varTheme_PulseBlueDark, varTheme_Border)
                  BorderThickness: =1
                  Color: =If(varPunchReviewQuickFilter = "REVIEWED", varTheme_PulseBlueDark, varTheme_TextMuted)
                  Fill: =If(varPunchReviewQuickFilter = "REVIEWED", ColorValue("#EFF6FF"), varTheme_Surface)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =26
                  OnSelect: =Set(varPunchReviewQuickFilter, "REVIEWED"); Select(btnPR_RebuildQueue)
                  RadiusBottomLeft: =7
                  RadiusBottomRight: =7
                  RadiusTopLeft: =7
                  RadiusTopRight: =7
                  Size: =8
                  Text: ="Reviewed · " & Text(CountIf(colPunchReviewQueue, IsReviewedInSession))
                  Width: =106
      - conPR_QueuePager:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =varTheme_Border
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =varTheme_SurfaceAlt
            FillPortions: =0
            Height: =38
            LayoutMinHeight: =38
            LayoutMinWidth: =280
            Width: =Parent.Width
          Children:
            - btnPR_Previous:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =varTheme_TextMuted
                  DisplayMode: =If(varPunchReviewCurrentIndex <= 1 || CountRows(colPunchReviewQueue) = 0, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =30
                  HoverColor: =varTheme_PulseBlueDark
                  HoverFill: =ColorValue("#E2E8F0")
                  OnSelect: |-
                    =Set(varPunchReviewRequestedIndex, varPunchReviewCurrentIndex - 1);
                    Select(btnPR_SelectCurrent)
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =12
                  Text: ="‹"
                  Width: =34
                  X: =8
                  Y: =4
            - lblPR_QueuePosition:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =varTheme_Text
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =30
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =9
                  Text: |-
                    =If(
                        CountRows(colPunchReviewQueue) = 0,
                        "0 of 0",
                        Text(varPunchReviewCurrentIndex) & " of " & Text(CountRows(colPunchReviewQueue))
                    )
                  Width: =Parent.Width - 92
                  X: =46
                  Y: =4
            - btnPR_Next:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =varTheme_TextMuted
                  DisplayMode: =If(varPunchReviewCurrentIndex >= CountRows(colPunchReviewQueue) || CountRows(colPunchReviewQueue) = 0, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =30
                  HoverColor: =varTheme_PulseBlueDark
                  HoverFill: =ColorValue("#E2E8F0")
                  OnSelect: |-
                    =Set(varPunchReviewRequestedIndex, varPunchReviewCurrentIndex + 1);
                    Select(btnPR_SelectCurrent)
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =12
                  Text: ="›"
                  Width: =34
                  X: =Parent.Width - 42
                  Y: =4
      - conPR_QueueListHost:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =varTheme_Surface
            FillPortions: =1
            LayoutMinHeight: =160
            LayoutMinWidth: =280
            Width: =Parent.Width
          Children:
            - galPR_Queue:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Fill: =varTheme_Surface
                  Height: =Parent.Height
                  Items: =colPunchReviewQueueView
                  OnSelect: |-
                    =Set(varPunchReviewRequestedIndex, ThisItem.ReviewOrder);
                    Select(btnPR_SelectCurrent)
                  ShowScrollbar: =true
                  TemplateFill: =If(ThisItem.ReviewOrder = varPunchReviewCurrentIndex, ColorValue("#EFF6FF"), varTheme_Surface)
                  TemplatePadding: =4
                  TemplateSize: =78
                  Visible: =CountRows(colPunchReviewQueueView) > 0
                  Width: =Parent.Width
                Children:
                  - btnPR_QueueRow:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =If(ThisItem.ReviewOrder = varPunchReviewCurrentIndex, varTheme_PulseBlueDark, varTheme_Border)
                        BorderThickness: =If(ThisItem.ReviewOrder = varPunchReviewCurrentIndex, 2, 1)
                        Color: =Color.Transparent
                        Fill: =Color.Transparent
                        Height: =Parent.TemplateHeight - 6
                        HoverBorderColor: =varTheme_PulseBlueDark
                        HoverFill: =ColorValue("#EFF6FF")
                        OnSelect: =Select(Parent)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: =""
                        Width: =Parent.TemplateWidth - 8
                        X: =4
                        Y: =3
                  - lblPR_RowPunchCode:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =varTheme_Text
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        OnSelect: =Select(Parent)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =9
                        Text: =Coalesce(ThisItem.PunchCode, Text(ThisItem.PunchIdNumber))
                        Width: =150
                        X: =14
                        Y: =8
                  - lblPR_RowStatus:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0,0,0,0)
                        Color: |-
                          =Switch(
                              Upper(Coalesce(ThisItem.StatusCode, ThisItem.StatusLabel, "")),
                              "OPEN", ColorValue("#B91C1C"),
                              "IN PROGRESS", ColorValue("#B45309"),
                              "IN_PROGRESS", ColorValue("#B45309"),
                              "CLOSED", ColorValue("#15803D"),
                              varTheme_TextMuted
                          )
                        Fill: |-
                          =Switch(
                              Upper(Coalesce(ThisItem.StatusCode, ThisItem.StatusLabel, "")),
                              "OPEN", ColorValue("#FEE2E2"),
                              "IN PROGRESS", ColorValue("#FEF3C7"),
                              "IN_PROGRESS", ColorValue("#FEF3C7"),
                              "CLOSED", ColorValue("#DCFCE7"),
                              varTheme_SurfaceAlt
                          )
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        OnSelect: =Select(Parent)
                        PaddingBottom: =0
                        PaddingLeft: =2
                        PaddingRight: =2
                        PaddingTop: =0
                        Size: =7
                        Text: =Upper(Coalesce(ThisItem.StatusLabel, ThisItem.StatusCode, "-"))
                        Width: =84
                        X: =Parent.TemplateWidth - 96
                        Y: =7
                  - lblPR_RowDescription:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =varTheme_Text
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        Height: =22
                        OnSelect: =Select(Parent)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =8
                        Text: =Coalesce(ThisItem.Description, "-")
                        Width: =Parent.TemplateWidth - 28
                        Wrap: =false
                        X: =14
                        Y: =29
                  - lblPR_RowDiscipline:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =varTheme_TextMuted
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        Height: =18
                        OnSelect: =Select(Parent)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =8
                        Text: =Coalesce(ThisItem.Discipline, "No discipline")
                        Width: =160
                        X: =14
                        Y: =53
                  - lblPR_RowReviewState:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =If(ThisItem.IsReviewedInSession, ColorValue("#15803D"), varTheme_TextMuted)
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =If(ThisItem.IsReviewedInSession, FontWeight.Semibold, FontWeight.Normal)
                        Height: =18
                        OnSelect: =Select(Parent)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =8
                        Text: =If(ThisItem.IsReviewedInSession, "Reviewed  ✓", "Not reviewed  ○")
                        Width: =126
                        X: =Parent.TemplateWidth - 140
                        Y: =53
            - conPR_QueueEmpty:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =varTheme_Surface
                  Height: =Parent.Height
                  Visible: =CountRows(colPunchReviewQueueView) = 0
                  Width: =Parent.Width
                Children:
                  - icoPR_QueueEmpty:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =varTheme_PulseBlueDark
                        Height: =34
                        Icon: =If(CountRows(colPunchReviewQueue) = 0, Icon.DocumentWithContent, Icon.Search)
                        Width: =34
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =Max(22, Parent.Height * 0.30)
                  - lblPR_QueueEmptyTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =varTheme_Text
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =11
                        Text: =If(CountRows(colPunchReviewQueue) = 0, "No review queue", "No matching punches")
                        Width: =Parent.Width - 40
                        X: =20
                        Y: =icoPR_QueueEmpty.Y + icoPR_QueueEmpty.Height + 12
                  - lblPR_QueueEmptyText:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =varTheme_TextMuted
                        Height: =44
                        Size: =9
                        Text: |-
                          =If(
                              CountRows(colPunchReviewQueue) = 0,
                              "Open this workspace from Home or Punch List to create a contextual review queue.",
                              "Clear the search or select another queue filter."
                          )
                        Width: =Parent.Width - 52
                        X: =26
                        Y: =lblPR_QueueEmptyTitle.Y + lblPR_QueueEmptyTitle.Height + 6
      - conPR_QueueFooter:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =varTheme_Border
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =varTheme_SurfaceAlt
            FillPortions: =0
            Height: =34
            LayoutMinHeight: =34
            LayoutMinWidth: =280
            Width: =Parent.Width
          Children:
            - lblPR_QueueFooterLeft:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =varTheme_TextMuted
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =24
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =8
                  Text: =Text(CountRows(colPunchReviewQueueView)) & " results"
                  Width: =120
                  X: =12
                  Y: =5
            - lblPR_QueueFooterRight:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =varTheme_TextMuted
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =24
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =8
                  Text: =Text(CountIf(colPunchReviewQueue, IsReviewedInSession)) & " reviewed"
                  Width: =130
                  X: =Parent.Width - 142
                  Y: =5
