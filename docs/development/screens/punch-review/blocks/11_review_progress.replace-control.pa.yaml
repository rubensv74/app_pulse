# BLOCK 11 — REVIEW PROGRESS
#
# Operation: REPLACE CONTROL COMPLETELY.
# Target control: conPR_ProgressSlot
# Parent: conPR_RightColumn
#
# Replace the complete placeholder created in Block 03 with this component instance.
# Do not keep lblPR_ProgressPlaceholder.
#
# IMPORTANT — PRE-YAML GATE APPLIED
# The current POWER_APPS_SOURCE_CODE_COMPATIBILITY.md was consulted immediately
# before drafting this YAML.
#
# Resolution of PR-SC-005 / PA2301:
# - cmp_DonutPro was not previously installed in the active Power Apps app.
# - The component has now been added to the app's component library.
# - This block can therefore instantiate cmp_DonutPro directly.
# - No inline SVG is created by this screen block.
#
# Dependencies:
# - Blocks 01–10 integrated.
# - cmp_DonutPro is installed in the active app and available to Studio.
# - colPunchReviewQueue contains IsReviewedInSession.
# - Block 07 updates IsReviewedInSession through Mark Reviewed / Undo Review.
#
# Scope:
# - Shows session review completion for the complete loaded review queue.
# - Uses the installed premium cmp_DonutPro component.
# - Displays Reviewed vs Remaining.
# - Shows completion percentage in the donut center.
# - Updates immediately when Mark Reviewed / Undo Review changes the queue.
# - Requires no flow or SQL call.
#
# Important semantic rule:
# - This is SESSION REVIEW PROGRESS.
# - It does not represent Punch closure progress or project completion.
# - It does not persist Reviewed to SQL.
#
# Compatibility:
# - CanvasComponent use is permitted because cmp_DonutPro is now confirmed in the active app.
# - The Items contract is SegmentKey, SegmentLabel, SegmentValue, SegmentColor, SegmentOrder.
# - No direct Image/SVG implementation is used in this block.
#
# Validation:
# 1. The block imports without PA2301.
# 2. With an empty queue, the component shows its empty state.
# 3. With the Block 05A five-row seed, initial counts are 2 Reviewed / 3 Remaining / 40%.
# 4. Mark Reviewed changes the result to 3 / 2 / 60%.
# 5. Undo Review reverses the result.
# 6. 5 reviewed out of 5 renders 100% COMPLETE.
# 7. Filtering the visible queue does not change progress; progress uses the full loaded queue.

- cmpPR_ReviewProgress:
    Control: CanvasComponent
    ComponentName: cmp_DonutPro
    Properties:
      AccentColor: =varTheme_PulseBlueDark
      BackgroundColor: =varTheme_Surface
      BorderColor: =varTheme_Border
      CenterFillColorHex: ="#FFFFFF"
      CenterLabel: ="COMPLETE"
      CenterLabelColorHex: ="#64748B"
      CenterValueColorHex: ="#0F172A"
      CenterValueText: |-
        =If(
            CountRows(colPunchReviewQueue) = 0,
            "0%",
            Text(
                CountIf(
                    colPunchReviewQueue,
                    Coalesce(IsReviewedInSession, false)
                ) /
                CountRows(colPunchReviewQueue),
                "[$-en-US]0%"
            )
        )
      CompactMode: =true
      DangerColor: =ColorValue("#DC2626")
      DonutThickness: =15
      EmptyText: ="Load a review queue to see session progress."
      EnableSelection: =false
      ErrorText: ="Review progress unavailable."
      Height: =140
      Items: |-
        =Table(
            {
                SegmentKey: "REVIEWED",
                SegmentLabel: "Reviewed",
                SegmentValue:
                    CountIf(
                        colPunchReviewQueue,
                        Coalesce(IsReviewedInSession, false)
                    ),
                SegmentColor: "#16A34A",
                SegmentOrder: 1
            },
            {
                SegmentKey: "REMAINING",
                SegmentLabel: "Remaining",
                SegmentValue:
                    CountIf(
                        colPunchReviewQueue,
                        !Coalesce(IsReviewedInSession, false)
                    ),
                SegmentColor: "#CBD5E1",
                SegmentOrder: 2
            }
        )
      LoadingText: ="Calculating session progress..."
      MutedTextColor: =varTheme_TextMuted
      PercentageFormat: ="[$-en-US]0%"
      SegmentGapPercent: =0.7
      ShowLegend: =true
      ShowPercentages: =true
      ShowValues: =true
      ShowZeroSegments: =true
      State: |-
        =If(
            CountRows(colPunchReviewQueue) = 0,
            "empty",
            "ready"
        )
      Subtitle: |-
        =If(
            CountRows(colPunchReviewQueue) = 0,
            "Session-only completion",
            Text(
                CountIf(
                    colPunchReviewQueue,
                    Coalesce(IsReviewedInSession, false)
                ),
                "[$-en-US]#,##0"
            ) &
            " reviewed · " &
            Text(
                CountIf(
                    colPunchReviewQueue,
                    !Coalesce(IsReviewedInSession, false)
                ),
                "[$-en-US]#,##0"
            ) &
            " remaining · " &
            Text(
                CountRows(colPunchReviewQueue),
                "[$-en-US]#,##0"
            ) &
            " total"
        )
      SurfaceAltColor: =varTheme_SurfaceAlt
      TextColor: =varTheme_Text
      Title: ="Review Progress"
      TrackColorHex: ="#E2E8F0"
      ValueFormat: ="[$-en-US]#,##0"
      ValueSuffix: =""
      Width: =Parent.Width
