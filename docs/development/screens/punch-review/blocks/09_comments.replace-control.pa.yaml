                              Color: =varTheme_PulseBlueDark
                              Fill: =Color.Transparent
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13
                              Text: ="◫"
                              Width: =Parent.Width
                  - lblPR_CommentsEmptyTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =varTheme_Text
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =10
                        Text: |-
                          =If(
                              IsBlank(varPunchReviewCurrentId),
                              "No Punch selected",
                              "No comments yet"
                          )
                        Width: =Parent.Width - 40
                        X: =20
                        Y: =conPR_CommentsEmptyIcon.Y + 50
                  - lblPR_CommentsEmptyText:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =varTheme_TextMuted
                        Height: =42
                        Size: =8
                        Text: |-
                          =If(
                              IsBlank(varPunchReviewCurrentId),
                              "Select a Punch to load and add comments.",
                              "Be the first person to add a comment to this Punch."
                          )
                        Width: =Parent.Width - 54
                        X: =27
                        Y: =lblPR_CommentsEmptyTitle.Y + 26
      - rectPR_CommentsComposerDivider:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            BorderStyle: =BorderStyle.None
            Fill: =varTheme_Border
            FillPortions: =0
            Height: =1
            Width: =Parent.Width
      - conPR_CommentsComposer:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =varTheme_SurfaceAlt
            FillPortions: =0
            Height: =92
            LayoutMinHeight: =92
            LayoutMinWidth: =280
            Width: =Parent.Width
          Children:
            - txtPR_NewComment:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =varTheme_Border
                  Color: =varTheme_Text
                  Default: =""
                  DisplayMode: |-
                    =If(
                        IsBlank(varPunchReviewCurrentId) ||
                        varPunchReviewCommentsLoading,
                        DisplayMode.Disabled,
                        DisplayMode.Edit
                    )
                  Fill: =varTheme_Surface
                  Font: =Font.'Segoe UI'
                  Height: =66
                  HintText: ="Write a comment..."
                  HoverBorderColor: =varTheme_PulseBlueDark
                  Mode: =TextMode.MultiLine
                  PaddingBottom: =8
                  PaddingLeft: =10
                  PaddingRight: =10
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =9
                  Width: =Parent.Width - 126
                  X: =10
                  Y: =13
            - btnPR_SubmitComment:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =varTheme_PulseBlueDark
                  BorderThickness: =1
                  Color: =Color.White
                  DisplayMode: |-
                    =If(
                        IsBlank(varPunchReviewCurrentId) ||
                        varPunchReviewCommentsLoading ||
                        IsBlank(Trim(txtPR_NewComment.Text)),
                        DisplayMode.Disabled,
                        DisplayMode.Edit
                    )
                  Fill: =varTheme_PulseBlueDark
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =40
                  HoverBorderColor: =ColorFade(varTheme_PulseBlueDark, -0.12)
                  HoverColor: =Color.White
                  HoverFill: =ColorFade(varTheme_PulseBlueDark, -0.08)
                  OnSelect: =Select(btnPR_AddComment)
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =8
                  Text: ="Add comment"
                  Width: =98
                  X: =Parent.Width - 108
                  Y: =26
