# BLOCK 09 — COMMENTS
#
# Operation: REPLACE CONTROL COMPLETELY.
# Target control: conPR_CommentsSlot
# Parent: conPR_RightColumn
#
# Replace the complete placeholder created in Block 03 with this card.
# Do not keep lblPR_CommentsPlaceholder.
#
# Dependencies:
# - Blocks 01–08 validated.
# - colPunchReviewComments and the comment runtime variables exist from Block 04.
# - The following flows must exist in the app:
#   Warroom_GetTaskCommentsPaged
#   Warroom_AddTaskComment
#
# Confirmed read contract from scr_Punches:
# Warroom_GetTaskCommentsPaged.Run(
#     ProjectId,
#     RecordId,
#     Page,
#     PageSize,
#     EntityType
# )
#
# Add contract used by the existing Punch comment architecture:
# Warroom_AddTaskComment.Run(
#     ProjectId,
#     RecordId,
#     CommentHtml,
#     UserEmail,
#     EntityType,
#     UserName,
#     CommentType
# )
#
# Scope:
# - Loads real comments for the selected Punch.
# - Supports refresh and server pagination.
# - Adds a GENERAL comment through the real flow.
# - Updates the session queue comment count after a successful add.
# - Registers COMMENT_ADDED in Session Activity.
#
# Out of scope:
# - Editing or deleting comments.
# - Attachments.
# - Rich text authoring.
# - Corporate history outside the comments returned by the flow.
#
# Compatibility:
# - Label@2.5.1 contains no Radius* properties.
# - Rounded badges use GroupContainer@1.5.0.
# - txtPR_NewComment is a Classic/TextInput@2.3.2 and is resettable.
# - TextMode.MultiLine is introduced here and must be validated in Studio.
#
# Validation:
# 1. No selected Punch displays a deliberate empty state.
# 2. A real Punch loads its comments.
# 3. Previous/Next page call the flow with the correct parameter order.
# 4. Empty comment submission is blocked.
# 5. A successful add refreshes page 1, updates the queue counter and creates a session event.
# 6. Flow errors remain visible and can be retried with Refresh.

- conPR_CommentsCard:
    Control: GroupContainer@1.5.0
    Variant: AutoLayout
    Properties:
      AlignInContainer: =AlignInContainer.Stretch
      BorderColor: =varTheme_Border
      BorderThickness: =1
      DropShadow: =DropShadow.Semilight
      Fill: =varTheme_Surface
      FillPortions: =1
      LayoutAlignItems: =LayoutAlignItems.Stretch
      LayoutDirection: =LayoutDirection.Vertical
      LayoutGap: =0
      LayoutMinHeight: =220
      LayoutMinWidth: =300
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Width: =Parent.Width
    Children:
      - btnPR_LoadComments:
          Control: Classic/Button@2.2.0
          Properties:
            Height: =1
            OnSelect: |-
              =
              If(
                  IsBlank(varPunchReviewCurrentId),

                  Clear(colPunchReviewComments);
                  Set(varPunchReviewCommentsError, "");
                  Set(varPunchReviewCommentsLoading, false),

                  IsBlank(varProjectId),

                  Clear(colPunchReviewComments);
                  Set(
                      varPunchReviewCommentsError,
                      "No active project is available for loading comments."
                  );
                  Set(varPunchReviewCommentsLoading, false),

                  Set(varPunchReviewCommentsLoading, true);
                  Set(varPunchReviewCommentsError, "");

                  IfError(
                      With(
                          {
                              resp:
                                  Warroom_GetTaskCommentsPaged.Run(
                                      varProjectId,
                                      varPunchReviewCurrentId,
                                      varPunchReviewCommentsPage,
                                      varPunchReviewCommentsPageSize,
                                      "PUNCH"
                                  )
                          },

                          ClearCollect(
                              colPunchReviewComments,
                              ForAll(
                                  Table(
                                      ParseJSON(
                                          Coalesce(
                                              resp.result,
                                              "[]"
                                          )
                                      )
                                  ),
                                  With(
                                      {r: ThisRecord.Value},
                                      {
                                          CommentId:
                                              If(
                                                  IsBlank(Text(r.CommentId)),
                                                  0,
                                                  Value(r.CommentId)
                                              ),
                                          CommentType:
                                              Coalesce(
                                                  Text(r.CommentType),
                                                  "GENERAL"
                                              ),
                                          CreatedOn:
                                              If(
                                                  IsBlank(Text(r.CreatedOn)),
                                                  Blank(),
                                                  DateTimeValue(Text(r.CreatedOn))
                                              ),
                                          CreatedByEmail:
                                              Coalesce(
                                                  Text(r.CreatedByEmail),
                                                  ""
                                              ),
                                          CreatedByName:
                                              Coalesce(
                                                  Text(r.CreatedByName),
                                                  Text(r.CreatedByEmail),
                                                  "PULSE user"
                                              ),
                                          ModifiedOn:
                                              If(
                                                  IsBlank(Text(r.ModifiedOn)),
                                                  Blank(),
                                                  DateTimeValue(Text(r.ModifiedOn))
                                              ),
                                          ModifiedByEmail:
                                              Coalesce(
                                                  Text(r.ModifiedByEmail),
                                                  ""
                                              ),
                                          CommentText:
                                              Coalesce(
                                                  Text(r.CommentText),
                                                  ""
                                              ),
                                          TotalRows:
                                              If(
                                                  IsBlank(Text(r.TotalRows)),
                                                  0,
                                                  Value(r.TotalRows)
                                              ),
                                          TotalPages:
                                              If(
                                                  IsBlank(Text(r.TotalPages)),
                                                  0,
                                                  Value(r.TotalPages)
                                              ),
                                          PageNumber:
                                              If(
                                                  IsBlank(Text(r.PageNumber)),
                                                  varPunchReviewCommentsPage,
                                                  Value(r.PageNumber)
                                              ),
                                          PageSize:
                                              If(
                                                  IsBlank(Text(r.PageSize)),
                                                  varPunchReviewCommentsPageSize,
                                                  Value(r.PageSize)
                                              )
                                      }
                                  )
                              )
                          )
                      ),

                      Set(
                          varPunchReviewCommentsError,
                          Coalesce(
                              FirstError.Message,
                              "Comments could not be loaded."
                          )
                      );
                      Clear(colPunchReviewComments)
                  );

                  Set(varPunchReviewCommentsLoading, false)
              )
            Text: =""
            Visible: =false
            Width: =1
      - btnPR_AddComment:
          Control: Classic/Button@2.2.0
          Properties:
            Height: =1
            OnSelect: |-
              =
              If(
                  IsBlank(varPunchReviewCurrentId),

                  Notify(
                      "Select a Punch before adding a comment.",
                      NotificationType.Information
                  ),

                  IsBlank(Trim(txtPR_NewComment.Text)),

                  Notify(
                      "Write a comment before submitting.",
                      NotificationType.Information
                  ),

                  IsBlank(varProjectId),

                  Notify(
                      "No active project is available.",
                      NotificationType.Error
                  ),

                  With(
                      {
                          currentPunchId: varPunchReviewCurrentId,
                          currentPunchCode:
                              Coalesce(
                                  varPunchReviewCurrent.PunchCode,
                                  Text(varPunchReviewCurrentId)
                              ),
                          newComment: Trim(txtPR_NewComment.Text)
                      },

                      Set(varPunchReviewCommentsLoading, true);
                      Set(varPunchReviewCommentsError, "");

                      IfError(
                          Warroom_AddTaskComment.Run(
                              varProjectId,
                              currentPunchId,
                              newComment,
                              User().Email,
                              "PUNCH",
                              User().FullName,
                              "GENERAL"
                          );

                          Patch(
                              colPunchReviewQueue,
                              LookUp(
                                  colPunchReviewQueue,
                                  PunchIdNumber = currentPunchId
                              ),
                              {
                                  CommentCount:
                                      Coalesce(
                                          varPunchReviewCurrent.CommentCount,
                                          0
                                      ) + 1,
                                  LastCommentOn: Now()
                              }
                          );

                          Set(
                              varPunchReviewCurrent,
                              LookUp(
                                  colPunchReviewQueue,
                                  PunchIdNumber = currentPunchId
                              )
                          );

                          Collect(
                              colPunchReviewSessionEvents,
                              {
                                  EventKey: Text(GUID()),
                                  PunchIdNumber: currentPunchId,
                                  EventLabel:
                                      "Comment added to " &
                                      currentPunchCode,
                                  EventOn: Now(),
                                  EventBy: User().FullName,
                                  EventType: "COMMENT_ADDED"
                              }
                          );

                          Reset(txtPR_NewComment);
                          Set(varPunchReviewCommentsPage, 1);
                          Set(varPunchReviewCommentsLoading, false);
                          Select(btnPR_LoadComments);

                          Notify(
                              "Comment added successfully.",
                              NotificationType.Success
                          ),

                          Set(
                              varPunchReviewCommentsError,
                              Coalesce(
                                  FirstError.Message,
                                  "The comment could not be added."
                              )
                          );
                          Set(varPunchReviewCommentsLoading, false);

                          Notify(
                              varPunchReviewCommentsError,
                              NotificationType.Error
                          )
                      )
                  )
              )
            Text: =""
            Visible: =false
            Width: =1
