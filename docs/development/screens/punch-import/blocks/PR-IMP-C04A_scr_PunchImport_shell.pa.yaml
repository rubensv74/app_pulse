Screens:
  scr_PunchImport:
    Properties:
      Fill: =varTheme_PageBg
      LoadingSpinnerColor: =varTheme_PulseBlueDark
      OnVisible: |-
        =
        // =====================================================
        // PR-IMP-C04A — PREMIUM SHELL + SYNTHETIC STATE ONLY
        // No Flow calls. No SQL calls. No production writes.
        // =====================================================

        If(IsBlank(varTheme_PageBg), Set(varTheme_PageBg, ColorValue("#F6F8FB")));
        If(IsBlank(varTheme_Surface), Set(varTheme_Surface, ColorValue("#FFFFFF")));
        If(IsBlank(varTheme_SurfaceAlt), Set(varTheme_SurfaceAlt, ColorValue("#F8FAFC")));
        If(IsBlank(varTheme_Border), Set(varTheme_Border, ColorValue("#E2E8F0")));
        If(IsBlank(varTheme_Text), Set(varTheme_Text, ColorValue("#0F172A")));
        If(IsBlank(varTheme_TextMuted), Set(varTheme_TextMuted, ColorValue("#64748B")));
        If(IsBlank(varTheme_PulseBlueDark), Set(varTheme_PulseBlueDark, ColorValue("#1677FF")));
        If(IsBlank(varTheme_NavBg), Set(varTheme_NavBg, ColorValue("#07111F")));

        Set(varAppView, "PunchReview");
        Set(varPageKey, "PUNCH_IMPORT");
        Set(varPageTitle, "Import comment updates");
        Set(varPageSubtitle, "Validate every Excel change before applying it to PULSE.");

        If(IsBlank(varPunchImportStep), Set(varPunchImportStep, "UPLOAD"));
        If(IsBlank(varPunchImportBusy), Set(varPunchImportBusy, false));
        If(IsBlank(varPunchImportBatchId), Set(varPunchImportBatchId, ""));
        If(IsBlank(varPunchImportBatchStatus), Set(varPunchImportBatchStatus, "NOT_STARTED"));
        If(IsBlank(varPunchImportFileName), Set(varPunchImportFileName, ""));
        If(IsBlank(varPunchImportCanCommit), Set(varPunchImportCanCommit, false));
        If(IsBlank(varPunchImportFilter), Set(varPunchImportFilter, "ALL"));
        If(IsBlank(varPunchImportSearch), Set(varPunchImportSearch, ""));
        If(IsBlank(varPunchImportError), Set(varPunchImportError, ""));
        If(IsBlank(varPunchImportPage), Set(varPunchImportPage, 1));
        If(IsBlank(varPunchImportPageSize), Set(varPunchImportPageSize, 50));
        If(IsBlank(varPunchImportTotalRows), Set(varPunchImportTotalRows, 0));
        If(IsBlank(varPunchImportChangedRows), Set(varPunchImportChangedRows, 0));
        If(IsBlank(varPunchImportErrorRows), Set(varPunchImportErrorRows, 0));
        If(IsBlank(varPunchImportConflictRows), Set(varPunchImportConflictRows, 0));

        Set(
            varPunchImportTemplateLabel,
            Coalesce(
                LookUp(
                    colPunchTemplates_Filter,
                    Text(TemplateId) = Text(varPunchReviewTemplateId),
                    TemplateLabel
                ),
                If(
                    IsBlank(varPunchReviewTemplateId),
                    "No template selected",
                    Text(varPunchReviewTemplateId)
                )
            )
        )
    Children:
      - conPI_ScreenRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =varTheme_PageBg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width
          Children:
            - cmpPI_Sidebar:
