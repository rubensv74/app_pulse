Screens:
  scr_PunchImport:
    Properties:
      Fill: =varTheme_PageBg
      LoadingSpinnerColor: =varTheme_PulseBlueDark
      OnVisible: |-
        =
        // =====================================================
        // PR-IMP-C04A — SCREEN SHELL ONLY
        // No Flow calls. No SQL calls. No import runtime yet.
        // =====================================================

        If(IsBlank(varTheme_PageBg), Set(varTheme_PageBg, ColorValue("#F6F8FB")));
        If(IsBlank(varTheme_Surface), Set(varTheme_Surface, ColorValue("#FFFFFF")));
        If(IsBlank(varTheme_SurfaceAlt), Set(varTheme_SurfaceAlt, ColorValue("#F8FAFC")));
        If(IsBlank(varTheme_Border), Set(varTheme_Border, ColorValue("#E2E8F0")));
        If(IsBlank(varTheme_Text), Set(varTheme_Text, ColorValue("#0F172A")));
        If(IsBlank(varTheme_TextMuted), Set(varTheme_TextMuted, ColorValue("#64748B")));
        If(IsBlank(varTheme_PulseBlueDark), Set(varTheme_PulseBlueDark, ColorValue("#1677FF")));
        If(IsBlank(varTheme_NavBg), Set(varTheme_NavBg, ColorValue("#07111F")));

        Set(varAppView, "PunchReview");
        Set(varPageKey, "PUNCH_IMPORT");
        Set(varPageTitle, "Import comment updates");
        Set(varPageSubtitle, "Validate every Excel change before applying it to PULSE.")
    Children:
      - conPI_ScreenRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =varTheme_PageBg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width
          Children:
            - cmpPI_Sidebar:
                Control: CanvasComponent
                ComponentName: cmp_SidebarNav
                Properties:
                  ActiveKey: ="PunchReview"
                  AppVersion: ="PULSE"
                  EnvironmentLabel: ="ENV.PRE.TR.162"
                  Fill: =varTheme_NavBg
                  Height: =Parent.Height
                  IsCollapsed: =true
                  Items: =colSidebarNavItems
                  NavItems: =colSidebarNavItems
                  OnSelectItem: =
                  OnToggleCollapse: =
                  ProjectCode: =Coalesce(varSelectedProject.ProjectCode, "")
                  ProjectName: =Coalesce(varSelectedProject.ProjectName, "")
                  UserRole: =Coalesce(varUserRole, "reader")
                  Width: =154
            - conPI_ContentShell:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =varTheme_PageBg
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutMinHeight: =420
                  LayoutMinWidth: =540
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =10
                  PaddingLeft: =10
                  PaddingRight: =10
                  PaddingTop: =10
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conPI_ShellMarker:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =varTheme_Border
                        BorderThickness: =1
                        DropShadow: =DropShadow.Semilight
                        Fill: =varTheme_Surface
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =320
                        LayoutMinWidth: =480
                        PaddingBottom: =24
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =24
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Width: =Parent.Width
                      Children:
                        - lblPI_ShellEyebrow:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              AutoHeight: =true
                              Color: =varTheme_PulseBlueDark
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              LayoutMinHeight: =18
                              LayoutMinWidth: =320
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =8
                              Text: ="PUNCH REVIEW  /  DATA EXCHANGE"
                              Width: =Min(620, Parent.Width - 40)
                        - lblPI_ShellTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              AutoHeight: =true
                              Color: =varTheme_Text
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =34
                              LayoutMinHeight: =32
                              LayoutMinWidth: =320
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =20
                              Text: ="Import comment updates"
                              Width: =Min(700, Parent.Width - 40)
                        - lblPI_ShellSubtitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              AutoHeight: =true
                              Color: =varTheme_TextMuted
                              Font: =Font.'Segoe UI'
                              Height: =44
                              LayoutMinHeight: =40
                              LayoutMinWidth: =320
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =10
                              Text: ="Shell ready. Header, stepper, upload, preview and commit surfaces are added in separate validated increments."
                              Width: =Min(720, Parent.Width - 40)