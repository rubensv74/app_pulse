# BRIEFING_PDS — BRF-C01 — PREMIUM SHELL AND VISUAL STATES
#
# Status: PUBLISHED — PENDING POWER APPS STUDIO VALIDATION
# Operation: REPLACE COMPLETE SOURCE OF AN EMPTY scr_Briefing_PDS
# Target screen: scr_Briefing_PDS
# Dependencies: cmp_SidebarNav must already exist in the app.
#
# Scope:
# - PULSE shell + Sidebar
# - native premium header and synthetic session context
# - synthetic state selector
# - KPI strip
# - Briefing / Meeting Notes / Email local tabs
# - Executive Summary, Review Quality, Decisions, Progress, Blockers, Open Items
# - synthetic Action Register
# - Source Activity and lifecycle rail
# - Evidence Drawer
# - mutually exclusive NO_SESSION / READY / GENERATING / DRAFT / NEEDS_REVIEW /
#   APPROVED / STALE / SENT / ERROR visual states
#
# OUT OF SCOPE:
# - SQL / Power Automate / Outlook / Teams
# - real Review Session persistence
# - real Session Delta or evidence
# - real AI generation
# - real Meeting Notes generation
# - real email send
# - navigation changes
#
# Synthetic data only. Nothing in this block is functional evidence.

