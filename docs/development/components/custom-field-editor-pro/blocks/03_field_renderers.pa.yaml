# CF-03 — cmp_CustomFieldEditorPro PREMIUM FIELD RENDERERS
#
# Operation: REPLACE CONTROL COMPLETELY.
# Target control: conCFEPro_Body
# Parent: conCFEPro_Root
# Component version required: CF-02 working buffer.
#
# PRE-YAML GATE APPLIED
# docs/development/screens/punch-review/
# POWER_APPS_SOURCE_CODE_COMPATIBILITY.md was read immediately before
# drafting and correcting this YAML.
#
# Purpose:
# - replace the CF-02 preview/debug body with the production-style field list;
# - render the six backend-supported field types;
# - write every edit into colCFEPro_Working;
# - keep exactly one sparse dirty payload row per FieldKey;
# - show Required, type and Modified metadata without introducing new backend
#   contracts or host events.
#
# Supported types:
# - Text
# - Number
# - Date
# - YesNo
# - Choice
# - MultiChoice
#
# Confirmed control versions reused from the current Punch Review / drawer:
# - Gallery@2.15.0
# - Label@2.5.1
# - GroupContainer@1.5.0
# - Rectangle@2.3.0
# - ModernTextInput@1.1.1
# - ModernNumberInput@1.1.1
# - ModernDatePicker@1.0.1
# - Toggle@1.1.5
# - Classic/ComboBox@2.4.0
#
# Compatibility rules applied:
# - no SVG inline;
# - no nested CanvasComponent dependency;
# - no Radius* on Label@2.5.1;
# - no AccessibleLabel on Classic/Button@2.2.0;
# - Toggle initial Boolean state uses Checked;
# - no Reset() assumptions;
# - Choice/MultiChoice OptionsJson contract matches the already used drawer
#   and Punch Review implementation.
# - JSON strings for MultiChoice are produced with JSON(..., JSONFormat.Compact)
#   rather than hand-escaped quote/backslash literals.
#
# Important:
# - CF-03 does not call flows.
# - CF-03 does not yet emit a host OnChange event; that belongs to CF-04.
# - Save remains the CF-02 OnSaveRequested host event.
# - Reset remains the CF-02 internal reset + OnResetRequested host event.
#
# Validation gate:
# 1. Replace only conCFEPro_Body from CF-02 with this complete control.
# 2. Studio accepts the component without PA1001 / PA2108 / PA2301 or formula errors.
# 3. Test Items must include all six supported FieldTypes.
# 4. Text, Number, Date, YesNo, Choice and MultiChoice render correctly.
# 5. Changing a field makes the header state Unsaved and DirtyCount=1.
# 6. Editing the same FieldKey repeatedly keeps one dirty row.
# 7. Editing a second FieldKey makes DirtyCount=2.
# 8. Modified badge appears only for dirty FieldKeys.
# 9. Reset restores the current Items input and removes Modified badges.
# 10. Scrolling away and back preserves working values.
# 11. MultiChoice produces a JSON array of strings such as ["A","B"].
# 12. Do not proceed to CF-04 until Studio validates this corrected block.

- conCFEPro_Body:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =cmp_CustomFieldEditorPro.BackgroundColor
      Height: =Parent.Height - 63
      Width: =Parent.Width
      Y: =63
    Children:
      - galCFEPro_Fields:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            Fill: =cmp_CustomFieldEditorPro.BackgroundColor
            Height: =Parent.Height
            Items: |-
              =SortByColumns(
                  If(
                      varCFEPro_Initialized,
                      colCFEPro_Working,
                      cmp_CustomFieldEditorPro.Items
                  ),
                  "SortOrder",
                  SortOrder.Ascending
              )
            ShowNavigation: =false
            ShowScrollbar: =true
            TemplateFill: =cmp_CustomFieldEditorPro.BackgroundColor
            TemplatePadding: =0
            TemplateSize: =122
            Visible: |-
              =!cmp_CustomFieldEditorPro.IsLoading &&
              IsBlank(cmp_CustomFieldEditorPro.ErrorText) &&
              cmp_CustomFieldEditorPro.HasFields
            Width: =Parent.Width
          Children:
            - conCFEPro_FieldRow:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: |-
                    =If(
                        !IsBlank(LookUp(colCFEPro_Dirty, FieldKey = ThisItem.FieldKey)),
                        ColorFade(cmp_CustomFieldEditorPro.WarningColor, 55%),
                        cmp_CustomFieldEditorPro.BorderColor
                    )
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: |-
                    =If(
                        !IsBlank(LookUp(colCFEPro_Dirty, FieldKey = ThisItem.FieldKey)),
                        ColorFade(cmp_CustomFieldEditorPro.WarningColor, 97%),
                        cmp_CustomFieldEditorPro.BackgroundColor
                    )
                  Height: =Parent.TemplateHeight - 8
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =Parent.TemplateWidth - 20
                  X: =10
                  Y: =4
                Children:
                  - lblCFEPro_FieldLabel:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =cmp_CustomFieldEditorPro.TextColor
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =9
                        Text: =ThisItem.FieldLabel & If(ThisItem.IsRequired, " *", "")
                        Width: =Max(90, Parent.Width - 214)
                        Wrap: =false
                        X: =12
                        Y: =8
                  - lblCFEPro_FieldKey:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =cmp_CustomFieldEditorPro.MutedTextColor
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        Height: =16
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =7
                        Text: |-
                          =ThisItem.FieldKey &
                          If(
                              IsBlank(Trim(Coalesce(ThisItem.HelpText, ""))),
                              "",
                              " · " & ThisItem.HelpText
                          )
                        Width: =Parent.Width - 24
                        Wrap: =false
                        X: =12
                        Y: =29
                  - conCFEPro_TypePill:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =cmp_CustomFieldEditorPro.BorderColor
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =cmp_CustomFieldEditorPro.SurfaceAltColor
                        Height: =21
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Width: =78
                        X: =Parent.Width - 174
                        Y: =7
                      Children:
                        - lblCFEPro_Type:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0,0,0,0)
                              Color: =cmp_CustomFieldEditorPro.MutedTextColor
                              Fill: =Color.Transparent
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =Parent.Height
                              PaddingBottom: =0
                              PaddingLeft: =2
                              PaddingRight: =2
                              PaddingTop: =0
                              Size: =6
                              Text: =Upper(ThisItem.FieldType)
                              Width: =Parent.Width
                  - conCFEPro_ModifiedPill:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ColorFade(cmp_CustomFieldEditorPro.WarningColor, 35%)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorFade(cmp_CustomFieldEditorPro.WarningColor, 90%)
                        Height: =21
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Visible: =!IsBlank(LookUp(colCFEPro_Dirty, FieldKey = ThisItem.FieldKey))
                        Width: =82
                        X: =Parent.Width - 90
                        Y: =7
                      Children:
                        - lblCFEPro_Modified:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0,0,0,0)
                              Color: =ColorValue("#92400E")
                              Fill: =Color.Transparent
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =Parent.Height
                              PaddingBottom: =0
                              PaddingLeft: =2
                              PaddingRight: =2
                              PaddingTop: =0
                              Size: =6
                              Text: ="Modified"
                              Width: =Parent.Width
                  - txtCFEPro_Text:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        Appearance: =Appearance.Outline
                        BorderColor: =cmp_CustomFieldEditorPro.BorderColor
                        Default: =ThisItem.ValueText
                        DisplayMode: |-
                          =If(
                              cmp_CustomFieldEditorPro.CanEdit && ThisItem.IsEditable,
                              DisplayMode.Edit,
                              DisplayMode.View
                          )
                        Fill: =cmp_CustomFieldEditorPro.BackgroundColor
                        Height: =52
                        OnChange: |-
                          =If(
                              !varCFEPro_Initialized,
                              ClearCollect(colCFEPro_Working, cmp_CustomFieldEditorPro.Items);
                              Set(varCFEPro_Initialized, true)
                          );

                          Patch(
                              colCFEPro_Working,
                              LookUp(colCFEPro_Working, FieldKey = ThisItem.FieldKey),
                              {ValueText: Self.Text}
                          );

                          RemoveIf(colCFEPro_Dirty, FieldKey = ThisItem.FieldKey);
                          Collect(
                              colCFEPro_Dirty,
                              {
                                  FieldKey: ThisItem.FieldKey,
                                  FieldType: ThisItem.FieldType,
                                  ValueText: Self.Text,
                                  ValueNumber: Blank(),
                                  ValueDate: Blank(),
                                  ValueBool: false,
                                  ValueJson: ""
                              }
                          );
                          Set(varCFEPro_LastChangedFieldKey, ThisItem.FieldKey)
                        Placeholder: ="Enter value..."
                        Type: =TextInputType.Multiline
                        Visible: =Lower(Trim(ThisItem.FieldType)) = "text"
                        Width: =Parent.Width - 24
                        X: =12
                        Y: =51
                  - numCFEPro_Number:
                      Control: ModernNumberInput@1.1.1
                      Properties:
                        Default: =If(IsBlank(ThisItem.ValueNumber), Blank(), Text(ThisItem.ValueNumber))
                        DisplayMode: |-
                          =If(
                              cmp_CustomFieldEditorPro.CanEdit && ThisItem.IsEditable,
                              DisplayMode.Edit,
                              DisplayMode.View
                          )
                        Height: =38
                        OnChange: |-
                          =If(
                              !varCFEPro_Initialized,
                              ClearCollect(colCFEPro_Working, cmp_CustomFieldEditorPro.Items);
                              Set(varCFEPro_Initialized, true)
                          );

                          Patch(
                              colCFEPro_Working,
                              LookUp(colCFEPro_Working, FieldKey = ThisItem.FieldKey),
                              {ValueNumber: If(IsBlank(Self.Value), Blank(), Value(Self.Value))}
                          );

                          RemoveIf(colCFEPro_Dirty, FieldKey = ThisItem.FieldKey);
                          Collect(
                              colCFEPro_Dirty,
                              {
                                  FieldKey: ThisItem.FieldKey,
                                  FieldType: ThisItem.FieldType,
                                  ValueText: "",
                                  ValueNumber: If(IsBlank(Self.Value), Blank(), Value(Self.Value)),
                                  ValueDate: Blank(),
                                  ValueBool: false,
                                  ValueJson: ""
                              }
                          );
                          Set(varCFEPro_LastChangedFieldKey, ThisItem.FieldKey)
                        Visible: =Lower(Trim(ThisItem.FieldType)) = "number"
                        Width: =Parent.Width - 24
                        X: =12
                        Y: =58
                  - dpCFEPro_Date:
                      Control: ModernDatePicker@1.0.1
                      Properties:
                        Appearance: =Appearance.Outline
                        DefaultDate: =ThisItem.ValueDate
                        DisplayMode: |-
                          =If(
                              cmp_CustomFieldEditorPro.CanEdit && ThisItem.IsEditable,
                              DisplayMode.Edit,
                              DisplayMode.View
                          )
                        Height: =38
                        OnChange: |-
                          =If(
                              !varCFEPro_Initialized,
                              ClearCollect(colCFEPro_Working, cmp_CustomFieldEditorPro.Items);
                              Set(varCFEPro_Initialized, true)
                          );

                          Patch(
                              colCFEPro_Working,
                              LookUp(colCFEPro_Working, FieldKey = ThisItem.FieldKey),
                              {ValueDate: Self.SelectedDate}
                          );

                          RemoveIf(colCFEPro_Dirty, FieldKey = ThisItem.FieldKey);
                          Collect(
                              colCFEPro_Dirty,
                              {
                                  FieldKey: ThisItem.FieldKey,
                                  FieldType: ThisItem.FieldType,
                                  ValueText: "",
                                  ValueNumber: Blank(),
                                  ValueDate: Self.SelectedDate,
                                  ValueBool: false,
                                  ValueJson: ""
                              }
                          );
                          Set(varCFEPro_LastChangedFieldKey, ThisItem.FieldKey)
                        Visible: =Lower(Trim(ThisItem.FieldType)) = "date"
                        Width: =Parent.Width - 24
                        X: =12
                        Y: =58
                  - tglCFEPro_YesNo:
                      Control: Toggle@1.1.5
                      Properties:
                        Checked: =ThisItem.ValueBool
                        DisplayMode: |-
                          =If(
                              cmp_CustomFieldEditorPro.CanEdit && ThisItem.IsEditable,
                              DisplayMode.Edit,
                              DisplayMode.View
                          )
                        Height: =38
                        Label: =If(ThisItem.ValueBool, "Yes", "No")
                        OnCheck: |-
                          =If(
                              !varCFEPro_Initialized,
                              ClearCollect(colCFEPro_Working, cmp_CustomFieldEditorPro.Items);
                              Set(varCFEPro_Initialized, true)
                          );

                          Patch(
                              colCFEPro_Working,
                              LookUp(colCFEPro_Working, FieldKey = ThisItem.FieldKey),
                              {ValueBool: true}
                          );

                          RemoveIf(colCFEPro_Dirty, FieldKey = ThisItem.FieldKey);
                          Collect(
                              colCFEPro_Dirty,
                              {
                                  FieldKey: ThisItem.FieldKey,
                                  FieldType: ThisItem.FieldType,
                                  ValueText: "",
                                  ValueNumber: Blank(),
                                  ValueDate: Blank(),
                                  ValueBool: true,
                                  ValueJson: ""
                              }
                          );
                          Set(varCFEPro_LastChangedFieldKey, ThisItem.FieldKey)
                        OnUncheck: |-
                          =If(
                              !varCFEPro_Initialized,
                              ClearCollect(colCFEPro_Working, cmp_CustomFieldEditorPro.Items);
                              Set(varCFEPro_Initialized, true)
                          );

                          Patch(
                              colCFEPro_Working,
                              LookUp(colCFEPro_Working, FieldKey = ThisItem.FieldKey),
                              {ValueBool: false}
                          );

                          RemoveIf(colCFEPro_Dirty, FieldKey = ThisItem.FieldKey);
                          Collect(
                              colCFEPro_Dirty,
                              {
                                  FieldKey: ThisItem.FieldKey,
                                  FieldType: ThisItem.FieldType,
                                  ValueText: "",
                                  ValueNumber: Blank(),
                                  ValueDate: Blank(),
                                  ValueBool: false,
                                  ValueJson: ""
                              }
                          );
                          Set(varCFEPro_LastChangedFieldKey, ThisItem.FieldKey)
                        Visible: =Lower(Trim(ThisItem.FieldType)) = "yesno"
                        Width: =Parent.Width - 24
                        X: =12
                        Y: =58
                  - cmbCFEPro_Choice:
                      Control: Classic/ComboBox@2.4.0
                      Properties:
                        BorderColor: =cmp_CustomFieldEditorPro.BorderColor
                        ChevronBackground: =cmp_CustomFieldEditorPro.SurfaceAltColor
                        ChevronDisabledBackground: =cmp_CustomFieldEditorPro.SurfaceAltColor
                        ChevronDisabledFill: =cmp_CustomFieldEditorPro.MutedTextColor
                        ChevronFill: =cmp_CustomFieldEditorPro.TextColor
                        ChevronHoverBackground: =ColorFade(cmp_CustomFieldEditorPro.AccentColor, 92%)
                        ChevronHoverFill: =cmp_CustomFieldEditorPro.AccentColor
                        Color: =cmp_CustomFieldEditorPro.TextColor
                        DefaultSelectedItems: |-
                          =If(
                              Lower(Trim(ThisItem.FieldType)) = "choice",
                              If(
                                  IsBlank(ThisItem.ValueText),
                                  Blank(),
                                  Table({Value: ThisItem.ValueText})
                              ),
                              If(
                                  Lower(Trim(ThisItem.FieldType)) = "multichoice",
                                  If(
                                      IsBlank(ThisItem.ValueJson),
                                      Blank(),
                                      ForAll(
                                          Table(ParseJSON(ThisItem.ValueJson)),
                                          {Value: Text(Value)}
                                      )
                                  ),
                                  Blank()
                              )
                          )
                        DisabledBorderColor: =cmp_CustomFieldEditorPro.BorderColor
                        DisabledColor: =cmp_CustomFieldEditorPro.MutedTextColor
                        DisabledFill: =cmp_CustomFieldEditorPro.SurfaceAltColor
                        DisplayFields: =["Value"]
                        DisplayMode: |-
                          =If(
                              cmp_CustomFieldEditorPro.CanEdit && ThisItem.IsEditable,
                              DisplayMode.Edit,
                              DisplayMode.View
                          )
                        Fill: =cmp_CustomFieldEditorPro.BackgroundColor
                        Font: =Font.'Segoe UI'
                        Height: =38
                        HoverBorderColor: =cmp_CustomFieldEditorPro.AccentColor
                        HoverColor: =cmp_CustomFieldEditorPro.TextColor
                        HoverFill: =cmp_CustomFieldEditorPro.SurfaceAltColor
                        Items: |-
                          =ForAll(
                              Table(ParseJSON(Coalesce(ThisItem.OptionsJson, "[]"))),
                              {Value: Text(Value)}
                          )
                        OnChange: |-
                          =If(
                              !varCFEPro_Initialized,
                              ClearCollect(colCFEPro_Working, cmp_CustomFieldEditorPro.Items);
                              Set(varCFEPro_Initialized, true)
                          );

                          RemoveIf(colCFEPro_Dirty, FieldKey = ThisItem.FieldKey);

                          If(
                              Lower(Trim(ThisItem.FieldType)) = "choice",

                              Patch(
                                  colCFEPro_Working,
                                  LookUp(colCFEPro_Working, FieldKey = ThisItem.FieldKey),
                                  {ValueText: Coalesce(Self.Selected.Value, "")}
                              );
                              Collect(
                                  colCFEPro_Dirty,
                                  {
                                      FieldKey: ThisItem.FieldKey,
                                      FieldType: ThisItem.FieldType,
                                      ValueText: Coalesce(Self.Selected.Value, ""),
                                      ValueNumber: Blank(),
                                      ValueDate: Blank(),
                                      ValueBool: false,
                                      ValueJson: ""
                                  }
                              ),

                              With(
                                  {
                                      encoded:
                                          "[" &
                                          Concat(
                                              Self.SelectedItems,
                                              JSON(Value, JSONFormat.Compact),
                                              ","
                                          ) &
                                          "]"
                                  },
                                  Patch(
                                      colCFEPro_Working,
                                      LookUp(colCFEPro_Working, FieldKey = ThisItem.FieldKey),
                                      {ValueJson: encoded}
                                  );
                                  Collect(
                                      colCFEPro_Dirty,
                                      {
                                          FieldKey: ThisItem.FieldKey,
                                          FieldType: ThisItem.FieldType,
                                          ValueText: "",
                                          ValueNumber: Blank(),
                                          ValueDate: Blank(),
                                          ValueBool: false,
                                          ValueJson: encoded
                                      }
                                  )
                              )
                          );
                          Set(varCFEPro_LastChangedFieldKey, ThisItem.FieldKey)
                        PressedBorderColor: =cmp_CustomFieldEditorPro.AccentColor
                        PressedColor: =Color.White
                        PressedFill: =cmp_CustomFieldEditorPro.AccentColor
                        SearchFields: =["Value"]
                        SelectMultiple: =Lower(Trim(ThisItem.FieldType)) = "multichoice"
                        SelectionColor: =Color.White
                        SelectionFill: =cmp_CustomFieldEditorPro.AccentColor
                        Visible: |-
                          =Lower(Trim(ThisItem.FieldType)) = "choice" ||
                          Lower(Trim(ThisItem.FieldType)) = "multichoice"
                        Width: =Parent.Width - 24
                        X: =12
                        Y: =58
      - conCFEPro_LoadingState:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =cmp_CustomFieldEditorPro.BackgroundColor
            Height: =Parent.Height
            Visible: =cmp_CustomFieldEditorPro.IsLoading
            Width: =Parent.Width
          Children:
            - lblCFEPro_LoadingTitle:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =cmp_CustomFieldEditorPro.TextColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =9
                  Text: ="Loading custom fields..."
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =Max(30, (Parent.Height - 46) / 2)
            - lblCFEPro_LoadingBody:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =cmp_CustomFieldEditorPro.MutedTextColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =20
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =7
                  Text: ="Definitions and current values are being prepared."
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =lblCFEPro_LoadingTitle.Y + 25
      - conCFEPro_ErrorState:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =cmp_CustomFieldEditorPro.BackgroundColor
            Height: =Parent.Height
            Visible: =!cmp_CustomFieldEditorPro.IsLoading && !IsBlank(cmp_CustomFieldEditorPro.ErrorText)
            Width: =Parent.Width
          Children:
            - lblCFEPro_ErrorTitle:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =cmp_CustomFieldEditorPro.DangerColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =9
                  Text: ="Custom fields unavailable"
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =Max(24, (Parent.Height - 70) / 2)
            - lblCFEPro_ErrorBody:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =cmp_CustomFieldEditorPro.MutedTextColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =44
                  PaddingBottom: =0
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =0
                  Size: =7
                  Text: =cmp_CustomFieldEditorPro.ErrorText
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.Width - 60
                  X: =30
                  Y: =lblCFEPro_ErrorTitle.Y + 27
      - conCFEPro_EmptyState:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =cmp_CustomFieldEditorPro.BackgroundColor
            Height: =Parent.Height
            Visible: |-
              =!cmp_CustomFieldEditorPro.IsLoading &&
              IsBlank(cmp_CustomFieldEditorPro.ErrorText) &&
              !cmp_CustomFieldEditorPro.HasFields
            Width: =Parent.Width
          Children:
            - lblCFEPro_EmptyTitle:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =cmp_CustomFieldEditorPro.TextColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =9
                  Text: ="No custom fields"
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =Max(30, (Parent.Height - 46) / 2)
            - lblCFEPro_EmptyBody:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =cmp_CustomFieldEditorPro.MutedTextColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =20
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =7
                  Text: ="This record has no configured custom fields."
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =lblCFEPro_EmptyTitle.Y + 25
