# CF-02 — cmp_CustomFieldEditorPro WORKING BUFFER + DIRTY TRACKING
#
# Operation: REPLACE THE COMPLETE cmp_CustomFieldEditorPro DEFINITION created
# by CF-01 with this version.
#
# PRE-YAML GATE APPLIED
# docs/development/screens/punch-review/
# POWER_APPS_SOURCE_CODE_COMPATIBILITY.md was read immediately before
# drafting this YAML.
#
# Dependencies:
# - CF-01 component shell accepted by Power Apps Studio.
#
# Purpose:
# - initialize a working table from Items;
# - keep a sparse dirty payload keyed by FieldKey;
# - expose EditedItems, DirtyItems, IsDirty, DirtyCount and
#   LastChangedFieldKey;
# - make Reset restore the current Items input;
# - calculate Saved / Unsaved from real internal dirty state;
# - provide temporary DebugMode controls so CF-02 can be validated before
#   the real field renderers arrive in CF-03.
#
# No backend / flow calls are introduced.
#
# IMPORTANT IMPLEMENTATION NOTE
# v1 uses uniquely-prefixed app-scope collections/variables for the working
# buffer because Canvas Components do not provide a general-purpose local
# table variable. The first production consumer uses one active editor
# instance. Multi-instance hardening is outside CF-02 and must not be assumed.
#
# Compatibility rules applied:
# - no SVG inline;
# - no nested CanvasComponent dependency;
# - no Radius* on Label@2.5.1;
# - no AccessibleLabel on Classic/Button@2.2.0;
# - no Reset() call on an unconfirmed control;
# - new Boolean/Text state gets unequivocal first assignments in OnReset;
# - only control versions already used by PULSE are used.
#
# Validation gate:
# 1. Replace CF-01 definition with this complete source.
# 2. Studio imports without PA1001 / PA2108 / PA2301.
# 3. Set DebugMode=true on a temporary instance.
# 4. Component starts with DirtyCount=0 and Saved state.
# 5. Select "Simulate edit" once: DirtyCount=1 and state becomes Unsaved.
# 6. Select it repeatedly: DirtyCount remains 1 for the same FieldKey.
# 7. Select Reset: DirtyCount returns to 0, LastChangedFieldKey clears and
#    EditedItems returns to the current Items input.
# 8. Do not proceed to CF-03 until Studio validates this behavior.

ComponentDefinitions:
  cmp_CustomFieldEditorPro:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      Items:
        PropertyKind: Input
        DisplayName: Items
        Description: Normalized custom-field table supplied by the host
        DataType: Table
        Default: |-
          =Table(
              {
                  FieldKey: "sample_field",
                  FieldLabel: "Sample field",
                  FieldType: "Text",
                  HelpText: "",
                  IsRequired: false,
                  IsPinned: true,
                  IsEditable: true,
                  SortOrder: 10,
                  OptionsJson: "[]",
                  ValueText: "Sample value",
                  ValueNumber: 0,
                  ValueDate: Date(2000,1,1),
                  ValueBool: false,
                  ValueJson: "",
                  LastUpdatedOn: Date(2000,1,1),
                  LastUpdatedByEmail: ""
              }
          )
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Panel title
        DataType: Text
        Default: ="Custom Fields"
      Subtitle:
        PropertyKind: Input
        DisplayName: Subtitle
        Description: Optional panel subtitle
        DataType: Text
        Default: ="Record metadata"
      RecordLabel:
        PropertyKind: Input
        DisplayName: RecordLabel
        Description: Current record code or label
        DataType: Text
        Default: ="PUNCH-000001"
      Status:
        PropertyKind: Input
        DisplayName: Status
        Description: READY, EMPTY or ERROR host state. UNSAVED is derived internally.
        DataType: Text
        Default: ="READY"
      CanEdit:
        PropertyKind: Input
        DisplayName: CanEdit
        Description: Enables editing actions for the current user
        DataType: Boolean
        Default: =true
      IsLoading:
        PropertyKind: Input
        DisplayName: IsLoading
        Description: Host is loading custom fields
        DataType: Boolean
        Default: =false
      IsSaving:
        PropertyKind: Input
        DisplayName: IsSaving
        Description: Host is saving custom fields
        DataType: Boolean
        Default: =false
      ErrorText:
        PropertyKind: Input
        DisplayName: ErrorText
        Description: Host error message
        DataType: Text
        Default: =""
      DebugMode:
        PropertyKind: Input
        DisplayName: DebugMode
        Description: Temporary CF-02 validation controls. Keep false in production.
        DataType: Boolean
        Default: =false
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Primary interaction color
        DataType: Color
        Default: =ColorValue("#1677FF")
      BackgroundColor:
        PropertyKind: Input
        DisplayName: BackgroundColor
        Description: Main surface color
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      SurfaceAltColor:
        PropertyKind: Input
        DisplayName: SurfaceAltColor
        Description: Alternate surface color
        DataType: Color
        Default: =ColorValue("#F8FAFC")
      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        Description: Border and divider color
        DataType: Color
        Default: =ColorValue("#E2E8F0")
      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Primary text color
        DataType: Color
        Default: =ColorValue("#0F172A")
      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Secondary text color
        DataType: Color
        Default: =ColorValue("#64748B")
      SuccessColor:
        PropertyKind: Input
        DisplayName: SuccessColor
        Description: Saved-state color
        DataType: Color
        Default: =ColorValue("#22C55E")
      WarningColor:
        PropertyKind: Input
        DisplayName: WarningColor
        Description: Unsaved-state color
        DataType: Color
        Default: =ColorValue("#F59E0B")
      DangerColor:
        PropertyKind: Input
        DisplayName: DangerColor
        Description: Error-state color
        DataType: Color
        Default: =ColorValue("#EF4444")
      HasFields:
        PropertyKind: Output
        DisplayName: HasFields
        Description: True when Items contains at least one field
        DataType: Boolean
      FieldCount:
        PropertyKind: Output
        DisplayName: FieldCount
        Description: Number of fields received by the component
        DataType: Number
      EditedItems:
        PropertyKind: Output
        DisplayName: EditedItems
        Description: Full working table after local edits
        DataType: Table
      DirtyItems:
        PropertyKind: Output
        DisplayName: DirtyItems
        Description: Sparse save payload with one row per changed FieldKey
        DataType: Table
      IsDirty:
        PropertyKind: Output
        DisplayName: IsDirty
        Description: True when at least one field has a local change
        DataType: Boolean
      DirtyCount:
        PropertyKind: Output
        DisplayName: DirtyCount
        Description: Number of unique dirty FieldKeys
        DataType: Number
      LastChangedFieldKey:
        PropertyKind: Output
        DisplayName: LastChangedFieldKey
        Description: FieldKey changed most recently
        DataType: Text
      OnRefresh:
        PropertyKind: Event
        DisplayName: OnRefresh
        Description: Host refresh requested
        ReturnType: None
        Default: =
      OnResetRequested:
        PropertyKind: Event
        DisplayName: OnResetRequested
        Description: Host reset requested after internal reset
        ReturnType: None
        Default: =
      OnSaveRequested:
        PropertyKind: Event
        DisplayName: OnSaveRequested
        Description: Host save requested
        ReturnType: None
        Default: =
    Properties:
      EditedItems: |-
        =If(
            varCFEPro_Initialized,
            colCFEPro_Working,
            cmp_CustomFieldEditorPro.Items
        )
      DirtyItems: =colCFEPro_Dirty
      DirtyCount: =CountRows(colCFEPro_Dirty)
      FieldCount: =CountRows(cmp_CustomFieldEditorPro.Items)
      HasFields: =CountRows(cmp_CustomFieldEditorPro.Items) > 0
      Height: =340
      IsDirty: =CountRows(colCFEPro_Dirty) > 0
      LastChangedFieldKey: =Coalesce(varCFEPro_LastChangedFieldKey, "")
      OnReset: |-
        =Set(varCFEPro_Initialized, false);
        Set(varCFEPro_LastChangedFieldKey, "");

        ClearCollect(
            colCFEPro_Working,
            cmp_CustomFieldEditorPro.Items
        );

        ClearCollect(
            colCFEPro_Dirty,
            {
                FieldKey: "",
                FieldType: "",
                ValueText: "",
                ValueNumber: 0,
                ValueDate: Date(2000,1,1),
                ValueBool: false,
                ValueJson: ""
            }
        );
        Clear(colCFEPro_Dirty);

        Set(varCFEPro_Initialized, true)
      Width: =560
    Children:
      - conCFEPro_Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =cmp_CustomFieldEditorPro.BorderColor
            BorderThickness: =1
            DropShadow: =DropShadow.Semilight
            Fill: =cmp_CustomFieldEditorPro.BackgroundColor
            Height: =Parent.Height
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            RadiusTopLeft: =14
            RadiusTopRight: =14
            Width: =Parent.Width
          Children:
            - conCFEPro_Header:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =cmp_CustomFieldEditorPro.BackgroundColor
                  Height: =62
                  Width: =Parent.Width
                Children:
                  - lblCFEPro_Title:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =cmp_CustomFieldEditorPro.TextColor
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                        Text: =cmp_CustomFieldEditorPro.Title
                        Width: =Max(100, Parent.Width - 320)
                        X: =14
                        Y: =7
                  - lblCFEPro_Record:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =cmp_CustomFieldEditorPro.MutedTextColor
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        Height: =18
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =8
                        Text: |-
                          =If(
                              IsBlank(cmp_CustomFieldEditorPro.RecordLabel),
                              cmp_CustomFieldEditorPro.Subtitle,
                              cmp_CustomFieldEditorPro.RecordLabel
                          )
                        Width: =Max(100, Parent.Width - 320)
                        X: =14
                        Y: =31
                  - conCFEPro_StatusPill:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: |-
                          =If(
                              cmp_CustomFieldEditorPro.IsLoading || cmp_CustomFieldEditorPro.IsSaving,
                              cmp_CustomFieldEditorPro.AccentColor,
                              !IsBlank(cmp_CustomFieldEditorPro.ErrorText) || Upper(Trim(Coalesce(cmp_CustomFieldEditorPro.Status, "READY"))) = "ERROR",
                              cmp_CustomFieldEditorPro.DangerColor,
                              cmp_CustomFieldEditorPro.IsDirty,
                              cmp_CustomFieldEditorPro.WarningColor,
                              !cmp_CustomFieldEditorPro.HasFields || Upper(Trim(Coalesce(cmp_CustomFieldEditorPro.Status, "READY"))) = "EMPTY",
                              cmp_CustomFieldEditorPro.BorderColor,
                              cmp_CustomFieldEditorPro.SuccessColor
                          )
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: |-
                          =If(
                              cmp_CustomFieldEditorPro.IsLoading || cmp_CustomFieldEditorPro.IsSaving,
                              ColorFade(cmp_CustomFieldEditorPro.AccentColor, 92%),
                              !IsBlank(cmp_CustomFieldEditorPro.ErrorText) || Upper(Trim(Coalesce(cmp_CustomFieldEditorPro.Status, "READY"))) = "ERROR",
                              ColorFade(cmp_CustomFieldEditorPro.DangerColor, 90%),
                              cmp_CustomFieldEditorPro.IsDirty,
                              ColorFade(cmp_CustomFieldEditorPro.WarningColor, 88%),
                              !cmp_CustomFieldEditorPro.HasFields || Upper(Trim(Coalesce(cmp_CustomFieldEditorPro.Status, "READY"))) = "EMPTY",
                              cmp_CustomFieldEditorPro.SurfaceAltColor,
                              ColorFade(cmp_CustomFieldEditorPro.SuccessColor, 90%)
                          )
                        Height: =24
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        Width: =72
                        X: =Parent.Width - 270
                        Y: =19
                      Children:
                        - lblCFEPro_Status:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0,0,0,0)
                              Color: |-
                                =If(
                                    cmp_CustomFieldEditorPro.IsSaving || cmp_CustomFieldEditorPro.IsLoading,
                                    cmp_CustomFieldEditorPro.AccentColor,
                                    !IsBlank(cmp_CustomFieldEditorPro.ErrorText) || Upper(Trim(Coalesce(cmp_CustomFieldEditorPro.Status, "READY"))) = "ERROR",
                                    ColorValue("#991B1B"),
                                    cmp_CustomFieldEditorPro.IsDirty,
                                    ColorValue("#92400E"),
                                    !cmp_CustomFieldEditorPro.HasFields || Upper(Trim(Coalesce(cmp_CustomFieldEditorPro.Status, "READY"))) = "EMPTY",
                                    cmp_CustomFieldEditorPro.MutedTextColor,
                                    ColorValue("#166534")
                                )
                              Fill: =Color.Transparent
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =Parent.Height
                              PaddingBottom: =0
                              PaddingLeft: =2
                              PaddingRight: =2
                              PaddingTop: =0
                              Size: =7
                              Text: |-
                                =If(
                                    cmp_CustomFieldEditorPro.IsSaving,
                                    "Saving...",
                                    cmp_CustomFieldEditorPro.IsLoading,
                                    "Loading...",
                                    !IsBlank(cmp_CustomFieldEditorPro.ErrorText) || Upper(Trim(Coalesce(cmp_CustomFieldEditorPro.Status, "READY"))) = "ERROR",
                                    "Error",
                                    !cmp_CustomFieldEditorPro.HasFields || Upper(Trim(Coalesce(cmp_CustomFieldEditorPro.Status, "READY"))) = "EMPTY",
                                    "Empty",
                                    cmp_CustomFieldEditorPro.IsDirty,
                                    "Unsaved",
                                    "Saved"
                                )
                              Width: =Parent.Width
                  - btnCFEPro_Refresh:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =cmp_CustomFieldEditorPro.BorderColor
                        BorderThickness: =1
                        Color: =cmp_CustomFieldEditorPro.AccentColor
                        DisplayMode: |-
                          =If(
                              cmp_CustomFieldEditorPro.IsLoading || cmp_CustomFieldEditorPro.IsSaving || cmp_CustomFieldEditorPro.IsDirty,
                              DisplayMode.Disabled,
                              DisplayMode.Edit
                          )
                        Fill: =cmp_CustomFieldEditorPro.BackgroundColor
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =28
                        HoverFill: =cmp_CustomFieldEditorPro.SurfaceAltColor
                        OnSelect: =cmp_CustomFieldEditorPro.OnRefresh()
                        RadiusBottomLeft: =7
                        RadiusBottomRight: =7
                        RadiusTopLeft: =7
                        RadiusTopRight: =7
                        Size: =8
                        Text: ="↻"
                        Width: =32
                        X: =Parent.Width - 190
                        Y: =17
                  - btnCFEPro_Reset:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =cmp_CustomFieldEditorPro.BorderColor
                        BorderThickness: =1
                        Color: =cmp_CustomFieldEditorPro.MutedTextColor
                        DisplayMode: |-
                          =If(
                              !cmp_CustomFieldEditorPro.CanEdit ||
                              cmp_CustomFieldEditorPro.IsLoading ||
                              cmp_CustomFieldEditorPro.IsSaving ||
                              !cmp_CustomFieldEditorPro.IsDirty,
                              DisplayMode.Disabled,
                              DisplayMode.Edit
                          )
                        Fill: =cmp_CustomFieldEditorPro.BackgroundColor
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =28
                        HoverFill: =cmp_CustomFieldEditorPro.SurfaceAltColor
                        OnSelect: |-
                          =Set(varCFEPro_Initialized, false);
                          Set(varCFEPro_LastChangedFieldKey, "");
                          ClearCollect(colCFEPro_Working, cmp_CustomFieldEditorPro.Items);
                          Clear(colCFEPro_Dirty);
                          Set(varCFEPro_Initialized, true);
                          cmp_CustomFieldEditorPro.OnResetRequested()
                        RadiusBottomLeft: =7
                        RadiusBottomRight: =7
                        RadiusTopLeft: =7
                        RadiusTopRight: =7
                        Size: =8
                        Text: ="Reset"
                        Width: =58
                        X: =Parent.Width - 150
                        Y: =17
                  - btnCFEPro_Save:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =cmp_CustomFieldEditorPro.AccentColor
                        BorderThickness: =1
                        Color: =Color.White
                        DisplayMode: |-
                          =If(
                              !cmp_CustomFieldEditorPro.CanEdit ||
                              cmp_CustomFieldEditorPro.IsLoading ||
                              cmp_CustomFieldEditorPro.IsSaving ||
                              !cmp_CustomFieldEditorPro.IsDirty,
                              DisplayMode.Disabled,
                              DisplayMode.Edit
                          )
                        Fill: =cmp_CustomFieldEditorPro.AccentColor
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =28
                        HoverFill: =ColorFade(cmp_CustomFieldEditorPro.AccentColor, -12%)
                        OnSelect: =cmp_CustomFieldEditorPro.OnSaveRequested()
                        RadiusBottomLeft: =7
                        RadiusBottomRight: =7
                        RadiusTopLeft: =7
                        RadiusTopRight: =7
                        Size: =8
                        Text: =If(cmp_CustomFieldEditorPro.IsSaving, "Saving...", "Save")
                        Width: =68
                        X: =Parent.Width - 84
                        Y: =17
            - rectCFEPro_HeaderDivider:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderStyle: =BorderStyle.None
                  Fill: =cmp_CustomFieldEditorPro.BorderColor
                  Height: =1
                  Width: =Parent.Width
                  Y: =62
            - conCFEPro_Body:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =cmp_CustomFieldEditorPro.BackgroundColor
                  Height: =Parent.Height - 63
                  Width: =Parent.Width
                  Y: =63
                Children:
                  - conCFEPro_BodyPreview:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =cmp_CustomFieldEditorPro.BorderColor
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =cmp_CustomFieldEditorPro.SurfaceAltColor
                        Height: =If(cmp_CustomFieldEditorPro.DebugMode, 152, 92)
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        Width: =Parent.Width - 28
                        X: =14
                        Y: =16
                      Children:
                        - lblCFEPro_BodyPreviewTitle:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              Color: =cmp_CustomFieldEditorPro.TextColor
                              Fill: =Color.Transparent
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =9
                              Text: |-
                                =If(
                                    cmp_CustomFieldEditorPro.HasFields,
                                    Text(cmp_CustomFieldEditorPro.FieldCount) & " fields · " & Text(cmp_CustomFieldEditorPro.DirtyCount) & " modified",
                                    "No custom fields"
                                )
                              Width: =Parent.Width - 24
                              X: =12
                              Y: =13
                        - lblCFEPro_BodyPreviewText:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              Color: =cmp_CustomFieldEditorPro.MutedTextColor
                              Fill: =Color.Transparent
                              Font: =Font.'Segoe UI'
                              Height: =38
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =8
                              Text: |-
                                =If(
                                    cmp_CustomFieldEditorPro.IsLoading,
                                    "Loading field definitions and values...",
                                    !IsBlank(cmp_CustomFieldEditorPro.ErrorText),
                                    cmp_CustomFieldEditorPro.ErrorText,
                                    cmp_CustomFieldEditorPro.HasFields,
                                    "CF-02 owns a working copy and one sparse dirty row per FieldKey. Real field editors arrive in CF-03.",
                                    "The host has not supplied any field records."
                                )
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width - 24
                              X: =12
                              Y: =40
                        - btnCFEPro_DebugChange:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =cmp_CustomFieldEditorPro.AccentColor
                              BorderThickness: =1
                              Color: =cmp_CustomFieldEditorPro.AccentColor
                              DisplayMode: |-
                                =If(
                                    !cmp_CustomFieldEditorPro.HasFields ||
                                    Lower(Trim(Coalesce(First(cmp_CustomFieldEditorPro.Items).FieldType, ""))) <> "text",
                                    DisplayMode.Disabled,
                                    DisplayMode.Edit
                                )
                              Fill: =cmp_CustomFieldEditorPro.BackgroundColor
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =30
                              HoverFill: =ColorFade(cmp_CustomFieldEditorPro.AccentColor, 92%)
                              OnSelect: |-
                                =If(
                                    !varCFEPro_Initialized || CountRows(colCFEPro_Working) = 0,
                                    ClearCollect(colCFEPro_Working, cmp_CustomFieldEditorPro.Items);
                                    Set(varCFEPro_Initialized, true)
                                );

                                With(
                                    {f: First(colCFEPro_Working)},
                                    Patch(
                                        colCFEPro_Working,
                                        f,
                                        {
                                            ValueText:
                                                Coalesce(f.ValueText, "") &
                                                If(
                                                    EndsWith(Coalesce(f.ValueText, ""), " · edited"),
                                                    "",
                                                    " · edited"
                                                )
                                        }
                                    );

                                    RemoveIf(colCFEPro_Dirty, FieldKey = f.FieldKey);

                                    Collect(
                                        colCFEPro_Dirty,
                                        {
                                            FieldKey: f.FieldKey,
                                            FieldType: f.FieldType,
                                            ValueText: LookUp(colCFEPro_Working, FieldKey = f.FieldKey).ValueText,
                                            ValueNumber: Blank(),
                                            ValueDate: Blank(),
                                            ValueBool: false,
                                            ValueJson: ""
                                        }
                                    );

                                    Set(varCFEPro_LastChangedFieldKey, f.FieldKey)
                                )
                              RadiusBottomLeft: =7
                              RadiusBottomRight: =7
                              RadiusTopLeft: =7
                              RadiusTopRight: =7
                              Size: =8
                              Text: ="Simulate edit"
                              Visible: =cmp_CustomFieldEditorPro.DebugMode
                              Width: =106
                              X: =12
                              Y: =99
                        - lblCFEPro_DebugState:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              Color: =cmp_CustomFieldEditorPro.MutedTextColor
                              Fill: =Color.Transparent
                              Font: =Font.'Segoe UI'
                              Height: =30
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =8
                              Text: |-
                                ="DirtyCount=" & Text(cmp_CustomFieldEditorPro.DirtyCount) &
                                " · Last=" & Coalesce(cmp_CustomFieldEditorPro.LastChangedFieldKey, "—")
                              Visible: =cmp_CustomFieldEditorPro.DebugMode
                              Width: =Parent.Width - 142
                              X: =130
                              Y: =100
