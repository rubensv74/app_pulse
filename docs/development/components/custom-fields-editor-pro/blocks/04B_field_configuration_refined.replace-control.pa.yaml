# DF-04B — cmp_CustomFieldsEditorPro REFINED FIELD CONFIGURATION
#
# Operation: REPLACE CONTROL COMPLETELY.
# Target control: conCFDEPro_Editor
# Parent: cmp_CustomFieldsEditorPro > conCFDEPro_Root > conCFDEPro_Body
# Required base: DF-01 + DF-02 + DF-03A + DF-04A.
#
# PRE-YAML GATE APPLIED
# docs/development/screens/punch-review/POWER_APPS_SOURCE_CODE_COMPATIBILITY.md
# was read immediately before drafting this YAML.
#
# Purpose:
# - refine the center workspace seen after DF-04 validation;
# - make toggle ownership visually unambiguous;
# - group Behavior and Filtering as explicit subpanels;
# - increase the Choice/MultiChoice options editor height;
# - keep the exact existing local draft variables and OptionsJson contract;
# - keep backend calls outside the component.
#
# IMPORTANT
# Keep DF-03A and DF-04A formulas already applied to the catalog / type selector.
# This replacement owns the complete center editor, including the options editor.
# Do not apply the old DF-04 options replacement after this file.
#
# Compatibility rules applied:
# - valid list-of-controls root for complete control replacement;
# - no SVG;
# - no nested CanvasComponent;
# - no Radius* on Label@2.5.1;
# - no AccessibleLabel on Classic/Button@2.2.0;
# - no Reset() assumptions;
# - JSON serialization uses JSON(..., JSONFormat.Compact);
# - controls are limited to types already used in current PULSE sources.
#
# Validation gate:
# 1. Replace conCFDEPro_Editor completely.
# 2. Studio accepts the control with no Source Code/formula errors.
# 3. Existing selection still loads the DF-03/DF-04 local draft.
# 4. Requirement / Pinning / Availability each read as one visual unit.
# 5. Filtering is visually grouped and Quick filter is disabled when Filterable=false.
# 6. Choice/MultiChoice options editor shows about 4–5 lines before scroll.
# 7. Options count updates and OptionsJson remains synchronized.
# 8. Non-choice fields hide the options editor.
# 9. No flow is called.

