# DF-03 — cmp_CustomFieldsEditorPro FIELD CONFIGURATION
#
# Operation: REPLACE CONTROL COMPLETELY.
# Target control: conCFDEPro_Editor
# Parent: cmp_CustomFieldsEditorPro > conCFDEPro_Root > conCFDEPro_Body
# Required base: DF-01 component shell + DF-02 catalog.
#
# PRE-YAML GATE APPLIED
# docs/development/screens/punch-review/POWER_APPS_SOURCE_CODE_COMPATIBILITY.md
# was read immediately before drafting this YAML.
#
# Purpose:
# - replace the DF-01 center placeholder with the supported definition form;
# - edit only properties confirmed by the current backend contract;
# - keep changes in component-scoped draft variables only;
# - preserve host ownership of list/upsert/toggle flows;
# - do not expose raw OptionsJson editing; DF-04 will provide a visual options editor.
#
# IMPORTANT
# Apply 03A_definition_draft_initialization.property-guide.md before validating
# this control. DF-03 relies on the draft variables initialized by the DF-02
# catalog Add/select actions.
#
# Supported definition properties in this form:
# FieldKey, Label, FieldType, HelpText, IsRequired, IsPinned, IsActive,
# SortOrder, IsFilterable, ShowInQuickFilters, FilterOrder, FilterMode.
# OptionsJson is deliberately deferred to DF-04.
#
# Conservative edit rules:
# - existing FieldKey is read-only;
# - existing FieldType is read-only;
# - new definitions may set FieldKey and FieldType;
# - FilterMode values are limited to Equals / Contains because these are the
#   currently confirmed values in the PULSE definition contract.
#
# Compatibility rules applied:
# - valid list-of-controls root for control replacement;
# - no SVG;
# - no nested CanvasComponent;
# - no Radius* on Label@2.5.1;
# - no AccessibleLabel on Classic/Button@2.2.0;
# - no Reset() assumptions;
# - ModernTextInput@1.1.1, ModernNumberInput@1.1.1,
#   Classic/Toggle@2.1.0 and DropDown@0.0.45 are already present in PULSE.
#
# Validation gate:
# 1. Apply DF-03A property guide first.
# 2. Replace only conCFDEPro_Editor with this control.
# 3. Studio accepts it with no Source Code/formula errors.
# 4. Selecting Vendor Package loads its definition into the form.
# 5. Existing FieldKey and FieldType are read-only.
# 6. + Add field opens a blank/default draft and enables FieldKey/FieldType.
# 7. Editing any supported property makes the local Draft status Modified.
# 8. Turning Filterable off also clears Quick filter locally.
# 9. Quick filter is disabled while Filterable=false.
# 10. Choice/MultiChoice show the DF-04 options message; raw JSON is not editable.
# 11. No backend flow is called.
# 12. Do not begin DF-04 until Studio validates this increment.

