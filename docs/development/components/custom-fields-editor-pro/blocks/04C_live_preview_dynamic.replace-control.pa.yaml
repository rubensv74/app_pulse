# DF-04C — cmp_CustomFieldsEditorPro DYNAMIC LIVE PREVIEW
#
# Operation: REPLACE CONTROL COMPLETELY.
# Target control: conCFDEPro_Preview
# Parent: cmp_CustomFieldsEditorPro > conCFDEPro_Root > conCFDEPro_Body
# Required base: DF-01 + DF-02 + DF-03A + DF-04A.
#
# PRE-YAML GATE APPLIED
# docs/development/screens/punch-review/POWER_APPS_SOURCE_CODE_COMPATIBILITY.md
# was read immediately before drafting this YAML.
#
# Purpose:
# - replace the static Sample field preview with a live local preview;
# - react to Label / FieldType / HelpText / Required / Pinned / Active;
# - show option count for Choice/MultiChoice;
# - surface filtering metadata without exposing technical JSON;
# - keep preview local only and backend-free.
#
# Compatibility rules applied:
# - valid list-of-controls root for complete control replacement;
# - no SVG;
# - no nested CanvasComponent;
# - no Radius* on Label@2.5.1;
# - no AccessibleLabel on Classic/Button@2.2.0;
# - no Reset() assumptions;
# - only GroupContainer@1.5.0, Label@2.5.1 and Rectangle@2.3.0.
#
# Validation gate:
# 1. Replace conCFDEPro_Preview completely.
# 2. Studio accepts the control with no Source Code/formula errors.
# 3. Select Walkdown Area: preview label becomes Walkdown Area and type becomes Choice.
# 4. Required marker follows the draft.
# 5. Help text follows the draft.
# 6. Input simulation changes for Text / Number / Date / YesNo / Choice / MultiChoice.
# 7. Choice/MultiChoice show the current option count.
# 8. Empty selection shows the intentional preview empty state.
# 9. No flow is called.

- conCFDEPro_Preview:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderColor: =cmp_CustomFieldsEditorPro.BorderColor
      BorderThickness: =1
      DropShadow: =DropShadow.None
      Fill: =cmp_CustomFieldsEditorPro.BackgroundColor
      Height: =Parent.Height - 32
      RadiusBottomLeft: =14
      RadiusBottomRight: =14
      RadiusTopLeft: =14
      RadiusTopRight: =14
      Width: =Max(250, Min(300, Parent.Width * 0.27))
      X: =Parent.Width - Self.Width - 16
      Y: =16
    Children:
      - lblCFDEPro_PreviewTitle:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            Color: =cmp_CustomFieldsEditorPro.TextColor
            Fill: =Color.Transparent
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =24
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =10
            Text: ="Live preview"
            Width: =Parent.Width - 28
            X: =14
            Y: =12
      - lblCFDEPro_PreviewSubtitle:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            Color: =cmp_CustomFieldsEditorPro.MutedTextColor
            Fill: =Color.Transparent
            Font: =Font.'Segoe UI'
            Height: =30
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =7
            Text: ="Local representation of the selected definition. No data is written."
            VerticalAlign: =VerticalAlign.Top
            Width: =Parent.Width - 28
            X: =14
            Y: =39
      - rectCFDEPro_PreviewDivider:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            BorderStyle: =BorderStyle.None
            Fill: =cmp_CustomFieldsEditorPro.BorderColor
            Height: =1
            Width: =Parent.Width - 28
            X: =14
            Y: =74
      - conCFDEPro_PreviewContent:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - 94
            Visible: |-
              =varCFDEPro_EditMode = "ADD" ||
              !IsBlank(Coalesce(varCFDEPro_SelectedFieldKey, ""))
            Width: =Parent.Width - 28
            X: =14
            Y: =84
          Children:
            - conCFDEPro_PreviewTypePill:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =cmp_CustomFieldsEditorPro.BorderColor
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =cmp_CustomFieldsEditorPro.SurfaceAltColor
                  Height: =24
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =96
                  Y: =0
                Children:
                  - lblCFDEPro_PreviewType:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =cmp_CustomFieldsEditorPro.AccentColor
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height
                        PaddingBottom: =0
                        PaddingLeft: =4
                        PaddingRight: =4
                        PaddingTop: =0
                        Size: =6
                        Text: =Coalesce(varCFDEPro_Draft_FieldType, "Text")
                        Width: =Parent.Width
            - lblCFDEPro_PreviewFlags:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =cmp_CustomFieldsEditorPro.MutedTextColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =24
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =5
                  Text: |-
                    =If(Coalesce(varCFDEPro_Draft_IsRequired, false), "Required", "Optional") &
                    " · " &
                    If(Coalesce(varCFDEPro_Draft_IsPinned, false), "Pinned", "Not pinned")
                  Width: =Parent.Width - 104
                  X: =104
                  Y: =0
            - conCFDEPro_PreviewCard:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =cmp_CustomFieldsEditorPro.BorderColor
                  BorderThickness: =1
                  DropShadow: =DropShadow.Semilight
                  Fill: =cmp_CustomFieldsEditorPro.BackgroundColor
                  Height: =214
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =Parent.Width
                  Y: =36
                Children:
                  - lblCFDEPro_PreviewFieldLabel:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =cmp_CustomFieldsEditorPro.TextColor
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =8
                        Text: |-
                          =Coalesce(
                              If(IsBlank(Trim(Coalesce(varCFDEPro_Draft_Label, ""))), "Untitled field", varCFDEPro_Draft_Label),
                              "Untitled field"
                          ) &
                          If(Coalesce(varCFDEPro_Draft_IsRequired, false), " *", "")
                        Width: =Parent.Width - 28
                        X: =14
                        Y: =14
                  - conCFDEPro_PreviewInput:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =cmp_CustomFieldsEditorPro.BorderColor
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =cmp_CustomFieldsEditorPro.SurfaceAltColor
                        Height: =42
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width - 28
                        X: =14
                        Y: =48
                      Children:
                        - lblCFDEPro_PreviewInputText:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              Color: =cmp_CustomFieldsEditorPro.MutedTextColor
                              Fill: =Color.Transparent
                              Font: =Font.'Segoe UI'
                              Height: =Parent.Height
                              PaddingBottom: =0
                              PaddingLeft: =10
                              PaddingRight: =10
                              PaddingTop: =0
                              Size: =7
                              Text: |-
                                =Switch(
                                    Coalesce(varCFDEPro_Draft_FieldType, "Text"),
                                    "Number", "0",
                                    "Date", "Select date",
                                    "YesNo", "No",
                                    "Choice", "Select an option",
                                    "MultiChoice", "Select one or more options",
                                    "Enter text..."
                                )
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width
                  - lblCFDEPro_PreviewHelp:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =cmp_CustomFieldsEditorPro.MutedTextColor
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        Height: =48
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =6
                        Text: |-
                          =If(
                              IsBlank(Trim(Coalesce(varCFDEPro_Draft_HelpText, ""))),
                              "No help text configured.",
                              varCFDEPro_Draft_HelpText
                          )
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width - 28
                        X: =14
                        Y: =102
                  - lblCFDEPro_PreviewOptions:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =cmp_CustomFieldsEditorPro.AccentColor
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =6
                        Text: |-
                          =Text(
                              CountRows(
                                  Filter(
                                      Split(Coalesce(varCFDEPro_Draft_OptionsText, ""), Char(10)),
                                      !IsBlank(Trim(Value))
                                  )
                              )
                          ) & " configured options"
                        Visible: |-
                          =varCFDEPro_Draft_FieldType = "Choice" ||
                          varCFDEPro_Draft_FieldType = "MultiChoice"
                        Width: =Parent.Width - 28
                        X: =14
                        Y: =156
                  - lblCFDEPro_PreviewAvailability:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Color: |-
                          =If(
                              Coalesce(varCFDEPro_Draft_IsActive, true),
                              ColorValue("#166534"),
                              cmp_CustomFieldsEditorPro.MutedTextColor
                          )
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =6
                        Text: =If(Coalesce(varCFDEPro_Draft_IsActive, true), "Active definition", "Inactive definition")
                        Width: =Parent.Width - 28
                        X: =14
                        Y: =184
            - conCFDEPro_PreviewMetadata:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =cmp_CustomFieldsEditorPro.BorderColor
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =cmp_CustomFieldsEditorPro.SurfaceAltColor
                  Height: =122
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =Parent.Width
                  Y: =264
                Children:
                  - lblCFDEPro_PreviewMetaTitle:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =cmp_CustomFieldsEditorPro.TextColor
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =6
                        Text: ="Definition summary"
                        Width: =Parent.Width - 20
                        X: =10
                        Y: =8
                  - lblCFDEPro_PreviewKey:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =cmp_CustomFieldsEditorPro.MutedTextColor
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        Height: =20
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =5
                        Text: ="Key · " & Coalesce(varCFDEPro_Draft_FieldKey, "")
                        Width: =Parent.Width - 20
                        X: =10
                        Y: =32
                  - lblCFDEPro_PreviewFiltering:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =cmp_CustomFieldsEditorPro.MutedTextColor
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        Height: =34
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =5
                        Text: |-
                          =If(
                              Coalesce(varCFDEPro_Draft_IsFilterable, false),
                              "Filterable · " & Coalesce(varCFDEPro_Draft_FilterMode, "Equals") &
                              " · order " & Text(Coalesce(varCFDEPro_Draft_FilterOrder, 100)),
                              "Not filterable"
                          )
                        Width: =Parent.Width - 20
                        X: =10
                        Y: =56
                  - lblCFDEPro_PreviewQuickFilter:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =cmp_CustomFieldsEditorPro.MutedTextColor
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        Height: =20
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =5
                        Text: |-
                          =If(
                              Coalesce(varCFDEPro_Draft_ShowInQuickFilters, false),
                              "Shown in quick filters",
                              "Not shown in quick filters"
                          )
                        Width: =Parent.Width - 20
                        X: =10
                        Y: =90
      - conCFDEPro_PreviewEmpty:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =cmp_CustomFieldsEditorPro.BackgroundColor
            Height: =Parent.Height - 94
            Visible: |-
              =varCFDEPro_EditMode <> "ADD" &&
              IsBlank(Coalesce(varCFDEPro_SelectedFieldKey, ""))
            Width: =Parent.Width - 28
            X: =14
            Y: =84
          Children:
            - lblCFDEPro_PreviewEmptyTitle:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =cmp_CustomFieldsEditorPro.TextColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =28
                  PaddingBottom: =0
                  PaddingLeft: =10
                  PaddingRight: =10
                  PaddingTop: =0
                  Size: =8
                  Text: ="Nothing to preview"
                  Width: =Parent.Width
                  Y: =86
            - lblCFDEPro_PreviewEmptyBody:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0,0,0,0)
                  Color: =cmp_CustomFieldsEditorPro.MutedTextColor
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =48
                  PaddingBottom: =0
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =0
                  Size: =7
                  Text: ="Select a field from the catalog or start a new definition to see the live preview."
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.Width
                  Y: =120
