# DF-01 — cmp_CustomFieldsEditorPro COMPONENT SHELL
#
# Operation: CREATE NEW CANVAS COMPONENT DEFINITION.
# Component: cmp_CustomFieldsEditorPro
# First consumer: Punch Review Workspace
#
# PRE-YAML GATE APPLIED
# docs/development/screens/punch-review/
# POWER_APPS_SOURCE_CODE_COMPATIBILITY.md was read immediately before
# drafting this YAML.
#
# Purpose:
# - validate the new project-level definition editor component;
# - validate the confirmed Custom Field definition table schema;
# - validate a premium three-zone Catalog / Editor / Preview workspace;
# - validate only simple host events before catalog/draft/backend logic.
#
# This block intentionally does NOT:
# - call Power Automate flows;
# - require a selected Punch;
# - implement definition selection/search;
# - edit a definition draft;
# - serialize OptionsJson;
# - integrate into Punch Review yet.
#
# Compatibility rules applied:
# - valid ComponentDefinitions root;
# - no SVG inline;
# - no nested CanvasComponent dependency;
# - no Radius* on Label@2.5.1;
# - no AccessibleLabel on Classic/Button@2.2.0;
# - no Reset() assumptions;
# - only GroupContainer@1.5.0, Label@2.5.1, Classic/Button@2.2.0
#   and Rectangle@2.3.0 are introduced in this shell.
#
# Validation gate:
# 1. Create/import cmp_CustomFieldsEditorPro into the app component library.
# 2. Studio accepts it without PA1001 / PA2108 / PA2301.
# 3. Test approximately at 1000, 1120 and 1280 px width.
# 4. Catalog / Editor / Preview remain visible without overlap.
# 5. DefinitionCount and HasDefinitions react to Definitions.
# 6. Close / Refresh / Add events can be assigned on a temporary instance.
# 7. CanManage=false disables Add.
# 8. IsLoading / IsSaving / ErrorText update the status pill.
# 9. Do not proceed to DF-02 until Studio accepts this shell.

ComponentDefinitions:
  cmp_CustomFieldsEditorPro:
    DefinitionType: CanvasComponent
    CustomProperties:
      Definitions:
        PropertyKind: Input
        DisplayName: Definitions
        Description: Normalized project Custom Field definitions supplied by the host
        DataType: Table
        Default: |-
          =Table(
              {
                  FieldDefId: 0,
                  ProjectId: 0,
                  EntityType: "PUNCH",
                  FieldKey: "sample_field",
                  Label: "Sample field",
                  FieldType: "Text",
                  HelpText: "",
                  IsRequired: false,
                  IsPinned: true,
                  IsActive: true,
                  SortOrder: 100,
                  OptionsJson: "[]",
                  IsFilterable: false,
                  ShowInQuickFilters: false,
                  FilterOrder: 100,
                  FilterMode: "Equals"
              }
          )
      ProjectId:
        PropertyKind: Input
        DisplayName: ProjectId
        Description: Active project identifier
        DataType: Number
        Default: =0
      ProjectLabel:
        PropertyKind: Input
        DisplayName: ProjectLabel
        Description: Friendly active project label
        DataType: Text
        Default: ="Current project"
      EntityType:
        PropertyKind: Input
        DisplayName: EntityType
        Description: Definition entity type; first production consumer uses PUNCH
        DataType: Text
        Default: ="PUNCH"
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Editor title
        DataType: Text
        Default: ="Custom Fields"
      CanManage:
        PropertyKind: Input
        DisplayName: CanManage
        Description: Enables project-level definition management actions
        DataType: Boolean
        Default: =true
      IsLoading:
        PropertyKind: Input
        DisplayName: IsLoading
        Description: Host is loading definitions
        DataType: Boolean
        Default: =false
      IsSaving:
        PropertyKind: Input
        DisplayName: IsSaving
        Description: Host is saving a definition
        DataType: Boolean
        Default: =false
      ErrorText:
        PropertyKind: Input
        DisplayName: ErrorText
        Description: Host definition-management error
        DataType: Text
        Default: =""
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Primary interaction color
        DataType: Color
        Default: =ColorValue("#1677FF")
      BackgroundColor:
        PropertyKind: Input
        DisplayName: BackgroundColor
        Description: Main modal surface
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      SurfaceAltColor:
        PropertyKind: Input
        DisplayName: SurfaceAltColor
        Description: Alternate surface color
        DataType: Color
        Default: =ColorValue("#F8FAFC")
      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        Description: Border and divider color
        DataType: Color
        Default: =ColorValue("#E2E8F0")
      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Primary text color
        DataType: Color
        Default: =ColorValue("#0F172A")
      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Secondary text color
        DataType: Color
        Default: =ColorValue("#64748B")
      DangerColor:
        PropertyKind: Input
        DisplayName: DangerColor
        Description: Error state color
        DataType: Color
        Default: =ColorValue("#DC2626")
      HasDefinitions:
        PropertyKind: Output
        DisplayName: HasDefinitions
        Description: True when Definitions contains at least one row
        DataType: Boolean
      DefinitionCount:
        PropertyKind: Output
        DisplayName: DefinitionCount
        Description: Number of definitions received from the host
        DataType: Number
      OnClose:
        PropertyKind: Event
        DisplayName: OnClose
        Description: Host close requested
        ReturnType: None
        Default: =
      OnRefresh:
        PropertyKind: Event
        DisplayName: OnRefresh
        Description: Host refresh requested
        ReturnType: None
        Default: =
      OnAddRequested:
        PropertyKind: Event
        DisplayName: OnAddRequested
        Description: User requested a new Custom Field definition
        ReturnType: None
        Default: =
    Properties:
      DefinitionCount: =CountRows(cmp_CustomFieldsEditorPro.Definitions)
      HasDefinitions: =CountRows(cmp_CustomFieldsEditorPro.Definitions) > 0
      Height: =700
      Width: =1180
