ComponentDefinitions:
  cmp_CustomFieldsEditorPro:
    DefinitionType: CanvasComponent
    CustomProperties:
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Primary interaction color
        DataType: Color
        Default: =ColorValue("#1677FF")
      BackgroundColor:
        PropertyKind: Input
        DisplayName: BackgroundColor
        Description: Main modal surface
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        Description: Border and divider color
        DataType: Color
        Default: =ColorValue("#E2E8F0")
      CanManage:
        PropertyKind: Input
        DisplayName: CanManage
        Description: Enables project-level definition management actions
        DataType: Boolean
        Default: =true
      DangerColor:
        PropertyKind: Input
        DisplayName: DangerColor
        Description: Error state color
        DataType: Color
        Default: =ColorValue("#DC2626")
      DefinitionCount:
        PropertyKind: Output
        DisplayName: DefinitionCount
        Description: Number of definitions received from the host
        DataType: Number
      Definitions:
        PropertyKind: Input
        DisplayName: Definitions
        Description: Normalized project Custom Field definitions supplied by the host
        DataType: Table
        Default: |-
          =Table(
              {
                  FieldDefId: 0,
                  ProjectId: 0,
                  EntityType: "PUNCH",
                  FieldKey: "sample_field",
                  Label: "Sample field",
                  FieldType: "Text",
                  HelpText: "",
                  IsRequired: false,
                  IsPinned: true,
                  IsActive: true,
                  SortOrder: 100,
                  OptionsJson: "[]",
                  IsFilterable: false,
                  ShowInQuickFilters: false,
                  FilterOrder: 100,
                  FilterMode: "Equals"
              }
          )
      EntityType:
        PropertyKind: Input
        DisplayName: EntityType
        Description: Definition entity type; first production consumer uses PUNCH
        DataType: Text
        Default: ="PUNCH"
      ErrorText:
        PropertyKind: Input
        DisplayName: ErrorText
        Description: Host definition-management error
        DataType: Text
        Default: =""
      HasDefinitions:
        PropertyKind: Output
        DisplayName: HasDefinitions
        Description: True when Definitions contains at least one row
        DataType: Boolean
      IsLoading:
        PropertyKind: Input
        DisplayName: IsLoading
        Description: Host is loading definitions
        DataType: Boolean
        Default: =false
      IsSaving:
        PropertyKind: Input
        DisplayName: IsSaving
        Description: Host is saving a definition
        DataType: Boolean
        Default: =false
      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Secondary text color
        DataType: Color
        Default: =ColorValue("#64748B")
      OnAddRequested:
        PropertyKind: Event
        DisplayName: OnAddRequested
        Description: User requested a new Custom Field definition
        ReturnType: None
        Default: =
      OnClose:
        PropertyKind: Event
        DisplayName: OnClose
        Description: Host close requested
        ReturnType: None
        Default: =
      OnRefresh:
        PropertyKind: Event
        DisplayName: OnRefresh
        Description: Host refresh requested
        ReturnType: None
        Default: =
      ProjectId:
        PropertyKind: Input
        DisplayName: ProjectId
        Description: Active project identifier
        DataType: Number
        Default: =0
      ProjectLabel:
        PropertyKind: Input
        DisplayName: ProjectLabel
        Description: Friendly active project label
        DataType: Text
        Default: ="Current project"
      SurfaceAltColor:
        PropertyKind: Input
        DisplayName: SurfaceAltColor
        Description: Alternate surface color
        DataType: Color
        Default: =ColorValue("#F8FAFC")
      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Primary text color
        DataType: Color
        Default: =ColorValue("#0F172A")
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Editor title
        DataType: Text
        Default: ="Custom Fields"
    Properties:
      DefinitionCount: =CountRows(cmp_CustomFieldsEditorPro.Definitions)
      HasDefinitions: =CountRows(cmp_CustomFieldsEditorPro.Definitions) > 0
      Height: =700
      Width: =1180
    Children:
      - conCFDEPro_Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =cmp_CustomFieldsEditorPro.BorderColor
            BorderThickness: =1
            DropShadow: =DropShadow.Bold
            Fill: =cmp_CustomFieldsEditorPro.BackgroundColor
            Height: =Parent.Height
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            RadiusTopLeft: =18
            RadiusTopRight: =18
            Width: =Parent.Width
          Children:
            - conCFDEPro_Header:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =cmp_CustomFieldsEditorPro.BackgroundColor
                  Height: =72
                  Width: =Parent.Width
                Children:
                  - lblCFDEPro_Title:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =cmp_CustomFieldsEditorPro.TextColor
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =28
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =15
                        Text: =cmp_CustomFieldsEditorPro.Title
                        Width: =Max(220, Parent.Width - 390)
                        Wrap: =false
                        X: =24
                        Y: =10
                  - lblCFDEPro_Context:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Color: =cmp_CustomFieldsEditorPro.MutedTextColor
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        Height: =20
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =8
                        Text: |-
                          =Coalesce(cmp_CustomFieldsEditorPro.ProjectLabel, "Project") &
                          "  ·  " &
                          Upper(Coalesce(cmp_CustomFieldsEditorPro.EntityType, "PUNCH")) &
                          " definitions"
                        Width: =Max(220, Parent.Width - 390)
                        Wrap: =false
                        X: =24
                        Y: =41
                  - conCFDEPro_StatusPill:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: |-
                          =If(
                              !IsBlank(cmp_CustomFieldsEditorPro.ErrorText),
                              cmp_CustomFieldsEditorPro.DangerColor,
                              cmp_CustomFieldsEditorPro.IsLoading || cmp_CustomFieldsEditorPro.IsSaving,
                              cmp_CustomFieldsEditorPro.AccentColor,
                              cmp_CustomFieldsEditorPro.BorderColor
                          )
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: |-
                          =If(
                              !IsBlank(cmp_CustomFieldsEditorPro.ErrorText),
                              ColorFade(cmp_CustomFieldsEditorPro.DangerColor, 90%),
                              cmp_CustomFieldsEditorPro.IsLoading || cmp_CustomFieldsEditorPro.IsSaving,
                              ColorFade(cmp_CustomFieldsEditorPro.AccentColor, 92%),
                              cmp_CustomFieldsEditorPro.SurfaceAltColor
                          )
                        Height: =26
                        RadiusBottomLeft: =13
                        RadiusBottomRight: =13
                        RadiusTopLeft: =13
                        RadiusTopRight: =13
                        Width: =84
                        X: =Parent.Width - 286
                        Y: =23
                      Children:
                        - lblCFDEPro_Status:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0,0,0,0)
                              Color: |-
                                =If(
                                    !IsBlank(cmp_CustomFieldsEditorPro.ErrorText),
                                    cmp_CustomFieldsEditorPro.DangerColor,
                                    cmp_CustomFieldsEditorPro.IsLoading || cmp_CustomFieldsEditorPro.IsSaving,
                                    cmp_CustomFieldsEditorPro.AccentColor,
                                    cmp_CustomFieldsEditorPro.MutedTextColor
                                )
                              Fill: =Color.Transparent
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =Parent.Height
                              PaddingBottom: =0
                              PaddingLeft: =2
                              PaddingRight: =2
                              PaddingTop: =0
                              Size: =7
                              Text: |-
                                =If(
                                    !IsBlank(cmp_CustomFieldsEditorPro.ErrorText),
                                    "Error",
                                    cmp_CustomFieldsEditorPro.IsSaving,
                                    "Saving...",
                                    cmp_CustomFieldsEditorPro.IsLoading,
                                    "Loading...",
                                    "Ready"
                                )
                              Width: =Parent.Width
                  - btnCFDEPro_Refresh:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =cmp_CustomFieldsEditorPro.BorderColor
                        BorderThickness: =1
                        Color: =cmp_CustomFieldsEditorPro.AccentColor
                        DisplayMode: |-
                          =If(
                              cmp_CustomFieldsEditorPro.IsLoading || cmp_CustomFieldsEditorPro.IsSaving,
                              DisplayMode.Disabled,
                              DisplayMode.Edit
                          )
                        Fill: =cmp_CustomFieldsEditorPro.BackgroundColor
                        Font: =Font.'Segoe UI'
                        Height: =34
                        HoverFill: =cmp_CustomFieldsEditorPro.SurfaceAltColor
                        OnSelect: =cmp_CustomFieldsEditorPro.OnRefresh()
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =8
                        Text: ="Refresh"
                        Width: =82
                        X: =Parent.Width - 190
                        Y: =19
                  - btnCFDEPro_Close:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =cmp_CustomFieldsEditorPro.BorderColor
                        BorderThickness: =1
                        Color: =cmp_CustomFieldsEditorPro.TextColor
                        Fill: =cmp_CustomFieldsEditorPro.BackgroundColor
                        Font: =Font.'Segoe UI'
                        Height: =34
                        HoverFill: =cmp_CustomFieldsEditorPro.SurfaceAltColor
                        OnSelect: =cmp_CustomFieldsEditorPro.OnClose()
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =8
                        Text: ="Close"
                        Width: =76
                        X: =Parent.Width - 96
                        Y: =19
            - rectCFDEPro_HeaderDivider:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderStyle: =BorderStyle.None
                  Fill: =cmp_CustomFieldsEditorPro.BorderColor
                  Height: =1
                  Width: =Parent.Width
                  Y: =72
            - conCFDEPro_Body:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =cmp_CustomFieldsEditorPro.SurfaceAltColor
                  Height: =Parent.Height - 73
                  Width: =Parent.Width
                  Y: =73
                Children:
                  - conCFDEPro_Catalog:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =cmp_CustomFieldsEditorPro.BorderColor
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =cmp_CustomFieldsEditorPro.BackgroundColor
                        Height: =Parent.Height - 32
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Width: =Max(240, Min(292, Parent.Width * 0.25))
                        X: =16
                        Y: =16
                      Children:
                        - lblCFDEPro_CatalogTitle:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              Color: =cmp_CustomFieldsEditorPro.TextColor
                              Fill: =Color.Transparent
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =10
                              Text: ="Field catalog"
                              Width: =Parent.Width - 108
                              X: =14
                              Y: =12
                        - lblCFDEPro_CatalogCount:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              BorderColor: =RGBA(0,0,0,0)
                              Color: =cmp_CustomFieldsEditorPro.MutedTextColor
                              Fill: =Color.Transparent
                              Font: =Font.'Segoe UI'
                              Height: =20
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =7
                              Text: |-
                                =Text(CountRows(galCFDEPro_Definitions.AllItems)) &
                                " / " &
                                Text(cmp_CustomFieldsEditorPro.DefinitionCount)
                              Width: =76
                              X: =Parent.Width - 90
                              Y: =14
                        - btnCFDEPro_AddField:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =cmp_CustomFieldsEditorPro.AccentColor
                              BorderThickness: =1
                              Color: =Color.White
                              DisplayMode: |-
                                =If(
                                    !cmp_CustomFieldsEditorPro.CanManage ||
                                    cmp_CustomFieldsEditorPro.IsLoading ||
                                    cmp_CustomFieldsEditorPro.IsSaving,
                                    DisplayMode.Disabled,
                                    DisplayMode.Edit
                                )
                              Fill: =cmp_CustomFieldsEditorPro.AccentColor
                              Font: =Font.'Segoe UI'
                              Height: =34
                              HoverFill: =ColorFade(cmp_CustomFieldsEditorPro.AccentColor, -12%)
                              OnSelect: |-
                                =Set(varCFDEPro_EditMode, "ADD");
                                Set(varCFDEPro_SelectedFieldKey, "");
                                Set(varCFDEPro_Draft_FieldDefId, 0);
                                Set(varCFDEPro_Draft_FieldKey, "");
                                Set(varCFDEPro_Draft_Label, "");
                                Set(varCFDEPro_Draft_FieldType, "Text");
                                Set(varCFDEPro_Draft_HelpText, "");
                                Set(varCFDEPro_Draft_IsRequired, false);
                                Set(varCFDEPro_Draft_IsPinned, true);
                                Set(varCFDEPro_Draft_IsActive, true);
                                Set(varCFDEPro_Draft_SortOrder, 100);
                                Set(varCFDEPro_Draft_OptionsJson, "[]");
                                Set(varCFDEPro_Draft_OptionsText, "");
                                Set(varCFDEPro_OptionsError, "");
                                Set(varCFDEPro_Draft_IsFilterable, false);
                                Set(varCFDEPro_Draft_ShowInQuickFilters, false);
                                Set(varCFDEPro_Draft_FilterOrder, 100);
                                Set(varCFDEPro_Draft_FilterMode, "Equals");
                                Set(varCFDEPro_DraftDirty, false);
                                cmp_CustomFieldsEditorPro.OnAddRequested()
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =8
                              Text: ="+ Add field"
                              Width: =Parent.Width - 28
                              X: =14
                              Y: =46
                        - txtCFDEPro_Search:
                            Control: ModernTextInput@1.1.1
                            Properties:
                              Appearance: =Appearance.Outline
                              Height: =34
                              Placeholder: ="Search label or key"
                              Width: =Parent.Width - 28
                              X: =14
                              Y: =92
                        - tglCFDEPro_ShowInactive:
                            Control: Classic/Toggle@2.1.0
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =cmp_CustomFieldsEditorPro.TextColor
                              FalseText: ="Active only"
                              Font: =Font.'Segoe UI'
                              Height: =24
                              TrueText: ="Show inactive"
                              Width: =Parent.Width - 28
                              X: =14
                              Y: =132
                        - rectCFDEPro_CatalogDivider:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Fill: =cmp_CustomFieldsEditorPro.BorderColor
                              Height: =1
                              Width: =Parent.Width - 28
                              X: =14
                              Y: =174
                        - galCFDEPro_Definitions:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              Fill: =Color.Transparent
                              Height: =Parent.Height - 190
                              Items: |-
                                =With(
                                    {
                                        src:
                                            If(
                                                tglCFDEPro_ShowInactive.Value,
                                                cmp_CustomFieldsEditorPro.Definitions,
                                                Filter(
                                                    cmp_CustomFieldsEditorPro.Definitions,
                                                    Coalesce(IsActive, false)
                                                )
                                            ),
                                        searchText:
                                            Lower(
                                                Trim(
                                                    Coalesce(txtCFDEPro_Search.Text, "")
                                                )
                                            )
                                    },
                                    SortByColumns(
                                        If(
                                            IsBlank(searchText),
                                            src,
                                            Filter(
                                                src,
                                                searchText in Lower(Coalesce(Label, "")) ||
                                                searchText in Lower(Coalesce(FieldKey, ""))
                                            )
                                        ),
                                        "SortOrder",
                                        SortOrder.Ascending
                                    )
                                )
                              TemplateFill: =Color.Transparent
                              TemplateSize: =84
                              Visible: |-
                                =!cmp_CustomFieldsEditorPro.IsLoading &&
                                IsBlank(cmp_CustomFieldsEditorPro.ErrorText)
                              Width: =Parent.Width
                              Y: =182
                            Children:
                              - conCFDEPro_DefinitionRow:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderColor: |-
                                      =If(
                                          ThisItem.FieldKey = varCFDEPro_SelectedFieldKey,
                                          cmp_CustomFieldsEditorPro.AccentColor,
                                          cmp_CustomFieldsEditorPro.BorderColor
                                      )
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: |-
                                      =If(
                                          ThisItem.FieldKey = varCFDEPro_SelectedFieldKey,
                                          ColorFade(cmp_CustomFieldsEditorPro.AccentColor, 94%),
                                          cmp_CustomFieldsEditorPro.BackgroundColor
                                      )
                                    Height: =Parent.TemplateHeight - 6
                                    RadiusBottomLeft: =10
                                    RadiusBottomRight: =10
                                    RadiusTopLeft: =10
                                    RadiusTopRight: =10
                                    Width: =Parent.TemplateWidth - 10
                                    X: =5
                                    Y: =1
                                  Children:
                                    - btnCFDEPro_RowSelect:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderThickness: =0
                                          Color: =Color.Transparent
                                          Fill: =Color.Transparent
                                          Height: =Parent.Height
                                          HoverFill: =ColorFade(cmp_CustomFieldsEditorPro.AccentColor, 96%)
                                          OnSelect: |-
                                            =Set(varCFDEPro_SelectedFieldKey, ThisItem.FieldKey);
                                            Set(varCFDEPro_EditMode, "EDIT");
                                            Set(varCFDEPro_Draft_FieldDefId, Coalesce(ThisItem.FieldDefId, 0));
                                            Set(varCFDEPro_Draft_FieldKey, Coalesce(ThisItem.FieldKey, ""));
                                            Set(varCFDEPro_Draft_Label, Coalesce(ThisItem.Label, ""));
                                            Set(varCFDEPro_Draft_FieldType, Coalesce(ThisItem.FieldType, "Text"));
                                            Set(varCFDEPro_Draft_HelpText, Coalesce(ThisItem.HelpText, ""));
                                            Set(varCFDEPro_Draft_IsRequired, Coalesce(ThisItem.IsRequired, false));
                                            Set(varCFDEPro_Draft_IsPinned, Coalesce(ThisItem.IsPinned, false));
                                            Set(varCFDEPro_Draft_IsActive, Coalesce(ThisItem.IsActive, true));
                                            Set(varCFDEPro_Draft_SortOrder, Coalesce(ThisItem.SortOrder, 100));
                                            Set(
                                                varCFDEPro_Draft_OptionsJson,
                                                If(
                                                    ThisItem.FieldType = "Choice" || ThisItem.FieldType = "MultiChoice",
                                                    Coalesce(ThisItem.OptionsJson, "[]"),
                                                    "[]"
                                                )
                                            );
                                            Set(
                                                varCFDEPro_Draft_OptionsText,
                                                If(
                                                    ThisItem.FieldType = "Choice" || ThisItem.FieldType = "MultiChoice",
                                                    IfError(
                                                        Concat(
                                                            Table(
                                                                ParseJSON(
                                                                    Coalesce(ThisItem.OptionsJson, "[]")
                                                                )
                                                            ),
                                                            Text(ThisRecord.Value),
                                                            Char(10)
                                                        ),
                                                        ""
                                                    ),
                                                    ""
                                                )
                                            );
                                            Set(varCFDEPro_OptionsError, "");
                                            Set(varCFDEPro_Draft_IsFilterable, Coalesce(ThisItem.IsFilterable, false));
                                            Set(varCFDEPro_Draft_ShowInQuickFilters, Coalesce(ThisItem.ShowInQuickFilters, false));
                                            Set(varCFDEPro_Draft_FilterOrder, Coalesce(ThisItem.FilterOrder, 100));
                                            Set(varCFDEPro_Draft_FilterMode, Coalesce(ThisItem.FilterMode, "Equals"));
                                            Set(varCFDEPro_DraftDirty, false)
                                          PressedFill: =ColorFade(cmp_CustomFieldsEditorPro.AccentColor, 92%)
                                          Text: =""
                                          Width: =Parent.Width
                                    - lblCFDEPro_DefLabel:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0,0,0,0)
                                          Color: =cmp_CustomFieldsEditorPro.TextColor
                                          Fill: =Color.Transparent
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =20
                                          OnSelect: =Select(btnCFDEPro_RowSelect)
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =8
                                          Text: =Coalesce(ThisItem.Label, ThisItem.FieldKey)
                                          Width: =Parent.Width - 72
                                          Wrap: =false
                                          X: =10
                                          Y: =7
                                    - lblCFDEPro_DefKey:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0,0,0,0)
                                          Color: =cmp_CustomFieldsEditorPro.MutedTextColor
                                          Fill: =Color.Transparent
                                          Font: =Font.'Segoe UI'
                                          Height: =17
                                          OnSelect: =Select(btnCFDEPro_RowSelect)
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =6
                                          Text: =Coalesce(ThisItem.FieldKey, "")
                                          Width: =Parent.Width - 72
                                          Wrap: =false
                                          X: =10
                                          Y: =28
                                    - lblCFDEPro_DefMeta:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0,0,0,0)
                                          Color: =cmp_CustomFieldsEditorPro.MutedTextColor
                                          Fill: =Color.Transparent
                                          Font: =Font.'Segoe UI'
                                          Height: =18
                                          OnSelect: =Select(btnCFDEPro_RowSelect)
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =6
                                          Text: |-
                                            =Coalesce(ThisItem.FieldType, "Text") &
                                            If(ThisItem.IsRequired, "  ·  Required", "") &
                                            If(ThisItem.IsPinned, "  ·  Pinned", "")
                                          Width: =Parent.Width - 72
                                          Wrap: =false
                                          X: =10
                                          Y: =48
                                    - conCFDEPro_DefStatus:
                                        Control: GroupContainer@1.5.0
                                        Variant: ManualLayout
                                        Properties:
                                          BorderColor: |-
                                            =If(
                                                ThisItem.IsActive,
                                                ColorValue("#BBF7D0"),
                                                ColorValue("#E2E8F0")
                                            )
                                          BorderThickness: =1
                                          DropShadow: =DropShadow.None
                                          Fill: |-
                                            =If(
                                                ThisItem.IsActive,
                                                ColorValue("#F0FDF4"),
                                                ColorValue("#F8FAFC")
                                            )
                                          Height: =20
                                          RadiusBottomLeft: =10
                                          RadiusBottomRight: =10
                                          RadiusTopLeft: =10
                                          RadiusTopRight: =10
                                          Width: =54
                                          X: =Parent.Width - 64
                                          Y: =9
                                        Children:
                                          - lblCFDEPro_DefStatus:
                                              Control: Label@2.5.1
                                              Properties:
                                                Align: =Align.Center
                                                BorderColor: =RGBA(0,0,0,0)
                                                Color: |-
                                                  =If(
                                                      ThisItem.IsActive,
                                                      ColorValue("#166534"),
                                                      cmp_CustomFieldsEditorPro.MutedTextColor
                                                  )
                                                Fill: =Color.Transparent
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =Parent.Height
                                                OnSelect: |-
                                                  =

                                                  Select(btnCFDEPro_RowSelect)
                                                PaddingBottom: =0
                                                PaddingLeft: =2
                                                PaddingRight: =2
                                                PaddingTop: =0
                                                Size: =5
                                                Text: =If(ThisItem.IsActive, "Active", "Inactive")
                                                Width: =Parent.Width
                        - conCFDEPro_CatalogEmpty:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =cmp_CustomFieldsEditorPro.BackgroundColor
                              Height: =Parent.Height - 190
                              Visible: |-
                                =!cmp_CustomFieldsEditorPro.IsLoading &&
                                IsBlank(cmp_CustomFieldsEditorPro.ErrorText) &&
                                CountRows(galCFDEPro_Definitions.AllItems) = 0
                              Width: =Parent.Width - 2
                              X: =1
                              Y: =182
                            Children:
                              - lblCFDEPro_CatalogEmptyTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0,0,0,0)
                                    Color: =cmp_CustomFieldsEditorPro.TextColor
                                    Fill: =Color.Transparent
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    PaddingBottom: =0
